exploits:
  - description: Linux kernel contains a time-of-check time-of-use (TOCTOU) race condition vulnerability
      that has a high impact on confidentiality, integrity, and availability.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-09-25'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. Please check with specific vendors for information
      on patching status. For more information, please see: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git/commit/?id=2c72fe18cc5f9f1750f5bc148cf1c94c29e106ff
      ; https://source.android.com/docs/security/bulletin/2025-09-01 ; https://nvd.nist.gov/vuln/detail/CVE-2025-38352'
