exploits:
  - description: MyBulletinBoard (MyBB) 1.1.5 - 'CLIENT-IP' SQL Injection
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2006-07-15'
    exploit_type: webapps
    platform: php
    source_date_updated: !!timestamp '2016-11-09'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2011-5035
  - description: |
      This module exploits a vulnerability due to the fact that
                AtomicReferenceArray uses the Unsafe class to store a reference in an
                array directly, which may violate type safety if not used properly.
                This allows a way to escape the JRE sandbox, and load additional classes
                in order to perform malicious operations.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-02-14'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_atomicreferencearray.rb
    record_id: /modules/exploits/multi/browser/java_atomicreferencearray.rb
  - description: |
      This module exploits a flaw in the Web Start component of the Sun Java
                Runtime Environment. The arguments passed to Java Web Start are not properly
                validated, allowing injection of arbitrary arguments to the JVM.

                By utilizing the lesser known -J option, an attacker can take advantage of
                the -XXaltjvm option, as discussed previously by Ruben Santamarta. This method
                allows an attacker to execute arbitrary code in the context of an unsuspecting
                browser user.

                In order for this module to work, it must be run as root on a server that
                does not serve SMB. Additionally, the target host must have the WebClient
                service (WebDAV Mini-Redirector) enabled.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-02-14'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/java_ws_vmargs.rb
    record_id: /modules/exploits/windows/browser/java_ws_vmargs.rb
