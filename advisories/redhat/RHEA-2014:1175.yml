summary: "Red Hat Satellite 6.0 is now available.\n\nRed Hat Satellite is a system management\
  \ solution that allows organizations to configure and maintain their systems without necessity\
  \ to provide public Internet access to their servers or other client systems. It also performs\
  \ provisioning and configuration management of predefined standard operating environments.\n\
  \nRed Hat Satellite 6 integrates several other projects that provide particular functionalities\
  \ in Provisioning and Configuration Management, and Content and Subscription Management. The\
  \ following projects are the most fundamental: Katello, Foreman, Candlepin, Pulp, and Puppet.\
  \ \n\nKatello is a subscription and repository management application that enables users to\
  \ subscribe to Red Hat repositories and download the content. Foreman is an open source application\
  \ responsible for provisioning, configuration and life cycle management of the systems. Candlepin\
  \ is a software collection used by Katello to handle subscription management. Pulp is a service\
  \ used by Katello to handle repository and content management. And Puppet is an automation\
  \ software used to handle provisioning and configuration tasks.\n  \nThis update introduces\
  \ Red Hat Satellite 6.0. In this release, Satellite focuses on improving in all main areas\
  \ of its scope, namely:\n\n* Content Management: Satellite allows users to mirror the content\
  \ and configuration of their systems. It also enables them to determine how the downloaded\
  \ content should be distributed to particular machines.\n\n* Configuration Management: Satellite\
  \ can be used to define configuration policies for machines and ensure compliance to those\
  \ policies.\n\n* Provisioning: Satellite allows users to use system definitions to build various\
  \ configurations on bare metal, virt fabrics, and in the cloud environment.\n\n* Subscription\
  \ Management: With Satellite, users can track their subscriptions from the order to the endpoint\
  \ machine.\n\nFor the full list of new features see the Release notes on the following site:\n\
  \nhttps://access.redhat.com/site/documentation/\n\nNote: Red Hat Satellite 6.0 is available\
  \ for installation on Red Hat Enterprise Linux Server 6 and Red Hat Enterprise Linux Server\
  \ 7. For full details, including supported architecture combinations, refer to the Red Hat\
  \ Satellite 6 Installation Guide on the following site:\n\nhttps://access.redhat.com/documentation/en-US/Red_Hat_Satellite/\n\
  \nAll users of Red Hat Satellite are advised to install this newly released version."
