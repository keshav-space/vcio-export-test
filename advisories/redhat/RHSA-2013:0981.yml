exploits:
  - description: |
      This module exploits a vulnerability found on Firefox 17.0.6, specifically a use
                after free of a DocumentViewerImpl object, triggered via a specially crafted web
                page using onreadystatechange events and the window.stop() API, as exploited in the
                wild on 2013 August to target Tor Browser users.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-06-25'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/mozilla_firefox_onreadystatechange.rb
    record_id: /modules/exploits/windows/browser/mozilla_firefox_onreadystatechange.rb
  - description: Mozilla Firefox and Thunderbird do not properly handle onreadystatechange events
      in conjunction with page reloading, which allows remote attackers to cause a denial-of-service
      (DoS) or possibly execute malicious code via a crafted web site.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-04-18'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2013-1690
