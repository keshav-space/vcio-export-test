  - description: Moxilla Firefox allows remote attackers to bypass the Same Origin Policy to
      read arbitrary files or gain privileges.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-06-15'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2015-4495
