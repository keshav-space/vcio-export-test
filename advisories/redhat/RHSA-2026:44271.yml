summary: "An update for dogtag-pki is now available for Red Hat Enterprise Linux 10.0 Extended\
  \ Update Support.\n\nRed Hat Product Security has rated this update as having a security impact\
  \ of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nIdM PKI is an enterprise software system designed to manage enterprise Public\
  \ Key Infrastructure deployments.  IdM PKI consists of the following components: \n  * Certificate\
  \ Authority (CA)\n  * Key Recovery Authority (KRA)\n  * Online Certificate Status Protocol\
  \ (OCSP) Manager\n  * Token Key Service (TKS)\n  * Token Processing Service (TPS)\n  * Automatic\
  \ Certificate Management Environment (ACME) Responder\n  * Enrollment over Secure Transport\
  \ (EST) Responder\n\nSecurity Fix(es):\n\n* jackson-databind: Jackson-databind: Security bypass\
  \ allows arbitrary code execution (CVE-2026-54513)\n\n* jackson-databind: jackson-databind:\
  \ Arbitrary code execution via PolymorphicTypeValidator bypass (CVE-2026-54512)\n\nFor more\
  \ details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
