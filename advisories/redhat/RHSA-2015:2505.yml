exploits:
  - description: ABRT - sosreport Privilege Escalation (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2019-09-25'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2019-09-25'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/master/modules/exploits/linux/local/abrt_sosreport_priv_esc.rb
    record_id: CVE-2015-5287
  - description: |
      This module attempts to gain root privileges on RHEL systems with
                a vulnerable version of Automatic Bug Reporting Tool (ABRT) configured
                as the crash handler.

                `sosreport` uses an insecure temporary directory, allowing local users
                to write to arbitrary files (CVE-2015-5287). This module uses a symlink
                attack on `/var/tmp/abrt/cc-*$pid/` to overwrite the `modprobe` path
                in `/proc/sys/kernel/modprobe`, resulting in root privileges.

                Waiting for `sosreport` could take a few minutes.

                This module has been tested successfully on:

                abrt 2.1.11-12.el7 on RHEL 7.0 x86_64; and
                abrt 2.1.11-19.el7 on RHEL 7.1 x86_64.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2015-11-23'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/abrt_sosreport_priv_esc.rb
    record_id: /modules/exploits/linux/local/abrt_sosreport_priv_esc.rb
  - description: abrt (Centos 7.1 / Fedora 22) - Local Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2015-12-01'
    exploit_type: local
    platform: multiple
    source_date_updated: !!timestamp '2018-11-17'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2015-5273
  - description: Red Hat Automatic Bug Reporting Tool (ABRT) contains a privilege escalation
      vulnerability that could allow local users with certain permissions to gain privileges
      via a symlink attack on a file with a predictable name. The impacted product(s) could
      be end-of-life (EoL) and/or end-of-service (EoS). Users are advised to discontinue use
      and/or transition to a supported version.
    required_action: Apply mitigations in accordance with vendor instructions, ensuring compliance
      with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see URL in Notes) guidance
      and CISA’s “Forensics Triage Requirements” (see URL in Notes). Follow applicable BOD 26-04
      guidance for cloud services or discontinue use of the product if mitigations are unavailable.
      Stakeholders are responsible for evaluating each asset's internet exposure and ensuring
      adherence to BOD 26-04 patching guidelines.
    due_date: !!timestamp '2026-09-09'
    notes: 'This vulnerability affects an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://github.com/abrt/abrt/commit/3c1b60cfa62d39e5fff5a53a5bc53dae189e740e
      ; BOD 26-04: https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
