exploits:
  - description: |
      This module exploits CVE-2026-46300, a Linux kernel local privilege
                escalation vulnerability introduced in version 4.10. The flaw resides in the kernel's IPsec
                ESP-in-TCP handling: when an ESP-encapsulated TCP segment containing a
                shared fragment (SKBFL_SHARED_FRAG) is received and decrypted, the AES-GCM keystream
                is applied to page cache pages of the target file without enforcing
                write permissions. This allows an unprivileged attacker to overwrite
                arbitrary bytes of a read-only file backed by the page cache. Upstream fix is ported
                independently by different vendors, so there's release version from which each kernel is
                not vulnerable anymore.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-service-down
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2026-05-14'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/cve_2026_46300_fragnesia.rb
    record_id: /modules/exploits/linux/local/cve_2026_46300_fragnesia.rb
  - description: |
      This module exploits a race condition in the Linux kernel
                do_exit() teardown path affecting __ptrace_may_access().

                During process termination, privileged file descriptors may
                remain accessible through pidfd_getfd() after task->mm becomes
                NULL, allowing sensitive file disclosure from privileged SUID
                binaries such as chage.

                This module targets chage to disclose /etc/shadow.

                This module performs information disclosure only and does not
                create a new session.
    required_action:
    due_date:
    notes: |
      AKA:
