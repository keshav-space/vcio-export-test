summary: "An update for skopeo is now available for Red Hat Enterprise Linux 9.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Moderate. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nThe skopeo command\
  \ lets you inspect images from container image registries, get images and image layers, and\
  \ use signatures to create and verify files. \n\nSecurity Fix(es):\n\n* golang: crypto/tls:\
  \ slow verification of certificate chains containing large RSA keys (CVE-2023-29409)\n\n*\
  \ golang: html/template: improper handling of HTML-like comments within script contexts (CVE-2023-39318)\n\
  \n* golang: html/template: improper handling of special tags within script contexts (CVE-2023-39319)\n\
  \n* golang: crypto/tls: panic when processing post-handshake message on QUIC connections (CVE-2023-39321)\n\
  \n* golang: crypto/tls: lack of a limit on buffered post-handshake (CVE-2023-39322)\n\nFor\
  \ more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
