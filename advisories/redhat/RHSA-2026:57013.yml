summary: |
  Red Hat OpenShift Data Foundation 4.20.17 security, enhancement & bug fix update

  Red Hat OpenShift Data Foundation 4.20.17 security, enhancement & bug fix update

  FIXED BUGS:
  ==========
  DFBUGS-8962: RHODF 4.20.17 release
  DFBUGS-8003: [GSS] Rook Ceph metrics are not being scraped, and the rook-ceph-mgr-external service is inaccessible from within the cluster.
  DFBUGS-7951: [upgrade from 4.19 to 4.20] Clusters with Convergence changes always have nfs driver deployed
  DFBUGS-7393: [Backport to odf-4.20.z] [MCG] noobaa-core pod restart overwrites admin account default_resource to arbitrary backingstore
  DFBUGS-7380: [Backport to odf-4.20.z] [GSS] PDB is created for rgw even though the gateway instance count is 1
  DFBUGS-7318: [Backport to 4.20] - noobaa-core-0 intermittent CrashLoopBackOff due to OOMKilled during object delete workload - map_deleter unbounded memory consumption
  DFBUGS-7004: [Backport to odf-4.20.z] [GSS][Disconnected env] ODF is upgraded itself from ODF v4.20.2 to ODF v4.20.7 without Manual Approval when upgrdaing OCP v4.20.5 to OCP v4.20.16
  DFBUGS-6997: [Backport to odf-4.20.z] [GSS][ODF] Noobaa DB_CLEANER not honoring set value
  DFBUGS-6814: release-4.20 ODF must-gather missing CR storageclusterpeer.yaml
  DFBUGS-5767: [4.20.z] Landing page after installation of operator is not correct
