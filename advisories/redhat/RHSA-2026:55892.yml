advisory_id: RHSA-2026:55892
datasource_id: redhat/RHSA-2026:55892
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2026/rhsa-2026_55892.json
aliases:
  - CVE-2026-44690
  - CVE-2026-55973
summary: "An update for unbound is now available for Red Hat Enterprise Linux 10.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  The unbound packages provide a validating, recursive, and caching DNS or DNSSEC resolver.\
  \ \n\nSecurity Fix(es):\n\n* unbound: Unbound: Cache poisoning via insufficient RRSIG.Labels\
  \ validation and premature cache writes (CVE-2026-44690)\n\n* unbound: Unbound: Denial of\
  \ Service via malformed EDNS Report-Channel option (CVE-2026-55973)\n\nFor more details about\
  \ the security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
