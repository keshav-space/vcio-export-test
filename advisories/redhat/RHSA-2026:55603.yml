summary: "An update for the nodejs:24 module is now available for Red Hat Enterprise Linux 9.\n\
  \nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nNode.js is a software development platform for building fast and scalable network applications\
  \ in the JavaScript programming language. \n\nSecurity Fix(es):\n\n* sqlite: SQLite: Arbitrary\
  \ code execution via crafted FTS5 full-text search data (CVE-2026-11822)\n\n* sqlite: SQLite:\
  \ Arbitrary code execution and crash via heap-based buffer overflow in FTS5 (CVE-2026-11824)\n\
  \n* brace-expansion: Brace-expansion: Denial of Service via memory exhaustion in expand()\
  \ function (CVE-2026-14257)\n\n* ip-address: ip-address: Server-Side Request Forgery via IPv4-mapped/NAT64\
  \ IPv6 address misclassification (CVE-2026-54272)\n\n* brace-expansion: brace-expansion: Denial\
  \ of Service via unbounded intermediate arrays (CVE-2026-69152)\n\n* ip-address: ip-address:\
  \ Inconsistent IP address parsing leads to Server-Side Request Forgery (SSRF) and trust-boundary\
  \ bypass (CVE-2026-69192)\n\nFor more details about the security issue(s), including the impact,\
  \ a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed\
  \ in the References section."
