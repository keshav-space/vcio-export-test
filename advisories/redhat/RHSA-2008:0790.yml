  - CVE-2008-3113
  - CVE-2008-3114
summary: "Updated java-1.5.0-ibm packages that fix several security issues are now\navailable\
  \ for Red Hat Enterprise Linux 4 Extras and 5 Supplementary.\n\nThis update has been rated\
  \ as having critical security impact by the Red\nHat Security Response Team.\n\nThe IBM 1.5.0\
  \ Java release includes the IBM Java 2 Runtime Environment and\nthe IBM Java 2 Software Development\
  \ Kit.\n\nMultiple vulnerabilities with unsigned applets were reported. A remote\nattacker\
  \ could misuse an unsigned applet to connect to localhost services\nrunning on the host running\
  \ the applet. (CVE-2008-3104) \n\nA vulnerability in the XML processing API was found. A remote\
  \ attacker who\ncaused malicious XML to be processed by an untrusted applet or application\n\
  was able to elevate permissions to access URLs on a remote host.\n(CVE-2008-3106)\n\nA buffer\
  \ overflow vulnerability was found in the font processing code. This\nallowed remote attackers\
  \ to extend the permissions of an untrusted applet\nor application, allowing it to read and/or\
  \ write local files, as well as to\nexecute local applications accessible to the user running\
  \ the untrusted\napplication. (CVE-2008-3108)\n\nSeveral buffer overflow vulnerabilities in\
  \ Java Web Start were reported.\nThese vulnerabilities allowed an untrusted Java Web Start\
  \ application to\nelevate its privileges, allowing it to read and/or write local files, as\n\
  well as to execute local applications accessible to the user running the\nuntrusted application.\
  \ (CVE-2008-3111)\n\nTwo file processing vulnerabilities in Java Web Start were found. A remote\n\
  attacker, by means of an untrusted Java Web Start application, was able to\ncreate or delete\
  \ arbitrary files with the permissions of the user running\nthe untrusted application. (CVE-2008-3112,\
  \ CVE-2008-3113)\n\nA vulnerability in Java Web Start when processing untrusted applications\n\
  was reported. An attacker was able to acquire sensitive information, such\nas the cache location.\
  \ (CVE-2008-3114)\n\nAll users of java-1.5.0-ibm are advised to upgrade to these updated\n\
  packages, that contain the IBM 1.5.0 SR8 Java release, which resolves\nthese issues."
