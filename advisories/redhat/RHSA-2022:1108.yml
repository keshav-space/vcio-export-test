summary: |
  An update is now available for Red Hat Process Automation Manager.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Process Automation Manager is an open source business process management suite that combines process management and decision service management and enables business and IT users to create, manage, validate, and deploy process applications and decision services.

  This release of Red Hat Process Automation Manager 7.12.1 serves as an update to Red Hat Process Automation Manager 7.12.0, and includes bug fixes and enhancements, which are documented in the Release Notes document linked to in the References.

  Security Fix(es):

  * commons-io: apache-commons-io: Limited path traversal in Apache Commons IO 2.2 to 2.6 (CVE-2021-29425)

  * jdom: XXE allows attackers to cause a DoS via a crafted HTTP request (CVE-2021-33813)

  * logback-classic: logback: remote code execution through JNDI call from within its configuration file (CVE-2021-42550)

  * netty: Information disclosure via the local system temporary directory (CVE-2021-21290)

  * springframework: malicious input leads to insertion of additional log entries (CVE-2021-22096)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
