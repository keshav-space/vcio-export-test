summary: "An update for libpq is now available for Red Hat Enterprise Linux 10.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Important. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nThe libpq package\
  \ provides the PostgreSQL client library, which allows client programs to connect to PostgreSQL\
  \ servers. \n\nSecurity Fix(es):\n\n* postgresql: PostgreSQL libpq: Buffer overflow allows\
  \ server superuser to overwrite client stack memory (CVE-2026-6477)\n\nFor more details about\
  \ the security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
