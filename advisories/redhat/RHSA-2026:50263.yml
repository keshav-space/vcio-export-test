summary: "A new release is now available for Red Hat Satellite 6.18 for RHEL 9.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact\nof Important. A Common Vulnerability\
  \ Scoring System (CVSS) base score,\nwhich gives a detailed severity rating, is available\
  \ for each vulnerability\nfrom the CVE link(s) in the References section.\n\nRed Hat Satellite\
  \ is a system management solution that allows organizations\nto configure and maintain their\
  \ systems without the necessity to provide\npublic Internet access to their servers or other\
  \ client systems. It\nperforms provisioning and configuration management of predefined standard\n\
  operating environments.\n\nSecurity Fix(es):\n\n* puppetserver: HTTP request smuggling via\
  \ chunked extension quoted-string parsing (CVE-2026-2332) \n\n* python-pyjwt: PyJWT: Authentication\
  \ bypass due to forged JSON Web Tokens (CVE-2026-48526)\n\n* rubygem-katello: missing repository\
  \ authorization in content_uploads exposes cross-product content existence (CVE-2026-12515)\
  \ \n\n* rubygem-faraday-rack: Faraday: Denial of Service via crafted nested query strings\
  \ (CVE-2026-54297)\n\n* python3.12-pillow: Pillow: Denial of Service via crafted BDF font\
  \ file (CVE-2026-55379) \n\n* python3.12-pillow: Pillow: Denial of Service via crafted GD\
  \ 2.x image file (CVE-2026-55380) \n\n* python3.12-pillow: Pillow: Denial of Service via crafted\
  \ PCF font data (CVE-2026-54059)\n\n* python3.12-pillow: Pillow: Denial of Service via excessive\
  \ memory allocation when processing font files (CVE-2026-54060) \n\n* rubygem-nokogiri: Nokogiri:\
  \ Denial of Service or Information Disclosure via invalid encoding handling (CVE-2026-57236)\n\
  \n* puppet-agent: Out-of-bounds read & write in RFC 3211 KEK Unwrap (CVE-2025-9230)\n\nBug\
  \ Fix(es):\n\n* Backport OpenVox Server and Agent Packaging to Satellite and Capsule 6.18\
  \ (SAT-44866) \n\n* Update of scap-security-guide-satellite package sources (SAT-48160) \n\
  \n* API endpoint GET /api/host_packages/installed_packages in apidoc is wrong (SAT-48161)\
  \ \n\n* Unable to save bookmark report under  Hosts → All Hosts → Compliance → Reports (SAT-48162)\n\
  \n* 'Katello::Errors::Pulp3Error: nextval: reached maximum value of sequence \"container_blobmanifest_id_seq\"\
  ' during container image sync (SAT-48302)"
