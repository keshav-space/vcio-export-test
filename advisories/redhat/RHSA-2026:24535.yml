summary: |
  An update for ibu components is available for Red Hat OpenShift Container Platform 4.20.

  Red Hat OpenShift Container Platform is Red Hat's cloud computing Kubernetes application platform solution designed for on-premise or private cloud deployments.
  This advisory contains the extra ibu container images for Red Hat OpenShift Container Platform 4.20. All OpenShift Container Platform users are advised to upgrade to these updated packages and images.
