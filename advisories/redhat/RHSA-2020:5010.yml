advisory_id: RHSA-2020:5010
datasource_id: redhat/RHSA-2020:5010
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2020/rhsa-2020_5010.json
aliases:
  - CVE-2019-20907
  - CVE-2020-14422
summary: |
  An update for python3 is now available for Red Hat Enterprise Linux 7.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Python is an accessible, high-level, dynamically typed, interpreted programming language, designed with an emphasis on code readability. It includes an extensive standard library, and has a vast ecosystem of third-party libraries.

  Security Fix(es):

  * python: infinite loop in the tarfile module via crafted TAR archive (CVE-2019-20907)

  * python: DoS via inefficiency in IPv{4,6}Interface classes (CVE-2020-14422)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
