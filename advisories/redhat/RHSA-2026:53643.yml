summary: |
  An update is now available for Red Hat build of Quarkus.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability. For more information, see the CVE links in the References section.

  This release of Red Hat build of Quarkus 3.27.5 includes the following CVE fixes:

  * scram-common: SCRAM Libraries: Authentication downgrade via TLS man-in-the-middle attack [quarkus-3.27] (CVE-2026-53712)

  * jansi: Jansi: Heap buffer overflow leads to Denial of Service [quarkus-3.27] (CVE-2026-8484)

  * postgresql: pgjdbc: Man-in-the-middle protection bypass via SCRAM-SHA-256-PLUS downgrade [quarkus-3.27] (CVE-2026-54291)

  * sshd-core: Apache MINA SSHD: Unauthorized command execution due to
  improper certificate validation [quarkus-3.27] (CVE-2026-56624)

  For more information, see the release notes page listed in the References section.
