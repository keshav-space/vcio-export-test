exploits:
  - description: Java Applet - Reflection Type Confusion Remote Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2013-04-23'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2013-04-23'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2013-2423
  - description: |
      This module abuses the java.sql.DriverManager class where the toString() method
                is called over user supplied classes from a doPrivileged block. The vulnerability
                affects Java version 7u17 and earlier. This exploit bypasses click-to-play on Internet Explorer
                and throws a specially crafted JNLP file. This bypass is applicable mainly to IE, where Java
                Web Start can be launched automatically through the ActiveX control. Otherwise, the
                applet is launched without click-to-play bypass.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-01-10'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_jre17_driver_manager.rb
    record_id: /modules/exploits/multi/browser/java_jre17_driver_manager.rb
  - description: |
      This module abuses Java Reflection to generate a Type Confusion, due to a weak
                access control when setting final fields on static classes, and run code outside of
                the Java Sandbox. The vulnerability affects Java version 7u17 and earlier. This
                exploit bypasses click-to-play throw a specially crafted JNLP file. This bypass is
                applied mainly to IE, when Java Web Start can be launched automatically throw the
                ActiveX control. Otherwise the applet is launched without click-to-play bypass.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
