exploits:
  - description: Mozilla Firefox - XMLSerializer Use-After-Free (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2013-08-29'
    exploit_type: remote
    platform: windows
    source_date_updated: !!timestamp '2013-08-29'
    data_source: Exploit-DB
    source_url: http://www.zerodayinitiative.com/advisories/ZDI-13-006/
    record_id: CVE-2013-0753
  - description: |
      This exploit gains remote code execution on Firefox 17 and 17.0.1, provided
                the user has installed Flash. No memory corruption is used.

                First, a Flash object is cloned into the anonymous content of the SVG
                "use" element in the <body> (CVE-2013-0758). From there, the Flash object
                can navigate a child frame to a URL in the chrome:// scheme.

                Then a separate exploit (CVE-2013-0757) is used to bypass the security wrapper
                around the child frame's window reference and inject code into the chrome://
                context. Once we have injection into the chrome execution context, we can write
                the payload to disk, chmod it (if posix), and then execute.

                Note: Flash is used here to trigger the exploit but any Firefox plugin
                with script access should be able to trigger it.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-01-08'
    exploit_type:
    platform: Firefox,Java,Linux,OSX,Solaris,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/firefox_svg_plugin.rb
    record_id: /modules/exploits/multi/browser/firefox_svg_plugin.rb
  - description: |
      This module exploits a vulnerability found on Firefox 17.0 (< 17.0.2), specifically
                a use-after-free of an Element object, when using the serializeToStream method
                with a specially crafted OutputStream defining its own write function. This module
                has been tested successfully with Firefox 17.0.1 ESR, 17.0.1 and 17.0 on Windows XP
                SP3.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-01-08'
    exploit_type:
    platform: Windows
    source_date_updated:
