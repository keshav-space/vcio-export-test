summary: "An updated cpio package that fixes a umask bug and supports large files\n(>2GB) is\
  \ now available.\n\nThis update has been rated as having low security impact by the Red Hat\n\
  Security Response Team\n\nGNU cpio copies files into or out of a cpio or tar archive. \n\n\
  It was discovered that cpio uses a 0 umask when creating files using the -O\n(archive) option.\
  \ This creates output files with mode 0666 (all can read\nand write) regardless of the user's\
  \ umask setting. The Common\nVulnerabilities and Exposures project (cve.mitre.org) has assigned\
  \ the name\nCAN-1999-1572 to this issue.\n\nAll users of cpio should upgrade to this updated\
  \ package, which resolves\nthis issue, and adds support for large files (> 2GB)."
