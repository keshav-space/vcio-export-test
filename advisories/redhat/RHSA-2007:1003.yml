summary: "Updated OpenSSL packages that correct a security issue and various bugs are\nnow available\
  \ for Red Hat Enterprise Linux 4.\n\nThis update has been rated as having moderate security\
  \ impact by the Red\nHat Security Response Team.\n\nOpenSSL is a toolkit that implements the\
  \ Secure Sockets Layer (SSL v2/v3)\nand Transport Layer Security (TLS v1) protocols, and is\
  \ also a\nfull-strength general-purpose cryptography library.\n\nA flaw was found in the SSL_get_shared_ciphers()\
  \ utility function. An\nattacker could send a list of ciphers to an application that used\
  \ this\nfunction and overrun a buffer by a single byte (CVE-2007-5135). Few\napplications\
  \ make use of this vulnerable function and generally it is used\nonly when applications are\
  \ compiled for debugging. \n\nA number of possible side-channel attacks were discovered affecting\n\
  OpenSSL. A local attacker could possibly obtain RSA private keys being used\non a system.\
  \ In practice these attacks would be difficult to perform\noutside of a lab environment. This\
  \ update contains backported patches to\nmitigate these issues. (CVE-2007-3108)\n\nAs well,\
  \ these updated packages fix the following bugs:\n\n* multithreaded applications could cause\
  \ a segmentation fault or deadlock\nwhen calling the random number generator initialization\
  \ (RAND_poll) in the\nOpenSSL library, for a large number of threads simultaneously.\n\n*\
  \ in certain circumstances, if an application using the OpenSSL library\nreused the SSL session\
  \ cache for multiple purposes (with various parameters\nof the SSL protocol), the session\
  \ parameters could be mismatched.\n\n* a segmentation fault could occur when a corrupted pkcs12\
  \ file was being\nloaded using the \"openssl pkcs12 -in [pkcs12-file]\" command, where\n[pkcs12-file]\
  \ is the pkcs12 file.\n\nUsers of OpenSSL should upgrade to these updated packages, which\
  \ contain\nbackported patches to resolve these issues.\n\nNote: After installing this update,\
  \ users are advised to either restart all\nservices that use OpenSSL or restart their system."
