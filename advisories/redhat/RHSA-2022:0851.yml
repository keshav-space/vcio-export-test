exploits:
  - description: |
      This exploit module takes advantage of a Docker image which has either the privileged flag, or SYS_ADMIN Linux capability.
                If the host kernel is vulnerable, its possible to escape the Docker image and achieve root on the host operating system.

                A vulnerability was found in the Linux kernel's cgroup_release_agent_write in the kernel/cgroup/cgroup-v1.c function.
                This flaw, under certain circumstances, allows the use of the cgroups v1 release_agent feature to escalate privileges
                and bypass the namespace isolation unexpectedly.

                More simply put, cgroups v1 has a feature called release_agent that runs a program when a process in the cgroup terminates.
                If notify_on_release is enabled, the kernel runs the release_agent binary as root. By editing the release_agent file,
                an attacker can execute their own binary with elevated privileges, taking control of the system. However, the release_agent
                file is owned by root, so only a user with root access can modify it.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-02-04'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/docker_cgroup_escape.rb
    record_id: /modules/exploits/linux/local/docker_cgroup_escape.rb
  - description: |
      If the vmwgfx driver fails to copy the 'fence_rep' object to userland, it tries to
                recover by deallocating the (already populated) file descriptor. This is
                wrong, as the fd gets released via put_unused_fd() which shouldn't be used,
                as the fd table slot was already populated via the previous call to
                fd_install(). This leaves userland with a valid fd table entry pointing to
                a free'd 'file' object.

                We use this bug to overwrite a SUID binary with our payload and gain root.
                Linux kernel 4.14 - 5.16.x are vulnerable.

                Successfully tested against Ubuntu 22.04.01 with kernel 5.13.12-051312-generic.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-os-down
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-01-28'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/vmwgfx_fd_priv_esc.rb
    record_id: /modules/exploits/linux/local/vmwgfx_fd_priv_esc.rb
  - description: Linux Kernel contains an improper authentication vulnerability which could
      allow for privilege escalation via the cgroups v1 release_agent feature.
