summary: "An updated cpio package that fixes a umask bug is now available for Red Hat\nEnterprise\
  \ Linux 4.\n\nThis update has been rated as having low security impact by the Red Hat\nSecurity\
  \ Response Team\n\nGNU cpio copies files into or out of a cpio or tar archive.  \n\nIt was\
  \ discovered that cpio uses a 0 umask when creating files using the -O\n(archive) option.\
  \  This creates output files with mode 0666 (all can read\nand write) regardless of the user's\
  \ umask setting.  The Common\nVulnerabilities and Exposures project (cve.mitre.org) has assigned\
  \ the name\nCAN-1999-1572 to this issue.\n\nUsers of cpio should upgrade to this updated package,\
  \ which resolves\nthis issue.\n\nRed Hat would like to thank Mike O'Connor for bringing this\
  \ issue to our\nattention."
