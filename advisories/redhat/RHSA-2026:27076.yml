summary: |
  An update is now available for Red Hat Satellite 6.16 for RHEL 8 and RHEL 9.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Red Hat Satellite is a system management solution that allows organizations
  to configure and maintain their systems without the necessity to provide
  public Internet access to their servers or other client systems. It
  performs provisioning and configuration management of predefined standard
  operating environments.

  Security Fix(es):

  * python-pillow: Pillow: Denial of Service via decompression bomb in FITS image processing (CVE-2026-40192)

  * yggdrasil-worker-forwarder: Root.Chmod can follow symlinks out of the root (CVE-2026-32282)

  * dynflow-utils: Root.Chmod can follow symlinks out of the root (CVE-2026-32282)

  * satellite:el8/yggdrasil-worker-forwarder: gRPC-Go: Authorization bypass due to improper HTTP/2 path validation (CVE-2026-33186)

  * yggdrasil-worker-forwarder: gRPC-Go: Authorization bypass due to improper HTTP/2 path validation (CVE-2026-33186)

  * yggdrasil-worker-forwarder: Incorrect parsing of IPv6 host literals in net/url (CVE-2026-25679)

  * satellite:el8/yggdrasil-worker-forwarder: Incorrect parsing of IPv6 host literals in net/url (CVE-2026-25679)

  * satellite:el8/yggdrasil-worker-forwarder: golang: Denial of Service due to excessive resource consumption via crafted certificate (CVE-2025-61729)

  * satellite:el8/yggdrasil-worker-forwarder: Go crypto/tls: Denial of Service via multiple TLS 1.3 key update messages (CVE-2026-32283)

  * yggdrasil-worker-forwarder: Go crypto/tls: Denial of Service via multiple TLS 1.3 key update messages  (CVE-2026-32283)

  * yggdrasil-worker-forwarder: Go: Denial of Service vulnerability in certificate chain building (CVE-2026-32280)

  * satellite:el8/yggdrasil-worker-forwarder: Go: Denial of Service vulnerability in certificate chain building (CVE-2026-32280)

  * satellite:el8/yggdrasil-worker-forwarder: Go crypto/x509: Denial of Service via inefficient certificate chain validation (CVE-2026-32281)

  * yggdrasil-worker-forwarder: Go crypto/x509: Denial of Service via inefficient certificate chain validation (CVE-2026-32281)

  Bug Fix(es):

  * orphan cleanup triggers CapsuleContent::UpdateContentCounts regardless of automatic_content_count_updates setting (SAT-45906)

  * The custom repository fails to sync with the Capsule server, resulting in an error (SAT-44720)
