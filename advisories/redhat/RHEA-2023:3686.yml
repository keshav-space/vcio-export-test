summary: |
  Red Hat OpenShift Virtualization release 4.13.1 is now available with updates to packages and images that fix several bugs and add enhancements.

  OpenShift Virtualization is Red Hat's virtualization solution designed for Red Hat OpenShift Container Platform.

  This advisory contains OpenShift Virtualization 4.13.1 images.
