summary: "Red Hat OpenShift Data Foundation 4.22.2 security, enhancement & bug fix update\n\n\
  Red Hat OpenShift Data Foundation 4.22.2 security, enhancement & bug fix update\n\nFIXED BUGS:\n\
  ==========\nDFBUGS-9558: [MDR]: Post-upgrade (4.21 to 4.22) DRPolicy validation failure in\
  \ Metro DR\nDFBUGS-9404: [Backport to odf-4.22.2] Adjust key rotation mismatch alert to recommend\
  \ contacting support\nDFBUGS-9071: [4.22 clone] - must-gather Helper pod fails with \"realpath:\
  \ /var/lib/rook-ceph-mon/secret.keyring: No such file or directory\" causing all Ceph CLI\
  \ collection to be skipped\nDFBUGS-9018: [Backport to odf-4.22.z] minor odf-operator.v4.23.0\
  \ failing on OCP 5.0\nDFBUGS-8998: [Critical] Upgrade ceph version to RHCEPH-9.1z1 at ODF-4.22.1\n\
  DFBUGS-8996: The console pod in openshift console is continuously restarting \nDFBUGS-8956:\
  \ RHODF 4.22.2 release\nDFBUGS-8896: drbd-setup script fails to pull odf-drbd-rhel9 image\
  \ from registry.redhat.io — unauthorized error\nDFBUGS-8892: [backport-4.22] ocs-client-operator\
  \ fails to find CSI images ConfigMap on OCP 5.0.0 — blocks entire Ceph CSI deployment\nDFBUGS-8890:\
  \ Failed to install ODF 4.22 on OCP 5.0\nDFBUGS-8882: [TNF/ODF-4.22] Failed to deploy a drbd\
  \ module in the node\nDFBUGS-8812: Post completion of installation for FUSION and FDF cnsa-dependencies\
  \ status is reported as UNKNOWN\nDFBUGS-8798: [MDR] [HCI client]CephFS NetworkFence fencing\
  \ fails with EACCES error when listing active MDS clients\nDFBUGS-8514: [Backport to odf-4.22.2]\
  \ ODF 4.19 OCS Metrics Exporter not receiving Network Attachment Annotation\nDFBUGS-8224:\
  \ [RDR] DR protection for RBD workloads fails after DR configuration\nDFBUGS-8201: [odf-4.22]\
  \ - [GSS] Red Hat Virtualization VMs in Paused State - \"VMI was paused, low-level IO error\
  \ detected\" w/rbd Volumes Impacted and Clients Blocklisted\nDFBUGS-8115: [Backport to odf-4.22.z]\
  \ [RDR] [dryRun] For cephfs discovered app in deployed state, after dryRun and abort, progression\
  \ changes from TestingFailover to WaitOnUserToCleanUp but changes to Completed even without\
  \ workload cleanup\nDFBUGS-7974: [Backport to odf-4.22.1] [GSS] PDB is created for rgw even\
  \ though the gateway instance count is 1\nDFBUGS-7410: [RDR] [dryRun] For workload in various\
  \ states, ensure dryRun test failover abort works correctly and retains workloads original\
  \ state\nDFBUGS-6160: [GSS] Random Pod delete makes the container in openshift-storage.rbd.csi.ceph.com-nodeplugin-csi-addons\
  \ restart\nDFBUGS-5644: Customer is able to see the alert StorageClientHeartbeatMissed constantly,\
  \ roughly every 6 minutes it goes alerting and then it gets auto resolved."
