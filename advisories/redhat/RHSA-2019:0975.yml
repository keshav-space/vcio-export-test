  - description: runc < 1.0-rc6 (Docker < 18.09.2) - Container Breakout (1)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2019-02-12'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2019-02-14'
    data_source: Exploit-DB
    source_url: https://github.com/feexd/pocs/tree/a5aac58e0935a505c034b5f9e6cf35c1fc67471d/CVE-2019-5736
    record_id: CVE-2019-5736
  - description: |
      This module leverages a flaw in `runc` to escape a Docker container
                and get command execution on the host as root. This vulnerability is
                identified as CVE-2019-5736. It overwrites the `runc` binary with the
                payload and wait for someone to use `docker exec` to get into the
                container. This will trigger the payload execution.

                Note that executing this exploit carries important risks regarding
                the Docker installation integrity on the target and inside the
                container ('Side Effects' section in the documentation).
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-service-down
        - service-resource-loss
        - os-resource-loss
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
