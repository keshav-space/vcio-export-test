exploits:
  - description: |
      A heap based buffer overflow exists in the sudo command line utility that can be exploited by a local attacker
                to gain elevated privileges. The vulnerability was introduced in July of 2011 and affects version 1.8.2
                through 1.8.31p2 as well as 1.9.0 through 1.9.5p1 in their default configurations. The technique used by this
                implementation leverages the overflow to overwrite a service_user struct in memory to reference an attacker
                controlled library which results in it being loaded with the elevated privileges held by sudo.
    required_action:
    due_date:
    notes: |
      AKA:
        - Baron Samedit
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
      Reliability:
        - repeatable-session
      Stability:
        - crash-safe
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-01-26'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/sudo_baron_samedit.rb
    record_id: /modules/exploits/linux/local/sudo_baron_samedit.rb
  - description: Sudo 1.9.5p1 - 'Baron Samedit ' Heap-Based Buffer Overflow Privilege Escalation
      (1)
    required_action:
