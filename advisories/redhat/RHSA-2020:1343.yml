summary: "An update for the nodejs:10 module is now available for Red Hat Enterprise Linux 8.0\
  \ Update Services for SAP Solutions.\n\nRed Hat Product Security has rated this update as\
  \ having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base\
  \ score, which gives a detailed severity rating, is available for each vulnerability from\
  \ the CVE link(s) in the References section.\n\nNode.js is a software development platform\
  \ for building fast and scalable network applications in the JavaScript programming language.\
  \ \n\nSecurity Fix(es):\n\n* ICU: Integer overflow in UnicodeString::doAppend() (CVE-2020-10531)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
