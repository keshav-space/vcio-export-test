  - description: Linux 2.6.30 < 2.6.36-rc8 - Reliable Datagram Sockets (RDS) Privilege Escalation
      (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-05-21'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2018-05-21'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/294b2631591e088ef693aa366199300663fbc539/modules/exploits/linux/local/rds_priv_esc.rb
    record_id: CVE-2010-3904
  - description: |
      This module exploits a vulnerability in the `rds_page_copy_user` function
                in `net/rds/page.c` (RDS) in Linux kernel versions 2.6.30 to 2.6.36-rc8
                to execute code as root (CVE-2010-3904).

                This module has been tested successfully on:

                Fedora 13 (i686) kernel version 2.6.33.3-85.fc13.i686.PAE; and
                Ubuntu 10.04 (x86_64) with kernel version 2.6.32-21-generic.
    required_action:
    due_date:
    notes: |
      AKA:
        - rds-fail.c
      Reliability:
        - unreliable-session
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2010-10-20'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/rds_rds_page_copy_user_priv_esc.rb
    record_id: /modules/exploits/linux/local/rds_rds_page_copy_user_priv_esc.rb
  - description: Linux Kernel contains an improper input validation vulnerability in the Reliable
      Datagram Sockets (RDS) protocol implementation that allows local users to gain privileges
      via crafted use of the sendmsg and recvmsg system calls.
    required_action: The impacted product is end-of-life and should be disconnected if still
      in use.
    due_date: !!timestamp '2023-06-02'
    notes: https://lkml.iu.edu/hypermail/linux/kernel/1601.3/06474.html; https://nvd.nist.gov/vuln/detail/CVE-2010-3904
