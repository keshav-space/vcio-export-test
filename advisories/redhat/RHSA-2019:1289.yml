  - description: Rails Ruby on Rails contains a path traversal vulnerability in Action View.
      Specially crafted accept headers in combination with calls to `render file:` can cause
      arbitrary files on the target server to be rendered, disclosing the file contents.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
