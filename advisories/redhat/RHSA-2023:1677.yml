    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2023-0266
  - description: Linux Kernel contains an improper ownership management vulnerability, where
      unauthorized access to the execution of the setuid file with capabilities was found in
      the Linux kernel’s OverlayFS subsystem in how a user copies a capable file from a nosuid
      mount into another mount. This uid mapping bug allows a local user to escalate their privileges
      on the system.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-07-08'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. For more information, please see: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=4f11ada10d0a
      ; https://access.redhat.com/security/cve/cve-2023-0386 ; https://security.netapp.com/advisory/ntap-20230420-0004/
      ; https://nvd.nist.gov/vuln/detail/CVE-2023-0386'
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2023-0386
  - description: |
      This exploit targets the Linux kernel bug in OverlayFS.

                A flaw was found in the Linux kernel, where unauthorized access to the execution of the setuid file with capabilities
                was found in the Linux kernel's OverlayFS subsystem in how a user copies a capable file from a nosuid mount into another mount.
                This uid mapping bug allows a local user to escalate their privileges on the system.
    required_action:
    due_date:
    notes: |
      Reliability:
        - repeatable-session
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2023-03-22'
