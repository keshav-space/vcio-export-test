summary: |
  Updated RHEL-8 based Middleware Containers container images are now available

  The RHEL-8 based Middleware Containers container images have been updated to
  address the following security advisory: RHSA-2022:9058 (see References)

  Users of RHEL-8 based Middleware Containers container images are advised to
  upgrade to these updated images, which contain backported patches to correct
  these security issues, fix these bugs and add these enhancements. Users of these
  images are also encouraged to rebuild all container images that depend on these
  images.

