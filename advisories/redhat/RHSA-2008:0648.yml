  - description: Apache Tomcat 6.0.16 - 'RequestDispatcher' Information Disclosure
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2008-08-01'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2014-03-10'
    data_source: Exploit-DB
    source_url: https://www.securityfocus.com/bid/30494/info
    record_id: CVE-2008-2370
  - description: |
      This module tests whether a directory traversal vulnerability is present
              in versions of Apache Tomcat 4.1.0 - 4.1.37, 5.5.0 - 5.5.26 and 6.0.0
              - 6.0.16 under specific and non-default installations. The connector must have
              allowLinking set to true and URIEncoding set to UTF-8. Furthermore, the
              vulnerability actually occurs within Java and not Tomcat; the server must
              use Java versions prior to Sun 1.4.2_19, 1.5.0_17, 6u11 - or prior IBM Java
              5.0 SR9, 1.4.2 SR13, SE 6 SR4 releases. This module has only been tested against
              RedHat 9 running Tomcat 6.0.16 and Sun JRE 1.5.0-05. You may wish to change
              FILE (hosts,sensitive files), MAXDIRS and RPORT depending on your environment.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability: []
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2009-01-09'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/admin/http/tomcat_utf8_traversal.rb
    record_id: /modules/auxiliary/admin/http/tomcat_utf8_traversal.rb
  - description: |
      This module tests whether a directory traversal vulnerability is present
              in Trend Micro DLP (Data Loss Prevention) Appliance v5.5 build <= 1294.
              The vulnerability appears to be actually caused by the Tomcat UTF-8
              bug which is implemented in module tomcat_utf8_traversal CVE 2008-2938.
              This module simply tests for the same bug with Trend Micro specific settings.
              Note that in the Trend Micro appliance, /etc/shadow is not used and therefore
              password hashes are stored and anonymously accessible in the passwd file.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability: []
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2009-01-09'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/admin/http/trendmicro_dlp_traversal.rb
    record_id: /modules/auxiliary/admin/http/trendmicro_dlp_traversal.rb
