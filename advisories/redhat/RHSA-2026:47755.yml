advisory_id: RHSA-2026:47755
datasource_id: redhat/RHSA-2026:47755
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2026/rhsa-2026_47755.json
aliases:
  - CVE-2026-55653
  - CVE-2026-55655
summary: |
  An update for openssh is now available for Red Hat Enterprise Linux 8.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  OpenSSH is an SSH protocol implementation supported by a number of Linux, UNIX, and similar operating systems. It includes the core files necessary for both the OpenSSH client and server.

  Security Fix(es):

  * openssh: Local MITM of X11 forwarding via abstract UNIX socket pre-binding in Red Hat Enterprise Linux OpenSSH client versions (CVE-2026-55655)

  * openssh: Double free in Red Hat Enterprise Linux versions of OpenSSH DH-GEX client path during FIPS known-group validation leads to client-side denial of service (CVE-2026-55653)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
