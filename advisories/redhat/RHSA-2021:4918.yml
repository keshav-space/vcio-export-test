exploits:
  - description: XStream contains a remote code execution vulnerability that allows an attacker
      to manipulate the processed input stream and replace or inject objects that result in
      the execution of a local command on the server. This vulnerability can affect multiple
      products, including but not limited to VMware Cloud Foundation.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2023-03-31'
    notes: https://www.vmware.com/security/advisories/VMSA-2022-0027.html, https://x-stream.github.io/CVE-2021-39144.html;
      https://nvd.nist.gov/vuln/detail/CVE-2021-39144
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2021-39144
  - description: |
      VMware Cloud Foundation (NSX-V) contains a remote code execution vulnerability via XStream open source library.
                VMware has evaluated the severity of this issue to be in the Critical severity range with a maximum CVSSv3 base score of 9.8.
                Due to an unauthenticated endpoint that leverages XStream for input serialization in VMware Cloud Foundation (NSX-V),
                a malicious actor can get remote code execution in the context of 'root' on the appliance.
                VMware Cloud Foundation 3.x and more specific NSX Manager Data Center for vSphere up to and including version 6.4.13
                are vulnerable to Remote Command Injection.

                This module exploits the vulnerability to upload and execute payloads gaining root privileges.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-10-25'
