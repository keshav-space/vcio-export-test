  - description: The TLS and DTLS implementations in OpenSSL do not properly handle Heartbeat
      Extension packets, which allows remote attackers to obtain sensitive information.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-05-25'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2014-0160
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
