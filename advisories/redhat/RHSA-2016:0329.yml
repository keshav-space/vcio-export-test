summary: "Updated openstack-swift packages that fix two security issues are now\navailable for\
  \ Red Hat Gluster Storage 3.1 update 2 in Red Hat Enterprise\nLinux 6.\n\nRed Hat Product\
  \ Security has rated this update as having Moderate security\nimpact. Common Vulnerability\
  \ Scoring System (CVSS) base scores, which give\ndetailed severity ratings, are available\
  \ for each vulnerability from the\nCVE links in the References section.\n\nOpenStack Object\
  \ Storage (swift) provides object storage in virtual\ncontainers, which allows users to store\
  \ and retrieve files (arbitrary\ndata). The service's distributed architecture supports horizontal\
  \ scaling;\nredundancy as failure-proofing is provided through software-based data\nreplication.\
  \ Because Object Storage supports asynchronous eventual\nconsistency replication, it is well\
  \ suited to multiple data-center\ndeployment.\n\nA memory-leak issue was found in OpenStack\
  \ Object Storage (swift), in the\nproxy-to-server connection. An OpenStack-authenticated attacker\
  \ could\nremotely trigger this flaw to cause denial of service through excess memory\nconsumption.\
  \ (CVE-2016-0738)\n\nA memory-leak issue was found in OpenStack Object Storage (swift), in\
  \ the\nclient-to-proxy connection. An OpenStack-authenticated attacker could\nremotely trigger\
  \ this flaw to cause denial of service through excess memory\nconsumption. (CVE-2016-0737)\n\
  \nRed Hat would like to thank the OpenStack project for reporting these \nissues. Upstream\
  \ acknowledges Romain Le Disez from OVH and Örjan Persson\nfrom Kiliaro as the original reporters.\n\
  \nAll users of openstack-swift are advised to upgrade to these updated\npackages, which correct\
  \ these issues. After installing this update, the\nOpenStack Object Storage services will\
  \ be restarted automatically."
