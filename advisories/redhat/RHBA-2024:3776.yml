summary: |
  Updated container images that fix multiple bugs are now available for LVMS
  4.14

  Logical Volume Manager Storage uses lvm2 through the TopoLVM CSI driver to
  dynamically provision thin and thick local storage on a cluster with
  limited resources.

  Users of LVMS are advised to upgrade to the latest version of LVMS in
  OpenShift Container Platform, which fixes bugs and security
  vulnerabilities.
