summary: |
  An update for qemu-kvm-rhev is now available for Red Hat Virtualization for Red Hat Virtualization Host 4.3.

  Red Hat Product Security has rated this update as having a security impact of
  Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives
  a detailed severity rating, is available for each vulnerability from the CVE
  link(s) in the References section.

  KVM (Kernel-based Virtual Machine) is a full virtualization solution for Linux
  on a variety of architectures. The qemu-kvm-rhev packages provide the user-space component for running virtual machines that use KVM in environments managed by Red Hat products.

  Security Fix(es):

  * QEMU: ide: atapi: OOB access while processing read commands (CVE-2020-29443)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE page(s)
  listed in the References section.
