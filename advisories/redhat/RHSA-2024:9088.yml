summary: "An update for edk2 is now available for Red Hat Enterprise Linux 9.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Moderate. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nEDK (Embedded Development\
  \ Kit) is a project to enable UEFI support for Virtual Machines. This package contains a sample\
  \ 64-bit UEFI firmware for QEMU and KVM. \n\nSecurity Fix(es):\n\n* mysql: openssl: POLY1305\
  \ MAC implementation corrupts vector registers on PowerPC (CVE-2023-6129)\n\n* openssl: Excessive\
  \ time spent checking invalid RSA public keys (CVE-2023-6237)\n\n* openssl: denial of service\
  \ via null dereference (CVE-2024-0727)\n\n* edk2: Temporary DoS vulnerability (CVE-2024-1298)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section.\n\
  \nAdditional Changes:\n\nFor detailed information on changes in this release, see the Red\
  \ Hat Enterprise Linux 9.5 Release Notes linked from the References section."
