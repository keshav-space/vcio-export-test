exploits:
  - description: Apple iOS, iPadOS, macOS, and other Apple products contain a use-after-free
      vulnerability in WebKit. Processing maliciously crafted web content may lead to memory
      corruption. This vulnerability could impact HTML parsers that use WebKit, including but
      not limited to Apple Safari and non-Apple products which rely on WebKit for HTML processing.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
