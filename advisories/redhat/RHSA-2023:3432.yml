exploits:
  - description: Apple iOS, iPadOS, macOS, tvOS, watchOS, and Safari WebKit contain an out-of-bounds
      read vulnerability that may disclose sensitive information when processing maliciously
      crafted web content. This vulnerability could impact HTML parsers that use WebKit, including
      but not limited to Apple Safari and non-Apple products which rely on WebKit for HTML processing.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2023-06-12'
