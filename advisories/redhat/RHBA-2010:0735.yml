aliases:
  - CVE-2008-3273
summary: "Updated JBoss Enterprise Web Platform packages that fix various bugs are now available.\n\
  \nThe Enterprise Web Platform is for mid-size workloads, focusing on light and rich Java applications.\
  \ Web Platform is a slimmed down profile of the JBoss Enterprise Application Platform. Web\
  \ Platform builds upon the Java EE Web Profile concept to provide a lightweight version of\
  \ the popular JBoss Application Server, while still providing enterprise features for clustering,\
  \ caching, and simple web services.\n\nThis JBoss Enterprise Web Platform 5.1.0 release for\
  \ Red Hat Enterprise Linux 4 and 5 serves as a replacement for JBoss Enterprise Web Platform\
  \ 5.0.1.\n\nThese updated packages include the bug fixes detailed in the release notes, which\
  \ are linked to from the References section of this errata. \n\nWarning: before applying this\
  \ update, please backup your JBoss Enterprise Web Platform's \"jboss-as-web/server/$PROFILE/deploy/\"\
  \ directory, along with all other customized configuration files. \n\nAll users of JBoss Enterprise\
  \ Web Platform on Red Hat Enterprise Linux 4 and 5 are advised to upgrade to these updated\
  \ packages."
