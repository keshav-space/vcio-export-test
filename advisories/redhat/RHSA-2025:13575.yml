summary: "An update for unbound is now available for Red Hat Enterprise Linux 8.4 Advanced Mission\
  \ Critical Update Support and Red Hat Enterprise Linux 8.4 Extended Update Support Long-Life\
  \ Add-On.\n\nRed Hat Product Security has rated this update as having a security impact of\
  \ Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nThe unbound packages provide a validating, recursive, and caching DNS or DNSSEC\
  \ resolver. \n\nSecurity Fix(es):\n\n* unbound: Unbound Cache poisoning (CVE-2025-5994)\n\n\
  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
