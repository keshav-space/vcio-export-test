summary: "A new version of Migration Toolkit for Applications (MTA) is now available.\n\nMigration\
  \ Toolkit for Applications (MTA) accelerates large-scale application modernization efforts\
  \ across hybrid cloud environments on Red Hat OpenShift. \nThis solution provides insight\
  \ throughout the adoption process, at both the portfolio and application levels: inventory,\
  \ assess, analyze, and manage\napplications for faster migration to OpenShift via the user\
  \ interface."
