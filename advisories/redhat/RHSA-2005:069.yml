summary: "An updated perl-DBI package that fixes a temporary file flaw in\nDBI::ProxyServer\
  \ is now available.\n\nDBI is a database access Application Programming Interface (API) for\n\
  the Perl programming language. \n\nThe Debian Security Audit Project discovered that the DBI\
  \ library creates a\ntemporary PID file in an insecure manner.  A local user could overwrite\
  \ or\ncreate files as a different user who happens to run an application which\nuses DBI::ProxyServer.\
  \  The Common Vulnerabilities and Exposures project\n(cve.mitre.org) has assigned the name\
  \ CAN-2005-0077 to this issue. \n\nUsers should update to this erratum package which disables\
  \ the temporary\nPID file unless configured."
