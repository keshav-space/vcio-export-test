exploits:
  - description: Sun Java SE November 2009 - Multiple Vulnerabilities (1)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2009-10-29'
    exploit_type: remote
    platform: linux
    source_date_updated: !!timestamp '2016-12-18'
    data_source: Exploit-DB
    source_url: https://www.securityfocus.com/bid/36881/info
    record_id: CVE-2009-3867
  - description: |
      This module exploits a flaw in the setDiffICM function in the Sun JVM.

                The payload is serialized and passed to the applet via PARAM tags. It must be
                a native payload.

                The effected Java versions are JDK and JRE 6 Update 16 and earlier,
                JDK and JRE 5.0 Update 21 and earlier, SDK and JRE 1.4.2_23 and
                earlier, and SDK and JRE 1.3.1_26 and earlier.

                NOTE: Although all of the above versions are reportedly vulnerable, only
                1.6.0_u11 and 1.6.0_u16 on Windows XP SP3 were tested.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2009-11-04'
    exploit_type:
    platform: OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_setdifficm_bof.rb
    record_id: /modules/exploits/multi/browser/java_setdifficm_bof.rb
  - description: |
      This module exploits a flaw in the getSoundbank function in the Sun JVM.

                The payload is serialized and passed to the applet via PARAM tags. It must be
                a native payload.

                The effected Java versions are JDK and JRE 6 Update 16 and earlier,
                JDK and JRE 5.0 Update 21 and earlier, SDK and JRE 1.4.2_23 and
                earlier, and SDK and JRE 1.3.1_26 and earlier.

                NOTE: Although all of the above versions are reportedly vulnerable, only
                1.6.0_u11 and 1.6.0_u16 on Windows XP SP3 were tested.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
