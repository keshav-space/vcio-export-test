exploits:
  - description: Linux kernel contains a heap-based buffer overflow vulnerability in the legacy_parse_param
      function in the Filesystem Context functionality. This allows an attacker to open a filesystem
      that does not support the Filesystem Context API and ultimately escalate privileges.
    required_action: Apply updates per vendor instructions or discontinue use of the product
      if updates are unavailable.
    due_date: !!timestamp '2024-09-11'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. For more information, please see: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit?id=722d94847de2;
      https://nvd.nist.gov/vuln/detail/CVE-2022-0185'
