summary: |
  An update for java-25-openjdk is now available for Red Hat Enterprise Linux 9 and Red Hat Enterprise Linux 10.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The OpenJDK 25 packages provide the OpenJDK 25 Java Runtime Environment and the OpenJDK 25 Java Software Development Kit.

  Security Fix(es):

  * JDK: Enhance TLS certificate handling (CVE-2026-46968)

  * JDK: Improve DTLS handshaking (CVE-2026-46917)

  * JDK: Enhance JPEG handling (CVE-2026-47010)

  * JDK: Enhance XBM image support (CVE-2026-47021)

  * JDK: Enhance Jar file processing (CVE-2026-47027)

  * JDK: Improve certification checking (CVE-2026-60147)

  * JDK: Enhance AWT ImagingLib (CVE-2026-47059)

  * JDK: Enhance Jar handling (CVE-2026-47063)

  * JDK: Update LCMS to 2.19 (CVE-2026-41254)

  Enhancement(s):

  * For the last couple of years, OpenJDK has used a single build shared among multiple RPMs and a tarball available on the customer portal.  The single "portable" build has a release number ('p') and each RPM has its own release number ('r').  However, the RPM naming only showed the RPM release number, while the version output from the build showed the portable release number, making it unclear that they were different numbers.  From this release onwards, a release field of the form 'p.r' is always used for RPMs and the version output shows 'p'. (RHEL-211046, RHEL-211048)

  Bug Fix(es):

  * The performance of the Math.pow function regressed between OpenJDK 8 and OpenJDK 11.  This was due to an absence of constant folding when applicable (for example, Math.pow(2,1) being replaced by 2).  This release reintroduces this optimization.  (RHEL-211050, RHEL-211052)
  * On RHEL 9 systems, the alternatives list a JDK and architecture pair (for example, "java-11-openjdk.x86_64") followed by the path to the binary in brackets.  RHEL 10 systems have a simpler format that just lists the path.  Because the OpenJDK 25 packages for RHEL 9 were originally based on those from RHEL 10, they used the simpler format.  With this release, the format for OpenJDK 25 packages on RHEL 9 is updated to be closer to other JDKs on that platform. (RHEL-212650)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
