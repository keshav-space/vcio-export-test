summary: |
  Release of OpenShift Serverless Client kn 1.26.0

  Red Hat Product Security has rated this update as having a security impact of
  Low. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat OpenShift Serverless Client kn 1.26.0 provides a CLI to interact with Red Hat OpenShift Serverless 1.26.0. The kn CLI is delivered as an RPM package for installation on RHEL platforms, and as binaries for non-Linux platforms.

  Security Fix(es):
  * golang: crash in a golang.org/x/crypto/ssh server (CVE-2022-27191)

  For more details about the security issue(s), including the impact; a CVSS
  score; acknowledgments; and other related information refer to the CVE page(s)
  listed in the References section.
