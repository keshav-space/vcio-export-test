summary: "An update for the python38:3.8 and python38-devel:3.8 modules is now available for\
  \ Red Hat Enterprise Linux 8.\n\nRed Hat Product Security has rated this update as having\
  \ a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score,\
  \ which gives a detailed severity rating, is available for each vulnerability from the CVE\
  \ link(s) in the References section.\n\nPython is an interpreted, interactive, object-oriented\
  \ programming language, which includes modules, classes, exceptions, very high level dynamic\
  \ data types and dynamic typing. Python supports interfaces to many system calls and libraries,\
  \ as well as to various windowing systems. \n\nThe following packages have been upgraded to\
  \ a later upstream version: python38 (3.8), python38-devel (3.8). (BZ#1997680, BZ#1997860)\n\
  \nSecurity Fix(es):\n\n* python: urllib: Regular expression DoS in AbstractBasicAuthHandler\
  \ (CVE-2021-3733)\n\n* python-lxml: HTML Cleaner allows crafted and SVG embedded scripts to\
  \ pass through (CVE-2021-43818)\n\n* python: urllib.parse does not sanitize URLs containing\
  \ ASCII newline and tabs (CVE-2022-0391)\n\n* python: urllib: HTTP client possible infinite\
  \ loop on a 100 Continue response (CVE-2021-3737)\n\nFor more details about the security issue(s),\
  \ including the impact, a CVSS score, acknowledgments, and other related information, refer\
  \ to the CVE page(s) listed in the References section.\n\nAdditional Changes:\n\nFor detailed\
  \ information on changes in this release, see the Red Hat Enterprise Linux 8.6 Release Notes\
  \ linked from the References section."
