summary: |
  This is an updated version of the Node Health Check Operator.
  This Operator is delivered by Red Hat Workload Availability (RHWA).

  The Node Health Check Operator deploys the Node Health Check controller.
  The controller identifies unhealthy nodes and uses a remediation provider
  to remediate the unhealthy nodes. You can install either the
  Self Node Remediation Operator, the Fence Agents Remediation Operator,
  or the Machine Deletion Remedation Operator as a remediation provider.
