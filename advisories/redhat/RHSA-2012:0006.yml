exploits:
  - description: Detect Java RMI endpoints
    required_action:
    due_date:
    notes: |
      {}
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2011-10-15'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/misc/java_rmi_server.rb
    record_id: /modules/auxiliary/scanner/misc/java_rmi_server.rb
  - description: |
      This module takes advantage of the default configuration of the RMI Registry and
                RMI Activation services, which allow loading classes from any remote (HTTP) URL. As it
                invokes a method in the RMI Distributed Garbage Collector which is available via every
                RMI endpoint, it can be used against both rmiregistry and rmid,  and against most other
                (custom) RMI endpoints as well.

                Note that it does not work against Java Management Extension (JMX) ports since those do
                not support remote class loading, unless another RMI endpoint is active in the same
                Java process.

                RMI method calls do not support or require any sort of authentication.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2011-10-15'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/misc/java_rmi_server.rb
    record_id: /modules/exploits/multi/misc/java_rmi_server.rb
  - description: Java RMI - Server Insecure Default Configuration Java Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2011-07-15'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2017-06-05'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2011-3556
  - description: |
      Check if a server supports a given version of SSL/TLS and cipher suites.

              The certificate is stored in loot, and any known vulnerabilities against that
              SSL version and cipher suite combination are checked. These checks include
              POODLE, deprecated protocols, expired/not valid certs, low key strength, null cipher suites,
              certificates signed with MD5, DROWN, RC4 ciphers, exportable ciphers, LOGJAM, and BEAST.
    required_action:
    due_date:
    notes: |
      {}
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2014-10-14'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/ssl/ssl_version.rb
