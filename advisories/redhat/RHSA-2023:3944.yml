exploits:
  - description: VMware Tools contains an authentication bypass vulnerability in the vgauth
      module. A fully compromised ESXi host can force VMware Tools to fail to authenticate host-to-guest
      operations, impacting the confidentiality and integrity of the guest virtual machine.
      An attacker must have root access over ESXi to exploit this vulnerability.
    required_action: Apply updates per vendor instructions.
