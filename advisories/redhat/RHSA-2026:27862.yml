summary: "An update for memcached is now available for Red Hat Enterprise Linux 9.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  memcached is a high-performance, distributed memory object caching system, generic in nature,\
  \ but intended for use in speeding up dynamic web applications by alleviating database load.\
  \ \n\nSecurity Fix(es):\n\n* memcached: memcached: Username enumeration via timing side channel\
  \ (CVE-2026-47783)\n\nFor more details about the security issue(s), including the impact,\
  \ a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed\
  \ in the References section."
