summary: |
  An update for sensu is now available for Red Hat OpenStack Platform 10.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives adetailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Sensu is a monitoring framework that aims to be simple, malleable, and
  scalable.

  Security fix(es):

  * Sensu's redaction function fails to handle the redaction of sensitive data in deeply nested data structures, resulting in sensitive data, such as passwords, being logged in clear-text. (CVE-2018-1000060)

  For more details about the security issue(s), including the impact, a CVSS score, and other related information, refer to the CVE page(s) listed in the References section.
