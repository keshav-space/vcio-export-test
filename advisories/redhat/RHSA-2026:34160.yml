summary: |
  An update is now available for Red Hat Ansible Automation Platform 2.6

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Ansible Automation Platform provides an enterprise framework for building, deploying and managing IT automation at scale. IT Managers can provide top-down guidelines on how automation is applied to individual teams, while automation developers retain the freedom to write tasks that leverage existing knowledge without the overhead. Ansible Automation Platform makes it possible for users across an organization to share, vet, and manage automation content by means of a simple, powerful, and agentless language.

  Security Fix(es):

  * automation-platform-ui: Axios: Denial of Service due to unenforced request and response size limits (CVE-2026-44488)
  * automation-platform-ui: Axios: Information disclosure due to prototype pollution vulnerability (CVE-2026-44495)
  * automation-platform-ui: fast-uri: URI authority bypass due to improper delimiter handling (CVE-2026-6322)
  * automation-platform-ui: Axios: Arbitrary HTTP header injection via prototype pollution (CVE-2026-42035)
  * automation-platform-ui: DOMPurify: Cross-Site Scripting (XSS) via inconsistent tag sanitization (CVE-2026-41240)
  * automation-platform-ui: protobufjs: Arbitrary code execution due to unsafe expression generation from crafted protobuf descriptors (CVE-2026-44293)
  * python3.12-pyjwt: Authentication bypass due to forged JSON Web Tokens (CVE-2026-48526)
  * automation-controller: Dynaconf: Arbitrary code execution via Server-Side Template Injection (CVE-2026-33154)
  * python3.12-urllib3: Information disclosure via cross-origin redirects forwarding sensitive headers (CVE-2026-44431)
  * python3.12-urllib3: Denial of Service due to excessive HTTP response decompression (CVE-2026-44432)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
