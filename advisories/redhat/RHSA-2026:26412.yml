  \nRed Hat OpenShift Data Foundation 4.20.14 security, enhancement & bug fix update\n\nFIXED\
  \ BUGS:\n==========\nDFBUGS-7104: [Backport to 4.20.z] CLONE - ODF Console is breaking\nDFBUGS-7079:\
  \ NooBaa upgrade failure due to remove_mongo_pool.js error\nDFBUGS-7066: RHODF 4.20.14 release\n\
  DFBUGS-7045: [5.20] Update nodejs from v22.11.0 to v24.13.0\nDFBUGS-7016: [Critical] Upgrade\
  \ ceph version to RHCEPH-8.1z6 at ODF-4.20.13\nDFBUGS-6953: Upgrade the package on-headers\
  \ and undici to fix cve CVE-2025-7339, CVE-2026-22036\nDFBUGS-6872: [Backport to 4.20] INVALID_SCHEMA_REPLY\
  \ SERVER after upgrading ODF to 4.21\nDFBUGS-6846: Backport to odf-4.20.z intermittent S3\
  \ upload failures (HTTP 500 / InternalError) when uploading files to NooBaa buckets via JFrog\
  \ Artifactory\nDFBUGS-6740: Backport to odf-4.20.z ODF 4.16.21- noobaa-endpoint crashes with\
  \ Exit Code 1 due to unhandled AbortError from @azure/storage-blob\nDFBUGS-6705: Backport\
  \ to odf-4.20.z [GSS] Unnecessary OSD redeployments on 4.19.z upgrade for already-encrypted\
