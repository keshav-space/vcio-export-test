summary: "An update for the 389-ds:1.4 module is now available for Red Hat Enterprise Linux\
  \ 8.\n\nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \n389 Directory Server is an LDAP version 3 (LDAPv3) compliant server. The base packages include\
  \ the Lightweight Directory Access Protocol (LDAP) server and command-line utilities for server\
  \ administration. \n\nSecurity Fix(es):\n\n* 389-ds-base: 389-ds-base: pre-auth LDAP filter\
  \ injection in CleanAllRUV status check (CVE-2026-11770)\n\n* 389-ds-base: 389-ds-base: NULL\
  \ pointer dereference in deref control plugin BER parser (CVE-2026-11788)\n\n* 389-ds-base:\
  \ 389-ds-base: pre-authentication stack buffer overflow in get_ruvelement_from_berval() via\
  \ unbounded replica ID parsing (CVE-2026-15722)\n\nFor more details about the security issue(s),\
  \ including the impact, a CVSS score, acknowledgments, and other related information, refer\
  \ to the CVE page(s) listed in the References section."
