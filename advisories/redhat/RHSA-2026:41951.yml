summary: "An update for Red Hat Data Grid 8 is now available.\n \nRed Hat Product Security has\
  \ rated this update as having a security impact of Important. A Common Vulnerability Scoring\
  \ System (CVSS) base score, which gives a detailed severity rating, is available for each\
  \ vulnerability from the CVE link(s) in the References section.\n\nRed Hat Data Grid is an\
  \ in-memory, distributed, NoSQL datastore solution. It increases application response times\
  \ and allows for dramatically improving performance while providing availability, reliability,\
  \ and elastic scale.\n \nData Grid 8.6.2 replaces Data Grid 8.6.1 and includes bug fixes and\
  \ enhancements. Find out more about Data Grid 8.6.2 in the Release Notes[3].\n\nSecurity Fix(es):\n\
  \n* CVE-2026-54513 jackson-databind: Jackson-databind: Security bypass allows arbitrary code\
  \ execution [jdg-8.6] (CVE-2026-54513)\n\n* CVE-2026-42211 react-router: React Router: Remote\
  \ Code Execution via prototype pollution in Framework Mode [jdg-8.6] (CVE-2026-42211)\n\n\
  * CVE-2026-42264 axios: Axios: Prototype pollution allows information disclosure and request\
  \ manipulation [jdg-8.6] (CVE-2026-42264)\n\n* CVE-2026-50193 jackson-databind: Jackson-databind:\
  \ Denial of Service via deeply nested JSON processing [jdg-8.6] (CVE-2026-50193)\n\n* CVE-2026-54512\
  \ jackson-databind: jackson-databind: Arbitrary code execution via PolymorphicTypeValidator\
  \ bypass [jdg-8.6] (CVE-2026-54512)\n\n* CVE-2026-40983 micrometer-core: Micrometer: Denial\
  \ of Service via specially crafted gRPC requests [jdg-8.6] (CVE-2026-40983)\n\n* CVE-2026-40984\
  \ micrometer-core: Micrometer: Denial of Service via specially crafted HTTP requests [jdg-8.6]\
  \ (CVE-2026-40984)\n\n* CVE-2026-12143 form-data: form-data: Form field override via CRLF\
  \ injection [jdg-8.6] (CVE-2026-12143)\n\n* CVE-2026-9595 webpack-dev-server: webpack-dev-server:\
  \ Information disclosure and denial of service via improper proxy configuration [jdg-8.6]\
  \ (CVE-2026-9595)\n\n* CVE-2026-50011 netty-codec-redis: Netty: Denial of Service via malicious\
  \ Redis array header [jdg-8.6] (CVE-2026-50011)\n\n* CVE-2026-45416 netty-handler: Netty:\
  \ Denial of Service due to eager buffer allocation in TLS handshake [jdg-8.6] (CVE-2026-45416)\n\
  \n* CVE-2026-44890 netty-codec-redis: netty-codec-redis: Denial of Service via crafted Redis\
  \ payloads [jdg-8.6] (CVE-2026-44890)\n\n* CVE-2026-44250 netty-codec-redis: netty-codec-redis:\
  \ Denial of Service via crafted Redis payload with deeply nested arrays [jdg-8.6] (CVE-2026-44250)\n\
  \n* CVE-2026-46340 netty-transport-sctp: Netty-transport-sctp: Denial of Service due to unbounded\
  \ memory growth from SctpMessage fragments [jdg-8.6] (CVE-2026-46340)\n\n* CVE-2026-45674\
  \ netty-resolver-dns: Netty: Information disclosure and data manipulation due to improper\
  \ CNAME record validation [jdg-8.6] (CVE-2026-45674)\n\n* CVE-2026-50010 netty-handler: Netty:\
  \ Improper trust manager handling leads to hostname verification bypass [jdg-8.6] (CVE-2026-50010)\n\
  \n* CVE-2026-48006 netty-codec-redis: Netty's Lack of Lifecycle Cleanup Leads to Pooled ByteBuf\
  \ Leak in RedisArrayAggregator [jdg-8.6] (CVE-2026-48006)\n\n* CVE-2026-47691 netty-resolver-dns:\
  \ Netty has Insufficient Bailiwick Validation for NS Records [jdg-8.6] (CVE-2026-47691)\n\n\
  * CVE-2026-48059 netty-codec-haproxy: Netty HAProxy PROXY protocol v2 codec: Denial of Service\
  \ via memory leak from crafted PROXY protocol headers [jdg-8.6] (CVE-2026-48059)\n* CVE-2026-48043\
  \ netty-codec-http2: netty-codec-http2: Denial of Service due to resource leak [jdg-8.6] (CVE-2026-48043)\n\
  \n* CVE-2026-44893 netty-codec-haproxy: Netty-codec-haproxy: Denial of Service via malformed\
  \ HAProxy message [jdg-8.6] (CVE-2026-44893)\n\n* CVE-2026-44249 netty-handler: netty-handler:\
  \ IPv6 subnet rule bypass due to incorrect masking operation [jdg-8.6] (CVE-2026-44249)\n\n\
  * CVE-2026-44492 axios: Axios: Proxy bypass via IPv4-mapped IPv6 address non-normalization\
  \ [jdg-8.6] (CVE-2026-44492)\n\n* CVE-2026-44494 axios: Axios: Man-in-the-Middle (MITM) attack\
  \ via Prototype Pollution [jdg-8.6] (CVE-2026-44494)\n\n* CVE-2026-44496 axios: Axios: Client-side\
  \ Denial of Service via unescaped regex metacharacters in XSRF cookie name [jdg-8.6] (CVE-2026-44496)\n\
  \n* CVE-2026-44486 axios: Axios: Information disclosure of proxy credentials via HTTP redirects\
  \ [jdg-8.6] (CVE-2026-44486)\n\n* CVE-2026-44487 axios: Axios: Information disclosure of proxy\
  \ credentials via redirect flows [jdg-8.6] (CVE-2026-44487)\n\n* CVE-2026-44488 axios: Axios:\
  \ Denial of Service due to unenforced request and response size limits [jdg-8.6] (CVE-2026-44488)\n\
  \n* CVE-2026-44495 axios: Axios: Information disclosure due to prototype pollution vulnerability\
  \ [jdg-8.6] (CVE-2026-44495)\n\n* CVE-2026-6322 fast-uri: fast-uri: URI authority bypass due\
  \ to improper delimiter handling [jdg-8.6] (CVE-2026-6322)\n\n* CVE-2026-45292 opentelemetry-extension-trace-propagators:\
  \ OpenTelemetry Java: Denial of Service due to unbounded memory allocation when parsing oversized\
  \ baggage [jdg-8.6] (CVE-2026-45292)\n\n* CVE-2026-42583 netty-codec-compression: Netty: Denial\
  \ of Service via excessive memory allocation in LZ4FrameDecoder [jdg-8.6] (CVE-2026-42583)\n\
  \n* CVE-2026-44248 netty-codec-mqtt: Netty: Denial of Service due to excessive resource consumption\
  \ from crafted MQTT 5 header [jdg-8.6] (CVE-2026-44248)\n\n* CVE-2026-42587 netty-codec-http2:\
  \ Netty: Denial of Service via unbounded memory allocation in HTTP content decompression [jdg-8.6]\
  \  (CVE-2026-42587)\n\n* CVE-2026-42586 netty-codec-redis: Netty: Command injection via CRLF\
  \ characters in Redis codec encoder [jdg-8.6] (CVE-2026-42586)\n\n* CVE-2026-42342 react-router:\
  \ React Router / Remix: Denial of Service via unbounded path expansion in __manifest endpoint\
  \ [jdg-8.6] (CVE-2026-42342)\n\n* CVE-2026-33245 react-router: React Router: Cross-Site Scripting\
  \ vulnerability via untrusted React Server Component redirects [jdg-8.6] (CVE-2026-33245)\n\
  \n* CVE-2026-34077 react-router: React Router: Denial of Service via client-side Cross-Site\
  \ Scripting in RSC redirect handling [jdg-8.6] (CVE-2026-34077)\n\nFor more details about\
  \ the security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
