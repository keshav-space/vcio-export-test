summary: "An update for grafana is now available for Red Hat Enterprise Linux 10.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Moderate. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  Grafana is an open source, feature rich metrics dashboard and graph editor for Graphite, InfluxDB\
  \ & OpenTSDB. \n\nSecurity Fix(es):\n\n* grafana: Grafana: Privilege escalation via dashboard\
  \ overwrite (CVE-2026-33377)\n\n* grafana: Grafana Auth Proxy: Unauthorized access due to\
  \ incorrect IPv6 allow-list default (CVE-2026-33376)\n\n* grafana: Grafana: Denial of Service\
  \ via unbounded memory growth in OAuth login route (CVE-2026-8609)\n\n* grafana: Grafana:\
  \ Denial of Service via excessive memory allocation from large API request payloads (CVE-2026-33382)\n\
  \nBug Fix(es) and Enhancement(s):\n\n* [grafana / rhel-10.2.z] Remove Lua ExclusiveArch macro\
  \ for Konflux build (JIRA:RHEL-188282)\n\nFor more details about the security issue(s), including\
  \ the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE\
  \ page(s) listed in the References section."
