advisory_id: RHSA-2016:1944
datasource_id: redhat/RHSA-2016:1944
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2016/rhsa-2016_1944.json
aliases:
  - CVE-2016-2776
summary: |
  An update for bind is now available for Red Hat Enterprise Linux 5, Red Hat Enterprise Linux 6, and Red Hat Enterprise Linux 7.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The Berkeley Internet Name Domain (BIND) is an implementation of the Domain Name System (DNS) protocols. BIND includes a DNS server (named); a resolver library (routines for applications to use when interfacing with DNS); and tools for verifying that the DNS server is operating correctly.

  Security Fix(es):

  * A denial of service flaw was found in the way BIND constructed a response to a query that met certain criteria. A remote attacker could use this flaw to make named exit unexpectedly with an assertion failure via a specially crafted DNS request packet. (CVE-2016-2776)

  Red Hat would like to thank ISC for reporting this issue.
