exploits:
  - description: Microsoft Windows - 'POP/MOV SS' Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-05-22'
    exploit_type: local
    platform: windows
    source_date_updated: !!timestamp '2018-07-13'
    data_source: Exploit-DB
    source_url: https://github.com/can1357/CVE-2018-8897
    record_id: CVE-2018-8897
  - description: |
      This module exploits a vulnerability in a statement in the system programming guide
                of the Intel 64 and IA-32 architectures software developer's manual being mishandled
                in various operating system kerneles, resulting in unexpected behavior for #DB
                excpetions that are deferred by MOV SS or POP SS.

                This module will upload the pre-compiled exploit and use it to execute the final
                payload in order to gain remote code execution.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2018-05-08'
