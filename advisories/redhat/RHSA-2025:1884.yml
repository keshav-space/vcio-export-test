summary: "An update is now available for Red Hat build of Quarkus. \nRed Hat Product Security\
  \ has rated this update as having an important security impact.\nA Common Vulnerability Scoring\
  \ System (CVSS) base score, which\ngives a detailed severity rating, is available for each\
  \ vulnerability.\nFor more information, see the CVE links in the References section.\n\nThis\
  \ release of Red Hat build of Quarkus 3.8.6.SP3 contains security updates. For more information,\
  \ see the release notes\npage listed in the References section.\n\nSecurity Fix(es):\n\n*\
  \ io.netty/netty-handler: SslHandler doesn't correctly validate packets, which can lead to\
  \ a native crash when using native SSLEngine (CVE-2025-24970)\n\n* io.quarkus/quarkus-rest:\
  \ Quarkus REST Endpoint Request Parameter Leakage Due to Shared Instance (CVE-2025-1247)\n\
  \n* io.quarkus:quarkus-resteasy: Memory Leak in Quarkus RESTEasy Classic When Client Requests\
  \ Timeout (CVE-2025-1634)"
