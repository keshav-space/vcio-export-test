summary: |
  An update for openstack-keystone is now available for Red Hat OpenStack
  Platform 17.1 (Wallaby).

  Red Hat Product Security has rated this update as having a security impact
  of Low. A Common Vulnerability Scoring System (CVSS) base score, which
  gives a detailed severity rating, is available for each vulnerability from
  the CVE link(s) in the References section.

  Keystone is a Python implementation of the OpenStack
  (http://www.openstack.org) identity service API.

  Security Fix(es):

  * OpenStack Keystone: Privilege escalation through EC2 credential creation
  (CVE-2026-33551)

  * OpenStack Keystone: Unauthenticated access to EC2/S3 token endpoints can grant Keystone authorization (CVE-2025-65073)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE
  page listed in the References section.
