exploits:
  - description: Oracle Java SE and JRockit contains an unspecified vulnerability that allows
      remote attackers to affect confidentiality, integrity, and availability via vectors related
      to Java Management Extensions (JMX). This vulnerability can be exploited through sandboxed
      Java Web Start applications and sandboxed Java applets. It can also be exploited by supplying
      data to APIs in the specified component without using sandboxed Java Web Start applications
      or sandboxed Java applets, such as through a web service.
    required_action: Apply updates per vendor instructions.
