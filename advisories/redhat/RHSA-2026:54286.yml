summary: |
  This is an updated version of the Storage-Based Remediation Operator.
  This Operator is delivered by Red Hat Workload Availability (RHWA).

  The Storage-Based Remediation Operator is an OLM Operator for managing STONITH Block Device (SBD) configurations and remediations for high-availability clustering.
  The operator provides automated node remediation when nodes become unresponsive by leveraging shared block storage for fencing operations.
