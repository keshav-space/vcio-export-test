summary: "An update for the nodejs:24 module is now available for Red Hat Enterprise Linux 9.\n\
  \nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nNode.js is a software development platform for building fast and scalable network applications\
  \ in the JavaScript programming language. \n\nSecurity Fix(es):\n\n* brace-expansion: Brace-expansion:\
  \ Denial of Service due to exponential-time complexity (CVE-2026-13149)\n\n* tar: Node-tar:\
  \ Denial of Service via malformed tar archive header (CVE-2026-59874)\n\n* tar: node-tar:\
  \ Denial of Service via crafted gzip bomb (CVE-2026-59873)\n\nFor more details about the security\
  \ issue(s), including the impact, a CVSS score, acknowledgments, and other related information,\
  \ refer to the CVE page(s) listed in the References section."
