    source_url:
    record_id: CVE-2013-2472
  - description: |
      This module abuses the insecure invoke() method of the ProviderSkeleton class that
                allows to call arbitrary static methods with user supplied arguments. The vulnerability
                affects Java version 7u21 and earlier.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-06-18'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_jre17_provider_skeleton.rb
    record_id: /modules/exploits/multi/browser/java_jre17_provider_skeleton.rb
  - description: |
      This module abuses an Invalid Array Indexing Vulnerability on the
                static function storeImageArray() function in order to cause a
                memory corruption and escape the Java Sandbox. The vulnerability
                affects Java version 7u21 and earlier. The module, which doesn't bypass
                click2play, has been tested successfully on Java 7u21 on Windows and
                Linux systems.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
