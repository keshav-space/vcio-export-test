exploits:
  - description: Solaris - RSH Stack Clash Privilege Escalation (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-10-16'
    exploit_type: local
    platform: solaris
    source_date_updated: !!timestamp '2018-10-16'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/8877582086acca0f4ec1cf9bd371bbab53e642f4/modules/exploits/solaris/local/rsh_stack_clash_priv_esc.rb
    record_id: CVE-2017-1000364
  - description: |
      This module exploits a vulnerability in RSH on unpatched Solaris
                systems which allows users to gain root privileges.

                The stack guard page on unpatched Solaris systems is of
                insufficient size to prevent collisions between the stack
                and heap memory, aka Stack Clash.

                This module uploads and executes Qualys' Solaris_rsh.c exploit,
                which exploits a vulnerability in RSH to bypass the stack guard
                page to write to the stack and create a SUID root shell.

                This module has offsets for Solaris versions 11.1 (x86) and
                Solaris 11.3 (x86).

                Exploitation will usually complete within a few minutes using
                the default number of worker threads (10). Occasionally,
                exploitation will fail. If the target system is vulnerable,
                usually re-running the exploit will be successful.

                This module has been tested successfully on Solaris 11.1 (x86)
                and Solaris 11.3 (x86).
    required_action:
    due_date:
    notes: |
      AKA:
        - Stack Clash
        - Solaris_rsh.c
      SideEffects:
        - artifacts-on-disk
      Reliability:
        - unreliable-session
      Stability:
        - crash-safe
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2017-06-19'
    exploit_type:
    platform: Solaris,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/solaris/local/rsh_stack_clash_priv_esc.rb
    record_id: /modules/exploits/solaris/local/rsh_stack_clash_priv_esc.rb
