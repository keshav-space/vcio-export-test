exploits:
  - description: Mozilla Firefox 5.0 < 15.0.1 - __exposedProps__ XCS Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2013-08-06'
    exploit_type: local
    platform: multiple
    source_date_updated: !!timestamp '2017-04-01'
    data_source: Exploit-DB
    source_url: https://github.com/rapid7/metasploit-framework/blob/72caeaa72f843ec3534e272427c3915ef498b2f9/modules/exploits/multi/browser/firefox_proto_crmfrequest.rb
    record_id: CVE-2013-1710
  - description: |
      On versions of Firefox from 5.0 to 15.0.1, the InstallTrigger global, when given
                invalid input, would throw an exception that did not have an __exposedProps__
                property set. By re-setting this property on the exception object's prototype,
                the chrome-based defineProperty method is made available.

                With the defineProperty method, functions belonging to window and document can be
                overridden with a function that gets called from chrome-privileged context. From here,
                another vulnerability in the crypto.generateCRMFRequest function is used to "peek"
                into the context's private scope. Since the window does not have a chrome:// URL,
                the insecure parts of Components.classes are not available, so instead the AddonManager
                API is invoked to silently install a malicious plugin.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-08-06'
    exploit_type:
    platform: Firefox,Java,Linux,OSX,Solaris,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/firefox_proto_crmfrequest.rb
    record_id: /modules/exploits/multi/browser/firefox_proto_crmfrequest.rb
  - description: |
      This exploit gains remote code execution on Firefox 15-22 by abusing two separate
                Javascript-related vulnerabilities to ultimately inject malicious Javascript code
                into a context running with chrome:// privileges.
    required_action:
    due_date:
