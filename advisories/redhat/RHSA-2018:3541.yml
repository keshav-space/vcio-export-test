advisory_id: RHSA-2018:3541
datasource_id: redhat/RHSA-2018:3541
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2018/rhsa-2018_3541.json
aliases:
  - CVE-2018-17456
summary: |
  An update for rh-git29-git is now available for Red Hat Software Collections.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Git is a distributed revision control system with a decentralized architecture. As opposed to centralized version control systems with a client-server model, Git ensures that each working copy of a Git repository is an exact copy with complete revision history. This not only allows the user to work on and contribute to projects without the need to have permission to push the changes to their official repositories, but also makes it possible for the user to work with no network connection.

  Security Fix(es):

  * git: arbitrary code execution via .gitmodules (CVE-2018-17456)

  For more details about the security issue(s), including the impact, a CVSS score, and other related information, refer to the CVE page(s) listed in the References section.
