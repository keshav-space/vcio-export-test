exploits:
  - description: Git Submodule - Arbitrary Code Execution
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2018-10-16'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2018-10-17'
    data_source: Exploit-DB
    source_url: https://gist.github.com/joernchen/38dd6400199a542bc9660ea563dcf2b6
    record_id: CVE-2018-17456
  - description: |
      This module exploits CVE-2018-17456, which affects Git
                versions 2.14.5, 2.15.3, 2.16.5, 2.17.2, 2.18.1, and 2.19.1 and lower.

                When a submodule url which starts with a dash e.g "-u./payload" is passed
                as an argument to git clone, the file "payload" inside the repository
                is executed.

                This module creates a fake git repository which contains a submodule
                containing the vulnerability. The vulnerability is triggered when the
                submodules are initialised (e.g git clone --recurse-submodules URL)
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - screen-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2018-10-05'
    exploit_type:
    platform: Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/git_submodule_url_exec.rb
    record_id: /modules/exploits/multi/http/git_submodule_url_exec.rb
