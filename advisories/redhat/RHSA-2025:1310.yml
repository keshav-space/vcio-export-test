advisory_id: RHSA-2025:1310
datasource_id: redhat/RHSA-2025:1310
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2025/rhsa-2025_1310.json
aliases:
  - CVE-2020-11023
summary: |
  An update for gcc is now available for Red Hat Enterprise Linux 8.2 Advanced Update Support.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The gcc packages provide compilers for C, C++, Java, Fortran, Objective C, and Ada 95 GNU, as well as related support libraries.

  Security Fix(es):

  * jquery: Untrusted code execution via <option> tag in HTML passed to DOM manipulation methods (CVE-2020-11023)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
