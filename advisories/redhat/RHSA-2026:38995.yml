summary: "An update for the go-toolset:rhel8 module is now available for Red Hat Enterprise\
  \ Linux 8.\n\nRed Hat Product Security has rated this update as having a security impact of\
  \ Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nGo Toolset provides the Go programming language tools and libraries. Go is alternatively\
  \ known as golang. \n\nSecurity Fix(es):\n\n* golang.org/x/net/idna: golang: golang.org/x/net/idna:\
  \ Privilege escalation via incorrect Punycode label processing (CVE-2026-39821)\n\n* crypto/x509:\
  \ golang: golang crypto/x509: Denial of Service via excessive processing of DNS SAN entries\
  \ (CVE-2026-27145)\n\n* os: golang: Go os.Root: Symlink following vulnerability allows directory\
  \ traversal (CVE-2026-39822)\n\nBug Fix(es) and Enhancement(s):\n\n* Update Go to version\
  \ 1.26.5+1 [rhel-8.10.z] (JIRA:RHEL-193478)\n\nFor more details about the security issue(s),\
  \ including the impact, a CVSS score, acknowledgments, and other related information, refer\
  \ to the CVE page(s) listed in the References section."
