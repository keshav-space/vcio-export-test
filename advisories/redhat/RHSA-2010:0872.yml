    record_id: CVE-2010-3847
  - description: glibc - 'LD_AUDIT' Arbitrary DSO Load Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2011-11-10'
    exploit_type: local
    platform: linux
