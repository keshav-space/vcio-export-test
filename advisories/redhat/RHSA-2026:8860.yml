summary: "An update for grafana is now available for Red Hat Enterprise Linux 8.6 Advanced Mission\
  \ Critical Update Support, Red Hat Enterprise Linux 8.6 Update Services for SAP Solutions,\
  \ and Red Hat Enterprise Linux 8.6 Telecommunications Update Service.\n\nRed Hat Product Security\
  \ has rated this update as having a security impact of Important. A Common Vulnerability Scoring\
  \ System (CVSS) base score, which gives a detailed severity rating, is available for each\
  \ vulnerability from the CVE link(s) in the References section.\n\nGrafana is an open source,\
  \ feature rich metrics dashboard and graph editor for Graphite, InfluxDB & OpenTSDB. \n\n\
  Security Fix(es):\n\n* net/url: Incorrect parsing of IPv6 host literals in net/url (CVE-2026-25679)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
