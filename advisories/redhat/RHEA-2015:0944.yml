datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2015/rhea-2015_0944.json
aliases:
  - CVE-2015-0298
summary: |
  Updated Red Hat JBoss Web Server 3.0.0 packages are now available for Red Hat Enterprise Linux 7.

  Red Hat JBoss Web Server is a fully integrated and certified set of
  components for hosting Java web applications. It is comprised of the Apache
  HTTP Server, the Apache Tomcat Servlet container, Apache Tomcat Connector
  (mod_jk), JBoss HTTP Connector (mod_cluster), Hibernate, and the Tomcat
  Native library.

  * This enhancement update adds the Red Hat JBoss Web Server 3.0.0 packages to Red Hat Enterprise Linux 7. These packages provide a number of enhancements over the previous version of Red Hat JBoss Web Server. (BZ#1164673)

  Users of Red Hat JBoss Web Server are advised to upgrade to these updated packages, which add this enhancement.
