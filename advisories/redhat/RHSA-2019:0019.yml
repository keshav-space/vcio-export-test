exploits:
  - description: "This module generates a remember me cookie for a valid username. Through unpropper\
      \ seeding \n        while userdate are requested from LDAP or OAuth it's possible to craft\
      \ a valid remember me cookie. \n        This cookie can be used for bypass authentication\
      \ for everyone knowing a valid username."
