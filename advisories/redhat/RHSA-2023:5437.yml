  - description: Google Chromium libvpx contains a heap buffer overflow vulnerability in vp8
      encoding that allows a remote attacker to potentially exploit heap corruption via a crafted
      HTML page. This vulnerability could impact web browsers using libvpx, including but not
      limited to Google Chrome.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
