    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2015-08-01'
    exploit_type: dos
    platform: multiple
    source_date_updated: !!timestamp '2017-09-18'
    data_source: Exploit-DB
    source_url: https://github.com/robertdavidgraham/cve-2015-5477/blob/34137c71a7fb4e3fa894b045583e67d7b46d62cc/tkill.c
    record_id: CVE-2015-5477
  - description: |
      This module sends a malformed TKEY query, which exploits an
                error in handling TKEY queries on affected BIND9 'named' DNS servers.
                As a result, a vulnerable named server will exit with a REQUIRE
                assertion failure. This condition can be exploited in versions of BIND
                between BIND 9.1.0 through 9.8.x, 9.9.0 through 9.9.7-P1 and 9.10.0
                through 9.10.2-P2.
    required_action:
    due_date:
