summary: |
  An updated Adobe Flash Player package that fixes three security issues is
  now available for Red Hat Enterprise Linux 5 and 6 Supplementary.

  The Red Hat Security Response Team has rated this update as having critical
  security impact. Common Vulnerability Scoring System (CVSS) base scores,
  which give detailed severity ratings, are available for each vulnerability
  from the CVE links in the References section.

  The flash-plugin package contains a Mozilla Firefox compatible Adobe Flash
  Player web browser plug-in.

  This update fixes two vulnerabilities in Adobe Flash Player. These
  vulnerabilities are detailed in the Adobe Security bulletin APSB13-08,
  listed in the References section. Specially-crafted SWF content could cause
  flash-plugin to crash or, potentially, execute arbitrary code when a victim
  loads a page containing the malicious SWF content. (CVE-2013-0504,
  CVE-2013-0648)

  This update also fixes a permissions issue with the Adobe Flash Player
  Firefox sandbox. (CVE-2013-0643)

  All users of Adobe Flash Player should install this updated package, which
  upgrades Flash Player to version 11.2.202.273.
