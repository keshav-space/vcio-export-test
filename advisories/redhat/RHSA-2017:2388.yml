exploits:
  - description: Evince 3.24.0 - Command Injection
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-11-13'
    exploit_type: dos
    platform: linux
    source_date_updated: !!timestamp '2019-02-11'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2017-1000083
  - description: |
      This module exploits a command injection vulnerability in Evince
                before version 3.24.1 when opening comic book `.cbt` files.

                Some file manager software, such as Nautilus and Atril, may allow
                automatic exploitation without user interaction due to thumbnailer
                preview functionality.

                Note that limited space is available for the payload (<256 bytes).
                Reverse Bash and Reverse Netcat payloads should be sufficiently small.

                This module has been tested successfully on evince versions:

                3.4.0-3.1 + nautilus 3.4.2-1+build1 on Kali 1.0.6;
                3.18.2-1ubuntu4.3 + atril 1.12.2-1ubuntu0.3 on Ubuntu 16.04.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2017-07-13'
    exploit_type:
    platform: Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/fileformat/evince_cbt_cmd_injection.rb
    record_id: /modules/exploits/multi/fileformat/evince_cbt_cmd_injection.rb
