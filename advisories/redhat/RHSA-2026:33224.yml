summary: |
  An update for kpatch-patch-5_14_0-687_10_1 is now available for Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  This is a kernel live patch module which can be loaded by the kpatch command line utility to modify the code of a running kernel.  This patch module is targeted for kernel-5.14.0-687.10.1.el9_8.

  Security Fix(es):

  * kernel: net/sched: act_pedit: extend the writable skb range per key (CVE-2026-46331)

  * kernel: Linux kernel: smb: client: reject userspace cifs.spnego descriptions (CVE-2026-46243)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
