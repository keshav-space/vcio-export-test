summary: "An update for buildah is now available for Red Hat Enterprise Linux 9.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  The buildah package provides a tool for facilitating building OCI container images. Among\
  \ other things, buildah enables you to: Create a working container, either from scratch or\
  \ using an image as a starting point; Create an image, either from a working container or\
  \ using the instructions in a Dockerfile; Build both Docker and OCI images. \n\nSecurity Fix(es):\n\
  \n* go/parser: golang: Calling any of the Parse functions containing deeply nested literals\
  \ can cause a panic/stack exhaustion (CVE-2024-34155)\n\n* encoding/gob: golang: Calling Decoder.Decode\
  \ on a message which contains deeply nested structures can cause a panic due to stack exhaustion\
  \ (CVE-2024-34156)\n\n* go/build/constraint: golang: Calling Parse on a \"// +build\" build\
  \ tag line with deeply nested expressions can cause a panic due to stack exhaustion (CVE-2024-34158)\n\
  \n* Podman: Buildah: cri-o: FIPS Crypto-Policy Directory Mounting Issue in containers/common\
  \ Go Library (CVE-2024-9341)\n\n* Buildah: Podman: Improper Input Validation in bind-propagation\
  \ Option of Dockerfile RUN --mount Instruction (CVE-2024-9407)\n\n* buildah: Buildah allows\
  \ arbitrary directory mount (CVE-2024-9675)\n\n* Podman: Buildah: CRI-O: symlink traversal\
  \ vulnerability in the containers/storage library can cause Denial of Service (DoS) (CVE-2024-9676)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
