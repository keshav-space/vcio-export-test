summary: |
  An update for libXpm is now available for Red Hat Enterprise Linux 8.2 Advanced Update Support, Red Hat Enterprise Linux 8.2 Telecommunications Update Service, and Red Hat Enterprise Linux 8.2 Update Services for SAP Solutions.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  X.Org X11 libXpm runtime library.

  Security Fix(es):

  * libXpm: compression commands depend on $PATH (CVE-2022-4883)

  * libXpm: Runaway loop on width of 0 and enormous height (CVE-2022-44617)

  * libXpm: Infinite loop on unclosed comments (CVE-2022-46285)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
