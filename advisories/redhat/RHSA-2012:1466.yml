exploits:
  - description: Java 7 Applet - Remote Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2012-08-27'
    exploit_type: remote
    platform: java
    source_date_updated: !!timestamp '2012-08-27'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2012-0547
  - description: Java - Web Start Double Quote Injection Remote Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-06-11'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2013-06-11'
    data_source: Exploit-DB
    source_url: http://pastebin.com/eUucVage
    record_id: CVE-2012-1533
  - description: |
      This module exploits a flaw in the Web Start component of the Sun Java
                Runtime Environment. Parameters initial-heap-size and max-heap-size in a JNLP
                file can contain a double quote which is not properly sanitized when creating
                the command line for javaw.exe. This allows the injection of the -XXaltjvm
                option to load a jvm.dll from a remote UNC path into the java process. Thus
                an attacker can execute arbitrary code in the context of a browser user.
                This flaw was fixed in Oct. 2012 and affects JRE <= 1.6.35 and <= 1.7.07.

                In order for this module to work, it must be run as root on a server that
                does not serve SMB (In most cases, this means non-Windows hosts). Additionally,
                the target host must have the WebClient service (WebDAV Mini-Redirector) enabled.
                Alternatively, a UNC path containing a jvm.dll can be specified, bypassing
                the Windows limitation for the Metasploit host.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-10-16'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/java_ws_double_quote.rb
    record_id: /modules/exploits/windows/browser/java_ws_double_quote.rb
  - description: |
      Some TLS implementations handle errors processing RSA key exchanges and
              encryption (PKCS #1 v1.5 messages) in a broken way that leads an
              adaptive chosen-chiphertext attack. Attackers cannot recover a server's
              private key, but they can decrypt and sign messages with it. A strong
              oracle occurs when the TLS server does not strictly check message
              formatting and needs less than a million requests on average to decode
              a given ciphertext. A weak oracle server strictly checks message
              formatting and often requires many more requests to perform the attack.

              This module requires Python 3 with the gmpy2 and cryptography packages
              to be present.
    required_action:
    due_date:
    notes: |
      AKA:
        - ROBOT
        - Adaptive chosen-ciphertext attack
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2009-06-17'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/ssl/bleichenbacher_oracle.py
    record_id: /modules/auxiliary/scanner/ssl/bleichenbacher_oracle.py
