summary: |
  Updated images are now available for Red Hat Ansible Automation Platform 2.1, which include new features, bug fixes, and enhancements for Red Hat Ansible Automation Platform integration with Red Hat Developer Hub.

  Red Hat Ansible Automation Platform 2.1 delivers an Ansible-first Red Hat Developer Hub
  user experience that simplifies the automation experience for Ansible users of all skill levels.
  The Ansible plug-ins provide curated content and features to accelerate Ansible learner
  onboarding and streamline Ansible use case adoption across your organization.
