summary: |
  An update for the perl-DBI:1.641 module is now available for Red Hat Enterprise Linux 8.

  Red Hat Product Security has rated this update as having a security impact of
  Important. A Common Vulnerability Scoring System (CVSS) base score, which gives
  a detailed severity rating, is available for each vulnerability from the CVE
  link(s) in the References section.

  The perl-DBI package provides the standard database interface module for the
  Perl programming language. It implements a database-independent interface,
  meaning it defines a consistent set of methods, variables, and conventions for
  database operations.

  Security Fix(es):

  * DBI: Heap overflow when preparsing SQL statements with excessive placeholders (CVE-2026-14739)

  * DBI: Arbitrary code execution via caller-influenced Profile attribute (CVE-2026-14380)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
