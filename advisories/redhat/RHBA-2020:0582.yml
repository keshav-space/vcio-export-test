advisory_id: RHBA-2020:0582
datasource_id: redhat/RHBA-2020:0582
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2020/rhba-2020_0582.json
aliases:
  - CVE-2020-10696
summary: |
  Red Hat OpenShift Container Platform release 4.4.3 is now available with
  updates to packages and images that fix several bugs and add enhancements.

  Red Hat OpenShift Container Platform is Red Hat's cloud computing
  Kubernetes application platform solution designed for on-premise or private
  cloud deployments.

  This advisory contains the RPM packages for Red Hat
  OpenShift Container Platform 4.4.3. See the following advisory for the
  container images for this release:

  https://access.redhat.com/errata/RHBA-2020:0581

  Space precludes documenting all of the bug fixes and enhancements in this
  advisory, as well as all of the container images in this advisory. See the
  following Release Notes documentation, which will be updated shortly for
  this release, for details about these changes:

  https://docs.openshift.com/container-platform/4.4/release_notes/ocp-4-4-release-notes.html

  All OpenShift Container Platform 4.4 users are advised to upgrade to these
  updated packages and images.
