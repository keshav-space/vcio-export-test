summary: |
  New Red Hat build of Cryostat 3.0.0 on RHEL 8 container images are now available.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  New Red Hat build of Cryostat 3.0.0 on RHEL 8 container images have been released, adding a variety of features and bug fixes.

  Users of the Red Hat build of Cryostat 2.4.0 on RHEL 8 container images are advised to upgrade to these updated images, which contain backported patches to fix these bugs and add these enhancements. Users of these images are also encouraged to rebuild all container images that depend on these images.

  Security Fix(es):

  * org.bouncycastle-bcprov-jdk18on: BouncyCastle vulnerable to a timing variant of Bleichenbacher (Marvin Attack) (CVE-2024-30171)

  You can find images updated by this advisory in the Red Hat Container Catalog (see the References section).
