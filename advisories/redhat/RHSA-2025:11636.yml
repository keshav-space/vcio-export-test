summary: |
  A new image is available for Red Hat Single Sign-On 7.6.12, running on OpenShift Container Platform 3.10 and 3.11, and 4.3.

  Red Hat Single Sign-On is an integrated sign-on solution, available as a
  Red Hat JBoss Middleware for OpenShift containerized image. The Red Hat
  Single Sign-On for OpenShift image provides an authentication server that
  you can use to log in centrally, log out, and register. You can also manage
  user accounts for web applications, mobile applications, and RESTful web
  services.

  This erratum releases a new image for Red Hat Single Sign-On 7.6.12 for
  use within the OpenShift Container Platform 3.10, OpenShift Container Platform
  3.11, and within the OpenShift Container Platform 4.3 cloud computing Platform-as-a-Service (PaaS) for on-premise or private cloud deployments, aligning with the standalone product release. This security update has moderate impact.

  Security fixes:
  * org.wildfly.core/wildfly-core-management-client: Wildfly vulnerable to Cross-Site Scripting (XSS) (CVE-2024-10234)
