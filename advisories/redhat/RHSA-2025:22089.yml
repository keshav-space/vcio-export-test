summary: |
  New Red Hat build of Keycloak 26.2.11 packages are available from the Customer Portal

  Red Hat build of Keycloak 26.2.11 is a standalone server, based on the Keycloak project, that provides authentication and standards-based single sign-on capabilities for web and mobile applications.

  Security fixes:
  * Deserialization of Untrusted Data in LDAP User Federation (CVE-2025-13467)
