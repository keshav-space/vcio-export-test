summary: |
  Red Hat OpenShift Container Platform release 4.7.48 is now available with
  updates to packages and images that fix several bugs and add enhancements.

  This release includes a security update for Red Hat OpenShift Container Platform 4.7.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  CVE-2022-25173 CVE-2022-25174 CVE-2022-25175 CVE-2022-25181 CVE-2022-25182 CVE-2022-25183 CVE-2022-25176 CVE-2022-25177 CVE-2022-25178 CVE-2022-25179 CVE-2022-25180 CVE-2022-25184"

  Red Hat OpenShift Container Platform is Red Hat's cloud computing
  Kubernetes application platform solution designed for on-premise or private
  cloud deployments.

  This advisory contains the RPM packages for Red Hat OpenShift Container Platform 4.7.48. See the following advisory for the container images for this release:

  https://access.redhat.com/errata/RHBA-2022:1249

  Security Fix(es):

  * workflow-cps: OS command execution through crafted SCM contents
  (CVE-2022-25173)
  * workflow-cps-global-lib: OS command execution through crafted SCM
  contents (CVE-2022-25174)
  * workflow-multibranch: OS command execution through crafted SCM contents
  (CVE-2022-25175)
  * workflow-cps-global-lib: Sandbox bypass vulnerability (CVE-2022-25181)
  * workflow-cps-global-lib: Sandbox bypass vulnerability (CVE-2022-25182)
  * workflow-cps-global-lib: Sandbox bypass vulnerability (CVE-2022-25183)
  * workflow-cps: Pipeline-related plugins follow symbolic links or do not
  limit path names (CVE-2022-25176)
  * workflow-cps-global-lib: Pipeline-related plugins follow symbolic links
  or do not limit path names (CVE-2022-25177)
  * workflow-cps-global-lib: Pipeline-related plugins follow symbolic links
  or do not limit path names (CVE-2022-25178)
  * workflow-multibranch: Pipeline-related plugins follow symbolic links or
  do not limit path names (CVE-2022-25179)
  * workflow-cps: Password parameters are included from the original build in
  replayed builds (CVE-2022-25180)
  * pipeline-build-step: Password parameter default values exposed
  (CVE-2022-25184)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE
  page(s) listed in the References section.

  All OpenShift Container Platform 4.7 users are advised to upgrade to these updated packages and images when they are available in the appropriate release channel. To check for available updates, use the OpenShift Console or the CLI oc command. Instructions for upgrading a cluster are available at https://docs.openshift.com/container-platform/4.7/updating/updating-cluster-cli.html
