  - description: JQuery contains a persistent cross-site scripting (XSS) vulnerability. When
      passing maliciously formed, untrusted input enclosed in HTML tags, JQuery's DOM manipulators
      can execute untrusted code in the context of the user's browser.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2025-02-13'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
