    record_id: /modules/exploits/multi/http/tomcat_partial_put_deserialization.rb
  - description: Apache Tomcat contains a path equivalence vulnerability that allows a remote
      attacker to execute code, disclose information, or inject malicious content via a partial
      PUT request. This vulnerability can be chained with CVE‑2026‑34486.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
