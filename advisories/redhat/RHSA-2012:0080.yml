exploits:
  - description: Mozilla Firefox 8/9 - 'AttributeChildRemoved()' Use-After-Free (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2012-05-13'
    exploit_type: remote
    platform: windows
    source_date_updated: !!timestamp '2012-05-13'
    data_source: Exploit-DB
    source_url: http://www.zerodayinitiative.com/advisories/upcoming/ZDI-CAN-1413
    record_id: CVE-2011-3659
  - description: |
      This module exploits a use-after-free vulnerability in Firefox 8/8.0.1 and 9/9.0.1.
                Removal of child nodes from the nsDOMAttribute can allow for a child
                to still be accessible after removal due to a premature notification
                of AttributeChildRemoved. Since mFirstChild is not set to NULL until
                after this call is made, this means the removed child will be accessible
                after it has been removed. By carefully manipulating the memory layout,
                this can lead to arbitrary code execution.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
