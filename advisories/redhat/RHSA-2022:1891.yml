summary: "An update for libpq is now available for Red Hat Enterprise Linux 8.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Low. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nThe libpq package\
  \ provides the PostgreSQL client library, which allows client programs to connect to PostgreSQL\
  \ servers. \n\nSecurity Fix(es):\n\n* postgresql: libpq processes unencrypted bytes from man-in-the-middle\
  \ (CVE-2021-23222)\n\nFor more details about the security issue(s), including the impact,\
  \ a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed\
  \ in the References section.\n\nAdditional Changes:\n\nFor detailed information on changes\
  \ in this release, see the Red Hat Enterprise Linux 8.6 Release Notes linked from the References\
  \ section."
