summary: |
  An update for java-17-openjdk is now available for Red Hat Enterprise Linux 9.0 Update Services for SAP Solutions, Red Hat Enterprise Linux 8.6 Advanced Mission Critical Update Support, Red Hat Enterprise Linux 8.6 Update Services for SAP Solutions, Red Hat Enterprise Linux 8.6 Telecommunications Update Service, Red Hat Enterprise Linux 8.4 Advanced Mission Critical Update Support, Red Hat Enterprise Linux 8.4 Update Services for SAP Solutions, Red Hat Enterprise Linux 8.4 Telecommunications Update Service, Red Hat Enterprise Linux 8, Red Hat Enterprise Linux 8.8 Extended Update Support, Red Hat Enterprise Linux 9.2 Extended Update Support, Red Hat Enterprise Linux 9.4 Extended Update Support, Red Hat Enterprise Linux 9.6 Extended Update Support, and Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The java-17-openjdk packages provide the OpenJDK 17 Java Runtime Environment and the OpenJDK 17 Java Software Development Kit.

  Security Fix(es):

  * JDK: Enhance crypto algorithm support (CVE-2026-22007)

  * JDK: Improve Kerberos credentialing (CVE-2026-22013)

  * JDK: Enhance Path Factories Redux (CVE-2026-22016)

  * JDK: Enhance Zip file reading (CVE-2026-22018)

  * JDK: Enhance certificate chain validation (CVE-2026-22021)

  * JDK: Updating FreeType 2.14.1 (CVE-2026-23865)

  * JDK: Enhance TLS connection handling (CVE-2026-34282)

  * JDK: Enhance key generation (CVE-2026-34268)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
