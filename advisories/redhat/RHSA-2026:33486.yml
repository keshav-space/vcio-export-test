exploits:
  - description: |
      CVE-2026-31431 is a logic flaw in the Linux kernel's authencesn AEAD template that, when reached via the
                AF_ALG socket interface combined with splice(), allows an unprivileged local user to perform a controlled
                4-byte write into the page cache of any readable file. Because the corrupted pages are never marked dirty, the
                on-disk file is unchanged but the in-memory version is immediately visible system-wide, enabling local
                privilege escalation by injecting shellcode into the page cache of a setuid-root binary such as /usr/bin/su.
                The vulnerability was introduced by an in-place optimization in algif_aead.c (commit 72548b093ee3, 2017) and
                affects essentially all major Linux distributions shipped since then until the fix in commit a664bf3d603d.
    required_action:
    due_date:
    notes: |
      AKA:
        - Copy Fail
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects: []
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2026-04-29'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/cve_2026_31431_copy_fail.rb
    record_id: /modules/exploits/linux/local/cve_2026_31431_copy_fail.rb
  - description: |
      CVE-2026-43284 is a Linux kernel page-cache write vulnerability in the IPsec/xfrm
                subsystem affecting ESP (Encapsulating Security Payload) fragmentation. Dubbed
                "DirtyFrag", the bug allows a local unprivileged user to gain write access to read-only
                page-cache pages by triggering a race condition in how the kernel handles shared fragments
                when processing ESP-encapsulated UDP packets. The exploit overwrites a SUID binary on disk
                to execute an arbitrary payload as root.
    required_action:
    due_date:
    notes: |
      Reliability:
        - repeatable-session
      Stability:
        - crash-os-down
      SideEffects:
        - artifacts-on-disk
        - config-changes
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2026-05-08'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/cve_2026_43284_dirty_frag.rb
    record_id: /modules/exploits/linux/local/cve_2026_43284_dirty_frag.rb
  - description: |
      This module exploits CVE-2026-46300, a Linux kernel local privilege
                escalation vulnerability introduced in version 4.10. The flaw resides in the kernel's IPsec
                ESP-in-TCP handling: when an ESP-encapsulated TCP segment containing a
                shared fragment (SKBFL_SHARED_FRAG) is received and decrypted, the AES-GCM keystream
                is applied to page cache pages of the target file without enforcing
                write permissions. This allows an unprivileged attacker to overwrite
                arbitrary bytes of a read-only file backed by the page cache. Upstream fix is ported
                independently by different vendors, so there's release version from which each kernel is
                not vulnerable anymore.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-service-down
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
