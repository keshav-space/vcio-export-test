aliases:
  - CVE-2025-11234
summary: |
  An update for qemu-kvm is now available for Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Kernel-based Virtual Machine (KVM) is a full virtualization solution for Linux on a variety of architectures. The qemu-kvm packages provide the user-space component for running virtual machines that use KVM.

  Security Fix(es):

  * qemu-kvm: VNC WebSocket handshake use-after-free (CVE-2025-11234)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  Additional Changes:

  For detailed information on changes in this release, see the Red Hat Enterprise Linux 9 Release Notes linked from the References section.
