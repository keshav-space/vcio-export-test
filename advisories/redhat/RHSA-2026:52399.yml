summary: "An update for the nodejs:22 module is now available for Red Hat Enterprise Linux 9.6\
  \ Extended Update Support.\n\nRed Hat Product Security has rated this update as having a security\
  \ impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives\
  \ a detailed severity rating, is available for each vulnerability from the CVE link(s) in\
  \ the References section.\n\nNode.js is a software development platform for building fast\
  \ and scalable network applications in the JavaScript programming language. \n\nSecurity Fix(es):\n\
  \n* ip-address: ip-address: Cross-site scripting via improper HTML escaping of untrusted input\
  \ (CVE-2026-42338)\n\n* undici: undici: Denial of Service due to unbounded memory growth via\
  \ WebSocket frames (CVE-2026-12151)\n\n* nodejs: Node.js WebCrypto: Denial of Service via\
  \ large input to subtle.encrypt() (CVE-2026-48933)\n\n* nodejs: Node.js: Information disclosure\
  \ of proxy credentials via proxy tunnel error handling (CVE-2026-48615)\n\n* nodejs: Node.js:\
  \ Authentication bypass due to TLS hostname handling and unicode dot separator mismatch (CVE-2026-48618)\n\
  \n* brace-expansion: Brace-expansion: Denial of Service due to exponential-time complexity\
  \ (CVE-2026-13149)\n\n* tar: Node-tar: Denial of Service via malformed tar archive header\
  \ (CVE-2026-59874)\n\n* tar: node-tar: Denial of Service via crafted gzip bomb (CVE-2026-59873)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
