summary: |
  An update for compat-glibc is now available for Red Hat Enterprise Linux 7 Extended Lifecycle Support.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  This package contains stub shared libraries and static libraries from Red Hat Enterprise Linux 6.  To compile and link against these compatibility libraries, use gcc -fgnu89-inline \
        -I /usr/lib/ppc-redhat-linux6E/include \
        -B /usr/lib/ppc-redhat-linux6E/lib/

  Security Fix(es):

  * glibc: glibc: Heap Buffer Overflow in `scanf` with `%mc` format specifier and large width (CVE-2026-5450)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
