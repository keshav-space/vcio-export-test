exploits:
  - description: Linux 4.8.0 < 4.8.0-46 - AF_PACKET packet_set_ring Privilege Escalation (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-05-18'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2018-05-18'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/6594cbb5ccd3f0b6a3db4300a01491f972ef01c0/modules/exploits/linux/local/af_packet_packet_set_ring_priv_esc.rb
    record_id: CVE-2017-7308
  - description: |
      This module exploits a heap-out-of-bounds write in the packet_set_ring
                function in net/packet/af_packet.c (AF_PACKET) in the Linux kernel
                to execute code as root (CVE-2017-7308).

                The bug was initially introduced in 2011 and patched in version 4.10.6,
                potentially affecting a large number of kernels; however this exploit
                targets only systems using Ubuntu Xenial kernels 4.8.0 < 4.8.0-46,
                including Linux distros based on Ubuntu Xenial, such as Linux Mint.

                The target system must have unprivileged user namespaces enabled and
                two or more CPU cores.

                Bypasses for SMEP, SMAP and KASLR are included. Failed exploitation
                may crash the kernel.

                This module has been tested successfully on Linux Mint 18 (x86_64)
                with kernel versions:

                4.8.0-34-generic;
                4.8.0-36-generic;
                4.8.0-39-generic;
                4.8.0-41-generic;
                4.8.0-42-generic;
                4.8.0-44-generic;
                4.8.0-45-generic.
    required_action:
    due_date:
    notes: |
      Reliability:
        - repeatable-session
      Stability:
        - crash-os-down
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
