  - description: Java - Web Start Double Quote Injection Remote Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2013-06-11'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2013-06-11'
    data_source: Exploit-DB
    source_url: http://pastebin.com/eUucVage
    record_id: CVE-2012-1533
  - description: |
      This module exploits a flaw in the Web Start component of the Sun Java
                Runtime Environment. Parameters initial-heap-size and max-heap-size in a JNLP
                file can contain a double quote which is not properly sanitized when creating
                the command line for javaw.exe. This allows the injection of the -XXaltjvm
                option to load a jvm.dll from a remote UNC path into the java process. Thus
                an attacker can execute arbitrary code in the context of a browser user.
                This flaw was fixed in Oct. 2012 and affects JRE <= 1.6.35 and <= 1.7.07.

                In order for this module to work, it must be run as root on a server that
                does not serve SMB (In most cases, this means non-Windows hosts). Additionally,
                the target host must have the WebClient service (WebDAV Mini-Redirector) enabled.
                Alternatively, a UNC path containing a jvm.dll can be specified, bypassing
                the Windows limitation for the Metasploit host.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-10-16'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/java_ws_double_quote.rb
    record_id: /modules/exploits/windows/browser/java_ws_double_quote.rb
  - description: The default Java security properties configuration did not restrict access
      to the com.sun.org.glassfish.external and com.sun.org.glassfish.gmbal packages. An untrusted
      Java application or applet could use these flaws to bypass Java sandbox restrictions.
    required_action: Apply updates per vendor instructions.
