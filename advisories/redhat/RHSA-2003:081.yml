summary: "Updated zlib packages that fix a buffer overflow vulnerability are now\navailable.\n\
  \nZlib is a general-purpose, patent-free, lossless data compression\nlibrary that is used\
  \ by many different programs.\n\nThe function gzprintf within zlib, when called with a string\
  \ longer than\nZ_PRINTF_BUFZISE (= 4096 bytes), can overflow without giving a warning. \n\n\
  zlib-1.1.4 and earlier exhibit this behavior. There are no known exploits\nof the gzprintf\
  \ overrun, and only a few programs, including rpm2html\nand gimp-print, are known to use the\
  \ gzprintf function.\n\nThe problem has been fixed by checking the length of the output string\n\
  within gzprintf."
