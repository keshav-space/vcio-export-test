summary: "An update for openshift-enterprise-builder-container is now available for Red Hat\
  \ OpenShift Container Platform 4.1.\n\nRed Hat Product Security has rated this update as having\
  \ a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score,\
  \ which gives a detailed severity rating, is available for each vulnerability from the CVE\
  \ link(s) in the References section.\n\nRed Hat OpenShift Container Platform is Red Hat's\
  \ cloud computing\nKubernetes application platform solution designed for on-premise or private\n\
  cloud deployments.\n\nThis advisory contains the openshift-enterprise-builder container image\
  \ for Red Hat OpenShift Container Platform 4.1.20. \n\nSecurity Fix(es):\n\n* atomic-openshift:\
  \ OpenShift builds don't verify SSH Host Keys for the git repository (CVE-2019-10150)\n\n\
  * containers/image: not enforcing TLS when sending username+password credentials to token\
  \ servers leading to credential disclosure (CVE-2019-10214)\n\nFor more details about the\
  \ security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
