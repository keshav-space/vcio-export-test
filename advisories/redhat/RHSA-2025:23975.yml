  - description: Google Chromium contains an out of bounds memory access vulnerability in ANGLE
      that could allow a remote attacker to perform out of bounds memory access via a crafted
      HTML page. This vulnerability could affect multiple web browsers that utilize Chromium,
      including, but not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
