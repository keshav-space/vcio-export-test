  Important: Red Hat OpenShift GitOps v1.21.1 security update

  An update is now available for Red Hat OpenShift GitOps.
  Bug Fix(es) and Enhancement(s):
  * GITOPS-10083 (RC 1.21.0-7: Missing permission for web-based terminal in Argocd  UI)
  * GITOPS-10178 (OpenShift GitOps operator v1.21.0 breaks Redis-HA replication when upgrading from v1.20.4)
  * GITOPS-10273 (GitOps Operator metrics alert after upgrade: ServiceMonitor expects HTTPS but metrics endpoint serves HTTP on port 8443)
  * GITOPS-9971 ([Image Updater] Self-hosted Quay images redirect to quay.io, not self-hosted URL )
