advisory_id: RHSA-2019:1619
datasource_id: redhat/RHSA-2019:1619
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2019/rhsa-2019_1619.json
aliases:
  - CVE-2019-12735
summary: |
  An update for vim is now available for Red Hat Enterprise Linux 7 and Red Hat Enterprise Linux 8.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Vim (Vi IMproved) is an updated and improved version of the vi editor.

  Security Fix(es):

  * vim/neovim: ':source!' command allows arbitrary command execution via modelines (CVE-2019-12735)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
