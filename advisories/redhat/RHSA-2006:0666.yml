advisory_id: RHSA-2006:0666
datasource_id: redhat/RHSA-2006:0666
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2006/rhsa-2006_0666.json
aliases:
  - CVE-2006-3739
  - CVE-2006-3740
summary: "Updated XFree86 packages that fix a security issue are now available for Red\nHat\
  \ Enterprise Linux 2.1 and 3.\n\nThis update has been rated as having important security impact\
  \ by the Red\nHat Security Response Team.\n\nXFree86 is an implementation of the X Window\
  \ System, which provides the\ncore functionality for the Linux graphical desktop.\n\niDefense\
  \ reported two integer overflow flaws in the way the XFree86 server\nprocessed CID font files.\
  \ A malicious authorized client could exploit this\nissue to cause a denial of service (crash)\
  \ or potentially execute arbitrary\ncode with root privileges on the XFree86 server. (CVE-2006-3739,\n\
  CVE-2006-3740) \n\nUsers of XFree86 should upgrade to these updated packages, which contain\
  \ a\nbackported patch and is not vulnerable to this issue."
