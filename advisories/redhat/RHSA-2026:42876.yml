summary: |
  An update for java-1.8.0-openjdk is now available for Red Hat Enterprise Linux 7 Extended Lifecycle Support.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The java-1.8.0-openjdk packages provide the OpenJDK 8 Java Runtime Environment and the OpenJDK 8 Java Software Development Kit.

  Security Fix(es):

  * JDK: Enhance TLS certificate handling (CVE-2026-46968)

  * JDK: Enhance JPEG handling (CVE-2026-47010)

  * JDK: Enhance XBM image support (CVE-2026-47021)

  * JDK: Enhance Jar file processing (CVE-2026-47027)

  * JDK: Improve certification checking (CVE-2026-60147)

  * JDK: Enhance AWT ImagingLib (CVE-2026-47059)

  * JDK: Enhance Jar handling (CVE-2026-47063)

  * JDK: Improve Nashorn index handling (CVE-2026-47057)

  * JDK: Enhance Dataview Implementation (CVE-2026-47058)

  * JDK: Update LCMS to 2.19 (CVE-2026-41254)

  Enhancements:

  * For the last couple of years, OpenJDK has used a single build shared among multiple RPMs and a tarball available on the customer portal.  The single "portable" build has a release number ('p') and each RPM has its own release number ('r').  However, the RPM naming only showed the RPM release number, while the version output from the build showed the portable release number, making it unclear that they were different numbers.  From this release onwards, a release field of the form 'p.r' is always used for RPMs and the version output shows 'p'. (RHEL-212138)

  Bug Fix(es):

  * In previous releases, the RPM did not correctly own the subdirectories used for documentation in /usr/share/doc and /usr/share/javadoc.  This is fixed in this release, so these subdirectories will be removed when the package is uninstalled. (RHEL-212148)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
