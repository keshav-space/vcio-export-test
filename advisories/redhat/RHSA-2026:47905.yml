summary: |
  An update for multiple packages is now available for Red Hat Enterprise Linux 10.0 Extended Update Support.

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The container-selinux package provides SELinux policies for container runtimes.

  Security Fix(es):

  * crun: crun: Privilege escalation due to incorrect parsing of the `--user` option (CVE-2026-30892)

  Bug Fix(es) and Enhancement(s):

  * [rhel-10.0.z] avc: denied { prog_run } for pid=1 comm="systemd" scontext=system_u:system_r:init_t:s0 tcontext=unconfined_u:unconfined_r:container_runtime_t:s0 tclass=bpf (JIRA:RHEL-210644)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
