summary: |
  Updated Red Hat Enterprise Linux AI 3.4.1 container disk images are now available.

  Red Hat® Enterprise Linux® AI is a foundation model platform to seamlessly develop, test, and run Granite family large language models (LLMs) for enterprise applications.

  This update provides the latest Red Hat Enterprise Linux AI 3.4.1 container disk images for use with OpenShift Virtualization.

  For a full list of changes in this release, see the Red Hat Enterprise Linux AI Release Notes linked in the References section.
