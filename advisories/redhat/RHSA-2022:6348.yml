summary: "Gatekeeper Operator v0.2 security updates\n\nRed Hat Product Security has rated this\
  \ update as having a security impact\nof Moderate. A Common Vulnerability Scoring System (CVSS)\
  \ base score,\nwhich gives a detailed severity rating, is available for each vulnerability\n\
  from the CVE link(s) in the References section.\n\nGatekeeper Operator v0.2\n\nGatekeeper\
  \ is an open source project that applies the OPA Constraint\nFramework to enforce policies\
  \ on your Kubernetes clusters. \n\nThis advisory contains the container images for Gatekeeper\
  \ that include bug\nfixes and container upgrades. \n\nNote: Gatekeeper support from the Red\
  \ Hat support team is limited to where it is integrated and used with Red Hat Advanced Cluster\
  \ Management\nfor Kubernetes. For support options for any other use, see the Gatekeeper\n\
  open source project website at:\nhttps://open-policy-agent.github.io/gatekeeper/website/docs/howto/.\n\
  \nSecurity fix:\n\n* CVE-2022-30629: gatekeeper-container: golang: crypto/tls: session tickets\
  \ lack random ticket_age_add\n\n* CVE-2022-1705: golang: net/http: improper sanitization of\
  \ Transfer-Encoding header\n\n* CVE-2022-1962: golang: go/parser: stack exhaustion in all\
  \ Parse* functions\n\n* CVE-2022-28131: golang: encoding/xml: stack exhaustion in Decoder.Skip\n\
  \n* CVE-2022-30630: golang: io/fs: stack exhaustion in Glob\n\n* CVE-2022-30631: golang: compress/gzip:\
  \ stack exhaustion in Reader.Read\n\n* CVE-2022-30632: golang: path/filepath: stack exhaustion\
  \ in Glob\n\n* CVE-2022-30635: golang: encoding/gob: stack exhaustion in Decoder.Decode\n\n\
  * CVE-2022-30633 golang: encoding/xml: stack exhaustion in Unmarshal\n\n* CVE-2022-32148 golang:\
  \ net/http/httputil: NewSingleHostReverseProxy - omit X-Forwarded-For not working"
