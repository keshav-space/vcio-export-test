  - CVE-2021-29922
summary: "An update for the rust-toolset:rhel8 module is now available for Red Hat Enterprise\
  \ Linux 8.\n\nRed Hat Product Security has rated this update as having a security impact of\
  \ Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nRust Toolset provides the Rust programming language compiler rustc, the cargo\
  \ build tool and dependency manager, and required libraries. \n\nThe following packages have\
  \ been upgraded to a later upstream version: rust (1.54.0). (BZ#1945805)\n\nSecurity Fix(es):\n\
  \n* rust: incorrect parsing of extraneous zero characters at the beginning of an IP address\
  \ string (CVE-2021-29922)\n\nFor more details about the security issue(s), including the impact,\
  \ a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed\
  \ in the References section.\n\nAdditional Changes:\n\nFor detailed information on changes\
  \ in this release, see the Red Hat Enterprise Linux 8.5 Release Notes linked from the References\
  \ section."
