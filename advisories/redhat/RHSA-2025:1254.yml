exploits:
  - description: Linux kernel contains an out-of-bounds write vulnerability in the uvc_parse_streaming
      component of the USB Video Class (UVC) driver that could allow for physical escalation
      of privilege.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2025-02-26'
    notes: 'This vulnerability affects a common open-source component, third-party library,
