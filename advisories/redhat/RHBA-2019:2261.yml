summary: |
  An update for webkitgtk4 is now available for Red Hat Enterprise Linux 7.

  WebKitGTK+ is a full-featured port of the WebKit portable web rendering engine to the GTK+ platform. These packages provide WebKitGTK+ for GTK+ 3.

  For detailed information on changes in this release, see the Red Hat Enterprise Linux 7.7 Release Notes linked from the References section.

  Users of webkitgtk4 are advised to upgrade to these updated packages.
