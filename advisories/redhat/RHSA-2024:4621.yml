aliases:
  - CVE-2024-39936
summary: "An update for qt5-qtbase is now available for Red Hat Enterprise Linux 8.4 Advanced\
  \ Mission Critical Update Support, Red Hat Enterprise Linux 8.4 Telecommunications Update\
  \ Service, and Red Hat Enterprise Linux 8.4 Update Services for SAP Solutions.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  Qt is a software toolkit for developing applications. The qt5-base packages contain base tools\
  \ for string, xml, and network handling in Qt. \n\nSecurity Fix(es):\n\n* qtbase: qtbase:\
  \ Delay any communication until encrypted() can be responded to (CVE-2024-39936)\n\nFor more\
  \ details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer the CVE page(s) listed in the References section."
