    record_id: /modules/exploits/linux/local/vmwgfx_fd_priv_esc.rb
  - description: Android kernel contains a race condition, which allows for a use-after-free
      vulnerability. Exploitation can allow for privilege escalation.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-06-13'
