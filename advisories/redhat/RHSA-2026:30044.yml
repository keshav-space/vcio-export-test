advisory_id: RHSA-2026:30044
datasource_id: redhat/RHSA-2026:30044
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2026/rhsa-2026_30044.json
aliases:
  - CVE-2026-10118
summary: |
  An update for poppler is now available for Red Hat Enterprise Linux 7 Extended Lifecycle Support.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Poppler is a Portable Document Format (PDF) rendering library, used by applications such as Evince.

  Security Fix(es):

  * poppler: Integer overflow in Poppler SplashOutputDev::tilingPatternFill leads to heap buffer overflow via unchecked dimension multiplication (CVE-2026-10118)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
