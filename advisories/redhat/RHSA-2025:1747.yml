exploits:
  - description: |
      MobileIron Core is affected by the Log4Shell vulnerability whereby a JNDI string sent to the server
              will cause it to connect to the attacker and deserialize a malicious Java object. This results in OS
              command execution in the context of the tomcat user.

              This module will start an LDAP server that the target will need to connect to.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
      RelatedModules:
        - auxiliary/scanner/http/log4shell_scanner
        - exploit/multi/http/log4shell_header_injection
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-12'
    exploit_type:
    platform: Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/http/mobileiron_core_log4shell.rb
    record_id: /modules/exploits/linux/http/mobileiron_core_log4shell.rb
  - description: |
      This exploit takes advantage of the StringSubstitutor interpolator class,
                which is included in the Commons Text library. A default interpolator
                allows for string lookups that can lead to Remote Code Execution. This
                is due to a logic flaw that makes the "script", "dns" and "url" lookup
                keys interpolated by default, as opposed to what it should be, according
                to the documentation of the StringLookupFactory class. Those keys allow
                an attacker to execute arbitrary code via lookups primarily using the
                "script" key.

                In order to exploit the vulnerabilities, the following requirements must
                be met:

                Run a version of Apache Commons Text from version 1.5 to 1.9
                Use the StringSubstitutor interpolator
                Target should run JDK < 15
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-10-13'
    exploit_type:
    platform: Java,Linux,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/apache_commons_text4shell.rb
    record_id: /modules/exploits/multi/http/apache_commons_text4shell.rb
  - description: |
      Versions of Apache Log4j2 impacted by CVE-2021-44228 which allow JNDI features used in configuration,
              log messages, and parameters, do not protect against attacker controlled LDAP and other JNDI related endpoints.

              This module will exploit an HTTP end point with the Log4Shell vulnerability by injecting a format message that
              will trigger an LDAP connection to Metasploit and load a payload.

              The Automatic target delivers a Java payload using remote class loading. This requires Metasploit to run an HTTP
              server in addition to the LDAP server that the target can connect to. The targeted application must have the
              trusted code base option enabled for this technique to work.

              The non-Automatic targets deliver a payload via a serialized Java object. This does not require Metasploit to
              run an HTTP server and instead leverages the LDAP server to deliver the serialized object. The target
              application in this case must be compatible with the user-specified JAVA_GADGET_CHAIN option.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
      RelatedModules:
        - auxiliary/scanner/http/log4shell_scanner
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-09'
    exploit_type:
    platform: Java,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/log4shell_header_injection.rb
    record_id: /modules/exploits/multi/http/log4shell_header_injection.rb
  - description: |
      The PyTorch model server contains multiple vulnerabilities that can be chained together to permit an
              unauthenticated remote attacker arbitrary Java code execution. The first vulnerability is that the management
              interface is bound to all IP addresses and not just the loop back interface as the documentation suggests. The
              second vulnerability (CVE-2023-43654) allows attackers with access to the management interface to register MAR
              model files from arbitrary servers. The third vulnerability is that when an MAR file is loaded, it can contain a
              YAML configuration file that when deserialized by snakeyaml, can lead to loading an arbitrary Java class.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2023-10-03'
    exploit_type:
    platform: Java
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/torchserver_cve_2023_43654.rb
    record_id: /modules/exploits/multi/http/torchserver_cve_2023_43654.rb
  - description: |
      The Ubiquiti UniFi Network Application versions 5.13.29 through 6.5.53 are affected by the Log4Shell
              vulnerability whereby a JNDI string can be sent to the server via the 'remember' field of a POST request to the
              /api/login endpoint that will cause the server to connect to the attacker and deserialize a malicious Java
              object. This results in OS command execution in the context of the server application.

              This module will start an LDAP server that the target will need to connect to.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-09'
    exploit_type:
    platform: Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/ubiquiti_unifi_log4shell.rb
    record_id: /modules/exploits/multi/http/ubiquiti_unifi_log4shell.rb
  - description: |
      VMware vCenter Server is affected by the Log4Shell vulnerability whereby a JNDI string can sent to the server
              that will cause it to connect to the attacker and deserialize a malicious Java object. This results in OS
              command execution in the context of the root user in the case of the Linux virtual appliance and SYSTEM on
              Windows.

              This module will start an LDAP server that the target will need to connect to. This exploit uses the logon page
              vector.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
