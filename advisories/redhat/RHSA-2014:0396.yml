  - description: OpenSSL 1.0.1f TLS Heartbeat Extension - 'Heartbleed' Memory Disclosure (Multiple
      SSL/TLS Versions)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
