summary: |
  An update is now available for Red Hat Ansible Automation Platform 2.6

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Ansible Automation Platform provides an enterprise framework for building, deploying and managing IT automation at scale. IT Managers can provide top-down guidelines on how automation is applied to individual teams, while automation developers retain the freedom to write tasks that leverage existing knowledge without the overhead. Ansible Automation Platform makes it possible for users across an organization to share, vet, and manage automation content by means of a simple, powerful, and agentless language.

  Security Fix(es):

  * automation-controller: PyJWT: Authentication bypass due to forged JSON Web Tokens (CVE-2026-48526)
  * automation-eda-controller: ExternalEventStreamViewSet trusts Subject header without validation and leaks expected DN (CVE-2026-12383)
  * automation-eda-controller: Authentication bypass in Event-Driven Ansible via forged HTTP header (CVE-2026-18141)
  * automation-gateway-proxy: Go net package: Denial of Service via long CNAME response in LookupCNAME (CVE-2026-33811)
  * python3.12-aiohttp: Arbitrary code execution via untrusted input to CookieJar.load() (CVE-2026-34993)
  * python3.12-daphne: daphne: Denial of Service via excessive WebSocket message size (CVE-2026-44545)
  * python3.12-pillow: Denial of Service via crafted GD 2.x image file (CVE-2026-55380)
  * python3.12-pillow: Denial of Service via crafted BDF font file (CVE-2026-55379)
  * python3.12-pillow: Denial of Service via excessive memory allocation when processing font files (CVE-2026-54060)
  * python3.12-pillow: Denial of Service via crafted PCF font data (CVE-2026-54059)
  * python3.12-pillow: Native heap out-of-bounds write (CVE-2026-59197)
  * python3.12-pyasn1: Denial of Service via crafted ASN.1 REAL values (CVE-2026-59886)
  * python3.12-pyasn1: Denial of Service via crafted ASN.1 OBJECT IDENTIFIER (CVE-2026-59885)
  * receptor: quic-go: Denial of Service via excessive memory allocation in HTTP/3 trailers (CVE-2026-40898)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  For details about this release, refer to the release notes listed in the References section.
