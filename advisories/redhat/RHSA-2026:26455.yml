summary: |
  An update for 389-ds-base is now available for Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  389 Directory Server is an LDAP version 3 (LDAPv3) compliant server. The base packages include the Lightweight Directory Access Protocol (LDAP) server and command-line utilities for server administration.

  Security Fix(es):

  * 389-ds-base: 389-ds-base: unbounded LDAP controls count in get_ldapmessage_controls_ext() causes CPU and heap amplification (remote DoS) (CVE-2026-9064)

  Bug Fix(es) and Enhancement(s):

  * Getting "build_candidate_list - Database error 11" messages after migrating to LMDB. [rhel-9.8.z] (JIRA:RHEL-152356)

  * Web console doesn't show the sub suffix of ou=foo,ou=people,dc=example,dc=com. [rhel-9.8.z] (JIRA:RHEL-168967)

  * DS 12 does not handle escape char in bind user [rhel-9.8.z] (JIRA:RHEL-170269)

  * [RFE] Add OS-level thread names to all server threads [rhel-9.8.z] (JIRA:RHEL-174524)

  * Online export is failing when using the option "-s" [rhel-9.8.z] (JIRA:RHEL-180716)

  * Server shutdown during online reindex may lead to data loss [rhel-9.8.z] (JIRA:RHEL-183895)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
