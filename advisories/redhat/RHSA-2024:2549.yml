summary: "An update for skopeo is now available for Red Hat Enterprise Linux 9.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Moderate. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nThe skopeo command\
  \ lets you inspect images from container image registries, get images and image layers, and\
  \ use signatures to create and verify files. \n\nSecurity Fix(es):\n\n* golang-protobuf: encoding/protojson,\
  \ internal/encoding/json: infinite loop in protojson.Unmarshal when unmarshaling certain forms\
  \ of invalid JSON (CVE-2024-24786)\n\nBug Fix(es):\n\n* TRIAGE CVE-2024-24786 skopeo: golang-protobuf:\
  \ encoding/protojson, internal/encoding/json: infinite loop in protojson.Unmarshal when unmarshaling\
  \ certain forms of invalid JSON [rhel-9] - RHEL 9.4 0day (JIRA:RHEL-28235)\n\n* skopeo: jose-go:\
  \ improper handling of highly compressed data [rhel-9] (JIRA:RHEL-28736)"
