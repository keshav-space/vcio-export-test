summary: |
  Updated images are now available for Red Hat Ansible Automation Platform 2.2, which include new features, bug fixes, and enhancements for the Red Hat Ansible Automation Portal bootable container image.

  Red Hat Ansible Automation Platform 2.2 delivers the Ansible Automation Portal
  as a bootable container (bootc) image. The image provides a self-contained automation portal
  with pre-configured services, dynamic plugins, and support for air-gapped deployments.
