  - description: Apple macOS, iOS, tvOS, Safari, and watchOS contain an unspecified vulnerability
      in JavaScriptCore that when processing web content may lead to arbitrary code execution.
      The impacted product could be end-of-life (EoL) and/or end-of-service (EoS). Users should
      discontinue product utilization.
