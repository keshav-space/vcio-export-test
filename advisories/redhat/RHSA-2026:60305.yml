summary: "An update for the go-toolset:rhel8 module is now available for Red Hat Enterprise\
  \ Linux 8.\n\nRed Hat Product Security has rated this update as having a security impact of\
  \ Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed\
  \ severity rating, is available for each vulnerability from the CVE link(s) in the References\
  \ section.\n\nGo Toolset provides the Go programming language tools and libraries. Go is alternatively\
  \ known as golang. \n\nSecurity Fix(es):\n\n* encoding/asn1: golang: Go encoding/asn1: Denial\
  \ of Service via excessive recursion in Unmarshal (CVE-2026-33818)\n\n* net/url: golang: golang\
  \ net/url: Denial of Service from quadratic complexity in path resolution (CVE-2026-56860)\n\
  \n* net/http: golang: Go net/http: Unencrypted HTTP/2 connections vulnerable to Denial of\
  \ Service (CVE-2026-56853)\n\n* html/template: golang: Go html/template: Cross-Site Scripting\
  \ via pathological input (CVE-2026-56858)\n\n* crypto/tls: golang: Golang crypto/tls: Denial\
  \ of Service via indefinite KeyUpdate messages (CVE-2026-56862)\n\n* encoding/xml: golang:\
  \ Go: Denial of Service via XML decoding recursion depth issue (CVE-2026-56859)\n\nBug Fix(es)\
  \ and Enhancement(s):\n\n* Update Go to version 1.26.7+1 [rhel-8.10.z] (JIRA:RHEL-246426)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
