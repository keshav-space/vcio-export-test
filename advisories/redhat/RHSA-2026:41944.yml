summary: |
  Red Hat OpenShift Data Foundation 4.19.20 security, enhancement & bug fix update

  Red Hat OpenShift Data Foundation 4.19.20 security, enhancement & bug fix update

  FIXED BUGS:
  ==========
  DFBUGS-7342: RHODF 4.19.20 release
  DFBUGS-7332: [Backport for 4.19] - [GSS][ODF][MCG]  noobaa-db-pg-cluster won't synchronize anymore - "could not receive data from WAL stream: ERROR:  requested WAL segment 00000008000001C600000068 has already been removed"
  DFBUGS-6940: [4.19.z] Integrate ibm-storage-odf-operator 1.9.0
  DFBUGS-6542: [ODF 4.19.z CLONE] - Provider Server sends sub channel to client only when provider side csv is at the tip of the sub channel in the catalogsource
  DFBUGS-6529: [Backport to 4.19.z] maintenance mode is always set for storageclients in non RDR clusters
  DFBUGS-6523: CLONE 4.19 - [UI] Resource profile calculations doesn't include NFS
  DFBUGS-4768: [Backport to odf-4.19.z]Remove duplicate PersistentVolumeUsageCritical alerts
