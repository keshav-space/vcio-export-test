  - description: Microsoft Windows - 'POP/MOV SS' Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-05-22'
    exploit_type: local
    platform: windows
    source_date_updated: !!timestamp '2018-07-13'
    data_source: Exploit-DB
    source_url: https://github.com/can1357/CVE-2018-8897
    record_id: CVE-2018-8897
  - description: |
      This module exploits the DynoRoot vulnerability, a flaw in how the
                NetworkManager integration script included in the DHCP client in
                Red Hat Enterprise Linux 6 and 7, Fedora 28, and earlier
                processes DHCP options. A malicious DHCP server, or an attacker on
                the local network able to spoof DHCP responses, could use this flaw
                to execute arbitrary commands with root privileges on systems using
                NetworkManager and configured to obtain network configuration using
                the DHCP protocol.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability:
        - repeatable-session
      AKA:
        - DynoRoot
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2018-05-15'
