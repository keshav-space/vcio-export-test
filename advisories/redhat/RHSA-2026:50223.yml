summary: |
  An update is now available for Red Hat Satellite 6.16 for RHEL 8 and RHEL 9.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Red Hat Satellite is a system management solution that allows organizations
  to configure and maintain their systems without the necessity to provide
  public Internet access to their servers or other client systems. It
  performs provisioning and configuration management of predefined standard
  operating environments.

  Security Fix(es):

  * puppet-agent: Out-of-bounds read & write in RFC 3211 KEK Unwrap (CVE-2025-9230)

  * puppetserver: HTTP request smuggling via chunked extension quoted-string parsing (CVE-2026-2332)

  * python-pillow: Pillow: Denial of Service via crafted BDF font file (CVE-2026-55379)

  * python-pillow: Pillow: Denial of Service via crafted GD 2.x image file (CVE-2026-55380)

  * python-pillow: Pillow: Denial of Service via crafted PCF font data (CVE-2026-54059)

  * python-pillow: Pillow: Denial of Service via excessive memory allocation when processing font files (CVE-2026-54060)

  * python-pillow: Pillow: Native heap out-of-bounds write (CVE-2026-59197)

  * python-pyjwt: PyJWT: Authentication bypass due to forged JSON Web Tokens (CVE-2026-48526)

  * rubygem-faraday-cookie_jar: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-em_http: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-em_synchrony: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-excon: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-httpclient: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday_middleware: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-multipart: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-net_http: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-net_http_persistent: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-patron: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-rack: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-faraday-retry: Faraday: Denial of Service via crafted nested query strings (CVE-2026-54297)

  * rubygem-katello: missing repository authorization in content_uploads exposes cross-product content existence (CVE-2026-12515)

  * rubygem-nokogiri: Nokogiri: Denial of Service or Information Disclosure via invalid encoding handling (CVE-2026-57236)

  * libsolv: Heap buffer overflow in libsolv repopagestore via unchecked decompression of malicious .solv page data (CVE-2026-48864)

  Bug Fix(es):

  * scap-security-guide-satellite: Update of scap-security-guide-satellite package sources

  * 'Katello::Errors::Pulp3Error: nextval: reached maximum value of sequence "container_blobmanifest_id_seq"' during container image sync
