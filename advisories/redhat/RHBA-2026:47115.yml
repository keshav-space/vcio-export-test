summary: |
  An update for coreutils is now available for Red Hat Enterprise Linux 8.

  The coreutils packages contain the GNU Core Utilities and represent a combination of the previously used GNU fileutils, sh-utils, and textutils packages.

  Bug Fix(es) and Enhancement(s):

  * Fix execution of the downstream tests in coreutils-df-direct.patch and coreutils-i18n.patch [rhel-8.10.z] (JIRA:RHEL-151533)

  * unexpand: stack overflow with large tabsizes [rhel-8.10.z] (JIRA:RHEL-182699)
