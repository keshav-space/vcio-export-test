exploits:
  - description: Exim ESMTP 4.80 - glibc gethostbyname Denial of Service
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2015-01-29'
    exploit_type: dos
    platform: linux
    source_date_updated: !!timestamp '2016-10-27'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2015-0235
  - description: |
      This module can be used to determine hosts vulnerable to the GHOST vulnerability via
                a call to the WordPress XMLRPC interface. If the target is vulnerable, the system
                will segfault and return a server error. On patched systems, a normal XMLRPC error
                is returned.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/http/wordpress_ghost_scanner.rb
    record_id: /modules/auxiliary/scanner/http/wordpress_ghost_scanner.rb
  - description: |
      This module remotely exploits CVE-2015-0235, aka GHOST, a heap-based
                buffer overflow in the GNU C Library's gethostbyname functions on x86
                and x86_64 GNU/Linux systems that run the Exim mail server.
    required_action:
    due_date:
    notes: |
      AKA:
        - ghost
      Stability:
        - unknown-stability
      Reliability:
        - unknown-reliability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2015-01-27'
    exploit_type:
    platform: Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/smtp/exim_gethostbyname_bof.rb
    record_id: /modules/exploits/linux/smtp/exim_gethostbyname_bof.rb
