summary: |
  An update for cockpit is now available for Red Hat Enterprise Linux 9.

  Cockpit enables users to administer GNU/Linux servers using a web browser. It offers network configuration, log inspection, diagnostic reports, SELinux troubleshooting, interactive command-line sessions, and more.

  Bug Fix(es) and Enhancement(s):

  * cockpit: Cockpit: Unauthenticated remote code execution due to SSH command-line argument injection [rhel-9.8] (JIRA:RHEL-158310)

  * cockpit: lodash: Arbitrary code execution via untrusted input in template imports [rhel-9.8] (JIRA:RHEL-164196)
