summary: "Updated images are now available for Red Hat Advanced Cluster Security\n(RHACS). The\
  \ updated image includes new features and bug fixes.\n\nRelease of RHACS 4.0 provides these\
  \ changes:\n\nNew features:\n\n* Major release version change to 4.0\n* Installing Central\
  \ with an external PostgreSQL database (Technology Preview)\n* RHACS Cloud Service Limited\
  \ Availability\n* Telemetry data collection in RHACS Cloud Service\n* Red Hat Enterprise Linux\
  \ CoreOS (RHCOS) node host scanning for security vulnerabilities\n* Processes listening on\
  \ endpoints API\n* Network graph 2.0 (Technology Preview) updates\n* FIPS compliance\n* Alert\
  \ messages sent to Central logs for expiring tokens\n* Improvements for Sensor resync (Technology\
  \ Preview)\n* Documentation additions\n\nImportant: For offline configured installations that\
  \ have set the `collector.slimMode` option to false: the `rhacs-collector-rhel8` image now\
  \ contains a subset of kernel modules and eBPF probes available in the support package download.\
  \ If the collector status is unhealthy after an upgrade, follow the instructions for downloading\
  \ kernel support packages and then upload them to Central. See:  https://docs.openshift.com/acs/3.74/configuration/enable-offline-mode.html#download-kernel-support-package_enable-offline-mode\
  \ \n\nNotable technical changes: See the Release Notes.\n\nDeprecated and removed features:\
  \ See the Release Notes.\n\nBug fixes:\n\n* Previously, in the RHACS portal, the Platform\
  \ Configuration → Clusters page did not display information in the Cloud Provider field for\
  \ Azure Red Hat OpenShift and Red Hat OpenShift Service on AWS (ROSA) clusters. This has been\
  \ fixed. \n* If the most recent critical alert in an environment was from a custom policy\
  \ that triggers off of Kubernetes audit logs, it could cause the widgets on the main dashboard\
  \ to fail. This has been fixed. \n* Previously, the `image scan_time` value was not updated\
  \ for some images in the Image entity list. This issue occurred because the workflow for updating\
  \ watched images and the workflow for manually scanning images did not actually re-scan the\
  \ images when the image SHA remained the same. This has been fixed. \n* Fixed an issue in\
  \ consistency with `roxctl` output and API output for the image vulnerability data. Previously,\
  \ `roxctl` showed the total number of CVEs. Now the unique number of CVEs is shown instead.\n\
  * Fixed an issue with the `roxctl generate netpol` command. Previously, the command generated\
  \ network policies with the `status{}` field, which prevented applying policies to a cluster.\
  \ The command no longer generates network policies with this field. \n* Fixed an issue where\
  \ the Create Policy buttons were not visible when the certificate expiration banner was displayed.\
  \ \n* Error messages generated during runtime policy validation have been improved. \n* Previously,\
  \ RHACS failed to suspend a cron job when enforcing a deploy time policy. This issue has been\
  \ fixed. \n\nKnown issues:\nCurrently, RHACS does not support alerts for security policy violations\
  \ for containers running with default `seccomp profiles-Unconfined`. The alert violations\
  \ for Unconfined seccomp profiles are generated only if the seccomp profile is explicitly\
  \ set to \"Unconfined\" in the container specification. No workaround exists."
