summary: "An update for frr is now available for Red Hat Enterprise Linux 9.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Important. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nFRRouting is free\
  \ software that manages TCP/IP based routing protocols. It supports BGP4, OSPFv2, OSPFv3,\
  \ ISIS, RIP, RIPng, PIM, NHRP, PBR, EIGRP and BFD. \n\nSecurity Fix(es):\n\n* frr: FRRouting:\
  \ Denial of Service via crafted BGP UPDATE message (CVE-2026-37460)\n\nBug Fix(es) and Enhancement(s):\n\
  \n* Zebra is not installing the route in the kernel after flapping one of the physical link\
  \ on the ocp worker node. [rhel-9.8.z] (JIRA:RHEL-152300)\n\n* frr triggers SELinux denials\
  \ when reading root's Python site-packages directory on RHEL-9 (JIRA:RHEL-176258)\n\nFor more\
  \ details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
