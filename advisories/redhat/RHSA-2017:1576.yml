exploits:
  - description: |
      This module takes advantage of custom hg-ssh wrapper implementations that don't
                adequately validate parameters passed to the hg binary, allowing users to trigger a
                Python Debugger session, which allows arbitrary Python code execution.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects: []
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2017-04-18'
    exploit_type:
    platform: Python
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/ssh/mercurial_ssh_exec.rb
