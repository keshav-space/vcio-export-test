  - description: |
      Jetty suffers from a vulnerability where certain encoded URIs and ambiguous paths can access
                protected files in the WEB-INF folder. Versions effected are:
                9.4.37.v20210219, 9.4.38.v20210224 and 9.4.37-9.4.42, 10.0.1-10.0.5, 11.0.1-11.0.5.
                Exploitation can obtain any file in the WEB-INF folder, but web.xml is most likely
                to have information of value.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability: []
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-07-15'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/gather/jetty_web_inf_disclosure.rb
    record_id: /modules/auxiliary/gather/jetty_web_inf_disclosure.rb
  - description: |
      Versions of Apache Log4j2 impacted by CVE-2021-44228 which allow JNDI features used in configuration,
              log messages, and parameters, do not protect against attacker controlled LDAP and other JNDI related endpoints.

              This module will scan an HTTP end point for the Log4Shell vulnerability by injecting a format message that will
              trigger an LDAP connection to Metasploit. This module is a generic scanner and is only capable of identifying
              instances that are vulnerable via one of the pre-determined HTTP request injection points. These points include
              HTTP headers and the HTTP request path.

              Known impacted software includes Apache Struts 2, VMWare VCenter, Apache James, Apache Solr, Apache Druid,
              Apache JSPWiki, Apache OFBiz.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability: []
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-09'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/http/log4shell_scanner.rb
    record_id: /modules/auxiliary/scanner/http/log4shell_scanner.rb
  - description: |
      MobileIron Core is affected by the Log4Shell vulnerability whereby a JNDI string sent to the server
              will cause it to connect to the attacker and deserialize a malicious Java object. This results in OS
              command execution in the context of the tomcat user.

              This module will start an LDAP server that the target will need to connect to.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
      RelatedModules:
        - auxiliary/scanner/http/log4shell_scanner
        - exploit/multi/http/log4shell_header_injection
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-12'
    exploit_type:
    platform: Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/http/mobileiron_core_log4shell.rb
    record_id: /modules/exploits/linux/http/mobileiron_core_log4shell.rb
  - description: |
      Versions of Apache Log4j2 impacted by CVE-2021-44228 which allow JNDI features used in configuration,
              log messages, and parameters, do not protect against attacker controlled LDAP and other JNDI related endpoints.

              This module will exploit an HTTP end point with the Log4Shell vulnerability by injecting a format message that
              will trigger an LDAP connection to Metasploit and load a payload.

              The Automatic target delivers a Java payload using remote class loading. This requires Metasploit to run an HTTP
              server in addition to the LDAP server that the target can connect to. The targeted application must have the
              trusted code base option enabled for this technique to work.

              The non-Automatic targets deliver a payload via a serialized Java object. This does not require Metasploit to
              run an HTTP server and instead leverages the LDAP server to deliver the serialized object. The target
              application in this case must be compatible with the user-specified JAVA_GADGET_CHAIN option.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
      RelatedModules:
        - auxiliary/scanner/http/log4shell_scanner
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-09'
    exploit_type:
    platform: Java,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/log4shell_header_injection.rb
    record_id: /modules/exploits/multi/http/log4shell_header_injection.rb
