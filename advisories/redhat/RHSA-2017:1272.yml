    record_id: /modules/exploits/linux/samba/is_known_pipename.rb
  - description: Samba contains a remote code execution vulnerability, allowing a malicious
      client to upload a shared library to a writable share and then cause the server to load
      and execute it.
    required_action: Apply updates per vendor instructions.
