summary: |
  An update for multiple packages is now available for Red Hat Enterprise Linux 9.4 Update Services for SAP Solutions.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  This is a kernel live patch module which can be loaded by the kpatch command line utility to modify the code of a running kernel.  This patch module is targeted for kernel-5.14.0-427.68.2.el9_4.

  Security Fix(es):

  * kernel: eventpoll: fix ep_remove struct eventpoll / struct file UAF (CVE-2026-46242)

  * kernel: KVM: x86: Fix shadow paging use-after-free due to unexpected role (CVE-2026-53359)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
