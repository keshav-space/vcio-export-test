summary: "An update for the nginx:1.16 module is now available for Red Hat Enterprise Linux\
  \ 8.\n\nRed Hat Product Security has rated this update as having a security impact of Moderate.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nnginx is a web and proxy server supporting HTTP and other protocols, with a focus on high\
  \ concurrency, performance, and low memory usage. \n\nSecurity Fix(es):\n\n* nginx: HTTP request\
  \ smuggling in configurations with URL redirect used as error_page (CVE-2019-20372)\n\nFor\
  \ more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
