summary: |
  Red Hat JBoss Core Services Apache HTTP Server 2.4.62 Service Pack 5 is now available.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat JBoss Core Services is a set of supplementary software for Red Hat JBoss middleware products. This software, such as Apache HTTP Server, is common to multiple JBoss middleware products and packaged under Red Hat JBoss Core Services, to allow for faster distribution of updates and for a more consistent update experience.

  This release of Red Hat JBoss Core Services Apache HTTP Server 2.4.62 Service Pack 5 serves as a replacement for Red Hat JBoss Core Services Apache HTTP Server 2.4.62 Service Pack 4, and includes bug fixes and enhancements, which are documented in the Release Notes linked to in the References section.

  Security Fix(es):

  * jbcs-httpd24-httpd: incomplete fix for CVE-2023-38709 (CVE-2024-42516)
  * jbcs-httpd24-httpd: Apache HTTP Server: Privilege Escalation via .htaccess file manipulation (CVE-2026-24072)
  * jbcs-httpd24-mod_http2: Apache HTTP Server mod_http2: Use After Free vulnerability allows arbitrary code execution or denial of service (CVE-2026-48913)
  * mod_http2.so: Apache HTTP Server mod_http2: Use After Free vulnerability allows arbitrary code execution or denial of service (CVE-2026-48913)
  * jbcs-httpd24-httpd: Apache HTTP Server: Arbitrary code execution or denial of service via use-after-free in mod_ldap per-directory configuration (CVE-2026-29167)
  * jbcs-httpd24-httpd: Apache httpd mod_dav_fs: Denial of Service due to path handling issue (CVE-2026-42535)
  * jbcs-httpd24-httpd: Apache HTTP Server: Denial of Service via crafted regular expressions (CVE-2026-44631)
  * jbcs-httpd24-httpd: SSRF in Apache HTTP Server with mod_proxy loaded (CVE-2024-43204)
  * jbcs-httpd24-httpd: Apache HTTP Server: Buffer overflow in mod_proxy_html allows security bypass (CVE-2026-34355)
  * jbcs-httpd24-httpd: Apache HTTP Server: Heap-based Buffer Overflow via untrusted content in mod_xml2enc (CVE-2026-42536)
  * jbcs-httpd24-httpd: Apache HTTP Server: Denial of Service in mod_proxy_ftp via attacker-controlled FTP server (CVE-2026-44186)
  * jbcs-httpd24-httpd: Apache HTTP Server - Cross-site scripting in mod_proxy_ftp HTML directory list generation (CVE-2026-29170)
  * jbcs-httpd24-httpd: jbcs-httpd24-mod_http2: Apache HTTP Server - Out-of-bounds Read in mod_headers and mod_mime with multiple response languages (CVE-2026-43951)
  * jbcs-httpd24-httpd: Apache HTTP Server - Improper Privilege Management allowing .htaccess authors to read files as httpd user (CVE-2026-44119)
  * jbcs-httpd24-httpd: Apache HTTP Server: Buffer Over-read via outbound OCSP requests to attacker-controlled server (CVE-2026-44185)
  * jbcs-httpd24-httpd: Apache HTTP Server: Denial of Service in mod_proxy_ftp via attacker-controlled FTP server (CVE-2026-44186)
  * jbcs-httpd24-httpd: Apache HTTP Server: Heap-based Buffer Overflow via malicious backend servers (CVE-2026-34356)

  A Red Hat Security Bulletin which addresses further details about this flaw is available in the References section.

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
