summary: |
  This is an updated version of the Node Maintenance Operator.
  This Operator is delivered by Red Hat Workload Availability (RHWA).

  The Node Maintenance Operator works in conjunction with the machine
  health check or the node health check to provide automatic remediation of
  unhealthy nodes by rebooting them. This minimizes downtime for stateful
  applications and ReadWriteOnce (RWO) Volumes as well as restoring compute
  capacity in the event of transient failures.
