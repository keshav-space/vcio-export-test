summary: |
  An update for firewalld is now available for Red Hat Enterprise Linux 10.

  firewalld is a firewall service daemon that provides a dynamic customizable firewall with a D-Bus interface.

  Bug Fix(es) and Enhancement(s):

  * firewalld: package upgrade may cause running firewalld to reports errors (JIRA:RHEL-137602)

  * [10.3] Firewalld rebase to latest upstream stable (JIRA:RHEL-174658)

  * Firewalld --timeout argument does not work for policies (JIRA:RHEL-95705)
