summary: "An update is now available for Red Hat Ceph Storage 5.3.\n\nRed Hat Product Security\
  \ has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring\
  \ System (CVSS) base score, which gives a detailed severity rating, is available for each\
  \ vulnerability from the CVE link(s) in the References section.\n\nRed Hat Ceph Storage is\
  \ a scalable, open, software-defined storage platform that combines the most stable version\
  \ of the Ceph storage system with a Ceph management platform, deployment utilities, and support\
  \ services.\n\nSecurity Fix(es):\n* CVE-2023-39325 golang: net/http, x/net/http2: rapid stream\
  \ resets can cause excessive work (CVE-2023-44487)\n*  grafana-container: go-git: Maliciously\
  \ crafted Git server replies can lead to path traversal and RCE on go-git clients (CVE-2023-49569)\n\
  * opentelemetry: DoS vulnerability in otelhttp (CVE-2023-45142)\n\nThese new packages include\
  \ numerous security updates, enhancements, and bug fixes. Space precludes documenting all\
  \ of these changes in this advisory. Users are directed to the Red Hat Ceph Storage Release\
  \ Notes for information on the most significant of these changes: \n \nhttps://access.redhat.com/documentation/en-us/red_hat_ceph_storage/5.3/html/release_notes/index"
