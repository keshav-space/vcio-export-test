  - description: Apache Tomcat treats Apache JServ Protocol (AJP) connections as having higher
      trust than, for example, a similar HTTP connection. If such connections are available
      to an attacker, they can be exploited.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-03-17'
