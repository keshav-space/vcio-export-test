exploits:
  - description: |
      This module can be used to determine hosts vulnerable to the GHOST vulnerability via
                a call to the WordPress XMLRPC interface. If the target is vulnerable, the system
                will segfault and return a server error. On patched systems, a normal XMLRPC error
                is returned.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/http/wordpress_ghost_scanner.rb
    record_id: /modules/auxiliary/scanner/http/wordpress_ghost_scanner.rb
