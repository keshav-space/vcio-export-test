    platform: Java,Linux,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_storeimagearray.rb
    record_id: /modules/exploits/multi/browser/java_storeimagearray.rb
  - description: |
      This module takes advantage of the default configuration of the RMI Registry and
                RMI Activation services, which allow loading classes from any remote (HTTP) URL. As it
                invokes a method in the RMI Distributed Garbage Collector which is available via every
                RMI endpoint, it can be used against both rmiregistry and rmid,  and against most other
                (custom) RMI endpoints as well.

                Note that it does not work against Java Management Extension (JMX) ports since those do
                not support remote class loading, unless another RMI endpoint is active in the same
                Java process.

                RMI method calls do not support or require any sort of authentication.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2011-10-15'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/misc/java_rmi_server.rb
    record_id: /modules/exploits/multi/misc/java_rmi_server.rb
  - description: |
      This module abuses the Color Management classes from a Java Applet to run
                arbitrary Java code outside of the sandbox as exploited in the wild in February
                and March of 2013. The vulnerability affects Java version 7u15 and earlier and 6u41
                and earlier and has been tested successfully on Windows XP SP3 and Windows 7 SP1
                systems. This exploit doesn't bypass click-to-play, so the user must accept the java
                warning in order to run the malicious applet.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
