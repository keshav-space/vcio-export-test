aliases:
  - CVE-2021-3652
summary: "An update for the 389-ds:1.4 module is now available for Red Hat Enterprise Linux\
  \ 8.\n\nRed Hat Product Security has rated this update as having a security impact of Low.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \n389 Directory Server is an LDAP version 3 (LDAPv3) compliant server. The base packages include\
  \ the Lightweight Directory Access Protocol (LDAP) server and command-line utilities for server\
  \ administration. \n\nSecurity Fix(es):\n\n* 389-ds-base: CRYPT password hash with asterisk\
  \ allows any bind attempt to succeed (CVE-2021-3652)\n\nFor more details about the security\
  \ issue(s), including the impact, a CVSS score, acknowledgments, and other related information,\
  \ refer to the CVE page(s) listed in the References section.\n\nBug Fix(es):\n\n* A plugin\
  \ can create an index. Even if the index can be used immediately (for searches) the index\
  \ remains offline until further reindex (BZ#1983095)\n\n* On big endian machine, the server\
  \ fails to identify the operation type (BZ#1980063)"
