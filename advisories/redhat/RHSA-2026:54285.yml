summary: |
  This is an updated version of the Machine Deletion Remediation Operator.
  This Operator is delivered by Red Hat Workload Availability (RHWA).

  The Machine Deletion Remediation (MDR) Operator works with the Node Health Check (NHC) Operator to reprovision unhealthy nodes using the Machine API.
  The MDR Operator looks for the associated machine of an unhealthy node, and deletes it.
  After the machine custom resource (CR) has been deleted, the owning controller creates a replacement machine CR.
