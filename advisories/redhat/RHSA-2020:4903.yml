summary: "An update for the nodejs:12 module is now available for Red Hat Enterprise Linux 8.1\
  \ Extended Update Support.\n\nRed Hat Product Security has rated this update as having a security\
  \ impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives\
  \ a detailed severity rating, is available for each vulnerability from the CVE link(s) in\
  \ the References section.\n\nNode.js is a software development platform for building fast\
  \ and scalable network applications in the JavaScript programming language. \n\nThe following\
  \ packages have been upgraded to a later upstream version: nodejs (12.18.4).\n\nSecurity Fix(es):\n\
  \n* nodejs-dot-prop: prototype pollution (CVE-2020-8116)\n\n* nodejs: HTTP request smuggling\
  \ due to CR-to-Hyphen conversion (CVE-2020-8201)\n\n* npm: Sensitive information exposure\
  \ through logs (CVE-2020-15095)\n\n* libuv: buffer overflow in realpath (CVE-2020-8252)\n\n\
  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section.\n\
  \nBug Fix(es):\n\n* The nodejs:12/development module is not installable (BZ#1883965)"
