summary: |
  An update for kernel is now available for Red Hat Enterprise Linux 9.6 Extended Update Support.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The kernel packages contain the Linux kernel, the core of any Linux operating system.

  Security Fix(es):

  * kernel: smc: Fix use-after-free in __pnet_find_base_ndev() (CVE-2025-40064)

  * kernel: smc: Use __sk_dst_get() and dst_dev_rcu() in smc_clc_prfx_match() (CVE-2025-40168)

  * kernel: Linux kernel: Denial of Service in libceph OSD client due to unreset sparse-read state (CVE-2026-23136)

  * kernel: netfilter: ctnetlink: ensure safe access to master conntrack (CVE-2026-43116)

  * kernel: xfs: fix freemap adjustments when adding xattrs to leaf blocks (CVE-2026-43158)

  * kernel: mm/page_alloc: clear page->private in free_pages_prepare() (CVE-2026-43303)

  * kernel: net/sched: act_pedit: extend the writable skb range per key (CVE-2026-46331)

  * kernel: Linux kernel: Use-After-Free in net/gro due to improper handling of zerocopy skbs (CVE-2026-46323)

  * kernel: Linux kernel: smb: client: reject userspace cifs.spnego descriptions (CVE-2026-46243)

  * kernel: RDMA/iwcm: Fix workqueue list corruption by removing work_list (CVE-2026-45898)

  * kernel: wifi: mac80211: remove station if connection prep fails (CVE-2026-46125)

  * kernel: wifi: mac80211: use safe list iteration in radar detect work (CVE-2026-46166)

  Bug Fix(es) and Enhancement(s):

  * [RHEL-9] Performance impact of CVE-2025-38085 [rhel-9.6.z] (JIRA:RHEL-161145)

  * libceph: CEPH_CRYPTO_AES256KRB5 (--key-type aes256k) support [rhel-9.6.z] (JIRA:RHEL-168926)

  * [ice] 3 of 4 ports "Failed to set LAN Tx queue context, error: -22" [rhel-9.6.z] (JIRA:RHEL-175439)

  * Kernel panic while shutting down ice driver due to use-after-free [rhel-9.6.z] (JIRA:RHEL-177524)

  * rbd: eliminate a race in lock_dwork draining on unmap [rhel-9.6.z] (JIRA:RHEL-183129)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
