summary: |
  An update is now available for Red Hat Ansible Automation Platform 2.5

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Ansible Automation Platform provides an enterprise framework for building, deploying and managing IT automation at scale. IT Managers can provide top-down guidelines on how automation is applied to individual teams, while automation developers retain the freedom to write tasks that leverage existing knowledge without the overhead. Ansible Automation Platform makes it possible for users across an organization to share, vet, and manage automation content by means of a simple, powerful, and agentless language.

  Security Fix(es):
  * automation-controller: Cryptography: Buffer overflow via non-contiguous buffer in API (CVE-2026-39892)
  * automation-controller: pyasn1 Vulnerable to Denial of Service via Unbounded Recursion (CVE-2026-30922)
  * automation-gateway: Axios: Server-Side Request Forgery and proxy bypass due to improper hostname normalization (CVE-2025-62718)
  * automation-gateway: Vite: Information disclosure via WebSocket connection bypasses access control (CVE-2026-39363)
  * automation-gateway: node-forge: Denial of Service via infinite loop in BigInteger.modInverse() (CVE-2026-33891)
  * automation-gateway: Forge: Signature Forgery via Weak RSASSA PKCS#1 v1.5 Verification (CVE-2026-33894)
  * automation-gateway: Forge: Authentication bypass via forged Ed25519 cryptographic signatures (CVE-2026-33895)
  * automation-gateway: Forge (node-forge): Certificate validation bypass allows unauthorized certificate issuance (CVE-2026-33896)
  * automation-gateway: path-to-regexp: Denial of Service via crafted regular expressions (CVE-2026-4926)
  * automation-gateway: Minimatch: Denial of Service via catastrophic backtracking in glob expressions (CVE-2026-27904)
  * automation-gateway: minimatch: Denial of Service via specially crafted glob patterns (CVE-2026-26996)
  * automation-gateway-proxy: Go crypto/tls: Denial of Service via multiple TLS 1.3 key update messages (CVE-2026-32283)
  * automation-gateway-proxy: Go: Denial of Service vulnerability in certificate chain building (CVE-2026-32280)
  * python3.12-click: Arbitrary command execution via command injection in click.edit() (CVE-2026-7246)
  * python3.12-cryptography: Buffer overflow via non-contiguous buffer in API (CVE-2026-39892)
  * python3.12-pillow: Denial of Service via decompression bomb in FITS image processing (CVE-2026-40192)
  * receptor: Go crypto/tls: Denial of Service via multiple TLS 1.3 key update messages (CVE-2026-32283)
  * receptor: Go: Denial of Service vulnerability in certificate chain building (CVE-2026-32280)
  * receptor: Root.Chmod can follow symlinks out of the root (CVE-2026-32282)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  For details about this release, refer to the release notes listed in the References section.
