summary: "Red Hat Edge Manager Version 1.1.2\n\nRed Hat Edge Manager (RHEM) provides simple,\
  \ scalable, and secure management for\nedge fleets. Users declare their target OS image, host\
  \ configuration, and\napplications; the RHEM agent then automatically rolls out these configurations,\n\
  reporting health and progress status back to the manager.\n\nOptimized for container-centric\
  \ toolchains, RHEM excels on image-based Linux\n(via bootc) and supports workloads running\
  \ on Podman or MicroShift. It enforces\noperational best practices by supporting both rootless\
  \ and privileged execution,\nensuring workload user separation so applications run with minimal\
  \ privileges by\ndefault.\n\nIn addition to the standalone version, RHEM continues to be\n\
  offered as a plugin for the following platforms:\n\nRed Hat Advanced Cluster Management (RHACM):\
  \ Extends fleet management to edge\ndevices.\n\nRed Hat Ansible Automation Platform (AAP):\
  \ Integrates edge management with\nAnsible automation.\n\nThis integration enables organizations\
  \ to optimize the management and\norchestration of their fleets of edge devices; whether its\
  \ thousands of\ndispersed retail point-of-sale systems or industrial machinery on remote factory\n\
  floors.\n        \nValue for customers and partners:\n\n* This solution not only helps customers\
  \ manage thousands of devices but helps\nscale operations.\n* To manage large-scale deployments,\
  \ customers need to be able to integrate with\ntheir existing management systems, support\
  \ remote configuration and over-the-air\nupdates, and collect telemetry data for advanced\
  \ analytics.\n* RHEM offers a simple and security-focused lifecycle\nmanagement, from onboarding\
  \ to decommissioning of edge devices.\n\nThis complete end-to-end solution empowers organizations\
  \ to gain the most value\nfrom the fleets of devices that generate data, all from a centralized\
  \ location."
