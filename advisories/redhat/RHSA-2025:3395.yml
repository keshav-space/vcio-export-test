exploits:
  - description: FreeType contains an out-of-bounds write vulnerability when attempting to parse
      font subglyph structures related to TrueType GX and variable font files that may allow
      for arbitrary code execution.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-05-27'
