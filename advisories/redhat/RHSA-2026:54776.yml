summary: |
  An update for Red Hat Build of Apache Camel 4.18 for Quarkus 3.33 update is now available (RHBQ 3.33.3.GA).
  The purpose of this text-only errata is to inform you about the enhancements that improve your developer experience and ensure the security and stability of your products.
  Red Hat Product Security has rated this update as having a security impact of Important.

  An update for Red Hat Build of Apache Camel 4.18 for Quarkus 3.33 update is now available (RHBQ 3.33.3.GA).
  The purpose of this text-only errata is to inform you about the enhancements that improve your developer experience and ensure the security and stability of your products:
  *  sshd-core: Apache MINA SSHD: Unauthorized command execution due to improper certificate validation [rhboac-camel-quarkus-3] (CVE-2026-56624)
  *  libthrift: Apache Thrift: Denial of Service due to uncontrolled resource allocation [rhboac-camel-quarkus-3] (CVE-2026-45112)
  *  libthrift: Apache Thrift: Denial of Service via improper handling of highly compressed data [rhboac-camel-quarkus-3] (CVE-2026-48586)
  *  org.hl7.fhir.utilities: HAPI FHIR XsltUtilities: XML External Entity injection allows local file disclosure and SSRF [rhboac-camel-quarkus-3] (CVE-2026-55471)
  *  org.hl7.fhir.dstu2: HAPI FHIR: Denial of Service via Regular Expression Backtracking in DSTU2 Module [rhboac-camel-quarkus-3] (CVE-2026-55470)
