summary: |
  An update for openstack-keystone is now available for Red Hat OpenStack
  Services on OpenShift 18.0 (Antelope).

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Keystone is a Python implementation of the OpenStack
  (http://www.openstack.org) identity service API.

  Security Fix(es):

  * Keystone: OpenStack Keystone: Unauthorized cross-project access due to
  improper validation in EC2 credential creation (CVE-2026-43001)

  * Keystone: OpenStack Keystone: Unauthorized access due to incorrect LDAP
  user status handling (CVE-2026-40683)

  * OpenStack Keystone: Privilege escalation through EC2 credential creation
  (CVE-2026-33551)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE
  page listed in the References section.
