  - description: Mozilla Firefox, SeaMonkey, and Thunderbird contain an unspecified vulnerability
      when JavaScript is enabled. This allows remote attackers to execute arbitrary code via
      vectors related to nsCSSFrameConstructor::ContentAppended, the appendChild method, incorrect
      index tracking, and the creation of multiple frames, which triggers memory corruption.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
