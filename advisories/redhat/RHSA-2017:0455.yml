exploits:
  - description: Apache Tomcat 8/7/6 (Debian-Based Distros) - Local Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2016-10-03'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2016-10-03'
    data_source: Exploit-DB
    source_url: http://legalhackers.com/advisories/Tomcat-DebPkgs-Root-Privilege-Escalation-Exploit-CVE-2016-1240.html
    record_id: CVE-2016-1240
  - description: |
      Tomcat (6, 7, 8) packages provided by default repositories on Debian-based
                distributions (including Debian, Ubuntu etc.) provide a vulnerable
                tomcat init script that allows local attackers who have already gained access
                to the tomcat account (for example, by exploiting an RCE vulnerability
                in a java web application hosted on Tomcat, uploading a webshell etc.) to
                escalate their privileges from tomcat user to root and fully compromise the
                target system.

                Tested against Tomcat 8.0.32-1ubuntu1.1 on Ubuntu 16.04
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - config-changes
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2016-09-30'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/tomcat_ubuntu_log_init_priv_esc.rb
    record_id: /modules/exploits/linux/local/tomcat_ubuntu_log_init_priv_esc.rb
  - description: Apache Tomcat contains an unspecified vulnerability that allows for remote
      code execution if JmxRemoteLifecycleListener is used and an attacker can reach Java Management
      Extension (JMX) ports. This CVE exists because this listener wasn't updated for consistency
      with the Oracle patched issues for CVE-2016-3427 which affected credential types.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2023-06-02'
    notes: https://tomcat.apache.org/security-9.html; https://nvd.nist.gov/vuln/detail/CVE-2016-8735
    known_ransomware_campaign_use: no
