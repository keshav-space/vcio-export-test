summary: |
  A security update is now available for Red Hat JBoss Enterprise Application
  Platform 7.4 for Red Hat Enterprise Linux 7. Red Hat Product Security has rated
  this update as having a security impact of Important. A Common Vulnerability
  Scoring System (CVSS) base score, which gives a detailed severity rating, is
  available for each vulnerability from the CVE link(s) in the References section.

  Red Hat JBoss Enterprise Application Platform 7 is a platform for Java applications based on the WildFly application runtime. This release of Red Hat JBoss Enterprise Application Platform 7.4.25 serves as a replacement for Red Hat JBoss Enterprise Application Platform 7.4.24, and includes bug fixes and enhancements. See the Red Hat JBoss Enterprise Application Platform 7.4.25 Release Notes for information about the most significant bug fixes and enhancements included in this release.

  Security Fix(es):

  * netty-codec-redis: Netty: Denial of Service via malicious Redis array header (CVE-2026-50011)

  * netty-handler: Netty: Denial of Service due to eager buffer allocation in TLS handshake (CVE-2026-45416)

  * netty-codec-redis: netty-codec-redis: Denial of Service via crafted Redis payload with deeply nested arrays (CVE-2026-44250)

  * netty-codec-redis: netty-codec-redis: Denial of Service via crafted Redis payloads (CVE-2026-44890)

  * netty-transport-sctp: Netty-transport-sctp: Denial of Service due to unbounded memory growth from SctpMessage fragments (CVE-2026-46340)

  * netty-resolver-dns: Netty: Information disclosure and data manipulation due to improper CNAME record validation (CVE-2026-45674)

  * netty-handler: Netty: Improper trust manager handling leads to hostname verification bypass (CVE-2026-50010)

  * netty-codec-redis: Netty's Lack of Lifecycle Cleanup Leads to Pooled ByteBuf Leak in RedisArrayAggregator (CVE-2026-48006)

  * netty-resolver-dns: Netty has Insufficient Bailiwick Validation for NS Records (CVE-2026-47691)

  * netty-codec-haproxy: Netty HAProxy PROXY protocol v2 codec: Denial of Service via memory leak from crafted PROXY protocol headers (CVE-2026-48059)

  * netty-codec-http2: netty-codec-http2: Denial of Service due to resource leak (CVE-2026-48043)

  * netty-codec-haproxy: Netty-codec-haproxy: Denial of Service via malformed HAProxy message (CVE-2026-44893)

  * netty-codec-http: Netty: Request smuggling via malformed Transfer-Encoding parsing (CVE-2026-42585)

  * netty-codec-http2: Netty: Denial of Service via unbounded memory allocation in HTTP content decompression (CVE-2026-42587)

  * netty-codec-http: Netty: Denial of Service via unbounded memory allocation in HTTP content decompression (CVE-2026-42587)

  * netty-codec-http: Netty: HTTP request smuggling via URI manipulation and CRLF injection (CVE-2026-41417)

  * netty-handler-proxy: Netty: HTTP Header Injection via HttpProxyHandler Disabled Validation (CVE-2026-42578)

  * netty-codec-http: Netty: HTTP Request Smuggling due to improper handling of conflicting HTTP/1.0 headers (CVE-2026-42581)

  * netty-codec-http: Netty: Incorrect HTTP response parsing leads to data confusion (CVE-2026-42584)

  * netty-codec-dns: Netty: High integrity impact due to improper DNS domain name constraint enforcement (CVE-2026-42579)

  * picketlink-federation: auth bypass in Picketlink SAML unsolicited-response (CVE-2026-10579)

  * bcprov-jdk18on: LDAP injection vulnerability in LDAPStoreHelper.java (CVE-2026-0636)

  * bcprov-jdk15on: LDAP injection vulnerability in LDAPStoreHelper.java (CVE-2026-0636)

  * bcprov-jdk15: LDAP injection vulnerability in LDAPStoreHelper.java (CVE-2026-0636)

  * bcprov-jdk12: LDAP injection vulnerability in LDAPStoreHelper.java (CVE-2026-0636)

  * bcpg-jdk18on: unbounded PGP AEAD chunk size leads to pre-auth resource exhaustion (CVE-2026-3505)

  * bcpg-jdk15on: unbounded PGP AEAD chunk size leads to pre-auth resource exhaustion (CVE-2026-3505)

  * bcpkix-jdk18on: PKIX draft CompositeVerifier accepts empty signature sequence as valid (CVE-2026-5588)

  * bcpkix-jdk15on: PKIX draft CompositeVerifier accepts empty signature sequence as valid (CVE-2026-5588)

  * bcprov-jdk18on: GOSTCTR implementation unable to process more than 255 blocks correctly (CVE-2025-14813)

  * bcprov-jdk15on: GOSTCTR implementation unable to process more than 255 blocks correctly (CVE-2025-14813)

  * bcprov-jdk15: GOSTCTR implementation unable to process more than 255 blocks correctly (CVE-2025-14813)

  * bcprov-jdk12: GOSTCTR implementation unable to process more than 255 blocks correctly (CVE-2025-14813)

  * bcprov-jdk15: private key leakage via non-constant time comparisons (CVE-2026-5598)

  * bcprov-jdk12: private key leakage via non-constant time comparisons (CVE-2026-5598)

  * artemis-server: Apache Artemis, Apache ActiveMQ Artemis: Message injection and exfiltration due to missing authentication (CVE-2026-27446)

  * undertow-core: Undertow: Authentication Bypass via AJP ssl_cert/is_ssl Forgery (CVE-2026-15554)

  * wildfly-clustering-infinispan-marshalling: Jboss Deserialization RCE via Unfiltered River Unmarshaller (CVE-2026-15555)

  * picketlink-federation: picketlink SAML 2.0 auth bypass via missing assertions (CVE-2026-15556)

  * openjdk-orb: unauthed class loading via IIOP in EAP (CVE-2026-15560)

  * undertow-core: OOM via missing limits in chunked trailer in EAP's Undertow (CVE-2026-15561)

  * jboss-remoting: jboss-remoting: integer overflow in MessageReader leads to pre-authentication denial of service (CVE-2026-15562)

  * wildfly-iiop-openjdk: Missing authentication on EAP's IIOP NameService leads to MITM or DoS (CVE-2026-15563)

  * jsf-impl: mojarra: Unauthenticated RCE in EAP JSF applications via EL injection in ui:include (CVE-2026-46581)

  * netty-handler: netty-handler: IPv6 subnet rule bypass due to incorrect masking operation (CVE-2026-44249)

  * jackson-core: Denial of Service via incomplete fix in async JSON parser (CVE-2026-68494)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE page(s)
  listed in the References section.
