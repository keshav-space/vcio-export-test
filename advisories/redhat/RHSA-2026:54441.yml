summary: |
  An update is now available for Red Hat Lightspeed (formerly Insights) for Runtimes on RHEL 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  An update is now available for Red Hat Lightspeed (formerly Insights) for Runtimes on RHEL 9.

  Security fix(es):

  * golang.org/x/net/html: Cross-Site Scripting via unexpected HTML tree rendering (CVE-2026-42502)
  * golang.org/x/net/html: Cross-Site Scripting via HTML parsing bypass (CVE-2026-27136)
  * golang.org/x/net/html: Arbitrary code execution via Cross-Site Scripting (CVE-2026-25681)
  * golang crypto/x509: Denial of Service via excessive processing of DNS SAN entries (CVE-2026-27145)
  * Go net package: Denial of Service via long CNAME response in LookupCNAME (CVE-2026-33811)
  * golang.org/x/net/idna: Privilege escalation via incorrect Punycode label processing (CVE-2026-39821)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
