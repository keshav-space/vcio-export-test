aliases:
  - CVE-2023-0461
  - CVE-2023-2008
  - CVE-2023-32233
  - CVE-2023-53756
summary: |
  An update for kernel is now available for Red Hat Enterprise Linux 9.0 Extended Update Support.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The kernel packages contain the Linux kernel, the core of any Linux operating system.

  Security Fix(es):

  * kernel: net/ulp: use-after-free in listening ULP sockets (CVE-2023-0461)

  * kernel: udmabuf: improper validation of array index leading to local privilege escalation (CVE-2023-2008)

  * kernel: use-after-free in Netfilter nf_tables when processing batch requests can lead to privilege escalation (CVE-2023-32233)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  Bug Fix(es):

  * Intel QAT Update - (kernel changes) (BZ#2176848)

  * Significant performance drop for getrandom system call when FIPS is enabled (compared to RHEL 8) (BZ#2183477)

  * Azure RHEL9 Backport upstream commit 93827a0a36396f2fd6368a54a020f420c8916e9b [KVM: VMX: Fix crash due to uninitialized current_vmcs] (BZ#2186824)

  * kernel[-rt]: task deadline_test:1778 blocked for more than 622 seconds (BZ#2188657)
