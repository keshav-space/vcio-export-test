advisory_id: RHSA-2012:0547
datasource_id: redhat/RHSA-2012:0547
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2012/rhsa-2012_0547.json
aliases:
  - CVE-2012-1823
summary: "Updated php53 packages that fix one security issue are now available for\nRed Hat\
  \ Enterprise Linux 5.\n\nThe Red Hat Security Response Team has rated this update as having\
  \ critical\nsecurity impact. A Common Vulnerability Scoring System (CVSS) base score,\nwhich\
  \ gives a detailed severity rating, is available from the CVE link in\nthe References section.\n\
  \nPHP is an HTML-embedded scripting language commonly used with the Apache\nHTTP Server.\n\
  \nA flaw was found in the way the php-cgi executable processed command line\narguments when\
  \ running in CGI mode. A remote attacker could send a \nspecially-crafted request to a PHP\
  \ script that would result in the query\nstring being parsed by php-cgi as command line options\
  \ and arguments. This \ncould lead to the disclosure of the script's source code or arbitrary\
  \ code \nexecution with the privileges of the PHP interpreter. (CVE-2012-1823) \n\nRed Hat\
  \ is aware that a public exploit for this issue is available that \nallows remote code execution\
  \ in affected PHP CGI configurations. This flaw \ndoes not affect the default configuration\
  \ using the PHP module for Apache \nhttpd to handle PHP scripts.\n\nAll php53 users should\
  \ upgrade to these updated packages, which contain a\nbackported patch to resolve this issue.\
  \ After installing the updated\npackages, the httpd daemon must be restarted for the update\
  \ to take effect."
