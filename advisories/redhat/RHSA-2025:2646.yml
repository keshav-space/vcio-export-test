    record_id: CVE-2024-53197
  - description: The Linux kernel contains a use of uninitialized resource vulnerability that
      allows an attacker to leak kernel memory via a specially crafted HID report.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-03-25'
