summary: |
  An update for acl is now available for Red Hat Enterprise Linux 8.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Access Control Lists (ACLs) are used to define fine-grained discretionary access rights for files and directories. The acl packages contain the getfacl and setfacl utilities needed for manipulating access control lists.

  Security Fix(es):

  * acl: Symlink traversal privilege escalation via libacl functions (CVE-2026-54369)

  * acl: TOCTOU Symlink Traversal via getfacl/setfacl (CVE-2026-54370)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
