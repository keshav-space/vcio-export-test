summary: "Red Hat OpenShift Data Foundation 4.22.0 security, enhancement & bug fix update\n\n\
  Red Hat OpenShift Data Foundation 4.22.0 security, enhancement & bug fix update\n\nFIXED BUGS:\n\
  ==========\nDFBUGS-8228: DRPolicy is not updated with the SC name after creating EC RBD pool\
  \ and SC on a default replica3 cluster\nDFBUGS-8114: [Backport to odf-4.22.0] [RDR] Same groupreplicationID\
  \ value is set to all RBD StorageClasses in peerClasses irrespective of different blockpools\n\
  DFBUGS-8039: [RDR] Granular VM DR is broken\nDFBUGS-8004: Buckets page went inaccessible after\
  \ recovering from disruptions induced to node where noobaa core pod is running\nDFBUGS-8002:\
  \ [MCG] OLM continuously cycles MCG deployments on Azure STS clusters due to non-deterministic\
  \ env var ordering\nDFBUGS-8000: [Backport to odf-4.22] [GSS] NooBaa NamespaceStore: Stale\
  \ External Connection on Endpoint Change\nDFBUGS-7980: Node Shutdown trigger read-write failure,\
  \ needs to modify terminationGracePeriodSeconds Values \nDFBUGS-7411: [RDR] [dryRun] For workload\
  \ in various states, ensure dryRun test failover can be promoted to real failover and works\
  \ correctly\nDFBUGS-7388: [4.22] CLONE - DR Page UI broken after OCP upgrade from 4.21 to\
  \ 4.22 nightly\nDFBUGS-7378: [release-4.22] CLONE - [GSS] odf-blackbox-exporter ODFNodeLatencyHighOnOSDNodes\
  \ : msg=\"Timeout reading from socket\" module=icmp_internal\nDFBUGS-7355: CVE vulnerabilities\
  \ in ODF 4.22 release\nDFBUGS-7347: ocs-operator hardcodes NooBaa autoscalerType to hpav2,\
  \ preventing KEDA autoscaling\nDFBUGS-7337: [4.22] QueryVectors returns identical distance\
  \ values regardless of index distance metric (cosine vs euclidean)\nDFBUGS-7328: High CPU\
  \ usage of nodejs built in https.Agent.getName function\nDFBUGS-7327: [Fusion Access][Migration]Scale\
  \ operator deployment scales down to 0 following upgrade from 6.0.0.2 to 6.0.1.0 during migration\n\
  DFBUGS-7325: [Fusion Access][Migration] FDF UI is not enabled following Fusion Access to Data\
  \ Foundation Fusion access migration"
