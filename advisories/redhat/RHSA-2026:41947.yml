summary: "An update for the nodejs:22 module is now available for Red Hat Enterprise Linux 8.\n\
  \nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nNode.js is a software development platform for building fast and scalable network applications\
  \ in the JavaScript programming language. \n\nSecurity Fix(es):\n\n* ip-address: ip-address:\
  \ Cross-site scripting via improper HTML escaping of untrusted input (CVE-2026-42338)\n\n\
  * undici: undici: Denial of Service due to unbounded memory growth via WebSocket frames (CVE-2026-12151)\n\
  \n* undici: Undici: Information disclosure due to improper cache-control header parsing (CVE-2026-9678)\n\
  \n* undici: Undici: Response queue poisoning on reused keep-alive sockets can lead to incorrect\
  \ response delivery. (CVE-2026-6733)\n\n* undici: undici: Weakening of cookie SameSite policy\
  \ due to incorrect parsing of Set-Cookie header (CVE-2026-11525)\n\n* nodejs: Node.js: Denial\
  \ of Service via unlimited HTTP/2 ORIGIN frames (CVE-2026-48619)\n\n* nodejs: Node.js: Silent\
  \ authority rebinding due to embedded-nul hostnames in TLS handling (CVE-2026-48930)\n\n*\
  \ nodejs: Node.js: Unauthorized file metadata modification (CVE-2026-48935)\n\n* nodejs: Node.js\
  \ WebCrypto: Denial of Service via large input to subtle.encrypt() (CVE-2026-48933)\n\n* nodejs:\
  \ Node.js: Certification validation bypass in TLS host verification (CVE-2026-48934)\n\n*\
  \ Node.js: Node.js: Trust-policy bypass due to hostname matching inconsistency (CVE-2026-48928)\n\
  \n* nodejs: Node.js: Information disclosure of proxy credentials via proxy tunnel error handling\
  \ (CVE-2026-48615)\n\n* nodejs: Node.js: Authentication bypass due to TLS hostname handling\
  \ and unicode dot separator mismatch (CVE-2026-48618)\n\nBug Fix(es) and Enhancement(s):\n\
  \n* nodejs:22/nodejs: Rebase to the latest Node.js 22 release [rhel-8] (JIRA:RHEL-176170)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
