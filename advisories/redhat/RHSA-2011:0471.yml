exploits:
  - description: Mozilla Firefox 3.6.16 (OSX) - mChannel Use-After-Free (Metasploit) (2)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2012-01-17'
    exploit_type: remote
    platform: osx
    source_date_updated: !!timestamp '2017-04-01'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2011-0065
  - description: |
      This module exploits a use after free vulnerability in Mozilla
                Firefox 3.6.16. An OBJECT Element mChannel can be freed via the
                OnChannelRedirect method of the nsIChannelEventSink Interface. mChannel
                becomes a dangling pointer and can be reused when setting the OBJECTs
                data attribute. (Discovered by regenrecht). This module uses heapspray
                with a minimal ROP chain to bypass DEP on Windows XP SP3. Additionlay,
                a windows 7 target was provided using JAVA 6 and below to avoid aslr.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2011-05-10'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/mozilla_mchannel.rb
    record_id: /modules/exploits/windows/browser/mozilla_mchannel.rb
  - description: |
      This module exploits a code execution vulnerability in Mozilla Firefox
                3.6.x <= 3.6.16 and 3.5.x <= 3.5.17 found in nsTreeSelection.
                By overwriting a subfunction of invalidateSelection it is possible to free the
                nsTreeRange object that the function currently operates on.
                Any further operations on the freed object can result in remote code execution.
                Utilizing the call setup the function provides it's possible to bypass DEP
                without the need for a ROP. Sadly this exploit is still either dependent
                on Java or bound by ASLR because Firefox doesn't employ any ASLR-free
                modules anymore.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2011-02-02'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/browser/mozilla_nstreerange.rb
    record_id: /modules/exploits/windows/browser/mozilla_nstreerange.rb
  - description: Mozilla Firefox - 'nsTreeRange' Dangling Pointer (2)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2011-06-20'
    exploit_type: remote
    platform: windows
    source_date_updated: !!timestamp '2011-06-20'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2011-0073
  - description: |
      This module exploits a use-after-free vulnerability in Mozilla
                Firefox 3.6.16. An OBJECT element, mChannel, can be freed via the
                OnChannelRedirect method of the nsIChannelEventSink Interface. mChannel
                becomes a dangling pointer and can be reused when setting the OBJECTs
                data attribute. This module has been tested on Mac OS X 10.6.6, 10.6.7,
                10.6.8, 10.7.2 and 10.7.3.
    required_action:
    due_date:
    notes: |
      Reliability:
