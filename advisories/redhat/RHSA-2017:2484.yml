exploits:
  - description: Git < 2.7.5 - Command Injection (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2017-08-31'
    exploit_type: remote
    platform: python
    source_date_updated: !!timestamp '2017-09-01'
    data_source: Exploit-DB
    source_url: https://github.com/rapid7/metasploit-framework/blob/202c936868328a4fe665c9d2ea82b8f8a2610b6e/modules/exploits/multi/http/git_submodule_command_exec.rb
    record_id: CVE-2017-1000117
  - description: |
      This module exploits CVE-2017-1000117, which affects Git
                version 2.7.5 and lower. A submodule of the form 'ssh://' can be passed
                parameters from the username incorrectly. This can be used to inject
                commands to the operating system when the submodule is cloned.

                This module creates a fake git repository which contains a submodule
                containing the vulnerability. The vulnerability is triggered when the
                submodules are initialised.
    required_action:
