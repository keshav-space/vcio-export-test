summary: |
  A new release is now available for Red Hat Satellite 6.19 for RHEL 9.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Red Hat Satellite is a system management solution that allows organizations
  to configure and maintain their systems without the necessity to provide
  public Internet access to their servers or other client systems. It
  performs provisioning and configuration management of predefined standard
  operating environments.

  Security Fix(es):

  * candlepin: mchange-commons-java: Arbitrary code execution via JNDI dereferencing of crafted objects (CVE-2026-27727)
  * yggdrasil-worker-forwarder: Incorrect parsing of IPv6 host literals in net/url (CVE-2026-25679)
  * yggdrasil-worker-forwarder: Go crypto/x509: Certificate validation bypass due to incorrect DNS constraint application (CVE-2026-33810)
  * yggdrasil-worker-forwarder: Root.Chmod can follow symlinks out of the root (CVE-2026-32282)
  * yggdrasil-worker-forwarder: Go: Denial of Service vulnerability in certificate chain building (CVE-2026-32280)
  * yggdrasil-worker-forwarder: Go crypto/tls: Denial of Service via multiple TLS 1.3 key update messages (CVE-2026-32283)
  * yggdrasil-worker-forwarder: Go crypto/x509: Denial of Service via inefficient certificate chain validation (CVE-2026-32281)
  * python-pillow: Pillow: Denial of Service via decompression bomb in FITS image processing (CVE-2026-40192)
  * python-pyjwt: PyJWT: Authentication bypass due to forged JSON Web Tokens (CVE-2026-48526)
  * foreman: foreman: Cross-tenant private SSH key disclosure via taxonomy scoping bypass (CVE-2026-5142)
  * foreman: Foreman: Information disclosure via improper validation of nested request parameters (CVE-2026-5138)
  * foreman: Foreman: Privilege escalation to administrator-level access via usergroup role assignment manipulation (CVE-2026-5136)
  * foreman: Foreman: Unauthorized modification of host configurations via broken access control (CVE-2026-5135)
