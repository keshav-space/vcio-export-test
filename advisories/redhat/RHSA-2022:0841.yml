exploits:
  - description: |
      This exploit targets a vulnerability in the Linux kernel since 5.8, that allows
                writing of read only or immutable memory.

                The vulnerability was fixed in Linux 5.16.11, 5.15.25 and 5.10.102.
                The module exploits this vulnerability by overwriting a suid binary with the
                payload, executing it, and then writing the original data back.

                There are two major limitations of this exploit: the offset cannot be on a page
                boundary (it needs to write one byte before the offset to add a reference to
                this page to the pipe), and the write cannot cross a page boundary.
                This means the payload must be less than the page size (4096 bytes).
    required_action:
    due_date:
    notes: |
      AKA:
        - Dirty Pipe
      Reliability:
        - repeatable-session
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-02-20'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/cve_2022_0847_dirtypipe.rb
    record_id: /modules/exploits/linux/local/cve_2022_0847_dirtypipe.rb
  - description: |
      If the vmwgfx driver fails to copy the 'fence_rep' object to userland, it tries to
                recover by deallocating the (already populated) file descriptor. This is
                wrong, as the fd gets released via put_unused_fd() which shouldn't be used,
                as the fd table slot was already populated via the previous call to
                fd_install(). This leaves userland with a valid fd table entry pointing to
                a free'd 'file' object.

                We use this bug to overwrite a SUID binary with our payload and gain root.
                Linux kernel 4.14 - 5.16.x are vulnerable.

                Successfully tested against Ubuntu 22.04.01 with kernel 5.13.12-051312-generic.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-os-down
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-01-28'
