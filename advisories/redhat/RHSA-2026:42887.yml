summary: |
  An update for java-17-openjdk is now available for Red Hat Enterprise Linux 8.6 Advanced Mission Critical Update Support, Red Hat Enterprise Linux 8.6 Update Services for SAP Solutions, Red Hat Enterprise Linux 8.6 Telecommunications Update Service, Red Hat Enterprise Linux 8.4 Advanced Mission Critical Update Support, Red Hat Enterprise Linux 8.4 Update Services for SAP Solutions, Red Hat Enterprise Linux 8.4 Telecommunications Update Service, Red Hat Enterprise Linux 8, Red Hat Enterprise Linux 8.8 Extended Update Support, Red Hat Enterprise Linux 9.2 Extended Update Support, Red Hat Enterprise Linux 9.4 Extended Update Support, Red Hat Enterprise Linux 9.6 Extended Update Support, and Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The java-17-openjdk packages provide the OpenJDK 17 Java Runtime Environment and the OpenJDK 17 Java Software Development Kit.

  Security Fix(es):

  * JDK: Enhance TLS certificate handling (CVE-2026-46968)

  * JDK: Improve DTLS handshaking (CVE-2026-46917)

  * JDK: Enhance JPEG handling (CVE-2026-47010)

  * JDK: Enhance XBM image support (CVE-2026-47021)

  * JDK: Enhance Jar file processing (CVE-2026-47027)

  * JDK: Improve certification checking (CVE-2026-60147)

  * JDK: Enhance AWT ImagingLib (CVE-2026-47059)

  * JDK: Enhance Jar handling (CVE-2026-47063)

  * JDK: Update LCMS to 2.19 (CVE-2026-41254)

  Enhancement(s):

  * For the last couple of years, OpenJDK has used a single build shared among multiple RPMs and a tarball available on the customer portal.  The single "portable" build has a release number ('p') and each RPM has its own release number ('r').  However, the RPM naming only showed the RPM release number, while the version output from the build showed the portable release number, making it unclear that they were different numbers.  From this release onwards, a release field of the form 'p.r' is always used for RPMs and the version output shows 'p'. (RHEL-212474, RHEL-212475, RHEL-212476, RHEL-212477, RHEL-212478, RHEL-212479, RHEL-212480, RHEL-212481)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
