summary: |
  Updated java-1.4.2-ibm packages that fix several security issues are now
  available for Red Hat Enterprise Linux 4 Extras and Red Hat Enterprise
  Linux 5 Supplementary.

  The Red Hat Security Response Team has rated this update as having critical
  security impact. Common Vulnerability Scoring System (CVSS) base scores,
  which give detailed severity ratings, are available for each vulnerability
  from the CVE links in the References section.

  The IBM 1.4.2 SR13-FP10 Java release includes the IBM Java 2 Runtime
  Environment and the IBM Java 2 Software Development Kit.

  This update fixes several vulnerabilities in the IBM Java 2 Runtime
  Environment and the IBM Java 2 Software Development Kit. Detailed
  vulnerability descriptions are linked from the IBM "Security alerts" page,
  listed in the References section. (CVE-2011-0311, CVE-2011-0802,
  CVE-2011-0814, CVE-2011-0862, CVE-2011-0865, CVE-2011-0867, CVE-2011-0871)

  Note: The RHSA-2011:0490 java-1.4.2-ibm update did not, unlike the erratum
  text stated, provide a complete fix for the CVE-2011-0311 issue.

  All users of java-1.4.2-ibm are advised to upgrade to these updated
  packages, which contain the IBM 1.4.2 SR13-FP10 Java release. All running
  instances of IBM Java must be restarted for this update to take effect.
