    record_id: /modules/exploits/multi/http/spring_cloud_function_spel_injection.rb
  - description: When using routing functionality in VMware Tanzu's Spring Cloud Function, it
      is possible for a user to provide a specially crafted SpEL as a routing-expression that
      may result in remote code execution and access to local resources.
    required_action: Apply updates per vendor instructions.
