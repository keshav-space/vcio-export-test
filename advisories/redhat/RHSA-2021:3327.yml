    record_id: /modules/exploits/linux/local/netfilter_xtables_heap_oob_write_priv_esc.rb
  - description: Linux Kernel contains a heap out-of-bounds write vulnerability that could allow
      an attacker to gain privileges or cause a DoS (via heap memory corruption) through user
      name space.
