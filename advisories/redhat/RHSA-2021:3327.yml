exploits:
  - description: Linux Kernel 2.6.19 < 5.9 - 'Netfilter Local Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2021-07-15'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2021-11-17'
    data_source: Exploit-DB
    source_url: https://github.com/google/security-research/blob/d4d6a96c9c8b00929559a84f3d7560903b6413c2/pocs/linux/cve-2021-22555/exploit.c
    record_id: CVE-2021-22555
  - description: |
      A heap out-of-bounds write affecting Linux since v2.6.19-rc1 was discovered in net/netfilter/x_tables.c.
                This allows an attacker to gain privileges or cause a DoS (via heap memory corruption) through user name space.
                Kernels up to 5.11 (including) are vulnerable.
                More information about vulnerable kernels is
                available at https://nvd.nist.gov/vuln/detail/CVE-2021-22555#vulnConfigurationsArea
    required_action:
    due_date:
    notes: |
      Reliability:
        - unreliable-session
      Stability:
        - os-resource-loss
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-07-07'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
