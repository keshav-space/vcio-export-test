summary: |
  An update is now available for Red Hat Ansible Automation Platform 2.5

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Ansible Automation Platform provides an enterprise framework for building, deploying and managing IT automation at scale. IT Managers can provide top-down guidelines on how automation is applied to individual teams, while automation developers retain the freedom to write tasks that leverage existing knowledge without the overhead. Ansible Automation Platform makes it possible for users across an organization to share, vet, and manage automation content by means of a simple, powerful, and agentless language.

  Security Fix(es):

  * automation-controller: notification backends allow SSRF and credential leakage (CVE-2026-71366)
  * automation-controller: webhook status callback SSRF leaks the Git PAT (CVE-2026-71365)
  * automation-controller: project archive extraction allows path traversal file writes (CVE-2026-71364)
  * automation-controller: AIOHTTP: Denial of Service via malformed HTTP responses (CVE-2026-69244)
  * automation-controller: pyasn1: Denial of Service via crafted ASN.1 REAL values (CVE-2026-59886)
  * automation-controller: AIOHTTP: Arbitrary code execution via untrusted input to CookieJar.load() (CVE-2026-34993)
  * automation-controller: path traversal via YAML !include directive (CVE-2026-52902)
  * automation-controller: JWCrypto: Memory exhaustion via crafted compressed JWE tokens (CVE-2026-39373)
  * automation-gateway: path Traversal via unsanitized prefix/postfix enables directory escape (CVE-2026-44705)
  * python3.12-aiohttp: HTTP Request Smuggling via WebSocket Upgrade (CVE-2026-69243)
  * python3.12-aiohttp: Denial of Service via malformed HTTP responses (CVE-2026-69244)
  * python3.12-django: Remote code execution via GeoDjango spatial lookups (CVE-2026-15307)
  * python3.12-gitpython: Command Injection via Git option prefix abbreviation (CVE-2026-67325)
  * python3.12-gitpython: Arbitrary Code Execution via Joined Short Options Bypass (CVE-2026-67324)
  * python3.12-gitpython: Arbitrary code execution via command injection due to unguarded Git options (CVE-2026-67323)
  * python3.12-gitpython: Environment variable exfiltration via attacker-controlled clone URL (CVE-2026-67322)
  * python3.12-gitpython: Arbitrary file overwrite and read via unsafe git option forwarding (CVE-2026-73620)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  For details about this release, refer to the release notes listed in the References section.
