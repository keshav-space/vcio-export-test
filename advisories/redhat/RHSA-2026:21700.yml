summary: "An update for cockpit is now available for Red Hat Enterprise Linux 8.10 \n\nRed Hat\
  \ Product Security has rated this update as having a security impact of\nImportant. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives\na detailed severity rating,\
  \ is available for each vulnerability from the CVE\nlink(s) in the References section.\n\n\
  Cockpit enables users to administer GNU/Linux servers using a web browser. It\noffers network\
  \ configuration, log inspection, diagnostic reports, SELinux\ntroubleshooting, interactive\
  \ command-line sessions, and more.\n\nSecurity Fix(es):\n\n* cockpit: Cockpit: Arbitrary command\
  \ execution via crafted links in system logs\nUI (CVE-2026-4802)\n\nFor more details about\
  \ the security issue(s), including the impact, a CVSS\nscore, acknowledgments, and other related\
  \ information, refer to the CVE page(s)\nlisted in the References section."
