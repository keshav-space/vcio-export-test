exploits:
  - description: LibreOffice < 6.2.6 Macro - Python Code Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2019-08-21'
    exploit_type: remote
    platform: multiple
    source_date_updated: !!timestamp '2019-08-21'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2019-9851
  - description: |
      LibreOffice comes bundled with sample macros written in Python and
                allows the ability to bind program events to them.

                LibreLogo is a macro that allows a program event to execute text as Python code, allowing RCE.

                This module generates an ODT file with a dom loaded event that,
                when triggered, will execute arbitrary python code and the metasploit payload.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2019-07-16'
    exploit_type:
    platform: Python
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/fileformat/libreoffice_logo_exec.rb
