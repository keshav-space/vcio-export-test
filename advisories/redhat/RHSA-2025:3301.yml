exploits:
  - description: Linux Kernel contains an out-of-bounds access vulnerability in the USB-audio
      driver that allows an attacker with physical access to the system to use a malicious USB
      device to potentially manipulate system memory, escalate privileges, or execute arbitrary
      code.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-04-30'
    notes: 'This vulnerability affects a common open-source component, third-party library,
