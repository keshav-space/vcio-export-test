summary: |
  An update for grafana is now available for Red Hat Enterprise Linux 9.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which givesa detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  grafana-pcp is an open source Grafana plugin for PCP.

  Security Fix(es):

  * grafana-pcp: golang-fips/openssl: Memory leaks in code encrypting and decrypting RSA payloads (CVE-2024-1394)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
