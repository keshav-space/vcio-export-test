  - CVE-2026-54230
  - CVE-2026-54231
summary: "An update for abrt is now available for Red Hat Enterprise Linux 8.\n\nRed Hat Product\
  \ Security has rated this update as having a security impact of Important. A Common Vulnerability\
  \ Scoring System (CVSS) base score, which gives a detailed severity rating, is available for\
  \ each vulnerability from the CVE link(s) in the References section.\n\nThe Automatic Bug\
  \ Reporting Tool (ABRT) recognizes defects in applications and creates bug reports that help\
  \ maintainers fix the defects. ABRT uses a plug-in system to extend its functionality. \n\n\
  Security Fix(es):\n\n* abrt: TOCTOU race condition in abrt-dbus SetElement allows arbitrary\
  \ file writes to dump directories (CVE-2026-54228)\n\n* abrt: ChownProblemDir succeeds during\
  \ active post-create event processing due to inadequate locking (CVE-2026-54229)\n\n* abrt:\
  \ event handler scripts follow symlinks when writing output files, allowing arbitrary file\
  \ overwrites (CVE-2026-54230)\n\n* abrt: unsanitized systemd journal content written to dump\
  \ directory files enables content injection (CVE-2026-54231)\n\nFor more details about the\
  \ security issue(s), including the impact, a CVSS score, acknowledgments, and other related\
  \ information, refer to the CVE page(s) listed in the References section."
