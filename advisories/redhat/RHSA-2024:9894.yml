summary: |
  An update is now available for Red Hat Ansible Automation Platform 2.5

  Red Hat Product Security has rated this update as having a security impact of Moderate. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  Red Hat Ansible Automation Platform provides an enterprise framework for building, deploying and managing IT automation at scale. IT Managers can provide top-down guidelines on how automation is applied to individual teams, while automation developers retain the freedom to write tasks that leverage existing knowledge without the overhead. Ansible Automation Platform makes it possible for users across an organization to share, vet, and manage automation content by means of a simple, powerful, and agentless language.

  Security Fix(es):

  * ansible-core: Exposure of Sensitive Information in Ansible Vault Files Due to Improper Logging (CVE-2024-8775)
  * ansible-core: ansible-core user may read/write unauthorized content (CVE-2024-9902)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.

  Updates and fixes included:

  Automation Platform UI
  * Fix filtering out hosts on inventory group (AAP-34752)
  * automation-gateway has been updated to 2.5.3-2

  Container-based Ansible Automation Platform
  * Fix issue when port value isn't defined in the gateway_main_url variable (AAP-34716)
  * Don't add port to image URLs when using default value (AAP-34070)
  * containerized installer setup has been updated to 2.5-4

  RPM-based Ansible Automation Platform
  * Fix issue not setting up gpg agent socket properly when multiple hub nodes are configured (AAP-34067)
  * ansible-automation-platform-installer and installer setup have been updated to 2.5-5

  Additional changes:
  * ansible-core has been updated to 2.16.13
  * molecule has been updated to 24.9.0-2
