advisory_id: RHSA-2026:28227
datasource_id: redhat/RHSA-2026:28227
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2026/rhsa-2026_28227.json
aliases:
  - CVE-2026-45491
  - CVE-2026-45591
summary: |
  An update for .NET 8.0 is now available for Red Hat Enterprise Linux 9.4 Update Services for SAP Solutions.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  .NET is a managed-software framework. It implements a subset of the .NET framework APIs and several new APIs, and it includes a CLR implementation.

  New versions of .NET that address a security vulnerability are now available. The updated versions are .NET SDK 8.0.128 and .NET Runtime 8.0.28.

  Security Fix(es):

  * dotnet: .NET: Local file tampering via link following vulnerability (CVE-2026-45491)

  * dotnet: ASP.NET Core: Denial of Service via uncontrolled resource consumption (CVE-2026-45591)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
