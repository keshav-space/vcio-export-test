summary: |
  Red Hat OpenShift Container Platform low-latency extras release 4.11, which provides an update for cnf-tests-container, dpdk-base-container and performance-addon-operator-must-gather-rhel8-container is now available.
  Secondary scheduler builds and
  numaresources-operator are also available for developer preview with this
  release, however they are not intended for production.

  Red Hat OpenShift Container Platform is Red Hat's cloud computing Kubernetes application platform solution designed for on-premise or private cloud deployments.

  This advisory contains the extra low-latency container images for Red Hat OpenShift Container Platform 4.11. See the following advisory for the container images for this release:

  https://access.redhat.com/errata/RHSA-2022:5069

  All OpenShift Container Platform users are advised to upgrade to these updated packages and images.
