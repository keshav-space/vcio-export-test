  - description: Adobe Flash Player 9/10 - SWF Version Null Pointer Dereference Denial of Service
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2008-10-02'
    exploit_type: dos
