exploits:
  - description: |
      This exploit targets the Linux kernel bug in OverlayFS.

                A flaw was found in the Linux kernel, where unauthorized access to the execution of the setuid file with capabilities
                was found in the Linux kernel's OverlayFS subsystem in how a user copies a capable file from a nosuid mount into another mount.
                This uid mapping bug allows a local user to escalate their privileges on the system.
    required_action:
    due_date:
    notes: |
      Reliability:
        - repeatable-session
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2023-03-22'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/cve_2023_0386_overlayfs_priv_esc.rb
    record_id: /modules/exploits/linux/local/cve_2023_0386_overlayfs_priv_esc.rb
  - description: Linux kernel contains a use-after-free vulnerability that allows for privilege
      escalation to gain ring0 access from the system user.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2023-04-20'
    notes: https://git.kernel.org/pub/scm/linux/kernel/git/stable/stable-queue.git/tree/queue-5.10/alsa-pcm-move-rwsem-lock-inside-snd_ctl_elem_read-to-prevent-uaf.patch?id=72783cf35e6c55bca84c4bb7b776c58152856fd4;  https://nvd.nist.gov/vuln/detail/CVE-2023-0266
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
