  - description: Sudo contains an inclusion of functionality from untrusted control sphere vulnerability.
      This vulnerability could allow local attacker to leverage sudo’s -R (--chroot) option
      to run arbitrary commands as root, even if they are not listed in the sudoers file.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-10-20'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://www.sudo.ws/security/advisories/chroot_bug/ ; https://nvd.nist.gov/vuln/detail/CVE-2025-32463'
