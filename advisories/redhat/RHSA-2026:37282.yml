summary: "An update for unbound is now available for Red Hat Enterprise Linux 8.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  The unbound packages provide a validating, recursive, and caching DNS or DNSSEC resolver.\
  \ \n\nSecurity Fix(es):\n\n* unbound: Unbound: Denial of Service via excessive EDNS options\
  \ (CVE-2026-41292)\n\n* unbound: Unbound: Cache manipulation via 'ghost domain names' attack\
  \ (CVE-2026-40622)\n\n* unbound: Unbound: Denial of Service due to excessive resource consumption\
  \ with large DNS Resource Record Sets (CVE-2026-44390)\n\n* unbound: Unbound: Denial of Service\
  \ due to degraded resolution performance in jostle logic (CVE-2026-42534)\n\nFor more details\
  \ about the security issue(s), including the impact, a CVSS score, acknowledgments, and other\
  \ related information, refer to the CVE page(s) listed in the References section."
