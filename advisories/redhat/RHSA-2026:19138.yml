advisory_id: RHSA-2026:19138
datasource_id: redhat/RHSA-2026:19138
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2026/rhsa-2026_19138.json
aliases:
  - CVE-2026-30922
  - CVE-2026-32597
summary: "An update for fence-agents is now available for Red Hat Enterprise Linux 10.\n\nRed\
  \ Hat Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  The fence-agents packages provide a collection of scripts for handling remote power management\
  \ for cluster devices. They allow failed or unreachable nodes to be forcibly restarted and\
  \ removed from the cluster. \n\nSecurity Fix(es):\n\n* pyjwt: PyJWT accepts unknown `crit`\
  \ header extensions (RFC 7515 ?4.1.11 MUST violation) (CVE-2026-32597)\n\n* pyasn1: pyasn1\
  \ Vulnerable to Denial of Service via Unbounded Recursion (CVE-2026-30922)\n\nFor more details\
  \ about the security issue(s), including the impact, a CVSS score, acknowledgments, and other\
  \ related information, refer to the CVE page(s) listed in the References section."
