summary: |
  An update for erlang is now available for Red Hat OpenStack Services on
  OpenShift 18.0 (Antelope).

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Erlang is a general-purpose programming language and runtime environment.
  Erlang has built-in support for concurrency, distribution and fault
  tolerance. Erlang is used in several large telecommunication systems from
  Ericsson.

  Security Fix(es):

  * Erlang OTP public_key: Certificate chain forgery via improper trust chain
  validation (CVE-2026-42789)

  * Erlang OTP public_key: Certificate validation bypass allows hostname
  spoofing (CVE-2026-42790)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE
  page listed in the References section.
