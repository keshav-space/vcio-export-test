exploits:
  - description: Ray-Project Ray contains a code injection vulnerability that could allow remote
      code execution. Developers using Ray as a development tool may be exposed to this vulnerability
      exploitable through Firefox and Safari.
    required_action: Apply mitigations in accordance with vendor instructions, ensuring compliance
      with CISA’s BOD 26-04 Prioritizing Security Updates Based on Risk (see URL in Notes) guidance
      and CISA’s “Forensics Triage Requirements” (see URL in Notes). Follow applicable BOD 26-04
      guidance for cloud services or discontinue use of the product if mitigations are unavailable.
      Stakeholders are responsible for evaluating each asset's internet exposure and ensuring
      adherence to BOD 26-04 patching guidelines.
