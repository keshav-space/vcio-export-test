summary: "A security advisory update for rh-podman-desktop is now available for Red Hat Enterprise\
  \ Linux 10.\n\nRed Hat build of Podman Desktop is a graphical tool for managing containers\
  \ using Podman. It allows users to run, manage, and configure containers and container images\
  \ using a desktop GUI.\n\nMost notable CVE and Bug Fix(es) and Enhancement(s):\n\n* Issues\
  \ for CVE fix 1.1.1 (JIRA:RHDESK-595) \n* Fix for RHDESK-529, RHDESK-530, RHDESK-531 - \"\
  fast-uri: Path traversal vulnerability allows bypass of security policies (CVE-2026-6321)\"\
  \n* Fix for RHDESK-611 - \"protobufjs: Arbitrary code execution due to unsafe expression generation\
  \ from crafted protobuf descriptors (CVE-2026-44293)\"\n * Fix for RHDESK-640 - \"fast-uri:\
  \ URI authority bypass due to improper delimiter handling (CVE-2026-6322)\""
