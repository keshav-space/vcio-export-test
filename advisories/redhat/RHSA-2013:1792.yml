summary: |
  This is the 1-Month notification for the retirement of Red Hat Enterprise
  Linux 6.2 Extended Update Support (EUS).

  In accordance with the Red Hat Enterprise Linux Errata Support Policy,
  Extended Update Support for Red Hat Enterprise Linux 6.2 will be retired as
  of January 7, 2014, and support will no longer be provided. Accordingly,
  Red Hat will no longer provide updated packages, including critical impact
  security patches or urgent priority bug fixes, for Red Hat Enterprise Linux
  6.2 EUS after that date. In addition, technical support through Red Hat's
  Global Support Services will no longer be provided after January 7, 2014.

  Note: This notification applies only to those customers subscribed to the
  Extended Update Support (EUS) channel for Red Hat Enterprise Linux 6.2.

  We encourage customers to plan their migration from Red Hat Enterprise
  Linux 6.2 to a more recent version of Red Hat Enterprise Linux 6. As a
  benefit of the Red Hat subscription model, customers can use their active
  subscriptions to entitle any system on a currently supported Red Hat
  Enterprise Linux 6 release (6.3 or 6.4, for which EUS is available).

  Details of the Red Hat Enterprise Linux life cycle can be found here:
  https://www.redhat.com/security/updates/errata/
