exploits:
  - description: |
      A remotely exploitable vulnerability exists within SharePoint that can be leveraged by a remote authenticated
                attacker to execute code within the context of the SharePoint application service. The privileges in this
                execution context are determined by the account that is specified when SharePoint is installed and configured.
                The vulnerability is related to a failure to validate the source of XML input data, leading to an unsafe
                deserialization operation that can be triggered from a page that initializes either the
                ContactLinksSuggestionsMicroView type or a derivative of it. In a default configuration, a Domain User account
                is sufficient to access SharePoint and exploit this vulnerability.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2020-07-14'
    exploit_type:
    platform: Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/http/sharepoint_data_deserialization.rb
    record_id: /modules/exploits/windows/http/sharepoint_data_deserialization.rb
  - description: Microsoft .NET Framework, Microsoft SharePoint, and Visual Studio contain a
      remote code execution vulnerability when the software fails to check the source markup
      of XML file input. Successful exploitation allows an attacker to execute code in the context
      of the process responsible for deserialization of the XML content.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-05-03'
