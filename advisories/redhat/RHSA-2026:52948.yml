summary: |
  An update for java-21-ibm-semeru-certified-jdk is now available for Red Hat Enterprise Linux 10.0 Extended Update Support and Red Hat Enterprise Linux 10.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The IBM Semeru Runtime Certified Edition 21 runtime environment.

  Security Fix(es):

  * Little CMS: lcms2: mm2/Little-CMS: Little CMS: Information disclosure or denial of service via integer overflow in CubeSize (CVE-2026-41254)

  * openjdk: Enhance TLS certificate handling (CVE-2026-46968)

  * openjdk: Improve DTLS handshaking (Oracle CPU 2026-07) (CVE-2026-46917)

  * openjdk: Enhance JPEG handling (Oracle CPU 2026-07) (CVE-2026-47010)

  * openjdk: Enhance XBM image support (Oracle CPU 2026-07) (CVE-2026-47021)

  * openjdk: Enhance Jar file processing (Oracle CPU 2026-07) (CVE-2026-47027)

  * openjdk: Enhance AWT ImagingLib (Oracle CPU 2026-07) (CVE-2026-47059)

  * openjdk: Enhance Jar handling (Oracle CPU 2026-07) (CVE-2026-47063)

  * openjdk: Improve certification checking (Oracle CPU 2026-07) (CVE-2026-60147)

  * Eclipse Foundation OpenJ9: Eclipse OpenJ9: Buffer underflow via tracing method arguments (CVE-2026-16439)

  * Eclipse OMR: Eclipse OMR: Denial of service via improper input validation in arraycmp SIMD (CVE-2026-16243)

  * Eclipse Foundation OpenJ9: Eclipse OpenJ9: Incorrect method delegation can lead to integrity issues (CVE-2026-16441)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
