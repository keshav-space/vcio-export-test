summary: |
  A new release is now available for Red Hat Satellite 6.17 for RHEL 9.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Red Hat Satellite is a system management solution that allows organizations
  to configure and maintain their systems without the necessity to provide
  public Internet access to their servers or other client systems. It
  performs provisioning and configuration management of predefined standard
  operating environments.

  Security Fix(es):

    * pulpcore: relative_path_validator bypass via directory traversal in FilesystemExport (CVE-2026-12701)

    * yggdrasil-worker-forwarder: Incorrect parsing of IPv6 host literals in net/url (CVE-2026-25679)

    * yggdrasil-worker-forwarder: gRPC-Go: Authorization bypass due to improper HTTP/2 path validation (CVE-2026-33186)

    * yggdrasil-worker-forwarder: golang.org/x/net/idna: Privilege escalation via incorrect Punycode label processing (CVE-2026-39821)

    * yggdrasil-worker-forwarder: Go net package: Denial of Service via long CNAME response in LookupCNAME (CVE-2026-33811)

    * yggdrasil-worker-forwarder: golang crypto/x509: Denial of Service via excessive processing of DNS SAN entries (CVE-2026-27145)

    For more details about the security issue(s), including the impact, a CVSS
    score, acknowledgments, and other related information, refer to the CVE
    page(s) listed in the References section.

    Bug Fix(es):

    * Satellite 6.16→6.17 upgrade fails: pulpcore-manager rpm-datarepair 4073 CommandError: Unknown issue: '4073' (SAT-47477)
