summary: |
  Red Hat build of Apache Camel 4.18.3 for Spring Boot patch release and security update is now available.

  Red Hat Product Security has rated this update as having a security impact of
  Important. A Common Vulnerability Scoring System (CVSS) base score, which gives
  a detailed severity rating, is available for each vulnerability from the CVE
  link(s) in the References section.

  Red Hat build of Apache Camel 4.18.3 for Spring Boot patch release and security update is now available.

  The purpose of this text-only errata is to inform you about the security issues fixed.

  Security Fix(es):

  * vertx-core: eclipse-vertx/vert.x: Denial of Service via TLS handshake with wildcard server name (CVE-2026-6860)

  * jackson-databind: jackson-databind: Arbitrary code execution via PolymorphicTypeValidator bypass (CVE-2026-54512)

  * jackson-databind: Jackson-databind: Denial of Service via deeply nested JSON processing (CVE-2026-50193)

  * c3p0: c3p0: Remote code execution via deserialization vulnerability (CVE-2026-55223)

  * mchange-commons-java: mchange-commons-java: Remote code execution via JNDI injection (CVE-2026-55153)

  * jackson-databind: Jackson-databind: Security bypass allows arbitrary code execution (CVE-2026-54513)

  * httpcore: Apache HttpComponents Core: Denial of Service via excessive HTTP headers (CVE-2026-54399)

  * camel-jms: Apache Camel JMS components: Arbitrary Exchange state injection (CVE-2026-43866)

  * camel-vertx-websocket: Apache Camel Vertx Websocket: Server-Side Request Forgery and sensitive data exposure (CVE-2026-46726)

  * camel-cxf-common: Apache Camel CXF SOAP: Remote attacker can execute unintended operations via header manipulation (CVE-2026-46592)

  * camel-mail: Apache Camel Mail Component: Credential exposure and information disclosure via improper input validation of mail headers (CVE-2026-46584)

  * camel-vertx-http: Apache Camel (camel-vertx-http): Remote Code Execution via Deserialization of Untrusted Data (CVE-2026-40859)

  * httpcore5-h2: Apache HttpComponents Core: Denial of Service via oversized HTTP/2 HPACK header blocks (CVE-2026-54428)

  * httpcore5: Apache HttpComponents Core: Denial of Service via excessive HTTP headers (CVE-2026-54399)

  * commons-configuration2: Apache Commons Configuration: Denial of Service via uncontrolled recursion with crafted YAML input (CVE-2026-45205)

  * netty-codec-stomp: Netty: Denial of Service vulnerability in STOMP decoder (CVE-2026-44891)

  * vertx-web-client: Eclipse Vert.x Web Client: Information disclosure via improper cookie domain validation (CVE-2026-15076)

  * netty-codec-http: Netty: Denial of Service via SPDY header decompression amplification (CVE-2026-55833)

  * netty-codec-http: Netty: Denial of Service via SPDY SETTINGS frame processing (CVE-2026-55831)

  * netty-codec-haproxy: Netty codec-haproxy: Denial of Service via crafted PROXY protocol v2 message (CVE-2026-55851)

  * netty-codec-http: Netty: Denial of Service via memory exhaustion in SPDY-to-HTTP codec (CVE-2026-56745)

  * netty-codec-http: Netty: Security control bypass allows unauthorized requests via null origin header (CVE-2026-56746)

  * netty-codec-xml: Netty: Information disclosure via XML External Entity (XXE) vulnerability (CVE-2026-56817)

  * netty-codec-http2: Netty: Denial of Service via HTTP/2 DATA frame memory leak (CVE-2026-56819)

  * netty-handler-ssl-ocsp: Netty: Certificate revocation bypass via OCSP response replay attack (CVE-2026-56820)

  * netty-codec-http: Netty: Memory exhaustion in netty-codec-http (CVE-2026-59899)
