exploits:
  - description: Microsoft's Netlogon Remote Protocol (MS-NRPC) contains a privilege escalation
      vulnerability when an attacker establishes a vulnerable Netlogon secure channel connection
      to a domain controller. An attacker who successfully exploits the vulnerability could
      run a specially crafted application on a device on the network. The vulnerability is also
      known under the moniker of Zerologon.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-05-03'
    notes: 'Reference CISA''s ED 20-04 (https://www.cisa.gov/news-events/directives/ed-20-04-mitigate-netlogon-elevation-privilege-vulnerability-august-2020-patch-tuesday)
      for further guidance and requirements. Note: The due date for addressing this vulnerability
      aligns with the requirements outlined in ED 20-04. https://nvd.nist.gov/vuln/detail/CVE-2020-1472'
    known_ransomware_campaign_use: yes
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2020-1472
  - description: ZeroLogon - Netlogon Elevation of Privilege
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2020-11-18'
    exploit_type: remote
    platform: windows
    source_date_updated: !!timestamp '2020-11-18'
    data_source: Exploit-DB
    source_url:
    record_id: CVE-2020-1472
  - description: |
      A vulnerability exists within the Netlogon authentication process where the security properties granted by AES
                are lost due to an implementation flaw related to the use of a static initialization vector (IV). An attacker
                can leverage this flaw to target an Active Directory Domain Controller and make repeated authentication attempts
                using NULL data fields which will succeed every 1 in 256 tries (~0.4%). This module leverages the vulnerability
                to reset the machine account password to an empty string, which will then allow the attacker to authenticate as
                the machine account. After exploitation, it's important to restore this password to it's original value. Failure
                to do so can result in service instability.
    required_action:
    due_date:
    notes: |
      AKA:
        - Zerologon
      Stability:
        - crash-safe
      Reliability: []
      SideEffects:
        - config-changes
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/admin/dcerpc/cve_2020_1472_zerologon.rb
    record_id: /modules/auxiliary/admin/dcerpc/cve_2020_1472_zerologon.rb
