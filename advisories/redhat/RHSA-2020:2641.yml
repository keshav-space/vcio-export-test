advisory_id: RHSA-2020:2641
datasource_id: redhat/RHSA-2020:2641
datasource_url: https://security.access.redhat.com/data/csaf/v2/advisories/2020/rhsa-2020_2641.json
aliases:
  - CVE-2020-13379
summary: "An update for grafana is now available for Red Hat Enterprise Linux 8.\n\nRed Hat\
  \ Product Security has rated this update as having a security impact of Important. A Common\
  \ Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating,\
  \ is available for each vulnerability from the CVE link(s) in the References section.\n\n\
  Grafana is an open source, feature rich metrics dashboard and graph editor for Graphite, InfluxDB\
  \ & OpenTSDB. \n\nSecurity Fix(es):\n\n* grafana: SSRF incorrect access control vulnerability\
  \ allows unauthenticated users to make grafana send HTTP requests to any URL (CVE-2020-13379)\n\
  \nFor more details about the security issue(s), including the impact, a CVSS score, acknowledgments,\
  \ and other related information, refer to the CVE page(s) listed in the References section."
