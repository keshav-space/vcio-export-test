summary: |
  This is the one-month notification for the retirement of Red Hat Enterprise
  MRG Version 1 for Red Hat Enterprise Linux 5. This notification applies
  only to those customers with subscriptions for Red Hat Enterprise MRG
  Version 1 for Red Hat Enterprise Linux 5.

  In accordance with the Red Hat Enterprise MRG Life Cycle policy, the Red
  Hat Enterprise MRG product, which includes MRG-Messaging, MRG-Realtime, and
  MRG-Grid, Version 1 offering for Red Hat Enterprise Linux 5 will be retired
  as of March 31, 2014, and support will no longer be provided.

  Accordingly, Red Hat will no longer provide updated packages, including
  critical impact security patches or urgent priority bug fixes, for
  MRG-Messaging, MRG-Realtime, and MRG-Grid Version 1 on Red Hat Enterprise
  Linux 5 after that date. In addition, technical support through Red Hat's
  Global Support Services will no longer be provided for Red Hat Enterprise
  MRG Version 1 on Red Hat Enterprise Linux 5 after March 31, 2014.

  We encourage customers to plan their migration from Red Hat Enterprise MRG
  Version 1 for Red Hat Enterprise Linux 5 to Red Hat Enterprise MRG Version
  2 on either Red Hat Enterprise Linux 5 or Red Hat Enterprise Linux 6. As a
  benefit of the Red Hat subscription model, customers can use their active
  Red Hat Enterprise MRG subscriptions to entitle any system on a currently
  supported version of those products.

  Details of the Red Hat Enterprise MRG life cycle can be found here:
  https://access.redhat.com/site/support/policy/updates/mrg/
