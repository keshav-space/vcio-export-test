exploits:
  - description: |
      This module exploits a vulnerability due to the fact that
                AtomicReferenceArray uses the Unsafe class to store a reference in an
                array directly, which may violate type safety if not used properly.
                This allows a way to escape the JRE sandbox, and load additional classes
                in order to perform malicious operations.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-02-14'
    exploit_type:
    platform: Java,Linux,OSX,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/java_atomicreferencearray.rb
    record_id: /modules/exploits/multi/browser/java_atomicreferencearray.rb
