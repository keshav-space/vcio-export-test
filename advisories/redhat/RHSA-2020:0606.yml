summary: "An update is now available for Red Hat JBoss Enterprise Application Platform 7.2.\n\
  \nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nRed Hat JBoss Enterprise Application Platform 7 is a platform for Java applications based\
  \ on the WildFly application runtime.\n\nThis asynchronous patch is a security update for\
  \ the wildfly-security-manager package in Red Hat JBoss Enterprise Application Platform 7.2.\n\
  \nSecurity Fix(es):\n\n* netty: HTTP Request Smuggling due to Transfer-Encoding whitespace\
  \ mishandling (CVE-2020-7238)\n\n\t\nFor more details about the security issue(s), including\
  \ the impact, a CVSS score, and other related information, see the CVE page(s) listed in the\
  \ References section."
