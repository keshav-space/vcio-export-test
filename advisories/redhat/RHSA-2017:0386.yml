exploits:
  - description: Linux 4.4.0 < 4.4.0-53 - 'AF_PACKET chocobo_root' Local Privilege Escalation
      (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-05-22'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2018-11-15'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/88ab836e15dc5da85050b99910861cd10778c882/modules/exploits/linux/local/af_packet_chocobo_root_priv_esc.rb
    record_id: CVE-2016-8655
  - description: |
      This module exploits a race condition and use-after-free in the
                packet_set_ring function in net/packet/af_packet.c (AF_PACKET) in
                the Linux kernel to execute code as root (CVE-2016-8655).

                The bug was initially introduced in 2011 and patched in 2016 in version
                4.4.0-53.74, potentially affecting a large number of kernels; however
                this exploit targets only systems using Ubuntu (Trusty / Xenial) kernels
                4.4.0 < 4.4.0-53, including Linux distros based on Ubuntu, such as
                Linux Mint.

                The target system must have unprivileged user namespaces enabled,
                two or more CPU cores, and SMAP must be disabled.

                Bypasses for SMEP and KASLR are included. Failed exploitation
                may crash the kernel.

                This module has been tested successfully on

                Linux Mint 17.3 (x86_64);
                Linux Mint 18 (x86_64);
                Ubuntu 16.04 (x86_64); and
                Ubuntu 16.04.2 (x86_64).
    required_action:
    due_date:
    notes: |
      AKA:
        - chocobo_root.c
      Reliability:
        - repeatable-session
      Stability:
        - crash-os-down
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2016-08-12'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/af_packet_chocobo_root_priv_esc.rb
