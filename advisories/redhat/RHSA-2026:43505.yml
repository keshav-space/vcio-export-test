summary: "An update for mariadb-connector-c is now available for Red Hat Enterprise Linux 10.\n\
  \nRed Hat Product Security has rated this update as having a security impact of Important.\
  \ A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity\
  \ rating, is available for each vulnerability from the CVE link(s) in the References section.\n\
  \nThe MariaDB Native Client library (C driver) is used to connect applications developed in\
  \ C/C++ to MariaDB and MySQL databases. \n\nSecurity Fix(es):\n\n* mariadb: MariaDB server:\
  \ SQL injection vulnerability via improper handling of big5 character set with mysql_real_escape_string()\
  \ (CVE-2026-44172)\n\nFor more details about the security issue(s), including the impact,\
  \ a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed\
  \ in the References section."
