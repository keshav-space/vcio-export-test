summary: "An update for libsndfile is now available for Red Hat Enterprise Linux 8.6 Advanced\
  \ Mission Critical Update Support and Red Hat Enterprise Linux 8.6 Extended Update Support\
  \ Long-Life Add-On.\n\nRed Hat Product Security has rated this update as having a security\
  \ impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives\
  \ a detailed severity rating, is available for each vulnerability from the CVE link(s) in\
  \ the References section.\n\nlibsndfile is a C library for reading and writing files containing\
  \ sampled sound, such as AIFF, AU, or WAV. \n\nSecurity Fix(es):\n\n* libsndfile: integer\
  \ overflow in ima_reader_init() (CVE-2026-37555)\n\nFor more details about the security issue(s),\
  \ including the impact, a CVSS score, acknowledgments, and other related information, refer\
  \ to the CVE page(s) listed in the References section."
