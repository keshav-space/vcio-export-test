aliases:
  - CVE-2026-53202
  - CVE-2026-53264
  - CVE-2026-63887
  - CVE-2026-64300
summary: |
  An update for kernel is now available for Red Hat Enterprise Linux 10.

  Red Hat Product Security has rated this update as having a security impact of Important. A Common Vulnerability Scoring System (CVSS) base score, which gives a detailed severity rating, is available for each vulnerability from the CVE link(s) in the References section.

  The kernel packages contain the Linux kernel, the core of any Linux operating system.

  Security Fix(es):

  * kernel: accel/ivpu: Fix signed integer truncation in IPC receive (CVE-2026-53202)

  * kernel: net/sched: act_api: use RCU with deferred freeing for action lifecycle (CVE-2026-53264)

  * kernel: scsi: target: iscsi: Bound iscsi_encode_text_output() appends to rsp_buf (CVE-2026-63887)

  * kernel: perf/aux: Fix page UAF in map_range() (CVE-2026-64300)

  Bug Fix(es) and Enhancement(s):

  * netfilter: CVE backports for RHEL 10.2.z (JIRA:RHEL-185311)

  * tlbflush - Windows Driver Verifier catches FLTMGR/Ntfs crashes during KVM 42-VM soak test on AMD EPYC Turin [rhel-10.2.z] (JIRA:RHEL-214436)

  For more details about the security issue(s), including the impact, a CVSS score, acknowledgments, and other related information, refer to the CVE page(s) listed in the References section.
