summary: |
  Red Hat OpenShift Container Platform release 4.18.54 is now available with
  updates to packages and images that fix several bugs and add enhancements.

   This release includes a security update for Red Hat OpenShift Container
  Platform 4.18.

  Red Hat Product Security has rated this update as having a security impact
  of Important. A Common Vulnerability Scoring System (CVSS) base score,
  which gives a detailed severity rating, is available for each vulnerability
  from the CVE link(s) in the References section.

  Red Hat OpenShift Container Platform is Red Hat's cloud computing
  Kubernetes application platform solution designed for on-premise or private
  cloud deployments.

  This advisory contains the container images for Red Hat OpenShift Container
  Platform 4.18.54. See the following advisory for the RPM packages for this
  release:

  https://access.redhat.com/errata/RHSA-2026:57482

  Space precludes documenting all of the container images in this advisory.
  See the following Release Notes documentation, which will be updated
  shortly for this release, for details about these changes:

  https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html/release_notes/

  Security Fix(es):

  * samba: Missing access check on reparse point operations (CVE-2026-1933)
  * samba: group policy certificate enrollment uses http:// without
  validation (CVE-2026-3012)
  * samba: Remote Code Execution in SAMR (CVE-2026-4408)
  * sssd: sssd: sudo LDAP provider searches entire directory tree for
  sudoRole objects by default, enabling privilege escalation (CVE-2026-14474)
  * gnutls: GnuTLS: Denial of Service via DTLS zero-length fragment
  (CVE-2026-33845)
  * gnutls: GnuTLS: Denial of Service via heap buffer overflow in DTLS
  handshake fragment reassembly (CVE-2026-33846)
  * vim: arbitrary command execution via modeline sandbox bypass
  (CVE-2026-34982)
  * gnutls: gnutls: Denial of Service via DTLS packet reordering
  vulnerability (CVE-2026-42009)
  * gnutls: gnutls: Authentication Bypass via NUL Character in Username
  (CVE-2026-42010)
  * kernel: net: openvswitch: reject oversized nested action attrs
  (CVE-2026-64531)
  * samba: vfs_worm does not block directory modification (CVE-2026-2340)
  * gnutls: gnutls: Information disclosure via heap overread in RSA key
  exchange (CVE-2026-5260)
  * glibc: glibc: Heap Buffer Overflow in `scanf` with `%mc` format specifier
  and large width (CVE-2026-5450)
  * sssd: sssd: GPO cache path traversal via unsanitized gPCFileSysPath
  allows Kerberos authentication bypass (CVE-2026-14476)
  * vim: zip.vim: Vim zip.vim plugin: Arbitrary file overwrite via path
  traversal bypass (CVE-2026-35177)
  * vim: Vim: Command injection allows arbitrary code execution via malicious
  tag files (CVE-2026-41411)
  * gnutls: gnutls: Security bypass due to incorrect name constraint handling
  (CVE-2026-42011)
  * gnutls: gnutls: Certificate validation bypass due to oversized Subject
  Alternative Name (CVE-2026-42013)
  * vim: command injection when decompressing .tgz archives (CVE-2026-46483)
  * libsolv: Heap buffer overflow in libsolv repopagestore via unchecked
  decompression of malicious .solv page data (CVE-2026-48864)

  For more details about the security issue(s), including the impact, a CVSS
  score, acknowledgments, and other related information, refer to the CVE
  page(s) listed in the References section.

  All OpenShift Container Platform 4.18 users are advised to upgrade to these
  updated packages and images when they are available in the appropriate
  release channel. To check for available updates, use the OpenShift CLI (oc)
  or web console. Instructions for upgrading a cluster are available at
  https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html-single/updating_clusters/index#updating-cluster-cli.
