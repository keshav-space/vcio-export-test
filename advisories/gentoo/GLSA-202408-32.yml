exploits:
  - description: PHP, specifically Windows-based PHP used in CGI mode, contains an OS command
      injection vulnerability that allows for arbitrary code execution. This vulnerability is
      a patch bypass for CVE-2012-1823.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2024-07-03'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. Please check with specific vendors for information
      on patching status. For more information, please see:  https://www.php.net/ChangeLog-8.php#;   https://nvd.nist.gov/vuln/detail/CVE-2024-4577'
    known_ransomware_campaign_use: yes
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id:
  - description: |
      This module exploits a PHP CGI argument injection vulnerability affecting PHP in certain configurations
                on a Windows target. A vulnerable configuration is locale dependant (such as Chinese or Japanese), such that
                the Unicode best-fit conversion scheme will unexpectedly convert a soft hyphen (0xAD) into a dash (0x2D)
                character. Additionally a target web server must be configured to run PHP under CGI mode, or directly expose
                the PHP binary. This issue has been fixed in PHP 8.3.8 (for the 8.3.x branch), 8.2.20 (for the 8.2.x branch),
                and 8.1.29 (for the 8.1.x branch). PHP 8.0.x and below are end of life and have note received patches.

                XAMPP is vulnerable in a default configuration, and we can target the /php-cgi/php-cgi.exe endpoint. To target
                an explicit .php endpoint (e.g. /index.php), the server must be configured to run PHP scripts in CGI mode.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2024-06-06'
    exploit_type:
    platform: PHP,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/windows/http/php_cgi_arg_injection_rce_cve_2024_4577.rb
    record_id:
