exploits:
  - description: Apple iOS, iPadOS, macOS, tvOS, watchOS, and Safari WebKit contain a use-after-free
      vulnerability that leads to code execution when processing maliciously crafted web content.
      This vulnerability could impact HTML parsers that use WebKit, including but not limited
      to Apple Safari and non-Apple products which rely on WebKit for HTML processing.
    required_action: Apply updates per vendor instructions.
