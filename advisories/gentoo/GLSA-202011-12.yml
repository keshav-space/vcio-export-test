exploits:
  - description: Google Chromium V8 Engine contains a type confusion vulnerability that allows
      a remote attacker to potentially exploit heap corruption via a crafted HTML page. This
      vulnerability could affect multiple web browsers that utilize Chromium, including, but
      not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply updates per vendor instructions.
