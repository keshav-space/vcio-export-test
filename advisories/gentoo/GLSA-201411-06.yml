  - description: Adobe Flash Player - UncompressViaZlibVariant Uninitialized Memory (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2015-05-01'
    exploit_type: remote
    platform: windows
    source_date_updated: !!timestamp '2015-05-01'
    data_source: Exploit-DB
    source_url:
    record_id:
  - description: |
      This module exploits an uninitialized memory vulnerability in Adobe Flash Player. The
                vulnerability occurs in the ByteArray::UncompressViaZlibVariant method, which fails
                to initialize allocated memory. When using a correct memory layout this vulnerability
                leads to a ByteArray object corruption, which can be abused to access and corrupt memory.
                This module has been tested successfully on Windows 7 SP1 (32-bit), IE 8 and IE11 with
                Flash 15.0.0.189.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2014-11-11'
    exploit_type:
