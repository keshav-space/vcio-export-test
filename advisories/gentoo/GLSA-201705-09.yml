exploits:
  - description: Apache Tomcat 8/7/6 (Debian-Based Distros) - Local Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2016-10-03'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2016-10-03'
    data_source: Exploit-DB
    source_url: http://legalhackers.com/advisories/Tomcat-DebPkgs-Root-Privilege-Escalation-Exploit-CVE-2016-1240.html
    record_id:
  - description: |
      Tomcat (6, 7, 8) packages provided by default repositories on Debian-based
                distributions (including Debian, Ubuntu etc.) provide a vulnerable
                tomcat init script that allows local attackers who have already gained access
                to the tomcat account (for example, by exploiting an RCE vulnerability
                in a java web application hosted on Tomcat, uploading a webshell etc.) to
                escalate their privileges from tomcat user to root and fully compromise the
                target system.

                Tested against Tomcat 8.0.32-1ubuntu1.1 on Ubuntu 16.04
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - config-changes
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2016-09-30'
