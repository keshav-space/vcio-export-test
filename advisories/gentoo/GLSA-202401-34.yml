  - description: Google Chromium WebRTC, an open-source project providing web browsers with
      real-time communication, contains a heap buffer overflow vulnerability that allows a remote
      attacker to potentially exploit heap corruption via a crafted HTML page. This vulnerability
      could impact web browsers using WebRTC, including but not limited to Google Chrome.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2024-01-23'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. Please check with specific vendors for information
      on patching status. For more information, please see: https://chromereleases.googleblog.com/2023/12/stable-channel-update-for-desktop_20.html;  https://nvd.nist.gov/vuln/detail/CVE-2023-7024'
