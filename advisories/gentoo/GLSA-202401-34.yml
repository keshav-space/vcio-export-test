  - description: Google Chromium Skia contains an integer overflow vulnerability that allows
      a remote attacker, who has compromised the renderer process, to potentially perform a
      sandbox escape via a malicious file. This vulnerability affects Google Chrome and ChromeOS,
      Android, Flutter, and possibly other products.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2023-12-21'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. Please check with specific vendors for information
