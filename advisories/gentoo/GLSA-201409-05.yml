  - description: Adobe Flash Player - copyPixelsToByteArray Integer Overflow (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2015-04-21'
    exploit_type: remote
