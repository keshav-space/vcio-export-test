exploits:
  - description: Sudo chroot 1.9.17 - Local Privilege Escalation
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2025-07-08'
    exploit_type: local
    platform: linux
    source_date_updated: !!timestamp '2025-07-08'
    data_source: Exploit-DB
    source_url:
    record_id:
  - description: |
      Sudo before version 1.19.17p1 allows user to use `chroot` option, when
                executing command. The option is intended to run a command with
                user-selected root directory (if sudoers file allow it). Change in version
                1.9.14 allows resolving paths via `chroot` using user-specified root
                directory when sudoers is still evaluating.
                This allows the attacker to trick Sudo into loading arbitrary shared object,
                thus resulting in a privilege escalation.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2025-06-30'
    exploit_type:
    platform: Linux
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/local/sudo_chroot_cve_2025_32463.rb
    record_id:
  - description: Sudo contains an inclusion of functionality from untrusted control sphere vulnerability.
      This vulnerability could allow local attacker to leverage sudo’s -R (--chroot) option
      to run arbitrary commands as root, even if they are not listed in the sudoers file.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-10-20'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://www.sudo.ws/security/advisories/chroot_bug/ ; https://nvd.nist.gov/vuln/detail/CVE-2025-32463'
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
