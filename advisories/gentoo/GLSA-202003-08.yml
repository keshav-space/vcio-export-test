    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/browser/chrome_jscreate_sideeffect.rb
    record_id:
  - description: Google Chromium V8 Engine contains a type confusion vulnerability allows a
      remote attacker to potentially exploit heap corruption via a crafted HTML page. This vulnerability
      could affect multiple web browsers that utilize Chromium, including, but not limited to,
