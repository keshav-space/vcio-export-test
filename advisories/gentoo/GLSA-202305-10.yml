exploits:
  - description: Google Chromium V8 Engine contains a type confusion vulnerability that allows
      a remote attacker to potentially exploit heap corruption via a crafted HTML page. This
      vulnerability could affect multiple web browsers that utilize Chromium, including, but
      not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-11-18'
    notes: https://chromereleases.googleblog.com/2022/10/stable-channel-update-for-desktop_27.html;  https://nvd.nist.gov/vuln/detail/CVE-2022-3723
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id:
  - description: Google Chromium GPU contains a heap buffer overflow vulnerability that allows
      a remote attacker, who has compromised the renderer process, to potentially perform a
      sandbox escape via a crafted HTML page. This vulnerability could affect multiple web browsers
      that utilize Chromium, including, but not limited to, Google Chrome, Microsoft Edge, and
      Opera.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-12-19'
