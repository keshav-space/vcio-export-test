exploits:
  - description: Google Chromium V8 Engine contains an out-of-bounds memory access vulnerability
      that allows a remote attacker to potentially exploit heap corruption via a crafted HTML
      page. This vulnerability could affect multiple web browsers that utilize Chromium, including,
      but not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2024-02-07'
