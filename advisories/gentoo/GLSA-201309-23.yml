exploits:
  - description: Mozilla Firefox does not properly initialize data structures for the nsDOMSVGZoomEvent::mPreviousScale
      and nsDOMSVGZoomEvent::mNewScale functions, which allows remote attackers to obtain sensitive
      information from process memory via a crafted web site.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-03-24'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2013-1675
    known_ransomware_campaign_use: no
    source_date_published:
