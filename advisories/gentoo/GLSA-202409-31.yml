exploits:
  - description: Apache HTTP Server contains an improper escaping of output vulnerability in
      mod_rewrite that allows an attacker to map URLs to filesystem locations that are permitted
      to be served by the server but are not intentionally/directly reachable by any URL, resulting
      in code execution or source code disclosure.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-05-22'
    notes: 'This vulnerability affects a common open-source component, third-party library,
