exploits:
  - description: Apple iOS, iPadOS, macOS, and other Apple products contain an out-of-bounds
      write vulnerability in WebKit that may allow maliciously crafted web content to break
      out of Web Content sandbox. This vulnerability could impact HTML parsers that use WebKit,
      including but not limited to Apple Safari and non-Apple products which rely on WebKit
      for HTML processing.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-04-03'
    notes: https://support.apple.com/en-us/122281 ; https://support.apple.com/en-us/122283 ;
