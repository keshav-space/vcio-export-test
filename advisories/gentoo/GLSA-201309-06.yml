  - description: Adobe Flash Player - Regular Expression Heap Overflow (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2014-04-21'
    exploit_type: remote
    platform: windows
