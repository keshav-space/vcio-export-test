exploits:
  - description: Google Chromium Mojo contains an insufficient data validation vulnerability
      that allows a remote attacker, who has compromised the renderer process, to potentially
      perform a sandbox escape via a crafted HTML page. This vulnerability could affect multiple
      web browsers that utilize Chromium, including, but not limited to, Google Chrome, Microsoft
      Edge, and Opera.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-09-29'
    notes: https://chromereleases.googleblog.com/2022/09/stable-channel-update-for-desktop.html,
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-3075;  https://nvd.nist.gov/vuln/detail/CVE-2022-3075
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id:
  - description: Google Chromium Network Service contains a use-after-free vulnerability that
      allows a remote attacker to potentially exploit heap corruption via a crafted HTML page.
      This vulnerability could affect multiple web browsers that utilize Chromium, including,
      but not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply updates per vendor instructions.
