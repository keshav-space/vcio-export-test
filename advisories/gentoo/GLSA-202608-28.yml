exploits:
  - description: Google Chromium V8 contains an inappropriate implementation vulnerability that
      allows a remote attacker to potentially exploit heap corruption via a crafted HTML page.
      This vulnerability could affect multiple web browsers that utilize Chromium, including,
      but not limited to, Google Chrome, Microsoft Edge, and Opera.
    required_action: Apply mitigations per vendor instructions or discontinue use of the product
      if mitigations are unavailable.
    due_date: !!timestamp '2024-09-18'
    notes: https://chromereleases.googleblog.com/2024/08/stable-channel-update-for-desktop_21.html;
