exploits:
  - description: This module exploits a Python code injection vulnerability in the Content Server
      component of Calibre v6.9.0 - v7.15.0. Once enabled (disabled by default), it will listen
      in its default configuration on all network interfaces on TCP port 8080 for incoming traffic,
      and does not require any authentication. The injected payload will get executed in the
      same context under which Calibre is being executed.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
