exploits:
  - description: Google Chromium V8 Engine has a bug in JSON.stringify, where the internal TheHole
      value can leak to script code, causing memory corruption. This vulnerability could affect
      multiple web browsers that utilize Chromium, including, but not limited to, Google Chrome,
      Microsoft Edge, and Opera.
    required_action: Apply updates per vendor instructions.
