  - description: GNU InetUtils contains an argument injection vulnerability in telnetd that
      could allow for remote authentication bypass via a "-f root" value for the USER environment
      variable.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2026-02-16'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://cgit.git.savannah.gnu.org/cgit/inetutils.git ; https://codeberg.org/inetutils/inetutils/commit/ccba9f748aa8d50a38d7748e2e60362edd6a32cc;
      https://codeberg.org/inetutils/inetutils/commit/fd702c02497b2f398e739e3119bed0b23dd7aa7b
      ; https://nvd.nist.gov/vuln/detail/CVE-2026-24061'
    known_ransomware_campaign_use: no
