exploits:
  - description: Samba 3.3.12 (Linux x86) - 'chain_reply' Memory Corruption (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2010-09-04'
    exploit_type: remote
    platform: linux_x86
    source_date_updated: !!timestamp '2016-12-01'
    data_source: Exploit-DB
    source_url:
    record_id:
  - description: |
      This module triggers a vulnerability in the LSA RPC service of the Samba daemon
                because of an error on the PIDL auto-generated code. Making a specially crafted
                call to SetInformationPolicy to set a PolicyAuditEventsInformation allows to
                trigger a heap overflow and finally execute arbitrary code with root privileges.

                The module uses brute force to guess the stackpivot/rop chain or the system()
                address and redirect flow there in order to bypass NX. The start and stop addresses
                for brute forcing have been calculated empirically. On the other hand the module
                provides the StartBrute and StopBrute which allow the user to configure his own
                addresses.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-service-restarts
      Reliability:
        - unreliable-session
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2012-04-10'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/samba/setinfopolicy_heap.rb
    record_id:
  - description: |
      This exploits a memory corruption vulnerability present in Samba versions
                prior to 3.3.13. When handling chained response packets, Samba fails to validate
                the offset value used when building the next part. By setting this value to a
                number larger than the destination buffer size, an attacker can corrupt memory.
                Additionally, setting this value to a value smaller than 'smb_wct' (0x24) will
                cause the header of the input buffer chunk to be corrupted.

                After close inspection, it appears that 3.0.x versions of Samba are not
                exploitable. Since they use an "InputBuffer" size of 0x20441, an attacker cannot
                cause memory to be corrupted in an exploitable way. It is possible to corrupt the
                heap header of the "InputBuffer", but it didn't seem possible to get the chunk
                to be processed again prior to process exit.

                In order to gain code execution, this exploit attempts to overwrite a "talloc
                chunk" destructor function pointer.

                This particular module is capable of exploiting the flaw on x86 Linux systems
                that do not have the nx memory protection.

                NOTE: It is possible to make exploitation attempts indefinitely since Samba forks
                for user sessions in the default configuration.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-service-restarts
      SideEffects:
        - ioc-in-logs
      Reliability:
        - unreliable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2010-06-16'
