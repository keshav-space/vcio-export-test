    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/php_fpm_rce.rb
    record_id:
  - description: In some versions of PHP in certain configurations of FPM setup, it is possible
      to cause FPM module to write past allocated buffers allowing the possibility of remote
