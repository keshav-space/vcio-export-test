  - description: Google Chrome Blink contains a heap use-after-free vulnerability that allows
      an attacker to potentially perform out of bounds memory access via a crafted HTML page.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-06-13'
