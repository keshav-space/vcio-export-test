exploits:
  - description: Setup script used to generate configuration can be fooled using a crafted POST
      request to include arbitrary PHP code in generated configuration file.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-04-15'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2009-1151
    known_ransomware_campaign_use: no
    source_date_published:
