summary: Apache Airflow's `JWTRefreshMiddleware` set the JWT auth cookie without the `Secure`
  flag, so deployments running the Airflow API server behind an HTTPS-terminating reverse proxy
  (e.g. nginx / Envoy / a managed load balancer that terminates TLS and forwards plaintext to
  the API server, the default cloud-native topology) would have the user's session JWT replayed
  over any cleartext HTTP request to the same host. A network-positioned attacker (Wi-Fi MITM,
  hostile LAN, captive-portal proxy) could induce a logged-in user's browser to issue an HTTP
  request to the deployment's hostname and capture the JWT cookie out of that request, then
  replay it against the authenticated API. Affects deployments where the Airflow API server
  is reached through a TLS-terminating proxy and the cookie's secure-by-default protection is
  load-bearing for session integrity. Users are advised to upgrade to `apache-airflow` 3.2.2
  or later.
