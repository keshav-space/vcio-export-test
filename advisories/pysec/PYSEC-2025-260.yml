summary: A vulnerability, which was classified as critical, has been found in Open Asset Import
  Library Assimp 5.4.3. This issue affects the function CSMImporter::InternReadFile of the file
  code/AssetLib/CSM/CSMLoader.cpp. The manipulation leads to heap-based buffer overflow. The
  attack may be initiated remotely. The exploit has been disclosed to the public and may be
  used. The patch is named 2690e354da0c681db000cfd892a55226788f2743. It is recommended to apply
  a patch to fix this issue.
