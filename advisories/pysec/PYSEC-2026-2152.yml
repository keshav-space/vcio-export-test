summary: Flask-HTTPAuth provides Basic, Digest and Token HTTP authentication for Flask routes.
  Prior to version 4.8.1, in a situation where the client makes a request to a token protected
  resource without passing a token, or passing an empty token, Flask-HTTPAuth would invoke the
  application's token verification callback function with the token argument set to an empty
  string. If the application had any users in its database with an empty string set as their
  token, then it could potentially authenticate the client request against any of those users.
  This issue has been patched in version 4.8.1.
