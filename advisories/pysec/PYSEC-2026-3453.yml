summary: Pillow is a Python imaging library. Prior to 12.3.0, Pillow's ImageCms.ImageCmsTransform.apply(im,
  imOut) API can trigger controlled native heap corruption when the caller supplies an output
  image whose mode does not match the transform's declared output mode. This issue is fixed
  in version 12.3.0.
