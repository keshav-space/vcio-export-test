summary: Kedro is a toolbox for production-ready data science. Prior to 1.3.0, Kedro allows
  the logging configuration file path to be set via the KEDRO_LOGGING_CONFIG environment variable
  and loads it without validation. The logging configuration schema supports the special ()
  key, which enables arbitrary callable instantiation. An attacker can exploit this to execute
  arbitrary system commands during application startup. This is a critical remote code execution
  (RCE) vulnerability caused by unsafe use of logging.config.dictConfig() with user-controlled
  input. This vulnerability is fixed in 1.3.0.
