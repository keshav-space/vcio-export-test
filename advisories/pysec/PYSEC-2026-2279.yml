summary: Slippers is a UI component framework for Django. Prior to version 0.6.3, a Cross-Site
  Scripting (XSS) vulnerability exists in the {% attrs %} template tag of the slippers Django
  package. When a context variable containing untrusted data is passed to {% attrs %}, the value
  is interpolated into an HTML attribute string without escaping, allowing an attacker to break
  out of the attribute context and inject arbitrary HTML or JavaScript into the rendered page.
  This issue has been patched in version 0.6.3.
