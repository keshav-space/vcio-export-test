summary: Memray is a memory profiler for Python. Prior to Memray 1.19.2, Memray rendered the
  command line of the tracked process directly into generated HTML reports without escaping.
  Because there was no escaping, attacker-controlled command line arguments were inserted as
  raw HTML into the generated report. This allowed JavaScript execution when a victim opened
  the generated report in a browser. Version 1.19.2 fixes the issue.
