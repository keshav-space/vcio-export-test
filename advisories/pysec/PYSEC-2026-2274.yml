summary: Rembg is a tool to remove images background. Prior to 2.0.75, a path traversal vulnerability
  in the rembg HTTP server allows unauthenticated remote attackers to read arbitrary files from
  the server's filesystem. By sending a crafted request with a malicious model_path parameter,
  an attacker can force the server to attempt loading any file as an ONNX model, revealing file
  existence, permissions, and potentially file contents through error messages. This vulnerability
  is fixed in 2.0.75.
