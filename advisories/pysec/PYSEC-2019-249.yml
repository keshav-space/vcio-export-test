summary: An issue was discovered in Exiv2 0.27. There is infinite recursion at BigTiffImage::printIFD
  in the file bigtiffimage.cpp. This can be triggered by a crafted file. It allows an attacker
  to cause Denial of Service (Segmentation fault) or possibly have unspecified other impact.
