advisory_id: PYSEC-2026-3709
datasource_id: pysec/PYSEC-2026-3709
datasource_url: https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip
aliases:
  - BIT-airflow-2026-68076
  - CVE-2026-68076
summary: Apache Airflow's environment-variable secrets backend resolved a team-scoped Connection
  or Variable from the wrong team's scope. The guard meant to prevent this only ran when no
  team scope was supplied, and its pattern could not match a team name containing an underscore,
  which team names are allowed to contain. When the guard did not apply, the lookup fell through
  to an unconditional global read that resolved the stored `AIRFLOW_CONN__<TEAM>___<ID>` variable
  regardless of which team asked. In multi-team mode an authenticated user of one team could
  therefore have `POST /api/v2/connections/test` resolve another team's Connection and authenticate
  outward with that team's credentials; the endpoint uses the credentials rather than returning
  them. Exploitation requires `[core] multi_team` enabled, `[core] test_connection` set to `Enabled`
  (it ships `Disabled`), team-scoped secrets provisioned as environment variables in the API-server
  process, and knowledge of the encoded identifier. Redirecting the test at an attacker-controlled
  host is separately blocked. Users are advised to upgrade to apache-airflow 3.3.1 or later.
