summary: dynaconf is a configuration management tool for Python. Prior to version 3.2.13, Dynaconf
  is vulnerable to Server-Side Template Injection (SSTI) due to unsafe template evaluation in
  the @Jinja resolver. When the jinja2 package is installed, Dynaconf evaluates template expressions
  embedded in configuration values without a sandboxed environment. This issue has been patched
  in version 3.2.13.
