summary: The Claude SDK for Python provides access to the Claude API from Python applications.
  From version 0.86.0 to before version 0.87.0, the async local filesystem memory tool in the
  Anthropic Python SDK validated that model-supplied paths resolved inside the sandboxed memory
  directory, but then returned the unresolved path for subsequent file operations. A local attacker
  able to write to the memory directory could retarget a symlink between validation and use,
  causing reads or writes to escape the sandbox. The synchronous memory tool implementation
  was not affected. This issue has been patched in version 0.87.0.
