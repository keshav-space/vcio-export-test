summary: A critical security vulnerability in parisneo/lollms versions up to 2.2.0 allows any
  authenticated user to accept or reject friend requests belonging to other users. The `respond_request()`
  function in `backend/routers/friends.py` does not implement proper authorization checks, enabling
  Insecure Direct Object Reference (IDOR) attacks. Specifically, the `/api/friends/requests/{friendship_id}`
  endpoint fails to verify whether the authenticated user is part of the friendship or the intended
  recipient of the request. This vulnerability can lead to unauthorized access, privacy violations,
  and potential social engineering attacks. The issue has been addressed in version 2.2.0.
