summary: eml_parser serves as a python module for parsing eml files and returning various information
  found in the e-mail as well as computed information. Prior to version 2.0.1, the official
  example script examples/recursively_extract_attachments.py contains a path traversal vulnerability
  that allows arbitrary file write outside the intended output directory. Attachment filenames
  extracted from parsed emails are directly used to construct output file paths without any
  sanitization, allowing an attacker-controlled filename to escape the target directory. This
  issue has been patched in version 2.0.1.
