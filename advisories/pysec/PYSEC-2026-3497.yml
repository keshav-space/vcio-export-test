summary: "plone.app.textfield: Stored XSS by spoofing mime type\n### Impact\n\nA stored XSS\
  \ affecting RichText fields. RichTextValue.output returns the raw, unsanitized stored value\
  \ whenever the stored mimeType equals the outputMimeType. Because the safe-HTML output type\
  \ (`text/x-html-safe`) is the type that signifies \"already sanitized\", any value whose stored\
  \ mimeType equals it bypasses the safe_html transform entirely on render. The transform itself\
  \ is sound — it correctly strips `on*` event-handler attributes and `javascript:/data:` URIs;\
  \ the defect is that it is never invoked for these values. The unsanitized value is then emitted\
  \ via `tal:content=\"structure ...\"`, which performs no escaping, so the payload executes\
  \ in the viewer's browser. \n\nThis can be a problem when a RichText field is wrongly defined\
  \ in code with a `mimeType` and `outputMimeType` that are the same, or when the REST API is\
  \ used to the same effect.\n\n### Patches\nThe problem has been patched:\n\n* For Plone 6.0,\
  \ upgrade `plone.app.textfield` to 2.0.2.\n* For Plone 6.1, upgrade `plone.app.textfield`\
  \ to 3.0.2.\n* For Plone 6.2, upgrade `plone.app.textfield` to 4.0.1.\n\n### Workarounds\n\
  There is no known workaround."
