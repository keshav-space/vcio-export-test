summary: "Cross-site Scripting in Apache superset\nA stored cross-site scripting (XSS) vulnerability\
  \ exists in Apache Superset before 3.0.3. An authenticated attacker with create/update permissions\
  \ on charts or dashboards could store a script or add a specific HTML snippet that would act\
  \ as a stored XSS.\n\nFor 2.X versions, users should change their config to include:\n \n\
  TALISMAN_CONFIG = {\n    \"content_security_policy\": {\n        \"base-uri\" : [\"'self'\"\
  ],\n        \"default-src\": [\"'self'\"],\n        \"img-src\": [\"'self'\", \"blob:\", \"\
  data:\"],\n        \"worker-src\": [\"'self'\", \"blob:\"],\n        \"connect-src\": [\n\
              \"'self'\",\n            \" https://api.mapbox.com\" https://api.mapbox.com\"\
  \ ;,\n            \" https://events.mapbox.com\" https://events.mapbox.com\" ;,\n        ],\n\
          \"object-src\": \"'none'\",\n        \"style-src\": [\n             \"'self'\",\n\
              \"'unsafe-inline'\",\n        ],\n        \"script-src\": [\"'self'\", \"'strict-dynamic'\"\
  ],\n    },\n    \"content_security_policy_nonce_in\": [\"script-src\"],\n    \"force_https\"\
  : False,\n    \"session_cookie_secure\" : False,\n}"
