summary: 'An issue was discovered in py-lmdb 0.97. For certain values of mp_flags, mdb_page_touch
  does not properly set up mc->mc_pg[mc->top], leading to an invalid write operation. NOTE:
  this outcome occurs when accessing a data.mdb file supplied by an attacker.'
