summary: SciTokens is a reference library for generating and using SciTokens. Prior to version
  1.9.7, the Enforcer is vulnerable to a path traversal attack where an attacker can use dot-dot
  (..) in the scope claim of a token to escape the intended directory restriction. This occurs
  because the library normalizes both the authorized path (from the token) and the requested
  path (from the application) before comparing them using startswith. This issue has been patched
  in version 1.9.7.
