summary: JupyterHub is software that allows one to create a multi-user server for Jupyter notebooks.
  Prior to version 5.4.4, an open redirect vulnerability in JupyterHub allows attackers to construct
  links which, when clicked, take users to the JupyterHub login page, after which they are sent
  to an arbitrary attacker-controlled site outside JupyterHub instead of a JupyterHub page,
  bypassing JupyterHub's check to prevent this. This issue has been patched in version 5.4.4.
