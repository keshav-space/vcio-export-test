summary: Taguette is an open source qualitative research tool. An issue has been discovered
  in Taguette versions prior to 1.5.0. It was possible for an attacker to request password reset
  email containing a malicious link, allowing the attacker to set the email if clicked by the
  victim. This issue has been patched in version 1.5.0.
