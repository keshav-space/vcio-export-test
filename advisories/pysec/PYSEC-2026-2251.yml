summary: Pillow is a Python imaging library. From version 11.2.1 to before version 12.2.0, passing
  nested lists as coordinates to APIs that accept coordinates such as ImagePath.Path, ImageDraw.ImageDraw.polygon
  and ImageDraw.ImageDraw.line could cause a heap buffer overflow, as nested lists were recursively
  unpacked beyond the allocated buffer. Coordinate lists are now validated to contain exactly
  two numeric coordinates. This issue has been patched in version 12.2.0.
