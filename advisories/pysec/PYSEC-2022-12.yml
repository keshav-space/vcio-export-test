summary: IPython (Interactive Python) is a command shell for interactive computing in multiple
  programming languages, originally developed for the Python programming language. Affected
  versions are subject to an arbitrary code execution vulnerability achieved by not properly
  managing cross user temporary files. This vulnerability allows one user to run code as another
  on the same machine. All users are advised to upgrade.
