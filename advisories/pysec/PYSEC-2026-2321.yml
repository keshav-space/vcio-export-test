summary: wlc is a Weblate command-line client using Weblate's REST API. Prior to version 2.0.0,
  the HTML output format in wlc embeds API response data into HTML without escaping, allowing
  cross-site scripting when the output is rendered in a browser. This issue has been patched
  in version 2.0.0.
