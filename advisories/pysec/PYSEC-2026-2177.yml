summary: Glances is an open-source system cross-platform monitoring tool. Prior to version 4.5.4,
  the Cassandra export module (`glances/exports/glances_cassandra/__init__.py`) interpolates
  `keyspace`, `table`, and `replication_factor` configuration values directly into CQL statements
  without validation. A user with write access to `glances.conf` can redirect all monitoring
  data to an attacker-controlled Cassandra keyspace. Version 4.5.4 contains a fix.
