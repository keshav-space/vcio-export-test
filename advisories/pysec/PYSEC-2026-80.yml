summary: Langflow is a tool for building and deploying AI-powered agents and workflows. In versions
  1.0.0 through 1.8.1, the `/api/v1/files/images/{flow_id}/{file_name}` endpoint serves image
  files without any authentication or ownership check. Any unauthenticated request with a known
  flow_id and file_name returns the image with HTTP 200. In a multi-tenant deployment, any attacker
  who can discover or guess a `flow_id` (UUIDs can be leaked through other API responses) can
  download any user's uploaded images without credentials. Version 1.9.0 contains a patch.
