summary: Glances is an open-source system cross-platform monitoring tool. Prior to 4.5.1, The
  TimescaleDB export module constructs SQL queries using string concatenation with unsanitized
  system monitoring data. The normalize() method wraps string values in single quotes but does
  not escape embedded single quotes, making SQL injection trivial via attacker-controlled data
  such as process names, filesystem mount points, network interface names, or container names.
  This vulnerability is fixed in 4.5.1.
