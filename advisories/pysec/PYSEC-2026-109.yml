summary: 'pretalx is a conference planning tool. Prior to 2026.1.0, an unauthenticated attacker
  can send arbitrary HTML-rendered emails from a pretalx instance''s configured sender address
  by embedding malformed HTML or markdown link syntax in a user-controlled template placeholder
  such as the account display name. The most direct vector is the password-reset flow: the attacker
  registers an account with a malicious name, enters the victim''s email address, and triggers
  a password reset. The resulting email is delivered from the event''s legitimate sender address
  and passes SPF/DKIM/DMARC validation, making it a ready-made phishing vector. This vulnerability
  is fixed in 2026.1.0.'
