summary: 'Withdrawn as duplicate of PYSEC-2011-25.  Unspecified vulnerability in (1) Zope 2.12.x
  before 2.12.19 and 2.13.x before 2.13.8, as used in Plone 4.x and other products, and (2)
  PloneHotfix20110720 for Plone 3.x allows attackers to gain privileges via unspecified vectors,
  related to a "highly serious vulnerability." NOTE: this vulnerability exists because of an
  incorrect fix for CVE-2011-0720.'
