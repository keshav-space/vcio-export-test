summary: A vulnerability was found in Open Asset Import Library Assimp 5.4.3. It has been classified
  as problematic. Affected is the function MDCImporter::InternReadFile of the file assimp/code/AssetLib/MDC/MDCLoader.cpp
  of the component MDC File Parser. The manipulation of the argument pcVerts leads to out-of-bounds
  read. It is possible to launch the attack on the local host. The exploit has been disclosed
  to the public and may be used. The project decided to collect all Fuzzer bugs in a main-issue
  to address them in the future.
