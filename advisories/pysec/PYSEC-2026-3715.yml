summary: The Yandex Lockbox secrets backend in Apache Airflow's Yandex provider resolved a team-scoped
  Connection or Variable id through the team-agnostic lookup when the team-scoped lookup missed.
  In a deployment running multi-team mode with this backend, a caller in one team could resolve
  a secret belonging to another team by supplying an id that spells out that team's namespace,
  obtaining its credentials in full. No unusual configuration is required beyond enabling multi-team
  mode and using this backend. Users are advised to upgrade to apache-airflow-providers-yandex
  4.5.1 or later, which refuses the team-agnostic fall-through for an id that could name a team
  namespace.
