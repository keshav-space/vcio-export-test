summary: nltk versions before 3.10.2 contain a symlink-based arbitrary file read vulnerability
  in IPIPANCorpusReader methods that bypass nltk.pathsec validation entirely. Attackers can
  place a symlink in the corpus root directory and read arbitrary files accessible to the process
  by calling channels(), domains(), categories(), or fileids() methods with the symlink filename.
