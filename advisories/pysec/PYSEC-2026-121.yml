summary: pyLoad is a free and open-source download manager written in Python. From version 0.5.0b3.dev13
  to 0.5.0b3.dev96, the edit_package() function implements insufficient sanitization for the
  pack_folder parameter. The current protection relies on a single-pass string replacement of
  "../", which can be bypassed using crafted recursive traversal sequences. This issue has been
  patched in version 0.5.0b3.dev97.
