summary: openssl_encrypt versions before 1.4.0 contain a sandbox escape vulnerability in the
  DangerousPatternVisitor AST analyzer that fails to detect dunder attribute traversal techniques.
  Attackers can use __class__, __bases__, __subclasses__(), and __globals__ chains to access
  restricted functions and execute arbitrary system commands from plugin code.
