summary: lxml_html_clean is a project for HTML cleaning functionalities copied from `lxml.html.clean`.
  Prior to version 0.4.4, the _has_sneaky_javascript() method strips backslashes before checking
  for dangerous CSS keywords. This causes CSS Unicode escape sequences to bypass the @import
  and expression() filters, allowing external CSS loading or XSS in older browsers. This issue
  has been patched in version 0.4.4.
