summary: wasmtime is a runtime for WebAssembly. The 19.0.0 release of Wasmtime contains a regression
  introduced during its development which can lead to a guest WebAssembly module causing a panic
  in the host runtime. A valid WebAssembly module, when executed at runtime, may cause this
  panic. This vulnerability has been patched in version 19.0.1.
