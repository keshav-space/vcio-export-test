summary: The (1) contrib.sessions.backends.base.SessionBase.flush and (2) cache_db.SessionStore.flush
  functions in Django 1.7.x before 1.7.10, 1.4.x before 1.4.22, and possibly other versions
  create empty sessions in certain circumstances, which allows remote attackers to cause a denial
  of service (session store consumption) via unspecified vectors.
