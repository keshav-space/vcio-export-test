summary: DuckDB is a SQL database management system. DuckDB implemented block-based encryption
  of DB on the filesystem starting with DuckDB 1.4.0. There are a few issues related to this
  implementation. The DuckDB can fall back to an insecure random number generator (pcg32) to
  generate cryptographic keys or IVs. When clearing keys from memory, the compiler may remove
  the memset() and leave sensitive data on the heap. By modifying the database header, an attacker
  could downgrade the encryption mode from GCM to CTR to bypass integrity checks. There may
  be a failure to check return value on call to OpenSSL `rand_bytes()`. An attacker could use
  public IVs to compromise the internal state of RNG and determine the randomly generated key
  used to encrypt temporary files, get access to cryptographic keys if they have access to process
  memory (e.g. through memory leak),circumvent GCM integrity checks, and/or influence the OpenSSL
  random number generator and DuckDB would not be able to detect a failure of the generator.
  Version 1.4.2 has disabled the insecure random number generator by no longer using the fallback
  to write to or create databases. Instead, DuckDB will now attempt to install and load the
  OpenSSL implementation in the `httpfs` extension. DuckDB now uses secure MbedTLS primitive
  to clear memory as recommended and requires explicit specification of ciphers without integrity
  checks like CTR on `ATTACH`. Additionally, DuckDB now checks the return code.
