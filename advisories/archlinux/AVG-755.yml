  - description: VLC Media Player - MKV Use-After-Free (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2018-10-16'
    exploit_type: local
    platform: windows
