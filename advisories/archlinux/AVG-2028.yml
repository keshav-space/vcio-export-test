  - description: Red Hat Polkit contains an incorrect authorization vulnerability through the
      bypassing of credential checks for D-Bus requests, allowing for privilege escalation.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2023-06-02'
    notes: https://bugzilla.redhat.com/show_bug.cgi?id=1961710; https://nvd.nist.gov/vuln/detail/CVE-2021-3560
    known_ransomware_campaign_use: no
    source_date_published:
