exploits:
  - description: |
      This module exploits an unauthenticated file upload and command
                injection vulnerability in GitLab Community Edition (CE) and
                Enterprise Edition (EE). The patched versions are 13.10.3, 13.9.6,
                and 13.8.8.

                Exploitation will result in command execution as the git user.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-04-14'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/gitlab_exif_rce.rb
    record_id:
  - description: GitHub Community and Enterprise Editions that utilize the ability to upload
      images through GitLab Workhorse are vulnerable to remote code execution. Workhorse passes
      image file extensions through ExifTool, which improperly validates the image files.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2021-11-17'
