  - description: |
      Versions of Apache Log4j2 impacted by CVE-2021-44228 which allow JNDI features used in configuration,
              log messages, and parameters, do not protect against attacker controlled LDAP and other JNDI related endpoints.

              This module will exploit an HTTP end point with the Log4Shell vulnerability by injecting a format message that
              will trigger an LDAP connection to Metasploit and load a payload.

              The Automatic target delivers a Java payload using remote class loading. This requires Metasploit to run an HTTP
              server in addition to the LDAP server that the target can connect to. The targeted application must have the
              trusted code base option enabled for this technique to work.

              The non-Automatic targets deliver a payload via a serialized Java object. This does not require Metasploit to
              run an HTTP server and instead leverages the LDAP server to deliver the serialized object. The target
              application in this case must be compatible with the user-specified JAVA_GADGET_CHAIN option.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
      RelatedModules:
        - auxiliary/scanner/http/log4shell_scanner
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2021-12-09'
    exploit_type:
    platform: Java,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/log4shell_header_injection.rb
    record_id: /modules/exploits/multi/http/log4shell_header_injection.rb
  - description: |
      The Ubiquiti UniFi Network Application versions 5.13.29 through 6.5.53 are affected by the Log4Shell
              vulnerability whereby a JNDI string can be sent to the server via the 'remember' field of a POST request to the
              /api/login endpoint that will cause the server to connect to the attacker and deserialize a malicious Java
              object. This results in OS command execution in the context of the server application.

              This module will start an LDAP server that the target will need to connect to.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      AKA:
        - Log4Shell
        - LogJam
      Reliability:
        - repeatable-session
