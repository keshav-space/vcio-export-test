summary: "CedarJava has type confusion vulnerability\n### Summary\n\nCedarJava is an open source\
  \ Java implementation of the Cedar policy language, used for fine-grained authorization decisions.\
  \ Under certain circumstances, improper input handling could allow type confusion across the\
  \ Java-Rust FFI boundary.\n\n### Impact\n\n**Record-to-Entity type confusion across the Java-Rust\
  \ FFI boundary**\n\nCedarJava sends authorization requests to the Rust cedar-policy evaluator\
  \ as JSON. The JSON protocol reserves magic single-key object shapes (`__entity` and `__extn`)\
  \ for entity references and extension values. When serializing a `CedarMap`, there is no validation\
  \ preventing these reserved keys from being used. If an integrating service builds a `CedarMap`\
  \ from caller-supplied key/value data (such as request headers, user-defined metadata, or\
  \ resource tags), an actor who controls those keys could cause the Rust evaluator to interpret\
  \ a record as an entity reference.\n\nThis issue requires the integrating service to build\
  \ a `CedarMap` where the an actor controls the keys, and a policy must reference that value\
  \ in a when/unless clause.\n\n### Impacted versions: \n< 4.9\n\n### Patches\nAddressed in\
  \ CedarJava version 2.3.6, 3.4.1, and 4.9 and above. We recommend upgrading to the latest\
  \ version and ensuring any forked or derivative code is patched to incorporate the new fixes.\n\
  \n### Workarounds\nEnable schema-based request validation to catch type mismatches. Validate\
  \ that user-controlled data does not contain reserved keys (`__entity` or `__extn`) before\
  \ building `CedarMap` objects.\n\n### References\nIf you have any questions or comments about\
  \ this advisory, we ask that you contact us directly via email to [cedar-policy-security@lists.cncf.io](mailto:cedar-policy-security@lists.cncf.io).\
  \ Please do not create a public GitHub issue."
