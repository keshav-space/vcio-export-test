aliases:
  - CVE-2024-38809
summary: "Spring Framework DoS via conditional HTTP request\n### Description\nApplications that\
  \ parse ETags from `If-Match` or `If-None-Match` request headers are vulnerable to DoS attack.\n\
  \n### Affected Spring Products and Versions\norg.springframework:spring-web in versions \n\
  \n6.1.0 through 6.1.11\n6.0.0 through 6.0.22\n5.3.0 through 5.3.37\n\nOlder, unsupported versions\
  \ are also affected\n\n### Mitigation\nUsers of affected versions should upgrade to the corresponding\
  \ fixed version.\n6.1.x -> 6.1.12\n6.0.x -> 6.0.23\n5.3.x -> 5.3.38\nNo other mitigation steps\
  \ are necessary.\n\nUsers of older, unsupported versions could enforce a size limit on `If-Match`\
  \ and `If-None-Match` headers, e.g. through a Filter."
