summary: "Giskard has a Regular Expression Denial of Service (ReDoS) in RegexMatching Check\n\
  ## Summary\nThe RegexMatching check in the `giskard-checks` package passes a user-supplied\
  \ regular expression pattern directly to Python's re.search() without any timeout, complexity\
  \ guard, or pattern validation. An attacker who can control the regex pattern or the text\
  \ being matched can craft inputs that trigger catastrophic backtracking in the regex engine,\
  \ causing the process to hang indefinitely and denying service to all other operations. \n\
  \n`giskard-checks` is a local developer testing library. Check definitions, including the\
  \ pattern parameter, are provided in application code or configuration files and executed\
  \ locally. Exploitation requires write access to a check definition and subsequent execution\
  \ of the test suite. The absence of a regex timeout could cause availability issues in automated\
  \ environments such as CI/CD pipelines.\n\n## Affected component\n \n`text_matching.py`, line\
  \ 457: `re.search(pattern, text)`\n \n## Remediation\n \nUpgrade to `giskard-checks` >= 1.0.2b1.\n\
  \ \n## Credit\n \nGiskard-AI thanks @dhabaleshwar for identifying the missing timeout on regex\
  \ evaluation."
