summary: "Rancher API Server Cross-site Scripting Vulnerability\n### Impact\nA vulnerability\
  \ has been identified in which unauthenticated cross-site scripting (XSS) in the API Server's\
  \ public API endpoint can be exploited. This can lead to an attacker exploiting the vulnerability\
  \ to trigger JavaScript code and execute commands remotely. \n\nThe attack vector was identified\
  \ as a Reflected XSS.\n\nAPI Server propagates malicious payloads from user input to the UI,\
  \ which renders the output. For example, a malicious URL gets rendered into a script that\
  \ is executed on a page.\n\nThe changes addressed by this fix are:\n- Encode input that comes\
  \ from the request URL before adding it to the response.\n- The request input is escaped by\
  \ changing the URL construction that is used for links to use `url.URL`.\n- The request input\
  \ is escaped by escaping the JavaScript and CSS variables with attribute encoding as defined\
  \ by [OWASP](https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html#output-encoding-rules-summary).\n\
  \n### Patches\nPatched versions include the following commits:\n\n| Branch    | Commit |\n\
  | -------- | ------- |\n| master  | 4fd7d82 |\n| release/v2.8 | 69b3c2b |\n| release/v2.8.s3\
  \ | a3b9e37 |\n| release/v2.7 | 4e102cf |\n| release/v2.7.s3 | 97a10a3 |\n| release/v2.6 |\
  \ 4df268e |\n\n### Workarounds\nThere is no direct mitigation besides updating API Server\
  \ to a patched version.\n\n### References\nIf you have any questions or comments about this\
  \ advisory:\n\n- Reach out to the [SUSE Rancher Security team](https://github.com/rancher/rancher/security/policy)\
  \ for security-related inquiries.\n- Open an issue in the [Rancher](https://github.com/rancher/rancher/issues/new/choose)\
  \ repository.\n- Verify with our [support matrix](https://www.suse.com/suse-rancher/support-matrix/all-supported-versions/)\
  \ and [product support lifecycle](https://www.suse.com/lifecycle/)."
