  \                   | >= 9.0.0, <= 9.0.14 | 9.0.15\n\n### <a name=\".NET 10\"></a>.NET 10\n\
  Package name | Affected version | Patched version\n------------ | ---------------- | -------------------------\n\
  [Microsoft.NetCore.App.Runtime.linux-arm](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-arm)\
  \               | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.linux-arm64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-arm64)\
  \           | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.linux-musl-arm](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-musl-arm)\
  \     | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.linux-musl-arm64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-musl-arm64)\
  \ | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.linux-musl-x64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-musl-x64)\
  \     | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.linux-x64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.linux-x64)\
  \               | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.osx-arm64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.osx-arm64)\
  \               | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.osx-x64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.osx-x64)\
  \                   | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.win-arm](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.win-arm)\
  \                   | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.win-arm64)\
  \               | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.win-x64)\
  \                   | >= 10.0.0, <= 10.0.5 | 10.0.6\n[Microsoft.NetCore.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.NetCore.App.Runtime.win-x86)\
  \                   | >= 10.0.0, <= 10.0.5 | 10.0.6\n\n## Advisory FAQ\n\n### <a name=\"how-affected\"\
  ></a>How do I know if I am affected?\n\nIf using a package listed in [affected packages](#affected-packages),\
  \ you're exposed to the vulnerability.\n\n### <a name=\"how-fix\"></a>How do I fix the issue?\n\
  \n1. To fix the issue please install the latest version of .NET 8.0, NET 9.0, or .NET 10.0,\
  \ as appropriate. If you have installed one or more .NET SDKs through Visual Studio, Visual\
  \ Studio will prompt you to update Visual Studio, which will also update your .NET  SDKs.\n\
  2. If your application references the vulnerable package, update the package reference to\
  \ the patched version. You can list the versions you have installed by running the `dotnet\
  \ --info` command.\n\nOnce you have installed the updated runtime or SDK, restart your apps\
  \ for the update to take effect.\n\nAdditionally, if you've deployed [self-contained applications](https://docs.microsoft.com/dotnet/core/deploying/#self-contained-deployments-scd)\
  \ targeting any of the impacted versions, these applications are also vulnerable and must\
  \ be recompiled and redeployed.\n\n## Other Information\n\n### Reporting Security Issues\n\
  \nIf you have found a potential security issue in a supported version of .NET, please report\
  \ it to the Microsoft Security Response Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new).\
  \ Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).\n\
  \nSecurity reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of\
  \ the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.\n\
  \n### Support\n\nYou can ask questions about this issue on GitHub in the .NET GitHub organization.\
  \ The main repos are located at https://github.com/dotnet/runtime. The Announcements repo\
  \ (https://github.com/dotnet/Announcements) will contain this bulletin as an issue and will\
  \ include a link to a discussion issue. You can ask questions in the linked discussion issue.\n\
  \n### Disclaimer\n\nThe information provided in this advisory is provided \"as is\" without\
  \ warranty of any kind. Microsoft disclaims all warranties, either express or implied, including\
  \ the warranties of merchantability and fitness for a particular purpose. In no event shall\
  \ Microsoft Corporation or its suppliers be liable for any damages whatsoever including direct,\
  \ indirect, incidental, consequential, loss of business profits or special damages, even if\
  \ Microsoft Corporation or its suppliers have been advised of the possibility of such damages.\
  \ Some states do not allow the exclusion or limitation of liability for consequential or incidental\
  \ damages so the foregoing limitation may not apply.\n\n### External Links\n\n[CVE-2026-32178](\
  \ https://www.cve.org/CVERecord?id=CVE-2026-32178)\n\n### Acknowledgements\n\nLudvig Pedersen\n\
  \n### Revisions\n\nV1.0 (April 14, 2026): Advisory published."
