summary: "Eclipse Jetty: Cross-Request Leakage for trailers on HTTP/1.1 keep-alive connections\n\
  ### Description\n\n> FINDING — MEDIUM (HTTP/1.1 keep-alive connections with trailers)\n> HttpConnection._trailers\
  \ Cross-Request Leakage (Never Reset Between Requests)\n> \n> Location:\n>   jetty-core/jetty-server/src/main/java/org/eclipse/jetty/server/internal/\n\
  >   HttpConnection.java:107, 1157-1161, 1170\n> \n> Detail:\n>   _trailers (line 107) is a\
  \ connection-scoped HttpFields.Mutable field.\n>   parsedTrailer() (line 1157) populates it\
  \ when request N carries HTTP trailers.\n>   messageComplete() (line 1170) checks \"if (_trailers\
  \ != null)\" — evaluates true\n>   from request N's data — and stamps it onto request N+1.\n\
  > \n>   Grep confirms: ZERO occurrences of \"_trailers = null\" in entire HttpConnection.java.\n\
  > \n>   Scenario:\n>     Request N:   POST /upload (trailers: X-Checksum: abc123)\n>     Request\
  \ N+1: GET  /data   (no trailers)\n>     app: request.getTrailers() on N+1 → returns {X-Checksum:\
  \ abc123} ← STALE\n> \n>   Application logic branching on getTrailers() != null produces incorrect\
  \ behavior.\n>   Not cross-connection (same keep-alive connection only).\n> \n>   More dangerous\
  \ scenario: TOCTOU — trailer passes check, target swapped before use.\n\n### Workarounds\n\
  Do not rely on HTTP request trailers for security-sensitive logic, or disable persistent connections\
  \ by closing the connection after each HTTP/1.1 request."
