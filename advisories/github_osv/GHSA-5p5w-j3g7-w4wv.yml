summary: "Authentication bypass via incorrect XML canonicalization and DOM traversal in saml2-js\n\
  Versions of `saml2-js` prior to 1.12.4 or 2.0.2 are vulnerable to authentication bypass.\n\
  \nThe `saml2-js` library may incorrectly utilize the results of XML DOM traversal and canonicalization\
  \ APIs in such a way that an attacker may be able to manipulate the SAML data without invalidating\
  \ the cryptographic signature, allowing the attack to potentially bypass authentication to\
  \ SAML service providers.\n\nSecurity Assertion Markup Language (SAML) is an XML-based markup\
  \ language for security assertions regarding authentication and permissions, most commonly\
  \ used for single sign-on (SSO) services.\n\nSome XML DOM traversal and canonicalization APIs\
  \ may be inconsistent in handling of comments within XML nodes. Incorrect use of these APIs\
  \ by some SAML libraries results in incorrect parsing of the inner text of XML nodes such\
  \ that any inner text after the comment is lost prior to cryptographically signing the SAML\
  \ message. Text after the comment therefore has no impact on the signature on the SAML message.\n\
  \nA remote attacker can modify SAML content for a SAML service provider without invalidating\
  \ the cryptographic signature, which may allow attackers to bypass primary authentication\
  \ for the affected SAML service provider\n\n\n## Recommendation\n\nIf you use 1.x upgrade\
  \ to version 1.12.4 or greater \nIf you use 2.x upgrade to version 2.02 or greater"
