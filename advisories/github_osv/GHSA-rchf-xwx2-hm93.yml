  \ PoC\n\n```bash\n# Save the above files, then:\nchmod +x run_poc.sh\n./run_poc.sh\n```\n\n\
  ---\n\n## Impact\n\n### Who Is Affected?\n\n- **All Fedify applications** that use `lookupObject()`,\
  \ `getDocumentLoader()`, or the built-in document loader to fetch content from external URLs\n\
  - **Any federated server** that fetches actor profiles, posts, or other ActivityPub objects\
  \ from potentially untrusted sources\n- **Servers following standard federation patterns**\
  \ - fetching remote actors is a normal operation\n\n### Severity Assessment\n\n| Factor |\
  \ Assessment |\n|--------|------------|\n| **Attack Vector** | Network (remote) |\n| **Attack\
  \ Complexity** | Low (trivial payload) |\n| **Privileges Required** | None |\n| **User Interaction**\
  \ | None |\n| **Impact** | Availability (DoS) |\n| **Scope** | Service-wide |\n\n### Real-World\
  \ Scenario\n\n1. A Mastodon-compatible server powered by Fedify receives a follow request\
  \ or mention from `@attacker@evil.com`\n2. The server attempts to fetch the attacker's profile\
  \ via `lookupObject()`\n3. The attacker's server responds with malicious HTML\n4. The victim\
  \ server's event loop is blocked for 14+ seconds\n5. During this time, all other requests\
  \ are queued and potentially time out\n6. Repeated attacks can cause sustained service unavailability\n\
  \n---\n\n## Recommended Fix\n\n### Option 1: Use a Proper HTML Parser (Recommended)\n\nReplace\
  \ regex-based HTML parsing with a DOM parser that doesn't suffer from backtracking issues:\n\
  \n```typescript\n// Using linkedom (lightweight DOM implementation)\nimport { parseHTML }\
  \ from 'linkedom';\n\n// Replace lines 258-287 with:\nconst { document } = parseHTML(html);\n\
  const links = document.querySelectorAll('a[rel=\"alternate\"], link[rel=\"alternate\"]');\n\
  \nfor (const link of links) {\n  const type = link.getAttribute('type');\n  const href = link.getAttribute('href');\n\
  \  \n  if (\n    href &&\n    (type === 'application/activity+json' ||\n     type === 'application/ld+json'\
  \ ||\n     type?.startsWith('application/ld+json;'))\n  ) {\n    const altUri = new URL(href,\
  \ docUrl);\n    if (altUri.href !== docUrl.href) {\n      return await fetch(altUri.href);\n\
  \    }\n  }\n}\n```\n\n### Option 2: Add Response Size Limits\n\nIf regex must be used, at\
  \ minimum add size limits:\n\n```typescript\nconst MAX_HTML_SIZE = 1024 * 1024; // 1MB\nconst\
  \ contentLength = parseInt(response.headers.get('content-length') || '0');\n\nif (contentLength\
  \ > MAX_HTML_SIZE) {\n  throw new FetchError(url, 'Response too large');\n}\n\nconst html\
  \ = await response.text();\nif (html.length > MAX_HTML_SIZE) {\n  throw new FetchError(url,\
  \ 'Response too large');\n}\n```\n\n### Option 3: Refactor the Regex\n\nIf the regex approach\
  \ is preferred, use atomic grouping or possessive quantifiers (where supported), or restructure\
  \ to avoid nested quantifiers:\n\n```typescript\n// Use a non-backtracking approach with explicit\
  \ attribute matching\nconst tagPattern = /<(a|link)\\s+([^>]+)>/ig;\nconst attrPattern = /([a-z][a-z:_-]*)=(?:\"\
  ([^\"]*)\"|'([^']*)'|(\\S+))/ig;\n```\n\n---\n\n## Resources\n\n- [OWASP: Regular Expression\
  \ Denial of Service (ReDoS)](https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS)\n\
  - [CWE-1333: Inefficient Regular Expression Complexity](https://cwe.mitre.org/data/definitions/1333.html)\n\
  - [Cloudflare Outage Analysis (ReDoS Example)](https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/)\n\
  \n---\n\nThank you for taking the time to review this report. I'm happy to provide any additional\
