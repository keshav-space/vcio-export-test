  \ Testing malicious HTML payloads (ReDoS attack)...');\n  printSeparator();\n  \n  const testCases\
  \ = [\n    { reps: 18, expected: '~13ms' },\n    { reps: 20, expected: '~52ms' },\n    { reps:\
  \ 22, expected: '~228ms' },\n    { reps: 24, expected: '~857ms' },\n    { reps: 26, expected:\
  \ '~3.4s' },\n    { reps: 28, expected: '~14s' }\n  ];\n  \n  console.log('');\n  console.log('┌─────────────┬──────────────┬──────────────┬────────────────┐');\n\
  \  console.log('│ Repetitions │ Payload Size │ Expected     │ Actual         │');\n  console.log('├─────────────┼──────────────┼──────────────┼────────────────┤');\n\
  \  \n  let vulnerabilityConfirmed = false;\n  \n  for (const testCase of testCases) {\n  \
  \  const maliciousHtml = generateMaliciousHtml(testCase.reps);\n    const result = runTest(maliciousHtml,\
  \ `${testCase.reps} repetitions`);\n    \n    const actualTime = result.durationMs >= 1000\
  \ \n      ? `${(result.durationMs / 1000).toFixed(2)}s` \n      : `${result.durationMs.toFixed(0)}ms`;\n\
  \    \n    const status = result.durationMs > 100 ? '⚠️ ' : '✓ ';\n    \n    console.log(`│\
  \ ${String(testCase.reps).padEnd(11)} │ ${String(result.payloadLength + ' bytes').padEnd(12)}\
  \ │ ${testCase.expected.padEnd(12)} │ ${status}${actualTime.padEnd(12)} │`);\n    \n    if\
  \ (result.durationMs > 500) {\n      vulnerabilityConfirmed = true;\n    }\n  }\n  \n  console.log('└─────────────┴──────────────┴──────────────┴────────────────┘');\n\
