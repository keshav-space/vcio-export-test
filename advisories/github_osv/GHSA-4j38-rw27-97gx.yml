summary: "org.xwiki.contrib:discussions-server has Cross-Site Request Forgery (CSRF) issue that\
  \ makes it possible to delete messages\n### Impact\nIt's possible to forge a request to delete\
  \ a message. \n\n### Patches\nThe problem has been patched in version 2.0-rc-1 of Discussion\
  \ Extension.\n\n### Workarounds\nThere's no easy workaround except upgrading.\n\n### References\n\
  https://jira.xwiki.org/browse/DISCUSSION-22\n\n### For more information\nIf you have any questions\
  \ or comments about this advisory:\n* Open an issue in [Jira XWiki](https://jira.xwiki.org)\n\
  * Email us at [security mailing-list](mailto:security@xwiki.org)"
