exploits:
  - description: |
      This module exploits a deserialization vulnerability in the OpenWire transport unmarshaller in Apache
                ActiveMQ. Affected versions include 5.18.0 through to 5.18.2, 5.17.0 through to 5.17.5, 5.16.0 through to
                5.16.6, and all versions before 5.15.16.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2023-10-27'
    exploit_type:
    platform: Linux,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/misc/apache_activemq_rce_cve_2023_46604.rb
    record_id:
