summary: "CedarJava has policy injection vulnerability\n### Summary\n\nCedarJava is an open\
  \ source Java implementation of the Cedar policy language, used for fine-grained authorization\
  \ decisions. Under certain circumstances, improper input handling could allow policy injection.\n\
  \n### Impact\n\n**Cedar-expression injection via unescaped `toCedarExpr()`**\n\nThe `toCedarExpr()`\
  \ method on Cedar Value types does not escape special characters (`\"` or `\\`) when converting\
  \ values to Cedar source code. If an integrator uses `toCedarExpr()` to build policy text\
  \ at runtime from user-controlled values, an actor could inject arbitrary Cedar expressions.\
  \ For example, injecting `|| true` into a `permit ... when { ... }` clause could make the\
  \ permit unconditional, or injecting `&& false` into a `forbid` clause could prevent the `forbid`\
  \ from triggering.\n\nThis issue requires the integrator to use `toCedarExpr()` to build policy\
  \ text at runtime from user-controlled input.\n\n### Impacted versions: \n< 4.9\n\n### Patches\n\
  Addressed in CedarJava version 2.3.6, 3.4.1, and 4.9 and above. We recommend upgrading to\
  \ the latest version and ensuring any forked or derivative code is patched to incorporate\
  \ the new fixes.\n\n### Workarounds\nValidate and sanitize all user-supplied input before\
  \ passing it to `toCedarExpr()`. Avoid building policy text at runtime from user-controlled\
  \ values.\n\n### References\nIf you have any questions or comments about this advisory, we\
  \ ask that you contact us directly via email to [cedar-policy-security@lists.cncf.io](mailto:cedar-policy-security@lists.cncf.io).\
  \ Please do not create a public GitHub issue."
