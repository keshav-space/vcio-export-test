summary: "fetch(url) leads to a memory leak in undici\n### Impact\n\nCalling `fetch(url)` and\
  \ not consuming the incoming body ((or consuming it very slowing) will lead to a memory leak.\
  \ \n\n### Patches\n\nPatched in v6.6.1\n\n### Workarounds\n\nMake sure to always consume the\
  \ incoming body."
