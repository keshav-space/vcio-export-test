aliases:
  - CVE-2025-24353
summary: "Directus allows privilege escalation using Share feature\n### Summary\nWhen sharing\
  \ an item, user can specify an arbitrary role. It allows user to use a higher-privileged role\
  \ to see fields that otherwise the user should not be able to see.\n\n### Details\nSpecifying\
  \ `role` on share should be available only for admins. The current flow has a security flaw.\n\
  \nEach other role should allow to share only in the context of the same role. As there is\
  \ no role hierarchy in Directus, it is impossible to tell which role is _higher_ or _lower_,\
  \ so only admins should be able to specify the role for share.\n\nOptionally, instead of specifying\
  \ a role, shareer* should be able to specify which fields (limited to fields shareer sees)\
  \ are available on shared item. Similarily to import.\n\n*_shareer_ - a person that creates\
  \ a share link to item\n\n### PoC\n1. Create a collection with a secret field. \n2. Create\
  \ role A that sees the secret field\n3. Create role B that does not see the secret field,\
  \ but can use share feature.\n4. Create item with secret field filled. \n5. Use account with\
  \ role B to share the object as role A and gain unauthorized access to secret value.\n\nHere's\
  \ video example: https://www.youtube.com/watch?v=DbV4IxbWzN4\nI had to upload it to YouTube,\
  \ because GitHub allows only 10MB videos.\n\n### Impact\nImpacted are instances that use the\
  \ share feature and have specific roles hierarchy and fields that are not visible for certain\
  \ roles."
