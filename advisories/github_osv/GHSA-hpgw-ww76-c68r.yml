  - CVE-2026-46362
summary: "phpMyFAQ has an Authorization Bypass in All Admin Pages Due to Non-Terminating Permission\
  \ Check\n## Summary\n\n`AbstractAdministrationController::userHasPermission()` catches the\
  \ `ForbiddenException` thrown when a user lacks a specific permission, sends a \"forbidden\"\
  \ HTML page via `$response->send()`, but does not terminate execution. The calling controller\
  \ method continues to execute, fetches protected data, renders the full template, and returns\
  \ it as a Response. The final `$response->send()` in `admin/index.php` outputs the protected\
  \ page content after the forbidden page, leaking all permission-protected admin data to any\
  \ authenticated admin user regardless of their actual permissions.\n\n## Details\n\nThe parent\
  \ class `AbstractController::userHasPermission()` (`phpmyfaq/src/phpMyFAQ/Controller/AbstractController.php:317-327`)\
  \ correctly enforces authorization by throwing a `ForbiddenException` when the user lacks\
  \ the required permission. This exception would normally propagate to Symfony's HttpKernel\
  \ exception handler, which would return an error response and prevent the controller from\
  \ continuing.\n\nHowever, `AbstractAdministrationController` overrides this method at line\
  \ 390-399:\n\n```php\n#[\\Override]\nprotected function userHasPermission(PermissionType $permissionType):\
  \ void\n{\n    try {\n        parent::userHasPermission($permissionType);\n    } catch (ForbiddenException\
  \ $exception) {\n        $response = $this->getForbiddenPage($exception->getMessage());\n\
  \        $response->send();  // Outputs HTML but does NOT terminate execution\n    } catch\
  \ (Exception $exception) {\n        $this->configuration->getLogger()->error($exception->getMessage());\n\
  \        // Only logs, no response, no termination\n    }\n}\n```\n\nThe critical flaw: after\
  \ `$response->send()` at line 396, there is no `exit()`, `die()`, `return`, or re-throw. PHP\
  \ execution continues normally into the calling controller method.\n\nFor example, in `AdminLogController::index()`\
  \ (`phpmyfaq/src/phpMyFAQ/Controller/Administration/AdminLogController.php:45-83`):\n\n```php\n\
  public function index(Request $request): Response\n{\n    $this->userHasPermission(PermissionType::STATISTICS_ADMINLOG);\n\
  \    // ^^^ If user lacks permission: forbidden page is echoed, but execution continues\n\n\
  \    // ... all of this still executes:\n    $loggingData = $this->adminLog->getAll();  //\
  \ Fetches ALL admin log entries\n    // ...\n    return $this->render('@admin/statistics/admin-log.twig',\
  \ [\n        // ... full admin log data including IPs, usernames, actions\n        'loggingData'\
  \ => $currentItems,\n    ]);\n}\n```\n\nThe entry point `admin/index.php` then calls `$response->send()`\
  \ on the returned Response, appending the full protected page to the already-sent forbidden\
  \ page in the HTTP response body.\n\nThe second `catch` block (line 397-398) for generic `Exception`\
  \ is even worse — it only logs the error without sending any response or terminating, so the\
  \ protected page renders with no forbidden notice at all.\n\n**58 admin controllers** extend\
  \ `AbstractAdministrationController` and call `userHasPermission()`, meaning every permission-protected\
  \ admin page is affected. This includes:\n- Admin logs (user IPs, actions, usernames)\n- User\
  \ management (user data, permissions)\n- System information (server configuration, PHP info)\n\
  - Configuration pages (all application settings)\n- Backup pages\n- All other admin functionality\n\
  \n## PoC\n\n1. Create a test admin user with minimal permissions (e.g., only FAQ editing,\
  \ no statistics access):\n\n2. Authenticate as the limited admin user and request a permission-protected\
  \ page:\n\n```bash\n# Get admin session cookies by logging in\ncurl -c cookies.txt -d 'faqusername=limited_admin&faqpassword=password&pmf-csrf-token=TOKEN'\
  \ \\\n  'https://TARGET/admin/?action=login'\n\n# Access admin log page (requires STATISTICS_ADMINLOG\
  \ permission)\ncurl -b cookies.txt -s 'https://TARGET/admin/statistics/admin-log' | tee response.html\n\
  \n# The response contains BOTH the forbidden page HTML AND the full admin log:\ngrep -c 'You\
  \ are not allowed' response.html    # 1 — forbidden page was sent\ngrep -c 'loggingData\\\
  |ad_adminlog_ip' response.html  # matches — admin log data also present\n\n# Access system\
  \ information (requires CONFIGURATION_EDIT permission)  \ncurl -b cookies.txt -s 'https://TARGET/admin/system-information'\
  \ | tee sysinfo.html\n# Contains PHP version, extensions, database info, server configuration\n\
  ```\n\n3. The HTTP response body contains the forbidden page HTML followed by the full protected\
  \ page HTML, including all sensitive data.\n\n## Impact\n\nAny authenticated admin user —\
  \ even one with zero administrative permissions beyond basic login — can access **every**\
  \ permission-protected admin page by simply requesting its URL. The permission check sends\
  \ a forbidden page but does not stop execution, so the protected content is always appended\
  \ to the response.\n\nExposed data includes:\n- **Admin logs**: All admin users' IP addresses,\
  \ actions, and timestamps\n- **User management**: User accounts, email addresses, permissions\n\
  - **System information**: PHP configuration, database details, server paths\n- **Configuration**:\
  \ All application settings including security-sensitive values\n- **Backups**: Database export\
  \ functionality\n\nThis effectively renders the entire admin permission system non-functional\
  \ for the 58 page controllers using `AbstractAdministrationController`.\n\n## Recommended\
  \ Fix\n\nAdd `return` after sending the forbidden response, and re-throw for the generic Exception\
  \ case:\n\n```php\n#[\\Override]\nprotected function userHasPermission(PermissionType $permissionType):\
  \ void\n{\n    try {\n        parent::userHasPermission($permissionType);\n    } catch (ForbiddenException\
  \ $exception) {\n        $response = $this->getForbiddenPage($exception->getMessage());\n\
  \        $response->send();\n        exit;  // Terminate execution to prevent controller from\
  \ continuing\n    } catch (Exception $exception) {\n        $this->configuration->getLogger()->error($exception->getMessage());\n\
  \        throw $exception;  // Re-throw to prevent controller from continuing\n    }\n}\n\
  ```\n\nA cleaner architectural fix would be to not swallow the exception at all, and instead\
  \ let it propagate to the Symfony HttpKernel exception handler (which already handles `ForbiddenException`\
  \ via `WebExceptionListener`):\n\n```php\n#[\\Override]\nprotected function userHasPermission(PermissionType\
  \ $permissionType): void\n{\n    // Simply delegate to parent — let ForbiddenException propagate\n\
  \    // to the WebExceptionListener which renders the appropriate error page\n    parent::userHasPermission($permissionType);\n\
  }\n```\n\nOr remove the override entirely, since the `WebExceptionListener` registered in\
  \ the Kernel already handles exception-to-response conversion."
