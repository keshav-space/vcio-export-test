aliases:
  - CVE-2021-21395
summary: |
  magento-lts Reset Password not protected against well-timed CSRF
  ### Impact

  Password reset form is vulnerable to CSRF between time reset password link is clicked and user submits new password.

  ### Patches

  PR forthcoming

  ### Workarounds

  None
