exploits:
  - description: |
      This module exploits a Twig template injection vulnerability in Craft CMS by abusing the --templatesPath argument.
                The vulnerability allows arbitrary template loading via FTP, leading to Remote Code Execution (RCE).
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2024-12-19'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/http/craftcms_ftp_template.rb
    record_id:
