aliases:
  - CVE-2026-54266
summary: "@angular/common: Weak 32-Bit Cache Key Hashing in `HttpTransferCache` Leading to Cross-Request\
  \ Data Leakage and State Poisoning\nAngular's `HttpTransferCache` caches HTTP requests made\
  \ during Server-Side Rendering (SSR) so that they can be reused during client-side hydration.\
  \ This avoids repeating the same HTTP requests on the client. The cached responses are stored\
  \ in `TransferState` using a cache key generated by hashing request properties (method, response\
  \ type, mapped URL, serialized body, and sorted query parameters).\n\nThe cache keys are generated\
  \ using a weak 32-bit DJB2-like polynomial rolling hash. The 32-bit hash space is extremely\
  \ small, allowing attackers to find hash collisions.\n\nAn attacker can easily find a query\
  \ parameter string (e.g., `q=aaCAZMMM` for a search request) that produces the exact same\
  \ 32-bit hash as a sensitive endpoint (e.g., `/api/user/profile`). When a victim visits a\
  \ crafted link containing the colliding parameter, the SSR process executes both the search\
  \ request and the profile request. Due to the hash collision, the search response overwrites\
  \ the profile response in the `TransferState` cache.\n\n### Impact\n\nWhen the application\
  \ attempts to retrieve the cached response for the sensitive endpoint (such as the user's\
  \ profile), it receives the attacker-controlled response instead. This results in:\n\n* **State\
  \ Poisoning**: The application runs with attacker-forged data, which can lead to bypassing\
  \ client-side security controls or DOM-based Cross-Site Scripting (XSS) if the data is rendered\
  \ unsafely.  \n* **Information Leakage**: If the sensitive response is mistakenly associated\
  \ with the attacker's search results and rendered on the page, the victim's sensitive data\
  \ may be disclosed to the attacker.\n\n### Patched Versions\n* 22.0.1  \n* 21.2.17  \n* 20.3.25\n\
  \n### Framework-Level Fix\n\nThe logic has been updated to use a cryptographically secure\
  \ **SHA-256** hash algorithm for generating `TransferState` cache keys in `HttpTransferCache`.\
  \ The cache keys are now 256-bit hexadecimal strings.\n\n### Workarounds\n\nIf you cannot\
  \ upgrade immediately, configure your `HttpClient` requests to skip transfer caching for sensitive\
  \ endpoints:\n\n```ts\nthis.http.get('/api/user/profile', {\n  transferCache: false\n});\n\
  ```\n\nAlternatively, disable the HTTP transfer cache globally in your application bootstrap\
  \ config:\n\n```ts\n\nimport { provideClientHydration, withNoHttpTransferCache } from '@angular/platform-browser';\n\
  \nexport const appConfig = {\n  providers: [\n    provideClientHydration(\n      withNoHttpTransferCache()\n\
  \    )\n  ]\n};\n\n```\n\n### Credits\nThis vulnerability was discovered and reported by [CodeMender\
  \ from Google DeepMind](https://deepmind.google/blog/introducing-codemender-an-ai-agent-for-code-security/)."
