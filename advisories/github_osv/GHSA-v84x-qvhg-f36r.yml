aliases:
  - CVE-2026-49273
summary: "MantisBT: Remote Code Execution via eval() Class Hoisting in adm_config_set.php\n\
  MantisBT 2.28.3 and earlier contains a remote code execution vulnerability in the admin \"\
  Manage Configuration\" feature (adm_config_set.php). When setting a configuration value with\
  \ a non-string type (integer, float, complex), the value is passed through ConfigParser ->\
  \ Tokenizer, which calls *eval()* with a `return;` prefix intended to prevent code execution.\n\
  \nHowever, PHP hoists function and class declarations at compile time, even past a *return*\
  \ statement. An attacker can define a class in the eval()'d code that hijacks a class loaded\
  \ later via PHP's autoloader, achieving arbitrary code execution.\n\nThis vulnerability requires\
  \ administrator access to the web UI (adm_config_set.php). The REST API's ConfigsSetCommand\
  \ does NOT use Tokenizer/eval() and is not affected.\n\n### Impact\n- Remote code execution\
  \ as the web server user (www-data) from an authenticated administrator session\n\n### Patches\n\
  - https://github.com/mantisbt/mantisbt/commit/78c0af63d1fe0118004744cab21ca3bf2cea0f5c\n\n\
  ### Workarounds\nNone. \n\n### Resources\n- https://mantisbt.org/bugs/view.php?id=37122\n\n\
  ### Credits\nMcCaulay Hudson (@_McCaulay) of watchTowr"
