summary: "DOM Clobbering Gadget found in astro's client-side router that leads to XSS\n### Summary\n\
  \nA DOM Clobbering gadget has been discoverd in Astro's client-side router. It can lead to\
  \ cross-site scripting (XSS) in websites enables Astro's client-side routing and has *stored*\
  \ attacker-controlled scriptless HTML elements (i.e., `iframe` tags with unsanitized `name`\
  \ attributes) on the destination pages.\n\n### Details\n\n#### Backgrounds\n\nDOM Clobbering\
  \ is a type of code-reuse attack where the attacker first embeds a piece of non-script, seemingly\
  \ benign HTML markups in the webpage (e.g. through a post or comment) and leverages the gadgets\
  \ (pieces of js code) living in the existing javascript code to transform it into executable\
  \ code. More for information about DOM Clobbering, here are some references:\n\n[1] https://scnps.co/papers/sp23_domclob.pdf\n\
  [2] https://research.securitum.com/xss-in-amp4email-dom-clobbering/\n\n\n#### Gadgets found\
  \ in Astro\n\nWe identified a DOM Clobbering gadget in Astro's client-side routing module,\
  \ specifically in the `<ViewTransitions />` component. When integrated, this component introduces\
  \ the following vulnerable code, which is executed during page transitions (e.g., clicking\
  \ an `<a>` link):\n\nhttps://github.com/withastro/astro/blob/7814a6cad15f06931f963580176d9b38aa7819f2/packages/astro/src/transitions/router.ts#L135-L156\n\
  \nHowever, this implementation is vulnerable to a DOM Clobbering attack. The `document.scripts`\
  \ lookup can be shadowed by an attacker injected non-script HTML elements (e.g., `<img name=\"\
  scripts\"><img name=\"scripts\">`) via the browser's named DOM access mechanism. This manipulation\
  \ allows an attacker to replace the intended script elements with an array of attacker-controlled\
  \ scriptless HTML elements. \n\nThe condition `script.dataset.astroExec === ''` on line 138\
  \ can be bypassed because the attacker-controlled element does not have a data-astroExec attribute.\
  \ Similarly, the check on line 134 can be bypassed as the element does not require a `type`\
  \ attribute.\n\nFinally, the `innerHTML` of an attacker-injected non-script HTML elements,\
  \ which is plain text content before, will be set to the `.innerHTML` of an script element\
  \ that leads to XSS.\n\n\n### PoC\n\nConsider a web application using Astro as the framework\
  \ with client-side routing enabled and allowing users to embed certain scriptless HTML elements\
  \ (e.g., `form` or `iframe`). This can be done through a bunch of website's feature that allows\
  \ users to embed certain script-less HTML (e.g., markdown renderers, web email clients, forums)\
  \ or via an HTML injection vulnerability in third-party JavaScript loaded on the page.\n\n\
  For PoC website, please refer to: `https://stackblitz.com/edit/github-4xgj2d`. Clicking the\
  \ \"about\" button in the menu will trigger an `alert(1)` from an attacker-injected `form`\
  \ element.\n\n```\n---\nimport Header from \"../components/Header.astro\";\nimport Footer\
  \ from \"../components/Footer.astro\";\nimport { ViewTransitions } from \"astro:transitions\"\
  ;\nimport \"../styles/global.css\";\nconst { pageTitle } = Astro.props;\n---\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <link rel=\"icon\" type=\"image/svg+xml\"\
  \ href=\"/favicon.svg\" />\n    <meta name=\"viewport\" content=\"width=device-width\" />\n\
  \    <meta name=\"generator\" content={Astro.generator} />\n    <title>{pageTitle}</title>\n\
  \    <ViewTransitions />\n  </head>\n  <body>\n    <!--USER INPUT-->\n    <iframe name=\"\
  scripts\">alert(1)</iframe>\n    <iframe name=\"scripts\">alert(1)</iframe>\n    <!--USER\
  \ INPUT-->\n    \n    <Header />\n    <h1>{pageTitle}</h1>\n    <slot />\n    <Footer />\n\
  \    <script>\n      import \"../scripts/menu.js\";\n    </script>\n  </body>\n</html>\n```\n\
  \n### Impact\n\nThis vulnerability can result in cross-site scripting (XSS) attacks on websites\
  \ that built with Astro that enable the client-side routing with `ViewTransitions` and store\
  \ the user-inserted scriptless HTML tags without properly sanitizing the `name` attributes\
  \ on the page.\n\n### Patch\n\nWe recommend replacing `document.scripts` with `document.getElementsByTagName('script')`\
  \ for referring to script elements. This will mitigate the possibility of DOM Clobbering attacks\
  \ leveraging the `name` attribute.\n\n### Reference\n\nSimilar issues for reference:\n+ Webpack\
  \ ([CVE-2024-43788](https://github.com/webpack/webpack/security/advisories/GHSA-4vvj-4cpr-p986))\n\
  + Vite ([CVE-2024-45812](https://github.com/vitejs/vite/security/advisories/GHSA-64vr-g452-qvp3))\n\
  + layui ([CVE-2024-47075](https://github.com/layui/layui/security/advisories/GHSA-j827-6rgf-9629))"
