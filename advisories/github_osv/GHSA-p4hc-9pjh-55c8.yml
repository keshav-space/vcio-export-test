summary: "ssrfcheck: SSRF Bypass Caused by Failure to Classify Reserved IP Address Space as\
  \ Invalid\n# SSRF Bypass in `ssrfcheck` - fails to classify reserved IP address space as invalid\n\
  \n`ssrfcheck` is an npm package that serves to provide protection from SSRF by validating\
  \ URLs or hostname inputs.\n\nResources: \n * Project's GitHub code repository: https://github.com/felippe-regazio/ssrfcheck\n\
  \ * Project's npm package: https://www.npmjs.com/package/ssrfcheck\n \n## Vulnerability\n\n\
  The `ssrfcheck` package maintains a denylist of IP addresses and ranges to check against when\
  \ validating if an IP address is to be considered as safe or not.\n\nHowever, the IP address\
  \ list used for the denylist is incomplete and misses a reserved IP address space as defined\
  \ by the IANA (Internet Assigned Numbers Authority):\n\n- 224.0.0.0/4 - Multicast\n\nPractically,\
  \ this reserved IP address space is used for multicast traffic and would most commonly be\
  \ used for reserved local communication over network protocols such as UDP, which would make\
  \ it less likely to be used in a typical SSRF attack in practice.\n\nHowever, such reserved\
  \ IP address space shouldn't be allowed and it would be responsible of the SSRF protection\
  \ package to align and conform to an agreed-upon standard of special-purposed addresses that\
  \ should not be considered a valid public IP address. For reference, the popular npm packages\
  \ `private-ip` and `ipaddr.js` that are highly dependent-upon to make decisions about SSRF\
  \ protection and both consider the above mentioned IP address space as reserved and is not\
  \ considered a valid public IP address.\n\n## Exploit Proof of Concept\n\n1. Install the `ssrfcheck`\
  \ package:\n\n```bash\nnpm install ssrfcheck\n```\n\n2. Define an `app.js` file with the programmatic\
  \ API of `ssrfcheck`:\n\n```javascript\nimport { isSSRFSafeURL } from 'ssrfcheck';\n\nlet\
  \ result\nresult = isSSRFSafeURL('https://012.1.2.3/whatever');\nconsole.log(result);  //\
  \ returns false\nresult = isSSRFSafeURL('https://localhost:8080/whatever');\nconsole.log(result);\
  \  // returns false\n\nresult = isSSRFSafeURL('https://239.255.255.250:8080/whatever');\n\
  console.log(result);  // returns true - bypassed\n```\n\n## Vulnerable versions\n\nAll versions\
  \ of ssrfcheck are vulnerable to this issue, up to and including to the latest version of\
  \ `1.1.1`.\n\n## Assigned CVE\n\n[CVE-2025-8267](https://nvd.nist.gov/vuln/detail/CVE-2025-8267)\n\
  \n# Author\n\nLiran Tal"
