summary: "Graylog token revocation endpoint allows authenticated users to delete other users’\
  \ access tokens\n### Impact\n\nGraylog contains an insecure direct object reference (IDOR)\
  \ vulnerability in the token revocation endpoint. An authenticated user can delete access\
  \ tokens belonging to other users, including service account tokens and administrator tokens,\
  \ if they know or can guess a valid token identifier.\n\nThe issue does not expose token contents,\
  \ but it allows unauthorized token deletion, leading to integrity impact and potential availability\
  \ impact for access token based integrations.\n\n### Patches\n\nThe issue has been fixed in\
  \ the following Graylog versions: `6.3.12`, `7.0.7`, `7.1.2`. Users should upgrade to one\
  \ of these versions or above to remediate the vulnerability.\n\nGraylog Cloud has already\
  \ been patched.\n\n### Workarounds\n\nThere are no feasible workarounds for this issue. Upgrading\
  \ to a patched version is recommended.\n\nCustomers using Graylog Enterprise or Security can\
  \ review the audit log[^1] for suspicious activity. Audit log lines for successful token deletions\
  \ begin with `access token deleted from user`. \n\n### Credits\n\nThanks to [michaelddickenson](https://github.com/michaelddickenson)\
  \ and [sreelim](https://github.com/sreelim) for reporting.\n\n\n[^1]: https://go2docs.graylog.org/current/interacting_with_your_log_data/audit_log.html"
