summary: "Insecure random number generation in keypair\n## Description and Impact\n\nA bug in\
  \ the pseudo-random number generator used by [keypair](https://github.com/juliangruber/keypair)\
  \ versions up to and including 1.0.3 could allow for weak RSA key generation. This could enable\
  \ an attacker to decrypt confidential messages or gain authorized access to an account belonging\
  \ to the victim. We recommend replacing any RSA keys that were generated using keypair version\
  \ 1.0.3 or earlier.\n\n## Fix\n\n* The [bug](https://github.com/juliangruber/keypair/blob/87c62f255baa12c1ec4f98a91600f82af80be6db/index.js#L1008)\
  \ in the pseudo-random number generator is fixed in commit [`9596418`](https://github.com/juliangruber/keypair/commit/9596418d3363d3e757676c0b6a8f2d35a9d1cb18).\n\
  * If the crypto module is available, it is used instead of the pseudo-random number generator.\
  \ Also fixed in [`9596418`](https://github.com/juliangruber/keypair/commit/9596418d3363d3e757676c0b6a8f2d35a9d1cb18)\n\
  \n## Additional Details\n\nThe specific [line](https://github.com/juliangruber/keypair/blob/87c62f255baa12c1ec4f98a91600f82af80be6db/index.js#L1008)\
  \ with the flaw is:\n\n```javascript\nb.putByte(String.fromCharCode(next & 0xFF))\n```\n\n\
  The [definition](https://github.com/juliangruber/keypair/blob/87c62f255baa12c1ec4f98a91600f82af80be6db/index.js#L350-L352)\
  \ of `putByte` is \n\n```javascript\nutil.ByteBuffer.prototype.putByte = function(b) {\n \
  \ this.data += String.fromCharCode(b);\n};\n```\n\nSimplified, this is `String.fromCharCode(String.fromCharCode(next\
  \ & 0xFF))`. This results in most of the buffer containing zeros. An example generated buffer:\n\
  \n(Note: truncated for brevity)\n\n```\n\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\n\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\n\\x00\\x00\\x00\\x00\\x04\\x00\\x00\\x00....\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\n\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\n\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\\
  x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\n```\n\nSince it is masking with 0xFF, approximately\
  \ 97% of the bytes are converted to zeros. The impact is that each byte in the RNG seed has\
  \ a 97% chance of being 0 due to incorrect conversion.\n\n## Credit\n\nThis issue was reported\
  \ to GitHub Security Lab by Ross Wheeler of Axosoft. It was discovered by Axosoft engineer\
  \ Dan Suceava, who noticed that [keypair](https://github.com/juliangruber/keypair) was regularly\
  \ generating duplicate RSA keys. GitHub security engineer [@vcsjones (Kevin Jones)](https://github.com/vcsjones)\
  \ independently investigated the problem and identified the cause and source code location\
  \ of the bug."
