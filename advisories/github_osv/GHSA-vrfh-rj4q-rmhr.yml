summary: "Read-Only Open WebUI Users Can Modify Collaborative Documents via Socket.IO\n# Read-Only\
  \ Users Can Modify Collaborative Documents via Socket.IO\n\n## Affected Component\n\nSocket.IO\
  \ collaborative document editing handler:\n- `backend/open_webui/socket/main.py` (lines 667-721,\
  \ `ydoc:document:update` handler)\n\n## Affected Versions\n\nCurrent main branch and likely\
  \ all versions with collaborative note editing.\n\n## Description\n\nThe `ydoc:document:update`\
  \ Socket.IO event handler checks whether the sender is a member of the document's Socket.IO\
  \ room (line 678) but does not verify that the sender has **write** permission. Users with\
  \ read-only access join the document room via `ydoc:document:join`, which only requires `read`\
  \ permission (line 520). Once in the room, the user can emit `ydoc:document:update` events\
  \ that modify the in-memory Yjs document state and are broadcast to all other collaborators\
  \ in real time.\n\nThe `document_save_handler` (line 600) correctly checks `write` permission\
  \ before persisting to the database, so the attacker cannot directly save changes. However,\
  \ the tampered content is visible to all collaborators, and if any user with write access\
  \ saves the document, the injected content is persisted.\n\n```python\n# ydoc:document:update\
  \ handler (line 667) — only checks room membership, not write permission\nasync def on_document_update(sid,\
  \ data):\n    document_id = normalize_document_id(data.get('document_id', ''))\n    # ...\n\
  \    room = f'doc_{document_id}'\n    if room not in sio.rooms(sid):  # Room membership check\
  \ only\n        return\n    # Applies update to Yjs state and broadcasts to all users\n  \
  \  YDOC_MANAGER.apply_update(document_id, update)\n    await sio.emit('ydoc:document:update',\
  \ {...}, room=room, skip_sid=sid)\n```\n\nCompare with `ydoc:document:join` (line 520) which\
  \ checks permission:\n\n```python\n# Only checks READ permission — so read-only users join\
  \ the room\nif not has_access(user_id, type, id, 'read', db=db):\n    return\n```\n\n## CVSS\
  \ 3.1 Breakdown\n\n| Metric | Value | Rationale |\n|--------|-------|-----------|\n| Attack\
  \ Vector | Network (N) | Exploited remotely via Socket.IO events |\n| Attack Complexity |\
  \ Low (L) | No special conditions; attacker emits a standard Socket.IO event |\n| Privileges\
  \ Required | Low (L) | Requires a valid user account with read access to the shared note |\n\
  | User Interaction | None (N) | Modifications appear in real time without victim action; however,\
  \ persistence requires a write-access user to save |\n| Scope | Unchanged (U) | Impact is\
  \ within the collaborative document context |\n| Confidentiality | None (N) | No data disclosure\
  \ beyond what read access already provides |\n| Integrity | Low (L) | In-memory document state\
  \ is modified and broadcast; persistence is indirect (requires another user to save) |\n|\
  \ Availability | Low (L) | Collaborative editing session can be disrupted with invalid content\
  \ |\n\n## Attack Scenario\n\n1. User A creates a note and shares it with User B with **read**\
  \ permission.\n2. User B opens the note, which triggers `ydoc:document:join` — the server\
  \ checks read permission and adds User B to the document room.\n3. User B emits `ydoc:document:update`\
  \ with a crafted Yjs update payload via the Socket.IO connection (bypassing any frontend read-only\
  \ enforcement).\n4. The server applies the update to the Yjs document state and broadcasts\
  \ it to all collaborators.\n5. User A sees the injected content appear in their editor in\
  \ real time.\n6. If User A saves the document (intentionally or via autosave), the tampered\
  \ content is persisted to the database — User A's save passes the write permission check since\
  \ User A is the owner.\n\n## Impact\n\n- Read-only users can inject, modify, or delete content\
  \ in collaborative documents\n- Modifications are broadcast in real time to all collaborators,\
  \ causing confusion or disruption\n- If a write-access user saves (including autosave), the\
  \ tampered content is permanently persisted\n- Undermines the read/write permission model\
  \ for collaborative editing\n\n## Preconditions\n\n- Attacker must have a valid user account\
  \ with read access to a shared note\n- The note must be open for collaborative editing (at\
  \ least one other user viewing it, or the attacker can wait for a write-access user to open\
  \ and save)\n\n## Consolidation\n\nThis advisory covers read-only users modifying collaborative\
  \ notes over Socket.IO. Two handlers were affected, both fixed in v0.9.0:\n\n- `ydoc:document:update`\
  \ — checked only room membership, not write permission, so a read-only collaborator could\
  \ inject in-memory document updates broadcast to other collaborators (persistence indirect).\
  \ @Classic298.\n- `document_save_handler` — checked `permission='read'` while persisting via\
  \ `Notes.update_note_by_id`, so a read-only collaborator could persist note changes directly.\
  \ Reported by @hacnho \n\nOne CVE for the consolidated advisory."
