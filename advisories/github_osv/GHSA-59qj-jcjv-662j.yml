summary: |
  DIRAC's TokenManager does not check permissions on cached tokens
  ### Impact

  Any user could get a token that has been requested by another user/agent

  ### Patches
  The vulnerability is fixed in version 8.0.37.

  ### Workarounds

  None

  ### References
