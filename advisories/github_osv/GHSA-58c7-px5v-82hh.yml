summary: "Potential sensitive information disclosed in error reports\ndjango-registration is\
  \ a user-registration application for Django. \n\n### Impact\n\nThe django-registration package\
  \ provides tools for implementing user-account registration flows in the Django web framework.\
  \ In django-registration prior to 3.1.2, the base user-account registration view did not properly\
  \ apply filters to sensitive data, with the result that sensitive data could be included in\
  \ error reports rather than removed automatically by Django.\n\nTriggering this requires the\
  \ following conditions:\n\n* A site is using django-registration < 3.1.2\n* The site has detailed\
  \ error reports (such as Django's [emailed error reports to site staff/developers](https://docs.djangoproject.com/en/3.1/howto/error-reporting/#email-reports))\
  \ enabled\n* A server-side error (HTTP 5xx) occurs during an attempt by a user to register\
  \ an account\n\nUnder these conditions, recipients of the detailed error report will see all\
  \ submitted data from the account-registration attempt, which may include the user's proposed\
  \ credentials (such as a password).\n\n### Patches\n\nAs of version 3.1.2, django-registration\
  \ properly applies Django's `sensitive_post_parameters()` decorator to the base user-registration\
  \ view, which will cause all data from the HTTP request body to be filtered from detailed\
  \ error reports in the event of a server-side crash during user account registration.\n\n\
  Note that as applied, this filters *all* HTTP request data from error reports. To selectively\
  \ allow some fields but not others, see Django's own documentation (in references) and the\
  \ notes below for how to apply `sensitive_post_parameters()` manually to a particular codebase's\
  \ `RegistrationView` subclass(es).\n\n### Workarounds\n\nUsers who cannot upgrade quickly\
  \ can apply the `django.views.decorators.debug.sensitive_post_parameters()` decorator to their\
  \ own registration views. The decorator should be applied on the `dispatch()` method of the\
  \ appropriate `RegistrationView` class, using Django's `method_decorator()` helper. For example:\n\
  \n```python\nfrom django.utils.decorators import method_decorator\nfrom django.views.decorators.debug\
  \ import sensitive_post_parameters\n\nfrom django_registration.views import RegistrationView\n\
  \nclass MyRegistrationView(RegistrationView):\n    \"\"\"\n    A RegistrationView subclass\
  \ manually protected against sensitive information disclosure\n    in error reports.\n\n \
  \   \"\"\"\n    @method_decorator(sensitive_post_parameters())\n    def dispatch(self, *args,\
  \ **kwargs):\n        return super().dispatch(*args, **kwargs)\n```\n\n### References\n\n\
  * Django's documentation on [error reporting in production](https://docs.djangoproject.com/en/3.1/howto/error-reporting/)\n\
  * [How Django's sensitive-data filters work](https://docs.djangoproject.com/en/3.1/howto/error-reporting/#filtering-error-reports)"
