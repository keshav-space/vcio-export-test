summary: "Mautic vulnerable to Path Traversal via Campaign Import\n### Summary\nA path traversal\
  \ vulnerability exists in the campaign import feature of Mautic 7. When extracting uploaded\
  \ ZIP files during campaign imports, a flaw in the validation logic allows file paths to escape\
  \ the intended temporary directories. \n\n### Impact\nAn authenticated user with campaign\
  \ import privileges (`campaign:imports:create`) can write arbitrary PHP files to sensitive\
  \ system directories. An attacker can exploit this to overwrite critical internal configuration\
  \ or cache components, resulting in Remote Code Execution (RCE) under the context of the web\
  \ server user.\n\n### Patched Versions\nThis security issue has been addressed in the following\
  \ release:\n* **7.1.2**\n\n*Note: Mautic 6.x, 5.x, and 4.x branches are not affected by this\
  \ vulnerability. For general security support regarding legacy Mautic 4 releases, please refer\
  \ to the [ELTS](https://mautic.org/extended-long-term-support-elts/) page.*\n\n### Workarounds\n\
  There are no official workarounds. To mitigate this risk without upgrading, revoke campaign\
  \ import permissions (`campaign:imports:create`) from non-administrative users."
