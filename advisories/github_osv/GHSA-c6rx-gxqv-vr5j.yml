summary: "nemo-appium vulnerable to OS Command Injection\nVersions of the package nemo-appium\
  \ before 0.0.9 are vulnerable to Command Injection due to improper input sanitization in the\
  \ 'module.exports.setup' function. \n\n**Note:** In order to exploit this vulnerability appium-running\
  \ 0.1.3 has to be installed as one of nemo-appium dependencies."
