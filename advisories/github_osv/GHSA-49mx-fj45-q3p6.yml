summary: "n8n's Unsafe Buffer Allocation Allows In-Process Memory Disclosure in Task Runner\n\
  ### Impact\n\nThe use of `Buffer.allocUnsafe()` and `Buffer.allocUnsafeSlow()` in the task\
  \ runner allowed untrusted code to allocate uninitialized memory. Such uninitialized buffers\
  \ could contain residual data from within the same Node.js process (for example, data from\
  \ prior requests, tasks, secrets, or tokens), resulting in potential information disclosure.\
  \  \n\nOnly authenticated users are able to execute code through Task Runners.\n\nThis issue\
  \ affected any deployment in which both of the following conditions were met:\n- Task Runners\
  \ were enabled using `N8N_RUNNERS_ENABLED=true` (default: false)\n- Code Node was enabled\
  \ (default: true)\n\n\n### Patches\n\nAccess to unsafe Buffer functions has been removed from\
  \ the task runner sandbox. All buffer allocations are now zero-filled by default.\n\n- **Fixed\
  \ in:** 1.114.3 & 1.115.0\n- **Action:** It is strongly recommended to upgrade to version\
  \ ≥ 1.114.3 as soon as possible.\n\nChanges introduced in this patch include:\n- Routing all\
  \ buffer allocations through `Buffer.alloc` (which zero-fills) operations where applicable\
  \  \n- Adding regression tests to ensure continued enforcement of safe allocation practices\n\
  \n\n### Workarounds\n\nIf an immediate upgrade cannot be applied, the following hardening\
  \ steps are recommended:\n\n- Disable the Code Node by adding `n8n-nodes-base.code` to the\
  \ `NODES_EXCLUDE` environment variable  \n- Prefer external mode for isolation: run Task Runners\
  \ in external mode so that untrusted task code executes in a separate sidecar container rather\
  \ than within the main n8n process. This configuration significantly reduces the risk of in-process\
  \ memory disclosure caused by unsafe buffer allocations.  \n  In external mode, a launcher\
  \ manages Task Runner processes in a dedicated sidecar environment, separate from the primary\
  \ n8n instance.  \n  See the [n8n documentation](https://docs.n8n.io/hosting/configuration/task-runners/)\
  \ for configuration details and required environment variables.\n\n\n### Resources\n\n- Node.js\
  \ documentation: [`Buffer.alloc()`](https://nodejs.org/docs/latest-v22.x/api/buffer.html#static-method-bufferallocsize-fill-encoding)\
  \ vs [`Buffer.allocUnsafe()`](https://nodejs.org/docs/latest-v22.x/api/buffer.html#static-method-bufferallocunsafesize)\
  \ — background on zero-filled vs uninitialized allocations  \n- [n8n Documentation — Task\
  \ Runners](https://docs.n8n.io/hosting/configuration/task-runners/) — external mode, setup\
  \ guide, and environment configuration details\n- [n8n Documentation — Blocking nodes](https://docs.n8n.io/hosting/securing/blocking-nodes/)\
  \ — how to globally disable specific nodes"
