summary: "LibreNMS vulnerable to SQL injection time-based leads to database extraction\n###\
  \ Summary\nSQL injection vulnerability in POST /search/search=packages in LibreNMS 24.3.0\
  \ allows a user with global read privileges to execute SQL commands via the package parameter.\
  \ \n\n### Details\nThere is a lack of hygiene of data coming from the user in line 83 of the\
  \ file librenms/includes/html/pages/search/packages.inc.php\n![vulnerability](https://github.com/librenms/librenms/assets/58785171/3ad76f72-e62b-475e-84a0-4024e751f44c)\n\
  \n### PoC\nhttps://doc.clickup.com/9013166444/p/h/8ckm0bc-53/16811991bb5fff6\n\n### Impact\n\
  With this vulnerability, we can exploit a SQL injection time based vulnerability to extract\
  \ all data from the database, such as administrator credentials"
