aliases:
  - CVE-2026-32629
summary: "phpMyFAQ is Vulnerable to Stored XSS via Unsanitized Email Field in Admin FAQ Editor\n\
  ### Summary\nAn unauthenticated attacker can submit a guest FAQ with an email address that\
  \ is syntactically valid per RFC 5321 (quoted local part) yet contains raw HTML — for example\
  \ \"<script>alert(1)</script>\"@evil.com. PHP's FILTER_VALIDATE_EMAIL accepts this email as\
  \ valid. The email is stored in the database without HTML sanitization and later rendered\
  \ in the admin FAQ editor template using Twig's |raw filter, which bypasses auto-escaping\
  \ entirely.\n\n### Details\n1. PHP FILTER_VALIDATE_EMAIL accepts RFC-valid quoted local parts\
  \ with dangerous characters\n\nphpmyfaq/src/phpMyFAQ/Controller/Frontend/Api/FaqController.php:99\n\
  $email = trim((string) Filter::filterVar($data->email, FILTER_VALIDATE_EMAIL));\nPHP accepts\
  \ \"<script>alert(1)</script>\"@evil.com as a valid email (RFC 5321 allows <, > inside quoted\
  \ local parts). Confirmed:\n\"<script>alert(1)</script>\"@evil.com => string (valid, not false)\n\
  \n2. Email stored raw without HTML sanitization\n\nphpmyfaq/src/phpMyFAQ/Faq.php — email retrieved\
  \ directly as $row->email from the database.\n\n3. Admin Twig template renders email with\
  \ |raw\n\nphpmyfaq/assets/templates/admin/content/faq.editor.twig:296\n<input type=\"email\"\
  \ name=\"email\" id=\"email\" value=\"{{ faqData['email'] | raw }}\" class=\"form-control\"\
  >\n\nAffected version: 4.2.0-alpha, commit f0dc86c8f\n\n\n### PoC\n**The reproduction of the\
  \ vulnerability was implemented with the help of AI while reviewing the source code to generate\
  \ the proof-of-concept. Please kindly note this for reference. Since the vulnerability has\
  \ already been confirmed directly in the source code, the proof-of-concept code may be considered\
  \ as a reference only.**\n\nPlease extract the attached compressed file and proceed.\n[poc.zip](https://github.com/user-attachments/files/25938058/poc.zip)\n\
  \n\n0. (docker compose -f docker-compose.yml down -v)\n1. docker compose -f docker-compose.yml\
  \ up -d mariadb php-fpm nginx\n2. bash exploit.sh\n-----\n1. Access http://localhost:8888/admin/\n\
  2. Log in with admin / Admin1234!\n3. After logging in, check whether the URL remains http://localhost:8888/admin/\n\
  4. Go to Content → FAQ Administration → edit \"poc\" → alert popup should appear\nIf it does\
  \ not appear, you can also access it directly via:\nhttp://localhost:8888/admin/faq/edit/1/en\n\
  \n\n<img width=\"1388\" height=\"239\" alt=\"스크린샷 2026-03-12 오후 11 42 52\" src=\"\
  https://github.com/user-attachments/assets/b6d5446f-4eba-4cb2-9284-1bca4855142e\" />\n<img\
  \ width=\"1171\" height=\"92\" alt=\"스크린샷 2026-03-12 오후 11 16 17\" src=\"https://github.com/user-attachments/assets/3578e429-7106-4616-92ed-4167816d40f0\"\
  \ />\n\n\n### Impact\nWhen an administrator opens /admin/faq/edit/{id}/{lang} to review the\
  \ pending FAQ, the injected script executes in the admin's browser context. This allows an\
  \ attacker to:\n\n- Steal the administrator's session cookie → full admin account takeover\n\
  - Perform arbitrary admin actions (create users, modify content, change configuration)\n-\
  \ Pivot to further attacks on the server\n\nThe attack chain requires no authentication. By\
  \ default, records.allowNewFaqsForGuests=true allows unauthenticated FAQ submission, and records.defaultActivation=false\
  \ guarantees the administrator must visit the edit page to review it.\n\nNote on captcha:\
  \ The built-in captcha is enabled by default when the PHP gd extension is present (spam.enableCaptchaCode=true).\
  \ This prevents fully automated exploitation but does not prevent a targeted manual attack\
  \ — an attacker can solve the captcha once and submit the payload. \n\n### Credits\nwooseokdotkim"
