summary: "LangGraph has NoSQL parameter injection in MongoDBSaver, allowing cross-tenant state\
  \ access\n## Summary\n\nA NoSQL injection vulnerability existed in `MongoDBSaver` where checkpoint\
  \ identifier fields from `config.configurable` were used in MongoDB queries without strict\
  \ type enforcement. In vulnerable versions, attacker-controlled object payloads (for example\
  \ MongoDB operators like `$gt` and `$ne`) could be interpreted as query operators instead\
  \ of literal identifier values.\n\nThis could bypass intended thread scoping and return checkpoints\
  \ from other tenants.\n\n## Attack surface\n\nThe vulnerable path was in `MongoDBSaver.getTuple()`,\
  \ where `thread_id`, `checkpoint_ns`, and `checkpoint_id` were used in MongoDB `find()` queries.\
  \ The same unvalidated values were then reused to fetch pending writes.\n\nApplications were\
  \ exposed when untrusted input was forwarded into `config.configurable` (for example, directly\
  \ from request bodies or query parameters) without string coercion or schema validation.\n\
  \n## Who is affected?\n\nApplications are vulnerable if they:\n\n- Use `@langchain/langgraph-checkpoint-mongodb`\
  \ with multi-tenant or user-isolated thread models.\n- Accept user-controlled values for `thread_id`,\
  \ `checkpoint_ns`, or `checkpoint_id`.\n- Pass those values into `app.invoke()`, `app.stream()`,\
  \ or direct saver methods without validation.\n\nApplications are generally not vulnerable\
  \ if they:\n\n- Use server-issued identifiers only.\n- Source `thread_id` from trusted URL\
  \ params that remain strings.\n- Enforce schema validation that rejects non-string identifier\
  \ fields.\n\n## Impact\n\nAn attacker with control over configurable checkpoint identifiers\
  \ could read checkpoint data outside their authorized thread boundary.\n\nPotentially exposed\
  \ data includes:\n\n- Checkpoint state\n- Metadata\n- Pending writes\n\nThis is a confidentiality\
  \ issue with cross-tenant data disclosure risk.\n\n## Exploit example\n\nAn attacker-controlled\
  \ request can inject MongoDB operators:\n\n```ts\ngraph = new StateGraph(...)\n  .compile({\n\
  \    checkpointer: new MongoDBSaver()\n  });\n\ngraph.invoke(..., {\n  configurable: {  \n\
  \    \"thread_id\": { \"$gt\": \"\" },\n    \"checkpoint_ns\": { \"$ne\": null }\n  }\n});\n\
  ```\n\nIf this payload is forwarded into `config.configurable`, the resulting query may match\
  \ checkpoints outside the intended tenant/thread scope.\n\n## Security hardening changes\n\
  \nVersion `1.3.1` hardens `@langchain/langgraph-checkpoint-mongodb` by adding runtime validation\
  \ for configurable checkpoint identifiers and rejecting invalid values before MongoDB query/write\
  \ paths execute.\n\nThe patch also includes regression tests covering object/operator payloads\
  \ across affected methods.\n\n## Migration guide\n\nUpgrade to `@langchain/langgraph-checkpoint-mongodb@1.3.1`\
  \ or later.\n\nNo API migration is required for valid callers. However, applications that\
  \ currently pass non-string identifier values in `config.configurable` will now receive explicit\
  \ errors and should normalize/validate inputs.\n\nAs defense in depth, validate identifier\
  \ fields at API boundaries and avoid passing raw client objects into graph config.\n\n## Resources\n\
  \n- Issue: https://github.com/langchain-ai/langgraphjs/issues/2351\n- Fix PR: https://github.com/langchain-ai/langgraphjs/pull/2397"
