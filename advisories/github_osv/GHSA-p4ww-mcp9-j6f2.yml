aliases:
  - CVE-2025-66300
summary: "Grav is vulnerable to Arbitrary File Read\n### Summary\n\n- A low privilege user account\
  \ with page editing privilege can read any server files using \"Frontmatter\" form.\n- This\
  \ includes Grav user account files - /grav/user/accounts/*.yaml. This file stores hashed user\
  \ password, 2FA secret, and the password reset token.\n- This can allow an adversary to compromise\
  \ any registered account by resetting a password for a user to get access to the password\
  \ reset token from the file or by cracking the hashed password.\n\n### Details\n_The vulnerability\
  \ can be found in /user/plugins/form/templates/forms/fields/display/display.html.twig_\n![image](https://github.com/getgrav/grav/assets/28057767/953dbdf1-310f-4c8e-866c-8470d70cc11d)\n\
  \n\n### PoC\n1.\tThis PoC was conducted on Grav CMS version 1.7.46 and Admin Plugin version\
  \ 1.10.46\n \n![image](https://github.com/getgrav/grav/assets/28057767/6c8607d6-cea3-4699-8a5a-8a04d047676f)\n\
  \n2.\tgo to “http://grav.local/admin/pages” then create new page with “Page Template” option\
  \ set to “Form”.\n \n![image](https://github.com/getgrav/grav/assets/28057767/451fe8bc-2e2e-4f8a-a548-385aca6d5504)\n\
  \n3.\tThen go to “Expert” and on Frontmatter input box used to following form template.\n\n\
  ![image](https://github.com/getgrav/grav/assets/28057767/9e44758a-021a-45fd-9e26-03abbf8095ef)\n\
  \n4.\tSave page and go the preview or published page you will see the content of “/etc/passwd”\
  \ file on the server.\n \n![image](https://github.com/getgrav/grav/assets/28057767/94dc2363-10e1-4e74-81e4-6c7a09db4dff)\n\
  \n\n\n### Impact\nThis can allow a low privileged user to perform a full account takeover\
  \ of other registered users including Administrators. This can also allow an adversary to\
  \ read any file on the web server. And Due to insufficient permission verification , user\
  \ who can write a page also can use frontmatter feature using this IDOR vulnerability [PoC\
  \ IDOR](https://www.youtube.com/watch?v=EU1QA0idoWE&ab_channel=%EA%B9%80%EC%A2%85%EB%AF%BC)\
  \ mention in [CVE-2024-2792](https://github.com/getgrav/grav/security/advisories/GHSA-f6g2-h7qv-3m5v)"
