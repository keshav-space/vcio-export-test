advisory_id: GHSA-42wg-hm62-jcwg
datasource_id: github_osv/GHSA-42wg-hm62-jcwg
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2025/06/GHSA-42wg-hm62-jcwg/GHSA-42wg-hm62-jcwg.json
aliases:
  - CVE-2025-49124
summary: |
  Apache Tomcat installer for Windows has an untrusted search path vulnerability
  Untrusted Search Path vulnerability in Apache Tomcat installer for Windows. During installation, the Tomcat installer for Windows used icacls.exe without specifying a full path.

  This issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.7, from 10.1.0 through 10.1.41, from 9.0.23 through 9.0.105.

  Users are recommended to upgrade to version 11.0.8, 10.1.42 or 9.0.106, which fix the issue.
