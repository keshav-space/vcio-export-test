summary: "Mautic vulnerable to XSS in contact/company tracking (no authentication)\n## Summary\n\
  Prior to this patch being applied, Mautic's tracking was vulnerable to Cross-Site Scripting\
  \ through the Page URL variable.\n  \n## Patches\nPlease update to 4.4.13 or 5.1.1 or later.\n\
  \n## Workarounds\nNone\n\n## References\nhttps://owasp.org/www-project-top-ten/2017/A7_2017-Cross-Site_Scripting_(XSS)\n\
  https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/02-Testing_for_Stored_Cross_Site_Scripting\n\
  \nIf you have any questions or comments about this advisory:\nEmail us at [security@mautic.org](mailto:security@mautic.org)"
