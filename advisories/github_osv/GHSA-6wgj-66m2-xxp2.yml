exploits:
  - description: |
      RCE in Ray via the agent job submission endpoint.
                This is intended functionality as Ray's main purpose is executing arbitrary workloads.
                By default Ray has no authentication.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - artifacts-on-disk
        - ioc-in-logs
      Reliability:
