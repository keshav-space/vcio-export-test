summary: "ImageMagick has a Format String Bug in InterpretImageFilename leads to arbitrary code\
  \ execution\n## Summary\nA format string bug vulnerability exists in `InterpretImageFilename`\
  \ function where user input is directly passed to `FormatLocaleString` without proper sanitization.\
  \ An attacker can overwrite arbitrary memory regions, enabling a wide range of attacks from\
  \ heap overflow to remote code execution.\n<br>\n\n## Details\n### root cause\n```\nMagickExport\
  \ size_t InterpretImageFilename(const ImageInfo *image_info,\n  Image *image,const char *format,int\
  \ value,char *filename,\n  ExceptionInfo *exception)\n{\n\n...\n\n  while ((cursor=strchr(cursor,'%'))\
  \ != (const char *) NULL)\n  {\n    const char\n      *q = cursor;\n\n    ssize_t\n      offset\
  \ = (ssize_t) (cursor-format);\n\n    cursor++;  /* move past '%' */\n    if (*cursor == '%')\n\
  \      {\n        /*\n          Escaped %%.\n        */\n        cursor++;\n        continue;\n\
  \      }\n    /*\n      Skip padding digits like %03d.\n    */\n    if (isdigit((int) ((unsigned\
  \ char) *cursor)) != 0)\n      (void) strtol(cursor,(char **) &cursor,10);\n    switch (*cursor)\n\
  \    {\n      case 'd':\n      case 'o':\n      case 'x':\n      {\n        ssize_t\n    \
  \      count;\n\n        count=FormatLocaleString(pattern,sizeof(pattern),q,value);\n    \
  \    if ((count <= 0) || (count >= MagickPathExtent) ||\n            ((offset+count) >= MagickPathExtent))\n\
  \          return(0);\n        (void) CopyMagickString(p+offset,pattern,(size_t) (MagickPathExtent-\n\
  \          offset));\n        cursor++;\n        break;\n      }\n```\nWhen the InterpretImageFilename\
  \ function processes a filename beginning with format specifiers such as %d, %o, or %x, the\
  \ filename string is directly passed as a parameter to the FormatLocaleString function.\n\
  <br>\n```\nMagickExport ssize_t FormatLocaleString(char *magick_restrict string,\n  const\
  \ size_t length,const char *magick_restrict format,...)\n{\n  ssize_t\n    n;\n\n  va_list\n\
  \    operands;\n\n  va_start(operands,format);\n  n=FormatLocaleStringList(string,length,format,operands);\n\
  \  va_end(operands);\n  return(n);\n}\n```\n```\nMagickPrivate ssize_t FormatLocaleStringList(char\
  \ *magick_restrict string,\n  const size_t length,const char *magick_restrict format,va_list\
  \ operands)\n{\n...\nn=(ssize_t) _vsnprintf_l(string,length,format,locale,operands);\n```\n\
  Inside FormatLocaleString, the variable argument list is initialized through va_start, after\
  \ which the format string processing occurs by interpreting the format specifiers and using\
  \ corresponding values from CPU registers and the call stack as arguments for the formatting\
  \ operations.\n<br>\n## PoC\n### 1. Heap overflow read tested on development container\n```\n\
