  \ 00 00 00 00 fa fa 00 00 00 00 fa fa 00 00 00 00\nShadow byte legend (one shadow byte represents\
  \ 8 application bytes):\n  Addressable:           00\n  Partially addressable: 01 02 03 04\
  \ 05 06 07 \n  Heap left redzone:       fa\n  Freed heap region:       fd\n  Stack left redzone:\
  \      f1\n  Stack mid redzone:       f2\n  Stack right redzone:     f3\n  Stack after return:\
  \      f5\n  Stack use after scope:   f8\n  Global redzone:          f9\n  Global init order:\
  \       f6\n  Poisoned by user:        f7\n  Container overflow:      fc\n  Array cookie:\
  \            ac\n  Intra object redzone:    bb\n  ASan internal:           fe\n  Left alloca\
  \ redzone:     ca\n  Right alloca redzone:    cb\n==55653==ABORTING\n```\nProcessing a malicious\
  \ filename containing format string specifiers such as %d%n results in corruption of the SplayTree\
  \ structure stored in the r8 register. The corrupted structure contains invalid pointer values\
  \ that are later dereferenced by the SplaySplayTree function, causing the function to access\
  \ unintended memory locations and triggering a heap overflow condition.\n<br>\n\n### 2. Shell\
  \ execution tested on a local environment\n\nhttps://github.com/user-attachments/assets/00e6a091-8e77-48f0-959e-c05eff69ff94\n\
