summary: "Leaky JWTs in OpenMetadata exposing highly-privileged bot users\n### Summary\nCalls\
  \ issued by the UI against `/api/v1/ingestionPipelines` leak JWTs used by `ingestion-bot`\
  \ for certain services (Glue / Redshift / Postgres)\n\n### Details\nAny read-only user can\
  \ gain access to a highly privileged account, typically which has the Ingestion Bot Role.\
  \ This enables destructive changes in OpenMetadata instances, and potential data leakage (e.g.\
  \ sample data, or service metadata which would be unavailable per roles/policies). \n\n\n\
  ### PoC\nI was able to extract the JWT used by the bot/agent populating [sample_athena.default](https://sandbox.open-metadata.org/database/sample_athena.default)\
  \ in the Collate Sandbox. To prove this out, I mutated the description to this UUID: `fe2e4cc1-da72-4acf-8535-112a3cfa9c7e,`\
  \ which you can see  @ https://sandbox.open-metadata.org/database/sample_athena.default.\n\
  \n#### Steps to Reproduce\n\n* Create a Collate Sandbox account; these are non-admin accounts\
  \ by default with minimal permissions.\n* Open the Developer Console\n* Go to the Services\
  \ Page. In this case, [sample_athena](https://sandbox.open-metadata.org/service/databaseServices/sample_athena?showDeletedTables=false&currentPage=1),\
  \ though other services \n* In the Network tab, introspect the request made to api/v1/services/ingestionPipelines,\
  \ and find the jwtToken in the response:\n<img width=\"1329\" height=\"299\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/0c405776-159e-4188-9591-ed8cc71bc596\"\
  \ />\n\n* Use the JWT to issue (potentially destructive) API calls\n<img width=\"3024\" height=\"\
  1798\" alt=\"image\" src=\"https://github.com/user-attachments/assets/ab40b528-4d2b-404b-8f8a-482a1693e179\"\
  \ />\n\n* Resulting mutated description:\n<img width=\"622\" height=\"399\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/3fa630ff-93b5-4b7d-8e3c-220f8a84a23a\"\
  \ />\n\nNote that this is also the case for these services, among others:\n* [acme_nexus_redshift](https://sandbox.open-metadata.org/service/databaseServices/acme_nexus_redshift)\
  \ \n* [sample_postgres](https://sandbox.open-metadata.org/service/databaseServices/sample_postgres)\n\
  \n### Proposed Remediation\nRedact jwtToken in API payload.\nImplement role-based filtering\
  \ - Only return JWT tokens to users with explicit admin/service account permissions\n(for\
  \ Admins) Rotate Ingestion Bot Tokens in affected environments\n\n### Impact\n_What kind of\
  \ vulnerability is it? Who is impacted?_\n\n* Vulnerability Type: Privilege Escalation\n*\
  \ Risk: User impersonation, even for those with read-only access, can lead to destructive\
  \ outcomes if malicious actors leverage the leaked JWT."
