summary: "Pimcore Host Header Injection in user invitation link\n## Overview\n\nA potential\
  \ security vulnerability discovered in `pimcore/admin-ui-classic-bundle` version up to v1.3.3\
  \ . The vulnerability involves a Host Header Injection in the `invitationLinkAction` function\
  \ of the UserController, specifically in the way `$loginUrl` trusts user input. \n\n## Details\n\
  \nThe host header from incoming HTTP requests is used unsafely when generating URLs. An attacker\
  \ can manipulate the HTTP host header in requests to the /admin/user/invitationlink endpoint,\
  \ resulting in the generation of URLs with the attacker's domain. \n\nIn fact, if a host header\
  \ is injected in the POST request, the $loginURL parameter is constructed with this unvalidated\
  \ host header. It is then used to send an invitation email to the provided user.\n\nHere is\
  \ an excerpt from the affected section of UserController.php file:\n```\n// /src/Controller/Admin/UserController.php\
  \ \n    public function invitationLinkAction(Request $request, TranslatorInterface $translator):\
  \ JsonResponse\n    {\n            // ..snip..\n                $token = Tool\\Authentication::generateTokenByUser($user);\n\
  \                $loginUrl = $this->generateCustomUrl([\n                    'token' => $token,\n\
  \                    'reset' => true,\n                ]);\n\n                try {\n    \
  \                $mail = Tool::getMail([$user->getEmail()], 'Pimcore login invitation for\
  \ ' . Tool::getHostname());\n                    $mail->setIgnoreDebugMode(true);\n      \
  \              $mail->text(\"Login to pimcore and change your password using the following\
  \ link. This temporary login link will expire in  24 hours: \\r\\n\\r\\n\" . $loginUrl);\n\
  \                    $mail->send();\n      // ..snip..\n    }\n    // ..snip..\n    private\
  \ function generateCustomUrl(array $params, string $fallbackUrl = 'pimcore_admin_login_check',\
  \ int $referenceType = UrlGeneratorInterface::ABSOLUTE_URL): string\n    {\n        try {\n\
  \            $adminEntryPointRoute = $this->getParameter('pimcore_admin.custom_admin_route_name');\n\
  \n            //try to generate invitation link for custom admin point\n            $loginUrl\
  \ = $this->generateUrl($adminEntryPointRoute, $params, $referenceType);\n        } catch (\\\
  Exception $e) {\n            //use default login check for invitation link\n            $loginUrl\
  \ = $this->generateUrl($fallbackUrl, $params, $referenceType);\n        }\n\n        return\
  \ $loginUrl;\n    }\n```\nThe $loginUrl variable is constructed using the generateCustomUrl\
  \ function. If an attacker injects a malicious host header into a POST request, the resulting\
  \ $loginUrl will include the malicious domain, and this link is then sent via email to the\
  \ user.\n\n## Proof of Concept\n\nHere is an example of a request that exploits this vulnerability:\n\
  ```\nPOST /admin/user/invitationlink HTTP/1.1 \nHost: attacker-domain.evil \nCookie: PHPSESSID=test\n\
  X-pimcore-extjs-version-major: 7\nX-pimcore-extjs-version-minor: 0\nX-Requested-With: XMLHttpRequest\n\
  X-pimcore-csrf-token: 961c37cf60edfdc2eec5a705cb048aaa8c32804d\n\nusername=[username of a\
  \ valid user]\n```\n\n\nThe URL in the email will look like: `http://attacker-domain.evil/admin/login/login?token=[TOKEN]`\n\
  \n## Impact\n\nThis vulnerability can be used to perform phishing attacks by making the URLs\
  \ in the invitation links emails point to an attacker-controlled domain.\n\n## Remediation\n\
  \nWe recommend validating the host header and ensuring it matches the application's domain.\
  \ It would also be beneficial to use a default trusted host or hostname if the incoming host\
  \ header is not recognized or is absent.\n\nSimilar vulnerability (CVE-2024-23648) has been\
  \ fixed in this project  (https://github.com/pimcore/admin-ui-classic-bundle/commit/70f2205b5a5ea9584721d4f3e803f4d0dd5e4655)\n\
  \n## Credit\n\nDiscovered by @v0lck3r (Oussama RAHALI), Feb 2024."
