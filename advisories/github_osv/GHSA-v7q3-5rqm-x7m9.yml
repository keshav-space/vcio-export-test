summary: "Duplicate Advisory: Apache Superset uncontrolled resource consumption\n## Duplicate\
  \ Advisory\nThis advisory has been withdrawn because it is a duplicate of CVE-2023-46104.\
  \ This link is maintained to preserve external references.\n\n## Original Description\nWith\
  \ correct CVE version ranges for affected Apache Superset.\n \nUncontrolled resource consumption\
  \ can be triggered by authenticated attacker that uploads a malicious ZIP to import database,\
  \ dashboards or datasets.  \nThis vulnerability exists in Apache Superset versions up to and\
  \ including 2.1.2 and versions 3.0.0, 3.0.1."
