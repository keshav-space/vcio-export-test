aliases:
  - CVE-2023-33008
summary: "Apache Johnzon Deserialization of Untrusted Data vulnerability\nA malicious attacker\
  \ can craft up some JSON input that uses large numbers (numbers such as 1e20000000) that Apache\
  \ Johnzon will deserialize into BigDecimal and maybe use numbers too large which may result\
  \ in a slow conversion (Denial of service risk). Apache Johnzon 1.2.21 mitigates this by setting\
  \ a scale limit of 1000 (by default) to the BigDecimal. \n\n\nThis issue affects Apache Johnzon\
  \ through 1.2.20."
