  - CVE-2026-44162
summary: "fluent-plugin-s3 Vulnerable to Denial of Service (DoS) via Decompression Bomb in `in_s3`\n\
  The `fluent-plugin-s3` plugin (specifically the `in_s3` input plugin) supports reading and\
  \ decompressing heavily compressed files (such as `gzip`, `lzma2`, and `lzop`) from Amazon\
  \ S3. \nIt was discovered that the plugin read the entire decompressed payload into memory\
  \ at once without enforcing a strict size limit.\n\nIf an attacker has sufficient permissions\
  \ to upload files to the monitored S3 bucket, they can upload a maliciously crafted, highly\
  \ compressed file.\nWhen Fluentd attempts to decompress this file, it will expand to an excessive\
  \ size and it will consume significant system resources.\n\n### Impact\nThis vulnerability\
  \ allows for a **Denial of Service (DoS)** attack via memory exhaustion. \nThe rapid memory\
  \ consumption during decompression can lead to an Out-of-Memory kill of the Fluentd process\
  \ by the operating system, \nThis results in the disruption of all log collection on the affected\
  \ node.\n\n### Patches\nv1.8.5\n\n### Workarounds\nIf an immediate upgrade is not possible,\
  \ mitigate the risk by applying strict IAM access controls:\n\n1. Restrict Bucket Access\n\
  \   * Ensure that write (PUT) access to the S3 bucket monitored by `in_s3` is strictly limited\
  \ to trusted services and administrators. Prevent any public or untrusted uploads to the S3\
  \ bucket."
