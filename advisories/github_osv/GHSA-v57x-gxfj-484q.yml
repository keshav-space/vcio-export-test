summary: "Security Advisory for \"Log4Shell\"\n### Impact\nA highly critical 0-day exploit (CVE-2021-44228)\
  \ is found in Apache log4j 2 library on December 9, 2021.\n\nThis affects Apache log4j versions\
  \ from 2.0-beta9 to 2.14.1 (inclusive). \n\nThis vulnerability allows a remote attacker to\
  \ execute code on the server if the system logs an attacker-controlled string value with the\
  \ attacker's JNDI LDAP server lookup.\n\nAnother vulnerability related to the same library,\
  \ which was discovered on 12/14/2021 (CVE-2021-45046) and revealed another Remote Code Execution\
  \ vulnerability, has been investigated by Hazelcast team as well and it is found that it does\
  \ not affect Hazelcast Products under default configurations. \n\nThe finding of CVE-2021-45105\
  \ on 12/14/2021, which can cause a Denial of Service attack, was investigated by Hazelcast\
  \ team and it is confirmed that it does not affect Hazelcast Products under default configurations.\
  \ \n\nThe finding of CVE-2021-44832 on 12/28/2021, which is a medium vulnerability, is investigated\
  \ by our security team as well, and not considered to be as critical. It requires attacker\
  \ to be able to modify logging configuration, which means attacker can modify the filesystem\
  \ and/or can already execute arbitrary code which is more of a general security breach rather\
  \ than something log4j specific.\n\nNote that Hazelcast IMDG and IMDG Enterprise itself is\
  \ not affected.\n\nHowever, given version distributions are considered to be vulnerable since\
  \ related ZIP and TGZ distributions contain a vulnerable Hazelcast Management Center version.\n\
  \n### Patches\nCVE-2021-44228 is fixed in log4j 2.15.0.\nCVE-2021-45046 is fixed in log4j\
  \ 2.16.0.\nCVE-2021-45105 is fixed in log4j 2.17.0.\nCVE-2021-44832 is fixed in log4j 2.17.1.\n\
  \nAs of 12/21/2021, Hazelcast team has released a new version of all affected products that\
  \ upgrades log4j to 2.17.0 as listed below: \nHazelcast Management Center 4.2021.12-1, Hazelcast\
  \ Management Center 5.0.4.\nHazelcast IMDG and IMDG Enterprise 4.0.5, 4.1.8 and 4.2.4.\nHazelcast\
  \ Jet 4.5.3.\nHazelcast Platform 5.0.2.\n\nAs of 01/06/2022, Hazelcast Management Center 4.2022.01\
  \ with the updated log4j 2.17.1 is released. log4j2.17.1 will be included in Management Center\
  \ 5.1 that is expected to be released in February. \n\nHazelcast recommends upgrading to the\
  \ latest versions available.\n\n### Workarounds\nFor users that an upgrade is not an option,\
  \ below mitigations can be applied.\n\n#### Disabling lookups via Environment Variable \n\
  Setting the environment variable LOG4J_FORMAT_MSG_NO_LOOKUPS=true .\nThis option is the easiest\
  \ to apply for containerized environments.\n\n#### Disabling lookups in log4j2 configuration\n\
  Another good option since there is no need to replace JARs or no need to modify logging configuration\
  \ file, users who cannot upgrade to 2.17.0 can mitigate the exposure by:\n\nUsers of Log4j\
  \ 2.10 or greater may add `-Dlog4j2.formatMsgNoLookups=true `as a command line option or add\
  \ `-Dlog4j2.formatMsgNoLookups=true` in a `log4j2.component.properties` file on the classpath\
  \ to prevent lookups in log event messages.\nUsers since Log4j 2.7 may specify `%m{nolookups}`\
  \ in the PatternLayout configuration to prevent lookups in log event messages.\nAs an example;\
  \ users deploying Hazelcast Management Center via helm charts can do the following to disable\
  \ lookups and restart in one command:\n\n`helm upgrade <release-name> hazelcast/hazelcast\
  \ --set mancenter.javaOpts=\"<javaOpts> -Dlog4j2.formatMsgNoLookups=true\"`\n\nWhere <release-name>\
  \ is the release name and <javaOpts> is existing java options user has added previously.\n\
  \n#### Removing the JndiLookup from classpath\nRemove the JndiLookup and JndiManager classes\
  \ from the log4j-core jar. Note that removal of the JndiManager will cause the JndiContextSelector\
  \ and JMSAppender to no longer function.\n\n### References\nhttps://nvd.nist.gov/vuln/detail/CVE-2021-44228\n\
  https://nvd.nist.gov/vuln/detail/CVE-2021-45046\nhttps://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-45105\n\
  https://nvd.nist.gov/vuln/detail/CVE-2021-44832\nhttps://logging.apache.org/log4j/2.x/index.html\n\
  \n### For more information\nIf you have any questions or comments about this advisory:\n*\
  \ Open an issue in [our repo](https://github.com/hazelcast/hazelcast)\n* Slack us at [Hazelcast\
  \ Community Slack](https://slack.hazelcast.com/)"
