advisory_id: GHSA-gqr6-r77p-c2pj
datasource_id: github_osv/GHSA-gqr6-r77p-c2pj
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/08/GHSA-gqr6-r77p-c2pj/GHSA-gqr6-r77p-c2pj.json
aliases:
  - CVE-2026-55841
summary: "Fortigate syslog message parser can be exploited to modify or delete fields from the\
  \ original message\n### Impact\n\nA security issue has been identified in Graylog affecting\
  \ the parsing of syslog messages that use a key-value format, such as those generated by Fortigate\
  \ devices.\n\nThe vulnerability allows attackers to overwrite individual message fields, or\
  \ to produce invalid messages which Graylog will discard. This effectively enables log evasion\
  \ techniques to obscure malicious activity.\n\n### Patches\n\nThe issue has been fixed in\
  \ the following Graylog versions: `6.3.12`, `7.0.7`, `7.1.2`. Users should upgrade to one\
  \ of these versions or above to remediate the vulnerability.\n\nGraylog Cloud has already\
  \ been patched.\n\n### Workarounds\n\nThere are no feasible workarounds for this issue. Upgrading\
  \ to a patched version is recommended.\n\nTo find potentially discarded messages due to parsing\
  \ errors, customers of Graylog Enterprise or Security can check the Indexing and Processing\
  \ Failures Index[^1]. \n\n### Credits\n\nThanks to Jose Luis González, from Fundación Sarenet,\
  \ with additional analysis by Borja Marcos from Sarenet. \n\n\n[^1]: https://go2docs.graylog.org/current/getting_in_log_data/indexer_and_processing_failures.html"
