summary: "Ghost: Server-Side Request Forgery Mitigation Issue\n### Impact\n\nA validation issue\
  \ allowed some functionality, such as Webmentions, to be abused by an unauthenticated user\
  \ to make limited HTTP requests to hosts in the Ghost server's internal network. A successful\
  \ attack would not result in any response data being returned.\n\n### Vulnerable versions\n\
  \nThis vulnerability is present in Ghost from v6.26.0 up to v6.54.0.\n\n### Patches\n\nv6.54.1\
  \ contains a fix for this issue.\n\n### How to update\n\nFor self-hosters using Docker, find\
  \ [Docker's official Ghost image here](https://hub.docker.com/_/ghost). Updating a Docker-based\
  \ Ghost instance [is documented here](https://docs.ghost.org/install/docker#updating-ghost).\
  \ \n\nIf your Ghost is a Ghost-CLI install see our documentation on [updating it to the latest\
  \ version here](https://docs.ghost.org/update). \n\n### References\n\nGhost thanks Hwang Seyeon\
  \ for disclosing this vulnerability responsibly.\n\n### For more information\n\nIf you have\
  \ any questions or comments about this advisory, email Ghost at [security@ghost.org](mailto:security@ghost.org)."
