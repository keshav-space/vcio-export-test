summary: |
  Microsoft Security Advisory CVE-2026-50650 – .NET Elevation of Privilege Vulnerability
  ## Executive summary

  Microsoft is releasing this security advisory to provide information about a vulnerability in Windows Presentation Foundation (WPF). This advisory also provides guidance on what developers can do to update their applications to remove this vulnerability.

  An elevation of privilege vulnerability exists in Windows Presentation Foundation (WPF) in .NET 8, .NET 9, and .NET 10 when parsing specially crafted XAML input. An attacker who successfully exploits this vulnerability could elevate privileges on the affected system.

  ## Announcement

  Announcement for this issue can be found at https://github.com/dotnet/announcements/issues/**TBD**

  ## CVSS Details

  - **Version:** 3.1
  - **Severity:** High
  - **Score:** 7.8
  - **Vector:** `CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H`
  - **Weakness:** CWE-94 (Improper Control of Generation of Code ('Code Injection'))

  ## Affected Platforms

  - **Platforms:** Windows
  - **Architectures:** All

  ## <a name="affected-packages"></a>Affected Packages
  The vulnerability affects any Microsoft .NET project if it uses any of affected package versions listed below

  ### <a name=".NET 10.0"></a>.NET 10.0
  Package name | Affected version | Patched version
  ------------ | ---------------- | -------------------------
  [Microsoft.WindowsDesktop.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-arm64)               | >= 10.0.0, <= 10.0.9 | 10.0.10
  [Microsoft.WindowsDesktop.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x64)               | >= 10.0.0, <= 10.0.9 | 10.0.10
  [Microsoft.WindowsDesktop.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x86)               | >= 10.0.0, <= 10.0.9 | 10.0.10

  ### <a name=".NET 9.0"></a>.NET 9.0
  Package name | Affected version | Patched version
  ------------ | ---------------- | -------------------------
  [Microsoft.WindowsDesktop.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-arm64)               | >= 9.0.0, <= 9.0.17 | 9.0.18
  [Microsoft.WindowsDesktop.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x64)               | >= 9.0.0, <= 9.0.17 | 9.0.18
  [Microsoft.WindowsDesktop.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x86)               | >= 9.0.0, <= 9.0.17 | 9.0.18

  ### <a name=".NET 8.0"></a>.NET 8.0
  Package name | Affected version | Patched version
  ------------ | ---------------- | -------------------------
  [Microsoft.WindowsDesktop.App.Runtime.win-arm64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-arm64)               | >= 8.0.0, <= 8.0.28 | 8.0.29
  [Microsoft.WindowsDesktop.App.Runtime.win-x64](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x64)               | >= 8.0.0, <= 8.0.28 | 8.0.29
  [Microsoft.WindowsDesktop.App.Runtime.win-x86](https://www.nuget.org/packages/Microsoft.WindowsDesktop.App.Runtime.win-x86)               | >= 8.0.0, <= 8.0.28 | 8.0.29

  ## Advisory FAQ

  ### <a name="how-affected"></a>How do I know if I am affected?

  If using a package listed in [affected packages](#affected-packages), you're exposed to the vulnerability.

  ### <a name="how-fix"></a>How do I fix the issue?

  1. To fix the issue please install the latest version of .NET. If you have installed one or more .NET SDKs through Visual Studio, Visual Studio will prompt you to update Visual Studio, which will also update your .NET SDKs.
  2. If your application references the vulnerable nuget package, update the package reference to the patched version. You can list the versions you have installed by running the `dotnet --info` command.

  Once you have installed the updated runtime or SDK, restart your apps for the update to take effect.

  Additionally, if you've deployed [self-contained applications](https://docs.microsoft.com/dotnet/core/deploying/#self-contained-deployments-scd) targeting any of the impacted versions, these applications are also vulnerable and must be recompiled and redeployed.

  ## Other Information

  ### Reporting Security Issues

  If you have found a potential security issue in a supported version of .NET, please report it to the Microsoft Security Response Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new). Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).

  Security reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.

  ### Support

  You can ask questions about this issue on GitHub in the .NET GitHub organization. The main repos are located at https://github.com/dotnet/runtime. The Announcements repo (https://github.com/dotnet/Announcements) will contain this bulletin as an issue and will include a link to a discussion issue. You can ask questions in the linked discussion issue.

  ### Disclaimer

  The information provided in this advisory is provided "as is" without warranty of any kind. Microsoft disclaims all warranties, either express or implied, including the warranties of merchantability and fitness for a particular purpose. In no event shall Microsoft Corporation or its suppliers be liable for any damages whatsoever including direct, indirect, incidental, consequential, loss of business profits or special damages, even if Microsoft Corporation or its suppliers have been advised of the possibility of such damages. Some states do not allow the exclusion or limitation of liability for consequential or incidental damages so the foregoing limitation may not apply.

