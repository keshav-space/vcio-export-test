summary: "go-git: Worktree operations may follow symlinks\n## Impact\n\nA symlink traversal\
  \ issue in `go-git` could allow worktree operations to modify files outside the intended worktree\
  \ path.\n\nThe `worktreeFilesystem` wrapper rejected dangerous path strings, including paths\
  \ containing `.git`, parent-directory components, or control characters. However, it did not\
  \ prevent filesystem operations from following symbolic links that were already present in\
  \ the worktree.\n\nAs a result, a path that is safe when evaluated as a string could still\
  \ resolve into the repository's Git metadata directory. For example, if `s` is a symbolic\
  \ link to `.git`, writing to `s/config` would modify `.git/config`.\n\nA symbolic link at\
  \ the final path component could also be followed. For example, if `s` points directly to\
  \ `.git/config`, opening `s` for writing with truncation could overwrite the repository configuration.\n\
  \nExploitation requires an attacker to be able to introduce or control a symbolic link in\
  \ the worktree and cause the application to perform a write through that path.\n\nApplications\
  \ using `storage/memory` for their Storer, or `go-billy/memfs` for their `Worktree`, are not\
  \ affected by this vulnerability.\n\n## Patches\n\nThe issue has been addressed by making\
  \ the worktree filesystem wrapper a symlink-safe boundary.\n\nWorktree operations now reject\
  \ paths where an existing symbolic link in any path component could cause the operation to\
  \ escape the intended worktree location, including symbolic links at the final component.\n\
  \nUsers of filesystem-backed worktrees should upgrade to a patched version.\n\n### Credits\n\
  \nThanks to @kodareef5 for reporting this issue and working with the go-git security team\
  \ toward its resolution. :1st_place_medal: \nWe would also like to thank @HughLewis20, who\
  \ independently reported the same issue while a fix was already in progress."
