summary: "moby/go-archive: Crafted tar archive can write outside the extraction directory\n\
  ### Summary\nThe tar extraction routines in `moby/go-archive` (`Unpack`, `UnpackLayer`, `Untar`/`UntarUncompressed`,\
  \ and the `ApplyLayer` helpers) do not confine filesystem operations to the destination directory.\
  \ A crafted archive can create or overwrite files **outside** the intended destination. \n\
  \n### Details\nThe extractor decides where each archive entry lands using lexical string checks\
  \ and then performs the filesystem operation on a path that is resolved by the OS, so a links\
  \ introduced by the archive can be followed out of the destination directory.\n\n### Impact\n\
  An attacker who controls the contents of archive can create or overwrite files at arbitrary\
  \ paths writable by the extracting process.\n\n### Workarounds\nOnly extract trusted archives."
