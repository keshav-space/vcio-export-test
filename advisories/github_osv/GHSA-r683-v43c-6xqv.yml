summary: "samlify SAML Signature Wrapping attack\nA Signature Wrapping attack has been found\
  \ in samlify <v2.10.0, allowing an attacker to forge a SAML Response to authenticate as any\
  \ user. \nAn attacker would need a signed XML document by the identity provider."
