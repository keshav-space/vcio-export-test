summary: "Ghost: Server-side request forgery via DNS rebinding in external request handling\n\
  ### Impact\n\nGhost’s private-IP check for outbound HTTP requests could be bypassed via DNS\
  \ rebinding, allowing an attacker to coerce the Ghost server into reaching hosts on internal\
  \ networks through features that issue external fetches.\n\n### Vulnerable versions\n\nThis\
  \ vulnerability is present in Ghost from v6.0.9 up to v6.21.0.\n\n### Patches\n\nv6.21.1 contains\
  \ a fix for this issue. \n\n### How to update\n\nFor self-hosters using Docker, find [Docker's\
  \ official Ghost image here](https://hub.docker.com/_/ghost). Updating a Docker-based Ghost\
  \ instance [is documented here](https://docs.ghost.org/install/docker#updating-ghost). \n\n\
  If your Ghost is a Ghost-CLI install see our documentation on [updating it to the latest version\
  \ here](https://docs.ghost.org/update). \n\n### Workarounds\n\nIf upgrading immediately is\
  \ not possible, operators can reduce exposure by preventing the Ghost server from reaching\
  \ sensitive internal ranges at the network layer — for example, egress firewall rules that\
  \ block the Ghost process from initiating connections to RFC1918 networks, loopback, link-local\
  \ (including `169.254.169.254`) and any other internal service ranges. Disabling features\
  \ that trigger outbound fetches (oEmbed, webmentions, recommendations) will further limit\
  \ the attack surface but does not remove the underlying issue.\n\n### References\n\nGhost\
  \ thanks Oluwaseun Esther Folorunsho, Lakshmikanthan K ([@l3tchupkt](https://github.com/l3tchupkt)),\
  \ [Offgrid Security](https://www.offgridsec.com/), and Baki for disclosing this vulnerability\
  \ responsibly.\n\n### For more information\n\nIf you have any questions or comments about\
  \ this advisory, email us at [security@ghost.org](mailto:security@ghost.org)."
