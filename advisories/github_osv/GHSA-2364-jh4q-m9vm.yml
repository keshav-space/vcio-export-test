summary: "Flowise: IDOR vulnerability exists at the GET /api/v1/organization/customer-default-source\
  \ endpoint\n### Summary\nAn Insecure Direct Object Reference (IDOR) vulnerability exists at\
  \ the **GET /api/v1/organization/customer-default-source** endpoint. This flaw allows an authenticated\
  \ attacker to bypass authorization checks and retrieve sensitive payment and profile information\
  \ of other customers by manipulating the customerId parameter. The exposed data includes email\
  \ addresses, account balances, currency types, and internal billing configurations.\n\n###\
  \ Details\nThe application fails to implement proper object-level access control. While the\
  \ endpoint requires a valid session/token, it does not verify if the requesting user has the\
  \ authority to access the specific customerId provided in the query string.\n\nWhen a request\
  \ is made to:\nGET /api/v1/organization/customer-default-source?customerId=cus_XXXX\n\nThe\
  \ server processes the request based solely on the existence of a valid session, returning\
  \ the data associated with the ID regardless of the data owner's identity. Since customer\
  \ IDs follow a predictable pattern (Stripe-formatted cus_...), an attacker could potentially\
  \ enumerate these IDs to scrape customer data.\n\n### PoC\n1. To reproduce the vulnerability,\
  \ follow these steps:\n\n2. Log in to your account at cloud.flowiseai.com.\n\n3. Capture a\
  \ request to the payment source endpoint using a proxy tool (e.g., Burp Suite).\n\n4. Change\
  \ the customerId parameter in the URL to a target user's ID (e.g., cus_U9ajkQvu0e67uH).\n\n\
  Execute the request:\n```\nGET /api/v1/organization/customer-default-source?customerId=cus_U9ajkQvu0e67uH\
  \ HTTP/2\nHost: cloud.flowiseai.com\nCookie: [YOUR_AUTHENTICATED_COOKIES]\n...\n```\nResponse:\
  \ \n```\n{\n  \"id\": \"cus_U9ajkQvu0e67uH\",\n  \"object\": \"customer\",\n  \"email\": \"\
  truongnguyen210044@gmail.com\",\n  \"balance\": 0,\n  \"currency\": \"usd\",\n  \"invoice_settings\"\
  : {\n    \"custom_fields\": null,\n    \"default_payment_method\": null\n  },\n  \"livemode\"\
  : true\n  ...\n}\n```\nThe server returns a 200 OK status with the private data of the target\
  \ customer.\n### Impact\n- Vulnerability Type: Broken Access Control (IDOR).\n\n- Impacted\
  \ Parties: All registered users and organizations on the FlowiseAI Cloud platform.\n\n- Consequences:\
  \ * Data Privacy Breach: Exposure of Personally Identifiable Information (PII) such as email\
  \ addresses.\n- Financial Information Leakage: Disclosure of account balances, currency settings,\
  \ and invoice metadata.\n\n- Compliance Risk: Potential violation of data protection regulations\
  \ (e.g., GDPR) due to unauthorized access to user billing profiles."
