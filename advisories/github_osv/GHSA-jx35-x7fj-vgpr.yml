aliases:
  - CVE-2026-53949
summary: "Ghost Content API filter bypass reveals private fields\n### Impact\n\nThe validation\
  \ applied to filters on the public API endpoints could be partially bypassed, making it possible\
  \ to reveal private fields via a brute force attack. If SQLite was used as the database password\
  \ hashes were fully accessible. If MySQL was used as the database the password hashes' case\
  \ (uppercase / lowercase) would have been lost, which would likely have rendered a further\
  \ brute force attack on the discovered hashes fruitless.\n\n### Vulnerable versions\n\nThis\
  \ vulnerability is present in Ghost from v5.46.1 up to v6.21.1.\n\n### Patches\n\nv6.21.2\
  \ contains a fix for this issue.\n\n### How to update\n\nFor self-hosters using Docker, find\
  \ [Docker's official Ghost image here](https://hub.docker.com/_/ghost). Updating a Docker-based\
  \ Ghost instance [is documented here](https://docs.ghost.org/install/docker#updating-ghost).\
  \ \n\nIf your Ghost is a Ghost-CLI install see our documentation on [updating it to the latest\
  \ version here](https://docs.ghost.org/update). \n\n### Workarounds\n\nIf upgrading immediately\
  \ is not possible, block or filter requests to Content API endpoints where the `filter` query\
  \ parameter contains `password` or `email` (including any compound form such as `users.password`,\
  \ `users.email`, `authors.password`, `authors.email`). Reject requests at a reverse proxy\
  \ / WAF layer before they reach Ghost.\n\nExample (case-insensitive) pattern to block on the\
  \ raw querystring:\n\n```\nfilter=[^&]*(password|email)\n```\n\n### References\n\nGhost thanks\
  \ crnkovic for disclosing this vulnerability responsibly.\n\n### For more information\n\n\
  If you have any questions or comments about this advisory, email Ghost at [security@ghost.org](mailto:security@ghost.org)."
