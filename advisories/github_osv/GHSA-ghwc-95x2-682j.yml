exploits:
  - description: Drupal Core contains a SQL injection vulnerability that could allow for privilege
      escalation and remote code execution via specially crafted requests sent with the database
      abstraction API.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2026-05-27'
    notes: https://www.drupal.org/sa-core-2026-004 ; https://nvd.nist.gov/vuln/detail/CVE-2026-9082
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2026-9082
  - description: |
      This module detects CVE-2026-9082, an unauthenticated SQL injection in
                Drupal core's PostgreSQL EntityQuery condition handler. It uses a crafted
                JSON:API filter array key to confirm the vulnerability with time-based
                blind SQL injection. MySQL, MariaDB, and SQLite are not affected.

                The configured JSON:API resource must be anonymously readable and expose
                at least one entity with a case-insensitive string field.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability: []
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2026-05-20'
    exploit_type:
    platform:
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/auxiliary/scanner/http/drupal_pgsql_entityquery_sqli.rb
    record_id: /modules/auxiliary/scanner/http/drupal_pgsql_entityquery_sqli.rb
  - description: Drupal Core 10.5.5 - Error-Based SQL Injection
    required_action:
    due_date:
    notes:
