summary: "Microsoft ASP.NET Core project templates vulnerable to denial of service\nA Denial\
  \ of Service vulnerability exists in ASP.NET Core project templates which utilize JWT-based\
  \ authentication tokens. This vulnerability allows an unauthenticated client to consume arbitrarily\
  \ large amounts of server memory, potentially triggering an out-of-memory condition on the\
  \ server and making the server no longer able to respond to legitimate requests. \n\n## Announcement\n\
  \nAnnouncement for this issue can be found at  https://github.com/dotnet/announcements/issues/290\n\
  \n### Mitigation factors\n\nThis impacts only .NET Core-based projects that were created using\
  \ any version of project templates listed in affected software. \nOther project templates\
  \ e.g., console applications, MAUI applications, Windows Forms or WPF applications, are not\
  \ affected.\n\n## Affected software\n\nThis impacts only .NET Core-based projects that were\
  \ created using any version of the below project templates.\n\n-\tASP.NET Core Web App (Model-View-Controller)\n\
  -\tASP.NET Core Web API\n-\tASP.NET Core Web App (Razor Pages)\n-\tBlazor Server App\n-\t\
  Blazor WebAssembly App\n\n## Advisory FAQ\n\n### How do I know if I am affected?\n\nIf you\
  \ are you using project templates listed in affected software, you may be exposed to the vulnerability.\n\
  \n### How do I fix the issue?\n\n#### For existing projects:\nIf you ever created any of these\
  \ projects via the dotnet new command or via Visual Studio's File -> New Project gesture,\
  \ and if you enabled federated authentication at project creation time, your project may be\
  \ vulnerable. To remediate the vulnerability, use your package manager to update any references\
  \ you may have to the Microsoft.AspNetCore.Authentication.JwtBearer, Microsoft.AspNetCore.Authentication.OpenIdConnect,\
  \ and Microsoft.IdentityModel.JsonWebTokens packages to their respective latest versions.\
  \ \n- [Microsoft.AspNetCore.Authentication.JwtBearer](https://www.nuget.org/packages/Microsoft.AspNetCore.Authentication.JwtBearer/)\
  \ \n- [Microsoft.AspNetCore.Authentication.OpenIdConnect](https://www.nuget.org/packages/Microsoft.AspNetCore.Authentication.OpenIdConnect/)\
  \ \n\nIf your project does not reference any of those three packages, you are not exposed\
  \ to this vulnerability.\n\n#### For new projects:\nTo remediate this issue please update\
  \ to the latest SDK listed below. Simply installing the SDK update is not sufficient to remediate\
  \ projects already-created / already-deployed projects which existed prior to this update\
  \ being released.\n\n* To fix the issue please install the latest version of .NET 6.0 or .NET\
  \ 7.0. If you have installed one or more .NET SDKs through Visual Studio, Visual Studio will\
  \ prompt you to update Visual Studio, which will also update your .NET  SDKs.\n* If you are\
  \ using one of the affected packages, please update to the patched version listed above.\n\
  * If you have .NET 6.0 or greater installed, you can list the versions you have installed\
  \ by running the `dotnet --info` command. You will see output like the following;\n\n```\n\
  .NET Core SDK (reflecting any global.json):\n\n Version:   7.0.200\n Commit:    8473146e7d\n\
  \nRuntime Environment:\n\n OS Name:     Windows\n OS Version:  10.0.18363\n OS Platform: Windows\n\
  \ RID:         win10-x64\n Base Path:   C:\\Program Files\\dotnet\\sdk\\7.0.300\\\n\nHost\
  \ (useful for support):\n\n  Version: 76.0.5\n  Commit:  8473146e7d\n\n.NET Core SDKs installed:\n\
  \n  7.0.200 [C:\\Program Files\\dotnet\\sdk]\n\n.NET Core runtimes installed:\n\n  Microsoft.AspNetCore.App\
  \ 7.0.5 [C:\\Program Files\\dotnet\\shared\\Microsoft.AspNetCore.App]\n  Microsoft.NETCore.App\
  \ 7.0.5 [C:\\Program Files\\dotnet\\shared\\Microsoft.NETCore.App]\n  Microsoft.WindowsDesktop.App\
  \ 7.0.5 [C:\\Program Files\\dotnet\\shared\\Microsoft.WindowsDesktop.App]\n\nTo install additional\
  \ .NET Core runtimes or SDKs:\n  https://aka.ms/dotnet-download\n```\n\n* If you're using\
  \ .NET 8.0, you should download and install .NET 8.0.101 SDK (for Visual Studio 2022 v17.8)\
  \ from https://dotnet.microsoft.com/download/dotnet-core/8.0.\n* If you're using .NET 7.0,\
  \ you should download and install .NET SDK 7.0.115 (for Visual Studio 2022 v17.4) from https://dotnet.microsoft.com/download/dotnet-core/7.0.\n\
  * If you're using .NET 6.0, you should download and install .NET SDK 6.0.321 (for Visual Studio\
  \ 2022 v17.2) from https://dotnet.microsoft.com/download/dotnet-core/6.0.\n\n.NET 6.0, .NET\
  \ 7.0, .NET 8.0 updates are also available from Microsoft Update. To access this either type\
  \ \"Check for updates\" in your Windows search, or open Settings, choose Update & Security\
  \ and then click Check for Updates.\n\nOnce you have installed the updated runtime or SDK,\
  \ restart your apps for the update to take effect.\n\nAdditionally, if you've deployed [self-contained\
  \ applications](https://docs.microsoft.com/dotnet/core/deploying/#self-contained-deployments-scd)\
  \ targeting any of the impacted versions, these applications are also vulnerable and must\
  \ be recompiled and redeployed.\n\n## Other Information\n\n### Reporting Security Issues\n\
  \nIf you have found a potential security issue in .NET 8.0 or .NET 7.0 or .NET 6.0, please\
  \ email details to secure@microsoft.com. Reports may qualify for the Microsoft .NET Core &\
  \ .NET 5 Bounty. Details of the Microsoft .NET Bounty Program including terms and conditions\
  \ are at <https://aka.ms/corebounty>.\n\n### Support\n\nYou can ask questions about this issue\
  \ on GitHub in the .NET GitHub organization. The main repos are located at https://github.com/dotnet/runtime\
  \ and https://github.com/dotnet/aspnet/. The Announcements repo (https://github.com/dotnet/Announcements)\
  \ will contain this bulletin as an issue and will include a link to a discussion issue. You\
  \ can ask questions in the linked discussion issue.\n\n### Disclaimer\n\nThe information provided\
  \ in this advisory is provided \"as is\" without warranty of any kind. Microsoft disclaims\
  \ all warranties, either express or implied, including the warranties of merchantability and\
  \ fitness for a particular purpose. In no event shall Microsoft Corporation or its suppliers\
  \ be liable for any damages whatsoever including direct, indirect, incidental, consequential,\
  \ loss of business profits or special damages, even if Microsoft Corporation or its suppliers\
  \ have been advised of the possibility of such damages. Some states do not allow the exclusion\
  \ or limitation of liability for consequential or incidental damages so the foregoing limitation\
  \ may not apply.\n\n### Acknowledgement\n\nMorgan Brown, Microsoft Corp."
