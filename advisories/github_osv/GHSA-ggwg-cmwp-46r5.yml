exploits:
  - description: Yii Framework contains an improper protection of alternate path vulnerability
      that may allow a remote attacker to execute arbitrary code. This vulnerability could affect
      other products that implement Yii, including—but not limited to—Craft CMS, as represented
      by CVE-2025-32432.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-05-23'
    notes: 'This vulnerability affects a common open-source component, third-party library,
      or a protocol used by different products. For more information, please see: https://www.yiiframework.com/news/709/please-upgrade-to-yii-2-0-52
      ; https://nvd.nist.gov/vuln/detail/CVE-2024-58136'
