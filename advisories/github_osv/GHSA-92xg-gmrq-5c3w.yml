aliases:
  - CVE-2024-45034
summary: "Apache Airflow vulnerable to Execution with Unnecessary Privileges\nApache Airflow\
  \ versions before 2.10.1 have a vulnerability that allows DAG authors to add local settings\
  \ to the DAG folder and get it executed by the scheduler, where the scheduler is not supposed\
  \ to execute code submitted by the DAG author. \nUsers are advised to upgrade to version 2.10.1\
  \ or later, which has fixed the vulnerability."
