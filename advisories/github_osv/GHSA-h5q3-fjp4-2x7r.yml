summary: "MantisBT vulnerable to information disclosure with user profiles\nUsing a crafted\
  \ POST request, an unprivileged, registered user is able to retrieve information about other\
  \ users' personal system profiles. \n\n### Impact\nDisclosure of private system profiles:\
  \ Platform, OS, OS version, Description.\n\n### Patches\n- https://github.com/mantisbt/mantisbt/commit/56bbd02dc1fb33a8de5898fd17dc3d698c847f55\n\
  \n### Workarounds\nNone\n\n### References\nhttps://mantisbt.org/bugs/view.php?id=34640"
