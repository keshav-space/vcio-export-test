summary: "Kimai has Server-Side Request Forgery in Invoice PDF Rendering via Markdown Image\
  \ URLs\n### Summary\n\nKimai 2.56.0 contains a server-side request forgery vulnerability in\
  \ its invoice PDF preview and generation workflow. If an attacker can control Markdown content\
  \ that is later rendered into an invoice PDF, such as `Customer.invoiceText`, the server-side\
  \ PDF renderer will fetch remote image URLs embedded in Markdown image syntax.\n\nThis allows\
  \ the application server to issue outbound requests to attacker-controlled or internal targets\
  \ during PDF rendering. The behavior can be used for internal network probing, server-side\
  \ reachability checks, and potentially follow-on exploitation depending on deployment environment\
  \ and accessible internal services.\n\n### Details\n\nThe vulnerable behavior occurs in the\
  \ invoice rendering chain when user-controlled Markdown is transformed into HTML and then\
  \ rendered by mPDF.\n\n- First, customer invoice text is copied into the invoice model.\n\
  . Second, the default PDF invoice template renders that field through the Markdown-to-HTML\
  \ filter. \n- Third, `md2html` enables full Markdown rendering. \n- Although safe mode is\
  \ enabled, the tested Markdown image syntax still survives into the rendered HTML chain in\
  \ a form that causes the PDF renderer to fetch the image resource.\n- Finally, the HTML is\
  \ handed to mPDF. \n\nThe live test confirms that mPDF attempts to retrieve the remote image\
  \ URL from the server side during PDF preview. This means the issue is not a template-injection\
  \ problem but an SSRF condition caused by the rendering pipeline:\n\n- attacker-controlled\
  \ Markdown\n- Markdown converted to HTML\n- HTML rendered by mPDF\n- mPDF fetches remote image\
  \ resources from the server side\n\n*A PoC was provided, but removed for security reasons.*\n\
  \n### Impact\n\nThis vulnerability allows an attacker who can influence invoice-rendered Markdown\
  \ fields to cause the Kimai server to make outbound requests to arbitrary destinations. In\
  \ real deployments, this can be used to probe internal services, test access to internal administrative\
  \ or metadata endpoints, and confirm server-side reachability to attacker-controlled infrastructure.\n\
  \nDepending on the environment, SSRF can also become a stepping stone toward more serious\
  \ outcomes, such as triggering side effects on internal HTTP services or extracting sensitive\
  \ information from services reachable only by the server. Because invoice generation is commonly\
  \ performed by administrative or finance-related users, the feature is realistically reachable\
  \ in business workflows.\n\n# Solution\n\n- Kimai does not allow to use markdown images any\
  \ longer and converts them to HTML links instead\n- Kimai uses a specialized HttpClient for\
  \ mPDF (called `NoPrivateNetworkHttpClient`), which prevents access to a variety of URLs,\
  \ the full list can be fetched [from the documentation](https://www.kimai.org/documentation/pdf-templates.html#embedding-images)\n\
  - This change can be a BC break, if someone used \n  - the Kimai domain for hosting invoice\
  \ or export template images \n  - an internal IP for hosting invoice or export template images\
  \ \n\nSee https://www.kimai.org/en/security/ghsa-pj8j-p4g4-4vw8"
