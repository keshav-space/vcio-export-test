summary: "Ghost: Paid gift memberships obtainable at minimal cost via the donations feature\n\
  ### Impact\n\nA vulnerability in Ghost's public donation checkout flow allowed an unauthenticated\
  \ attacker to obtain full paid gift memberships for a minimal payment. No customer or member\
  \ data was exposed, and the issue could not be used to steal money from a site or its members.\n\
  \n### Vulnerable versions\n\nThis vulnerability is present in Ghost from [v6.27.0](https://github.com/TryGhost/Ghost/releases/tag/v6.27.0)\
  \ up to [v6.43.1](https://github.com/TryGhost/Ghost/releases/tag/v6.43.1).\n\n### Patches\n\
  \n[v6.44.0](https://github.com/TryGhost/Ghost/releases/tag/v6.44.0) contains a fix for this\
  \ issue. \n\n### How to update\n\nFor self-hosters using Docker, find [Docker’s official Ghost\
  \ image on Docker Hub](https://hub.docker.com/_/ghost) and follow the documentation on [updating\
  \ a Docker-based Ghost instance](https://docs.ghost.org/install/docker#updating-ghost).\n\n\
  For self-hosters using Ghost-CLI, see the documentation for [updating Ghost to the latest\
  \ version](https://docs.ghost.org/update).\n\n### Workarounds\n\nIf upgrading immediately\
  \ is not possible, you can remove the vulnerable checkout path by disabling the donations\
  \ feature in Ghost Admin under Settings → Membership → Tips & donations until the upgrade\
  \ is applied.\n\n### References\n\nGhost thanks sane100400 and [p4p3r](https://hackerone.com/p4p3r_hak)\
  \ for disclosing this vulnerability responsibly.\n\n### For more information\n\nIf you have\
  \ any questions or comments about this advisory, email Ghost at [security@ghost.org](mailto:security@ghost.org)."
