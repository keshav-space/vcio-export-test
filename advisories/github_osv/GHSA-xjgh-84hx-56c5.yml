advisory_id: GHSA-xjgh-84hx-56c5
datasource_id: github_osv/GHSA-xjgh-84hx-56c5
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2022/05/GHSA-xjgh-84hx-56c5/GHSA-xjgh-84hx-56c5.json
aliases:
  - CVE-2017-12617
summary: |
  Unrestricted Upload of File with Dangerous Type Apache Tomcat
  When running Apache Tomcat versions 9.0.0.M1 to 9.0.0, 8.5.0 to 8.5.22, 8.0.0.RC1 to 8.0.46 and 7.0.0 to 7.0.81 with HTTP PUTs enabled (e.g. via setting the readonly initialisation parameter of the Default servlet to false) it was possible to upload a JSP file to the server via a specially crafted request. This JSP could then be requested and any code it contained would be executed by the server.
impacted_packages:
  - purl: pkg:maven/org.apache.tomcat/tomcat-catalina
    affected_versions: vers:maven/<=9.0.0M27|>=9.0.0.M1
