aliases:
  - CVE-2022-21728
summary: "Out of bounds read in Tensorflow\n### Impact \nThe [implementation of shape inference\
  \ for `ReverseSequence`](https://github.com/tensorflow/tensorflow/blob/5100e359aef5c8021f2e71c7b986420b85ce7b3d/tensorflow/core/ops/array_ops.cc#L1636-L1671)\
  \ does not fully validate the value of `batch_dim` and can result in a heap OOB read:\n\n\
  ```python\nimport tensorflow as tf\n\n@tf.function\ndef test():\n  y = tf.raw_ops.ReverseSequence(\n\
  \    input = ['aaa','bbb'],\n    seq_lengths = [1,1,1],\n    seq_dim = -10,\n    batch_dim\
  \ = -10 )\n  return y\n    \ntest()\n```\n\nThere is a check to make sure the value of `batch_dim`\
  \ does not go over the rank of the input, but there is no check for negative values:\n\n```cc\n\
  \  const int32_t input_rank = c->Rank(input);\n  if (batch_dim >= input_rank) {\n    return\
  \ errors::InvalidArgument( \n        \"batch_dim must be < input rank: \", batch_dim, \" vs.\
  \ \", input_rank);\n  }\n  // ...\n  \n  DimensionHandle batch_dim_dim = c->Dim(input, batch_dim);\n\
  ``` \n    \nNegative dimensions are allowed in some cases to mimic Python's negative indexing\
  \ (i.e., indexing from the end of the array), however if the value is too negative then [the\
  \ implementation of `Dim`](https://github.com/tensorflow/tensorflow/blob/5100e359aef5c8021f2e71c7b986420b85ce7b3d/tensorflow/core/framework/shape_inference.h#L415-L428)\
  \ would access elements before the start of an array:\n\n```cc\n  DimensionHandle Dim(ShapeHandle\
  \ s, int64_t idx) {\n    if (!s.Handle() || s->rank_ == kUnknownRank) {\n      return UnknownDim();\n\
  \    }\n    return DimKnownRank(s, idx);\n  } \n·\n  static DimensionHandle DimKnownRank(ShapeHandle\
  \ s, int64_t idx) {\n    CHECK_NE(s->rank_, kUnknownRank);\n    if (idx < 0) {\n      return\
  \ s->dims_[s->dims_.size() + idx];\n    }\n    return s->dims_[idx];\n  }\n```\n\n### Patches\n\
  We have patched the issue in GitHub commit [37c01fb5e25c3d80213060460196406c43d31995](https://github.com/tensorflow/tensorflow/commit/37c01fb5e25c3d80213060460196406c43d31995).\n\
  \nThe fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on TensorFlow\
  \ 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and still in supported\
  \ range.\n\n### For more information\nPlease consult [our security guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md)\
  \ for more information regarding the security model and how to contact us with issues and\
  \ questions.\n\n### Attribution\nThis vulnerability has been reported by Yu Tian of Qihoo\
  \ 360 AIVul Team."
