summary: |
  Duplicate Advisory: OpenClaw: Zalo webhook rate limiting could be bypassed before secret validation
  ### Duplicate Advisory
  This advisory has been withdrawn because it is a duplicate of GHSA-5m9r-p9g7-679c. This link is maintained to preserve external references.

  ### Original Description
  OpenClaw before 2026.3.12 applies rate limiting only after successful webhook authentication, allowing attackers to bypass rate limits and brute-force webhook secrets. Attackers can submit repeated authentication requests with invalid secrets without triggering rate limit responses, enabling systematic secret guessing and subsequent forged webhook submission.
