summary: "brace-expansion: DoS via exponential-time expansion of consecutive non-expanding {}\
  \ groups\n### Summary\nbrace-expansion's expand() exhibits exponential-time - O(2ⁿ) - behavior\
  \ in the number of consecutive non-expanding {} groups. A short, all-ASCII input (~90 bytes/30\
  \ groups) blocks the calling thread for minutes; a slightly longer input hangs it effectively\
  \ indefinitely. Because the dominant consumers run on Node's single-threaded event loop, one\
  \ small input can fully stall a worker/process.\n\nIn `expand_`, `post` is computed unconditionally\
  \ at the top of the function, before the early-return branches that don't use it:\n```js\n\
  const post = m.post.length ? expand_(m.post, max, false) : [''];   // always recurses\n  ...\n\
  if (!isSequence && !isOptions) {\n  if (m.post.match(/,(?!,).*\\}/)) {\n    str = m.pre +\
  \ '{' + m.body + escClose + m.post;\n    return expand_(str, max, true); // restart — `post`\
  \ discarded\n  }\n  return [str];\n}\n```\n\nFor input like a{},{},…, the first {} is non-expanding,\
  \ so control reaches the {a},b} rewrite branch - but `expand_` has already recursed into post\
  \ over the entire remaining tail, only to throw the result away.\nEach level therefore spawns\
  \ two recursive expansions over essentially the same remaining work: `T(n) = 2·T(n−1) ⇒ O(2ⁿ)`.\n\
  \nThe max option does not mitigate this: max only bounds the output-building loops; neither\
  \ the post recursion nor the rewrite recursion consults it.\n  \nMeasured on 5.0.6:\n\n| groups\
  \ (n) | input bytes | time |\n|---|---|---|\n| 20 | 60 | 130 ms |\n| 24 | 72 | 1.9 s |\n|\
  \ 26 | 78 | 7.8 s |\n| 30 (PoC) | 90 | ~2 min |\n\n### Proof of concept\n```js\nconst { expand\
  \ } = require('brace-expansion');\n// 30 non-expanding groups, ~90 bytes — blocks for minutes:\n\
  expand('a{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{}');\n\
  ```\n\n### Impact\n\nAny application that passes attacker-influenced strings to brace-expansion.expand()\
  \ - directly or transitively via minimatch/glob brace patterns - can be driven into a multi-minute-to-indefinite\
  \ CPU hang by a tiny request, denying service on that thread/process.\n\n### Remediation\n\
  \nUpgrade to a patched release. The fix:\n1. Defers computing post until after the early-return\
  \ branches (and computes it locally in the $-suffix branch), so post is only expanded when\
  \ a brace set actually expands and the value is used. This alone removes the exponential.\n\
  1. Converts the {a},b} rewrite from recursion to an in-function loop, so a long run of rewrites\
  \ cannot grow the call stack.\n\nVerified: the PoC drops from ~2 min to 0.55 ms, 5,000 groups\
  \ complete in ~344 ms, and output is identical to 5.0.6 across a behavioral-equivalence suite\
  \ (sequences, padding, $-prefix, a{},b}c, {},a}b, x{{a,b}}y, etc.). Post-fix complexity is\
  \ ~O(n²) on this input class - acceptable for the security fix; a linear rewrite can be a\
  \ non-urgent follow-up.\n\nIf immediate upgrade isn't possible, avoid passing untrusted input\
  \ to expand() / glob brace patterns, or run such expansion under a timeout/worker."
