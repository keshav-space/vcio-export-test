summary: "MariaDB's connector leaks the cleartext password to an MitM despite `ssl: true`\n\
  ### Summary\nWhen SSL/TLS is enabled but no CA / server certificate is provided, the\nconnector\
  \ verifies the server's identity using fingerprint validation. The\ncheck is effective,  the\
  \ connection is ultimately rejected when it fails, \nbut it happens *after* the authentication\
  \ exchange. As a result, the\ncredentials are sent before validation occurs, so an active\
  \ man-in-the-middle\nwho presents their own certificate receives the password in the handshake\n\
  before the connection is aborted.\n\n### Impact\nThe credentials are transmitted to the peer\
  \ before the server's identity is\nvalidated. An on-path attacker (MitM) presenting any certificate\
  \ can capture\nthe account password, even though the connection then fails the fingerprint\n\
  check and is closed. The disclosed credentials can subsequently be used to\nauthenticate directly\
  \ against the server.\n\n- Attacker requirement: active man-in-the-middle position on the\
  \ network path\n- Affected configuration: SSL/TLS enabled without a CA / server certificate\n\
  \n### Affected versions\n- < 3.2.4\n- 3.3.0 – 3.3.2\n- 3.4.0 – 3.4.5\n- 3.5.0 – 3.5.2\n\n\
  ### Patches\nFixed in 3.2.4, 3.3.3, 3.4.6, and 3.5.3. Upgrade to one of these (or later)\n\
  on your branch.\n\n### Workarounds\nUntil you can upgrade, configure certificate verification\
  \ explicitly, provide\nthe server/CA certificate and use a verifying SSL mode (e.g. VERIFY_CA\
  \ /\nVERIFY_FULL). \n\nReported by haaahaaahiihiiii (no GitHub account)."
