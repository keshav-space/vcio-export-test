summary: "DQL injection through sorting parameters blocked\n### Impact\nValues added at the\
  \ end of query sorting were passed directly to the DB. We don't know, if it could lead to\
  \ direct SQL injections, however, we should not allow for easy injection of values there anyway.\n\
  \n### Patches\nThe issue is fixed in version 1.10.1 and in 1.11-rc.1\n\n### Workarounds\n\n\
  You have to overwrite your `Sylius\\Component\\Grid\\Sorting\\Sorter.php` class:\n\n```php\n\
  <?php\n\n// src/App/Sorting/Sorter.php\n\ndeclare(strict_types=1);\n\nnamespace App\\Sorting;\n\
  \nuse Symfony\\Component\\HttpKernel\\Exception\\BadRequestHttpException;\nuse Sylius\\Component\\\
  Grid\\Data\\DataSourceInterface;\nuse Sylius\\Component\\Grid\\Definition\\Grid;\nuse Sylius\\\
  Component\\Grid\\Parameters;\nuse Sylius\\Component\\Grid\\Sorting\\SorterInterface;\n\nfinal\
  \ class Sorter implements SorterInterface\n{\n    public function sort(DataSourceInterface\
  \ $dataSource, Grid $grid, Parameters $parameters): void\n    {\n        $enabledFields =\
  \ $grid->getFields();\n        $expressionBuilder = $dataSource->getExpressionBuilder();\n\
  \n        $sorting = $parameters->get('sorting', $grid->getSorting());\n        $this->validateSortingParams($sorting,\
  \ $enabledFields);\n\n        foreach ($sorting as $field => $order) {\n            $this->validateFieldNames($field,\
  \ $enabledFields);\n\n            $gridField = $grid->getField($field);\n            $property\
  \ = $gridField->getSortable();\n\n            if (null !== $property) {\n                $expressionBuilder->addOrderBy($property,\
  \ $order);\n            }\n        }\n    }\n\n    private function validateSortingParams(array\
  \ $sorting, array $enabledFields): void\n    {\n        foreach (array_keys($enabledFields)\
  \ as $key) {\n            if (array_key_exists($key, $sorting) && !in_array($sorting[$key],\
  \ ['asc', 'desc'])) {\n                throw new BadRequestHttpException(sprintf('%s is not\
  \ valid, use asc or desc instead.', $sorting[$key]));\n            }\n        }\n    }\n\n\
  \    private function validateFieldNames(string $fieldName, array $enabledFields): void\n\
  \    {\n        $enabledFieldsNames = array_keys($enabledFields);\n\n        if (!in_array($fieldName,\
  \ $enabledFieldsNames, true)) {\n            throw new BadRequestHttpException(sprintf('%s\
  \ is not valid field, did you mean one of these: %s?', $fieldName, implode(', ', $enabledFieldsNames)));\n\
  \        }\n    }\n}\n```\nand register it in your container: \n\n```yaml\n# config/services.yaml\n\
  services:\n    # ...\n    sylius.grid.sorter:\n        class: App\\Sorting\\Sorter\n```\n\n\
  ### For more information\nIf you have any questions or comments about this advisory:\n* Open\
  \ an issue in [Sylius issues](https://github.com/Sylius/Sylius/issues)\n* Email us at [security@sylius.com](mailto:security@sylius.com)"
