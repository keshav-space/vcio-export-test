summary: "Winter: Stored XSS through Editor Settings custom styles\n### Impact             \
  \                                                                                        \
  \  \n                                                                                    \
  \                               \nAuthenticated Backend Users with the `backend.manage_editor`\
  \ (\"Manage editor settings\") permission can provide custom styles through **Settings → Editor\
  \ Settings → Markup Styles** that are compiled through the LESS CSS parser and rendered on\
  \ every backend page. Previously, the compiled output was not sanitized, which could have\
  \ allowed a stored XSS attack.\n\nAlthough this is a valid security issue, it's important\
  \ to note that its severity is relatively low. To exploit the vulnerability, an attacker would\
  \ already need to have trusted access to the Winter CMS backend with a specific administrative\
  \ permission. The Winter CMS                maintainers recommend that the `backend.manage_editor`\
  \ permission only be granted to trusted administrators and developers.\n\nA related issue\
  \ exists in the custom CSS field at **Settings → Customize Backend → Styles** (`backend.manage_branding`\
  \ permission), which uses the same rendering mechanism and is addressed separately.\n\nAll\
  \ users are advised to update to the latest version to ensure their systems remain secure.\n\
  \n### Patches\n\nThis issue has been patched in v1.2.13. The `renderCss()` method now applies\
  \ `strip_tags()` to compiled CSS output before returning it.\n\n### Workarounds\n\nApply [https://github.com/wintercms/winter/commit/d28f0b9474af79cfaa80eeb9d691f7a7c4469720](https://github.com/wintercms/winter/commit/d28f0b9474af79cfaa80eeb9d691f7a7c4469720)\
  \ manually if unable to upgrade to v1.2.13.\n\n### Resources\n\n- CVE-2025-61674 (identical\
  \ vulnerability in October CMS, patched in v3.7.13 and v4.0.12)"
