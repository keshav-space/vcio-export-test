summary: "RabbitMQ vulnerable to Denial of Service by publishing large messages over the HTTP\
  \ API\n### Summary\n\nResponsibly disclosed by @NSEcho.\n\nHTTP API did not enforce an HTTP\
  \ request body limit, making it vulnerable for DoS attacks with very large messages. \n\n\
  ### Details\n\nAn authenticated user with sufficient credentials can publish a very large\
  \ messages over the HTTP API\nand cause target node to be terminated by an \"out-of-memory\
  \ killer\"-like mechanism.\n\nA PoC was provided to Team RabbitMQ privately.\n\n### Impact\n\
  \nDenial of Service"
