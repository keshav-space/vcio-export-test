summary: "Envoy Gateway: xDS Control Plane Information Disclosure when operating in GatewayNamespaceMode\n\
  ### Impact\nWhen Envoy Gateway runs in GatewayNamespaceMode (`provider.kubernetes.deploy.type=GatewayNamespace`),\
  \ the xDS gRPC server is configured with a `StreamInterceptor` for JWT authentication but\
  \ no UnaryInterceptor. The go-control-plane xDS server exposes both streaming and unary (Fetch)\
  \ RPC methods for all registered discovery services. Since there is no unary interceptor,\
  \ these Fetch endpoints are completely unauthenticated. \n\nAdditionally, the JWT authentication\
  \ interceptor in GatewayNamespaceMode only validates tokens when the received gRPC message\
  \ is of type `discoveryv3.DeltaDiscoveryRequest` . If the message is a `discoveryv3.DiscoveryRequest`\
  \ — used by the State-of-the-World (SotW) xDS protocol — the type assertion fails, the validation\
  \ block is skipped entirely, and RecvMsg returns nil (success) without any authentication.\n\
  \nAny pod in the cluster that can reach the xDS server (port 18000) can use the SotW protocol\
  \ to bypass JWT authentication and access:\n\n* TLS private keys via StreamSecrets (SDS)\n\
  * All xDS resources via StreamAggregatedResources (ADS)\n* Backend endpoints via StreamClusters\
  \ / StreamEndpoints (CDS/EDS)\n* Routing rules via StreamRoutes / StreamListeners (RDS/LDS)\n\
  \n### Credits\n\nEnvoy Gateway thanks @dashingDragon and @Donjon-Cerberus for reporting this\
  \ issue."
