summary: "Seroval affected by Denial of Service via Deeply Nested Objects\nSerialization of\
  \ objects with extreme depth can **exceed the maximum call stack limit**.  \n\n**Mitigation**:\
  \  \n`Seroval` introduces a `depthLimit` parameter in serialization/deserialization methods.\
  \ **An error will be thrown if the depth limit is reached.**"
