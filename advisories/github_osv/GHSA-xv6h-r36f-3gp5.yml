advisory_id: GHSA-xv6h-r36f-3gp5
datasource_id: github_osv/GHSA-xv6h-r36f-3gp5
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/03/GHSA-xv6h-r36f-3gp5/GHSA-xv6h-r36f-3gp5.json
aliases:
  - CVE-2026-2575
summary: |
  Keycloak: Denial of Service due to excessive SAMLRequest decompression
  A flaw was found in Keycloak. An unauthenticated remote attacker can trigger an application level Denial of Service (DoS) by sending a highly compressed SAMLRequest through the SAML Redirect Binding. The server fails to enforce size limits during DEFLATE decompression, leading to an OutOfMemoryError (OOM) and subsequent process termination. This vulnerability allows an attacker to disrupt the availability of the service.
impacted_packages:
