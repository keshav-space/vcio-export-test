summary: "Smithy-RS: Allocation of resources without limits in the default aws-smithy-http-server\
  \ serve() path allows unauthenticated Slowloris denial of service\n## Summary\nSmithy-RS is\
  \ a Rust code generation and runtime framework that generates HTTP clients and servers from\
  \ Smithy interface definitions, powering the AWS SDK for Rust and custom service implementations.\
  \ An issue exists where, under certain circumstances, allocation of resources without limits\
  \ in the default aws-smithy-http-server serve() path allows unauthenticated Slowloris denial\
  \ of service. \n\n## Impact\nMissing connection and header-read timeouts and the absence of\
  \ a concurrent-connection cap in the default serve() path of Amazon aws-smithy-http-server\
  \ might allow remote attackers to cause a denial of service by opening many connections and\
  \ sending partial requests that are never completed, exhausting server sockets and tasks.\n\
  \nImpacted versions: aws-smithy-http-server <= 0.66.4\n\n## Patches\nThis issue has been addressed\
  \ in aws-smithy-http-server version 0.66.5. AWS recommends upgrading to the latest version\
  \ and ensuring any forked or derivative code is patched to incorporate the new fixes.\n\n\
  ## Workarounds\nThere is no workaround besides updating to the patched version.\n\n## Contact\n\
  If you have any questions or comments about this advisory, AWS asks that you contact AWS Security\
  \ via the [vulnerability reporting page](https://aws.amazon.com/security/vulnerability-reporting)\
  \ or directly via email to [aws-security@amazon.com](mailto:aws-security@amazon.com). Please\
  \ do not create a public GitHub issue."
