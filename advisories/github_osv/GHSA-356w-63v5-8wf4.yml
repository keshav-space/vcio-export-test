aliases:
  - CVE-2025-32395
summary: "Vite has an `server.fs.deny` bypass with an invalid `request-target`\n### Summary\n\
  The contents of arbitrary files can be returned to the browser if the dev server is running\
  \ on Node or Bun.\n\n### Impact\nOnly apps with the following conditions are affected.\n\n\
  - explicitly exposing the Vite dev server to the network (using --host or [server.host config\
  \ option](https://vitejs.dev/config/server-options.html#server-host))\n- running the Vite\
  \ dev server on runtimes that are not Deno (e.g. Node, Bun)\n\n### Details\n\n[HTTP 1.1 spec\
  \ (RFC 9112) does not allow `#` in `request-target`](https://datatracker.ietf.org/doc/html/rfc9112#section-3.2).\
  \ Although an attacker can send such a request. For those requests with an invalid `request-line`\
  \ (it includes `request-target`), the spec [recommends to reject them with 400 or 301](https://datatracker.ietf.org/doc/html/rfc9112#section-3.2-4).\
  \ The same can be said for HTTP 2 ([ref1](https://datatracker.ietf.org/doc/html/rfc9113#section-8.3.1-2.4.1),\
  \ [ref2](https://datatracker.ietf.org/doc/html/rfc9113#section-8.3.1-3), [ref3](https://datatracker.ietf.org/doc/html/rfc9113#section-8.1.1-3)).\n\
  \nOn Node and Bun, those requests are not rejected internally and is passed to the user land.\
  \ For those requests, the value of [`http.IncomingMessage.url`](https://nodejs.org/docs/latest-v22.x/api/http.html#messageurl)\
  \ contains `#`. Vite assumed `req.url` won't contain `#` when checking `server.fs.deny`, allowing\
  \ those kinds of requests to bypass the check.\n\nOn Deno, those requests are not rejected\
  \ internally and is passed to the user land as well. But for those requests, the value of\
  \ `http.IncomingMessage.url` did not contain `#`. \n\n### PoC\n```\nnpm create vite@latest\n\
  cd vite-project/\nnpm install\nnpm run dev\n```\nsend request to read `/etc/passwd`\n```\n\
  curl --request-target /@fs/Users/doggy/Desktop/vite-project/#/../../../../../etc/passwd http://127.0.0.1:5173\n\
  ```"
