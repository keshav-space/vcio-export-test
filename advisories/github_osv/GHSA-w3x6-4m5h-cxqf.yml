summary: "Microsoft Security Advisory CVE-2026-26171 – .NET Denial of Service Vulnerability\n\
  ## Executive Summary: \n\nMicrosoft is releasing this security advisory to provide information\
  \ about a vulnerability in System.Security.Cryptography.Xml. This advisory also provides guidance\
  \ on what developers can do to update their applications to remove this vulnerability.\n\n\
  A vulnerability exists in EncryptedXml class where uncontrolled resource consumption can give\
  \ an attacker to the ability to perform a Denial of Service attack.\n\n## Announcement\n\n\
  Announcement for this issue can be found at https://github.com/dotnet/announcements/issues/389\n\
  \n## CVSS Details\n\n- **Version:** 3.1\n- **Severity:** High\n- **Score:** 7.5\n- **Vector:**\
  \ 7.5: AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H E:U/RL:O/RC:C\n- **Weakness:** CWE-400 CWE-611:\
  \ Uncontrolled Resource Consumption Improper Restriction of XML External Entity Reference\n\
  \n## Affected Platforms\n\n- **Platforms:** All\n- **Architectures:** All\n\n## <a name=\"\
  affected-packages\"></a>Affected Packages\nThe vulnerability affects any Microsoft .NET project\
  \ if it uses any of affected packages versions listed below\n\n### <a name=\".NET 10\"></a>.NET\
  \ 10\nPackage name | Affected version | Patched version\n------------ | ---------------- |\
  \ -------------------------\n[System.Security.Cryptography.xml](https://www.nuget.org/packages/System.Security.Cryptography.Xml)\
  \               | >=10.0.0, <=10.0.5; | 10.0.6\n\n### <a name=\".NET 9\"></a>.NET 9\nPackage\
  \ name | Affected version | Patched version\n------------ | ---------------- | -------------------------\n\
  [System.Security.Cryptography.xml](https://www.nuget.org/packages/System.Security.Cryptography.Xml)\
  \               | >=9.0.0, <=9.0.14; | 9.0.15\n\n### <a name=\".NET 8\"></a>.NET 8\nPackage\
  \ name | Affected version | Patched version\n------------ | ---------------- | -------------------------\n\
  [System.Security.Cryptography.xml](https://www.nuget.org/packages/System.Security.Cryptography.Xml)\
  \               | >=8.0.0, <=8.0.2; | 8.0.3\n\n## Advisory FAQ\n\n### <a name=\"how-affected\"\
  ></a>How do I know if I am affected?\n\nIf using an affected package listed in [affected packages](#affected-packages),\
  \ you're exposed to the vulnerability.\n\n### <a name=\"how-fix\"></a>How do I fix the issue?\n\
  \nTo update the Using the System.Security.Cryptography.Xml NuGet package, use one of the following\
  \ methods:\n\nNuGet Package Manager UI in Visual Studio:\n- Open your project in Visual Studio.\n\
  - Right-click on your project in Solution Explorer and select \"Manage NuGet Packages...\"\
  \ or navigate to \"Project > Manage NuGet Packages\".\n- In the NuGet Package Manager window,\
  \ select the \"Updates\" tab. This tab lists packages with available updates from your configured\
  \ package sources.\n- Select the package(s) you wish to update. You can choose a specific\
  \ version from the dropdown or update to the latest available version.\n- Click the \"Update\"\
  \ button.\n\nUsing the NuGet Package Manager Console in Visual Studio:\n- Open your project\
  \ in Visual Studio.\n- Navigate to \"Tools > NuGet Package Manager > Package Manager Console\"\
  .\n- To update a specific package to its latest version, use the following Update-Package\
  \ command:\n\n```Update-Package -Id System.Security.Cryptography.xml```\n\nUsing the .NET\
  \ CLI (Command Line Interface):\n- Open a terminal or command prompt in your project's directory.\n\
  - To update a specific package to its latest version, use the following add package command:\n\
  \n```dotnet add package System.Security.Cryptography.Xml```\n\nOnce you have updated the nuget\
  \ package reference you must recompile and deploy your application. Additionally we recommend\
  \ you update your runtime and/or SDKs, but it is not necessary to patch the vulnerability.\n\
  \n## Other Information\n\n### Reporting Security Issues\n\nIf you have found a potential security\
  \ issue in a supported version of .NET, please report it to the Microsoft Security Response\
  \ Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new).\
  \ Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).\n\
  \nSecurity reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of\
  \ the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.\n\
  \n### Support\n\nYou can ask questions about this issue on GitHub in the .NET GitHub organization.\
  \ The main repos are located at https://github.com/dotnet/runtime. The Announcements repo\
  \ (https://github.com/dotnet/Announcements) will contain this bulletin as an issue and will\
  \ include a link to a discussion issue. You can ask questions in the linked discussion issue.\n\
  \n### Disclaimer\n\nThe information provided in this advisory is provided \"as is\" without\
  \ warranty of any kind. Microsoft disclaims all warranties, either express or implied, including\
  \ the warranties of merchantability and fitness for a particular purpose. In no event shall\
  \ Microsoft Corporation or its suppliers be liable for any damages whatsoever including direct,\
  \ indirect, incidental, consequential, loss of business profits or special damages, even if\
  \ Microsoft Corporation or its suppliers have been advised of the possibility of such damages.\
  \ Some states do not allow the exclusion or limitation of liability for consequential or incidental\
  \ damages so the foregoing limitation may not apply.\n\n### External Links\n\n[CVE-2026-26171](https://www.cve.org/CVERecord?id=CVE-2026-26171)\n\
  \n### Acknowledgements\n\nLudvig Pedersen\n\n### Revisions\n\nV1.0 (April 14, 2026): Advisory\
  \ published."
