summary: "Bleach: URI sanitization allows disallowed URI schemes with Unicode > U+00A0 in output\n\
  ### Impact\n\nA possible XSS bypass affects users calling `bleach.clean` with all of:\n\n\
  * `a` in the allowed tags\n* `href` in allowed attributes\n\nThe `bleach.clean` sanitizer\
  \ outputs URIs containing disallowed scheme patterns that it should be stripping. However,\
  \ because the inserted Unicode characters make the scheme invalid per RFC 3986, modern browsers\
  \ do not execute these as javascript: URIs. The practical security impact is limited to:\n\
  \n- Bleach's output contains URI values that violate the caller's protocol allowlist, breaking\
  \ the sanitizer's contract.\n- If a downstream system performs its own Unicode normalization\
  \ on bleach's output (stripping invisible characters before rendering), the javascript: scheme\
  \ could become valid. This is a non-standard processing chain but represents a theoretical\
  \ secondary risk.\n\nThis is not a direct XSS vulnerability.\n\nPython code example from reporter\
  \ with Bleach v6.3.0 and Python 3.13:\n\n```\nimport bleach\npayload1 = '<a href=\"javascript\\\
  u200b:alert(document.cookie)\">Click me</a>'\nresult1 = bleach.clean(payload1)\nprint(f\"\
  (ZWSP): {repr(result1)}\")\n```\n\nOutput:\n\n```\n(ZWSP): '<a href=\"javascript\\u200b:alert(document.cookie)\"\
  >Click me</a>'\n```\n\n### Patches\n\nUsers should upgrade to Bleach 6.4.0.\n\n### Workarounds\n\
  \nPre-process content removing non-ASCII characters from URI schemes before sanitizing with\
  \ `bleach.clean`.\n\nA strong[ Content-Security-Policy](https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP)\
  \ without unsafe-inline and unsafe-eval[ script-srcs](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src)\
  \ will also help mitigate the risk.\n\n### References\n\n* https://bugzilla.mozilla.org/show_bug.cgi?id=2023812\n\
  * RFC 3986, Section 3.1 (URI Scheme syntax): scheme characters are restricted to ALPHA *(\
  \ ALPHA / DIGIT / \"+\" / \"-\" / \".\" )\n\n### Reported by \n\nReported by codeant from\
  \ CodeAnt AI."
