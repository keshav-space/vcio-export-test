summary: "ZITADEL Users Can Self-Verify Email/Phone via API\n### Summary\n\nA vulnerability\
  \ in Zitadel's self-management capability allowed users to mark their email and phone as verified\
  \ without going through an actual verification process.\n\nWhile [`GHSA-282g-fhmx-xf54`](https://github.com/zitadel/zitadel/security/advisories/GHSA-282g-fhmx-xf54)\
  \ (CVE-2026-27946, \"Users Can Self-Verify Email/Phone via UpdateHumanUser API\") closed the\
  \ path that let any authenticated user mark an arbitrary email or phone as verified on their\
  \ own account by calling `UpdateHumanUser` with `email.is_verified: true`, additional paths\
  \ were discovered.\n\n### Impact \n\nZitadel provides an API for managing users. The API also\
  \ allows users to self-manage their own data including updating the email and phone.\n\nDue\
  \ to an improper permission check, the API allowed returning the verification code for the\
  \ email and phone to the own user.\nThis allows users to claim ownership of an email or phone\
  \ they do not control and potentially bypass email-based security policies.\n\nNote that when\
  \ changing another user's email or phone, regardless of the verification flag, the permissions\
  \ were correctly checked.\n\n### Affected Versions\n\nSystems running one of the following\
  \ versions are affected:\n- **4.x**: `4.0.0` through `4.15.0` (including RC versions)\n- **3.x**:\
  \ `3.0.0` through `3.4.10` (including RC versions)\n- **2.x**: `2.43.0` through `2.71.19`\n\
  \n### Patches\n\nThe vulnerability has been addressed in the latest releases. The patch resolves\
  \ the issue by requiring the correct permission in case the verification flag is provided\
  \ and only allows self-management of the email address, resp. phone number itself.\n\n4.x:\
  \ Upgrade to >=[4.15.1](https://github.com/zitadel/zitadel/releases/tag/v4.15.1)\n3.x: Update\
  \ to >=[3.4.11](https://github.com/zitadel/zitadel/releases/tag/v3.4.11)\n2.x: Update to >=[3.4.11](https://github.com/zitadel/zitadel/releases/tag/v3.4.11)\n\
  \n### Workarounds\n\nThe recommended solution is to upgrade to a patched version. If an upgrade\
  \ is not possible, an action (v2) could be used to prevent returning the verification code\
  \ to the own user.\n\n### Questions\n\nIf you have any questions or comments about this advisory,\
  \ please email us at [security@zitadel.com](mailto:security@zitadel.com)\n\n\n### Credits\n\
  \nThanks to [eddieran](https://github.com/eddieran) for reporting this vulnerability."
