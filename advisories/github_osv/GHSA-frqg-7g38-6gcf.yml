summary: "Improper escaping of command arguments on Windows leading to command injection\n###\
  \ Impact\nWindows users running Composer to install untrusted dependencies are affected and\
  \ should definitely upgrade for safety. Other OSs and WSL are not affected. \n\n### Patches\n\
  1.10.23 and 2.1.9 fix the issue\n\n### Workarounds\nNone"
