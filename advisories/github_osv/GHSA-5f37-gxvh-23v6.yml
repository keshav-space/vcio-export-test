exploits:
  - description: PHPMailer contains a command injection vulnerability because it fails to sanitize
      user-supplied input. Specifically, this issue affects the 'mail()' function of 'class.phpmailer.php'
      script. An attacker can exploit this issue to execute arbitrary code within the context
      of the application. Failed exploit attempts will result in a denial-of-service condition.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-07-28'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://github.com/PHPMailer/PHPMailer/releases/tag/v5.2.18 ; https://github.com/advisories/GHSA-5f37-gxvh-23v6
      ; https://nvd.nist.gov/vuln/detail/CVE-2016-10033'
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id:
  - description: |
      This module exploits a command injection vulnerability in WordPress
                version 4.6 with Exim as an MTA via a spoofed Host header to PHPMailer,
                a mail-sending library that is bundled with WordPress.

                A valid WordPress username is required to exploit the vulnerability.
                Additionally, due to the altered Host header, exploitation is limited to
                the default virtual host, assuming the header isn't mangled in transit.

                If the target is running Apache 2.2.32 or 2.4.24 and later, the server
                may have HttpProtocolOptions set to Strict, preventing a Host header
                containing parens from passing through, making exploitation unlikely.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2017-05-03'
