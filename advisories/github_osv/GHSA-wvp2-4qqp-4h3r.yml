summary: "Ghost: Private IP filtering bypass to make server-side requests to internal services\n\
  ### Impact\n\nWhen making an external request, it is possible to bypass the IP filter that\
  \ ensures the request isn't going to an internal service using an IPv6 literal which maps\
  \ to a private IPv4 address.\n\n### Vulnerable versions\n\nThis vulnerability is present in\
  \ Ghost from v6.0.9 up to v6.21.0.\n\n### Patches\n\nv6.21.1 contains a fix for this issue.\n\
  \n### How to update\n\nFor self-hosters using Docker, find [Docker's official Ghost image\
  \ here](https://hub.docker.com/_/ghost). Updating a Docker-based Ghost instance [is documented\
  \ here](https://docs.ghost.org/install/docker#updating-ghost). \n\nIf your Ghost is a Ghost-CLI\
  \ install see our documentation on [updating it to the latest version here](https://docs.ghost.org/update).\
  \ \n\n### References\n\nGhost thanks [l3tchupkt](http://github.com/l3tchupkt) for disclosing\
  \ this vulnerability responsibly.\n\n### For more information\n\nIf you have any questions\
  \ or comments about this advisory, email us at [security@ghost.org](mailto:security@ghost.org)."
