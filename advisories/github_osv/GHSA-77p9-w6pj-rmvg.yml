summary: "Apache Continuum vulnerable to Command Injection through Installations REST API\n\
  ***UNSUPPORTED WHEN ASSIGNED*** \n\nImproper Neutralization of Special Elements used in a\
  \ Command ('Command Injection') vulnerability in Apache Continuum.\n\nThis issue affects Apache\
  \ Continuum: all versions.\n\nAttackers with access to the Installations REST API can use\
  \ this to invoke arbitrary commands on the server.\n\nAs this project is retired, we do not\
  \ plan to release a version that fixes this issue. Users are recommended to find an alternative\
  \ or restrict access to the instance to trusted users.\n\nNOTE: This vulnerability only affects\
  \ products that are no longer supported by the maintainer."
