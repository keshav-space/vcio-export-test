aliases:
  - CVE-2022-42114
summary: |
  Liferay Portal and Liferay DXP Vulnerable to XSS via the Role Module
  A Cross-site scripting (XSS) vulnerability in the Role module's edit role assignees page in Liferay Roles Admin Web
  before 5.0.48 from Liferay Portal (7.4.0 through 7.4.3.36), and Liferay DXP 7.4 before update 37 allows remote attackers to inject arbitrary web script or HTML.
