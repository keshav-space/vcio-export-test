summary: "Trix Editor Arbitrary Code Execution Vulnerability\nThe Trix editor, versions prior\
  \ to 2.1.1, is vulnerable to arbitrary code execution when copying and pasting content from\
  \ the web or other documents with markup into the editor. The vulnerability stems from improper\
  \ sanitization of pasted content, allowing an attacker to embed malicious scripts which are\
  \ executed within the context of the application.\n\n**Vulnerable Versions**: \n\n- 1.x series\
  \ up to and including 1.3.1\n- 2.x series up to and including 2.1.0\n\n**Fixed Versions**:\
  \ \n\n- v1.3.2\n- v2.1.1\n\n**Vector**:\n\n- **Bug 1**: When copying content manipulated by\
  \ a script, such as:\n\n```js\ndocument.addEventListener('copy', function(e){\n  e.clipboardData.setData('text/html',\
  \ '<div><noscript><div class=\"123</noscript>456<img src=1 onerror=alert(1)//\"></div></noscript></div>');\n\
  \  e.preventDefault();\n});\n```\n\nand pasting into the Trix editor, the script within the\
  \ content is executed.\n\n- **Bug 2**: Similar execution occurs with content structured as:\n\
  \n```js\ndocument.write(`copy<div data-trix-attachment=\"{&quot;contentType&quot;:&quot;text/html&quot;,&quot;content&quot;:&quot;&lt;img\
  \ src=1 onerror=alert(101)&gt;HELLO123&quot;}\"></div>me`);\n```\n\n### Impact:\nAn attacker\
  \ could exploit these vulnerabilities to execute arbitrary JavaScript code within the context\
  \ of the user's session, potentially leading to unauthorized actions being performed or sensitive\
  \ information being disclosed.\n\n### Remediation:\n\n**Update Recommendation**: Users should\
  \ upgrade to Trix editor version 2.1.1 or later, which incorporates proper sanitization of\
  \ input from copied content.\n\n**CSP Enhancement**: Additionally, enhancing the Content Security\
  \ Policy (CSP) to disallow inline scripts can significantly mitigate the risk of such vulnerabilities.\
  \ Set CSP policies such as script-src 'self' to ensure that only scripts hosted on the same\
  \ origin are executed, and explicitly prohibit inline scripts using script-src-elem.\n\n###\
  \ References:\n  - https://github.com/basecamp/trix/releases/tag/v2.1.1\n  - https://github.com/basecamp/trix/pull/1147\n\
  \  - https://github.com/basecamp/trix/pull/1149\n  - https://github.com/basecamp/trix/pull/1153\n\
  \n**Credit**: These issues were reported by security researchers [loknop](https://hackerone.com/loknop)\
  \ and [pinpie](https://hackerone.com/pinpie)."
