aliases:
  - CVE-2026-54018
summary: "Open WebUI: SSRF Protection Bypass in Playwright Web Loader via HTTP Redirects\n###\
  \ Summary\nThe SafePlaywrightURLLoader implements a validate_url function to prevent SSRF\
  \ attacks by checking the IP address of the user-provided URL. However, this validation is\
  \ performed only on the initial URL.\n\nSince Playwright automatically follows HTTP redirects\
  \ (301/302) by default, an attacker can bypass the validation by providing a safe URL that\
  \ redirects to a restricted internal network address (e.g., localhost, Docker container network,\
  \ or Cloud Metadata).\n\nThis allows the application to access internal services despite ENABLE_RAG_LOCAL_WEB_FETCH\
  \ being set to False\n\n### Details\nRoot Cause\n\nThe application validates the initial user-provided\
  \ URL using self._safe_process_url_sync(url). This correctly resolves the domain and ensures\
  \ it does not point to a private IP.\n\nThe application then calls page.goto(url). By default,\
  \ Playwright automatically follows HTTP redirects (301/302).\n\nThe Bypass: If the destination\
  \ server returns a redirect to an internal IP (e.g., 127.0.0.1 or 169.254.169.254), the browser\
  \ follows it without re-validating the new destination. The initial validation is bypassed\
  \ because it only checked the first URL, not the entire redirect chain.\n\n```python\nfor\
  \ url in self.urls:\n    try:\n        self._safe_process_url_sync(url)  \n        page =\
  \ browser.new_page()\n        response = page.goto(url, timeout=self.playwright_timeout) \
  \ #this\n        if response is None:\n            raise ValueError(...)\n        text = self.evaluator.evaluate(page,\
  \ browser, response)\n```\n\n### PoC\n(This PoC uses Docker to easily demonstrate internal\
  \ network access (accessing a container by service name). However, the vulnerability is NOT\
  \ tied to Docker.)\n\n1. Ensure the Open WebUI is configured with the following environment\
  \ variables. The vulnerability is specific to the Playwright engine.\n2. ENABLE_RAG_LOCAL_WEB_FETCH=False\
  \ (Default)\n3. RAG_WEB_LOADER_ENGINE=playwright\n4. Setup and run attack server\n5. In Open\
  \ WebUI, use the \"Web Search\" or \"URL Loader\" feature.\n6. Input the attacker's URL (e.g.,\
  \ http://attacker-ip/).\n\n```python\n# attack_server.py\nfrom flask import Flask, redirect\n\
  app = Flask(__name__)\n\n@app.route('/')\ndef attack():\n    # Redirect to the Open WebUI\
  \ container's internal port\n    return redirect(\"http://open-webui:8080/api/version\", code=302)\n\
  \nif __name__ == '__main__':\n    app.run(host='0.0.0.0', port=80)\n```\n<img width=\"580\"\
  \ height=\"192\" alt=\"image\" src=\"https://github.com/user-attachments/assets/4600dbb5-a81d-4e58-b787-afe04fe59d6e\"\
  \ />\n\nThe Playwright browser follows the redirect to the internal address (http://open-webui:8080/api/version)\n\
  \n### Impact\n+ Cloud Environments: Access to Instance Metadata Service (IMDS) to steal cloud\
  \ credentials.\n+ Intranet/On-Premise: Scanning internal networks and accessing unauthenticated\
  \ internal tools.\n+ Container Environments: Accessing other containers within the same network.\n\
  \n### Recommended Patch\nimplement a request interceptor using Playwright's page.route. This\
  \ ensures all requests, including redirects, are validated before connection.\n\napply the\
  \ following logic to both lazy_load and alazy_load methods:\n\n```python\n# async context\n\
  async def intercept_route(route):\n    try:\n        await run_in_threadpool(validate_url,\
  \ route.request.url)\n        await route.continue_()\n    except Exception:\n        await\
  \ route.abort()\n\nawait page.route(\"**/*\", intercept_route)\nresponse = await page.goto(url,\
  \ timeout=self.playwright_timeout)\n```"
