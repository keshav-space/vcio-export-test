summary: "OpenTofu: Possible arbitrary file read during certain git operations via a maliciously\
  \ crafted URL\n### Impact\nPossible data exposure.\n#### Summary\nWhile downloading packages\
  \ from a maliciously crafted URL, some git operations against that URL could allow arbitrary\
  \ file read.\nThis might allow disclosure of confidential information.\n\n#### Details\nOpenTofu\
  \ relies on [go-getter](https://github.com/hashicorp/go-getter) for downloading packages like\
  \ providers and modules. While doing so from a maliciously crafted URL, the operator could\
  \ be affected by confidential information disclosure. \n\nThe go-getter maintainers have recently\
  \ published [CVE-2026-4660](https://github.com/advisories/GHSA-92mm-2pjq-r785) for this library\
  \ which indirectly affects OpenTofu's behavior.\n\nTypical use of OpenTofu already requires\
  \ caution in selection of URLs that are used to download modules and providers.\n\n### Patches\n\
  OpenTofu v1.11.10 and v1.12.3 address these vulnerabilities by upgrading to the [hashicorp/go-getter@v1.8.6](https://github.com/hashicorp/go-getter/releases/tag/v1.8.6)\
  \ that fixes this vulnerability.\n\nThe OpenTofu v1.10 series is also impacted by these vulnerabilities.\
  \ However, that series is built with an older version of the library and upgrading it risks\
  \ breaking the whole v1.10 series. \nFor those using OpenTofu v1.10 releases, we recommend\
  \ planning an upgrade to OpenTofu v1.11.10 in the near future.\n\n### References\n* [Initial\
  \ report](https://github.com/opentofu/opentofu/pull/4288)\n* [CVE-2026-4660](https://github.com/advisories/GHSA-92mm-2pjq-r785)\n\
  * [OpenTofu v1.12 patch](https://github.com/opentofu/opentofu/pull/4293)\n* [OpenTofu v1.11\
  \ patch](https://github.com/opentofu/opentofu/pull/4292)\n* [Patched v1.12.3 version](https://github.com/opentofu/opentofu/releases/tag/v1.12.3)\n\
  * [Patched v1.11.10 version](https://github.com/opentofu/opentofu/releases/tag/v1.11.10)"
