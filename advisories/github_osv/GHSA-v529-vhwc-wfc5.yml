summary: "OpenC3 COSMOS has SQL Injection in QuestDB Time-Series Database\n**Vulnerability Type:\
  \ CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')\n\
  Attack type: Authenticated remote\nImpact: Telemetry data disclosure and deletion\nAffected\
  \ components: openc3-tsdb (QuestDB)**\n\nA SQL injection vulnerability exists in the Time-Series\
  \ Database (TSDB) component of COSMOS. The `tsdb_lookup` function in the `cvt_model.rb` file\
  \ directly places user-supplied input into a SQL query without sanitizing the input. As a\
  \ result, a user can break out of the initial SQL statement and execute arbitrary SQL commands,\
  \ including deleting data. \n \n<img width=\"940\" height=\"719\" alt=\"image\" src=\"https://github.com/user-attachments/assets/2c2dd294-6192-49d3-b670-fd7b82c05be0\"\
  \ />\n\nFigure 1: Source code vulnerable to SQL injection\nAdditionally, the `get_tlm_values`\
  \ RPC endpoint only requires “tlm” permissions, allowing any user with the Admin, Operator,\
  \ Viewer, or Runner roles to send a request to the TSDB. This permission is defined in roles-permissions.md\
  \ to allow for the user to view telemetry data, but this vulnerability also allows them to\
  \ delete data and tables.\n \n<img width=\"940\" height=\"410\" alt=\"image\" src=\"https://github.com/user-attachments/assets/40be7e8d-51f9-442d-bbd7-77c8488a2f78\"\
  \ />\n\nFigure 2: Source code showing the required permissions for the `get_tlm_values` endpoint\n\
  Sending a normal request to the endpoint brings back a single array of values for the parameter:\n\
  \ \n<img width=\"944\" height=\"481\" alt=\"image\" src=\"https://github.com/user-attachments/assets/23678f17-6bdf-41c1-81bc-ace5a8daa7e5\"\
  \ />\n\nFigure 3: A normal request to the `get_tlm_values` endpoint\nHowever, sending a specially\
  \ crafted request within the start_time variable brings back all the data in the database:\n\
  \ \n<img width=\"944\" height=\"432\" alt=\"image\" src=\"https://github.com/user-attachments/assets/bd5ecc87-ba9c-43f0-b196-91062b9c395a\"\
  \ />\n\nFigure 4: The request and response after sending the SQL injection payload\nThis payload\
  \ can be modified to executes SQL commands in the TSDB.\n \n<img width=\"944\" height=\"425\"\
  \ alt=\"image\" src=\"https://github.com/user-attachments/assets/70c3c88e-9ed6-4542-bfb4-e77abb002c15\"\
  \ />\n\nFigure 5: SQL injection used to execute arbitrary SQL command\nThe user can then delete\
  \ all the historical data in the database:\n \n<img width=\"944\" height=\"496\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/f2dc1fa6-5fe0-4232-867a-a65776f108ee\"\
  \ />\n\nFigure 6: Example payload dropping the tables\n###\tSteps to Reproduce\n1.\tCapture\
  \ a JSON-RPC request to the `get_tlm_values` endpoint.\n2.\tAdd the `start_time` key to the\
  \ request body and place the following in the value:\n```sql\n‘ OR 1=1 --\n```\n3.\tRetrieve\
  \ all database data.\n###\tRecommendations\n•\tSanitize all user-supplied input before executing\
  \ it\n•\tUse prepared statements with parameterized queries when executing SQL statements"
