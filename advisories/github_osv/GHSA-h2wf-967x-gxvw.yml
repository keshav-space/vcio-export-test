aliases:
  - CVE-2026-62944
summary: "MantisBT: Stored XSS in print_all_bug_page_word.php\nA missing output encoding call\
  \ in print_all_bug_page_word.php allows any authenticated user to inject arbitrary HTML into\
  \ an IMG tag's *alt* attribute via an image attachment with a crafted filename such as `probe.\"\
  \ onload=\"alert(1)`. \n\nWhen any user views the HTML export page (print_all_bug_page_word.php?type_page=html&export=1),\
  \ the rendered IMG tag becomes `<img src=\"...\" alt=\"\" onload=\"alert(1)\" />`, breaking\
  \ out of the alt attribute. \n\n### Impact\nCross-site scripting.\n\nImpact is limited by\
  \ MantisBT's Content Security Policy.\n\n### Patches\n- https://github.com/mantisbt/mantisbt/commit/bdd0e364f62759de272dfd4c89b4f51d27be9daa\n\
  \n### Workarounds\nNone\n\n### Resources\n- https://mantisbt.org/bugs/view.php?id=37234\n\n\
  ### Credits\nMantisBT thanks the [Dracosec Research Limited](https://dracosec.tech/) team\
  \ (Chris Chan, Krecendo Hui, William Lam) for discovering and responsibly reporting the issue."
