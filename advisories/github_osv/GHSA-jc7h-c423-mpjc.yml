summary: "Apache Shiro vulnerable to path traversal\nApache Shiro before 1.130 or 2.0.0-alpha-4,\
  \ may be susceptible to a path traversal attack that results in an authentication bypass when\
  \ used together with path rewriting \n\nMitigation: Update to Apache Shiro 1.13.0+ or 2.0.0-alpha-4+,\
  \ or ensure `blockSemicolon` is enabled (this is the default)."
