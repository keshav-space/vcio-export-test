  - CVE-2021-29525
summary: "Division by 0 in `Conv2DBackpropInput`\n### Impact\nAn attacker can trigger a division\
  \ by 0 in `tf.raw_ops.Conv2DBackpropInput`:\n\n```python\nimport tensorflow as tf\n\ninput_tensor\
  \ = tf.constant([52, 1, 1, 5], shape=[4], dtype=tf.int32)\nfilter_tensor = tf.constant([],\
  \ shape=[0, 1, 5, 0], dtype=tf.float32)\nout_backprop = tf.constant([], shape=[52, 1, 1, 0],\
  \ dtype=tf.float32)\n\ntf.raw_ops.Conv2DBackpropInput(input_sizes=input_tensor, filter=filter_tensor,\n\
  \                               out_backprop=out_backprop, strides=[1, 1, 1, 1],\n       \
  \                        use_cudnn_on_gpu=True, padding='SAME',\n                        \
  \       explicit_paddings=[], data_format='NHWC',\n                               dilations=[1,\
  \ 1, 1, 1])\n```                 \n                    \nThis is because the [implementation](https://github.com/tensorflow/tensorflow/blob/b40060c9f697b044e3107917c797ba052f4506ab/tensorflow/core/kernels/conv_grad_input_ops.h#L625-L655)\
  \ does a division by a quantity that is controlled by the caller:\n\n```cc \n  const size_t\
  \ size_A = output_image_size * dims.out_depth; \n  const size_t size_B = filter_total_size\
  \ * dims.out_depth;\n  const size_t size_C = output_image_size * filter_total_size;\n  const\
  \ size_t work_unit_size = size_A + size_B + size_C;\n  ...\n  const size_t shard_size =\n\
  \      use_parallel_contraction ? 1 :\n      (target_working_set_size + work_unit_size - 1)\
  \ / work_unit_size;\n```\n\n### Patches\nWe have patched the issue in GitHub commit [2be2cdf3a123e231b16f766aa0e27d56b4606535](https://github.com/tensorflow/tensorflow/commit/2be2cdf3a123e231b16f766aa0e27d56b4606535).\n\
  \nThe fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow\
  \ 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected\
  \ and still in supported range.\n\n### For more information\nPlease consult [our security\
  \ guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md) for more information\
  \ regarding the security model and how to contact us with issues and questions.\n\n### Attribution\n\
  This vulnerability has been reported by Yakun Zhang and Ying Wang of Baidu X-Team."
