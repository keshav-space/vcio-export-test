aliases:
  - CVE-2022-21729
summary: "Overflow and uncaught divide by zero in Tensorflow\n### Impact \nThe [implementation\
  \ of `UnravelIndex`](https://github.com/tensorflow/tensorflow/blob/5100e359aef5c8021f2e71c7b986420b85ce7b3d/tensorflow/core/kernels/unravel_index_op.cc#L36-L135)\
  \ is vulnerable to a division by zero caused by an integer overflow bug:\n\n```python\nimport\
  \ tensorflow as tf\n\ntf.raw_ops.UnravelIndex(indices=-0x100000,dims=[0x100000,0x100000])\n\
  ```\n\n### Patches\nWe have patched the issue in GitHub commit [58b34c6c8250983948b5a781b426f6aa01fd47af](https://github.com/tensorflow/tensorflow/commit/58b34c6c8250983948b5a781b426f6aa01fd47af).\n\
  \    \nThe fix will be included in TensorFlow 2.8.0. We will also cherrypick this commit on\
  \ TensorFlow 2.7.1, TensorFlow 2.6.3, and TensorFlow 2.5.3, as these are also affected and\
  \ still in supported range.\n    \n### For more information\nPlease consult [our security\
  \ guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md) for more information\
  \ regarding the security model and how to contact us with issues and questions.\n    \n###\
  \ Attribution\nThis vulnerability has been reported by Yu Tian of Qihoo 360 AIVul Team."
