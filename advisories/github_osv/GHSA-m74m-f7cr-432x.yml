summary: "pyLoad: Server-Side Request Forgery via Download Link Submission Enables Cloud Metadata\
  \ Exfiltration\n## Summary\n\nPyLoad's download engine accepts arbitrary URLs without validation,\
  \ enabling Server-Side Request Forgery (SSRF) attacks. An authenticated attacker can exploit\
  \ this to access internal network services and exfiltrate cloud provider metadata. On DigitalOcean\
  \ droplets, this exposes sensitive infrastructure data including droplet ID, network configuration,\
  \ region, authentication keys, and SSH keys configured in user-data/cloud-init.\n\n## Details\n\
  \nThe vulnerability exists in PyLoad's download package functionality (`/api/addPackage` endpoint),\
  \ which directly passes user-supplied URLs to the download engine without validating the destination.\
  \ The affected code in `src/pyload/webui/app/blueprints/api_blueprint.py`:\n\n```python\n\
  @bp.route(\"/addPackage\", methods=[\"POST\"], endpoint=\"add_package\")\n@login_required\n\
  def add_package():\n    name = flask.request.form[\"add_name\"]\n    links = flask.request.form[\"\
  add_links\"].split(\"\\n\")\n    # ... validation omitted ...\n    api.add_package(name, links,\
  \ dest)  # No URL validation\n```\n\nThe download engine in `src/pyload/core/managers/download.py`\
  \ accepts any URL scheme and initiates HTTP requests to arbitrary destinations, including\
  \ internal network addresses and cloud metadata endpoints.\n\n## Proof of Concept\n\n**Live\
  \ Demo Instance:** http://143.244.141.81:8000  \n**Credentials:** `pyload` / `pyload`\n\n\
  - Login into the pyload application\n- Navigate to package tab and enter the package name\
  \ and fill the Link section with the following URL\n\n```\nhttp://169.254.169.254/metadata/v1.json\n\
  ```\n\n<img width=\"1851\" height=\"786\" alt=\"image\" src=\"https://github.com/user-attachments/assets/18e7aedf-7663-4a57-8f3e-5200be2c958e\"\
  \ />\n\n- Now navigate to Files section and download the link.\n\n<img width=\"1429\" height=\"\
  870\" alt=\"image\" src=\"https://github.com/user-attachments/assets/9b8b9cd6-afb7-461c-b058-a3cc4f26e2e6\"\
  \ />\n\n- It was observed that we are able to Read the Digital Ocean Metadata\n\n<img width=\"\
  1872\" height=\"837\" alt=\"image\" src=\"https://github.com/user-attachments/assets/d30d2d74-53e9-46f8-8206-894a275ac831\"\
  \ />\n\nThe downloaded `v1.json` file contains sensitive cloud infrastructure data:\n- **Droplet\
  \ ID**: Unique identifier for the instance\n- **Network Configuration**: Public/private IP\
  \ addresses, VPC topology\n- **Authentication Keys**: Cloud provider auth tokens\n- **SSH\
  \ Keys**: Public keys configured in droplet metadata\n- **Region and Datacenter**: Infrastructure\
  \ location\n\n## Impact\n\n**Vulnerability Type:** Server-Side Request Forgery (SSRF)  \n\
  **CVSS Score:** 7.7 - 9.1 (High to Critical, depending on cloud deployment)\n\n### Affected\
  \ Systems\n- All PyLoad installations (version 0.5.0 and potentially earlier)\n- **Critical\
  \ Impact** on cloud deployments (AWS EC2, DigitalOcean, Google Cloud, Azure) where metadata\
  \ contains:\n  - IAM credentials (AWS)\n  - SSH private keys (configured in user-data)\n \
  \ - API tokens and secrets\n  - Database credentials stored in cloud-init\n\n### Attack Requirements\n\
  - Valid PyLoad user account (any role - ADMIN or USER)\n- Network connectivity to PyLoad instance\n\
  \n### Security Impact\n1. **Cloud Metadata Theft**: Complete exfiltration of instance metadata\n\
  2. **Lateral Movement**: Discovery and enumeration of internal network services\n3. **Credential\
  \ Exposure**: Theft of cloud IAM credentials, SSH keys, API tokens\n4. **Infrastructure Mapping**:\
  \ Network topology, IP addressing, service discovery\n\n## Remediation\n\nImplement URL validation\
  \ in the download engine:\n1. Whitelist allowed URL schemes (http/https only)\n2. Block requests\
  \ to private IP ranges (RFC 1918, link-local addresses)\n3. Block cloud metadata endpoints\
  \ (169.254.169.254, metadata.google.internal, etc.)\n4. Implement request destination validation\
  \ before initiating downloads"
