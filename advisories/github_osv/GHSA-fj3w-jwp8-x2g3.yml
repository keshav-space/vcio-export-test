summary: "fast-xml-parser has stack overflow in XMLBuilder with preserveOrder\n### Impact\n\
  Application crashes with stack overflow when user use XML builder with `prserveOrder:true`\
  \ for following or similar input \n\n```\n[{\n    'foo': [\n        { 'bar': [{ '@_V': 'baz'\
  \ }] }\n    ]\n}]\n```\n\nCause: `arrToStr` was not validating if the input is an array or\
  \ a string and treating all non-array values as text content.\n_What kind of vulnerability\
  \ is it? Who is impacted?_\n\n### Patches\nYes in 5.3.8\n\n### Workarounds\nUse XML builder\
  \ with `preserveOrder:false` or check the input data before passing to builder.\n\n### References\n\
  [_Are there any links users can visit to find out more?_](https://github.com/NaturalIntelligence/fast-xml-parser/pull/791)"
