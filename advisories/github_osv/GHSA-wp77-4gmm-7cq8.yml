summary: "Incorrect validation of `SaveV2` inputs\n### Impact\nThe code for `tf.raw_ops.SaveV2`\
  \ does not properly validate the inputs and an attacker can trigger a null pointer dereference:\n\
  \n```python\nimport tensorflow as tf\n\ntf.raw_ops.SaveV2(\n  prefix=['tensorflow'],\n  tensor_name=['v'],\n\
  \  shape_and_slices=[],\n  tensors=[1,2,3])\n```\n  \nThe [implementation](https://github.com/tensorflow/tensorflow/blob/8d72537c6abf5a44103b57b9c2e22c14f5f49698/tensorflow/core/kernels/save_restore_v2_ops.cc)\
  \ uses `ValidateInputs` to  check that the input arguments are valid. This validation would\
  \ have caught the illegal state represented by the reproducer  above.\n\nHowever, the validation\
  \ uses `OP_REQUIRES` which translates to setting the `Status` object of the current `OpKernelContext`\
  \ to an error status, followed by an empty `return` statement which just terminates the execution\
  \ of the function it is present in. However, this does not mean that the kernel execution\
  \ is finalized: instead, execution continues from the next line in `Compute` that follows\
  \ the call to `ValidateInputs`. This is equivalent to lacking the validation.\n      \n###\
  \ Patches\nWe have patched the issue in GitHub commit [9728c60e136912a12d99ca56e106b7cce7af5986](https://github.com/tensorflow/tensorflow/commit/9728c60e136912a12d99ca56e106b7cce7af5986).\n\
  \nThe fix will be included in TensorFlow 2.6.0. We will also cherrypick this commit on TensorFlow\
  \ 2.5.1, TensorFlow 2.4.3, and TensorFlow 2.3.4, as these are also affected and still in supported\
  \ range.                                                                                 \
  \                                                                                        \
  \                                                                      \n\n### For more information\n\
  Please consult [our security guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md)\
  \ for more information regarding the security model and how to contact us with issues and\
  \ questions.\n\n### Attribution\nThis vulnerability has been reported by members of the Aivul\
  \ Team from Qihoo 360."
