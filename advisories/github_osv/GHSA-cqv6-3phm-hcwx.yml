  - CVE-2021-41221
summary: "Access to invalid memory during shape inference in `Cudnn*` ops\n### Impact\nThe [shape\
  \ inference code](https://github.com/tensorflow/tensorflow/blob/9ff27787893f76d6971dcd1552eb5270d254f31b/tensorflow/core/ops/cudnn_rnn_ops.cc)\
  \ for the `Cudnn*` operations in TensorFlow can be tricked into accessing invalid memory,\
  \ via a heap buffer overflow:\n\n```python\nimport tensorflow as tf\n\n@tf.function\ndef func():\n\
  \  return tf.raw_ops.CudnnRNNV3(\n    input=[0.1, 0.1],\n    input_h=[0.5],\n    input_c=[0.1,\
  \ 0.1, 0.1], \n    params=[0.5, 0.5],\n    sequence_lengths=[-1, 0, 1])\n  \nfunc() \n```\n\
  \  \nThis occurs because the ranks of the `input`, `input_h` and `input_c` parameters are\
  \ not validated, but code assumes they have certain values:\n\n```cc\nauto input_shape = c->input(0);\n\
  auto input_h_shape = c->input(1);\nauto seq_length = c->Dim(input_shape, 0);\nauto batch_size\
  \ = c->Dim(input_shape, 1);  // assumes rank >= 2\nauto num_units = c->Dim(input_h_shape,\
  \ 2); // assumes rank >= 3\n``` \n\n### Patches\nWe have patched the issue in GitHub commit\
  \ [af5fcebb37c8b5d71c237f4e59c6477015c78ce6](https://github.com/tensorflow/tensorflow/commit/af5fcebb37c8b5d71c237f4e59c6477015c78ce6).\n\
  \nThe fix will be included in TensorFlow 2.7.0. We will also cherrypick this commit on TensorFlow\
  \ 2.6.1, TensorFlow 2.5.2, and TensorFlow 2.4.4, as these are also affected and still in supported\
  \ range.\n\n### For more information\nPlease consult [our security guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md)\
  \ for more information regarding the security model and how to contact us with issues and\
  \ questions.\n\n### Attribution\nThis vulnerability has been reported by members of the Aivul\
  \ Team from Qihoo 360."
