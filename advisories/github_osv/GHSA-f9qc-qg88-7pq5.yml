summary: "Buffa Vulnerable to Memory Exhaustion Denial of Service in decode_unknown_field via\
  \ Unbounded Allocation\nThe `decode_unknown_field` function in buffa's protobuf decoder allocated\
  \ heap memory in proportion to untrusted input (unknown fields in the serialized protobuf)\
  \ without enforcing an allocation budget. Any message decoded from untrusted input using code\
  \ generated with `preserve_unknown_fields=true` (the default) was affected. A small, well-formed\
  \ payload of nested unknown fields inside a StartGroup could trigger roughly 22× memory amplification\
  \ (e.g., a 64 MiB input forcing ~1.4 GB of heap allocation), and length-delimited unknown\
  \ fields could be sized arbitrarily, enabling an unauthenticated attacker to crash a process\
  \ via memory exhaustion. This was reachable from the default decode APIs, since the top-level\
  \ message size cap did not account for in-decode amplification. \n\nFor users of connectrpc\
  \ - the DEFAULT_MAX_MESSAGE_SIZE for connectrpc is 4MiB, which limits amplification in the\
  \ worst case to ~88 MiB of memory. A flood of concurrent requests with this pattern could\
  \ still be used to exhaust available memory, however.\n\nUsers are advised to either set `preserve_unknown_fields=false`\
  \ on their current generated code, or upgrade to 0.8.0, which enforces per-message unknown\
  \ field count limits - this is configurable, with a default of 1 million unknown fields, or\
  \ ~40MiB of allocation overhead per message.\nUsers are advised to update to the latest version,\
  \ which enforces per-message unknown field count limits.\n\nThank you to @p80n-sec for reporting\
  \ this issue."
