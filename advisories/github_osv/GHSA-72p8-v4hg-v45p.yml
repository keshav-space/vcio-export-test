summary: "Weak private key generation in SSH.NET\nDuring an **X25519** key exchange, the client’s\
  \ private is generated with [**System.Random**](https://docs.microsoft.com/en-us/dotnet/api/system.random):\n\
  \n```cs\nvar rnd = new Random();\n_privateKey = new byte[MontgomeryCurve25519.PrivateKeySizeInBytes];\n\
  rnd.NextBytes(_privateKey);\n```\n\nSource: [KeyExchangeECCurve25519.cs](https://github.com/sshnet/SSH.NET/blob/bc99ada7da3f05f50d9379f2644941d91d5bf05a/src/Renci.SshNet/Security/KeyExchangeECCurve25519.cs#L51)\
  \  \nSource commit: https://github.com/sshnet/SSH.NET/commit/b58a11c0da55da1f5bad46faad2e9b71b7cb35b3\n\
  \n[**System.Random**](https://docs.microsoft.com/en-us/dotnet/api/system.random) is not a\
  \ cryptographically secure random number generator, it must therefore not be used for cryptographic\
  \ purposes.\n\n### Impact\nWhen establishing an SSH connection to a remote host, during the\
  \ X25519 key exchange, the private key is generated with\na weak random number generator whose\
  \ seed can be bruteforced. This allows an attacker able to eavesdrop the\ncommunications to\
  \ decrypt them.\n\n### Workarounds\nTo ensure you're not affected by this vulnerability, you\
  \ can disable support for `curve25519-sha256` and `curve25519-sha256@libssh.org` key exchange\
  \ algorithms by invoking the following method before a connection is established:\n```cs\n\
  private static void RemoveUnsecureKEX(BaseClient client)\n{\n    client.ConnectionInfo.KeyExchangeAlgorithms.Remove(\"\
  curve25519-sha256\");\n    client.ConnectionInfo.KeyExchangeAlgorithms.Remove(\"curve25519-sha256@libssh.org\"\
  );\n}\n```\n\n### Thanks\n\nThis issue was initially reported by **Siemens AG, Digital Industries**,\
  \ shortly followed by @yaumn-synacktiv."
