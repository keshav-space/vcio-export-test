  - CVE-2026-54003
summary: "Kirby: External Initialization of the Panel on reverse proxy setups with the `Forwarded`\
  \ header\n### TL;DR\n\nThis vulnerability affects Kirby sites that have no configured user\
  \ accounts and are running on publicly accessible servers behind a reverse proxy that sets\
  \ the `Forwarded: for=...`, `X-Client-IP`, or `X-Real-IP` request header.\n\nIt was possible\
  \ to install the Panel (= create the first admin user) in these setups even from remote IP\
  \ addresses.\n\n**This vulnerability is of critical severity for affected sites.**\n\nYour\
  \ site is *not* affected if any of the following apply: \n\n- An admin account has already\
  \ been configured\n- The Panel and API are disabled\n- The site is not running behind a reverse\
  \ proxy\n- The reverse proxy sets the `X-Forwarded-For` or `Client-IP` header instead of the\
  \ affected ones.\n\n----\n\n### Introduction\n\nExternal Initialization is a type of vulnerability\
  \ that allows attackers to initialize a system or configuration value without authentication.\n\
  \nThis can give untrusted actors access to the system or let them control its behavior.\n\n\
  ### Affected components\n\nThe Kirby Panel and REST API are authenticated by local user accounts.\
  \ If a Kirby installation does not yet have any users, it first needs to be installed. During\
  \ the installation process, an initial admin user account is created.\n\nTo protect against\
  \ external initialization attacks that would allow untrusted actors to create an admin user\
  \ for the Kirby installation, Kirby already checked whether the current request came from\
  \ a local IP address. This allows installing the Panel in local development setups. Installation\
  \ on remote servers was only supposed to be possible when the `panel.install` configuration\
  \ option was enabled.\n\nThe `isLocal` check takes all relevant request headers into account\
  \ and treats a request as non-local as soon as any checked request header contains an external\
  \ IP address.\n\n### Impact\n\nIn affected releases, the `isLocal` check for the installation\
  \ logic did not properly take the `Forwarded: for=...` header into account. This header is\
  \ set by modern reverse proxy servers. It also did not take into account the `X-Client-IP`\
  \ or `X-Real-IP` headers, which are set by some custom reverse proxy setups.\n\nThis caused\
  \ Kirby to falsely assume that an installation request was local and allowed creating an admin\
  \ account even though the reverse proxy forwarded the request from an external IP address.\n\
  \nReverse proxies setting the `X-Forwarded-For` or `Client-IP` headers were *not* affected.\
  \ These headers were already properly checked for external IP addresses.\n\n### Patches\n\n\
  The problem has been patched in [Kirby 4.9.4](https://github.com/getkirby/kirby/releases/tag/4.9.4)\
  \ and [Kirby 5.4.4](https://github.com/getkirby/kirby/releases/tag/5.4.4). Please update to\
  \ one of these or a [later version](https://github.com/getkirby/kirby/releases) to fix the\
  \ vulnerability.\n\nIn all of the mentioned releases, we fixed the `isLocal` check to also\
  \ properly take `Forwarded: for=...`, `X-Client-IP` and `X-Real-IP` request headers into account.\n\
  \n### Workarounds\n\nSites on older Kirby versions (Kirby 3 starting at 3.7.0) can be protected\
  \ with one of the following workarounds:\n\n- Perform the Panel installation yourself by creating\
  \ an initial admin account. As soon as one or more accounts are present, the vulnerable installation\
  \ code is no longer active.\n- If you don't need the Panel, disable the REST API with the\
  \ `'api' => false` option in `config.php`.\n\n### Credits\n\nThanks to Peter Levashov (@petersevera)\
  \ for responsibly reporting the identified issue."
