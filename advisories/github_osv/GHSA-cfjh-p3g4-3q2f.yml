summary: "VBScript Content Injection in marked\nVersions 0.3.2 and earlier of `marked` are affected\
  \ by a cross-site scripting vulnerability even when `sanitize:true` is set. \n\n## Proof of\
  \ Concept ( IE10 Compatibility Mode Only )\n\n`[xss link](vbscript:alert(1&#41;)`\n\nwill\
  \ get a link\n\n`<a href=\"vbscript:alert(1)\">xss link</a>`\n\n\n## Recommendation\n\nUpdate\
  \ to version 0.3.3 or later."
