summary: "Paymenter has URL parameter injection that bypasses paid plan limits at checkout\n\
  ### Summary\nThe checkout component improperly filters URL-writable properties, allowing authenticated\
  \ users to inject arbitrary key-value pairs into server provisioning parameters. Because bundled\
  \ server extensions prioritize these user-supplied properties over administrator-defined configurations,\
  \ a regular user can override hosting plans and resource limits at checkout without special\
  \ privileges.\n\n### Technical Details\nThe `Checkout` Livewire component (`app/Livewire/Products/Checkout.php`)\
  \ exposes the `$checkoutConfig` property to URL query parameters via the `#[Url]` attribute\
  \ (aliased as `config`). \n\nWhen processing this input:\n1. Validation rules are dynamically\
  \ generated *only* for keys explicitly defined by an extension's `getCheckoutConfig()` method.\
  \ Any undefined keys injected into the query parameter bypass validation entirely.\n2. The\
  \ cart component (`app/Livewire/Cart.php`) stores all keys from `checkout_config` directly\
  \ into the database without sanitation:\n```php\n   foreach ($item->checkout_config as $key\
  \ => $value) {\n       $service->properties()->updateOrCreate(['key' => $key], ['value' =>\
  \ $value]);\n   }\n```\n3. During server provisioning, app/Helpers/ExtensionHelper.php retrieves\
  \ these stored properties and passes them to the extension's createServer() method.\n\nBecause\
  \ of how individual server extensions handle these properties, user-injected data overrides\
  \ intended administrator settings.\n\n### Impact\nThis is a business logic flaw that allows\
  \ remote, authenticated users to manipulate server provisioning parameters.\n\nDepending on\
  \ the active extension, this leads to unauthorized overrides of core resource limits (such\
  \ as CPU, RAM, storage, or package tiers). No administrative privileges are required to exploit\
  \ this vulnerability."
