aliases:
  - CVE-2026-61824
summary: "Defuddle vulnerable to XSS via unescaped attribute interpolation in site extractors\n\
  ## Summary\n\nAn Improper Neutralization of Input During Web Page Generation issue in the\
  \ site extractor component allows an attacker-controlled attribute value to be injected into\
  \ output HTML without escaping. An attacker who crafts a malicious HTML page or controls content\
  \ on a matching domain can execute arbitrary scripts when a victim processes the page, resulting\
  \ in Cross-Site Scripting (XSS).  This affects defuddle through 0.19.0 and has been patched\
  \ in version 0.19.1.\n\n## Impact\n\nThis vulnerability allows for Cross-Site Scripting (XSS)\
  \ execution without needing to compromise external websites. Affected consumers include:\n\
  - Obsidian Web Clipper, \n- web services serving the parsed output directly as HTML, and \n\
  - any downstream application rendering the unsanitized HTML results\n\n## Patch\nThis issue\
  \ has been patched in defuddle version 0.19.1. Users are encouraged to update to the latest\
  \ release."
