summary: "Steeltoe vulnerable to management-port isolation bypass via spoofed Host header\n\
  ### Summary\n\nWhen Steeltoe management endpoints are configured to listen on an alternate\
  \ port (`Management:Endpoints:Port` is configured), the middleware responsible for restricting\
  \ access to the endpoints uses the `Host` HTTP header rather than the actual network socket\
  \ port. \n\n### Impact\n\nAn unauthenticated remote attacker can reach every actuator endpoint\
  \ using a specially crafted HTTP request.\n\n### Affected configuration\n\n- The application's\
  \ public port is accessible over from the network.\n- `Management:Endpoints:Port` is configured\
  \ to a value different from the application's main listener port.\n- The request scheme matches\
  \ `Management:Endpoints:SslEnabled`. For example, `http` when `SslEnabled` is `false` (the\
  \ default), or `https` when `SslEnabled` is `true`.\n\n### Mitigations\n\nIf an immediate\
  \ upgrade to a patched version is not possible:\n\n- Add explicit ASP.NET Core authorization\
  \ (`RequireAuthorization`) to all sensitive actuator endpoints as a defense-in-depth measure\
  \ independent of port isolation.\n- Configure the reverse proxy or load balancer to enforce\
  \ the `Host` header value and prevent clients from setting an arbitrary port."
