summary: "Tauri's Updater Private Keys Possibly Leaked via Vite Environment Variables\n### Impact\n\
  \nThis advisory is not describing a vulnerability in the Tauri code base itself but a commonly\
  \ used misconfiguration which could lead to leaking of the private key and updater key password\
  \ into bundled Tauri applications using the Vite frontend in a specific configuration.\n\n\
  The Tauri documentation used an insecure example configuration in the [Vite guide](https://tauri.app/v1/guides/getting-started/setup/vite/)\
  \ to showcase how to use Tauri together with Vite. \n\nCopying the following snippet `envPrefix:\
  \ ['VITE_', 'TAURI_'],` from this guide into the `vite.config.ts` of a Tauri project possibly\
  \ leads to bundling the `TAURI_PRIVATE_KEY` and `TAURI_KEY_PASSWORD` into the Vite frontend\
  \ code and therefore leaking this value to the debug built of a Tauri application.\n\nThe\
  \ value is automatically bundled into debug builds but for production builds it is not embedded,\
  \ as long as it is not directly referenced in the frontend code. Vite statically replaces\
  \ these values in production builds. This reduces the amount of affected applications to a\
  \ very small amount of affected applications.\n\nTo verify if you are affected you can search\
  \ for the private key value or the `TAURI_PRIVATE_KEY` variable inside the release build frontend\
  \ assets (`dist/`).\n\n> Example: `grep -r \"TAURI_PRIVATE_KEY\" dist/`\n\nUsing only the\
  \ `envPrefix: ['VITE_'],` or any other framework than Vite means you are not impacted by this\
  \ advisory.\n\n### Patches\n\nThe documentation has been patched but as the root cause is\
  \ not in Tauri itself the issue is not fixed by updating Tauri.\nThe `vite.config.ts` configuration\
  \ of the project needs to be adapted.\n\nWe recommend rotating your updater private key if\
  \ you are affected by this (requires Tauri CLI >=1.5.5). After updating the envPrefix configuration,\
  \ generate a new private key with `tauri signer generate`, saving the new private key and\
  \ updating the updater's `pubkey` value on `tauri.conf.json` with the new public key. To update\
  \ your existing application, the next application build must be signed with the older private\
  \ key in order to be accepted by the existing application.\n\n### Workarounds\n\nThe `envPrefix:\
  \ ['VITE_'],`should be used and the desired `TAURI` variables manually added.\nRespective\
  \ these variables could be added `TAURI_PLATFORM`, `TAURI_ARCH`, `TAURI_FAMILY`, `TAURI_PLATFORM_VERSION`,\
  \ `TAURI_PLATFORM_TYPE` and `TAURI_DEBUG` without leaking sensitive information.\n\nWe urge\
  \ affected users to implement the workaround as the `1.x` branch will not receive a general\
  \ prevention fix as it would break systems.\n\n### References\nThe issue was originally disclosed\
  \ in our discord [here](https://discord.com/channels/616186924390023171/1164260301655523409).\n\
  The affected guide is [https://tauri.app/v1/guides/getting-started/setup/vite/](https://tauri.app/v1/guides/getting-started/setup/vite/).\n\
  \n\n> Update: We lowered the severity from high to low, as the likelihood of impact was found\
  \ to only affect a **very limited** amount of applications.\n\n> Update2: We changed the affected\
  \ versions to make clear that after `2.0.0-alpha.16` or `1.5.6` the potentially vulnerable\
  \ recommendation was no longer visible on our website and should not affect projects by default.\
  \ A lot of users were confused and we believe this advisory reached the necessary user base."
