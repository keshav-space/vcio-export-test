summary: "Deno node:crypto doesn't finalize cipher\n### Summary\n\nThe vulnerability allows\
  \ an attacker to have infinite encryptions. \n\nThis can lead to naive attempts at brute forcing,\
  \ as well as more refined attacks with the goal to learn the server secrets.\n\n### PoC\n\
  ```js\nimport crypto from \"node:crypto\";\n\nconst key = crypto.randomBytes(32);\nconst iv\
  \ = crypto.randomBytes(16);\nconst cipher = crypto.createCipheriv(\"aes-256-cbc\", key, iv);\n\
  cipher.final()\n\nconsole.log(cipher);\n```\n\n### Expected Output\n```js\nCipheriv {\n  _decoder:\
  \ null,\n  _options: undefined,\n  Symbol(kHandle): CipherBase {}\n}\n```\n\n### Actual Output\n\
  ```js\nCipheriv {\n  _events: {\n    close: undefined,\n    error: undefined,\n    prefinish:\
  \ [Function: prefinish],\n    finish: undefined,\n    drain: undefined,\n    data: undefined,\n\
  \    end: undefined,\n    readable: undefined\n  },\n  _readableState: ReadableState {\n \
  \   highWaterMark: 65536,\n    buffer: [],\n    bufferIndex: 0,\n    length: 0,\n    pipes:\
  \ [],\n    awaitDrainWriters: null,\n    [Symbol(kState)]: 1048844\n  },\n  _writableState:\
  \ WritableState {\n    highWaterMark: 65536,\n    length: 0,\n    corked: 0,\n    onwrite:\
  \ [Function: bound onwrite],\n    writelen: 0,\n    bufferedIndex: 0,\n    pendingcb: 0,\n\
  \    [Symbol(kState)]: 17580812,\n    [Symbol(kBufferedValue)]: null\n  },\n  allowHalfOpen:\
  \ true,\n  _final: [Function: final],\n  _maxListeners: undefined,\n  _transform: [Function:\
  \ transform],\n  _eventsCount: 1,\n  [Symbol(kCapture)]: false,\n  [Symbol(kCallback)]: null\n\
  }\n```\n\n### Mitigations\n\nAll users should upgrade to Deno v2.6.0 or newer."
