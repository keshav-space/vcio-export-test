summary: "docx4j: Stack Overflow via Cyclic `w:basedOn` Style Chain leads to Denial of Service\n\
  ### Summary\ndocx4j's `PropertyResolver` and several adjacent helpers recursively walk the\
  \ OpenXML style inheritance chain (`w:basedOn`) without cycle detection. \n\nA WordprocessingML\
  \ document containing a cyclic style chain (for example, Style A based on B and Style B based\
  \ on A) causes unbounded recursion and a `java.lang.StackOverflowError` within the property-resolution\
  \ code path.\n\nThese helpers are used by operations that require effective style resolution,\
  \ including common conversion and TOC-related paths.  As a result, most server-side pipelines\
  \ that accept a user-supplied docx and process it through docx4j can likely be crashed by\
  \ a file containing a cyclic style reference.\n\n### Details\n\nRepresentative snippet: `PropertyResolver.fillPPrStack`\n\
  \n```java\nprivate void fillPPrStack(String styleId, Stack<PPr> pPrStack) {\n    Style style\
  \ = liveStyles.get(styleId);\n    ...\n    // if it is based on, recurse\n    if (style.getBasedOn()\
  \ == null) {\n        log.debug(\"Style \" + styleId + \" is a root style.\");\n    } else\
  \ if (style.getBasedOn().getVal() != null) {\n        String basedOnStyleName = style.getBasedOn().getVal();\n\
  \        fillPPrStack(basedOnStyleName, pPrStack);   // ← unbounded recursion\n        ...\n\
  ```\n\n### Impact\nThis is a denial of service against a server-side application that processes\
  \ untrusted docx files via docx4j. \n\nAn upload causes the processing thread to be terminated\
  \ with `StackOverflowError` which may crash the worker thread, degrade the thread pool, or\
  \ evade normal per-request CPU and heap-memory safeguards in containers and serverless functions\
  \ (because the failure mode is thread-stack exhaustion rather than gradual resource consumption).\n\
  \nThe attack depends on the host application's access controls and requires no user interaction\
  \ beyond submitting the file. Detection is difficult because the file is a well-formed OOXML\
  \ package containing ordinary style elements,  and passes standard antivirus and content-inspection\
  \ rules.\n\nSeverity: High for server-side applications that process untrusted DOCX files\
  \ using docx4j style/property resolution (unless the application catches StackOverflowError,\
  \ isolates conversion in disposable worker processes, restarts workers cleanly, and the practical\
  \ impact is only failure of one request). Severity may be Medium where document upload requires\
  \ authentication, processing is isolated, or the failure is limited to a single request/worker.\n\
  \n### Credits\nThanks to Koh You Liang ([@Isopach](https://github.com/Isopach)) for responsibly\
  \ disclosing this issue."
