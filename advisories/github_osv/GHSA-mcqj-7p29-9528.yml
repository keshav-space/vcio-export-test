summary: "MantisBT Host Header Injection vulnerability\n### Impact\nKnowing a user's email address\
  \ and username, an unauthenticated attacker can hijack the user's account by poisoning the\
  \ link in the password reset notification message.\n\n### Patches\nhttps://github.com/mantisbt/mantisbt/commit/7055731d09ff12b2781410a372f790172e279744\n\
  \n### Workarounds\nDefine `$g_path` as appropriate in config_inc.php.\n\n### References\n\
  https://mantisbt.org/bugs/view.php?id=19381\n\n### Credits\n\nThanks to the following security\
  \ researchers for responsibly reporting and helping resolve this vulnerability.\n\n- Pier-Luc\
  \ Maltais (https://twitter.com/plmaltais) \n- Hlib Yavorskyi (https://github.com/Kerkroups)\n\
  - Jingshao Chen (https://github.com/shaozi)\n- Brandon Roldan\n- nhchoudhary"
