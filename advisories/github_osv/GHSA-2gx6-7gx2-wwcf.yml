  - CVE-2026-70588
summary: "Ghost: Cross-Site Scripting in Universal Import\n### Impact\n\nThe Universal Import\
  \ feature in Ghost Admin failed to properly sanitize imported content resulting in XSS in\
  \ post content.\n\n### Vulnerable versions\n\nThis vulnerability is present in Ghost from\
  \ v5.26.0 up to v6.54.0.\n\n### Patches\n\nv6.54.1 contains a fix for this issue.\n\n### How\
  \ to update\n\nFor self-hosters using Docker, find [Docker's official Ghost image here](https://hub.docker.com/_/ghost).\
  \ Updating a Docker-based Ghost instance [is documented here](https://docs.ghost.org/install/docker#updating-ghost).\
  \ \n\nIf your Ghost is a Ghost-CLI install see our documentation on [updating it to the latest\
  \ version here](https://docs.ghost.org/update). \n\n### Workarounds\n\nIf upgrading immediately\
  \ is not possible, avoid using the Universal Import feature.\n\n### References\n\nGhost thanks\
  \ meifukun for disclosing this vulnerability responsibly.\n\n### For more information\n\n\
  If you have any questions or comments about this advisory, email us at [security@ghost.org](mailto:security@ghost.org)."
