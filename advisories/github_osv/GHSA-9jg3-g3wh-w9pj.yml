aliases:
  - CVE-2026-55552
summary: "Yamcs has Unauthenticated Directory Traversal\n### Attack type: \nUnauthenticated\
  \ remote  \n\n### Impact: \nAttackers can access any system files from the underlying host.\n\
  \n### Affected components: HttpRequestHandler.java, StaticFileHandler.java\n\nAn Unauthenticated\
  \ Directory Traversal vulnerability exists in Yamcs <=5.8.6, allowing anyone to access any\
  \ file on the underlying operating system. This allows unauthenticated attackers to download\
  \ sensitive files and data.\n\n<img width=\"2170\" height=\"1289\" alt=\"image\" src=\"https://github.com/user-attachments/assets/8d426da1-5351-4240-a290-8d858be61312\"\
  \ />\n\n## Steps to Reproduce:\n1. Start Yamcs and login as a user\n2. Paste the following\
  \ URL in the browser and press enter:\n\n```\nhttp://localhost:8090//etc/passwd\n```\n\n3.\
  \ The `/etc/passwd` file will be downloaded.\n\n## Acknowledgements\nThis vulnerability was\
  \ discovered by Abderrahim Dahmani while solving a STARPWN 2025 CTF challenge at DEFCON 33\
  \ offered by VisionSpace Technologies."
