  - CVE-2026-55760
summary: "handlebars.java FileTemplateLoader Path Traversal\n### Impact\nAny application that\
  \ passes user-controlled input to Handlebars.compile() using a FileTemplateLoader (or ClassPathTemplateLoader)\
  \ is vulnerable to arbitrary file read. This is a realistic attack surface for web applications\
  \ that use template names from URL path parameters, request parameters, or other user-controlled\
  \ sources.\n\n### Patches\ncom.github.jknack:handlebars:4.5.2\n\n### Workarounds\n\nValidate\
  \ template name is derived from user input. \n\n```java\nif (!file.getPath().startsWith(new\
  \ File(prefix).getCanonicalPath())) {\n        throw new IOException(\"Path traversal attempt\
  \ detected: \" + location);\n}\n```"
