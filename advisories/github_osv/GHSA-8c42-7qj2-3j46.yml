aliases:
  - CVE-2026-59903
summary: "Netty Vulnerable to Cache Poisoning and Information Disclosure via CORS Vary Header\
  \ Overwrite\n### Summary\nNetty's `CorsHandler` silently overwrites existing `Vary` headers,\
  \ enabling cache poisoning and sensitive information disclosure.\n\n### Details\n`io.netty.handler.codec.http.cors.CorsHandler#setVaryHeader`\
  \ overwrites any existing Vary headers set by backend applications. \n\n```java\n    private\
  \ static void setVaryHeader(final HttpResponse response) {\n        response.headers().set(HttpHeaderNames.VARY,\
  \ HttpHeaderNames.ORIGIN);\n    }\n```\n\nBecause `set()` replaces all existing values for\
  \ the header, if a backend application sets a `Vary` header (such as `Vary: Authorization`\
  \ or `Vary: Cookie`) to ensure that intermediate caches (like CDNs) cache responses separately\
  \ per user, the `CorsHandler` will overwrite it with `Vary: origin`. This causes the caching\
  \ proxy to ignore the authorization context and cache the response based solely on the URL\
  \ and Origin, allowing an attacker to retrieve another user's cached sensitive data.\n\n###\
  \ Impact\nThis is a Cache Poisoning vulnerability that leads to Information Disclosure. It\
  \ impacts any Netty-based web application that uses the CorsHandler, sets its own Vary headers\
  \ to manage caching of authenticated or user-specific responses (e.g., Vary: Authorization),\
  \ and is deployed behind a caching proxy or CDN. The end-users of these applications are impacted,\
  \ as their sensitive data may be leaked to unauthorized actors."
