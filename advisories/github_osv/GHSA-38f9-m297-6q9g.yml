summary: "DoS via malicious record IDs in WatermelonDB\n## Impact\n\nMedium severity 5.9 https://www.first.org/cvss/calculator/3.0#CVSS:3.0/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:L/A:H\n\
  \nA maliciously crafted record ID can exploit a SQL Injection vulnerability in iOS adapter\
  \ implementation and cause the app to delete all or selected records from the database, generally\
  \ causing the app to become unusable.\n\nThis may happen in apps that don't validate IDs (valid\
  \ IDs are `/^[a-zA-Z0-9_-.]+$/`) and use Watermelon Sync or low-level `database.adapter.destroyDeletedRecords`\
  \ method.\n\nThe integrity risk is low due to the fact that maliciously deleted records won't\
  \ synchronize, so logout-login will restore all data, although some local changes may be lost\
  \ if the malicious deletion causes the sync process to fail to proceed to push stage.\n\n\
  No way to breach confidentiality with this vulnerability is known. Full exploitation of SQL\
  \ Injection is mitigated, because it's not possible to nest an insert/update query inside\
  \ a delete query in SQLite, and it's not possible to pass a semicolon-separated second query.\
  \ There's also no known practicable way to breach confidentiality by selectively deleting\
  \ records, because those records will not be synchronized.\n\nIt's theoretically possible\
  \ that selective record deletion could cause an app to behave insecurely if lack of a record\
  \ is used to make security decisions by the app. \n\n## Patches\n\nPatched versions include:\n\
  \n- 0.15.1\n- 0.16.2\n- 0.16.1-fix\n\t- this is actually the same as 0.16.0, but with the\
  \ patch applied - as 0.16.1 is causing issues for some users\n- `924c7ae2a8d` commit id contains\
  \ the patch\n\n## Workarounds\n\n1. Ensure that your backend service sanitizes record IDs\
  \ sent in the `pull sync` endpoint, such that only IDs matching `/^[a-zA-Z0-9_-.]+$/` are\
  \ returned. This could also be done in JavaScript `pullChanges` function passed to `synchronize()`\n\
  2. If you use `destroyDeletedRecords` directly, validate all IDs passed the same way\n\n##\
  \ For more information\n\nIf you have any questions about this advisory, contact @radex."
