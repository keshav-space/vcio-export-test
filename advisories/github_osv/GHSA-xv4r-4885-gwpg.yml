summary: "Kimai has Improper Authorization in Team Member and Team Activity Assignment APIs\
  \ Which Allows Expansion of Team Scope Beyond Authorized Visibility\n### Summary\n\nKimai\
  \ contains an authenticated improper authorization vulnerability in Team-related assignment\
  \ APIs. A Teamlead who can edit their own team can use backend API endpoints to add users\
  \ or activities that fall outside their intended visible or manageable scope, even when the\
  \ frontend correctly hides those targets.\n\nThis affects both team member assignment and\
  \ team activity assignment. The issue is caused by treating \"may edit this team\" as equivalent\
  \ to \"may attach any referenced object to this team\", without performing a second authorization\
  \ check on the target user or activity.\n\n### Details\n\nThe issue affects at least the following\
  \ API routes:\n\n- `POST /api/teams/{id}/members/{userId}`\n- `POST /api/teams/{id}/activities/{activityId}`\n\
  \nIn both cases, the backend checks whether the caller may edit the `Team`, but it does not\
  \ verify whether the referenced `User` or `Activity` falls inside the caller's allowed management\
  \ scope.\n\nFor team member assignment, the frontend form correctly limits the visible user\
  \ choices. In `src/Form/TeamEditForm.php`, the team edit form uses `UserType`:\n\n```php\n\
  $builder->add('users', UserType::class, [\n    'label' => 'add_user.label',\n    'help' =>\
  \ 'team.add_user.help',\n    'mapped' => false,\n    'multiple' => false,\n    'expanded'\
  \ => false,\n    'required' => false,\n    'ignore_users' => $team !== null ? $team->getUsers()\
  \ : []\n]);\n```\n\nIn `src/Form/Type/UserType.php`, the user selector is built from `UserRepository::getQueryBuilderForFormType()`:\n\
  \n```php\n$query = new UserFormTypeQuery();\n$query->setUser($options['user']);\n\n$qb = $this->userRepository->getQueryBuilderForFormType($query);\n\
  $users = $qb->getQuery()->getResult();\n```\n\nAnd in `src/Repository/UserRepository.php`,\
  \ Teamlead-visible candidates are limited to team members from teams they lead:\n\n```php\n\
  if (null !== $user && $user->isTeamlead()) {\n    $userIds = [];\n    foreach ($user->getTeams()\
  \ as $team) {\n        if ($team->isTeamlead($user)) {\n            foreach ($team->getUsers()\
  \ as $teamMember) {\n                $userIds[] = $teamMember->getId();\n            }\n \
  \       }\n    }\n    $userIds = array_unique($userIds);\n    $qb->setParameter('teamMember',\
  \ $userIds);\n    $or->add($qb->expr()->in('u.id', ':teamMember'));\n}\n```\n\nHowever, the\
  \ actual member-assignment API does not reuse that restriction. In `src/API/TeamController.php`:\n\
  \n```php\n#[IsGranted('edit', 'team')]\n#[Route(methods: ['POST'], path: '/{id}/members/{userId}',\
  \ name: 'post_team_member', requirements: ['id' => '\\d+', 'userId' => '\\d+'])]\npublic function\
  \ postMemberAction(Team $team, #[MapEntity(mapping: ['userId' => 'id'])] User $member): Response\n\
  {\n    if ($member->isInTeam($team)) {\n        throw new BadRequestHttpException('User is\
  \ already member of the team');\n    }\n\n    $team->addUser($member);\n    $this->teamService->saveTeam($team);\n\
  }\n```\n\nFor activity assignment, the same pattern appears. In `src/API/TeamController.php`:\n\
  \n```php\n#[IsGranted('edit', 'team')]\n#[Route(methods: ['POST'], path: '/{id}/activities/{activityId}',\
  \ name: 'post_team_activity', requirements: ['id' => '\\d+', 'activityId' => '\\d+'])]\npublic\
  \ function postActivityAction(Team $team, #[MapEntity(mapping: ['activityId' => 'id'])] Activity\
  \ $activity, ActivityRepository $activityRepository): Response\n{\n    if ($team->hasActivity($activity))\
  \ {\n        throw new BadRequestHttpException('Team has already access to activity');\n \
  \   }\n\n    $team->addActivity($activity);\n    $activityRepository->saveActivity($activity);\n\
  }\n```\n\nThe `Team` voter only checks whether the current user may edit that team, not whether\
  \ the referenced object is within the Teamlead's legitimate scope. In `src/Voter/TeamVoter.php`:\n\
  \n```php\nif (!$user->isAdmin() && !$user->isSuperAdmin() && !$user->isTeamleadOf($subject))\
  \ {\n    return false;\n}\n\nreturn $this->permissionManager->hasRolePermission($user, $attribute\
  \ . '_team');\n```\n\nFor activities, this is especially risky because later authorization\
  \ logic may trust the team assignment that was just written. In `src/Security/RolePermissionManager.php`:\n\
  \n```php\npublic function checkTeamAccessActivity(Activity $activity, User $user): bool\n\
  {\n    if ($activity->getProject() !== null && !$this->checkTeamAccessProject($activity->getProject(),\
  \ $user)) {\n        return false;\n    }\n\n    return $this->checkTeamAccess($activity->getTeams(),\
  \ $user);\n}\n```\n\nSo once a Teamlead is able to write a new team/activity relation, later\
  \ access-control decisions may treat that relation as legitimate input.\n\n*A PoC was provided,\
  \ but removed for security reasons.*\n\n### Impact\n\nThis vulnerability allows a Teamlead\
  \ to use their own editable team as an expansion container for objects that should remain\
  \ outside their authorized scope. In the validated member-assignment case, the attacker can\
  \ forcibly add users who are not supposed to be manageable through that Teamlead's visible\
  \ range. In the activity-assignment case, the attacker can attach activities that are outside\
  \ the intended authorization boundary of the team.\n\nOnce such relations are written, downstream\
  \ authorization, visibility, and business workflows may start treating them as legitimate.\
  \ This can affect user scoping, team-based access control, customer/project/activity visibility,\
  \ time-entry behavior, statistics, and reporting. The issue therefore breaks the trustworthiness\
  \ of `Team` as a security isolation container.\n\n# Solution\n\nSeveral new permission checks\
  \ were added to `src/API/TeamController.php` -\n- Check if user can be accessed with `#[IsGranted('access_user',\
  \ 'member')]` before adding as new team member \n- Check if customer can be seen with `#[IsGranted('view',\
  \ 'customer')]` before a team is granted access to a customer\n- Check if project can be seen\
  \ with `#[IsGranted('view', 'project')]` before a team is granted access to a project\n- Check\
  \ if activity can be seen with `#[IsGranted('view', 'activity')]` before a team is granted\
  \ access to an activity\n\nSee [https://www.kimai.org/en/security/ghsa-xv4r-4885-gwpg](https://www.kimai.org/en/security/ghsa-xv4r-4885-gwpg)\
  \ for more information."
