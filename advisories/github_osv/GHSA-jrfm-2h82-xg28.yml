summary: |
  Withdrawn: Use after free in SciPy
  ## Withdrawn Advisory

  This advisory has been withdrawn because it has been found to not be an issue. Please see the issue [here](https://github.com/scipy/scipy/issues/14713#issuecomment-1629468565) for more information.

   ## Original Description

  A use-after-free issue was discovered in Py_FindObjects() function in SciPy versions prior to 1.8.0.
