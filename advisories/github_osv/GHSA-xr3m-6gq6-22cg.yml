summary: "Pimcore Authenticated Stored Cross-Site Scripting (XSS) Via Search Document\n### Summary\n\
  \ \nA Stored Cross-Site Scripting (XSS) vulnerability in PIMCORE allows remote attackers to\
  \ inject arbitrary web script or HTML via the PDF upload functionality. This can result in\
  \ the execution of malicious scripts in the context of the user's browser when the PDF is\
  \ viewed, leading to potential session hijacking, defacement of web pages, or unauthorized\
  \ access to sensitive information.\n \n### Details\n \nThe vulnerability is present in the\
  \ PDF upload functionality of the PIM Core Upload module. When a user uploads a PDF file,\
  \ the application fails to properly sanitize the content, allowing embedded scripts to be\
  \ executed when the PDF is viewed. The affected code is located in the file handling and rendering\
  \ logic of the PDF upload feature.\n \n### PoC\n \n\n \n1. Log in as Administrator\n![image](https://github.com/user-attachments/assets/7945bbd7-5277-4a0e-8365-56e5df319bae)\n\
  \n2. Hover to Assets\n![image](https://github.com/user-attachments/assets/f24645ee-d740-4a5e-81d1-b8bf48b71cce)\n\
  \n \n3. Right click and click \"Add Asset(s) > upload files\n![image](https://github.com/user-attachments/assets/0603cc90-44d8-423e-a01c-b0367fd929bd)\n\
  \n \n4. Upload malicious pdf\n![image](https://github.com/user-attachments/assets/51aa609d-f100-4f46-b3bb-3d730e000a02)\n\
  \n \n5. Click on search and select document\n![image](https://github.com/user-attachments/assets/7e945b26-4f8a-4e91-adea-8f46a0f17856)\n\
  \n \n6. copy the path and open to a new tab \n\n[https://demo.pimcore.fun/admin/Sample C](https://demo.pimcore.fun/Sample%20Content/Documents/xssmaeitsec.pdf)\n\
  \ \n![image](https://github.com/user-attachments/assets/500d49d6-42f7-4b64-8b01-117f439ace8d)\n\
  \n7. XSS PDF can be access without authentication. \n\n \n![image](https://github.com/user-attachments/assets/7fb53fc2-2f65-42b3-9ed7-fc0413211a3f)\n\
  \n Image showing no cookies indicator that there are no session currently in\n \n![image](https://github.com/user-attachments/assets/89f58fff-0dee-4520-9071-efd024c2f6d3)\n\
  \n### Impact\nThis is a Stored Cross-Site Scripting (XSS) vulnerability. It impacts any user\
  \ who views the malicious PDF, potentially leading to session hijacking, defacement of web\
  \ pages, or unauthorized access to sensitive information. The severity is high due to the\
  \ potential for significant impact on confidentiality and integrity."
