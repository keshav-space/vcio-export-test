  - description: PHP Laravel Framework 5.5.40 / 5.6.x < 5.6.30 - token Unserialize Remote Command
      Execution (Metasploit)
    required_action:
    due_date:
    notes:
    known_ransomware_campaign_use: yes
    source_date_published: !!timestamp '2019-07-16'
    exploit_type: remote
    platform: linux
    source_date_updated: !!timestamp '2019-07-16'
    data_source: Exploit-DB
    source_url: https://raw.githubusercontent.com/rapid7/metasploit-framework/master/modules/exploits/unix/http/laravel_token_unserialize_exec.rb
    record_id: CVE-2018-15133
  - description: |
      This module exploits a vulnerability in the PHP Laravel Framework for versions 5.5.40, 5.6.x <= 5.6.29.
                Remote Command Execution is possible via a correctly formatted HTTP X-XSRF-TOKEN header, due to
                an insecure unserialize call of the decrypt method in Illuminate/Encryption/Encrypter.php.
                Authentication is not required, however exploitation requires knowledge of the Laravel APP_KEY.
                Similar vulnerabilities appear to exist within Laravel cookie tokens based on the code fix.
                In some cases the APP_KEY is leaked which allows for discovery and exploitation.
    required_action:
    due_date:
    notes: |
      Reliability:
        - unknown-reliability
      Stability:
        - unknown-stability
      SideEffects:
        - unknown-side-effects
    known_ransomware_campaign_use: no
