summary: "ImageMagick has XMP profile write that triggers hang due to unbounded loop\n### Summary\n\
  Infinite lines occur when writing during a specific XMP file conversion command\n### Details\n\
  ```\n#0  GetXmpNumeratorAndDenominator (denominator=<optimized out>, numerator=<optimized\
  \ out>, value=<optimized out>) at MagickCore/profile.c:2578\n#1  GetXmpNumeratorAndDenominator\
  \ (denominator=<synthetic pointer>, numerator=<synthetic pointer>, value=720000000000000)\
  \ at MagickCore/profile.c:2564\n#2  SyncXmpProfile (image=image@entry=0x555555bb9ea0, profile=0x555555b9d020)\
  \ at MagickCore/profile.c:2605\n#3  0x00005555555db5cf in SyncImageProfiles (image=image@entry=0x555555bb9ea0)\
  \ at MagickCore/profile.c:2651\n#4  0x0000555555798d4f in WriteImage (image_info=image_info@entry=0x555555bc2050,\
  \ image=image@entry=0x555555bb9ea0, exception=exception@entry=0x555555b7bea0) at MagickCore/constitute.c:1288\n\
  #5  0x0000555555799862 in WriteImages (image_info=image_info@entry=0x555555bb69c0, images=<optimized\
  \ out>, images@entry=0x555555bb9ea0, filename=<optimized out>, exception=0x555555b7bea0) at\
  \ MagickCore/constitute.c:1575\n#6  0x00005555559650c4 in CLINoImageOperator (cli_wand=cli_wand@entry=0x555555b85790,\
  \ option=option@entry=0x5555559beebe \"-write\", arg1n=arg1n@entry=0x7fffffffe2c7 \"a.mng\"\
  , arg2n=arg2n@entry=0x0) at MagickWand/operation.c:4993\n#7  0x0000555555974579 in CLIOption\
  \ (cli_wand=cli_wand@entry=0x555555b85790, option=option@entry=0x5555559beebe \"-write\")\
  \ at MagickWand/operation.c:5473\n#8  0x00005555559224aa in ProcessCommandOptions (cli_wand=cli_wand@entry=0x555555b85790,\
  \ argc=argc@entry=3, argv=argv@entry=0x7fffffffdfa8, index=index@entry=1) at MagickWand/magick-cli.c:758\n\
  #9  0x000055555592276d in MagickImageCommand (image_info=image_info@entry=0x555555b824a0,\
  \ argc=argc@entry=3, argv=argv@entry=0x7fffffffdfa8, metadata=metadata@entry=0x7fffffffbc10,\
  \ exception=exception@entry=0x555555b7bea0) at MagickWand/magick-cli.c:1392\n#10 0x00005555559216a0\
  \ in MagickCommandGenesis (image_info=image_info@entry=0x555555b824a0, command=command@entry=0x555555922640\
  \ <MagickImageCommand>, argc=argc@entry=3, argv=argv@entry=0x7fffffffdfa8, metadata=0x0, exception=exception@entry=0x555555b7bea0)\
  \ at MagickWand/magick-cli.c:177\n#11 0x000055555559f76b in MagickMain (argc=3, argv=0x7fffffffdfa8)\
  \ at utilities/magick.c:162\n#12 0x00007ffff700fd90 in __libc_start_call_main (main=main@entry=0x55555559aec0\
  \ <main>, argc=argc@entry=3, argv=argv@entry=0x7fffffffdfa8) at ../sysdeps/nptl/libc_start_call_main.h:58\n\
  #13 0x00007ffff700fe40 in __libc_start_main_impl (main=0x55555559aec0 <main>, argc=3, argv=0x7fffffffdfa8,\
  \ init=<optimized out>, fini=<optimized out>, rtld_fini=<optimized out>, stack_end=0x7fffffffdf98)\
  \ at ../csu/libc-start.c:392\n#14 0x000055555559f535 in _start ()\n```\n```\nstatic void GetXmpNumeratorAndDenominator(double\
  \ value,\n  unsigned long *numerator,unsigned long *denominator)\n{\n  double\n    df;\n\n\
  \  *numerator=0;\n  *denominator=1;\n  if (value <= MagickEpsilon)\n    return;\n  *numerator=1;\n\
  \  df=1.0;\n  while(fabs(df - value) > MagickEpsilon)\n  {\n    if (df < value)\n      (*numerator)++;\n\
  \    else\n      {\n        (*denominator)++;\n        *numerator=(unsigned long) (value*(*denominator));\n\
  \      }\n    df=*numerator/(double)*denominator;\n  }\n}\n```\nIn this code, the loop `while(fabs(df\
  \ - value) > MagickEpsilon)` keeps repeating endlessly.\n\n### PoC\n`magick hang a.mng`\n\
  https://drive.google.com/file/d/1iegkwlTjqnJTtM4XkiheYsjKsC6pxtId/view?usp=sharing\n\n###\
  \ Impact\nXMP profile write triggers hang due to unbounded loop\n\n\n### credits\n**Team Pay1oad\
  \ DVE** \n\n**Reporter** :  **Shinyoung Won** (with contributions from **WooJin Park, DongHa\
  \ Lee, JungWoo Park, Woojin Jeon, Juwon Chae**, **Kyusang Han, JaeHun Gou**)\n\n**yosimich(@yosiimich**)\
  \ **Shinyoung Won** of SSA Lab\n\ne-mail : [yosimich123@gmail.com]\n\n**Woojin Jeon**\n\n\
  Gtihub : brainoverflow\n\ne-mail : [root@brainoverflow.kr]\n\n**WooJin Park**\n\nGitHub :\
  \ jin-156\n\ne-mail : [1203kids@gmail.com]\n\n**Who4mI(@GAP-dev) Lee DongHa of SSA Lab**\n\
  \nGithub: GAP-dev\n\ne-mail : [ceo@zeropointer.co.kr]\n\n**JungWoo Park**\n\nGithub : JungWooJJING\n\
  \ne-mail : [cuby5577@gmail.com]\n\n**Juwon Chae** \n\nGithub : I_mho\n\ne-mail : [wndnjs4698@naver.com]\n\
  \n**Kyusang Han**\n\nGithub : T1deSEC\n\ne-mail : [hksjoe0081@gmail.com]\n\n**JaeHun Gou**\n\
  \nGithub : P2GONE\n\ne-mail : [charly20@naver.com]\n\n### Commits\nFixed in: https://github.com/ImageMagick/ImageMagick/commit/229fa96a988a21d78318bbca61245a6ed1ee33a0\
  \ and https://github.com/ImageMagick/ImageMagick/commit/38631605e6ab744548a561797472cf8648bcfe26"
