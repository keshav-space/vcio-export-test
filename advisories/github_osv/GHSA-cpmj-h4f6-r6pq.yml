summary: "Harden-Runner: Bypassing Logging of Outbound Connections Using sendto, sendmsg, and\
  \ sendmmsg in Harden-Runner (Community Tier)\n## Summary \n\nA security vulnerability has\
  \ been identified in the Harden-Runner GitHub Action (Community Tier) that allows outbound\
  \ network connections to evade audit logging. Specifically, outbound traffic using the `sendto`,\
  \ `sendmsg`, and `sendmmsg` socket system calls can bypass detection and logging when using\
  \ `egress-policy: audit`. \n\n**Note:** This vulnerability only affects audit mode. When using\
  \ `egress-policy: block`, these connections are properly blocked. It requires the attacker\
  \ to already have code execution capabilities within the GitHub Actions workflow (e.g., through\
  \ workflow injection or compromised dependencies)\n\n## Affected Versions \n\n- Harden-Runner\
  \ Community Tier: All versions prior to v2.14.2 \n- Harden-Runner Enterprise Tier: **NOT AFFECTED**\
  \ \n\n## Severity \n\n**Medium** - This vulnerability affects audit logging capabilities but\
  \ requires the attacker to already have code execution within the workflow. \n\n## Impact\
  \ \n\nWhen Harden-Runner is configured in audit mode (`egress-policy: audit`), attackers with\
  \ the ability to execute arbitrary code in a workflow can: \n- Send outbound network traffic\
  \ without generating audit logs \n- Bypass network monitoring for UDP-based communications\
  \ \n\n**Important:** This vulnerability requires the attacker to already have code execution\
  \ capabilities within the GitHub Actions workflow (e.g., through workflow injection or compromised\
  \ dependencies). \n\n## Technical Details \n\nThe vulnerability stems from incomplete monitoring\
  \ coverage of certain socket-related system calls. Specifically, the following system calls\
  \ can be used to send UDP traffic without triggering audit events: \n\n- `sendto()` \n\n-\
  \ `sendmsg()` \n\n- `sendmmsg()` \n\nAn attacker with code execution in a workflow can compile\
  \ and execute native code that uses these system calls to establish covert communication channels.\
  \ \n\n## Affected Users \n\n**This vulnerability ONLY affects users of the Harden-Runner Community\
  \ Tier.** \n\nThe Harden-Runner Enterprise Tier is **NOT vulnerable** to this bypass technique.\
  \ \n\n## Remediation \n\n### For Community Tier Users \n \n**Upgrade to Harden-Runner v2.14.2\
  \ or later.** This version includes fixes for the logging bypass vulnerability. \n\n### For\
  \ Enterprise Tier Users \n\nNo action required. Enterprise tier customers are not affected\
  \ by this vulnerability. \n\n## Credit \n\nWe would like to thank [Devansh Batham](https://github.com/devanshbatham)\
  \ for responsibly disclosing this vulnerability through our security reporting process. Devansh\
  \ was communicative throughout the process and verified the fix before the fix before it was\
  \ made public."
