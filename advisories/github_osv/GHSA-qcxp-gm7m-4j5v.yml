aliases:
  - CVE-2026-50559
summary: "Quarkus: Authentication/Authorization Bypass via Advanced Path Normalization Vulnerabilities\n\
  Quarkus HTTP path-based authorization policies can be bypassed using encoded semicolons (%3B)\
  \ to smuggle matrix\n  parameters past the security layer, and using encoded slashes (%2F)\
  \ or backslashes (%5C) to access protected static\n  resources. This is a distinct issue from\
  \ CVE-2026-39852, which addressed only literal semicolon stripping.\n\n  ### Technical Details\n\
  \n  The security layer (AbstractPathMatchingHttpSecurityPolicy) normalizes request paths using\
  \ Vert.x's normalizedPath(),\n  which only decodes unreserved RFC 3986 characters (letters,\
  \ digits, -, ., _, ~). It then strips matrix parameters by\n  looking for literal ; characters.\
  \ This creates two mismatches:\n\n  1. Encoded semicolons (`%3B`): Since `%3B` is not decoded\
  \ by normalizedPath(), the matrix parameter stripping in\n  pathWithoutMatrixParams() never\
  \ sees it. The encoded semicolon and everything after it become part of the path\n  segment,\
  \ causing policy matching to fail. This affects all path-policy-protected endpoints.\n  2.\
  \ Static resource path mismatch: Static resource handlers (StaticHandlerImpl, FileSystemStaticHandler)\
  \ perform full\n  percent-decoding via URIDecoder.decodeURIComponent() and backslash-to-slash\
  \ conversion before filesystem resolution.\n  Reserved characters like `%2F` (slash) and `%5C`\
  \ (backslash) that survive the security layer's partial decoding are fully\n  decoded before\
  \ file serving.\n\n  REST endpoints using Quarkus REST (RESTEasy Reactive) are not affected\
  \ by the `%2F/%5C` vectors because the routing layer also uses `normalizedPath()` — both security\
  \ and routing agree on the path, so no mismatch exists.\n\n###  Attack Vectors\n\n  Encoded\
  \ semicolon (matrix parameter smuggling), affects all path-policy-protected endpoints:\n \
  \ \n  - `/api/admin%3Bbypass=true/data`: security sees this as a single segment `admin%3Bbypass=true`,\
  \ which does not match the\n   `/api/admin/* policy`. The request passes through unauthenticated.\n\
  \  - `/api/secret%3b/data`: same mechanism with lowercase hex digit.\n\n  Encoded slash/backslash\
  \ on static resources, affects static files behind path policies:\n  - `/static-secret%2Fhtml`,\
  \ security does not match /static-secret.html policy; static handler decodes `%2F` to `/`\
  \ and may\n  resolve the file.\n  - `/static-secret%5Chtml `. static handler decodes `%5C`\
  \ to `\\`, then converts to `/`.\n\n  Double encoding, affects static resources:\n  - `/secret%252Fconfidential.html`,\
  \ first decode by normalizedPath() turns `%25` into `%`, producing `%2F`. Static handler's\n\
  \  second decode turns `%2F` into `/`.\n\n  The following vectors were investigated and confirmed\
  \ not exploitable:\n\n  - Unreserved character encoding (`/api/adm%69n/data`): `normalizedPath()`\
  \ decodes these. Both security and routing see\n  `/api/admin/data`. \n  - Null byte injection\
  \ (`/api/admin%00/data`): `%00` is not decoded by `normalizedPath()`. \n  - Encoded dot segments\
  \ (`/api/%2e%2e/secret/data`): Period is unreserved, so `%2e` is decoded to `.` by `normalizedPath()`,\n\
  \  then `removeDots()` normalizes `..` segments. \n  - REST endpoint bypass via `%2F/%5C`:\
  \ Routing uses the same `normalizedPath()` as security. The encoded slash/backslash\n  doesn't\
  \ match any route. \n\n###   Root Cause\n\n  `pathWithoutMatrixParams()` operates on the partially-decoded\
  \ output of `normalizedPath()`, where reserved characters\n  remain encoded. It searches for\
  \ literal ; but never sees `%3B.` The fix (`normalizePath()`) performs full percent-decoding\n\
  \   in a loop before stripping matrix parameters, removing null bytes, normalizing backslashes,\
  \ and resolving dot\n  segments, aligning the security layer's view of the path with what\
  \ downstream handlers resolve.\n\n###  Impact\n\n  - Unauthenticated access to endpoints protected\
  \ by `quarkus.http.auth.permission` path-based policies via `%3B` smuggling\n  - Static resource\
  \ exposure by bypassing path policies on protected files via `%2F/%5C`\n  - Applications using\
  \ annotation-based security (`@RolesAllowed`, `@Authenticated`) on JAX-RS resources without\
  \ path-based\n  policies are not affected by the `%2F/%5C` vectors, but may still be affected\
  \ by `%3B` if path policies coexist\n\n###  Proof of Concept\n\n```\n  # Encoded semicolon\
  \ bypass — works on any path-policy-protected endpoint\n  # Security sees \"/api/admin%3Bbypass=true/data\"\
  , doesn't match /api/admin/* policy\n  curl -v http://target/api/admin%3Bbypass=true/data\n\
  \n  # Encoded semicolon on authenticated endpoint\n  curl -v http://target/api/secret%3b/data\n\
  \n  # Static resource bypass via encoded slash (if static file behind path policy)\n  curl\
  \ -v http://target/static-secret%2Fhtml\n\n  # Static resource bypass via encoded backslash\n\
  \  curl -v http://target/static-secret%5Chtml\n```"
