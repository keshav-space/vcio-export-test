summary: "Decidim has a cross-site scripting vulnerability in the version control page\n###\
  \ Impact\n\nThe version control feature used in resources is subject to potential cross-site\
  \ scripting (XSS) attack through a malformed URL. \n\n### Workarounds\n\nNot available\n\n\
  ### References\n\nOWASP ASVS v4.0.3-5.1.3\n\n### Credits\n\nThis issue was discovered in a\
  \ security audit organized by [Open Source Politics](https://opensourcepolitics.eu/) against\
  \ Decidim done during July 2025."
