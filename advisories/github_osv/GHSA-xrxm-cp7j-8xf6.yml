summary: "@angular/platform-server: URL Parser Differential leading to SSRF Allowlist Bypass\n\
  An issue in the `@angular/platform-server` package allows remote attackers to bypass host\
  \ allowlist constraints and direct server-side outgoing requests to arbitrary external endpoints.\
  \ This occurs due to a parser differential between the strict WHATWG URL parser used for allowlist\
  \ validation and the lenient Domino URL parser used to initialize the server emulated DOM.\n\
  \nWhen a server-side request contains a malformed URL with a double port structure (e.g.,\
  \ `http://evil.com:80:80/path`), Node's strict `URL.canParse(url)` logic returns `false` and\
  \ skips host check validation entirely. However, the same malformed URL is later accepted\
  \ and parsed leniently by Domino's internal parser, which resolves the origin to `http://evil.com:80`.\
  \ The Angular SSR HTTP request interceptor (`relativeUrlsTransformerInterceptorFn`) then resolves\
  \ all relative backend HTTP requests against this adopted origin, executing the SSRF attack.\n\
  \n### Impact\n\nAny Angular application utilizing server-side rendering (`@angular/platform-server`)\
  \ that configures host routing allowlists (`allowedHosts`) is vulnerable to this allowlist\
  \ bypass. \n\nBy sending an HTTP request with a malformed Host header (e.g. `Host: evil.com:80:80`)\
  \ or an absolute-form request URI, an attacker can bypass the allowlist logic completely (even\
  \ when configured with a strict default deny setup). The SSR application will then route all\
  \ relative `HttpClient` outgoing API queries—which commonly carry sensitive credentials, session\
  \ cookies, and internal authorization tokens—to the attacker-controlled server instead of\
  \ the intended backend services. Additionally, the attacker can supply custom payloads back\
  \ to the emulated DOM, leading to response injection and content poisoning within the rendered\
  \ HTML served to users.\n\n### Attack Preconditions\n\nTo successfully exploit this vulnerability,\
  \ the following environment parameters and application states must all concurrently exist:\n\
  \n1. **Active Server-Side Rendering (SSR):** The application must be configured to run with\
  \ Angular Server-Side Rendering (`@angular/platform-server`).\n2. **Host Header/URI Propagation:**\
  \ The SSR handler must reconstruct the request URL using raw client inputs (such as request\
  \ Host headers or absolute-form URIs) and pass it as `config.url` to the rendering API (`renderApplication`\
  \ or `renderModule`).\n3. **Outbound Relative HTTP Requests:** The server application must\
  \ perform outbound backend API requests using relative paths (e.g., `this.http.get('/api/data')`)\
  \ that undergo base-URL interceptor rewriting.\n4. **Enabled Allowed Hosts Check:** The server\
  \ must use the framework-provided `allowedHosts` options to limit valid server locations.\n\
  \n### Patches\n\n* 22.0.0-rc.2\n* 21.2.15\n* 20.3.22\n* 19.2.23"
