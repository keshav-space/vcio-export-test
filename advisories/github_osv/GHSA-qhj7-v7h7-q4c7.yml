summary: "Glances Vulnerable to Command Injection via Dynamic Configuration Values\n## Summary\n\
  Glances supports dynamic configuration values in which substrings enclosed in backticks are\
  \ executed as system commands during configuration parsing. This behavior occurs in Config.get_value()\
  \ and is implemented without validation or restriction of the executed commands.\n\nIf an\
  \ attacker can modify or influence configuration files, arbitrary commands will execute automatically\
  \ with the privileges of the Glances process during startup or configuration reload. In deployments\
  \ where Glances runs with elevated privileges (e.g., as a system service), this may lead to\
  \ privilege escalation.\n\n## Details\n\n1. Glances loads configuration files from user, system,\
  \ or custom paths during initialization.\n2. When retrieving a configuration value, Config.get_value()\
  \ scans for substrings enclosed in backticks.\n\n   **File: glances/config.py**\n  \n```\n\
  match = self.re_pattern.findall(ret)\nfor m in match:\n    ret = ret.replace(m, system_exec(m[1:-1]))\n\
  ```\n\n\n3. The extracted string is passed directly to system_exec().\n\n   **File: glances/globals.py**\n\
  \   \n   \n```sh\nres = subprocess.run(command.split(' '), stdout=subprocess.PIPE).stdout.decode('utf-8')\n\
  ```\n\n4. The command is executed and its output replaces the original configuration value.\n\
  \nThis execution occurs automatically whenever the configuration value is read.\n\n### Affected\
  \ Files\n\n   glances/config.py — dynamic configuration parsing\n\n   glances/globals.py —\
  \ command execution helper\n\n## Proof of Concept (PoC)\n\nScenario: Arbitrary command execution\
  \ via configuration value\n\n**Step 1 — Create malicious configuration file**\n\n```sh\n/tmp/glances.conf\n\
  ```\n\nadd below txt on the file\n\n```\n[outputs]\nurl_prefix = 'id'\n```\n\n**Step 2 — Launch\
  \ Glances with custom configuration**\n\n```sh\nglances -C /tmp/glances.conf\n```\n\n**Step\
  \ 3 — Observe behavior**\n\nWhen Glances reads the configuration:\n\n  - The command inside\
  \ backticks is executed\n  - Output replaces the configuration value\n  - Execution occurs\
  \ without user interaction\n  \n  \n  Reproduce using  Python code\n  \n  \n```\nimport subprocess\n\
  import re\n\ndef system_exec(command):\n    return subprocess.run(command.split(' '), stdout=subprocess.PIPE).stdout.decode().strip()\n\
  \nvalue = \"`id`\"\npattern = re.compile(r'(`.+?`)')\n\nfor m in pattern.findall(value):\n\
  \    print(system_exec(m[1:-1]))\n```\n\n**Output:**\n\n\n`uid=1000(user) gid=1000(user) groups=1000(user)`\n\
  \n## Impact\n\n### Arbitrary Command Execution\n\nAny command enclosed in backticks inside\
  \ a configuration value will execute with the privileges of the Glances process.\n\n### Potential\
  \ Privilege Escalation\n\nIf Glances runs as a privileged service (e.g., root), commands execute\
  \ with those privileges.\n\nPossible scenarios include:\n\n-   Misconfigured file permissions\
  \ allowing unauthorized config modification\n-   Shared systems where configuration directories\
  \ are writable by multiple users\n-   Container environments with mounted configuration volumes\n\
  -   Automated configuration management systems that ingest untrusted data"
