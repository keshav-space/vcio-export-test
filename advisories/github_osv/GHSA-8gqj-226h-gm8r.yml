  - CVE-2025-46573
summary: "Passport-wsfed-saml2 allows SAML Authentication Bypass via Attribute Smuggling\n###\
  \ Overview\nThis vulnerability allows an attacker to impersonate any user during SAML authentication\
  \ by tampering with a valid SAML response. This can be done by adding attributes to the response.\n\
  \n### Am I Affected?\nYou are affected by this SAML Attribute Smuggling vulnerability if you\
  \ are using `passport-wsfed-saml2` version 4.6.3 or below, specifically under the following\
  \ conditions:\n1. The service provider is using `passport-wsfed-saml2`, \n2. A valid SAML\
  \ Response signed by the Identity Provider can be obtained\n\n### Fix\nUpgrade to v4.6.4 or\
  \ greater."
