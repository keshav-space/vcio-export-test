summary: "Decidim: HTML content blocks allow stored script execution\n## Description\n \nA privileged\
  \ admin user who can edit an affected landing page can store arbitrary HTML/JavaScript in\
  \ an `HTML block`, and the public page renders it with `html_safe` and no output escaping.\n\
  \n## Technical description\n    \nThis issue lets any admin who can edit an affected landing\
  \ page store arbitrary HTML and JavaScript in an `HTML block`. The block is then rendered\
  \ back through `Decidim::ContentBlocks::HtmlCell#html_content` without a sanitization boundary,\
  \ so the script executes later in visitor's browsers.\n\n<img width=\"1541\" height=\"439\"\
  \ alt=\"decidim-html-xss-01\" src=\"https://github.com/user-attachments/assets/acae1c06-8acb-49be-ab12-aabae33190ce\"\
  \ />\n\n<img width=\"1540\" height=\"752\" alt=\"decidim-html-xss-02\" src=\"https://github.com/user-attachments/assets/a2f1fa7f-03f3-4d17-b58b-f4db865443e9\"\
  \ />\n\n\n### Impact\n\n- A user with landing-page editing rights for an affected scope can\
  \ persist JavaScript that executes in visitor's browsers on that page.\n- Because exploitation\
  \ already requires privileged administrative access, the practical risk is lower than a participant-controlled\
  \ or unauthenticated stored XSS. It still creates a browser-execution primitive in a trusted\
  \ admin-editable surface.\n\n### Patches\n\nSee https://github.com/decidim/decidim/pull/16451\
  \ \n\n### Workarounds\n\nDo not give admin permissions to non-trustful users. \n\n### Reference\n\
  \nStored XSS\n\n### Credits\n\nThis issue was discovered in a security audit organized by\
  \ the [Decidim Association](https://decidim.org) and made by [Radically Open Security](https://www.radicallyopensecurity.com/)\
  \ against Decidim financed by [NGI](https://ngi.eu/)."
