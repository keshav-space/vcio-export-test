  - CVE-2026-47156
summary: "MantisBT: SOAP API Authentication Bypass with Privilege Escalation to Administrator\n\
  MantisBT 2.28.3 and earlier contains a critical authentication bypass in the SOAP API's mci_check_login()\
  \ function. Any user knowing any valid cookie_string can authenticate as any other user (knowing\
  \ their username), including the administrator, without knowing the target's password.\n\n\
  The vulnerability is exploitable with zero prior access on default MantisBT installations\
  \ because self-registration is enabled by default ($g_allow_signup = ON). A self-registered\
  \ user can use their own cookie_string (readable from their browser's MANTIS_STRING_COOKIE\
  \ cookie after login) to impersonate the administrator via the SOAP API.\n\nThe REST API is\
  \ NOT affected. The REST API's AuthMiddleware derives the username server-side from the API\
  \ token or session cookie, so the username cannot be spoofed.\n\nThe Web UI is NOT affected.\
  \ The Web UI authenticates via PHP session cookies (PHPSESSID) and validates the MANTIS_STRING_COOKIE\
  \ against the logged-in user through auth_is_cookie_valid(). The username is derived server-side\
  \ from the cookie, not supplied by the client.\n\n### Impact\n- Full administrator access\
  \ to the SOAP API from zero prior access (with self-registration enabled, which is the default)\n\
  - Read/write all issues including private issues and notes across all projects\n- Full data\
  \ exfiltration of all bug reports, attachments, user accounts (id, name, email), and non-private\
  \ configuration values via the 71 SOAP operations available\n- Destructive operations: delete\
  \ projects, issues, attachments, tags, categories, and versions\n- Data manipulation: create/modify\
  \ issues, impersonate reporters, manage project structure\n- Chains with other vulnerabilities:\
  \ the SOAP admin access enables exploitation of SOAP vulnerabilities that require administrator\
  \ privileges\n\n### Patches\n- https://github.com/mantisbt/mantisbt/commit/e3571c319b1721b41b0dc4b5b5203cbdcbe0c2ee\n\
  \n### Workarounds\nNone\n\n### Resources\n- https://mantisbt.org/bugs/view.php?id=37121\n\n\
  ### Credits\nMantisBT would like to thank McCaulay Hudson ([@_McCaulay](https://x.com/_mccaulay))\
  \ of [watchTowr](https://labs.watchtowr.com/) for originally identifying and responsibly reporting\
  \ the issue.\n\nThe vulnerability  was subsequently discovered by other researchers, while\
  \ the team was working on fixing and preparing the release. MantisBT credits them here, in\
  \ chronological order of their reports: \n- Keitaro Yamazaki (@tyage) \n- Harrison Keating\
  \ (@voraci0us)\n- Chandler Johnson (@chndlrx)\n- Bharat Devasani (@bharatdevasani)"
