advisory_id: GHSA-v853-w46p-fv2h
datasource_id: github_osv/GHSA-v853-w46p-fv2h
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/06/GHSA-v853-w46p-fv2h/GHSA-v853-w46p-fv2h.json
aliases:
  - CVE-2026-45505
summary: "Apache ActiveMQ Broker, Apache ActiveMQ All, Apache ActiveMQ have a Code Injection\
  \ issue\nImproper Input Validation, Improper Control of Generation of Code ('Code Injection')\
  \ vulnerability in Apache ActiveMQ Broker, Apache ActiveMQ All, Apache ActiveMQ.\n\n\nNon-parenthesized\
  \ discovery wrappers such as `masterslave:vm://...,...`\nand `static:vm://...` incorrectly\
  \ pass validation allowing bypass of fix in CVE-2026-34197. \n\nOriginal description from CVE-2026-34197.\n\
  \nApache ActiveMQ exposes the Jolokia JMX-HTTP bridge at /api/jolokia/ on the web console.\
  \ The default Jolokia access policy permits exec operations on all ActiveMQ MBeans (org.apache.activemq:*),\
  \ including BrokerService.addNetworkConnector(String) and BrokerService.addConnector(String). An\
  \ authenticated attacker can invoke these operations with a crafted discovery UR that triggers\
  \ the VM transport's brokerConfig parameter to load a remote Spring XML application context\
  \ using ResourceXmlApplicationContext. Because Spring's ResourceXmlApplicationContext instantiates\
  \ all singleton beans before the BrokerService validates the configuration, arbitrary code\
  \ execution occurs on the broker's JVM through bean factory methods such as Runtime.exec().\
  \ \nThis issue affects Apache ActiveMQ Broker: before 5.19.7, from 6.0.0 before 6.2.6; Apache\
  \ ActiveMQ All: before 5.19.7, from 6.0.0 before 6.2.6; Apache ActiveMQ: before 5.19.7, from\
  \ 6.0.0 before 6.2.6.\n\nUsers are recommended to upgrade to version 5.19.7 or 6.2.6, which\
  \ fixes the issue."
