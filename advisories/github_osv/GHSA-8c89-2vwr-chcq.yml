summary: "Heap buffer overflow in `QuantizedResizeBilinear`\n### Impact\nAn attacker can cause\
  \ a heap buffer overflow in `QuantizedResizeBilinear` by passing in invalid thresholds for\
  \ the quantization:\n\n```python\nimport tensorflow as tf\n\nimages = tf.constant([], shape=[0],\
  \ dtype=tf.qint32)\nsize = tf.constant([], shape=[0], dtype=tf.int32) \nmin = tf.constant([],\
  \ dtype=tf.float32)\nmax = tf.constant([], dtype=tf.float32)\n\ntf.raw_ops.QuantizedResizeBilinear(images=images,\
  \ size=size, min=min, max=max, align_corners=False, half_pixel_centers=False)\n```\n\nThis\
  \ is because the [implementation](https://github.com/tensorflow/tensorflow/blob/50711818d2e61ccce012591eeb4fdf93a8496726/tensorflow/core/kernels/quantized_resize_bilinear_op.cc#L705-L706)\
  \ assumes that the 2 arguments are always valid scalars and tries to access the numeric value\
  \ directly:\n\n```cc\nconst float in_min = context->input(2).flat<float>()(0);\nconst float\
  \ in_max = context->input(3).flat<float>()(0);\n```\n\nHowever, if any of these tensors is\
  \ empty, then `.flat<T>()` is an empty buffer and accessing the element at position 0 results\
  \ in overflow.\n\n### Patches \nWe have patched the issue in GitHub commit [f6c40f0c6cbf00d46c7717a26419f2062f2f8694](https://github.com/tensorflow/tensorflow/commit/f6c40f0c6cbf00d46c7717a26419f2062f2f8694).\n\
  \nThe fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow\
  \ 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected\
  \ and still in supported range.\n\n### For more information\nPlease consult [our security\
  \ guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md) for more information\
  \ regarding the security model and how to contact us with issues and questions.\n\n### Attribution\n\
  This vulnerability has been reported by Ying Wang and Yakun Zhang of Baidu X-Team."
