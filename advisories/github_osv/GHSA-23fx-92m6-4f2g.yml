exploits:
  - description: This module exploits CVE-2023-28458, a limited file write in Pretalx, up to
      version 2.3.1. The module will use the vulnerability to write a malicious site-specific
      configuration hook forPython. Once hook is written, payload will be executed every time
      Pretalx user runs any Python code. Pretalx needs to run in debug mode to exploit this.
    required_action:
    due_date:
    notes: |
