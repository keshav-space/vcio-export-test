exploits:
  - description: |
      This module exploits a Remote Code Execution (RCE) vulnerability in Ghost CMS.
                Specifically crafted malicious themes can execute arbitrary code on the server running Ghost.

                The affected versions include all releases from 0.7.2 up to and including 6.19.0.
                For versions 5.105.0-5.130.5 and 6.0.0-6.10.3, the module also leverages a 2FA bypass.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability:
