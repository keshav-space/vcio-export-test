summary: "CoreWCF: Kafka consume pump halts permanently on a Kafka tombstone (null-value record),\
  \ causing persistent endpoint denial of service.\n### Impact\nA CoreWCF service is running\
  \ and listening on a Kafka topic receiving a null-value record will stop processing new records\
  \ from that topic.\n\n#### Preconditions\nThe attacker has produce/write permission on a topic\
  \ that CoreWCF is consuming from. If the broker permits anonymous publishes, no authentication\
  \ is required. \n\n### Patches\nFixed in CoreWCF v1.8.1 and v1.9.1\n\n### Workarounds\nOnly\
  \ allow authenticated writes to a topic"
