summary: "Ghost: Mobiledoc image-size fetch SSRF\n### Impact\n\nWhen re-rendering posts, Ghost\
  \ would refetch missing image dimensions by issuing an outbound HTTP request to the URL stored\
  \ on an image card — without restricting that URL to trusted image hosts. An authenticated\
  \ staff user able to create or edit posts could therefore point an image card at an attacker-chosen\
  \ host and cause the Ghost server to request it on their behalf, including hosts on internal\
  \ networks or cloud instance metadata endpoints that would not normally be reachable from\
  \ the public internet.\n\n### Vulnerable versions\n\nThis vulnerability is present in Ghost\
  \ from v6.19.3 up to v6.21.0.\n\n### Patches\n\nv6.21.1 contains a fix for this issue.\n\n\
  ### How to update\n\nFor self-hosters using Docker, find [Docker's official Ghost image here](https://hub.docker.com/_/ghost).\
  \ Updating a Docker-based Ghost instance [is documented here](https://docs.ghost.org/install/docker#updating-ghost).\
  \ \n\nIf your Ghost is a Ghost-CLI install see our documentation on [updating it to the latest\
  \ version here](https://docs.ghost.org/update). \n\n### For more information\n\nIf you have\
  \ any questions or comments about this advisory, email us at [security@ghost.org](mailto:security@ghost.org)."
