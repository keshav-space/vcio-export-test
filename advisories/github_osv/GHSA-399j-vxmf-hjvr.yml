exploits:
  - description: React Native Community CLI contains an OS command injection vulnerability which
      could allow unauthenticated network attackers to send POST requests to the Metro Development
      Server and run arbitrary executables via a vulnerable endpoint exposed by the server.
      On Windows, attackers can also execute arbitrary shell commands with fully controlled
      arguments.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2026-02-26'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
