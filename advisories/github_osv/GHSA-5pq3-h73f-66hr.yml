aliases: []
summary: "AWS CDK CodePipeline: trusted entities are too broad\n### Summary\n\nThe [AWS Cloud\
  \ Development Kit (CDK)](https://aws.amazon.com/cdk/) is an open-source framework for defining\
  \ cloud infrastructure using code. Users use it to create their own applications, which are\
  \ converted to AWS CloudFormation templates during deployment to a user's AWS account. AWS\
  \ CDK contains pre-built components called \"constructs,\" which are higher-level abstractions\
  \ providing defaults and best practices. This approach enables developers to use familiar\
  \ programming languages to define complex cloud infrastructure more efficiently than writing\
  \ raw CloudFormation templates.\n\nThe [AWS CodePipeline](https://aws.amazon.com/codepipeline/)\
  \ construct deploys CodePipeline, a managed service that orchestrates software release processes\
  \ through a series of stages, each comprising one or more actions executed by CodePipeline.\
  \ To perform these actions, CodePipeline assumes IAM roles with permissions necessary for\
  \ each step, allowing it to interact with AWS services and resources on behalf of the user.\n\
  \nAn issue exists where, when using CDK to create a CodePipeline with the CDK Construct Library,\
  \ CDK creates an AWS Identity and Access Management (AWS IAM) trust policy with overly broad\
  \ permissions. Any user with unrestricted sts:AssumeRole permissions could assume that trust\
  \ policy. This issue does not affect users who supply their own role for CodePipeline.\n\n\
  ### Impact\nTo leverage the issue, an actor has to be authenticated in the account and have\
  \ an unrestricted sts:AssumeRole permission. The permissions an actor could leverage depend\
  \ on the actions added to the pipeline. Possible permissions include actions on services such\
  \ as CloudFormation, CodeCommit, Lambda, and ECS, as well as access to the S3 bucket holding\
  \ pipeline build artifacts ([see documentation](https://docs.aws.amazon.com/cdk/api/v2/docs/aws-cdk-lib.aws_codepipeline_actions-readme.html)).\
  \ \n\nUsers can review their AWS CloudTrail logs for when the role was assumed to determine\
  \ if this was expected. \n\n#### Impacted versions: <v2.189.0\n\n### Patches\nThe patches\
  \ are included in the CDK Construct Library release [v2.189.0](https://github.com/aws/aws-cdk/releases/tag/v2.189.0).\
  \ We recommend upgrading to the latest version and ensuring any forked or derivative code\
  \ is patched to incorporate the new fixes. \n\nWhen new CDK applications using the latest\
  \ version are initialized, they will use the new behavior with more restrictive permissions.\n\
  \nExisting applications must upgrade to the latest version, change the [feature flag](https://github.com/aws/aws-cdk/blob/main/packages/aws-cdk-lib/cx-api/FEATURE_FLAGS.md)\
  \ (@aws-cdk/pipelines:reduceStageRoleTrustScope)  and (@aws-cdk/pipelines:reduceCrossAccountActionRoleTrustScope)\
  \ to true and redeploy the application to apply this fix and use the new behavior with more\
  \ restrictive permissions.\n\n### Workarounds\nYou can explicitly supply the role for your\
  \ [CodePipeline](https://docs.aws.amazon.com/cdk/api/v2/docs/aws-cdk-lib.aws_codepipeline-readme.html#cross-account-codepipelines)\
  \ and follow the policy recommendations detailed in [CodePipeline documentation](https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html).\n\
  \n### References\n[Original reporting issue.](https://github.com/aws/aws-cdk/issues/33709)\n\
  \n\n\nIf you have any questions or comments about this advisory please contact AWS/Amazon\
  \ Security via our [vulnerability reporting page](https://aws.amazon.com/security/vulnerability-reporting)\
  \ or directly via email to [aws-security@amazon.com](mailto:aws-security@amazon.com). Please\
  \ do not create a public GitHub issue."
