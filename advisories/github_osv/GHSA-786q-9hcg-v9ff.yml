summary: "Argo CD's Project API Token Exposes Repository Credentials\n### Summary\nArgo CD API\
  \ tokens with project-level permissions are able to retrieve sensitive repository credentials\
  \ (usernames, passwords) through the project details API endpoint, even when the token only\
  \ has standard application management permissions and no explicit access to secrets.\n\nComponent:\
  \ `Project API (/api/v1/projects/{project}/detailed)`\n\n\n## Vulnerability Details\n### Expected\
  \ Behavior\nAPI tokens should require explicit permission to access sensitive credential information.\
  \ Standard project permissions should not grant access to repository secrets.\n### Actual\
  \ Behavior\nAPI tokens with basic project permissions can retrieve all repository credentials\
  \ associated with a project through the detailed project API endpoint.\n\n**Note**: This vulnerability\
  \ does not only affect project-level permissions. Any token with project get permissions is\
  \ also vulnerable, including global permissions such as: `p, role/user, projects, get, *,\
  \ allow`\n\n### Steps to Reproduce\n\n1. Create an API token with the following project-level\
  \ permissions:\n  ```\n  p, proj:myProject:project-automation-role, applications, sync, myProject/*,\
  \ allow\n  p, proj:myProject:project-automation-role, applications, action/argoproj.io/Rollout/*,\
  \ myProject/*, allow\n  p, proj:myProject:project-automation-role, applications, get, myProject/*,\
  \ allow\n  ```\n\n2. Call the project details API:\n  ```\n  bashcurl -sH \"Authorization:\
  \ Bearer $ARGOCD_API_TOKEN\" \\\n    \"https://argocd.example.com/api/v1/projects/myProject/detailed\"\
  \n  \n  ```\n3. Observe that the response includes sensitive repository credentials:\n  ```\n\
  \  {\n    \"repositories\": [\n      {\n        \"username\": \"<REDACTED>\",\n        \"\
  password\": \"<REDACTED>\",\n        \"type\": \"helm\",\n        \"name\": \"test-helm-repo\"\
  ,\n        \"project\": \"myProject\"\n      }\n    ]\n  }\n  ```\n\n## Patches\n\n* v3.1.2\n\
  * v3.0.14\n* v2.14.16\n* v2.13.9\n\n\nCredits to @ashishgoyal111 for helping identify this\
  \ issue."
