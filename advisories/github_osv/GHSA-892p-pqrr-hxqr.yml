summary: "Information Disclosure via Flags override link\n## Summary\n\nAn information disclosure\
  \ vulnerability affecting Flags SDK has been addressed. It impacted `flags` ≤3.2.0 and `@vercel/flags`\
  \ ≤3.1.1 and in certain circumstances, allowed a bad actor with detailed knowledge of the\
  \ vulnerability to list all flags returned by the flags discovery endpoint (`.well-known/vercel/flags`).\n\
  \n## Impact\n\nThis vulnerability allowed for information disclosure, where a bad actor could\
  \ gain access to a list of all feature flags exposed through the flags discovery endpoint,\
  \ including the:\n\n- Flag names\n- Flag descriptions\n- Available options and their labels\
  \ (e.g. `true`, `false`)\n- Default flag values\n\nNot impacted:\n\n- Flags providers were\
  \ not accessible\n\nNo write access nor additional customer data was exposed, this is limited\
  \ to just the values noted above. Vercel has automatically mitigated this incident on behalf\
  \ of our customers for the default flags discovery endpoint at `.well-known/vercel/flags`.\
  \ Flags Explorer will be disabled and show a warning notice until upgraded to `flags@4.0.0`.\n\
  \n## Resolution\n\nThe `verifyAccess` function was patched within `flags@4.0.0`. \n\nUsers\
  \ of `@vercel/flags` should also migrate to `flags@4.0.0`.\n\nFor further guidance on upgrading\
  \ your version, please see our [upgrade guide](https://github.com/vercel/flags/blob/main/packages/flags/guides/upgrade-to-v4.md).\n\
  \n## Mitigations\n\nVercel implemented a network-level mitigation to prevent the default flags\
  \ discovery endpoint at `/.well-known/vercel/flags` being reachable, which automatically protects\
  \ Vercel deployments against exploitation of this issue. Users need to upgrade to `flags@4.0.0`\
  \ to re-enable the Flags Explorer.\n\nThis automatic mitigation is not effective in two scenarios:\n\
  \n- When using the Flags SDK on Pages Router, as the original non-rewritten route would still\
  \ be accessible, e.g. `/api/vercel/flags`.\n- When using a custom path for the flags discovery\
  \ endpoint.\n\nIf you are not protected by the Vercel default mitigation you can temporarily\
  \ deny access to the other exposed flags discovery endpoints through a custom WAF rule while\
  \ you upgrade to the latest version.\n\n## References\n\n- https://vercel.com/changelog/information-disclosure-in-flags-sdk-cve-2025-46332\n\
  - https://github.com/vercel/flags/blob/main/packages/flags/guides/upgrade-to-v4.md"
