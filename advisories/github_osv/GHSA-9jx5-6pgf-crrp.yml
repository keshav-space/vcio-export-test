summary: |
  Withdrawn: scipy memory leak vulnerability
  ## Withdrawn Advisory

  This advisory has been withdrawn because it has been found to not be an issue. Please see the issue [here](https://github.com/scipy/scipy/issues/16235#issuecomment-1625361328) for more information.

  ## Original Description

  A refcounting issue which leads to potential memory leak was discovered in scipy commit 8627df31ab in `Py_FindObjects()` function.
