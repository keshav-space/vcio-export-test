summary: "Gin-vue-admin has arbitrary file upload vulnerability caused by path traversal\n###\
  \ Impact\nGin-vue-admin <= v2.8.7 has a path traversal vulnerability in the breakpoint resume\
  \ upload functionality. Attacker can upload any files on any directory.\n\nPath traversal\
  \ vulnerabilities occur when a web application accepts user-supplied file paths without proper\
  \ validation, allowing attackers to access or write files outside the intended directory.\
  \ In the breakpoint_continue.go file, the MakeFile function accepts a fileName parameter through\
  \ the /fileUploadAndDownload/breakpointContinueFinish API endpoint and directly concatenates\
  \ it with the base directory path (./fileDir/) using os.OpenFile() without any validation\
  \ for directory traversal sequences (e.g., ../).\n\nNotably, while the related makeFileContent\
  \ function in the same file properly validates the fileName parameter by checking for .. sequences,\
  \ the MakeFile function lacks this security control, indicating an inconsistent security implementation.\n\
  \nAn **attacker with file upload privileges (role ID 888 - super administrator)** could exploit\
  \ this vulnerability by:\n\nFirst uploading file chunks through the /fileUploadAndDownload/breakpointContinue\
  \ endpoint (which has proper validation)\n\nThen calling the /fileUploadAndDownload/breakpointContinueFinish\
  \ endpoint with a malicious fileName parameter containing path traversal sequences (e.g.,\
  \ ../../../tmp/malicious.txt)\n\nThis could lead to:\nArbitrary file creation, application\
  \ process, Configuration file overwriting, Potential Remote Code Execution......\n\n### POC\n\
  1. Use this endpoint to upload any files(include *name or *file types)\n<img width=\"1429\"\
  \ height=\"788\" alt=\"Clipboard_Screenshot_1767755216\" src=\"https://github.com/user-attachments/assets/516022d6-32af-4810-abd9-945cb0bc5ae5\"\
  \ />\n\n2. Then, the `filename` parameter here uses `../` to traverse to an arbitrary path.\
  \ \n<img width=\"1445\" height=\"306\" alt=\"Clipboard_Screenshot_1767755256\" src=\"https://github.com/user-attachments/assets/577aa1c1-9b26-4082-b431-f9dac1cdc307\"\
  \ />\n\n3. Proof\n<img width=\"837\" height=\"843\" alt=\"Clipboard_Screenshot_1767755312\"\
  \ src=\"https://github.com/user-attachments/assets/66f51049-8dc8-4c94-994e-a6d8bc1196a9\"\
  \ />\n\n\n### Patches\nPlease wait for the latest patch"
