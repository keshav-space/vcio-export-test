summary: "Document Merge Service vulnerable to RCE via SSTI (xlsx tempaltes)\n### Impact\nA\
  \ remote code execution (RCE) via server-side template injection (SSTI) allows for user supplied\
  \ code to be executed in the server's context where it is executed as the document-merge-server\
  \ user with the UID 901 thus giving an attacker considerable control over the container. The\
  \ vulnerability is limited to XLSX templates, were the `xltpl` library uses a npn-sandboxed\
  \ Jinja environment  for the processing of the template. \n\n### Patches\nIt has been patched\
  \ in [v9.1.0](https://github.com/adfinis/document-merge-service/releases/tag/v9.1.0)\n\n###\
  \ Workarounds\nDisable the upload/usage of XLSX templates.\n\n### References\nAre there any\
  \ links users can visit to find out more?\n\nhttps://book.hacktricks.xyz/pentesting-web/ssti-server-side-template-injection/jinja2-ssti"
