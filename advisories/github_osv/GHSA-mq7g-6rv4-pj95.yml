summary: "Downloads Resources over HTTP in embedza\nAffected versions of `embedza` insecurely\
  \ download an executable over an unencrypted HTTP connection. \n\nIn scenarios where an attacker\
  \ has a privileged network position, it is possible to intercept the response and replace\
  \ the executable with a malicious one, resulting in code execution on the system running `embedza`.\n\
  \n\n## Recommendation\n\nUpdate to version 1.2.4 or later."
