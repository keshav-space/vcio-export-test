summary: "PMD Designer's release key passphrase (GPG) available on Maven Central in cleartext\n\
  ### Summary\nWhile rebuilding [PMD Designer](https://github.com/pmd/pmd-designer) for Reproducible\
  \ Builds and digging into issues, I found out that passphrase for `gpg.keyname=0xD0BF1D737C9A1C22`\
  \ is included in jar published to Maven Central.\n\n### Details\nSee https://github.com/jvm-repo-rebuild/reproducible-central/blob/master/content/net/sourceforge/pmd/pmd-designer/README.md\n\
  \nI removed 2 lines from https://github.com/jvm-repo-rebuild/reproducible-central/blob/master/content/net/sourceforge/pmd/pmd-designer/pmd-designer-7.0.0.diffoscope\
  \ but real content is:\n\n```\n├── net/sourceforge/pmd/util/fxdesigner/designer.properties\n\
  │ @@ -1,14 +1,12 @@\n│  #Properties\n│  checkstyle.plugin.version=3.3.1\n│  checkstyle.version=10.14.0\n\
  │ -gpg.keyname=0xD0BF1D737C9A1C22\n│ -gpg.passphrase=evicx0nuPfvSVhVyeXpw\n│  jar.plugin.version=3.3.0\n\
  │ -java.version=11.0.22\n│ +java.version=11.0.25\n│  javadoc.plugin.version=3.6.3\n│  jflex-output=/home/runner/work/pmd-designer/pmd-designer/target/generated-sources/jflex\n\
  │  junit5.version=5.8.2\n│  kotest.version=5.5.5\n│  kotlin.version=1.7.20\n│  local.lib.repo=/home/runner/work/pmd-designer/pmd-designer/lib/mvn-repo\n\
  │  openjfx.scope=provided\n```\n\n### PoC\n```\n./rebuild.sh content/net/sourceforge/pmd/pmd-designer/pmd-designer-7.0.0.buildspec\n\
  ```\n\n### Impact\nAfter further analysis, the passphrase of the following two keys have been\
  \ compromised:\n\n1. `94A5 2756 9CAF 7A47 AFCA  BDE4 86D3 7ECA 8C2E 4C5B`: PMD Designer (Release\
  \ Signing Key) <releases@pmd-code.org>\n   This key has been used since 2019 with the release\
  \ of [net.sourceforge.pmd:pmd-ui:6.14.0](https://repo.maven.apache.org/maven2/net/sourceforge/pmd/pmd-ui/6.14.0/).\n\
  \   The following versions are signed with the same key: 6.16.0, 6.17.0, 6.19.0.\n2. `EBB2\
  \ 41A5 45CB 17C8 7FAC  B2EB D0BF 1D73 7C9A 1C22`: PMD Release Signing Key <releases@pmd-code.org>\n\
  \   This key has been used since 2020 with the release of [net.sourceforge.pmd:pmd-ui:6.21.0](https://repo.maven.apache.org/maven2/net/sourceforge/pmd/pmd-ui/6.21.0/)\n\
  \   and all the other modules of PMD such as [net.sourceforge.pmd:pmd-core:6.21.0](https://repo.maven.apache.org/maven2/net/sourceforge/pmd/pmd-core/6.21.0/).\
  \  \n   This key has also been used for PMD 7, for the designer, e.g. [net.sourceforge.pmd:pmd-designer:7.0.0](https://repo.maven.apache.org/maven2/net/sourceforge/pmd/pmd-designer/7.0.0/)\n\
  \   and [net.sourceforge.pmd:pmd-core:7.0.0](https://repo.maven.apache.org/maven2/net/sourceforge/pmd/pmd-core/7.0.0/).\n\
  \   The versions between 6.21.0 and 7.9.0 are signed with this key.  \n   Additionally the\
  \ key has been used to sign the last release of [PMD Eclipse Plugin 7.9.0.v20241227-1626-r](https://github.com/pmd/pmd-eclipse-plugin/releases/tag/7.9.0.v20241227-1626-r).\n\
  \nThe keys have been used exclusively for signing artifacts that we published to Maven Central\
  \ under group id `net.sourceforge.pmd` and once for our pmd-eclipse-plugin. The private key\
  \ itself is not known to have been compromised itself, but given its passphrase is, it must\
  \ also be considered potentially compromised.\n\nAs a mitigation, both compromised keys have\
  \ been revoked so that no future use of the keys are possible.\nFor future releases of PMD,\
  \ PMD Designer and PMD Eclipse Plugin we use a new release signing key:\n`2EFA 55D0 785C 31F9\
  \ 56F2  F87E A0B5 CA1A 4E08 6838` (PMD Release Signing Key <releases@pmd-code.org>).\n\nNote,\
  \ that the published artifacts in Maven Central under the group id `net.sourceforge.pmd` are\
  \ **not**\ncompromised and the signatures are valid. No other past usages of the private key\
  \ is known to the project\nand no future use is possible due to the revocation. If anybody\
  \ finds a past abuse of the private key,\nplease share with us.\n\nNote, the module `net.sourceforge.pmd:pmd-ui`\
  \ has been renamed to `net.sourceforge.pmd:pmd-designer` since PMD 7, so there won't be a\
  \ fixed version for `pmd-ui`.\n\n### Fixes\n* Reworked build script in PMD Designer to not\
  \ include all system properties\n  * https://github.com/pmd/pmd-designer/commit/1548f5f27ba2981b890827fecbd0612fa70a0362\n\
  \  * https://github.com/pmd/pmd-designer/commit/e87a45312753ec46b3e5576c6f6ac1f7de2f5891\n\
  \n### References\n\n* [GHSA-88m4-h43f-wx84](https://github.com/pmd/pmd/security/advisories/GHSA-88m4-h43f-wx84)\n\
  * [CVE-2025-23215](https://www.cve.org/CVERecord?id=CVE-2025-23215)\n* [reproducible-central](https://github.com/jvm-repo-rebuild/reproducible-central?tab=readme-ov-file#reproducible-builds-for-maven-central-repository)"
