summary: "Craft CMS Stored Cross-site Scripting Injection Vulnerability\n### Summary\n_When\
  \ you insert a payload inside a label name or instruction of an entry type, an XSS happens\
  \ in the quick post widget on the \nadmin dashboard._\n\n\n\n### PoC\n[_Complete instructions,\
  \ including specific configuration details, to reproduce the vulnerability._](https://user-images.githubusercontent.com/53917092/215604129-d5b75608-5a24-4eb3-906f-55b192310298.mp4)\n\
  \n### Impact\nTested with the free version of Craft CMS 4.3.6.1"
