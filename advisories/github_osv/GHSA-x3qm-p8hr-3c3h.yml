  - CVE-2026-45666
summary: "Open WebUI has an Indirect Object Reference (IDOR) in user notes\n### Summary\nThe\
  \  API /api/v1/notes/{note_id} endpoint lacks proper authorization checks, allowing authenticated\
  \ users to retrieve notes belonging to other users by guessing or enumerating UUIDs. This\
  \ results in unauthorized disclosure of potentially sensitive or private user data.\n\n###\
  \ Details\n- if notes is enabled from UI (Settings >> General >> Features >> Notes (Beta))\n\
  \   - From API, attacker can access other user notes\n- if notes is disabled from UI (Settings\
  \ >> General >> Features >> Notes (Beta))\n   - Then attacker can enable the notes from /api/config\
  \ and access other user notes \n\n### PoC\n- Step 1: Log in to the application as a valid\
  \ user (User A).\n![image](https://github.com/user-attachments/assets/3c4625f9-6e51-4cd1-942e-6a3f467520c0)\n\
  \n- Step 2: Intercept or inspect the response from the endpoint GET /api/config.\n![image](https://github.com/user-attachments/assets/7c4fe716-314c-4640-bc9f-1e11ddc2273d)\n\
  \n- Step 3: Observe the field \"enable_notes\": false in the JSON response.\n- Step 4: Manually\
  \ change \"enable_notes\" to true using browser DevTools or by intercepting and modifying\
  \ the response via a proxy like Burp Suite. (Please note, the occurrence of this API comes\
  \ twice, hence modification needs to be made twice as well.)\n![image](https://github.com/user-attachments/assets/99575570-a673-4508-b149-9a2480d8f62e)\n\
  \n- Step 5: Observe the loaded frontend application; the previously hidden notes form will\
  \ now be visible.\n![image](https://github.com/user-attachments/assets/a4059b1f-2e77-4f29-88a3-431e82b7c41d)\n\
  \n![image](https://github.com/user-attachments/assets/55e601d7-b013-43e3-a070-3a80f166e777)\n\
  \n- Step 6: Again, click on any note, intercept the request, and Replace the note_id in the\
  \ URL with a different note ID known to belong to another user (e.g., by guessing or bruteforcing).\n\
  - Step 7: Send the modified request while remaining logged in as User A.\n- Step 8: Observe\
  \ that the server returns the content of another user's note, confirming unauthorized access.\n\
  ![image](https://github.com/user-attachments/assets/cbec4ab5-a8a8-488a-a984-03e8de5b22f7)\n\
  ![image](https://github.com/user-attachments/assets/046cd925-7299-44ba-bfc3-d6e7071d29d1)\n\
  \n\n### Impact\n1. Unauthorized access to user-created notes\n2. Possible exposure of confidential\
  \ or sensitive uploaded data\n3. Violation of user privacy and data isolation\n4. High risk\
  \ of legal or compliance breaches in regulated environments\n\n## Resolution\n\nFixed in commit\
  \ [de3317e26](https://github.com/open-webui/open-webui/commit/de3317e26bb67a2a7ea015a183bbd1d369880ebd),\
  \ first released in **v0.8.11** (Mar 2026). All per-id note endpoints (`GET /api/v1/notes/{id}`,\
  \ `POST /api/v1/notes/{id}/update`, `POST /api/v1/notes/{id}/access/update`, deletion) now\
  \ enforce ownership: the handler fetches the note, then requires the caller to be admin, the\
  \ note owner, or have an `AccessGrants` grant for the appropriate permission (`read` for retrieval,\
  \ `write` for mutation). A non-owner with no grant receives 403.\n\nUsers on `>= 0.8.11` are\
  \ not affected."
