aliases:
  - CVE-2023-26920
summary: "fast-xml-parser vulnerable to Prototype Pollution through tag or attribute name\n\
  ### Impact\nAs a part of this vulnerability, user was able to se code using `__proto__` as\
  \ a tag or attribute name.\n\n```js\nconst { XMLParser, XMLBuilder, XMLValidator} = require(\"\
  fast-xml-parser\");\n\nlet XMLdata = \"<__proto__><polluted>hacked</polluted></__proto__>\"\
  \n\nconst parser = new XMLParser();\nlet jObj = parser.parse(XMLdata);\n\nconsole.log(jObj.polluted)\
  \ // should return hacked\n``` \n\n### Patches\nThe problem has been patched in v4.1.2\n\n\
  ### Workarounds\nUser can check for \"__proto__\" in the XML string before parsing it to the\
  \ parser.\n\n### References\nhttps://gist.github.com/Sudistark/a5a45bd0804d522a1392cb5023aa7ef7"
