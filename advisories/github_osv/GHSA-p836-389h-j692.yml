exploits:
  - description: |
      This vulnerability allows remote attackers to execute arbitrary code on vulnerable
                installations of Apache Shiro v1.2.4. Note that other versions of Apache Shiro may
                also be exploitable if the encryption key used by Shiro to encrypt rememberMe
                cookies is known.

                The gadget chain used for Java deserialization must be present on the target's classpath.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2016-06-07'
    exploit_type:
    platform: Unix,Windows
