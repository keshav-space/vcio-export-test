summary: "Code Injection in CRI-O\n### Impact\nA flaw introduced in CRI-O version 1.19 which\
  \ an attacker can use to bypass the safeguards and set arbitrary kernel parameters on the\
  \ host. As a result, anyone with rights to deploy a pod on a Kubernetes cluster that uses\
  \ the CRI-O runtime can abuse the `kernel.core_pattern` kernel parameter to achieve container\
  \ escape and arbitrary code execution as root on any node in the cluster.\n\n### Patches\n\
  The patches will be present in 1.19.6, 1.20.7, 1.21.6, 1.22.3, 1.23.2, 1.24.0\n\n### Workarounds\n\
  - Users can set manage_ns_lifecycle to false, which causes the sysctls to be configured by\
  \ the OCI runtime, which typically filter these cases. This option is available in 1.20 and\
  \ 1.19. Newer versions don't have this option.\n- An admission webhook could be created to\
  \ deny pods that specify a `+` in the sysctl value of a pod.\n- A [PodSecurityPolicy](https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/#podsecuritypolicy)\
  \ [deprecated] could be created, specifying all sysctls as forbidden like so: \n```\napiVersion:\
  \ policy/v1beta1\nkind: PodSecurityPolicy\nmetadata:\n  name: sysctl-psp\nspec:\n  forbiddenSysctls:\n\
  \    - \"*\"\n```\nHowever, this option will not work if any sysctls are required by any pods\
  \ in the cluster.\n\n\n### Credits\nCredit for finding this vulnerability goes to John Walker\
  \ and Manoj Ahuje of Crowdstrike. The CRI-O community deeply thanks them for the report.\n\
  \n### For more information\nIf you have any questions or comments about this advisory:\n*\
  \ Open an issue in [the CRI-O repo](http://github.com/cri-o/cri-o/issues)\n* To make a report,\
  \ email your vulnerability to the private\n[cncf-crio-security@lists.cncf.io](mailto:cncf-crio-security@lists.cncf.io)\
  \ list\nwith the security details and the details expected for [all CRI-O bug\nreports](https://github.com/cri-o/cri-o/blob/main/.github/ISSUE_TEMPLATE/bug-report.yml)."
