advisory_id: GHSA-387m-935m-c4vw
datasource_id: github_osv/GHSA-387m-935m-c4vw
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/07/GHSA-387m-935m-c4vw/GHSA-387m-935m-c4vw.json
aliases: []
summary: "Micronaut doesn't set a maximum redirect count for its HTTP Client, enabling infinite\
  \ loop DoS\nThe Netty-based Micronaut HTTP Client does not impose a limit on HTTP redirections,\
  \ potentially allowing an infinite redirect loop that could lead to a denial-of-service attack.\n\
  \n### Patches\n\nThe following versions are patched: \n\n- For Micronaut 5, versions equal\
  \ or greater than [5.0.1](https://github.com/micronaut-projects/micronaut-core/releases/v5.0.1)\
  \ >=\n- For Micronaut 4, versions equal or greater than [4.10.24](https://github.com/micronaut-projects/micronaut-core/releases/v4.10.24)\
  \ >=\n- For Micronaut 3, versions equal or greater than [3.10.7](https://github.com/micronaut-projects/micronaut-core/releases/v3.10.7)\
  \ >=\n\n### Workarounds\nNo\n\n### Resources\nMicronaut 5 Patch: https://github.com/micronaut-projects/micronaut-core/commit/6e88a972718d6e1521c5b3bb7766451798dba4e3\n\
  Micronaut 4 Patch: https://github.com/micronaut-projects/micronaut-core/commit/f1dffffec8fb5e3b7e94ae907ce0be3831e499d4\n\
  Micronaut 3 Patch: https://github.com/micronaut-projects/micronaut-core/commit/c06a2715ca7f78321bc3ca05f41cca78cd351320"
impacted_packages:
