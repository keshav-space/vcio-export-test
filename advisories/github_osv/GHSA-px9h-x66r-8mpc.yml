summary: "path traversal in Jooby\n### Impact\nAccess to sensitive information available from\
  \ classpath. \n\n### Patches\nPatched version: 1.6.7 and 2.8.2\n\nCommit 1.x: https://github.com/jooby-project/jooby/commit/34f526028e6cd0652125baa33936ffb6a8a4a009\n\
  \nCommit 2.x: https://github.com/jooby-project/jooby/commit/c81479de67036993f406ccdec23990b44b0bec32\n\
  \n### Workarounds\n_Is there a way for users to fix or remediate the vulnerability without\
  \ upgrading?_\n\n### References\n\nLatest 1.x version: 1.6.6\n\n#### Arbitrary class path\
  \ resource access 1\nWhen sharing a *File System* directory as in:\n\n``` java\nassets(\"\
  /static/**\", Paths.get(\"static\"));\n```\n\nThe class path is also searched for the file\
  \ (`org.jooby.handlers.AssetHandler.loader`):\n[jooby/AssetHandler.java at 1.x · jooby-project/jooby\
  \ · GitHub](https://github.com/jooby-project/jooby/blob/1.x/jooby/src/main/java/org/jooby/handlers/AssetHandler.java)\n\
  \n``` java\n  private static Loader loader(final Path basedir, final ClassLoader classloader)\
  \ {\n    if (Files.exists(basedir)) {\n      return name -> {\n        Path path = basedir.resolve(name).normalize();\n\
  \        if (Files.exists(path) && path.startsWith(basedir)) {\n          try {\n        \
  \    return path.toUri().toURL();\n          } catch (MalformedURLException x) {\n       \
  \     // shh\n          }\n        }\n        return classloader.getResource(name);\n    \
  \  };\n    }\n    return classloader::getResource;\n  }\n```\n\nIf we send `/static/WEB-INF/web.xml`\
  \ it will fail to load it from the file system but will go into `classloader.getResource(name)`\
  \ where name equals `/WEB-INF/web.xml` so will succeed and return the requested file. This\
  \ way we can get any configuration file or even the application class files\n\nIf assets are\
  \ configured for a certain extension we can still bypass it. eg:\n\n```java\nassets(\"/static/**/*.js\"\
  , Paths.get(\"static\"));\n```\n\nWe can send:\n\n```\nhttp://localhost:8080/static/io/yiss/App.class.js\n\
  ```\n\n#### Arbitrary class path resource access 2\nThis vulnerability also affects assets\
  \ configured to access resources from the root of the class path. eg:\n\n```java\nassets(\"\
  /static/**\");\n```\n\nIn this case we can traverse `static` by sending:\n\n```\nhttp://localhost:8080/static/..%252fio/yiss/App.class\n\
  ```\n\n### For more information\nIf you have any questions or comments about this advisory:\n\
  * Open an issue in [jooby](https://github.com/jooby-project/jooby/issues)\n* Email us at [support@jooby.io](mailto:support@jooby.io)"
