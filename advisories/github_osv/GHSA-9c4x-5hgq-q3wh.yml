summary: "Instance config inline secret exposure in Grafana\n### Impact\nSome inline secrets\
  \ are exposed in plaintext over the Grafana Agent HTTP server:\n\n* Inline secrets for metrics\
  \ instance configs in the base YAML file are exposed at `/-/config` \n* Inline secrets for\
  \ integrations are exposed at `/-/config`\n* Inline secrets for Consul ACL tokens and ETCD\
  \ basic auth when configured for the scraping service at `/-/config`.\n* Inline secrets for\
  \ the Kafka receiver for OpenTelemetry-Collector tracing at `/-/config`.\n* Inline secrets\
  \ for metrics instance configs loaded from the scraping service are exposed at `/agent/api/v1/configs/{name}`.\n\
  \nInline secrets will be exposed to anyone being able to reach these endpoints.\n\nSecrets\
  \ found in these sections are used for:\n\n* Delivering metrics to a Prometheus Remote Write\
  \ system \n* Authenticating against a system for discovering Prometheus targets \n* Authenticating\
  \ against a system for collecting metrics (scrape_configs and integrations)\n* Authenticating\
  \ against a Consul or ETCD for storing configurations to distribute in scraping service mode\
  \ \n* Authenticating against Kafka for receiving traces\n\nNon-inlined secrets, such as `*_file`-based\
  \ secrets, are not impacted by this vulnerability. \n\n### Patches\n\nDownload [v0.20.1](https://github.com/grafana/agent/releases/tag/v0.20.1)\
  \ or any version past [v0.21.2](https://github.com/grafana/agent/releases/tag/v0.21.2) to\
  \ patch Grafana Agent. These patches obfuscate the listed impacted secrets from the vulnerable\
  \ endpoints.\n\nThe patches also disable the endpoints by default. Pass the command-line flag\
  \ `--config.enable-read-api` to opt-in and re-enable the endpoints.  \n \n### Workarounds\n\
  If for some reason you cannot upgrade, use non-inline secrets where possible. Not all configuration\
  \ options may have a non-inline equivalent.\n\nYou also may desire to restrict API access\
  \ to Grafana Agent, with some combination of:\n\n* Restrict network interfaces Grafana Agent\
  \ listens on through `http_listen_address` in the `server` block. `127.0.0.1` is the most\
  \ restrictive, `0.0.0.0` is the default. \n* Configure Grafana Agent to use HTTPS with client\
  \ authentication. \n* Use firewall rules to restrict external access to Grafana Agent's API."
