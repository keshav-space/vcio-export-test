exploits:
  - description: Vite Vitejs contains an improper access control vulnerability that exposes
      content of non-allowed files using ?inline&import or ?raw?import. Only apps explicitly
      exposing the Vite dev server to the network (using --host or server.host config option)
      are affected.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2026-02-12'
    notes: 'This vulnerability could affect an open-source component, third-party library, protocol,
      or proprietary implementation that could be used by different products. For more information,
      please see: https://github.com/vitejs/vite/commit/59673137c45ac2bcfad1170d954347c1a17ab949
      ; https://nvd.nist.gov/vuln/detail/CVE-2025-31125'
