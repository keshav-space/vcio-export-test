summary: "RBAC Roles for `etcd` created by Kamaji are not disjunct\n### Summary\n_Using an \"\
  open at the top\" range definition in RBAC for etcd roles leads to some TCPs API servers being\
  \ able to read, write and delete the data of other control planes._\n\n### Details\n\nThe\
  \ problematic code is this: https://github.com/clastix/kamaji/blob/8cdc6191242f80d120c46b166e2102d27568225a/internal/datastore/etcd.go#L19-L24\n\
  \nThe range created by this RBAC setup code looks like this:\n\n```\netcdctl role get example\n\
  Role example\nKV Read:\n\t[/example/, \\0)\nKV Write:\n\t[/example/, \\0)\n```\n\nThe range\
  \ end `\\0` means \"everything that comes after\" in etcd, so potentially all the key prefixes\
  \ of controlplanes with a name that comes after \"example\" when sorting lexically (e.g. `example1`,\
  \ `examplf`, all the way to `zzzzzzz` if you will).\n\n### PoC\n\n1. Create two TCP in the\
  \ same Namespace\n2. Scale Kamaji to zero to avoid reconciliations\n3. change the Kubernetes\
  \ API Server `--etcd-prefix` flag value  to point to the other TCP datastore key\n4. wait\
  \ it for get it up and running\n5. use `kubectl` and will notice you're reading and writing\
  \ data of another Tenant\n\n### Impact\n\nFull control over other TCPs data, if you are able\
  \ to obtain the name of other TCPs that use the same datastore and are able to obtain the\
  \ user certificates used by your control plane (or you are able to configure the kube-apiserver\
  \ Deployment, as shown in the PoC)."
