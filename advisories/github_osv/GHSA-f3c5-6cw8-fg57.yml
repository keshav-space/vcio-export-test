datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2026/06/GHSA-f3c5-6cw8-fg57/GHSA-f3c5-6cw8-fg57.json
aliases:
  - CVE-2026-48492
summary: "Snipe-IT's selectlist visibility is too permissive\n### Impact\nThe GET /api/v1/{object}/selectlist\
  \ API endpoint is missing an authorization check. Any user who can log into Snipe-IT - regardless\
  \ of permissions - can retrieve a paginated list of all user accounts using only their web\
  \ session cookie. No API token or elevated permissions are required. This exposes usernames,\
  \ display names, employee numbers, and user IDs for every active account in the system if\
  \ FMCS is not enabled, and within the company they belong to if FMCS is enabled.\n\n### What\
  \ an attacker can do with a valid login and zero permissions:\n- Enumerate all active user\
  \ accounts by paginating through the endpoint\n- Harvest usernames for credential stuffing\
  \ or password spray attacks\n- Collect employee numbers and full names for social engineering\n\
  - Perform indirect email enumeration via the search parameter\n- Map user IDs for use in further\
  \ enumeration against other endpoints\n\nThis vulnerability is exploitable only by users who\
  \ have a working login to the Snipe-IT system. \n\n### Patches\nhttps://github.com/grokability/snipe-it/commit/4f943d4a7ab8e53f3d9e32770602d1118bab005f"
