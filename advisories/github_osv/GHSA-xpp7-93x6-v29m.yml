  - CVE-2026-53950
summary: "XSS in Ghost's ActivityPub client\n### Impact\n\nThe ActivityPub client in Ghost was\
  \ vulnerable to JavaScript injection on posts shared by a maliciously customised ActivityPub\
  \ server.\n\n### Vulnerable Versions\n\nThis vulnerability is present in the @tryghost/activitypub\
  \ package up to v3.0.8. All prior versions are also affected. \n\n### Patches\n\n@tryghost/activitypub\
  \ v3.1.0 contains a fix for this issue and is also automatically fetched by Ghost.\n\n###\
  \ References\n\nGhost thanks Brad Geesaman, Ghost Security for disclosing this vulnerability\
  \ responsibly. \n\n### For more information\n\nIf you have any questions or comments about\
  \ this advisory, email Ghost at [security@ghost.org](mailto:security@ghost.org)."
