summary: "Prototype Pollution in highlight.js\n### Impact\n\nAffected versions of this package\
  \ are vulnerable to Prototype Pollution.  A malicious HTML code block can be crafted that\
  \ will result in prototype pollution of the base object's prototype during highlighting. \
  \ If you allow users to insert custom HTML code blocks into your page/app via parsing Markdown\
  \ code blocks (or similar) and do not filter the language names the user can provide you may\
  \ be vulnerable. \n\nThe pollution should just be harmless data but this can cause problems\
  \ for applications not expecting these properties to exist and can result in strange behavior\
  \ or application crashes, i.e. a potential DOS vector. \n\n_If your website or application\
  \ does not render user provided data it should be unaffected._\n\n### Patches\n\nVersions\
  \ 9.18.2 and 10.1.2 and newer include fixes for this vulnerability.  If you are using version\
  \ 7 or 8 you are encouraged to upgrade to a newer release.\n\n### Workarounds\n\n#### Patch\
  \ your library\n\nManually patch your library to create null objects for both `languages`\
  \ and `aliases`:\n\n```js\nconst HLJS = function(hljs) {\n  // ...\n  var languages = Object.create(null);\n\
  \  var aliases = Object.create(null);\n```\n\n#### Filter out bad data from end users:\n\n\
  Filter the language names that users are allowed to inject into your HTML to guarantee they\
  \ are valid.\n\n### References\n\n* [What is Prototype Pollution?](https://codeburst.io/what-is-prototype-pollution-49482fc4b638)\n\
  * https://github.com/highlightjs/highlight.js/pull/2636\n\n### For more information\n\nIf\
  \ you have any questions or comments about this advisory:\n\n* Please file an issue against\
  \ [highlight.js](https://github.com/highlightjs/highlight.js/issues/)"
