aliases:
  - CVE-2026-73417
summary: "JupyterLab: Cross-site scripting (XSS) via crafted settings file (`overrides.json`)\n\
  JupyterLab 4.5+ allows notebook settings to be shared and applied through an `overrides.json`\
  \ file using the `Import` button in the Settings Editor.\n\nCertain notebook display settings\
  \ were not properly validated before being applied. As a result, a crafted settings file could\
  \ contain hidden instructions that run as code inside JupyterLab when imported, instead of\
  \ only changing a display preference.\n\nBecause importing a settings file appears harmless,\
  \ a user could import a file shared by another party without realizing it could do more. On\
  \ multi-tenant file systems without proper permission control, another user could plant a\
  \ malicious `overrides.json`.\n\n> CVE assignment pending, GitHub CNA is experiencing severe\
  \ backlog\n\n### Impact\n\nWhen a malicious settings file is applied, the embedded code runs\
  \ with the same access as the affected user. This could allow an attacker to read or modify\
  \ that user's notebooks and files, and to run code on the user's behalf through the notebook\
  \ server, including on any connected kernel.\n\n#### User Interaction vs Privileges Required\n\
  \n##### Write access to a loaded settings location\n\nIf an attacker can write to a directory\
  \ JupyterLab loads settings from (e.g. on shared or multi-tenant file system), they could\
  \ place a crafted `overrides.json` that is applied to another user automatically at startup.\
  \ This requires high privilages but no action by the victim. \n\n##### User-imported settings\
  \ file\n\nA user can import a crafted `overrides.json` through the `Import` button in the\
  \ Settings Editor, having received it from another party. This requires no privileges but\
  \ a deliberate action by the victim, who reasonably expects a settings file to change preferences\
  \ rather than run code.\n\n### Patches\n\nJupyterLab 4.6.2 and 4.5.10 were patched.\n\n###\
  \ Workarounds\n\nNone\n\n### Hardening\n\n1. Treat a settings file as something that can affect\
  \ how JupyterLab behaves, not only how it appears. Administrators are encouraged to establish\
  \ a trusted process for distributing configuration rather than relying on ad-hoc importing\
  \ of shared files.\n2. On multi-tenant or shared file systems, restrict write permissions\
  \ on the application settings directory and other Jupyter configuration paths so that one\
  \ user cannot place an `overrides.json` (or other configuration) readable by another user.\
  \ A settings file in these locations is applied automatically, without an import step, so\
  \ directory permissions are the primary control against cross-user tampering."
