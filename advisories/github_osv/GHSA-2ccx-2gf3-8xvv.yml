summary: "Kirby .dev domains and some reverse proxy setups were treated as local\n### Impact\n\
  \n#### About our registration block\n\nIn order to protect new installations on public servers\
  \ that don't have an admin account for the Panel yet, we block account registration there\
  \ by default. This is a security feature, which we implemented years ago in Kirby 2. It helps\
  \ to avoid that you forget registering your first admin account on a public server. \n\nIn\
  \ this case – without our security block – someone else might theoretically be able to find\
  \ your site, find out it's running on Kirby, find the Panel and then register the account\
  \ first. It's an unlikely situation, but it's still a certain risk.\n\nTo be able to register\
  \ the first Panel account on a public server, you have to enforce the installer via a config\
  \ setting. This helps to push all users to the best practice of registering your first Panel\
  \ account on your local machine and upload it together with the rest of the site. \n\n####\
  \ The issue\n\nAs noted by [Jukka Rautanen](https://github.com/jukra), this installation block\
  \ implementation in Kirby versions before 3.3.6 still assumed that .dev domains are local\
  \ domains, which is no longer true. In the meantime, those domains became publicly available.\
  \ This means that our installation block is no longer working as expected if you use a .dev\
  \ domain for your Kirby site.\n\nIn fixing this issue, we've also found out that the local\
  \ installation check may also fail if your site is behind a reverse proxy. \n\n#### Am I affected?\n\
  \nYou are only affected if:\n\n1. you use a .dev domain or your site is behind a reverse proxy\
  \ &\n2. you have not yet registered your first Panel account on the public server & \n3. someone\
  \ finds your site and tries to login at `yourdomain.dev/panel` before you register your first\
  \ account.\n\nYou are not affected if you have already created one or multiple Panel accounts\
  \ (no matter if on a .dev domain or behind a reverse proxy).\n\n### Patches\n\nThe problem\
  \ has been patched in [Kirby 2.5.14](https://github.com/getkirby-v2/panel/releases/tag/2.5.14)\
  \ and [Kirby 3.3.6](https://github.com/getkirby/kirby/releases/tag/3.3.6). Please update to\
  \ one of these or a [later version](https://github.com/getkirby/kirby/releases) to fix the\
  \ vulnerability.\n\n**Note:** Kirby 2 reaches end of life on December 31, 2020. We therefore\
  \ recommend to upgrade your Kirby 2 sites to Kirby 3. If you cannot upgrade, we still recommend\
  \ to update to Kirby 2.5.14.\n\n### Workarounds\n\nKirby 2 sites on older releases can also\
  \ be patched by applying the [changes from this commit](https://github.com/getkirby-v2/panel/commit/7f9ac1876bacb89fd8f142f5e561a02ebb725baa)."
