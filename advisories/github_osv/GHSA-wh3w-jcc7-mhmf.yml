exploits:
  - description: This module exploits functionality in Pretalx that export conference schedule
      as zipped file. The Pretalx will iteratively include any file referenced by any HTML tag
      and does not properly check the path of the file, which can lead to arbitrary file read.
      The module requires credentials that allow schedule export, schedule release and approval
      of proposals. Additionally, module requires conference name and URL for media files.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
