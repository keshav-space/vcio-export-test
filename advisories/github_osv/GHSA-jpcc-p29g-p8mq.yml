summary: "containerd image-triggered runtime DoS via unbounded group parsing\n### Impact\nA\
  \ vulnerability in containerd allows a maliciously crafted image to cause a Denial of Service\
  \ (DoS) condition. When creating a container from this image, memory exhaustion occurs, leading\
  \ to an Out Of Memory (OOM) kill of the containerd process. This renders the container runtime\
  \ API unavailable and can disrupt clients such as the Docker Engine or Kubernetes control-plane\
  \ components.\n\n### Patches\nThis bug has been fixed in the following containerd versions:\n\
  \n* 2.3.2\n* 2.2.5\n* 2.1.9\n* 2.0.10\n* 1.7.33\n\nUsers should update to these versions to\
  \ resolve the issue.\n\n### Workarounds\nEnsure that only trusted images are used and that\
  \ only trusted users have permissions to import images or schedule pods. \n\n### Credits\n\
  \nThe containerd project would like to thank Jakub Ciolek (@jake-ciolek) at AlphaSense and\
  \ Kyle Elliott @ Trail of Bits who independently discovered and responsibly disclosed this\
  \ issue in accordance with the [containerd security policy](https://github.com/containerd/project/blob/main/SECURITY.md).\n\
  \n### For more information\n\nIf you have any questions or comments about this advisory:\n\
  \n* Open an issue in [containerd](https://github.com/containerd/containerd/issues/new/choose)\n\
  * Email us at [security@containerd.io](mailto:security@containerd.io)\n\nTo report a security\
  \ issue in containerd:\n* [Report a new vulnerability](https://github.com/containerd/containerd/security/advisories/new)\n\
  * Email us at [security@containerd.io](mailto:security@containerd.io)"
