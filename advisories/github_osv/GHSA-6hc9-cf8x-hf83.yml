aliases:
  - CVE-2023-1584
summary: A flaw was found in Quarkus. Quarkus OIDC can leak both ID and access tokens in the
  authorization code flow when an insecure HTTP protocol is used, which can allow attackers
  to access sensitive user data directly from the ID token or by using the access token to access
  user data from OIDC provider services. Please note that passwords are not stored in access
  tokens.
