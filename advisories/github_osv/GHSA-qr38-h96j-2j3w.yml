exploits:
  - description: |
      This module exploits an authentication bypass and command injection in
                SaltStack Salt's REST API to execute commands as the root user.

                The following versions have received a patch: 2015.8.10, 2015.8.13,
                2016.3.4, 2016.3.6, 2016.3.8, 2016.11.3, 2016.11.6, 2016.11.10,
                2017.7.4, 2017.7.8, 2018.3.5, 2019.2.5, 2019.2.6, 3000.3, 3000.4,
                3001.1, 3001.2, and 3002.

                Tested against 2019.2.3 from Vulhub and 3002 on Ubuntu 20.04.1.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2020-11-03'
    exploit_type:
    platform: Linux,Unix
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/linux/http/saltstack_salt_api_cmd_exec.rb
    record_id:
  - description: SaltStack Salt allows an unauthenticated user with network access to the Salt
      API to use shell injections to run code on the Salt API using the SSH client. This vulnerability
      affects any users running the Salt API.
