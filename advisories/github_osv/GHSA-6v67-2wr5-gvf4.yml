summary: "QOS.CH logback-core Server-Side Request Forgery vulnerability\nServer-Side Request\
  \ Forgery (SSRF) in SaxEventRecorder by QOS.CH logback version 1.5.12 on the Java platform,\
  \ allows an attacker to forge requests by compromising logback configuration files in XML.\n\
  \ \nThe attacks involves the modification of DOCTYPE declaration in  XML configuration files."
