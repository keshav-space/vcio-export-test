aliases:
  - CVE-2026-33865
summary: "MLflow is vulnerable to Stored Cross-Site Scripting (XSS) caused by unsafe parsing\
  \ of YAML-based MLmodel artifacts in its web interface. An authenticated attacker can upload\
  \ a malicious MLmodel file containing a payload that executes when another user views the\
  \ artifact in the UI. This allows actions such as session hijacking or performing operations\
  \ on behalf of the victim. \n\nThis issue affects MLflow version through 3.10.1"
