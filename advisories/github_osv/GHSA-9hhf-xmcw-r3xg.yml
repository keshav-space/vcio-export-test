summary: "phpMyFAQ sharing FAQ functionality can easily be abused for phishing purposes\n###\
  \ Summary\nThe 'sharing FAQ' functionality allows any unauthenticated actor to misuse the\
  \ phpMyFAQ application to send arbitrary emails to a large range of targets.\n\n### Details\n\
  The phpMyFAQ application has a functionality where anyone can share a FAQ item to others.\
  \ The front-end of this functionality allows any phpMyFAQ articles to be shared with 5 email\
  \ addresses. The application will then send these 5 emails. However, there are no controls\
  \ over what link and content are shared. Furthermore, any unauthenticated actor can perform\
  \ this action. There is a CAPTCHA in place, however the amount of people you email with a\
  \ single request is not limited to 5 by the backend. An attacker can thus solve a single CAPTCHA\
  \ and send thousands of emails at once. \n\n### PoC\nWe send the following form and capture\
  \ the request.\n![image](https://user-images.githubusercontent.com/44903767/296291204-4a472536-9838-4f9e-bd95-df3d886af43f.png)\n\
  \nWe now change the body to contain 50 email addresses instead of just 1, and send the request.\
  \ The attacker can also change the body of the email to any phishing message.\n![image](https://user-images.githubusercontent.com/44903767/296291441-bba85a6c-45be-4f07-9385-e6da27713e35.png)\n\
  \nBelow are the logs of the email server, proving that all these emails were sent.\n![image](https://user-images.githubusercontent.com/44903767/296291673-d324be20-74b9-4e16-b25d-aa9b1dd75d5a.png)\n\
  \nAn attacker can also change the link that is sent in these emails. Making phishing even\
  \ more possible.\n![image](https://user-images.githubusercontent.com/44903767/296291897-8c0a40e7-cd4b-4021-8f4d-4362e10ad36b.png)\n\
  \n### Impact\nAn attacker can utilize the target application's email server to send phishing\
  \ messages. This can get the server on a blacklist, causing all emails to end up in spam.\
  \ It can also lead to reputational damages."
