summary: "Flowise: Cross-workspace credential IDOR in openai-assistants-vector-store\n# Summary\
  \ \n\nThese endpoints accept a client-controlled `credential` parameter. The server loads\
  \ credentials by `id` and uses them directly, without checking whether that credential belongs\
  \ to the caller’s workspace. If an attacker knows another workspace’s `credentialId`, they\
  \ can use that workspace’s OpenAI key.\n\n# Details\n\nRoute permissions (`assistants:*`)\
  \ only check feature access. They do not check credential ownership. The controller passes\
  \ `req.query.credential` straight to the service. The service does `findOneBy({ id: credentialId\
  \ })`, decrypts the credential, and calls OpenAI APIs. There is no `workspaceId` check in\
  \ this flow, so this is an IDOR.\n\n# Impact \n\n\n- Cross-workspace unauthorized use of stored\
  \ OpenAI keys.\n- Unauthorized read/modify/delete of victim vector stores and files.\n- Direct\
  \ billing impact on victim OpenAI account.\n- Multi-tenant boundary violation with practical\
  \ exploitability.\n\n# Reproduction steps  \n\n1. Set up two workspaces: A (attacker) and\
  \ B (victim), each with an OpenAI credential.  \n2. Log in as a user in workspace A (with\
  \ assistants-related permissions).  \n3. Call `/api/v1/openai-assistants-vector-store` and\
  \ set `credential` to B’s credential ID.  \n4. Example: `GET /api/v1/openai-assistants-vector-store?credential=<B_credentialId>`.\
  \  \n5. If responses/actions are executed using B’s credential context, the issue is confirmed."
