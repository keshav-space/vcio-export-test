  - CVE-2026-76904
summary: "GeoTools has unauthenticated SQL injection in the jsonArrayContains filter function\
  \ against PostGIS layers\n### Summary\n\nAn SQL Injection Vulnerability has been found when\
  \ executing OGC Filters with PostGIS DataStore implementation:\n\n* `jsonArrayContains` function\
  \  \n    Requires PostGIS 12 or greater with a String or JSON field\n\nFor PostGIS 12 and\
  \ greater `jsonArrayContains(<column>, <pointer>, <value>)` function writes `<value>` into\
  \ generated SQL without escaping.\n\n### Patches\n\n* GeoTools 35.1\n* GeoTools 33.5\n* GeoTools\
  \ 34.4\n\n### Mitigation\n\nNo mitigation is available:\n\n* To limit scope of SQL Injection\
  \ the PostGIS connection pool should be configured with limited rights.\n\n### Impact\n\n\
  This vulnerability can lead to execution of arbitrary SQL expressions in the database.\n\n\
  ### References\n\n* https://osgeo-org.atlassian.net/browse/GEOT-7958\n* https://osgeo-org.atlassian.net/browse/GEOT-7959\n\
  * https://github.com/geotools/geotools/pull/5829\n* https://osgeo-org.atlassian.net/browse/GEOT-7589"
