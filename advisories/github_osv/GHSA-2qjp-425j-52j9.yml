  - CVE-2022-23471
summary: "containerd CRI stream server vulnerable to host memory exhaustion via terminal\n###\
  \ Impact\n\nA bug was found in containerd's CRI implementation where a user can exhaust memory\
  \ on the host. In the CRI stream server, a goroutine is launched to handle terminal resize\
  \ events if a TTY is requested. If the user's process fails to launch due to, for example,\
  \ a faulty command, the goroutine will be stuck waiting to send without a receiver, resulting\
  \ in a memory leak. Kubernetes and crictl can both be configured to use containerd's CRI implementation\
  \ and the stream server is used for handling container IO.\n\n### Patches\n\nThis bug has\
  \ been fixed in containerd 1.6.12 and 1.5.16.  Users should update to these versions to resolve\
  \ the issue.\n\n### Workarounds\n\nEnsure that only trusted images and commands are used and\
  \ that only trusted users have permissions to execute commands in running containers. \n\n\
  ### For more information\n\nIf you have any questions or comments about this advisory:\n\n\
  * Open an issue in [containerd](https://github.com/containerd/containerd/issues/new/choose)\n\
  * Email us at [security@containerd.io](mailto:security@containerd.io)\n\nTo report a security\
  \ issue in containerd:\n* [Report a new vulnerability](https://github.com/containerd/containerd/security/advisories/new)\n\
  * Email us at [security@containerd.io](mailto:security@containerd.io)"
