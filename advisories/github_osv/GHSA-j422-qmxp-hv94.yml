aliases:
  - CVE-2025-66302
summary: "Grav vulnerable to Path Traversal allowing server files backup\n### Summary\n```\n\
  A path traversal vulnerability has been identified in Grav CMS, versions 1.7.49.5 , allowing\
  \ authenticated attackers\n with administrative privileges to read arbitrary files on the\
  \ underlying server filesystem. This vulnerability arises due\n to insufficient input sanitization\
  \ in the backup tool, where user-supplied paths are not properly restricted, enabling\n access\
  \ to files outside the intended webroot directory. The impact of this vulnerability depends\
  \ on the privileges of \nthe user account running the application.\n```\n\n### PoC\n```\n\
  To accurately demonstrate the maximum potential impact of this vulnerability, the testing\
  \ environment was configured in a specific way:\n\n- Elevated Privileges: The application\
  \ was run locally with the highest possible system privileges, operating under the **`root`**\
  \ user account.\n    \n- Objective: This configuration was chosen to unequivocally show that\
  \ the path traversal vulnerability is not just a theoretical issue but can lead to a complete\
  \ compromise of the underlying host when combined with poor operational practices. The ability\
  \ to read any file on the system is the ultimate test of the flaw's severity.\n    \n\nProof\
  \ of Concept Goal: Under these conditions, the subsequent PoC will exploit the vulnerability\
  \ to read the SSH private key\n of the `root` user (`/root/.ssh/id_rsa`). The successful exfiltration\
  \ of this key represents a worst-case scenario, as it would provide \nan attacker with persistent,\
  \ undetectable, and complete administrative access to the host server. This highlights the\
  \ critical intersection\n of an application-layer vulnerability and a infrastructure-level\
  \ misconfiguration.\n\n```\n\n\n\n\n```\n1- LOGIN AS ADMIN AND  GO TO  : http://127.0.0.1/admin/tools/backups\n\
  2- Change 'Root Folder' to backup directory /../../../../../../../root/.ssh/ \n\n```\n<img\
  \ width=\"1902\" height=\"492\" alt=\"Screenshot 2025-09-11 161519\" src=\"https://github.com/user-attachments/assets/23a60dc3-7758-4e24-b910-e66a1dd1f5e2\"\
  \ />\n\n\n\n```\n3- CLICK  : 'SAVE'\n4- CLICK  : 'Backup Now'\n```\n\n<img width=\"1916\"\
  \ height=\"512\" alt=\"Screenshot 2025-09-11 154151\" src=\"https://github.com/user-attachments/assets/88a63ff2-777e-467e-857b-0644ef698499\"\
  \ />\n\n```\n5- Extract Backup :\n```\n\n\n<img width=\"704\" height=\"101\" alt=\"Screenshot\
  \ 2025-09-11 160114\" src=\"https://github.com/user-attachments/assets/b91ce4db-9843-4280-b8f0-32c73aa12d4d\"\
  \ />\n<img width=\"567\" height=\"101\" alt=\"Screenshot 2025-09-11 160135\" src=\"https://github.com/user-attachments/assets/155ce7d8-c2fc-4b54-b054-f7c7550bec82\"\
  \ />"
