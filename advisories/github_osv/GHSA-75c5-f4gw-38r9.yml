exploits:
  - description: |
      This module takes advantages of Archive_Tar <= 1.4.10's lack of validation of file stream wrappers contained
                within filenames to write an arbitrary file containing user controlled content to an arbitrary file
                on disk. Note that the file will be written to disk with the permissions of the user that PHP is
                running as, so it may not be possible to overwrite some files if the PHP user is not appropriately
                privileged.
    required_action:
    due_date:
    notes: |
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2020-11-17'
    exploit_type:
    platform: PHP
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/fileformat/archive_tar_arb_file_write.rb
    record_id:
  - description: 'PEAR Archive_Tar allows an unserialization attack because phar: is blocked
      but PHAR: is not blocked. PEAR stands for PHP Extension and Application Repository and
      it is an open-source framework and distribution system for reusable PHP components with
      known usage in third-party products such as Drupal Core and Red Hat Linux.'
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-09-15'
    notes: https://pear.php.net/bugs/bug.php?id=27002, https://www.drupal.org/sa-core-2020-013,
      https://access.redhat.com/security/cve/cve-2020-28949; https://nvd.nist.gov/vuln/detail/CVE-2020-28949
