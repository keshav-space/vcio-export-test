summary: "OpenList vulnerable to Path Traversal in file copy and remove handlers\n### Summary\n\
  The application contains a Path Traversal vulnerability (CWE-22) in multiple file operation\
  \ handlers. An authenticated attacker can bypass directory-level authorisation by injecting\
  \ traversal sequences into filename components, enabling unauthorised file removal and copying\
  \ across user boundaries within the same storage mount.\n\n### Details\nThe application contains\
  \ a Path Traversal vulnerability (CWE-22) in multiple file operation handlers in *server/handles/fsmanage.go*.\
  \ Filename components in `req.Names` are directly concatenated with validated directories\
  \ using `stdpath.Join`. This allows \"..\" sequences to bypass path restrictions, enabling\
  \ users to access other users' files within the same storage mount and perform unauthorized\
  \ actions such as deletion, renaming, or copying of files.\n\n[FsRemove](https://github.com/OpenListTeam/OpenList/blob/5db2172ed681346b69ed468c73c1f01b6ed455ea/server/handles/fsmanage.go#L284-L285):\n\
  ~~~\nfunc FsRemove(c *gin.Context) {\n\t// ...\n\tfor _, name := range req.Names {\n\t\terr\
  \ := fs.Remove(c, stdpath.Join(reqDir, name))\n~~~\n\n[FsCopy](https://github.com/OpenListTeam/OpenList/blob/5db2172ed681346b69ed468c73c1f01b6ed455ea/server/handles/fsmanage.go#L163-L164):\n\
  ~~~\nfunc FsCopy(c *gin.Context) {\n\t// ...\n\tif !req.Overwrite {\n\t\tfor _, name := range\
  \ req.Names {\n\t\t\tif res, _ := fs.Get(c.Request.Context(), stdpath.Join(dstDir, name),\
  \ &fs.GetArgs{NoLog: true}); res != nil {\n~~~\n\n\n### PoC\nScenario:​ A normal user (\"\
  alice\") bypasses directory restrictions to read files outside her authorized path.\n\nEnvironment\
  \ setup:\n- Local storage mount as '/local'.\n- An admin file \"adminsecret.txt\" is placed\
  \ under /local\n- Alice has base path '/local/alice'.\n\n\nhttps://github.com/user-attachments/assets/5d73bbec-29e5-4c52-8af3-4c70b26d9d0e\n\
  \n\n\n### Impact\nThis vulnerability enables privilege escalation within shared storage environments.\
  \ An authenticated attacker with basic file operation permissions (remove/copy) can bypass\
  \ directory-level authorisation controls when multiple users exist within the same storage\
  \ mount.\n\nAttack Requirements:\n- Authenticated user account (not guest)\n- Basic file operation\
  \ permissions (remove/copy)\n- Multi-user environment within the same storage mount\n- Knowledge\
  \ (or ability to guess) the target file's name and path\n\nConsequences:\n- Unauthorised data\
  \ access: Read, copy, and exfiltrate files from other users' directories\n- Data destruction:\
  \ Delete files belonging to other users\n\n### Note\n\nThis vulnerability was discovered by:\n\
  - XlabAI Team of Tencent Xuanwu Lab\n- Atuin Automated Vulnerability Discovery Engine\n\n\
  CVE and credit are preferred.\n\nIf users have any questions regarding the vulnerability details,\
  \ please feel free to reach out for further discussion. Email [xlabai@tencent.com](mailto:xlabai@tencent.com).\n\
  \nThe security industry standard [90+30 disclosure policy](https://googleprojectzero.blogspot.com/p/vulnerability-disclosure-policy.html)\
  \ is followed. Should the aforementioned vulnerabilities remain unfixed after 90 days of submission,\
  \ all information about the issues will be publicly disclosed."
