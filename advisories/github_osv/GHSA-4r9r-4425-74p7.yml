summary: "Cedar-Java has policy injection, type confusion, and incorrect equality comparison\
  \ vulnerabilities\n### Summary\n\nCedarJava is an open source Java implementation of the Cedar\
  \ policy language, used for fine-grained authorization decisions. Under certain circumstances,\
  \ it could lead to incorrect equality comparisons.\n\n### Impact\n\n**`EntityIdentifier.equals()`\
  \ has inverted null/self branches**\n\nThe `EntityIdentifier.equals()` method has inverted\
  \ logic for null and self-reference checks, returning true for null comparisons and false\
  \ for self-comparisons. This does not affect Cedar authorization decisions (computed in Rust\
  \ from JSON), but could affect integrators who perform their own equality checks on entity\
  \ identifiers.\n\n### Impacted versions: \n< 4.9\n\n### Patches\nIt has been addressed in\
  \ CedarJava version 4.9 and above. We recommend upgrading to the latest version and ensuring\
  \ any forked or derivative code is patched to incorporate the new fixes.\n\n### Workarounds\n\
  Avoid relying on `EntityIdentifier.equals()` for security-sensitive comparisons until upgraded\
  \ to version `4.9`.\n\n### References\nIf you have any questions or comments about this advisory,\
  \ Cedar asks that you contact us directly via email to [cedar-policy-security@lists.cncf.io](mailto:cedar-policy-security@lists.cncf.io).\
  \ Please do not create a public GitHub issue."
