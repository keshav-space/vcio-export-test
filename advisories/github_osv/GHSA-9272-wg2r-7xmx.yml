aliases:
  - CVE-2026-55566
summary: "Yamcs has DOM XSS in Extension Routing\n**Attack type**: Unauthenticated remote \n\
  **Impact**: Execution of arbitrary JavaScript in a user’s browser.\n**Affected components**:\
  \ extension.matcher.ts:12, extension.component.ts:40, app.component.ts:134.\n\nYamcs is vulnerable\
  \ to cross-site scripting in the /ext URL endpoint. By inputting specially crafted code into\
  \ the URL, an attacker can execute arbitrary JavaScript code in a user’s browser. This URL\
  \ may be sent to a user via a phishing email.\n \n<img width=\"940\" height=\"294\" alt=\"\
  image\" src=\"https://github.com/user-attachments/assets/d886d65c-9bb5-4599-ac11-55db83aafc0e\"\
  \ />\n\nSteps to Reproduce:\n1.\tStart a Yamcs instance.\n2.\tInsert the following URL into\
  \ the browser and press enter (change ‘myproject’ to the name of your instance):\n```\nhttp://localhost:8090/ext/img%20src%3Dx%20onerror%3Dalert%281%29?c=myproject\n\
  ```\n3.\tYou will receive an alert with the number ‘1’ in it.\n\nRecommendations:\n1.\tUse\
  \ document.createElement instead of innerHTML in extension.component.ts.\n2.\tValidate the\
  \ extension against registered plugin IDs.\n3.\tEnforce a strict custom-element-name regex\
  \ before mounting."
