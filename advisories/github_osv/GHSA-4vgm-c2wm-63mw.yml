  \                   | >= 10.0.0, <= 10.0.3 | 10.0.4\n\n## Advisory FAQ\n\n### <a name=\"how-affected\"\
  ></a>How do I know if I am affected?\n\nIf using an affected package listed in [affected products](#affected-products)\
  \ or [affected packages](#affected-packages), you're exposed to the vulnerability.\n\n###\
  \ <a name=\"how-fix\"></a>How do I fix the issue?\n\n1. To fix the issue please install the\
  \ latest version of .NET 8.0, NET 9.0, or .NET 10.0, as appropriate. If you have installed\
  \ one or more .NET SDKs through Visual Studio, Visual Studio will prompt you to update Visual\
  \ Studio, which will also update your .NET  SDKs.\n2. If your application references the vulnerable\
  \ package, update the package reference to the patched version. You can list the versions\
  \ you have installed by running the `dotnet --info` command. \n\nOnce you have installed the\
  \ updated runtime or SDK, restart your apps for the update to take effect.\n\nAdditionally,\
  \ if you've deployed [self-contained applications](https://docs.microsoft.com/dotnet/core/deploying/#self-contained-deployments-scd)\
  \ targeting any of the impacted versions, these applications are also vulnerable and must\
  \ be recompiled and redeployed.\n\n## Other Information\n\n### Reporting Security Issues\n\
  \nIf you have found a potential security issue in a supported version of .NET, please report\
  \ it to the Microsoft Security Response Center (MSRC) via the [MSRC Researcher Portal](https://msrc.microsoft.com/report/vulnerability/new).\
  \ Further information can be found in the MSRC [Report an Issue FAQ](https://www.microsoft.com/msrc/faqs-report-an-issue).\n\
  \nSecurity reports made through MSRC may qualify for the Microsoft .NET Bounty. Details of\
  \ the Microsoft .NET Bounty Program including terms and conditions are at https://aka.ms/corebounty.\n\
  \n### Support\n\nYou can ask questions about this issue on GitHub in the .NET GitHub organization.\
  \ The main repos are located at https://github.com/dotnet/runtime. The Announcements repo\
  \ (https://github.com/dotnet/Announcements) will contain this bulletin as an issue and will\
  \ include a link to a discussion issue. You can ask questions in the linked discussion issue.\n\
