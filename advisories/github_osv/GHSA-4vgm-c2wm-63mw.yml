summary: "# Microsoft Security Advisory CVE-2026-26130 – .NET Denial of Service Vulnerability\n\
  \n## Executive summary\n\nMicrosoft is releasing this security advisory to provide information\
  \ about a vulnerability in .NET 8.0, .NET 9.0, and .NET 10.0. This advisory also provides\
  \ guidance on what developers can do to update their applications to remove this vulnerability.\n\
  \nA denial of service vulnerability exists in ASP.NET Core due to uncontrolled resource consumption.\
  \ A specially crafted message to a SignalR server can exhaust an internal buffer and cause\
  \ a Denial of Service.\n\n## Announcement\n\nAnnouncement for this issue can be found at https://github.com/dotnet/announcements/issues/385\n\
  \n## CVSS Details\n\n- **Version:** 3.1\n- **Score:** 7.5\n- **Vector:** `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H/E:U/RL:O/RC:C`\n\
  - **Severity:** High\n- **Weakness:** CWE-770 (Uncontrolled Resource Consumption)\n\n## Affected\
  \ Platforms\n\n- **Platforms:** All\n- **Architectures:** All\n\n## Affected Products\n\n\
