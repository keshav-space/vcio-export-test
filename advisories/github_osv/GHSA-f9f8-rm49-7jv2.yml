summary: "Github Actions issued GITHUB_TOKEN disclosure in GitHub Actions logs\n### Summary\n\
  \nComposer leaks the full contents of tokens configured as GitHub OAuth tokens if they do\
  \ not match Composer's expected format for such tokens to stderr. GitHub has introduced a\
  \ new format for GitHub Actions GITHUB_TOKEN values. These tokens are validated in the same\
  \ way by Composer on GitHub Actions. The new format including a `-` (hyphen) fails Composer's\
  \ validation and leads to disclosure of the GITHUB_TOKEN in logs.\n\nMany widely-used Actions\
  \ (e.g. `shivammathur/setup-php`) auto-register `GITHUB_TOKEN` into composer's global `auth.json`,\
  \ so the leak triggers without any unusual user configuration.\n\nGitHub Actions tokens expire\
  \ when the associated job finishes, and they are scoped to the respective repository only.\
  \ So in most regular cases the Composer validation, which errors while leaking the token,\
  \ also immediately ends the job, expiring the token immediately. Tokens expire at the very\
  \ latest after 6 hours on GitHub-hosted runners. If you use self-hosted runner, expiration\
  \ is at most 24 hours after creation. The new token format is being rolled out gradually,\
  \ so not all repositories are affected yet, but will be soon.\n\nClassic `ghp_` PATs are not\
  \ affected by the regex bug per se, but the same leak primitive applies to any future credential\
  \ that fails validation for any reason.\n\n### Details\n\nWhen a GitHub token fails regular\
  \ expression validation of the character set, the rejected token is interpolated verbatim\
  \ into the `UnexpectedValueException` message thrown by `Composer\\IO\\BaseIO::loadConfiguration()`,\
  \ which Symfony Console then prints. Validation reliably fails for any token containing a\
  \ `-` (hyphen), which includes the modern `ghs_<id>_<base64url-JWT>` GitHub App installation\
  \ token format, the same format used by GitHub Actions' built-in `GITHUB_TOKEN` and by `actions/create-github-app-token`.\
  \ \n\nSeverity: medium. Pre-conditions are common in real-world CI. Practical blast radius\
  \ is bounded by the leaked credential's scope and TTL (short for a workflow `GITHUB_TOKEN`,\
  \ longer for App-minted tokens or user-issued credentials that happen to contain `-`).\n\n\
  Vulnerable code, `src/Composer/IO/BaseIO.php` (line 139 on `main`, line 143 on 2.8.x), inside\
  \ `loadConfiguration()`:\n\n```php\n// allowed chars for GH tokens are from https://github.blog/changelog/2021-03-04-authentication-token-format-updates/\n\
  // plus dots which were at some point used for GH app integration tokens\nif (!Preg::isMatch('{^[.A-Za-z0-9_]+$}',\
  \ $token)) {\n    throw new \\UnexpectedValueException(\n        'Your github oauth token\
  \ for '.$domain.' contains invalid characters: \"'.$token.'\"'\n    );\n}\n```\n\nThree issues\
  \ combine to produce the leak:\n\n1. **The rejected token is interpolated into the exception\
  \ message.** The exception bubbles up to Symfony Console's default error renderer, which writes\
  \ it to stderr. Any environment that captures stderr (CI logs, log shippers, monitoring, support\
  \ transcripts) now has the raw token.\n\n2. **The validation regex `^[.A-Za-z0-9_]+$` does\
  \ not permit `-`.** GitHub's current `ghs_<numeric-id>_<base64url-JWT>` structured installation\
  \ tokens routinely contain `-`, because base64url (RFC 4648 §5) uses `-` and `_` as URL-safe\
  \ replacements for `+` and `/`. The regex was chosen in 2021 on the understanding that GitHub\
  \ tokens use only `[A-Za-z0-9_]` plus `.`.\n\n3. **Detection / mitigation in upstream platforms\
  \ is unreliable.** GitHub Actions' built-in secret masker matches registered values as exact\
  \ substrings. When the exception message is rendered by Symfony Console it may wrap, embed\
  \ in `In BaseIO.php line N:` framing, or interleave with ANSI control sequences. So the masker\
  \ does not redact, and the plaintext token reaches the log."
