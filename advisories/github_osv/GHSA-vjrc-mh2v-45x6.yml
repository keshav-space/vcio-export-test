summary: "OAuth2-Proxy is vulnerable to header smuggling via underscore leading to potential\
  \ privilege escalation\n### Impact\nAll deployments of OAuth2 Proxy in front of applications\
  \ that normalize underscores to dashes in HTTP headers (e.g., WSGI-based frameworks such as\
  \ Django, Flask, FastAPI, and PHP applications).\n\nAuthenticated users can inject underscore\
  \ variants of X-Forwarded-* headers that bypass the proxy’s filtering logic, potentially escalating\
  \ privileges in the upstream app. OAuth2 Proxy authentication/authorization itself is not\
  \ compromised.\n\n### Patches\n\nThis change mitigates a request header smuggling vulnerability\
  \ where an attacker could bypass header stripping by using different capitalization or replacing\
  \ dashes with underscores. The problem has been patched with v7.13.0.\n\nBy default all specified\
  \ headers will now be normalized, meaning that both capitalization and the use of underscores\
  \ (_) versus dashes (-) will be ignored when matching headers to be stripped. For example,\
  \ both `X-Forwarded-For` and `X_Forwarded-for` will now be treated as equivalent and stripped\
  \ away.\n\nHowever, if users have a rationale for keeping a similar-looking header and don't\
  \ want to strip it, a new configuration field for headers managed through AlphaConfig called\
  \ InsecureSkipHeaderNormalization has been introduced :\n\n```golang\n// Header represents\
  \ an individual header that will be added to a request or\n// response header.\ntype Header\
  \ struct {\n\t// Name is the header name to be used for this set of values.\n\t// Names should\
  \ be unique within a list of Headers.\n\tName string `json:\"name,omitempty\"`\n\n\t// PreserveRequestValue\
  \ determines whether any values for this header\n\t// should be preserved for the request\
  \ to the upstream server.\n\t// This option only applies to injected request headers.\n\t\
  // Defaults to false (headers that match this header will be stripped).\n\tPreserveRequestValue\
  \ bool `json:\"preserveRequestValue,omitempty\"`\n\n\t// InsecureSkipHeaderNormalization disables\
  \ normalizing the header name\n\t// According to RFC 7230 Section 3.2 there aren't any rules\
  \ about\n\t// capitalization of header names, but the standard practice is to use\n\t// Title-Case\
  \ (e.g. X-Forwarded-For). By default, header names will be\n\t// normalized to Title-Case\
  \ and any incoming headers that match will be\n\t// treated as the same header. Additionally\
  \ underscores (_) in header names\n\t// will be converted to dashes (-) when normalizing.\n\
  \t// Defaults to false (header names will be normalized).\n\tInsecureSkipHeaderNormalization\
  \ bool `json:\"InsecureSkipHeaderNormalization,omitempty\"`\n\n\t// Values contains the desired\
  \ values for this header\n\tValues []HeaderValue `json:\"values,omitempty\"`\n}\n```\n\n###\
  \ Workarounds\nEnsure filtering and processing logic in upstream services don't treat underscores\
  \ and hyphens in Headers the same way."
