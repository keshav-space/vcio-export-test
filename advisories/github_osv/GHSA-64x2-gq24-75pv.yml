advisory_id: GHSA-64x2-gq24-75pv
datasource_id: github_osv/GHSA-64x2-gq24-75pv
datasource_url: https://github.com/github/advisory-database/blob/main/advisories/github-reviewed/2021/04/GHSA-64x2-gq24-75pv/GHSA-64x2-gq24-75pv.json
aliases:
  - CVE-2020-13954
summary: |
  Cross-site scripting in Apache CXF
  By default, Apache CXF creates a /services page containing a listing of the available endpoint names and addresses. This webpage is vulnerable to a reflected Cross-Site Scripting (XSS) attack via the styleSheetPath, which allows a malicious actor to inject javascript into the web page. This vulnerability affects all versions of Apache CXF prior to 3.4.1 and 3.3.8. Please note that this is a separate issue to CVE-2019-17573.
