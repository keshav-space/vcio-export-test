summary: "veraPDF Validation XXE via Rich Text\n## Summary  \n  \n**Description**\nAn XML External\
  \ Entity Injection (CWE-611) vulnerability in veraPDF allows a remote attacker to read arbitrary\
  \ files on the server file system and perform Server-Side Request Forgery by submitting a\
  \ crafted PDF containing a malicious rich-text (/RC or /RV) entry. This affects all current\
  \ versions of veraPDF-validation.  \n  \n## Details  \nThe vulnerability resides in veraPDF-validation\
  \ `validation-model/src/main/java/org/verapdf/gf/model/tools/DictionaryKeysHelper.java` within\
  \ the `getRichTextStringOrStreamEntryStringRepresentation()` method. This helper extracts\
  \ the XHTML rich-text body from a PDF dictionary string or stream and parses it with a DOM\
  \ parser to return the concatenated text content.  \n  \nThe vulnerability stems from two\
  \ combined issues:  \n- The DocumentBuilderFactory is instantiated with default settings ,\
  \ no disallow-doctype-decl, no disabling of external general/parameter entities, no FEATURE_SECURE_PROCESSING,\
  \ and no secure EntityResolver. The default JAXP/Xerces parser will therefore resolve `<!DOCTYPE\
  \ … SYSTEM \"…\">` and `<!ENTITY … SYSTEM \"…\">` declarations.  \n- After parsing, `getAllNodeText()`\
  \ recursively concatenates every text node in the document and returns it as the model property\
  \ value. This means the expanded contents of any external entity are reflected directly back\
  \ into the validation report.  \n  \n## Impact  \n  \nThis impacts all current releases of\
  \ the veraPDF validation-model module.  \n  \nSuccessful exploitation requires only that the\
  \ target validate an attacker-supplied PDF. A single markup annotation with a crafted /RC\
  \ string is sufficient.  \n   \n## Proposed Patch  \n  \nHarden the `DocumentBuilderFactory`\
  \ in `validation-model/src/main/java/org/verapdf/gf/model/tools/DictionaryKeysHelper.java`\
  \ per the OWASP XXE Prevention Cheat Sheet to disallow DOCTYPE outright."
