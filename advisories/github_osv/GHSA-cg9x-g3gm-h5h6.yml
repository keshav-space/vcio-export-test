summary: "veraPDF-validatio: Use of Default `DocumentBuilderFactory` leads to XXE When Processing\
  \ Untrusted PDFs\n### Summary\n\nveraPDF-validation has an XML External Entity (XXE) vulnerability\
  \ in two PDF parsing paths (validate and `GFPDAcroForm.getdynamicRender()`). A malicious/crafted\
  \ PDF supplied to a veraPDF consumer can lead to the expansion of external entities while\
  \ parsing rich-text annotation/form-field values or XFA configurations, allowing local file\
  \ disclosure and potentially outbound network requests depending on the runtime (host) environment.\n\
  \n### Details\n\nConsumers that utilise either the `PDFAValidator.validate(...)` or `GFPDAcroForm(acroForm).getdynamicRender()`\
  \ APIs to process untrusted PDFs are vulnerable to XXE exploits. \n\nBoth vulnerable paths\
  \ share the same root cause: the underlying source binds a default `DocumentBuilderFactory`\
  \ and immediately calls `newDocumentBuilder()` which does not disable parsing of DTDs, external\
  \ entities, XInclude, or external resource access directives in XML schemas.\n\nThis is an\
  \ XXE vulnerability affecting applications that use veraPDF's affected APIs to parse or validate\
  \ untrusted PDFs.\n\nAn attacker could craft a PDF that includes crafted XML external entities\
  \ that when processed by vulnerable consumers could lead to local file disclosure and server-side\
  \ outbound requests to attacker-controlled endpoints, depending on JVM XML parser behavior\
  \ and network controls on the host."
