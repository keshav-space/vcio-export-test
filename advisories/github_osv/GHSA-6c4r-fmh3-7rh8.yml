summary: "vLLM: Processing differential in multi-channel audio downmixing enables hidden-input/moderation\
  \ bypass for audio models\n## Issue Description\nLibrosa defaults to using `numpy.mean` for\
  \ mono downmixing (`to_mono`), while the international standard ITU-R BS.775-4 specifies a\
  \ weighted downmixing algorithm. This discrepancy results in:\n- Inconsistency between audio\
  \ heard by humans (e.g., through headphones/regular speakers) and audio processed by AI models\
  \ (Which infra via Librosa, such as vllm, transformer).\n\nhttps://github.com/librosa/librosa/blob/af8c839fb15317fa2712ea66e7a22da6a9267b32/librosa/core/audio.py#L478\n\
  ## Attack Scenario and Impact\n\n### LFE (Low-Frequency Effects) Channel Exploit\nAttackers\
  \ can craft special multichannel audio files containing:\n1. Normal content in front channels\
  \ (L/R)\n2. Either interference signals or hidden content in the LFE channel\n\n**Notice:**\
  \ It is worth noting that not only the LFE channel is excluded, but in fact, channels beyond\
  \ the 6th (such as rear surround channels, overhead channels, height speakers, etc.) are also\
  \ not supported.\n\n**Attack Methodology:**\n\nAttackers can create specially engineered multichannel\
  \ audio with LFE interference, where front channels (L/R) contain normal content while the\
  \ LFE channel carries interference signals or hidden content. When played on consumer devices\
  \ that ignore LFE channels, only the normal content is heard. However, when processed by AI\
  \ systems using Librosa (which mixes all channels), the LFE interference affects speech recognition\
  \ feature extraction or masks critical detection features. This enables malicious content\
  \ to bypass AI detection while still reaching end users, potentially compromising voice authentication\
  \ systems, evading content moderation, or disrupting speech recognition accuracy.\n\n**Potential\
  \ Exploitation Scenarios:**\n- Voice authentication systems may be tricked into accepting\
  \ anomalous audio\n- Content moderation systems may fail to detect prohibited content hidden\
  \ in LFE channels \n- Speech recognition systems may produce incorrect transcriptions\n\n\
  **Note:** `torch.audio` implements this correctly. Failure to do so may lead to inconsistencies\
  \ between training and test audio, resulting in performance degradation.\n\n\n## Resources\n\
  \n- [ITU-R BS.775-4 Standard](https://www.itu.int/dms_pubrec/itu-r/rec/bs/R-REC-BS.775-4-202212-I!!PDF-E.pdf)\n\
  - [Librosa Source Code](https://github.com/librosa/librosa/blob/af8c839fb15317fa2712ea66e7a22da6a9267b32/librosa/core/audio.py#L478)\n\
  - [Librosa securty report](https://github.com/librosa/librosa/security/advisories/GHSA-vfm7-86xr-5mrh)\n\
  \n## Fixes\n\n- https://github.com/vllm-project/vllm/pull/37058, which removes the librosa\
  \ dependency from vLLM."
