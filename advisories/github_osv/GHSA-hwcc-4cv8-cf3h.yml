summary: "Snowflake Connector .NET does not properly check the Certificate Revocation List (CRL)\n\
  ### Issue\nSnowflake recently received a report about a vulnerability in the Snowflake Connector\
  \ .NET where the checks against the Certificate Revocation List (CRL) were not performed where\
  \ the insecureMode flag was set to false, which is the default setting. The vulnerability\
  \ affects versions between 2.0.25 and 2.1.4 (inclusive). Snowflake fixed the issue in [version\
  \ 2.1.5](https://docs.snowflake.com/release-notes/clients-drivers/dotnet-2023#version-2-1-5-december-18-2023).\n\
  \n### Attack Scenario\nSnowflake uses CRL to check if a TLS certificate has been revoked before\
  \ its expiration date. The lack of correct validation of revoked certificates could, in theory,\
  \ allow an attacker who has both access to the private key of a correctly issued Snowflake\
  \ certificate and the ability to intercept network traffic to perform a Man-in-the-Middle\
  \ (MitM) attack in order to compromise Snowflake credentials used by the driver.\n\nThe vulnerability\
  \ is difficult to exploit given both conditions required and, at the time of this advisory's\
  \ publication, Snowflake is not aware of any compromise of its certificates, nor unauthorized\
  \ issuance of such by any publicly trusted Certificate Authority (CA). However, an upgrade\
  \ to the newest version is recommended to ensure the highest level of security and protection\
  \ against future unforeseen threats.\n\n### Solution\nOn December 18, 2023, Snowflake released\
  \ [version 2.1.5](https://docs.snowflake.com/release-notes/clients-drivers/dotnet-2023#version-2-1-5-december-18-2023)\
  \ of the Snowflake Connector .NET, which fixes the issue, and we recommend users upgrade to\
  \ [version 2.1.5](https://docs.snowflake.com/release-notes/clients-drivers/dotnet-2023#version-2-1-5-december-18-2023).\
  \  Customers continuing to use the impacted versions of the connector should update their\
  \ insecureMode flag to true. \n\n### Acknowledgement\nSnowflake would like to thank [Timo\
  \ Vink](https://github.com/TimoVink) for reporting this vulnerability.\n\n### Additional Information\n\
  If you discover a security vulnerability in one of our products or websites, please report\
  \ the issue to HackerOne. For more information, please see our [Vulnerability Disclosure Policy](https://hackerone.com/snowflake?type=team)."
