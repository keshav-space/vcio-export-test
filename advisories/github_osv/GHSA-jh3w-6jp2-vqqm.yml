aliases:
  - CVE-2023-22728
summary: "Missing permission check of canView in GridFieldPrintButton\nThe GridField print view\
  \ incorrectly validates the permission of DataObjects potentially allowing a content author\
  \ to view records they are not authorised to access. \n\nUpgrade to `silverstripe/framework`\
  \ 4.12.5 or above to address the issue.\n\nReported by Stephan Bauer from [relaxt Webdienstleistungsagentur\
  \ GmbH](https://www.relaxt.at/)"
