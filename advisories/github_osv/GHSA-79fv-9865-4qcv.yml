summary: "Heap buffer overflow in `MaxPoolGrad`\n### Impact\nThe implementation of `tf.raw_ops.MaxPoolGrad`\
  \ is vulnerable to a heap buffer overflow:\n  \n```python\nimport tensorflow as tf\n\norig_input\
  \ = tf.constant([0.0], shape=[1, 1, 1, 1], dtype=tf.float32)\norig_output = tf.constant([0.0],\
  \ shape=[1, 1, 1, 1], dtype=tf.float32)\ngrad = tf.constant([], shape=[0, 0, 0, 0], dtype=tf.float32)\n\
  ksize = [1, 1, 1, 1] \nstrides = [1, 1, 1, 1]\npadding = \"SAME\"\n\ntf.raw_ops.MaxPoolGrad(\n\
  \  orig_input=orig_input, orig_output=orig_output, grad=grad, ksize=ksize,\n  strides=strides,\
  \ padding=padding, explicit_paddings=[])\n```\n\nThe [implementation](https://github.com/tensorflow/tensorflow/blob/ab1e644b48c82cb71493f4362b4dd38f4577a1cf/tensorflow/core/kernels/maxpooling_op.cc#L194-L203)\
  \ fails to validate that indices used to access elements of input/output arrays are valid:\n\
  \n```cc\nfor (int index = out_start; index < out_end; ++index) {\n  int input_backprop_index\
  \ = out_arg_max_flat(index);\n  FastBoundsCheck(input_backprop_index - in_start, in_end -\
  \ in_start);\n  input_backprop_flat(input_backprop_index) += out_backprop_flat(index);\n}\n\
  ```\n\nWhereas accesses to `input_backprop_flat` are guarded by `FastBoundsCheck`, the indexing\
  \ in `out_backprop_flat` can result in OOB access.\n\n### Patches\nWe have patched the issue\
  \ in GitHub commit [a74768f8e4efbda4def9f16ee7e13cf3922ac5f7](https://github.com/tensorflow/tensorflow/commit/a74768f8e4efbda4def9f16ee7e13cf3922ac5f7).\n\
  \nThe fix will be included in TensorFlow 2.5.0. We will also cherrypick this commit on TensorFlow\
  \ 2.4.2, TensorFlow 2.3.3, TensorFlow 2.2.3 and TensorFlow 2.1.4, as these are also affected\
  \ and still in supported range.\n\n### For more information\nPlease consult [our security\
  \ guide](https://github.com/tensorflow/tensorflow/blob/master/SECURITY.md) for more information\
  \ regarding the security model and how to contact us with issues and questions.\n\n### Attribution\n\
  This vulnerability has been reported by Ying Wang and Yakun Zhang of Baidu X-Team."
