summary: "XWiki Platform: Password hash might be leaked by diff once the xobject holding them\
  \ is deleted\n### Impact\n\nIt is possible to access the hash of a password by using the diff\
  \ feature of the history whenever the object storing the password is deleted. Using that vulnerability\
  \ it's possible for an attacker to have access to the hash password of a user if they have\
  \ rights to edit the users' page. \n\nNow with the default right scheme in XWiki this vulnerability\
  \ is normally prevented on user profiles, except by users with Admin rights. Note that this\
  \ vulnerability also impacts any extensions that might use passwords stored in xobjects: for\
  \ those usecases it depends on the right of those pages.\n\nThere is currently no way to be\
  \ 100% sure that this vulnerability has been exploited, as an attacker with enough privilege\
  \ could have deleted the revision where the xobject was deleted after rolling-back the deletion.\
  \ But again, this operation requires high privileges on the target page (Admin right). A page\
  \ with a user password xobject which have in its history a revision where the object has been\
  \ deleted should be considered at risk and the password should be changed there.\n\n### Patches\n\
  \nThe vulnerability has been patched in XWiki 14.10.19, 15.5.4 and 15.9-rc-1 by performing\
  \ a better check before dislaying data of a diff, to ensure it's not coming from a password\
  \ field. \n\n### Workarounds\n\nAdmins should ensure that the user pages are properly protected:\
  \ the edit right shouldn't be allowed for other users than Admin and owner of the profile\
  \ (which is the default right). \nNow there's not much workaround possible for a privileged\
  \ user other than upgrading XWiki. \n\n### References\n\n* JIRA ticket: https://jira.xwiki.org/browse/XWIKI-19948\n\
  * Commit: https://github.com/xwiki/xwiki-platform/commit/f1eaec1e512220fabd970d053c627e435a1652cf\n\
  \n### For more information\n\nIf you have any questions or comments about this advisory:\n\
  * Open an issue in [Jira XWiki.org](https://jira.xwiki.org/)\n* Email us at [Security Mailing\
  \ List](mailto:security@xwiki.org)"
