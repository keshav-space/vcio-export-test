summary: "Denial of Service Vulnerability in React Server Components\n## Impact\n\nIt was found\
  \ that the fix to address [CVE-2025-55184](https://github.com/facebook/react/security/advisories/GHSA-2m3v-v2m8-q956)\
  \ in React Server Components was incomplete and does not prevent a denial of service attack\
  \ in a specific case.\n\nWe recommend updating immediately.\n\nThe vulnerability exists in\
  \ versions 19.0.2, 19.1.3, and 19.2.2 of:\n\n- [react-server-dom-webpack](https://www.npmjs.com/package/react-server-dom-webpack)\n\
  - [react-server-dom-parcel](https://www.npmjs.com/package/react-server-dom-parcel)\n- [react-server-dom-turbopack](https://www.npmjs.com/package/react-server-dom-turbopack?activeTab=readme)\n\
  \nThese issues are present in the patches published on December 11th, 2025.\n\n## Patches\n\
  \nFixes were back ported to versions 19.0.3, 19.1.4, and 19.2.3. \n\nIf you are using any\
  \ of the above packages please upgrade to any of the fixed versions immediately.\n\nIf your\
  \ app’s React code does not use a server, your app is not affected by this vulnerability.\
  \ If your app does not use a framework, bundler, or bundler plugin that supports React Server\
  \ Components, your app is not affected by this vulnerability.\n\n## References\n\nSee the\
  \ [blog post](https://react.dev/blog/2025/12/11/denial-of-service-and-source-code-exposure-in-react-server-components)\
  \ for more information and upgrade instructions."
