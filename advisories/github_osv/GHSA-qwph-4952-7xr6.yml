  - CVE-2022-23540
summary: "jsonwebtoken vulnerable to signature validation bypass due to insecure default algorithm\
  \ in jwt.verify()\n# Overview\n\nIn versions <=8.5.1 of jsonwebtoken library, lack of algorithm\
  \ definition and a falsy secret or key in the `jwt.verify()` function can lead to signature\
  \ validation bypass due to defaulting to the `none` algorithm for signature verification.\n\
  \n# Am I affected?\nYou will be affected if all the following are true in the `jwt.verify()`\
  \ function:\n- a token with no signature is received\n- no algorithms are specified \n- a\
  \ falsy (e.g. null, false, undefined) secret or key is passed \n\n# How do I fix it?\n \n\
  Update to version 9.0.0 which removes the default support for the none algorithm in the `jwt.verify()`\
  \ method. \n\n# Will the fix impact my users?\n\nThere will be no impact, if you update to\
  \ version 9.0.0 and you don’t need to allow for the `none` algorithm. If you need 'none' algorithm,\
  \ you have to explicitly specify that in `jwt.verify()` options."
