summary: "9routers has Exposure of Sensitive Information and Unprotected Database Import/Export,\
  \ Allowing Complete Credential Theft and Database Takeover\n## Summary\n\nThe `/api/settings/database`\
  \ endpoint allows full database export (containing all credentials, API keys, OAuth tokens,\
  \ and settings) and full database import (complete overwrite) without any authentication requirement\
  \ beyond the `ALWAYS_PROTECTED` middleware check, which only validates JWT or CLI token. Combined\
  \ with other vulnerabilities (e.g., default password, tunnel exposure), this enables complete\
  \ database takeover.\n\n## Description\n\nThe endpoint `/api/settings/database` is listed\
  \ in `ALWAYS_PROTECTED` in `dashboardGuard.js` (line 42), which requires a valid JWT token\
  \ or CLI token. However, this protection is insufficient because:\n\n1. **GET (Export):**\
  \ Returns the complete database including API keys (`key` field in `apiKeys` table), OAuth\
  \ tokens, and all provider credentials. Line 80 in `src/lib/db/index.js`: `apiKeys: db.all(\"\
  SELECT * FROM apiKeys\").map(...)` — the `key` field contains the plaintext API key value.\n\
  \n2. **POST (Import):** Accepts arbitrary JSON and performs a complete database wipe-and-replace\
  \ in a transaction (lines 102-163 in `src/lib/db/index.js`). This replaces all settings including\
  \ the password hash, effectively allowing an attacker to set their own password.\n\n3. The\
  \ exported data includes `apiKeys` with their plaintext `key` values, `providerConnections`\
  \ with all OAuth tokens, and `settings` with OIDC client secrets.\n\n### Evidence\n\n**File:**\
  \ `src/app/api/settings/database/route.js`\n```javascript\nexport async function GET() {\n\
  \  const payload = await exportDb();\n  return NextResponse.json(payload);\n}\n\nexport async\
  \ function POST(request) {\n  const payload = await request.json();\n  await importDb(payload);\n\
  \  // ...\n}\n```\n\n**File:** `src/lib/db/index.js` (lines 96-163)\n```javascript\nexport\
  \ async function importDb(payload) {\n  db.transaction(() => {\n    // Wipe all tables\n \
  \   db.run(`DELETE FROM settings`);\n    db.run(`DELETE FROM providerConnections`);\n    db.run(`DELETE\
  \ FROM providerNodes`);\n    db.run(`DELETE FROM proxyPools`);\n    db.run(`DELETE FROM apiKeys`);\n\
  \    db.run(`DELETE FROM combos`);\n    db.run(`DELETE FROM kv WHERE scope IN (...)`);\n \
  \   // Then insert attacker-controlled data\n    // ...\n  });\n}\n```\n\nThe `exportDb` function\
  \ at line 80 exposes API key plaintext:\n```javascript\napiKeys: db.all(`SELECT * FROM apiKeys`).map((r)\
  \ => ({ \n  id: r.id, key: r.key, name: r.name, ...\n})),\n```\n\n## Steps to Reproduce\n\n\
  1. Authenticate with any valid JWT (e.g., using the default password \"123456\")\n2. Export:\
  \ `curl -b auth_token=<jwt> http://localhost:20128/api/settings/database`\n3. Observe: Full\
  \ database dump with all credentials in plaintext\n4. Import malicious data: `curl -X POST\
  \ -b auth_token=<jwt> -H \"Content-Type: application/json\" -d '<modified-db>' http://localhost:20128/api/settings/database`\n\
  5. All settings, passwords, API keys are now replaced with attacker-controlled values\n\n\
  ## Impact\n\n- **Confidentiality:** Complete exposure of all stored secrets (API keys, OAuth\
  \ tokens, OIDC client secrets)\n- **Integrity:** Complete database replacement with attacker-controlled\
  \ data\n- **Availability:** Database wipe is possible by importing an empty database\n- **Scope\
  \ Changed:** Importing new settings affects all users and downstream services\n\n## Recommended\
  \ Fix\n\n1. Require re-authentication for database export/import (not just an existing session)\n\
  2. Mask/redact API keys in export (or require explicit opt-in for key export)\n3. Add confirmation\
  \ step for import (require current password verification)\n4. Implement database backup before\
  \ import\n5. Log all export/import operations with audit trail"
