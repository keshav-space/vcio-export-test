summary: Security researcher Masato Kinugawa found when HZ-GB-2312 charset encoding is used
  for text, the "~" character will destroy another character near the chunk delimiter. This
  can lead to a cross-site scripting (XSS) attack in pages encoded in HZ-GB-2312.
