advisory_id: mfsa2006-14
datasource_id: mozilla/mfsa2006-14
datasource_url: https://github.com/mozilla/foundation-security-advisories/blob/master/announce/2006/mfsa2006-14.md
aliases: []
summary: |
  Using the eval associated with methods of an XBL binding it was possible
  to create JavaScript functions that would get compiled with the wrong
  privileges, allowing the attacker to run code of their choice with the
  full permission of the user running the browser. This
  could be used to install spyware or viruses.
  Thunderbird shares the JavaScript engine with Firefox
  and could be vulnerable if JavaScript were to be enabled in mail. This is not
  the default setting and we strongly discourage users from running
  JavaScript in mail.
