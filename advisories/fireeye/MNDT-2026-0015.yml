summary: The Integrated Publishing Toolkit (IPT) version 3.3.2 contains an authentication bypass
  vulnerability due to exposed setup functionality accessible to unauthenticated actors on already
  configured IPT instances. A remote unauthenticated threat actor could use this vulnerability
  to obtain an application session cookie with administrative permissions. This condition persists
  as long as the server has not been rebooted since its initial configuration.
