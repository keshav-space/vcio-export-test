summary: All SonicWall Email Security versions up to 10.0.9.6173 (Windows) and 10.0.9.6177 (Hardware
  & ESXi Virtual Appliances) contains a vulnerability enabling an attacker to create a new `role.ouadmin`
  administrative account by sending HTTP requests containing crafted XML data to an exposed
  unauthenticated API.
