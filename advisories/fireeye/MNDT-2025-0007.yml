summary: Some deployments of Sitecore Experience Manager (XM), Experience Platform (XP), Experience
  Commerce (XC), and Managed Cloud may have been implemented with a pre-shared ASP.NET machine
  key. This vulnerable configuration can enable ASP.NET ViewState deserialization attacks, leading
  to remote code execution.
