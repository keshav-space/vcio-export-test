summary: In Otalio GMBH's product, the Ship Property Management System (SPMS), in version 2.17.0,
  Mandiant observed the signature of the JWT was never verified for higher privileged users.
  Mandiant exploited the vulnerability by changing the `exp` claim to 99999999999999 which allowed
  a session that would remain valid until the year 5138. Additionally, Mandiant performed privilege
  escalation from a POS user to a super user role.
