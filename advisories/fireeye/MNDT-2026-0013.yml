summary: A Server-Side Request Forgery (SSRF) vulnerability was identified in the Hedvig proxy
  subsystem of the Commvault CommServe Command Center application. The proxy endpoint, `/commandcenter/proxy/hedvig/`,
  does not implement destination validation on the user-supplied `baseUrl` parameter within
  the JSON request body. An unauthenticated attacker can exploit this weakness to force the
  CommServe host to initiate arbitrary outbound HTTP requests to internal services and external
  systems.
