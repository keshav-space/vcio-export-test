summary: In Otalio GMBH's product, the Ship Property Management System (SPMS), in version 2.17.0,
  Mandiant observed application functionality which was vulnerable to stored Cross-Site Scripting
  (XSS). In this instance, Mandiant performed an account takeover attack by retrieving the UUID
  for a user and changing the password. Changing a password did not require the current user's
  password to perform the attack.
