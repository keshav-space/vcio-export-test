summary: Microsoft SharePoint Server contains an authentication bypass vulnerability in the
  Web Part Gallery page (`AddGallery.aspx`). This vulnerability allows unauthenticated attackers
  to bypass page-level permission checks and trigger the deserialization of untrusted data,
  potentially leading to remote code execution (RCE) on the affected server.
