exploits:
  - description: Dell RecoverPoint for Virtual Machines (RP4VMs) contains an use of hard-coded
      credentials vulnerability that could allow an unauthenticated remote attacker to gain
      unauthorized access to the underlying operating system and root-level persistence.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
