summary: "ReDOS vulnerabities: multiple grammars\n### Impact: Potential ReDOS vulnerabilities\
  \ (exponential and polynomial RegEx backtracking)\n\n[oswasp](https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS):\
  \ \n\n> The Regular expression Denial of Service (ReDoS) is a Denial of Service attack, that\
  \ exploits the fact that most Regular Expression implementations may reach extreme situations\
  \ that cause them to work very slowly (exponentially related to input size). An attacker can\
  \ then cause a program using a Regular Expression to enter these extreme situations and then\
  \ hang for a very long time.\n\nIf are you are using Highlight.js to highlight user-provided\
  \ data you are possibly vulnerable. On the client-side (in a browser or Electron environment)\
  \ risks could include lengthy freezes or crashes... On the server-side infinite freezes could\
  \ occur... effectively preventing users from accessing your app or service (ie, Denial of\
  \ Service).\n\nThis is an issue with grammars shipped with the parser (and potentially 3rd\
  \ party grammars also), not the parser itself. If you are using Highlight.js with any of the\
  \ following grammars you are vulnerable. If you are using `highlightAuto` to detect the language\
  \ (and have any of these grammars registered) you are vulnerable.\n\nAll are vulnerable, including\
  \ \n\n**Grammars with exponential backtracking issues:**\n\n - c-like (c, cpp, arduino)\n\
  \ - handlebars (htmlbars)\n - gams\n - perl\n - jboss-cli\n - r\n - erlang-repl\n - powershell\n\
  \ - routeros\n - livescript (10.4.0 included this fix)\n - javascript & typescript (10.4.0\
  \ included partial fixes)\n\nAnd of course any aliases of those languages have the same issue.\
  \ ie: `hpp` is no safer than `cpp`.\n\n**Grammars with polynomial backtracking issues:**\n\
  \n- kotlin\n- gcode\n- d\n- aspectj\n- moonscript\n- coffeescript/livescript\n- csharp\n-\
  \ scilab\n- crystal\n- elixir\n- basic\n- ebnf\n- ruby\n- fortran/irpf90\n- livecodeserver\n\
  - yaml\n- x86asm\n- dsconfig\n- markdown\n- ruleslanguage\n- xquery\n- sqf\n\nAnd again: any\
  \ aliases of those languages have the same issue. ie: `ruby` and `rb` share the same ruby\
  \ issues. ### Patches\n\n- resolves these vulnerabilities. Please upgrade.\n\n### Workarounds\
  \ / Mitigations\n\n- Discontinue use the affected grammars. (or perhaps use only those with\
  \ poly vs exponential issues)\n- Attempt cherry-picking the grammar fixes into older versions...\n\
  - Attempt using newer CDN versions of any affected languages. (ie using an older CDN version\
  \ of the library with newer CDN grammars). Your mileage may vary.\n\n### References\n\n- https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS\n\
  \n### For more information\n\nIf you have any questions or comments about this advisory:\n\
  * Open an issue: https://github.com/highlightjs/highlight.js/issues\n* Email us at [security@highlightjs.com](mailto:security@highlightjs.com)"
