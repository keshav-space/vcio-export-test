exploits:
  - description: |
      A critical unauthenticated Remote Code Execution (RCE) vulnerability exists in React Server
                Components (RSC) Flight protocol. The vulnerability allows attackers to achieve prototype
                pollution during deserialization of RSC payloads by sending specially crafted multipart
                requests with "__proto__", "constructor", or "prototype" as module names.

                This module supports multiple vulnerable frameworks including Next.js and Waku.
    required_action:
    due_date:
    notes: |
      AKA:
        - React2Shell
      Stability:
        - crash-safe
      SideEffects:
        - ioc-in-logs
      Reliability:
        - repeatable-session
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2025-12-03'
    exploit_type:
    platform: Linux,Unix,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/react2shell_unauth_rce_cve_2025_55182.rb
    record_id:
  - description: Meta React Server Components contains a remote code execution vulnerability
      that could allow unauthenticated remote code execution by exploiting a flaw in how React
      decodes payloads sent to React Server Function endpoints. Please note CVE-2025-66478 has
      been rejected, but it is associated with CVE-2025- 55182.
    required_action: Apply mitigations per vendor instructions, follow applicable BOD 22-01
      guidance for cloud services, or discontinue use of the product if mitigations are unavailable.
    due_date: !!timestamp '2025-12-12'
    notes: 'Check for signs of potential compromise on all internet accessible REACT instances
