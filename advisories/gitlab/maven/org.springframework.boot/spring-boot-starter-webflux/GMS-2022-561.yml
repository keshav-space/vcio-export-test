exploits:
  - description: |
      Spring Framework versions 5.3.0 to 5.3.17, 5.2.0 to 5.2.19, and older versions when running on JDK 9 or above
                and specifically packaged as a traditional WAR and deployed in a standalone Tomcat instance are vulnerable
                to remote code execution due to an unsafe data binding used to populate an object from request parameters
                to set a Tomcat specific ClassLoader. By crafting a request to the application and referencing the
                org.apache.catalina.valves.AccessLogValve class through the classLoader with parameters such as the following:
                class.module.classLoader.resources.context.parent.pipeline.first.suffix=.jsp, an unauthenticated attacker can
                gain remote code execution.
    required_action:
    due_date:
    notes: |
      AKA:
        - Spring4Shell
        - SpringShell
      Stability:
        - crash-safe
      Reliability:
        - repeatable-session
      SideEffects:
        - ioc-in-logs
        - artifacts-on-disk
    known_ransomware_campaign_use: no
    source_date_published: !!timestamp '2022-03-31'
    exploit_type:
    platform: Linux,Windows
    source_date_updated:
    data_source: Metasploit
    source_url: https://github.com/rapid7/metasploit-framework/tree/master/modules/exploits/multi/http/spring_framework_rce_spring4shell.rb
    record_id: /modules/exploits/multi/http/spring_framework_rce_spring4shell.rb
  - description: Spring MVC or Spring WebFlux application running on JDK 9+ may be vulnerable
      to remote code execution (RCE) via data binding.
    required_action: Apply updates per vendor instructions.
    due_date: !!timestamp '2022-04-25'
    notes: https://nvd.nist.gov/vuln/detail/CVE-2022-22965
    known_ransomware_campaign_use: no
    source_date_published:
    exploit_type:
    platform:
    source_date_updated:
    data_source: KEV
    source_url:
    record_id: CVE-2022-22965
