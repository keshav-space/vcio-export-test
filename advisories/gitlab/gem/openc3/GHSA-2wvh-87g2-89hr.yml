summary: "OpenC3 COSMOS: Permissions Bypass Provides User Access to Unassigned Administrative\
  \ Actions via Script Runner Tool\n**Vulnerability Type: Execution with Unnecessary Privileges\n\
  Attack type: Authenticated remote\nImpact: Data disclosure/manipulation, privilege escalation\n\
  Affected components: The following docker images:\n•\tOpenc3inc/openc3-COSMOS-script-runner-api**\n\
  \nThe Script Runner widget allows users to execute Python and Ruby scripts directly from the\
  \ openc3-COSMOS-script-runner-api container. Because all the docker containers share a network,\
  \ users can execute specially crafted scripts to bypass the API permissions check and perform\
  \ administrative actions, including reading and modifying data inside the Redis database,\
  \ which can be used to read secrets and change COSMOS settings, as well as read and write\
  \ to the buckets service, which holds configuration, log, and plugin files. These actions\
  \ are normally only available from the Admin Console or with administrative privileges. Any\
  \ user with permission to create and run scripts can connect to any service in the docker\
  \ network.\n\n<img width=\"940\" height=\"473\" alt=\"image\" src=\"https://github.com/user-attachments/assets/bf524163-127d-4349-999b-cefc53d4374d\"\
  \ />\n\nFigure 1: Environment variables, including Redis credentials, found in the Script\
  \ Runner container\nA Ruby script is used to expose the Redis username, password, hostname,\
  \ and port. These credentials might also be found from the source code or through a brute-force\
  \ attack.\n\n<img width=\"940\" height=\"507\" alt=\"image\" src=\"https://github.com/user-attachments/assets/6d3ccad4-949d-4eeb-a5f8-3aca48bbe815\"\
  \ />\n\nFigure 2: A Python script is used to add data to Redis and retrieve the new data\n\
  A Python script is then used to create a new entry in the Redis database called `openc3__settings_hacked`\
  \ with a key of `store_url` and a value of `http://hacked.com`.\n\n<img width=\"940\" height=\"\
  70\" alt=\"image\" src=\"https://github.com/user-attachments/assets/fcef13be-5416-4627-9c95-617a24674ee0\"\
  \ />\n\nFigure 3: The new data found in the Redis database\nThe new entry was successfully\
  \ added to the Redis database, as is confirmed by using `redis-cli`.\nThe following example\
  \ shows how an attacker might change the plugin store URL file that is stored in the config\
  \ bucket.\n\n<img width=\"940\" height=\"640\" alt=\"image\" src=\"https://github.com/user-attachments/assets/681b4dd6-4b6e-4a91-8480-0c9fbff76ede\"\
  \ />\n\nFigure 4: Uploading file to change the plugin store URL setting\n\n<img width=\"940\"\
  \ height=\"189\" alt=\"image\" src=\"https://github.com/user-attachments/assets/630db0bb-217e-4205-be1d-e9891516b22f\"\
  \ />\n\nFigure 5: The URL file was successfully changed"
