summary: |
  openssl-encrypt has CORS wildcard with allow_credentials=True in standalone servers
  Both standalone servers configure CORS with `allow_origins=["*"]`, `allow_credentials=True`, `allow_methods=["*"]`, and `allow_headers=["*"]`.
