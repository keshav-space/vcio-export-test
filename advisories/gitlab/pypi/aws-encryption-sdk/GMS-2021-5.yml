summary: "Improper Verification of Cryptographic Signature in aws-encryption-sdk\nThis advisory\
  \ addresses several LOW severity issues with streaming signed messages and restricting processing\
  \ of certain types of invalid messages. \n\nThis ESDK supports a streaming mode where callers\
  \ may stream the plaintext of signed messages before the ECDSA signature is validated."
