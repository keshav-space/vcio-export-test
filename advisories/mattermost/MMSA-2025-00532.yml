summary: (CWE-22) Fixed an issue where the Client4 API client's route construction methods (e.g.
  userRoute, teamRoute, channelsByNameRoute) did not validate input IDs, allowing an attacker
  to craft IDs containing path components to redirect calls to unintended API endpoints. Thanks
  to Juho Forsén for contributing to this improvement under the Mattermost responsible disclosure
  policy.
