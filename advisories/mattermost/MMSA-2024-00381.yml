summary: (CWE-284) Fixed an issue where a User or System Manager, with "Read Groups" permission
  but with no access for channels, could retrieve details about private channels that they were
  not a member of by sending a request to /api/v4/channels. Thanks to othman for contributing
  to this improvement under the Mattermost responsible disclosure policy.
