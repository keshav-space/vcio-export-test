summary: (CWE-74) Fixed an issue where shared channel upload functionality failed to validate
  upload types, allowing a system admin to enable the shared channel functionality and use the
  remote cluster upload session to upload non-attachment uploads that could potentially be placed
  in arbitrary filesystem directories. Thanks to daw10 for contributing to this improvement
  under the Mattermost responsible disclosure policy.
