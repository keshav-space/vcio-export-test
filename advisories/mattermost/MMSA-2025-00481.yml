summary: (CWE-754) Fixed an issue where repeated requests to the Update Subscription endpoint
  with unexpected subscription type causes the plugin to crash, rendering the plugin unusable.
  This vulnerability is only exposed when accessing the API endpoint from an external source
  and cannot be exploited through the UI. Thanks to Lorenzo Gallegos for contributing to this
  improvement under the Mattermost responsible disclosure policy.
