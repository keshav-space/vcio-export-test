  642f069bd48b1a3bb20e657df210b9e6949ca073:[skip ci] Remove CLEAN from GHSA-7qpv-r5mr-78m4.phpt in PHP 8.2

  The CLEAN section causes issues in CI on Windows + PHP 8.2 + ext-pgsql. This was
  fixed in 94dc6ae871763af5b5bd9bbf0aab29beb07ab8ac, but landed only in 8.3+.
  4b4baffc1fca4d559c54e835d91df6cc9a8c945a:Fix SQL injection in ext-pgsql via E'...' backslash breakout

  php_pgsql_add_quotes() quotes the string with E'...', but PQescapeStringConn()
  does not escape \ unless standard_conforming_strings is off.
  PQescapeStringConn() is meant to be used with '', so do that instead.

  Fixes GHSA-7qpv-r5mr-78m4
  99be038cc10a4c310db0c5002a69654d0a768fc3:Fix SQL injection in ext-pgsql via E'...' backslash breakout

  php_pgsql_add_quotes() quotes the string with E'...', but PQescapeStringConn()
  does not escape \ unless standard_conforming_strings is off.
  PQescapeStringConn() is meant to be used with '', so do that instead.

  Fixes GHSA-7qpv-r5mr-78m4
  ab048bd83b578119cf81b456526d50498421d617:Fix SQL injection in ext-pgsql via E'...' backslash breakout

  php_pgsql_add_quotes() quotes the string with E'...', but PQescapeStringConn()
  does not escape \ unless standard_conforming_strings is off.
  PQescapeStringConn() is meant to be used with '', so do that instead.

  Fixes GHSA-7qpv-r5mr-78m4
  53ac7025451c6481d44cf1835bb8385299a6a3a3:Fix SQL injection in ext-pgsql via E'...' backslash breakout

  php_pgsql_add_quotes() quotes the string with E'...', but PQescapeStringConn()
  does not escape \ unless standard_conforming_strings is off.
  PQescapeStringConn() is meant to be used with '', so do that instead.

  Fixes GHSA-7qpv-r5mr-78m4
