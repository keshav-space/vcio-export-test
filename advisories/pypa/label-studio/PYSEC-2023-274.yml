summary: Label Studio is a multi-type data labeling and annotation tool with standardized output
  format. There is a vulnerability that can be chained within the ORM Leak vulnerability to
  impersonate any account on Label Studio. An attacker could exploit these vulnerabilities to
  escalate their privileges from a low privilege user to a Django Super Administrator user.
  The vulnerability was found to affect versions before `1.8.2`, where a patch was introduced.
