summary: An XML Entity Expansion vulnerability, also known as a 'billion laughs' attack, exists
  in the sitemap parser of the run-llama/llama_index repository, specifically affecting version
  v0.12.21. This vulnerability allows an attacker to supply a malicious Sitemap XML, leading
  to a Denial of Service (DoS) by exhausting system memory and potentially causing a system
  crash. The issue is resolved in version v0.12.29.
