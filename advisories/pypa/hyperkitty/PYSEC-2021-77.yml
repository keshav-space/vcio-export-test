summary: An issue was discovered in management/commands/hyperkitty_import.py in HyperKitty through
  1.3.4. When importing a private mailing list's archives, these archives are publicly visible
  for the duration of the import. For example, sensitive information might be available on the
  web for an hour during a large migration from Mailman 2 to Mailman 3.
