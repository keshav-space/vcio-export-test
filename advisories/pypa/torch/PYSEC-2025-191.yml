summary: A vulnerability, which was classified as problematic, has been found in PyTorch 2.6.0+cu124.
  Affected by this issue is the function torch.mkldnn_max_pool2d. The manipulation leads to
  denial of service. An attack has to be approached locally. The exploit has been disclosed
  to the public and may be used. The real existence of this vulnerability is still doubted at
  the moment. The security policy of the project warns to use unknown models which might establish
  malicious effects.
