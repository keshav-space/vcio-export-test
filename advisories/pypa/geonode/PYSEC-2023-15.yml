summary: GeoNode is an open source platform that facilitates the creation, sharing, and collaborative
  use of geospatial data. GeoNode is vulnerable to an XML External Entity (XXE) injection in
  the style upload functionality of GeoServer leading to Arbitrary File Read. This issue has
  been patched in version 4.0.3.
