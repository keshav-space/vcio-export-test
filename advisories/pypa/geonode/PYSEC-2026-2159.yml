summary: GeoNode versions 4.0 before 4.4.5 and 5.0 before 5.0.2 contain a server-side request
  forgery vulnerability that allows authenticated users with document upload permissions to
  trigger arbitrary outbound HTTP requests by providing a malicious URL via the doc_url parameter
  during document upload. Attackers can supply URLs pointing to internal network targets, loopback
  addresses, RFC1918 addresses, or cloud metadata services to cause the server to make requests
  to internal resources without SSRF mitigations such as private IP filtering or redirect validation.
