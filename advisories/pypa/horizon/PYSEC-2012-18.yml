summary: 'Open redirect vulnerability in views/auth_forms.py in OpenStack Dashboard (Horizon)
  Essex (2012.1) allows remote attackers to redirect users to arbitrary web sites and conduct
  phishing attacks via a URL in the next parameter to auth/login/.  NOTE: this issue was originally
  assigned CVE-2012-3542 by mistake.'
