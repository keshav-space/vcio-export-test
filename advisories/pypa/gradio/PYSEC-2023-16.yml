advisory_id: gradio/PYSEC-2023-16
datasource_id: pypa/gradio/PYSEC-2023-16
datasource_url: https://github.com/pypa/advisory-database/blob/main/vulns/gradio/PYSEC-2023-16.yaml
aliases:
  - CVE-2023-25823
  - GHSA-3x5j-9vwr-8rr5
  - PYSEC-2023-16
summary: Gradio is an open-source Python library to build machine learning and data science
  demos and web applications. Versions prior to 3.13.1 contain Use of Hard-coded Credentials.
  When using Gradio's share links (i.e. creating a Gradio app and then setting `share=True`),
  a private SSH key is sent to any user that connects to the Gradio machine, which means that
  a user could access other users' shared Gradio demos. From there, other exploits are possible
  depending on the level of access/exposure the Gradio app provides. This issue is patched in
  version 3.13.1, however, users are recommended to update to 3.19.1 or later where the FRP
  solution has been properly tested.
