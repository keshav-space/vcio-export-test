summary: A vulnerability, which was classified as critical, has been found in json-logic-js
  2.0.0. Affected by this issue is some unknown functionality of the file logic.js. The manipulation
  leads to command injection. Upgrading to version 2.0.1 is able to address this issue. The
  patch is identified as c1dd82f5b15d8a553bb7a0cfa841ab8a11a9c227. It is recommended to upgrade
  the affected component. VDB-222266 is the identifier assigned to this vulnerability.
