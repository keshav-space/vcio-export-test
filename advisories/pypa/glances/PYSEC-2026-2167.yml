summary: Glances is an open-source system cross-platform monitoring tool. The Glances action
  system allows administrators to configure shell commands that execute when monitoring thresholds
  are exceeded. These commands support Mustache template variables (e.g., `{{name}}`, `{{key}}`)
  that are populated with runtime monitoring data. The `secure_popen()` function, which executes
  these commands, implements its own pipe, redirect, and chain operator handling by splitting
  the command string before passing each segment to `subprocess.Popen(shell=False)`. Prior to
  4.5.2, when a Mustache-rendered value (such as a process name, filesystem mount point, or
  container name) contains pipe, redirect, or chain metacharacters, the rendered command is
  split in unintended ways, allowing an attacker who controls a process name or container name
  to inject arbitrary commands. Version 4.5.2 fixes the issue.
