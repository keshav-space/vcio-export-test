summary: Unspecified vulnerability in the Zope Enterprise Objects (ZEO) storage-server functionality
  in Zope Object Database (ZODB) 3.8 before 3.8.3 and 3.9.x before 3.9.0c2, when certain ZEO
  database sharing and blob support are enabled, allows remote authenticated users to read or
  delete arbitrary files via unknown vectors.
