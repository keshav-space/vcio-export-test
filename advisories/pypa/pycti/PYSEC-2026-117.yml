aliases:
  - CVE-2026-21886
  - GHSA-mhmx-j75v-2m6x
  - PYSEC-2026-117
summary: OpenCTI is an open source platform for managing cyber threat intelligence knowledge
  and observables. Prior to version 6.9.1, the GraphQL mutations "IndividualDeletionDeleteMutation"
  is intended to allow users to delete individual entity objects respectively. However, it was
  observed that this mutation can be misused to delete unrelated and sensitive objects such
  as analyses reports etc. This behavior stems from the lack of validation in the API to ensure
  that the targeted object is contextually related to the mutation being executed. Version 6.9.1
  fixes the issue.
