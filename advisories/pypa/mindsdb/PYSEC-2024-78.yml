summary: An arbitrary code execution vulnerability exists in versions 23.12.4.0 up to 24.7.4.1
  of the MindsDB platform, when the ChromaDB integration is installed on the server. If a specially
  crafted ‘INSERT’ query containing Python code is run against a database created with the ChromaDB
  engine, the code will be passed to an eval function and executed on the server.
