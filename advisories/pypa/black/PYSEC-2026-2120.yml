summary: 'Black is the uncompromising Python code formatter. Black provides a GitHub action
  for formatting code. This action supports an option, use_pyproject: true, for reading the
  version of Black to use from the repository pyproject.toml. A malicious pull request could
  edit pyproject.toml to use a direct URL reference to a malicious repository. This could lead
  to arbitrary code execution in the context of the GitHub Action. Attackers could then gain
  access to secrets or permissions available in the context of the action. Version 26.3.0 fixes
  this vulnerability.'
