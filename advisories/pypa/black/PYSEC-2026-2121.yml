summary: Black is the uncompromising Python code formatter. Prior to 26.3.1, Black writes a
  cache file, the name of which is computed from various formatting options. The value of the
  --python-cell-magics option was placed in the filename without sanitization, which allowed
  an attacker who controls the value of this argument to write cache files to arbitrary file
  system locations. Fixed in Black 26.3.1.
