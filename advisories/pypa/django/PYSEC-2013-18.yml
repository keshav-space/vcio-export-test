summary: The authentication framework (django.contrib.auth) in Django 1.4.x before 1.4.8, 1.5.x
  before 1.5.4, and 1.6.x before 1.6 beta 4 allows remote attackers to cause a denial of service
  (CPU consumption) via a long password which is then hashed.
