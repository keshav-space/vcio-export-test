summary: CocoIndex is a data transformation framework for AI. Prior to version 0.3.34, the Doris
  target connector didn't verify the configured table name before creating some SQL statements
  (ALTER TABLE). So, in the application code, if the table name is provided by an untrusted
  upstream, it expose vulnerability to SQL injection when target schema change. This issue has
  been patched in version 0.3.34.
