summary: Open Neural Network Exchange (ONNX) is an open standard for machine learning interoperability.
  Prior to version 1.21.0, there is an issue in onnx.load, the code checks for symlinks to prevent
  path traversal, but completely misses hardlinks because a hardlink looks exactly like a regular
  file on the filesystem. This issue has been patched in version 1.21.0.
