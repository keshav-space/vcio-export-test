summary: Poetry is a dependency manager for Python. From version 1.4.0 to before version 2.3.3,
  a crafted wheel can contain ../ paths that Poetry writes to disk without containment checks,
  allowing arbitrary file write with the privileges of the Poetry process. It is reachable from
  untrusted package artifacts during normal install flows. (Normally, installing a malicious
  wheel is not sufficient for execution of malicious code. Malicious code will only be executed
  after installation if the malicious package is imported or invoked by the user.). This issue
  has been patched in version 2.3.3.
