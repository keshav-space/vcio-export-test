summary: "Use After Free vulnerability in Apache Arrow C++.\n\nThis issue affects Apache Arrow\
  \ C++ from 15.0.0 through 23.0.0. It can be triggered when reading an Arrow IPC file (but\
  \ not an IPC stream) with pre-buffering enabled, if the IPC file contains data with variadic\
  \ buffers (such as Binary View and String View data). Depending on the number of variadic\
  \ buffers in a record batch column and on the temporal sequence of multi-threaded IO, a write\
  \ to a dangling pointer could occur. The value (a `std::shared_ptr<Buffer>` object) that is\
  \ written to the dangling pointer is not under direct control of the attacker.\n\nPre-buffering\
  \ is disabled by default but can be enabled using a specific C++ API call (`RecordBatchFileReader::PreBufferMetadata`).\
  \ The functionality is not exposed in language bindings (Python, Ruby, C GLib), so these bindings\
  \ are not vulnerable.\n\nThe most likely consequence of this issue would be random crashes\
  \ or memory corruption when reading specific kinds of IPC files. If the application allows\
  \ ingesting IPC files from untrusted sources, this could plausibly be exploited for denial\
  \ of service. Inducing more targeted kinds of misbehavior (such as confidential data extraction\
  \ from the running process) depends on memory allocation and multi-threaded IO temporal patterns\
  \ that are unlikely to be easily controlled by an attacker.\n\nAdvice for users of Arrow C++:\n\
  \n1. check whether you enable pre-buffering on the IPC file reader (using `RecordBatchFileReader::PreBufferMetadata`)\n\
  \ \n2. if so, either disable pre-buffering (which may have adverse performance consequences),\
  \ or switch to Arrow 23.0.1 which is not vulnerable"
