summary: Deluge 1.3.15 contains a denial of service vulnerability that allows local attackers
  to crash the application by supplying an excessively long string in the URL field. Attackers
  can paste a buffer of 5000 characters into the 'From URL' field during torrent addition to
  trigger an application crash.
