summary: Internet Routing Registry daemon version 4 is an IRR database server, processing IRR
  objects in the RPSL format. From version 4.4.0 to before version 4.4.5 and from version 4.5.0
  to before version 4.5.1, an attacker can manipulate the HTTP Host header on a password reset
  or account creation request. The confirmation link in the resulting email can then point to
  an attacker-controlled domain. Opening the link in the email is sufficient to pass the token
  to the attacker, who can then use it on the real IRRD instance to take over the account. A
  compromised account can then be used to modify RPSL objects maintained by the account's mntners
  and perform other account actions. If the user had two-factor authentication configured, which
  is required for users with override access, an attacker is not able to log in, even after
  successfully resetting the password. This issue has been patched in versions 4.4.5 and 4.5.1.
