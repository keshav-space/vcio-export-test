summary: Cross-site scripting (XSS) vulnerability in util/templatetags/djblets_js.py in Djblets
  before 0.7.30 and 0.8.x before 0.8.3 for Django, as used in Review Board, allows remote attackers
  to inject arbitrary web script or HTML via a JSON object, as demonstrated by the name field
  when changing a user name.
