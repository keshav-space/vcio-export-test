advisory_id: langflow/PYSEC-2026-82
datasource_id: pypa/langflow/PYSEC-2026-82
datasource_url: https://github.com/pypa/advisory-database/blob/main/vulns/langflow/PYSEC-2026-82.yaml
aliases:
  - CVE-2026-33873
  - GHSA-v8hw-mh8c-jxfc
  - PYSEC-2026-82
summary: Langflow is a tool for building and deploying AI-powered agents and workflows. Prior
  to version 1.9.0, the Agentic Assistant feature in Langflow executes LLM-generated Python
  code during its validation phase. Although this phase appears intended to validate generated
  component code, the implementation reaches dynamic execution sinks and instantiates the generated
  class server-side. In deployments where an attacker can access the Agentic Assistant feature
  and influence the model output, this can result in arbitrary server-side Python execution.
  Version 1.9.0 fixes the issue.
