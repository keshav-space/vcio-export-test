summary: "Improper neutralization of argument delimiters in AWS Bedrock AgentCore Python SDK\
  \ install_packages()\n### Summary\nThe AWS Bedrock AgentCore Python SDK (bedrock-agentcore)\
  \ is an open-source SDK that enables developers to build, deploy, and manage agents on AWS\
  \ Bedrock AgentCore. An issue exists in the install_packages() method of the Code Interpreter\
  \ client where crafted package name arguments can bypass input validation and allow a remote\
  \ authenticated user to execute arbitrary commands within the Code Interpreter sandbox.\n\n\
  \n### Impact\nThe install_packages() method constructs a 'pip install' shell command executed\
  \ within the Code Interpreter sandbox using package name arguments provided by the caller.\
  \ The method applied an incomplete blocklist that allowed crafted package name arguments -\
  \ specifically pip flags such as '--index-url' and '-r' - to pass validation unchecked. A\
  \ remote authenticated user who can influence the arguments passed to install_packages() could\
  \ redirect package resolution to a third-party-controlled PyPI server, or expose the contents\
  \ of arbitrary sandbox files and environment variables.\n\n**Impacted versions:** AWS Bedrock\
  \ AgentCore Python SDK (bedrock-agentcore) versions >= 1.1.3 and < 1.6.1\n\n### Patches\n\
  This issue has been addressed in bedrock-agentcore version 1.6.1. We recommend upgrading to\
  \ the latest version and ensuring any forked or derivative code is patched to incorporate\
  \ the new fixes. \n\n### Workarounds\nIf you are unable to upgrade immediately, avoid passing\
  \ any user-supplied or externally-influenced strings directly to install_packages(). Restrict\
  \ calls to a fixed, hardcoded list of approved package names within your application code.\n\
  \n### References\nIf you have any questions or comments about this advisory, we ask that you\
  \ contact AWS Security via our [vulnerability reporting page](https://aws.amazon.com/security/vulnerability-reporting)\
  \ or directly via email to [aws-security@amazon.com](mailto:aws-security@amazon.com). Please\
  \ do not create a public GitHub issue.\n\n\nWe would like to thank Sergio Garcia for collaborating\
  \ on this issue through the coordinated vulnerability disclosure process."
