summary: UltraJSON is a fast JSON encoder and decoder written in pure C with bindings for Python
  3.7+. Versions 5.10 through 5.11.0 are vulnerable to buffer overflow or infinite loop through
  large indent handling. ujson.dumps() crashes the Python interpreter (segmentation fault) when
  the product of the indent parameter and the nested depth of the input exceeds INT32_MAX. It
  can also get stuck in an infinite loop if the indent is a large negative number. Both are
  caused by an integer overflow/underflow whilst calculating how much memory to reserve for
  indentation. And both can be used to achieve denial of service. To be vulnerable, a service
  must call ujson.dump()/ujson.dumps()/ujson.encode() whilst giving untrusted users control
  over the indent parameter and not restrict that indentation to reasonably small non-negative
  values. A service may also be vulnerable to the infinite loop if it uses a fixed negative
  indent. An underflow always occurs for any negative indent when the input data is at least
  one level nested but, for small negative indents, the underflow is usually accidentally rectified
  by another overflow. This issue has been fixed in version 5.12.0.
