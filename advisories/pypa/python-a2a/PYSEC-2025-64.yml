summary: A vulnerability classified as critical has been found in themanojdesai python-a2a up
  to 0.5.5. Affected is the function create_workflow of the file python_a2a/agent_flow/server/api.py.
  The manipulation leads to path traversal. Upgrading to version 0.5.6 is able to address this
  issue. It is recommended to upgrade the affected component.
