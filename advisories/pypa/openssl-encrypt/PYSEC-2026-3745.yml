summary: openssl_encrypt before 1.4.0 imports Python's non-cryptographic 'random' module (Mersenne
  Twister PRNG) at line 15 of openssl_encrypt/modules/pqc.py. No direct calls to random.* were
  present in the code, so no cryptographic operation is currently affected; however, the import
  creates a hazard that future code could inadvertently use random.randint() instead of a cryptographically
  secure alternative (secrets/os.urandom), producing predictable values since the Mersenne Twister
  state can be recovered from approximately 624 outputs. Fixed by removing the import in 1.4.0.
