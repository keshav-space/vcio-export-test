summary: 'ormar is a async mini ORM for Python. Versions 0.23.0 and below are vulnerable to
  Pydantic validation bypass through the model constructor, allowing any unauthenticated user
  to skip all field validation by injecting "__pk_only__": true into a JSON request body. By
  injecting "__pk_only__": true into a JSON request body, an unauthenticated attacker can skip
  all field validation and persist unvalidated data directly to the database. A secondary __excluded__
  parameter injection uses the same pattern to selectively nullify arbitrary model fields (e.g.,
  email or role) during construction. This affects ormar''s canonical FastAPI integration pattern
  recommended in its official documentation, enabling privilege escalation, data integrity violations,
  and business logic bypass in any application using ormar.Model directly as a request body
  parameter. This issue has been fixed in version 0.23.1.'
