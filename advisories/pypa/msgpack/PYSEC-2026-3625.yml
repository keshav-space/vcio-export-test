summary: MessagePack is the serializer implementation for Python msgpack.org. Prior to 1.2.1,
  there is an Out-of-bounds read/crash on Unpacker reuse after a caught error, potentially leading
  to a DoS attack.  If the Unpacker is used repeatedly after an error occurs, the process may
  crash with a SEGV. This issue has been fixed in version 1.2.1.
