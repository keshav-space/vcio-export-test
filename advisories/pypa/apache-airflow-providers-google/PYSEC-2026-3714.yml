advisory_id: apache-airflow-providers-google/PYSEC-2026-3714
datasource_id: pypa/apache-airflow-providers-google/PYSEC-2026-3714
datasource_url: https://github.com/pypa/advisory-database/blob/main/vulns/apache-airflow-providers-google/PYSEC-2026-3714.yaml
aliases:
  - CVE-2026-68868
  - PYSEC-2026-3714
summary: 'The Google Cloud Secret Manager secrets backend in Apache Airflow''s Google provider
  never applied the team scope when resolving Connections and Variables: the caller''s `team_name`
  was accepted by the backend but dropped at the internal call boundary, so every lookup resolved
  against the team-agnostic secret name. In a deployment running multi-team mode with this backend,
  a task or Dag belonging to one team resolved another team''s Connection or Variable, obtaining
  its credentials in full. No unusual configuration is required beyond enabling multi-team mode
  and using this backend. Users are advised to upgrade to apache-airflow-providers-google 22.3.0
  or later, which builds and applies the team-scoped secret name.'
