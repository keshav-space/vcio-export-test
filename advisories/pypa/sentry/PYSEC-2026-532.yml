summary: "Sentry's improper authentication on SAML SSO process allows user impersonation\n###\
  \ Impact\nA critical vulnerability was discovered in the SAML SSO implementation of Sentry.\
  \ It was reported to us via our private bug bounty program.\n\nThe vulnerability allows an\
  \ attacker to take over any user account by using a malicious SAML Identity Provider and another\
  \ organization on the same Sentry instance. The victim email address must be known in order\
  \ to exploit this vulnerability.\n\n### Patches\n- [Sentry SaaS](https://sentry.io): The fix\
  \ was deployed on Jan 14, 2025.\n- [Self-Hosted Sentry](https://github.com/getsentry/self-hosted):\
  \ If only a single organization is allowed (`SENTRY_SINGLE_ORGANIZATION = True`), then no\
  \ action is needed. Otherwise, users should upgrade to version 25.1.0 or higher.\n\n### Workarounds\n\
  No known workarounds.\n \n### References\n- https://github.com/getsentry/sentry/pull/83407"
