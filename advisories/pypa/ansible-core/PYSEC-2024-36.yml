summary: An information disclosure flaw was found in ansible-core due to a failure to respect
  the ANSIBLE_NO_LOG configuration in some scenarios. It was discovered that information is
  still included in the output in certain tasks, such as loop items. Depending on the task,
  this issue may include sensitive information, such as decrypted secret values.
