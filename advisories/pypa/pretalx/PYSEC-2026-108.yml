summary: pretalx is a conference planning tool. Prior to 2026.1.0, The organiser search in the
  pretalx backend rendered submission titles, speaker display names, and user names/emails into
  the result dropdown using innerHTML string interpolation. Any user who controls one of those
  fields (which includes any registered user whose display name is looked up by an administrator)
  could include HTML or JavaScript that would execute in an organiser's browser when the organiser's
  search query matched the malicious record. This vulnerability is fixed in 2026.1.0.
