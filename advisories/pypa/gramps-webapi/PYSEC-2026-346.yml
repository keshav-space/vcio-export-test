summary: "gramps-webapi: Zip Slip Path Traversal in Media Archive Import\n## Summary\n\nA path\
  \ traversal vulnerability (Zip Slip) exists in the media archive import feature. An authenticated\
  \ user with owner-level privileges can craft a malicious ZIP file with directory-traversal\
  \ filenames to write arbitrary files outside the intended temporary extraction directory on\
  \ the server's local filesystem.\n \n## Details\n\nWhen importing media archives as ZIP file,\
  \ `MediaImporter._check_disk_space_and_extract()` in `gramps_webapi/api/media_importer.py`\
  \ called `zipfile.extractall()` without validating ZIP entry names. Python's `zipfile` module\
  \ does not sanitize entry names containing `../` sequences, allowing extraction to paths outside\
  \ the target directory.\n\n Only users with **owner permission** can upload media ZIP archives,\
  \ so the biggest risk is for multi-tree deployments, where tree owners are distinct from server\
  \ administrators.\n \nFor multi-tree deployments, the impact depends on deployment configuration.\
  \ Assuming the standard docker-based deployment is used:\n\n- **SQLite family tree + local\
  \ media**: An attacker can overwrite another tree's database file or media files, leading\
  \ to cross-tree data corruption or replacement.\n- **Postgres family tree + S3 media**: No\
  \ persistent tree data is stored on the local filesystem,  so cross-tree impact is eliminated.\
  \ The remaining risk is overwriting volume-mounted files such as the application config file.\n\
  - **Postgres family tree + S3 media + environment-variable-only config**: No persistent files\
  \ of  value are present on the local filesystem. Impact is limited to writes to ephemeral\
  \ container storage, which are lost on woker restart.\n \n## Fix\n\nZIP entry names are now\
  \ validated against the resolved real path of the temporary directory before extraction. Any\
  \ entry whose resolved path falls outside the temporary directory raises an error and aborts\
  \ the import."
