summary: cryptography is a package designed to expose cryptographic primitives and recipes to
  Python developers. Prior to version 46.0.6, DNS name constraints were only validated against
  SANs within child certificates, and not the "peer name" presented during each validation.
  Consequently, cryptography would allow a peer named bar.example.com to validate against a
  wildcard leaf certificate for *.example.com, even if the leaf's parent certificate (or upwards)
  contained an excluded subtree constraint for bar.example.com. This issue has been patched
  in version 46.0.6.
