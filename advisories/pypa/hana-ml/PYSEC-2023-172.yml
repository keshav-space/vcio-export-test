summary: The Create Single Payment application of SAP S/4HANA - versions 100, 101, 102, 103,
  104, 105, 106, 107, 108, allows an attacker to upload the XML file as an attachment. When
  clicked on the XML file in the attachment section, the file gets opened in the browser to
  cause the entity loops to slow down the browser.
