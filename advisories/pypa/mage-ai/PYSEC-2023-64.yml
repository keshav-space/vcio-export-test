summary: mage-ai is an open-source data pipeline tool for transforming and integrating data.
  Those who use Mage starting in version 0.8.34 and prior to 0.8.72 with user authentication
  enabled may be affected by a vulnerability. The terminal could be accessed by users who are
  not signed in or do not have editor permissions. Version 0.8.72 contains a fix for this issue.
