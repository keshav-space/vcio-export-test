summary: A flaw has been found in Mayan EDMS up to 4.10.1. The impacted element is an unknown
  function of the file /authentication/. This manipulation causes open redirect. It is possible
  to initiate the attack remotely. The exploit has been published and may be used. Upgrading
  to version 4.10.2 is sufficient to resolve this issue. The affected component should be upgraded.
  The vendor confirms that this is "[f]ixed in version 4.10.2". Furthermore, that "[b]ackports
  for older versions in process and will be out as soon as their respective CI pipelines complete."
