summary: Taipy is an open-source Python library for easy, end-to-end application development
  for data scientists and machine learning engineers. In affected versions session cookies are
  served without Secure and HTTPOnly flags. This issue has been addressed in release version
  4.0.0 and all users are advised to upgrade. There are no known workarounds for this vulnerability.
