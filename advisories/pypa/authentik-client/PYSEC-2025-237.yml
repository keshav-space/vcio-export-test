summary: authentik is an open-source Identity Provider. Prior to versions 2025.8.5 and 2025.10.2,
  when authenticating with client_id and client_secret to an OAuth provider, authentik creates
  a service account for the provider. In previous authentik versions, authentication for this
  account was possible even when the account was deactivated. Other permissions are correctly
  applied and federation with other providers still take assigned policies correctly into account.
  authentik versions 2025.8.5 and 2025.10.2 fix this issue. A workaround involves adding a policy
  to the application that explicitly checks if the service account is still valid, and deny
  access if not.
