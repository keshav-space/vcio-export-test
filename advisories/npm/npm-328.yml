summary: "Cross-Site Scripting (XSS)\nJquery is a javascript library for DOM traversal and manipulation,\
  \ event handling, animation, and Ajax. \n\nWhen text/javascript responses are received from\
  \ cross-origin ajax requests not containing the option `dataType`, the result is executed\
  \ in `jQuery.globalEval` potentially allowing an attacker to execute arbitrary code on the\
  \ origin."
