aliases:
  - CVE-2015-7294
summary: "LDAP Injection\nldapauth-fork is a module forked from node-ldapauth and is used for\
  \ ldap authentication  \nThe username parameter is not filtered as per [LDAP Escape Specifications](https://tools.ietf.org/search/rfc4515#section-3)\
  \  \nA malicious user is able to change their name to certain LDAP commands and run anything\
  \ that they want."
