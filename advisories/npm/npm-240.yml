aliases: []
summary: |
  Downloads Resources over HTTP
  baryton-saxophone is a module to install and launch Selenium Server for Mac, Linux and Windows.

  baryton-saxophone versions below 3.0.1 download binary resources over HTTP, which leaves it vulnerable to MITM attacks.  It may be possible to cause remote code execution (RCE) by swapping out the requested binary with an attacker controlled binary if the attacker is on the network or positioned in between the user and the remote server.
impacted_packages:
  - purl: pkg:npm/baryton-saxophone
    affected_versions: vers:npm/<3.0.1
    fixed_versions: vers:npm/>=3.0.1
    affected_packages:
      - pkg:npm/baryton-saxophone@2.48.2
      - pkg:npm/baryton-saxophone@2.50.1
