aliases: []
summary: "Directory Traversal\nhostr is a simple web server that serves up the contents of the\
  \ current directory.  \nThere is a directory traversal vulnerability in hostr that allows\
  \ an attacker to read files outside the current directory by sending `../` in the url path\
  \ for GET requests."
