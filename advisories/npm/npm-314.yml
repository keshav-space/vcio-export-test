aliases: []
summary: |
  Cross-Site Scripting (XSS)
  Restify is a framework for building REST APIs.

  Using URL encoded script tags in a non-existent URL, an attacker can get script to run in some browsers.

  For example, for the URL `https://localhost:3000/no5_such3_file7.pl?%22%3E%3Cscript%3Ealert(73541);%3C/script%3E` restify will return `<script>alert(73541);</script>` as part of the response, and in some browsers will run.
